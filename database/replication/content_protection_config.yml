# Content Protection Replication Configuration
# IA Influencer Agent + Content Protection Platform
# Specialized configuration for content creator protection worldwide

# Global settings
global:
  platform_name: "IA Influencer Agent"
  version: "2.0.0"
  environment: production
  deployment_region: eu-west-1
  content_protection_enabled: true
  
# Content protection specific settings
content_protection:
  # Real-time replication settings
  real_time_replication:
    enabled: true
    sync_interval_seconds: 5
    batch_size: 100
    max_lag_tolerance_ms: 500
    priority_queue_enabled: true
    
  # Content types and protection levels
  content_types:
    audio:
      fingerprint_algorithm: "chromaprint_v2"
      vector_dimensions: 512
      similarity_threshold: 0.85
      protection_duration_days: 365
    video:
      fingerprint_algorithm: "perceptual_hash_v3"
      vector_dimensions: 1024
      similarity_threshold: 0.80
      protection_duration_days: 365
    image:
      fingerprint_algorithm: "phash_dct"
      vector_dimensions: 256
      similarity_threshold: 0.90
      protection_duration_days: 180
    text:
      fingerprint_algorithm: "semantic_hash"
      vector_dimensions: 768
      similarity_threshold: 0.75
      protection_duration_days: 90
  
  # Protection levels for different user tiers
  protection_levels:
    basic:
      max_content_items: 100
      regions_covered: ["eu-west-1"]
      violation_check_frequency: daily
      automated_takedown: false
      response_time_hours: 24
    standard:
      max_content_items: 1000
      regions_covered: ["eu-west-1", "us-east-1"]
      violation_check_frequency: hourly
      automated_takedown: false
      response_time_hours: 12
    premium:
      max_content_items: 10000
      regions_covered: ["eu-west-1", "us-east-1", "ap-southeast-1"]
      violation_check_frequency: "15_minutes"
      automated_takedown: true
      response_time_hours: 2
    enterprise:
      max_content_items: unlimited
      regions_covered: ["global"]
      violation_check_frequency: real_time
      automated_takedown: true
      response_time_hours: 1
      dedicated_support: true
      priority_replication: true

# Regional configuration
regions:
  eu-west-1:
    primary: true
    datacenter: "Frankfurt, Germany"
    compliance: ["GDPR", "DSA"]
    databases:
      redis:
        cluster_mode: true
        nodes: 6
        memory_per_node: "16GB"
      mongodb:
        replica_set: "rs-eu-west"
        nodes: 5
        storage_per_node: "1TB"
      elasticsearch:
        cluster_name: "protection-eu-west"
        nodes: 3
        storage_per_node: "500GB"
  
  us-east-1:
    primary: false
    datacenter: "Virginia, USA"
    compliance: ["CCPA", "DMCA"]
    databases:
      redis:
        cluster_mode: true
        nodes: 6
        memory_per_node: "16GB"
      mongodb:
        replica_set: "rs-us-east"
        nodes: 5
        storage_per_node: "1TB"
      elasticsearch:
        cluster_name: "protection-us-east"
        nodes: 3
        storage_per_node: "500GB"
  
  ap-southeast-1:
    primary: false
    datacenter: "Singapore"
    compliance: ["PDPA"]
    databases:
      redis:
        cluster_mode: true
        nodes: 4
        memory_per_node: "12GB"
      mongodb:
        replica_set: "rs-ap-southeast"
        nodes: 3
        storage_per_node: "500GB"
      elasticsearch:
        cluster_name: "protection-ap-southeast"
        nodes: 2
        storage_per_node: "300GB"

# Platform-specific violation detection
platforms:
  youtube:
    enabled: true
    api_quota_limit: 10000
    scan_frequency: "5_minutes"
    takedown_api: "youtube_content_id"
    revenue_sharing_enabled: true
  
  instagram:
    enabled: true
    api_quota_limit: 5000
    scan_frequency: "10_minutes"
    takedown_api: "instagram_copyright"
    revenue_sharing_enabled: false
  
  tiktok:
    enabled: true
    api_quota_limit: 3000
    scan_frequency: "15_minutes"
    takedown_api: "tiktok_copyright"
    revenue_sharing_enabled: false
  
  facebook:
    enabled: true
    api_quota_limit: 8000
    scan_frequency: "10_minutes"
    takedown_api: "facebook_rights_manager"
    revenue_sharing_enabled: true
  
  twitter:
    enabled: true
    api_quota_limit: 2000
    scan_frequency: "30_minutes"
    takedown_api: "twitter_dmca"
    revenue_sharing_enabled: false
  
  spotify:
    enabled: true
    api_quota_limit: 1000
    scan_frequency: "1_hour"
    takedown_api: "spotify_takedown"
    revenue_sharing_enabled: true
  
  soundcloud:
    enabled: true
    api_quota_limit: 500
    scan_frequency: "2_hours"
    takedown_api: "soundcloud_copyright"
    revenue_sharing_enabled: false

# Revenue tracking configuration
revenue_tracking:
  enabled: true
  currencies_supported:
    - EUR
    - USD
    - GBP
    - JPY
    - CAD
    - AUD
  
  # Platform revenue sharing rates
  platform_rates:
    youtube: 0.55  # YouTube keeps 45%, creator gets 55%
    spotify: 0.003  # Per stream rate
    instagram: 0.0  # No direct revenue sharing
    facebook: 0.45
    patreon: 0.92   # Patreon takes 8%
    bandcamp: 0.85  # Bandcamp takes 15%
  
  # Payment processing
  payment_processing:
    minimum_payout: 25.00
    currency: EUR
    frequency: monthly
    processing_fee: 0.029  # 2.9%
    bank_transfer_fee: 0.50

# AI and ML configuration
ai_ml:
  # Content fingerprinting
  fingerprinting:
    models:
      audio_model: "chromaprint_neural_v2.1"
      video_model: "perceptual_transformer_v1.3"
      image_model: "siamese_cnn_v2.0"
      text_model: "sentence_transformers_v4.2"
    
    # Vector database settings
    vector_storage:
      provider: "faiss"
      index_type: "IVFFlat"
      dimension: 512
      nlist: 1024
      nprobe: 32
      metric: "cosine"
      backup_frequency: "6_hours"
  
  # Violation detection AI
  violation_detection:
    models:
      similarity_model: "deep_siamese_v3.1"
      false_positive_filter: "gradient_boost_v2.0"
      priority_classifier: "transformer_bert_v1.5"
    
    thresholds:
      audio_similarity: 0.85
      video_similarity: 0.80
      image_similarity: 0.90
      text_similarity: 0.75
      false_positive_threshold: 0.95

# Monitoring and alerting
monitoring:
  # Metrics collection
  metrics:
    collection_interval: 10  # seconds
    retention_days: 90
    aggregation_levels: ["1m", "5m", "1h", "1d"]
  
  # Alert thresholds
  alerts:
    replication_lag_ms: 1000
    violation_detection_rate: 100  # violations per hour
    false_positive_rate: 0.05  # 5%
    system_health_score: 80
    api_error_rate: 0.01  # 1%
  
  # Notification channels
  notifications:
    email:
      enabled: true
      smtp_host: "smtp.eu-west-1.amazonaws.com"
      from_address: "alerts@ia-influencer.com"
    slack:
      enabled: true
      webhook_url: "${SLACK_WEBHOOK_URL}"
      channel: "#content-protection-alerts"
    pagerduty:
      enabled: true
      service_key: "${PAGERDUTY_SERVICE_KEY}"

# Security and compliance
security:
  # Data encryption
  encryption:
    at_rest: true
    in_transit: true
    algorithm: "AES-256-GCM"
    key_rotation_days: 90
  
  # Access control
  access_control:
    rbac_enabled: true
    mfa_required: true
    session_timeout_minutes: 120
    api_rate_limiting: true
  
  # Audit logging
  audit:
    enabled: true
    log_all_access: true
    retention_years: 7
    immutable_logs: true

# Legal and compliance
legal:
  # Copyright compliance
  copyright:
    dmca_compliance: true
    eu_copyright_directive: true
    automated_takedown: true
    counter_notice_support: true
  
  # Data protection
  data_protection:
    gdpr_compliance: true
    ccpa_compliance: true
    data_retention_days: 730  # 2 years
    right_to_deletion: true
    data_portability: true
  
  # Geographic restrictions
  geographic_restrictions:
    blocked_countries: []
    restricted_features: {}
    compliance_regions:
      - EU
      - US
      - APAC

# Performance optimization
performance:
  # Database optimization
  database:
    connection_pools:
      redis: 50
      mongodb: 25
      elasticsearch: 15
    query_optimization: true
    index_optimization: true
  
  # Caching strategy
  caching:
    fingerprint_cache_ttl: 3600  # 1 hour
    violation_cache_ttl: 300    # 5 minutes
    user_data_cache_ttl: 1800   # 30 minutes
    redis_memory_policy: "allkeys-lru"
  
  # Network optimization
  network:
    cdn_enabled: true
    compression_enabled: true
    keep_alive_timeout: 75
    max_concurrent_connections: 1000

# Business logic
business:
  # Content creator tiers
  creator_tiers:
    free:
      monthly_uploads: 10
      storage_gb: 1
      protection_level: basic
      analytics: basic
    pro:
      monthly_uploads: 100
      storage_gb: 50
      protection_level: standard
      analytics: advanced
      price_eur: 19.99
    enterprise:
      monthly_uploads: unlimited
      storage_gb: unlimited
      protection_level: enterprise
      analytics: premium
      price_eur: 199.99
      dedicated_support: true
  
  # Revenue distribution
  revenue_distribution:
    platform_fee: 0.15  # 15% platform fee
    processing_fee: 0.029  # 2.9% payment processing
    creator_share: 0.821  # 82.1% to creator after fees
  
  # Partnership programs
  partnerships:
    influencer_program:
      minimum_followers: 10000
      revenue_bonus: 0.05  # Additional 5%
    verified_creator:
      verification_required: true
      priority_support: true
      reduced_fees: 0.10  # 10% fee reduction
