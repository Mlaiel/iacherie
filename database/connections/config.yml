# Database Connections Configuration - IA Influencer Agent Platform
# Configuration for all database connections supporting content creators,
# AI processing, content protection, and monetization systems.
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

# Environment configuration
environment: development  # development, staging, production

# Global settings
global:
  encryption:
    enabled: true
    algorithm: "AES-256-GCM"
    key_rotation_days: 90
  
  monitoring:
    health_check_interval: 30
    metrics_collection: true
    alert_thresholds:
      connection_errors: 5
      response_time_ms: 2000
      cpu_usage_percent: 80
      memory_usage_percent: 85
  
  logging:
    level: INFO
    format: "json"
    include_sql_queries: false
    include_performance_metrics: true

# PostgreSQL Configuration (Primary Database)
postgresql:
  enabled: true
  host: "${DB_HOST:localhost}"
  port: "${DB_PORT:5432}"
  database: "${DB_NAME:ia_influencer}"
  username: "${DB_USER:postgres}"
  password: "${DB_PASSWORD:}"
  
  ssl:
    enabled: true
    mode: "require"
    cert_file: "/etc/ssl/certs/postgresql.crt"
    key_file: "/etc/ssl/private/postgresql.key"
  
  connection_pool:
    min_size: 10
    max_size: 50
    timeout: 30
    max_overflow: 20
    pool_recycle: 3600
    pool_pre_ping: true
  
  performance:
    command_timeout: 60
    query_timeout: 30
    bulk_insert_batch_size: 1000
    connection_retry_attempts: 3
    connection_retry_delay: 1.0
  
  tenant_isolation:
    enabled: true
    schema_prefix: "tenant_"
    auto_create_schemas: true
    enforce_row_level_security: true

# Redis Configuration (Caching & Sessions)
redis:
  enabled: true
  host: "${REDIS_HOST:localhost}"
  port: "${REDIS_PORT:6379}"
  password: "${REDIS_PASSWORD:}"
  database: "${REDIS_DB:0}"
  
  ssl:
    enabled: false
    cert_file: "/etc/ssl/certs/redis.crt"
    key_file: "/etc/ssl/private/redis.key"
  
  connection_pool:
    max_connections: 100
    socket_timeout: 30
    socket_connect_timeout: 30
    retry_on_timeout: true
    health_check_interval: 30
  
  clustering:
    enabled: false
    nodes: []
    # Example cluster nodes:
    # - "redis-node1:7000"
    # - "redis-node2:7000"
    # - "redis-node3:7000"
  
  sentinel:
    enabled: false
    service_name: "mymaster"
    hosts: []
    # Example sentinel hosts:
    # - "sentinel1:26379"
    # - "sentinel2:26379"
  
  tenant_isolation:
    enabled: true
    key_prefix: "tenant_{tenant_id}:"
    namespace_separator: ":"

# MongoDB Configuration (Content Metadata)
mongodb:
  enabled: true
  host: "${MONGO_HOST:localhost}"
  port: "${MONGO_PORT:27017}"
  database: "${MONGO_DB:ia_influencer_content}"
  username: "${MONGO_USER:}"
  password: "${MONGO_PASSWORD:}"
  
  ssl:
    enabled: false
    cert_file: "/etc/ssl/certs/mongodb.crt"
    key_file: "/etc/ssl/private/mongodb.key"
  
  connection_pool:
    min_pool_size: 5
    max_pool_size: 25
    max_idle_time_ms: 30000
    server_selection_timeout_ms: 5000
    connect_timeout_ms: 10000
  
  replica_set:
    enabled: false
    name: "rs0"
    hosts: []
    # Example replica set hosts:
    # - "mongo1:27017"
    # - "mongo2:27017"
    # - "mongo3:27017"
  
  tenant_isolation:
    enabled: true
    database_prefix: "tenant_"
    collection_prefix: "tenant_{tenant_id}_"

# Elasticsearch Configuration (Search & Analytics)
elasticsearch:
  enabled: true
  hosts:
    - "${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}"
  
  authentication:
    username: "${ELASTICSEARCH_USER:}"
    password: "${ELASTICSEARCH_PASSWORD:}"
    api_key: "${ELASTICSEARCH_API_KEY:}"
  
  ssl:
    enabled: false
    verify_certs: true
    cert_file: "/etc/ssl/certs/elasticsearch.crt"
    key_file: "/etc/ssl/private/elasticsearch.key"
  
  connection_pool:
    timeout: 30
    max_retries: 3
    retry_on_timeout: true
    max_connections: 25
  
  indexing:
    default_shards: 3
    default_replicas: 1
    refresh_interval: "1s"
    max_result_window: 10000
  
  tenant_isolation:
    enabled: true
    index_prefix: "tenant_{tenant_id}_"
    alias_pattern: "tenant_{tenant_id}_*"

# Vector Store Configuration (FAISS/Pinecone)
vector_store:
  provider: "faiss"  # faiss, pinecone, hnswlib
  
  faiss:
    dimension: 512
    index_type: "IndexHNSWFlat"  # IndexFlatL2, IndexIVFFlat, IndexHNSWFlat
    storage_path: "/data/vector_indexes/faiss"
    metric: "cosine"  # cosine, euclidean, manhattan
    
    hnsw_parameters:
      m: 16
      ef_construction: 200
      ef_search: 100
    
    ivf_parameters:
      nlist: 100
      nprobe: 10
  
  pinecone:
    api_key: "${PINECONE_API_KEY:}"
    environment: "${PINECONE_ENVIRONMENT:us-west1-gcp}"
    index_name: "ia-influencer-content"
    dimension: 512
    metric: "cosine"
    pod_type: "p1.x1"
    pods: 1
    replicas: 1
  
  hnswlib:
    dimension: 512
    max_elements: 1000000
    ef_construction: 200
    m: 16
    storage_path: "/data/vector_indexes/hnswlib"
    metric: "cosine"
  
  tenant_isolation:
    enabled: true
    namespace_prefix: "tenant_{tenant_id}_"

# Object Storage Configuration (S3/MinIO)
object_storage:
  provider: "minio"  # s3, minio, gcs, azure
  
  s3:
    region: "${AWS_REGION:us-west-2}"
    bucket: "${S3_BUCKET:ia-influencer-content}"
    access_key: "${AWS_ACCESS_KEY_ID:}"
    secret_key: "${AWS_SECRET_ACCESS_KEY:}"
    endpoint_url: "${S3_ENDPOINT_URL:}"
    
    ssl:
      enabled: true
      verify: true
    
    multipart:
      threshold: 64MB
      chunksize: 16MB
      max_concurrency: 10
  
  minio:
    endpoint: "${MINIO_ENDPOINT:localhost:9000}"
    access_key: "${MINIO_ACCESS_KEY:minio}"
    secret_key: "${MINIO_SECRET_KEY:minio123}"
    bucket: "${MINIO_BUCKET:ia-influencer-content}"
    secure: false
    region: "us-east-1"
  
  tenant_isolation:
    enabled: true
    prefix: "tenant/{tenant_id}/"
    
  content_types:
    audio: ["mp3", "wav", "flac", "aac", "ogg"]
    video: ["mp4", "avi", "mov", "mkv", "webm"]
    image: ["jpg", "jpeg", "png", "gif", "webp", "bmp"]
    document: ["pdf", "doc", "docx", "txt"]

# Content Protection Database Settings
content_protection:
  fingerprint_storage:
    postgresql_table: "content_fingerprints"
    vector_namespace: "fingerprints"
    object_storage_prefix: "fingerprints/"
    cache_ttl_seconds: 86400
  
  alert_storage:
    postgresql_table: "protection_alerts"
    elasticsearch_index: "protection_alerts"
    cache_ttl_seconds: 3600
  
  evidence_storage:
    object_storage_prefix: "evidence/"
    mongodb_collection: "alert_evidence"
    retention_days: 365
  
  monitoring:
    similarity_threshold: 0.85
    alert_priorities:
      critical: 0.95
      high: 0.90
      medium: 0.80
      low: 0.70

# Monetization Database Settings
monetization:
  revenue_tracking:
    postgresql_table: "revenue_records"
    elasticsearch_index: "revenue_analytics"
    time_series_retention_days: 1095  # 3 years
  
  payout_processing:
    postgresql_table: "payout_requests"
    queue_name: "payout_processing"
    batch_size: 100
    processing_delay_hours: 24
  
  licensing:
    postgresql_table: "license_agreements"
    mongodb_collection: "license_terms"
    contract_storage_prefix: "contracts/"
  
  commission_rates:
    default_service_fee: 0.05  # 5%
    payment_processing_fees:
      stripe: 0.029  # 2.9% + $0.30
      paypal: 0.034  # 3.4%
      wise: 0.010    # 1.0%
      bank_transfer: 5.00  # Fixed $5
      crypto: 0.005  # 0.5%

# Multi-Tenant Configuration
multi_tenant:
  isolation_level: "schema"  # schema, database, prefix
  
  tenant_types:
    individual_artist:
      max_connections: 10
      storage_quota_gb: 100
      api_rate_limit: 1000
    
    music_label:
      max_connections: 50
      storage_quota_gb: 1000
      api_rate_limit: 10000
    
    content_agency:
      max_connections: 100
      storage_quota_gb: 5000
      api_rate_limit: 50000
    
    enterprise:
      max_connections: 200
      storage_quota_gb: 10000
      api_rate_limit: 100000
  
  collaboration:
    enabled: true
    max_collaborators: 10
    shared_namespace_prefix: "collab_{collaboration_id}_"
    permission_levels: ["read", "write", "admin"]

# High Availability Configuration
high_availability:
  enabled: true
  
  failover:
    enabled: true
    health_check_interval: 10
    failure_threshold: 3
    recovery_timeout: 300
  
  load_balancing:
    enabled: true
    algorithm: "round_robin"  # round_robin, least_connections, weighted
    health_check_path: "/health"
  
  backup:
    enabled: true
    postgresql:
      schedule: "0 2 * * *"  # Daily at 2 AM
      retention_days: 30
      compression: true
    
    mongodb:
      schedule: "0 3 * * *"  # Daily at 3 AM
      retention_days: 30
      compression: true
    
    object_storage:
      cross_region_replication: true
      versioning: true
      lifecycle_policies: true

# Security Configuration
security:
  encryption:
    at_rest: true
    in_transit: true
    key_management: "vault"  # vault, env, file
  
  access_control:
    rbac_enabled: true
    ip_whitelist: []
    api_rate_limiting: true
    session_timeout: 3600
  
  audit:
    enabled: true
    log_all_queries: false
    log_data_changes: true
    log_access_attempts: true
    retention_days: 365

# Performance Optimization
performance:
  query_optimization:
    enabled: true
    explain_analyze: false
    slow_query_threshold: 1000  # milliseconds
    index_recommendations: true
  
  caching:
    enabled: true
    default_ttl: 3600
    max_memory_mb: 1024
    eviction_policy: "lru"
  
  connection_pooling:
    enabled: true
    pool_optimization: true
    connection_warming: true
    idle_timeout: 300

# Development/Testing Configuration
development:
  debug_mode: true
  sql_echo: false
  mock_external_apis: false
  test_data_seeding: true
  
  test_databases:
    postgresql: "ia_influencer_test"
    mongodb: "ia_influencer_content_test"
    redis: 1
    elasticsearch_suffix: "_test"
