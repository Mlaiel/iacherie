# =============================================================================
# POSTGRESQL HOST-BASED AUTHENTICATION (HBA) CONFIGURATION - PRODUCTION
# =============================================================================
# Production-ready authentication configuration for Ainflue Platform
# MANDATORY SSL/TLS for all connections except local Unix sockets
#
# Author: Fahed Mlaiel (mlaiel@live.de)
# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.
# =============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# IPv4 local connections with MANDATORY SSL
hostssl ainflue_production  ainflue_app     127.0.0.1/32        scram-sha-256
hostssl ainflue_production  ainflue_read    127.0.0.1/32        scram-sha-256
hostssl ainflue_production  backup_user     127.0.0.1/32        scram-sha-256
hostssl ainflue_production  monitoring      127.0.0.1/32        scram-sha-256

# IPv6 local connections with MANDATORY SSL
hostssl ainflue_production  ainflue_app     ::1/128             scram-sha-256
hostssl ainflue_production  ainflue_read    ::1/128             scram-sha-256
hostssl ainflue_production  backup_user     ::1/128             scram-sha-256
hostssl ainflue_production  monitoring      ::1/128             scram-sha-256

# Replication connections with MANDATORY SSL
hostssl replication     replicator      127.0.0.1/32            scram-sha-256
hostssl replication     replicator      ::1/128                 scram-sha-256

# Production network connections with MANDATORY SSL
# Application servers
hostssl ainflue_production  ainflue_app     10.0.0.0/8          scram-sha-256
hostssl ainflue_production  ainflue_read    10.0.0.0/8          scram-sha-256

# Docker/Kubernetes internal networks
hostssl ainflue_production  ainflue_app     172.16.0.0/12       scram-sha-256
hostssl ainflue_production  ainflue_read    172.16.0.0/12       scram-sha-256

# Monitoring and backup networks
hostssl ainflue_production  monitoring      10.0.0.0/8          scram-sha-256
hostssl ainflue_production  backup_user     10.0.0.0/8          scram-sha-256

# Replication network (for read replicas)
hostssl replication     replicator      10.0.0.0/8             scram-sha-256
hostssl replication     replicator      172.16.0.0/12          scram-sha-256

# Explicitly reject non-SSL connections
host    all             all             all                     reject

# Deny all other patterns
hostnossl all           all             all                     reject