# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     peer

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256

# Allow replication connections from localhost, by a user with the
# replication privilege.
local   replication     all                                     peer
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256

# Docker network connections
host    all             all             172.0.0.0/8             scram-sha-256

# Application connections from Docker containers
host    ainflue_platform    ainflue         172.22.0.0/24           scram-sha-256

# Replication connections for master-slave setup
host    replication     replicator      172.22.0.0/24           scram-sha-256

# Monitoring connections
host    all             monitoring      172.24.0.0/24           scram-sha-256

# Backup connections
host    all             backup          172.22.0.0/24           scram-sha-256

# Deny all other connections
host    all             all             all                     reject