# WARNING: This configuration contains sensitive settings. Protect accordingly.

# Module Information
module:
  name: "Advanced Payment Processing Module"
  version: "2.0.0"
  author: "Fahed Mlaiel"
  email: "mlaiel@live.de"
  license: "Proprietary - All Rights Reserved"
  environment: "production"

# Database Configuration
database:
  # Primary database for payment transactions
  primary:
    host: "${PAYMENT_DB_HOST:localhost}"
    port: "${PAYMENT_DB_PORT:5432}"
    name: "${PAYMENT_DB_NAME:ia_influencer_payments}"
    username: "${PAYMENT_DB_USER:payment_user}"
    password: "${PAYMENT_DB_PASSWORD:secure_password}"
    ssl_mode: "require"
    pool_size: 20
    max_overflow: 30
    pool_timeout: 30
    pool_recycle: 3600
    
  # Read replica for analytics
  analytics:
    host: "${ANALYTICS_DB_HOST:localhost}"
    port: "${ANALYTICS_DB_PORT:5432}"
    name: "${ANALYTICS_DB_NAME:ia_influencer_analytics}"
    username: "${ANALYTICS_DB_USER:analytics_user}"
    password: "${ANALYTICS_DB_PASSWORD:secure_password}"
    ssl_mode: "require"
    pool_size: 10
    max_overflow: 20

# Redis Configuration
redis:
  host: "${REDIS_HOST:localhost}"
  port: "${REDIS_PORT:6379}"
  password: "${REDIS_PASSWORD:}"
  db: 0
  ssl: true
  max_connections: 100
  socket_timeout: 5
  retry_on_timeout: true

# Payment Gateway Configurations
payment_gateways:
  # Stripe Configuration
  stripe:
    enabled: true
    environment: "${STRIPE_ENV:sandbox}"
    public_key: "${STRIPE_PUBLIC_KEY}"
    secret_key: "${STRIPE_SECRET_KEY}"
    webhook_secret: "${STRIPE_WEBHOOK_SECRET}"
    api_version: "2023-10-16"
    timeout: 30
    retry_attempts: 3
    supported_currencies:
      - "USD"
      - "EUR"
      - "GBP"
      - "CAD"
      - "AUD"
      - "JPY"
    features:
      - "payments"
      - "refunds"
      - "disputes"
      - "subscriptions"
      - "marketplace"
    
  # PayPal Configuration
  paypal:
    enabled: true
    environment: "${PAYPAL_ENV:sandbox}"
    client_id: "${PAYPAL_CLIENT_ID}"
    client_secret: "${PAYPAL_CLIENT_SECRET}"
    webhook_id: "${PAYPAL_WEBHOOK_ID}"
    timeout: 30
    retry_attempts: 3
    supported_currencies:
      - "USD"
      - "EUR"
      - "GBP"
      - "CAD"
      - "AUD"
    features:
      - "payments"
      - "refunds"
      - "subscriptions"
    
  # Wise (TransferWise) Configuration
  wise:
    enabled: true
    environment: "${WISE_ENV:sandbox}"
    api_token: "${WISE_API_TOKEN}"
    webhook_secret: "${WISE_WEBHOOK_SECRET}"
    profile_id: "${WISE_PROFILE_ID}"
    timeout: 60
    retry_attempts: 3
    supported_currencies:
      - "USD"
      - "EUR"
      - "GBP"
      - "CAD"
      - "AUD"
      - "JPY"
      - "CHF"
      - "SGD"
    features:
      - "international_transfers"
      - "multi_currency_account"
      - "fx_rates"
    
  # Bank Transfer Configuration
  bank_transfer:
    enabled: true
    providers:
      - "ACH"
      - "SEPA"
      - "SWIFT"
    verification_methods:
      - "micro_deposits"
      - "instant_verification"
    processing_time:
      domestic: "1-3 business days"
      international: "3-5 business days"

# Fraud Detection Configuration
fraud_detection:
  enabled: true
  engine: "advanced_ml"
  
  # Risk thresholds
  risk_thresholds:
    very_low: 0.1
    low: 0.3
    medium: 0.5
    high: 0.7
    very_high: 0.85
    critical: 0.95
  
  # Machine Learning Models
  ml_models:
    anomaly_detection:
      enabled: true
      model_type: "isolation_forest"
      contamination: 0.1
      update_frequency: "daily"
    
    classification:
      enabled: true
      model_type: "random_forest"
      n_estimators: 100
      update_frequency: "weekly"
    
    neural_network:
      enabled: true
      architecture: "deep_neural_network"
      layers: [128, 64, 32, 1]
      activation: "relu"
      update_frequency: "monthly"
  
  # Behavioral Analysis
  behavioral_analysis:
    enabled: true
    tracking_period: "90 days"
    velocity_checks:
      max_transactions_per_hour: 20
      max_transactions_per_day: 100
      max_amount_per_day: 10000
    
    geographic_analysis:
      track_locations: true
      vpn_detection: true
      high_risk_countries:
        - "Country codes for high-risk countries"
    
    device_fingerprinting:
      enabled: true
      track_user_agents: true
      track_screen_resolution: true
      track_timezone: true

# Analytics Configuration
analytics:
  enabled: true
  real_time_processing: true
  
  # Data Retention
  data_retention:
    transaction_data: "7 years"
    analytics_data: "5 years"
    logs: "2 years"
    metrics: "1 year"
  
  # Real-time Metrics
  real_time_metrics:
    update_interval: 30  # seconds
    batch_size: 1000
    buffer_size: 10000
  
  # Reporting
  reports:
    formats:
      - "JSON"
      - "CSV"
      - "PDF"
      - "Excel"
    
    scheduled_reports:
      daily_summary:
        enabled: true
        time: "06:00"
        recipients:
          - "finance@company.com"
          - "operations@company.com"
      
      weekly_analytics:
        enabled: true
        day: "monday"
        time: "09:00"
        recipients:
          - "management@company.com"
      
      monthly_compliance:
        enabled: true
        day: 1
        time: "08:00"
        recipients:
          - "compliance@company.com"
          - "legal@company.com"

# Compliance Configuration
compliance:
  enabled: true
  
  # Standards
  standards:
    pci_dss:
      enabled: true
      level: 1
      assessment_frequency: "quarterly"
      requirements:
        - "data_encryption"
        - "access_control"
        - "network_security"
        - "vulnerability_management"
        - "secure_development"
        - "information_security"
    
    gdpr:
      enabled: true
      data_protection_officer: "dpo@company.com"
      lawful_basis: "contract"
      retention_periods:
        personal_data: "7 years"
        marketing_data: "2 years"
        logs: "1 year"
    
    kyc_aml:
      enabled: true
      provider: "external_service"
      verification_levels:
        - "basic"
        - "enhanced"
        - "premium"
      monitoring:
        transaction_threshold: 10000
        cumulative_threshold: 50000
        suspicious_patterns: true
    
    sox:
      enabled: true
      controls:
        - "segregation_of_duties"
        - "authorization_controls"
        - "documentation"
        - "monitoring"
  
  # Audit Configuration
  audit:
    enabled: true
    log_all_transactions: true
    log_user_actions: true
    log_system_events: true
    retention_period: "7 years"
    encryption: true
    integrity_checks: true

# Security Configuration
security:
  # Encryption
  encryption:
    algorithm: "AES-256-GCM"
    key_rotation_interval: "90 days"
    at_rest: true
    in_transit: true
    
  # API Security
  api_security:
    rate_limiting:
      enabled: true
      requests_per_minute: 100
      burst_capacity: 200
    
    authentication:
      method: "OAuth2 + JWT"
      token_expiry: "1 hour"
      refresh_token_expiry: "7 days"
    
    ip_whitelisting:
      enabled: false  # Configure as needed
      allowed_ips: []
  
  # Data Protection
  data_protection:
    pii_encryption: true
    payment_data_tokenization: true
    secure_communication: true
    data_masking: true

# Webhook Configuration
webhooks:
  enabled: true
  
  # Processing
  processing:
    timeout: 30
    retry_attempts: 5
    retry_delay: 30  # seconds
    max_retry_delay: 3600  # 1 hour
    exponential_backoff: true
    
  # Security
  security:
    signature_verification: true
    timestamp_tolerance: 300  # 5 minutes
    replay_protection: true
    
  # Monitoring
  monitoring:
    success_rate_threshold: 95.0
    response_time_threshold: 5.0  # seconds
    error_rate_threshold: 5.0

# Monitoring and Alerting
monitoring:
  enabled: true
  
  # Metrics Collection
  metrics:
    collection_interval: 30  # seconds
    retention_period: "90 days"
    
  # Health Checks
  health_checks:
    database: true
    redis: true
    payment_gateways: true
    external_services: true
    interval: 60  # seconds
  
  # Alerting
  alerts:
    email:
      enabled: true
      smtp_host: "${SMTP_HOST}"
      smtp_port: "${SMTP_PORT:587}"
      username: "${SMTP_USERNAME}"
      password: "${SMTP_PASSWORD}"
      from_email: "alerts@company.com"
      
    slack:
      enabled: false
      webhook_url: "${SLACK_WEBHOOK_URL}"
      channel: "#payment-alerts"
    
    thresholds:
      error_rate: 5.0  # percentage
      response_time: 5.0  # seconds
      queue_depth: 10000
      disk_usage: 85.0  # percentage
      memory_usage: 90.0  # percentage

# Performance Configuration
performance:
  # Connection Pooling
  connection_pooling:
    max_connections: 100
    min_connections: 10
    connection_timeout: 30
    idle_timeout: 300
    
  # Caching
  caching:
    enabled: true
    default_ttl: 3600  # 1 hour
    max_memory: "1GB"
    eviction_policy: "LRU"
    
  # Queue Management
  queues:
    payment_processing:
      max_size: 10000
      worker_count: 20
      batch_size: 100
      
    fraud_detection:
      max_size: 5000
      worker_count: 10
      batch_size: 50
      
    analytics:
      max_size: 20000
      worker_count: 5
      batch_size: 200

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Log Files
  files:
    application:
      path: "/var/log/payment_processing/app.log"
      max_size: "100MB"
      backup_count: 10
      
    transactions:
      path: "/var/log/payment_processing/transactions.log"
      max_size: "500MB"
      backup_count: 30
      
    security:
      path: "/var/log/payment_processing/security.log"
      max_size: "100MB"
      backup_count: 30
      
    audit:
      path: "/var/log/payment_processing/audit.log"
      max_size: "1GB"
      backup_count: 90
  
  # External Logging
  external:
    enabled: false
    service: "elasticsearch"
    endpoint: "${LOG_ENDPOINT}"
    api_key: "${LOG_API_KEY}"

# Development and Testing
development:
  debug_mode: false
  test_mode: false
  mock_external_services: false
  
  # Test Configuration
  testing:
    test_database: "ia_influencer_payments_test"
    test_redis_db: 1
    mock_payment_gateways: true
    
# Backup and Recovery
backup:
  enabled: true
  frequency: "daily"
  retention: "30 days"
  encryption: true
  
  destinations:
    - type: "s3"
      bucket: "${BACKUP_S3_BUCKET}"
      region: "${BACKUP_S3_REGION}"
      
    - type: "local"
      path: "/var/backups/payment_processing"

# Feature Flags
feature_flags:
  new_fraud_detection_engine: true
  advanced_analytics: true
  real_time_notifications: true
  multi_currency_support: true
  cryptocurrency_payments: false
  ai_powered_recommendations: true
  automated_compliance_reporting: true
