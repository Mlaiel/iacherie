# PostgreSQL Slave Configuration for Ainflue Platform
# Optimized for read-heavy content analysis and monitoring workloads

# CONNECTIONS AND AUTHENTICATION
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3

# STANDBY SETTINGS
hot_standby = on
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s
wal_receiver_status_interval = 10s
hot_standby_feedback = on
wal_receiver_timeout = 60s

# MEMORY SETTINGS (optimized for read operations)
shared_buffers = 128MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# PERFORMANCE TUNING FOR READ WORKLOADS
random_page_cost = 1.1
effective_io_concurrency = 200
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# LOGGING
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-slave-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_min_duration_statement = 2000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p]: [%l-1] SLAVE user=%u,db=%d,app=%a,client=%h '

# STATISTICS
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl

# READ-OPTIMIZED SETTINGS
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# TIMEOUTS
statement_timeout = 300s
idle_in_transaction_session_timeout = 60s

# BACKGROUND WRITER
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0