# PostgreSQL Master Configuration for Ainflue Platform
# Optimized for high-performance content protection and AI processing

# CONNECTIONS AND AUTHENTICATION
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# REPLICATION SETTINGS
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
synchronous_commit = on
synchronous_standby_names = 'postgres_slave'

# ARCHIVING SETTINGS
archive_mode = on
archive_command = 'test ! -f /archive/%f && cp %p /archive/%f'
archive_timeout = 300

# MEMORY SETTINGS (optimized for content processing)
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_buffers = 16MB

# CHECKPOINT SETTINGS
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 1GB

# PERFORMANCE TUNING
random_page_cost = 1.1
effective_io_concurrency = 200
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# LOGGING (for monitoring and debugging)
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 0
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'ddl'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# AUTOVACUUM (critical for high-write content operations)
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 500
autovacuum_analyze_threshold = 250
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# STATISTICS
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
shared_preload_libraries = 'pg_stat_statements'

# CONTENT PROTECTION SPECIFIC OPTIMIZATIONS
# Optimized for fingerprinting and content analysis workloads
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# LOCKS AND TIMEOUTS
deadlock_timeout = 1s
lock_timeout = 30s
statement_timeout = 300s
idle_in_transaction_session_timeout = 60s

# BACKGROUND WRITER
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

# WAL WRITER
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB