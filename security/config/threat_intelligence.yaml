# 🔒 Enterprise Threat Intelligence Configuration
# Author: Fahed Mlaiel (mlaiel@live.de) - Multi-Expert Implementation
# Version: 2.0.0 Enterprise Ultra-Strict
# Created: 2025-01-09

# Threat Intelligence Configuration
threat_intelligence:
  enabled: true
  real_time_processing: true
  machine_learning_enabled: true
  automated_response: true
  threat_sharing: true

# Threat Sources Configuration
threat_sources:
  internal_sources:
    security_logs: true
    network_traffic: true
    endpoint_data: true
    user_behavior: true
    application_logs: true
  
  external_sources:
    commercial_feeds:
      - name: "CrowdStrike"
        enabled: true
        api_key: "${CROWDSTRIKE_API_KEY}"
        refresh_interval_minutes: 15
      - name: "FireEye"
        enabled: true
        api_key: "${FIREEYE_API_KEY}"
        refresh_interval_minutes: 30
    
    open_source_feeds:
      - name: "MISP"
        enabled: true
        url: "https://misp.local"
        refresh_interval_hours: 1
      - name: "AlienVault OTX"
        enabled: true
        api_key: "${OTX_API_KEY}"
        refresh_interval_hours: 2
    
    government_feeds:
      - name: "US-CERT"
        enabled: true
        refresh_interval_hours: 6
      - name: "CISA"
        enabled: true
        refresh_interval_hours: 6

# Threat Categories
threat_categories:
  malware:
    detection_enabled: true
    signature_based: true
    behavioral_analysis: true
    machine_learning: true
    sandbox_analysis: true
  
  phishing:
    email_analysis: true
    url_analysis: true
    domain_reputation: true
    sender_reputation: true
    content_analysis: true
  
  apt_groups:
    tracking_enabled: true
    attribution_analysis: true
    ttp_mapping: true
    campaign_correlation: true
  
  vulnerability_exploitation:
    zero_day_detection: true
    exploit_kit_tracking: true
    patch_correlation: true
    vulnerability_prioritization: true
  
  insider_threats:
    behavioral_monitoring: true
    privilege_escalation: true
    data_exfiltration: true
    policy_violations: true

# Indicators of Compromise (IoCs)
iocs:
  types:
    - "ip_addresses"
    - "domains"
    - "urls"
    - "file_hashes"
    - "email_addresses"
    - "registry_keys"
    - "file_paths"
    - "mutex_names"
  
  confidence_levels:
    high: 0.8
    medium: 0.6
    low: 0.4
  
  retention_days: 365
  auto_blocking: true
  whitelist_checking: true

# Threat Actor Profiles
threat_actors:
  nation_state:
    monitoring: true
    attribution: true
    capability_assessment: true
    targeting_analysis: true
  
  cybercriminal:
    financial_motivation: true
    group_tracking: true
    infrastructure_monitoring: true
    tool_analysis: true
  
  hacktivist:
    ideology_tracking: true
    campaign_monitoring: true
    target_prediction: true
  
  insider:
    privilege_monitoring: true
    behavioral_analysis: true
    access_pattern_analysis: true

# Attack Patterns (MITRE ATT&CK)
attack_patterns:
  tactics:
    - "initial_access"
    - "execution"
    - "persistence"
    - "privilege_escalation"
    - "defense_evasion"
    - "credential_access"
    - "discovery"
    - "lateral_movement"
    - "collection"
    - "command_and_control"
    - "exfiltration"
    - "impact"
  
  techniques_monitoring: true
  sub_techniques_tracking: true
  procedure_analysis: true
  countermeasure_mapping: true

# Threat Hunting
threat_hunting:
  enabled: true
  proactive_hunting: true
  hypothesis_driven: true
  data_driven: true
  automated_hunting: true
  
  hunting_frequency:
    daily: true
    weekly: true
    monthly: true
    ad_hoc: true
  
  hunting_areas:
    - "network_traffic"
    - "endpoint_activities"
    - "user_behaviors"
    - "application_logs"
    - "cloud_activities"

# Threat Assessment
threat_assessment:
  risk_scoring: true
  threat_landscape_analysis: true
  attack_surface_monitoring: true
  vulnerability_correlation: true
  business_impact_assessment: true

# Response Automation
response_automation:
  automated_blocking: true
  quarantine_procedures: true
  notification_systems: true
  escalation_procedures: true
  forensic_collection: true

# Intelligence Sharing
intelligence_sharing:
  internal_sharing: true
  partner_sharing: true
  industry_sharing: true
  government_sharing: true
  
  sharing_protocols:
    - "STIX/TAXII"
    - "MISP"
    - "Custom API"
  
  anonymization: true
  attribution_protection: true

# Quality Assurance
quality_assurance:
  source_credibility: true
  information_reliability: true
  timeliness_assessment: true
  relevance_scoring: true
  accuracy_validation: true

# Machine Learning Models
ml_models:
  anomaly_detection:
    enabled: true
    model_type: "isolation_forest"
    training_frequency_days: 7
    threshold: 0.95
  
  threat_classification:
    enabled: true
    model_type: "random_forest"
    features: ["network", "endpoint", "user_behavior"]
    accuracy_threshold: 0.90
  
  predictive_analysis:
    enabled: true
    model_type: "lstm"
    prediction_horizon_days: 30
    confidence_threshold: 0.85

# Metrics and KPIs
metrics:
  detection_accuracy: true
  false_positive_rate: true
  mean_time_to_detection: true
  mean_time_to_response: true
  threat_coverage: true
  intelligence_quality_score: true