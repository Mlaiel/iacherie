<?xml version="1.0" encoding="UTF-8"?>
<!-- Visible Watermark Template -->
<!-- © 2025 Fahed Mlaiel - Ainflue Studio -->
<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="visibleWatermarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background Content -->
  <rect width="300" height="200" fill="#2d3748"/>
  
  <!-- Sample content area -->
  <rect x="20" y="20" width="260" height="160" fill="#4a5568" rx="8"/>
  
  <!-- Visible Watermark Overlay -->
  <g transform="translate(150, 100) rotate(-15)" opacity="0.4">
    <rect x="-80" y="-20" width="160" height="40" fill="url(#visibleWatermarkGradient)" rx="20"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3748" text-anchor="middle">© AINFLUE STUDIO</text>
  </g>
  
  <!-- Watermark positioning guides -->
  <circle cx="150" cy="100" r="2" fill="#00ff88" opacity="0.5"/>
  <line x1="50" y1="100" x2="250" y2="100" stroke="#00ff88" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="150" y1="50" x2="150" y2="150" stroke="#00ff88" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
  
  <!-- Control panel -->
  <rect x="10" y="170" width="280" height="25" fill="#1a202c" rx="4"/>
  <text x="15" y="185" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Opacity: 40% | Rotation: -15° | Position: Center</text>
  <text x="15" y="197" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e0">Customizable watermark template</text>
</svg>