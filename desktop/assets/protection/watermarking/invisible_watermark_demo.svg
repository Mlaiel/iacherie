<?xml version="1.0" encoding="UTF-8"?>
<!-- Invisible Watermark Demonstration -->
<!-- © 2025 Fahed Mlaiel - Ainflue Studio -->
<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="watermarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <pattern id="watermarkPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#00ff88" fill-opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#watermarkGradient)"/>
  
  <!-- Main Content Area -->
  <rect x="20" y="20" width="260" height="160" fill="#f7fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  
  <!-- Sample Content -->
  <text x="40" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">Protected Content</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">Audio/Video/Image with invisible watermark</text>
  
  <!-- Watermark Layer (Invisible) -->
  <rect x="20" y="20" width="260" height="160" fill="url(#watermarkPattern)" opacity="0.05"/>
  
  <!-- Watermark Detection Indicator -->
  <g transform="translate(220, 140)">
    <circle cx="0" cy="0" r="15" fill="#00ff88" fill-opacity="0.2"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00ff88" text-anchor="middle">✓</text>
  </g>
  
  <!-- Legend -->
  <text x="40" y="120" font-family="Arial, sans-serif" font-size="10" fill="#718096">Invisible watermark embedded</text>
  <text x="40" y="135" font-family="Arial, sans-serif" font-size="10" fill="#718096">Detectable by AI algorithms</text>
  <text x="40" y="150" font-family="Arial, sans-serif" font-size="10" fill="#718096">Copyright protection active</text>
</svg>