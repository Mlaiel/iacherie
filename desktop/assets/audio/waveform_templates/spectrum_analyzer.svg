<?xml version="1.0" encoding="UTF-8"?>
<!-- Spectrum Analyzer Template - Ainflue Desktop Assets -->
<!-- Copyright (c) 2025 Fahed Mlaiel. All rights reserved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="spectrumGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0040;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ff8000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#00ff40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <filter id="spectrumGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="url(#backgroundGradient)" rx="10"/>
  
  <!-- Grid -->
  <g stroke="#333" stroke-width="0.5" opacity="0.4">
    <!-- Horizontal grid lines (frequency bands) -->
    <line x1="50" y1="50" x2="550" y2="50"/>   <!-- -10dB -->
    <line x1="50" y1="80" x2="550" y2="80"/>   <!-- -20dB -->
    <line x1="50" y1="110" x2="550" y2="110"/> <!-- -30dB -->
    <line x1="50" y1="140" x2="550" y2="140"/> <!-- -40dB -->
    <line x1="50" y1="170" x2="550" y2="170"/> <!-- -50dB -->
    <line x1="50" y1="200" x2="550" y2="200"/> <!-- -60dB -->
    <line x1="50" y1="230" x2="550" y2="230"/> <!-- -70dB -->
    <line x1="50" y1="260" x2="550" y2="260"/> <!-- -80dB -->
    
    <!-- Vertical grid lines (frequency markers) -->
    <line x1="100" y1="20" x2="100" y2="260"/> <!-- 100Hz -->
    <line x1="150" y1="20" x2="150" y2="260"/> <!-- 500Hz -->
    <line x1="200" y1="20" x2="200" y2="260"/> <!-- 1kHz -->
    <line x1="300" y1="20" x2="300" y2="260"/> <!-- 5kHz -->
    <line x1="400" y1="20" x2="400" y2="260"/> <!-- 10kHz -->
    <line x1="500" y1="20" x2="500" y2="260"/> <!-- 20kHz -->
  </g>
  
  <!-- Frequency labels -->
  <g fill="#888" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <text x="100" y="275">100Hz</text>
    <text x="150" y="275">500Hz</text>
    <text x="200" y="275">1kHz</text>
    <text x="300" y="275">5kHz</text>
    <text x="400" y="275">10kHz</text>
    <text x="500" y="275">20kHz</text>
  </g>
  
  <!-- dB scale -->
  <g fill="#888" font-family="Arial, sans-serif" font-size="9" text-anchor="end">
    <text x="45" y="25">0dB</text>
    <text x="45" y="55">-10dB</text>
    <text x="45" y="85">-20dB</text>
    <text x="45" y="115">-30dB</text>
    <text x="45" y="145">-40dB</text>
    <text x="45" y="175">-50dB</text>
    <text x="45" y="205">-60dB</text>
    <text x="45" y="235">-70dB</text>
    <text x="45" y="265">-80dB</text>
  </g>
  
  <!-- Spectrum analyzer bars -->
  <g fill="url(#spectrumGradient)" filter="url(#spectrumGlow)">
    <!-- Low frequencies (bass) -->
    <rect x="60" y="120" width="6" height="140"/>
    <rect x="68" y="110" width="6" height="150"/>
    <rect x="76" y="130" width="6" height="130"/>
    <rect x="84" y="125" width="6" height="135"/>
    <rect x="92" y="115" width="6" height="145"/>
    <rect x="100" y="105" width="6" height="155"/>
    <rect x="108" y="120" width="6" height="140"/>
    
    <!-- Mid-low frequencies -->
    <rect x="120" y="90" width="6" height="170"/>
    <rect x="128" y="85" width="6" height="175"/>
    <rect x="136" y="95" width="6" height="165"/>
    <rect x="144" y="80" width="6" height="180"/>
    <rect x="152" y="75" width="6" height="185"/>
    <rect x="160" y="70" width="6" height="190"/>
    <rect x="168" y="65" width="6" height="195"/>
    
    <!-- Mid frequencies (vocals, instruments) -->
    <rect x="180" y="50" width="6" height="210"/>
    <rect x="188" y="45" width="6" height="215"/>
    <rect x="196" y="40" width="6" height="220"/>
    <rect x="204" y="35" width="6" height="225"/>
    <rect x="212" y="30" width="6" height="230"/>
    <rect x="220" y="25" width="6" height="235"/>
    <rect x="228" y="20" width="6" height="240"/>
    <rect x="236" y="25" width="6" height="235"/>
    <rect x="244" y="30" width="6" height="230"/>
    <rect x="252" y="35" width="6" height="225"/>
    
    <!-- Mid-high frequencies -->
    <rect x="270" y="55" width="6" height="205"/>
    <rect x="278" y="60" width="6" height="200"/>
    <rect x="286" y="65" width="6" height="195"/>
    <rect x="294" y="70" width="6" height="190"/>
    <rect x="302" y="75" width="6" height="185"/>
    <rect x="310" y="80" width="6" height="180"/>
    <rect x="318" y="85" width="6" height="175"/>
    <rect x="326" y="90" width="6" height="170"/>
    
    <!-- High frequencies -->
    <rect x="340" y="120" width="6" height="140"/>
    <rect x="348" y="130" width="6" height="130"/>
    <rect x="356" y="140" width="6" height="120"/>
    <rect x="364" y="150" width="6" height="110"/>
    <rect x="372" y="160" width="6" height="100"/>
    <rect x="380" y="170" width="6" height="90"/>
    <rect x="388" y="180" width="6" height="80"/>
    <rect x="396" y="190" width="6" height="70"/>
    
    <!-- Very high frequencies -->
    <rect x="410" y="200" width="6" height="60"/>
    <rect x="418" y="210" width="6" height="50"/>
    <rect x="426" y="220" width="6" height="40"/>
    <rect x="434" y="230" width="6" height="30"/>
    <rect x="442" y="235" width="6" height="25"/>
    <rect x="450" y="240" width="6" height="20"/>
    <rect x="458" y="245" width="6" height="15"/>
    <rect x="466" y="250" width="6" height="10"/>
    <rect x="474" y="252" width="6" height="8"/>
    <rect x="482" y="254" width="6" height="6"/>
    <rect x="490" y="256" width="6" height="4"/>
    <rect x="498" y="258" width="6" height="2"/>
  </g>
  
  <!-- Peak hold indicators -->
  <g fill="#00ff00" opacity="0.8">
    <rect x="220" y="18" width="6" height="2"/>
    <rect x="228" y="18" width="6" height="2"/>
    <rect x="236" y="23" width="6" height="2"/>
    <rect x="244" y="28" width="6" height="2"/>
  </g>
  
  <!-- Title and branding -->
  <text x="300" y="15" fill="#00d4ff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SPECTRUM ANALYZER</text>
  <text x="555" y="290" fill="#666" font-family="Arial, sans-serif" font-size="8" text-anchor="end">AINFLUE PRO</text>
  
  <!-- Status indicators -->
  <circle cx="570" cy="30" r="4" fill="#00ff00"/>
  <text x="565" y="20" fill="#00ff00" font-family="Arial, sans-serif" font-size="8" text-anchor="end">LIVE</text>
</svg>