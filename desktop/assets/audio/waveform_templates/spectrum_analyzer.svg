<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="spectrumGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#ff8800;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#88ff00;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#0088ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8800ff;stop-opacity:1" />
    </linearGradient>
    <filter id="spectrumGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#0a0a0a"/>
  
  <!-- Frequency Grid -->
  <g stroke="#333" stroke-width="0.5" opacity="0.4">
    <!-- Horizontal lines (dB levels) -->
    <line x1="50" y1="50" x2="550" y2="50"/>
    <line x1="50" y1="100" x2="550" y2="100"/>
    <line x1="50" y1="150" x2="550" y2="150"/>
    <line x1="50" y1="200" x2="550" y2="200"/>
    <line x1="50" y1="250" x2="550" y2="250"/>
    <line x1="50" y1="300" x2="550" y2="300"/>
    <line x1="50" y1="350" x2="550" y2="350"/>
    
    <!-- Vertical lines (frequency bands) -->
    <line x1="100" y1="50" x2="100" y2="350"/>
    <line x1="200" y1="50" x2="200" y2="350"/>
    <line x1="300" y1="50" x2="300" y2="350"/>
    <line x1="400" y1="50" x2="400" y2="350"/>
    <line x1="500" y1="50" x2="500" y2="350"/>
  </g>
  
  <!-- Spectrum Bars -->
  <g fill="url(#spectrumGradient)" filter="url(#spectrumGlow)">
    <rect x="52" y="200" width="8" height="150"/>
    <rect x="62" y="180" width="8" height="170"/>
    <rect x="72" y="160" width="8" height="190"/>
    <rect x="82" y="140" width="8" height="210"/>
    <rect x="92" y="120" width="8" height="230"/>
    <rect x="102" y="100" width="8" height="250"/>
    <rect x="112" y="80" width="8" height="270"/>
    <rect x="122" y="90" width="8" height="260"/>
    <rect x="132" y="110" width="8" height="240"/>
    <rect x="142" y="130" width="8" height="220"/>
    <rect x="152" y="150" width="8" height="200"/>
    <rect x="162" y="170" width="8" height="180"/>
    <rect x="172" y="190" width="8" height="160"/>
    <rect x="182" y="210" width="8" height="140"/>
    <rect x="192" y="230" width="8" height="120"/>
    <rect x="202" y="250" width="8" height="100"/>
    <rect x="212" y="270" width="8" height="80"/>
    <rect x="222" y="280" width="8" height="70"/>
    <rect x="232" y="290" width="8" height="60"/>
    <rect x="242" y="300" width="8" height="50"/>
    <rect x="252" y="310" width="8" height="40"/>
    <rect x="262" y="320" width="8" height="30"/>
    <rect x="272" y="325" width="8" height="25"/>
    <rect x="282" y="330" width="8" height="20"/>
    <rect x="292" y="335" width="8" height="15"/>
    
    <!-- Repeat pattern for higher frequencies -->
    <rect x="302" y="340" width="8" height="10"/>
    <rect x="312" y="335" width="8" height="15"/>
    <rect x="322" y="330" width="8" height="20"/>
    <rect x="332" y="325" width="8" height="25"/>
    <rect x="342" y="320" width="8" height="30"/>
    <rect x="352" y="315" width="8" height="35"/>
    <rect x="362" y="310" width="8" height="40"/>
    <rect x="372" y="305" width="8" height="45"/>
    <rect x="382" y="300" width="8" height="50"/>
    <rect x="392" y="295" width="8" height="55"/>
    <rect x="402" y="290" width="8" height="60"/>
    <rect x="412" y="285" width="8" height="65"/>
    <rect x="422" y="280" width="8" height="70"/>
    <rect x="432" y="275" width="8" height="75"/>
    <rect x="442" y="270" width="8" height="80"/>
    <rect x="452" y="265" width="8" height="85"/>
    <rect x="462" y="260" width="8" height="90"/>
    <rect x="472" y="255" width="8" height="95"/>
    <rect x="482" y="250" width="8" height="100"/>
    <rect x="492" y="245" width="8" height="105"/>
    <rect x="502" y="240" width="8" height="110"/>
    <rect x="512" y="235" width="8" height="115"/>
    <rect x="522" y="230" width="8" height="120"/>
    <rect x="532" y="225" width="8" height="125"/>
    <rect x="542" y="220" width="8" height="130"/>
  </g>
  
  <!-- Labels -->
  <g fill="#00ff88" font-family="Arial, sans-serif" font-size="12">
    <text x="10" y="15">Professional Spectrum Analyzer</text>
    <text x="10" y="390">© Ainflue Studio - Fahed Mlaiel</text>
    
    <!-- Frequency labels -->
    <text x="95" y="370" font-size="10">100Hz</text>
    <text x="195" y="370" font-size="10">1kHz</text>
    <text x="295" y="370" font-size="10">5kHz</text>
    <text x="395" y="370" font-size="10">10kHz</text>
    <text x="495" y="370" font-size="10">20kHz</text>
    
    <!-- dB labels -->
    <text x="15" y="55" font-size="10">0dB</text>
    <text x="10" y="105" font-size="10">-10</text>
    <text x="10" y="155" font-size="10">-20</text>
    <text x="10" y="205" font-size="10">-30</text>
    <text x="10" y="255" font-size="10">-40</text>
    <text x="10" y="305" font-size="10">-50</text>
    <text x="10" y="355" font-size="10">-60</text>
  </g>
</svg>