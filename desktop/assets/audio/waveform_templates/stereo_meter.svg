<?xml version="1.0" encoding="UTF-8"?>
<!-- Stereo Meter Template - Ainflue Desktop Assets -->
<!-- Copyright (c) 2025 Fahed Mlaiel. All rights reserved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <defs>
    <linearGradient id="meterGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#ff8000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="ledGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="300" height="600" fill="url(#backgroundGradient)" rx="15"/>
  
  <!-- Title -->
  <text x="150" y="30" fill="#00d4ff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" filter="url(#textShadow)">STEREO METER</text>
  
  <!-- Left Channel -->
  <g transform="translate(50, 60)">
    <!-- Channel label -->
    <text x="50" y="15" fill="#ccc" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LEFT</text>
    
    <!-- Meter background -->
    <rect x="40" y="25" width="20" height="450" fill="#111" rx="10" stroke="#333" stroke-width="1"/>
    
    <!-- Scale markings -->
    <g fill="#666" font-family="Arial, sans-serif" font-size="8" text-anchor="end">
      <text x="35" y="40">0</text>
      <text x="35" y="65">-3</text>
      <text x="35" y="90">-6</text>
      <text x="35" y="115">-9</text>
      <text x="35" y="140">-12</text>
      <text x="35" y="165">-15</text>
      <text x="35" y="190">-18</text>
      <text x="35" y="215">-21</text>
      <text x="35" y="240">-24</text>
      <text x="35" y="265">-27</text>
      <text x="35" y="290">-30</text>
      <text x="35" y="340">-40</text>
      <text x="35" y="390">-50</text>
      <text x="35" y="440">-60</text>
      <text x="35" y="470">∞</text>
    </g>
    
    <!-- Scale tick marks -->
    <g stroke="#666" stroke-width="0.5">
      <line x1="35" y1="35" x2="40" y2="35"/>   <!-- 0dB -->
      <line x1="35" y1="60" x2="40" y2="60"/>   <!-- -3dB -->
      <line x1="35" y1="85" x2="40" y2="85"/>   <!-- -6dB -->
      <line x1="35" y1="110" x2="40" y2="110"/> <!-- -9dB -->
      <line x1="35" y1="135" x2="40" y2="135"/> <!-- -12dB -->
      <line x1="35" y1="160" x2="40" y2="160"/> <!-- -15dB -->
      <line x1="35" y1="185" x2="40" y2="185"/> <!-- -18dB -->
      <line x1="35" y1="210" x2="40" y2="210"/> <!-- -21dB -->
      <line x1="35" y1="235" x2="40" y2="235"/> <!-- -24dB -->
      <line x1="35" y1="260" x2="40" y2="260"/> <!-- -27dB -->
      <line x1="35" y1="285" x2="40" y2="285"/> <!-- -30dB -->
      <line x1="35" y1="335" x2="40" y2="335"/> <!-- -40dB -->
      <line x1="35" y1="385" x2="40" y2="385"/> <!-- -50dB -->
      <line x1="35" y1="435" x2="40" y2="435"/> <!-- -60dB -->
    </g>
    
    <!-- Meter fill (Left channel showing -9dB level) -->
    <rect x="42" y="110" width="16" height="363" fill="url(#meterGradient)" rx="8" filter="url(#ledGlow)"/>
    
    <!-- Peak hold indicator -->
    <rect x="42" y="105" width="16" height="3" fill="#ff0040" rx="1" filter="url(#ledGlow)"/>
    
    <!-- Digital readout -->
    <rect x="25" y="485" width="50" height="20" fill="#000" rx="3" stroke="#333" stroke-width="1"/>
    <text x="50" y="498" fill="#00ff00" font-family="Courier, monospace" font-size="12" text-anchor="middle">-9.2</text>
  </g>
  
  <!-- Right Channel -->
  <g transform="translate(150, 60)">
    <!-- Channel label -->
    <text x="50" y="15" fill="#ccc" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RIGHT</text>
    
    <!-- Meter background -->
    <rect x="40" y="25" width="20" height="450" fill="#111" rx="10" stroke="#333" stroke-width="1"/>
    
    <!-- Scale markings -->
    <g fill="#666" font-family="Arial, sans-serif" font-size="8" text-anchor="start">
      <text x="65" y="40">0</text>
      <text x="65" y="65">-3</text>
      <text x="65" y="90">-6</text>
      <text x="65" y="115">-9</text>
      <text x="65" y="140">-12</text>
      <text x="65" y="165">-15</text>
      <text x="65" y="190">-18</text>
      <text x="65" y="215">-21</text>
      <text x="65" y="240">-24</text>
      <text x="65" y="265">-27</text>
      <text x="65" y="290">-30</text>
      <text x="65" y="340">-40</text>
      <text x="65" y="390">-50</text>
      <text x="65" y="440">-60</text>
      <text x="65" y="470">∞</text>
    </g>
    
    <!-- Scale tick marks -->
    <g stroke="#666" stroke-width="0.5">
      <line x1="60" y1="35" x2="65" y2="35"/>   <!-- 0dB -->
      <line x1="60" y1="60" x2="65" y2="60"/>   <!-- -3dB -->
      <line x1="60" y1="85" x2="65" y2="85"/>   <!-- -6dB -->
      <line x1="60" y1="110" x2="65" y2="110"/> <!-- -9dB -->
      <line x1="60" y1="135" x2="65" y2="135"/> <!-- -12dB -->
      <line x1="60" y1="160" x2="65" y2="160"/> <!-- -15dB -->
      <line x1="60" y1="185" x2="65" y2="185"/> <!-- -18dB -->
      <line x1="60" y1="210" x2="65" y2="210"/> <!-- -21dB -->
      <line x1="60" y1="235" x2="65" y2="235"/> <!-- -24dB -->
      <line x1="60" y1="260" x2="65" y2="260"/> <!-- -27dB -->
      <line x1="60" y1="285" x2="65" y2="285"/> <!-- -30dB -->
      <line x1="60" y1="335" x2="65" y2="335"/> <!-- -40dB -->
      <line x1="60" y1="385" x2="65" y2="385"/> <!-- -50dB -->
      <line x1="60" y1="435" x2="65" y2="435"/> <!-- -60dB -->
    </g>
    
    <!-- Meter fill (Right channel showing -6dB level) -->
    <rect x="42" y="85" width="16" height="388" fill="url(#meterGradient)" rx="8" filter="url(#ledGlow)"/>
    
    <!-- Peak hold indicator -->
    <rect x="42" y="80" width="16" height="3" fill="#ff0040" rx="1" filter="url(#ledGlow)"/>
    
    <!-- Digital readout -->
    <rect x="25" y="485" width="50" height="20" fill="#000" rx="3" stroke="#333" stroke-width="1"/>
    <text x="50" y="498" fill="#00ff00" font-family="Courier, monospace" font-size="12" text-anchor="middle">-6.7</text>
  </g>
  
  <!-- Correlation meter -->
  <g transform="translate(150, 520)">
    <text x="0" y="15" fill="#ccc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">CORRELATION</text>
    
    <!-- Correlation scale -->
    <rect x="-75" y="20" width="150" height="15" fill="#111" rx="7" stroke="#333" stroke-width="1"/>
    
    <!-- Scale markings -->
    <g fill="#666" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">
      <text x="-75" y="50">-1</text>
      <text x="-37.5" y="50">-0.5</text>
      <text x="0" y="50">0</text>
      <text x="37.5" y="50">+0.5</text>
      <text x="75" y="50">+1</text>
    </g>
    
    <!-- Correlation indicator (showing +0.8) -->
    <rect x="-75" y="22" width="135" height="11" fill="#00ff00" rx="5" filter="url(#ledGlow)"/>
    
    <!-- Center line -->
    <line x1="0" y1="20" x2="0" y2="35" stroke="#666" stroke-width="1"/>
    
    <!-- Digital correlation readout -->
    <rect x="-25" y="55" width="50" height="18" fill="#000" rx="3" stroke="#333" stroke-width="1"/>
    <text x="0" y="67" fill="#00ff00" font-family="Courier, monospace" font-size="11" text-anchor="middle">+0.84</text>
  </g>
  
  <!-- Status indicators -->
  <g transform="translate(50, 520)">
    <!-- Peak hold reset button -->
    <rect x="0" y="20" width="40" height="15" fill="#444" rx="3" stroke="#666" stroke-width="1"/>
    <text x="20" y="30" fill="#ccc" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">RESET</text>
    
    <!-- Clip indicators -->
    <circle cx="15" cy="50" r="6" fill="#333" stroke="#666" stroke-width="1"/>
    <text x="15" y="54" fill="#666" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">L</text>
    
    <circle cx="35" cy="50" r="6" fill="#333" stroke="#666" stroke-width="1"/>
    <text x="35" y="54" fill="#666" font-family="Arial, sans-serif" font-size="6" text-anchor="middle">R</text>
    
    <text x="25" y="68" fill="#666" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">CLIP</text>
  </g>
  
  <!-- Branding -->
  <text x="280" y="590" fill="#666" font-family="Arial, sans-serif" font-size="8" text-anchor="end">AINFLUE PRO</text>
</svg>