<?xml version="1.0" encoding="UTF-8"?>
<!-- Professional Equalizer Template - Ainflue Desktop Assets -->
<!-- Copyright (c) 2025 Fahed Mlaiel. All rights reserved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="eqBackground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sliderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006699;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="knobGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="0"/>
      <feGaussianBlur stdDeviation="1" result="offset-blur"/>
      <feFlood flood-color="#000" flood-opacity="0.4"/>
      <feComposite in2="offset-blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="400" fill="url(#eqBackground)" rx="15"/>
  
  <!-- Title -->
  <text x="400" y="30" fill="#00d4ff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">PROFESSIONAL EQUALIZER</text>
  
  <!-- EQ Bands -->
  <!-- Band 1: 60Hz -->
  <g transform="translate(80, 60)">
    <!-- Slider track -->
    <rect x="18" y="20" width="4" height="200" fill="#333" rx="2" filter="url(#innerShadow)"/>
    <!-- Slider handle -->
    <rect x="15" y="140" width="10" height="20" fill="url(#sliderGradient)" rx="5" filter="url(#dropShadow)"/>
    <!-- Frequency label -->
    <text x="20" y="240" fill="#ccc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">60Hz</text>
    <!-- Gain value -->
    <text x="20" y="255" fill="#00ff00" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">-2dB</text>
  </g>
  
  <!-- Band 2: 170Hz -->
  <g transform="translate(160, 60)">
    <rect x="18" y="20" width="4" height="200" fill="#333" rx="2" filter="url(#innerShadow)"/>
    <rect x="15" y="120" width="10" height="20" fill="url(#sliderGradient)" rx="5" filter="url(#dropShadow)"/>
    <text x="20" y="240" fill="#ccc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">170Hz</text>
    <text x="20" y="255" fill="#00ff00" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">+1dB</text>
  </g>
  
  <!-- Band 3: 310Hz -->
  <g transform="translate(240, 60)">
    <rect x="18" y="20" width="4" height="200" fill="#333" rx="2" filter="url(#innerShadow)"/>
    <rect x="15" y="110" width="10" height="20" fill="url(#sliderGradient)" rx="5" filter="url(#dropShadow)"/>
    <text x="20" y="240" fill="#ccc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">310Hz</text>
    <text x="20" y="255" fill="#00ff00" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">+3dB</text>
  </g>
  
  <!-- Band 4: 600Hz -->
  <g transform="translate(320, 60)">
    <rect x="18" y="20" width="4" height="200" fill="#333" rx="2" filter="url(#innerShadow)"/>
    <rect x="15" y="110" width="10" height="20" fill="url(#sliderGradient)" rx="5" filter="url(#dropShadow)"/>
    <text x="20" y="240" fill="#ccc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">600Hz</text>
    <text x="20" y="255" fill="#00ff00" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">0dB</text>
  </g>
  
  <!-- Band 5: 1kHz -->
  <g transform="translate(400, 60)">
    <rect x="18" y="20" width="4" height="200" fill="#333" rx="2" filter="url(#innerShadow)"/>
    <rect x="15" y="90" width="10" height="20" fill="url(#sliderGradient)" rx="5" filter="url(#dropShadow)"/>
    <text x="20" y="240" fill="#ccc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">1kHz</text>
    <text x="20" y="255" fill="#00ff00" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">+5dB</text>
  </g>
  
  <!-- Band 6: 3kHz -->
  <g transform="translate(480, 60)">
    <rect x="18" y="20" width="4" height="200" fill="#333" rx="2" filter="url(#innerShadow)"/>
    <rect x="15" y="80" width="10" height="20" fill="url(#sliderGradient)" rx="5" filter="url(#dropShadow)"/>
    <text x="20" y="240" fill="#ccc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">3kHz</text>
    <text x="20" y="255" fill="#00ff00" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">+6dB</text>
  </g>
  
  <!-- Band 7: 6kHz -->
  <g transform="translate(560, 60)">
    <rect x="18" y="20" width="4" height="200" fill="#333" rx="2" filter="url(#innerShadow)"/>
    <rect x="15" y="100" width="10" height="20" fill="url(#sliderGradient)" rx="5" filter="url(#dropShadow)"/>
    <text x="20" y="240" fill="#ccc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">6kHz</text>
    <text x="20" y="255" fill="#00ff00" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">+2dB</text>
  </g>
  
  <!-- Band 8: 12kHz -->
  <g transform="translate(640, 60)">
    <rect x="18" y="20" width="4" height="200" fill="#333" rx="2" filter="url(#innerShadow)"/>
    <rect x="15" y="130" width="10" height="20" fill="url(#sliderGradient)" rx="5" filter="url(#dropShadow)"/>
    <text x="20" y="240" fill="#ccc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">12kHz</text>
    <text x="20" y="255" fill="#00ff00" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">-1dB</text>
  </g>
  
  <!-- Band 9: 14kHz -->
  <g transform="translate(720, 60)">
    <rect x="18" y="20" width="4" height="200" fill="#333" rx="2" filter="url(#innerShadow)"/>
    <rect x="15" y="140" width="10" height="20" fill="url(#sliderGradient)" rx="5" filter="url(#dropShadow)"/>
    <text x="20" y="240" fill="#ccc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">14kHz</text>
    <text x="20" y="255" fill="#00ff00" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">-3dB</text>
  </g>
  
  <!-- dB Scale -->
  <g fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="end">
    <text x="70" y="85">+12dB</text>
    <text x="70" y="105">+9dB</text>
    <text x="70" y="125">+6dB</text>
    <text x="70" y="145">+3dB</text>
    <text x="70" y="165">0dB</text>
    <text x="70" y="185">-3dB</text>
    <text x="70" y="205">-6dB</text>
    <text x="70" y="225">-9dB</text>
    <text x="70" y="245">-12dB</text>
  </g>
  
  <!-- Center line (0dB) -->
  <line x1="80" y1="160" x2="740" y2="160" stroke="#555" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Control knobs section -->
  <g transform="translate(80, 290)">
    <!-- Low-pass filter -->
    <circle cx="50" cy="50" r="25" fill="url(#knobGradient)" filter="url(#dropShadow)"/>
    <circle cx="50" cy="50" r="3" fill="#333"/>
    <line x1="50" y1="30" x2="50" y2="35" stroke="#333" stroke-width="2"/>
    <text x="50" y="85" fill="#ccc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">LPF</text>
    <text x="50" y="97" fill="#00ff00" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">8kHz</text>
    
    <!-- High-pass filter -->
    <circle cx="150" cy="50" r="25" fill="url(#knobGradient)" filter="url(#dropShadow)"/>
    <circle cx="150" cy="50" r="3" fill="#333"/>
    <line x1="150" y1="30" x2="150" y2="35" stroke="#333" stroke-width="2"/>
    <text x="150" y="85" fill="#ccc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">HPF</text>
    <text x="150" y="97" fill="#00ff00" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">80Hz</text>
    
    <!-- Q Factor -->
    <circle cx="250" cy="50" r="25" fill="url(#knobGradient)" filter="url(#dropShadow)"/>
    <circle cx="250" cy="50" r="3" fill="#333"/>
    <line x1="265" y1="40" x2="260" y2="45" stroke="#333" stroke-width="2"/>
    <text x="250" y="85" fill="#ccc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Q</text>
    <text x="250" y="97" fill="#00ff00" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">0.7</text>
    
    <!-- Master Gain -->
    <circle cx="350" cy="50" r="25" fill="url(#knobGradient)" filter="url(#dropShadow)"/>
    <circle cx="350" cy="50" r="3" fill="#333"/>
    <line x1="340" y1="35" x2="345" y2="40" stroke="#333" stroke-width="2"/>
    <text x="350" y="85" fill="#ccc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">GAIN</text>
    <text x="350" y="97" fill="#00ff00" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">+2dB</text>
    
    <!-- Preset buttons -->
    <rect x="450" y="35" width="60" height="20" fill="#444" rx="3" filter="url(#dropShadow)"/>
    <text x="480" y="47" fill="#00d4ff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">VOCAL</text>
    
    <rect x="520" y="35" width="60" height="20" fill="#444" rx="3" filter="url(#dropShadow)"/>
    <text x="550" y="47" fill="#ccc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">MUSIC</text>
    
    <rect x="590" y="35" width="60" height="20" fill="#444" rx="3" filter="url(#dropShadow)"/>
    <text x="620" y="47" fill="#ccc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">MASTER</text>
    
    <rect x="450" y="60" width="60" height="20" fill="#444" rx="3" filter="url(#dropShadow)"/>
    <text x="480" y="72" fill="#ccc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">FLAT</text>
    
    <rect x="520" y="60" width="60" height="20" fill="#444" rx="3" filter="url(#dropShadow)"/>
    <text x="550" y="72" fill="#ccc" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">BASS+</text>
    
    <rect x="590" y="60" width="60" height="20" fill="#ff6b35" rx="3" filter="url(#dropShadow)"/>
    <text x="620" y="72" fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">RESET</text>
  </g>
  
  <!-- Status indicators -->
  <g transform="translate(700, 20)">
    <circle cx="10" cy="10" r="6" fill="#00ff00"/>
    <text x="25" y="15" fill="#00ff00" font-family="Arial, sans-serif" font-size="10">ACTIVE</text>
    
    <circle cx="70" cy="10" r="6" fill="#ff6b35"/>
    <text x="85" y="15" fill="#ff6b35" font-family="Arial, sans-serif" font-size="10">BYPASS</text>
  </g>
  
  <!-- Branding -->
  <text x="780" y="390" fill="#666" font-family="Arial, sans-serif" font-size="8" text-anchor="end">AINFLUE PRO AUDIO</text>
</svg>