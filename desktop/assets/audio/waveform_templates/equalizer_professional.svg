<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <defs>
    <linearGradient id="eqGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ffaa44;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#44ff44;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#4444ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aa44ff;stop-opacity:1" />
    </linearGradient>
    <filter id="eqGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="300" fill="#1a1a1a"/>
  
  <!-- EQ Panel Background -->
  <rect x="50" y="50" width="400" height="200" fill="#2a2a2a" stroke="#555" stroke-width="2" rx="10"/>
  
  <!-- Center line (0dB) -->
  <line x1="50" y1="150" x2="450" y2="150" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- EQ Bands -->
  <g stroke="#00ff88" stroke-width="3" fill="none" filter="url(#eqGlow)">
    <!-- Low Freq (Red) -->
    <circle cx="90" cy="120" r="8" fill="#ff4444" stroke="#ff4444"/>
    <line x1="90" y1="120" x2="90" y2="180"/>
    <rect x="85" y="175" width="10" height="20" fill="#ff4444"/>
    
    <!-- Low-Mid Freq (Orange) -->
    <circle cx="150" cy="100" r="8" fill="#ffaa44" stroke="#ffaa44"/>
    <line x1="150" y1="100" x2="150" y2="180"/>
    <rect x="145" y="175" width="10" height="20" fill="#ffaa44"/>
    
    <!-- Mid Freq (Green) -->
    <circle cx="210" cy="130" r="8" fill="#44ff44" stroke="#44ff44"/>
    <line x1="210" y1="130" x2="210" y2="180"/>
    <rect x="205" y="175" width="10" height="20" fill="#44ff44"/>
    
    <!-- High-Mid Freq (Blue) -->
    <circle cx="270" cy="110" r="8" fill="#4444ff" stroke="#4444ff"/>
    <line x1="270" y1="110" x2="270" y2="180"/>
    <rect x="265" y="175" width="10" height="20" fill="#4444ff"/>
    
    <!-- High Freq (Purple) -->
    <circle cx="330" cy="140" r="8" fill="#aa44ff" stroke="#aa44ff"/>
    <line x1="330" y1="140" x2="330" y2="180"/>
    <rect x="325" y="175" width="10" height="20" fill="#aa44ff"/>
    
    <!-- Ultra High Freq (Cyan) -->
    <circle cx="390" cy="160" r="8" fill="#44ffff" stroke="#44ffff"/>
    <line x1="390" y1="160" x2="390" y2="180"/>
    <rect x="385" y="175" width="10" height="20" fill="#44ffff"/>
  </g>
  
  <!-- Frequency Response Curve -->
  <path d="M 60 120 Q 90 120 120 100 Q 150 100 180 130 Q 210 130 240 110 Q 270 110 300 140 Q 330 140 360 160 Q 390 160 440 160" 
        fill="none" 
        stroke="url(#eqGradient)" 
        stroke-width="3" 
        filter="url(#eqGlow)"/>
  
  <!-- Grid lines -->
  <g stroke="#333" stroke-width="0.5" opacity="0.5">
    <line x1="50" y1="70" x2="450" y2="70"/>
    <line x1="50" y1="90" x2="450" y2="90"/>
    <line x1="50" y1="110" x2="450" y2="110"/>
    <line x1="50" y1="130" x2="450" y2="130"/>
    <line x1="50" y1="170" x2="450" y2="170"/>
    <line x1="50" y1="190" x2="450" y2="190"/>
    <line x1="50" y1="210" x2="450" y2="210"/>
    <line x1="50" y1="230" x2="450" y2="230"/>
  </g>
  
  <!-- Labels -->
  <g fill="#00ff88" font-family="Arial, sans-serif" font-size="12">
    <text x="180" y="30">Professional Equalizer</text>
    <text x="10" y="290">© Ainflue Studio - Fahed Mlaiel</text>
    
    <!-- Frequency labels -->
    <text x="80" y="215" font-size="10">60Hz</text>
    <text x="140" y="215" font-size="10">250Hz</text>
    <text x="200" y="215" font-size="10">1kHz</text>
    <text x="260" y="215" font-size="10">4kHz</text>
    <text x="320" y="215" font-size="10">8kHz</text>
    <text x="380" y="215" font-size="10">16kHz</text>
    
    <!-- dB labels -->
    <text x="15" y="75" font-size="10">+12</text>
    <text x="20" y="95" font-size="10">+6</text>
    <text x="25" y="115" font-size="10">+3</text>
    <text x="30" y="155" font-size="10">0</text>
    <text x="25" y="175" font-size="10">-3</text>
    <text x="20" y="195" font-size="10">-6</text>
    <text x="15" y="215" font-size="10">-12</text>
  </g>
  
  <!-- Control Indicators -->
  <g fill="#00ff88" font-family="Arial, sans-serif" font-size="8">
    <text x="460" y="100">GAIN</text>
    <text x="460" y="130">FREQ</text>
    <text x="460" y="160">Q</text>
    <text x="460" y="190">BYPASS</text>
  </g>
</svg>