<?xml version="1.0" encoding="UTF-8"?>
<!-- Professional Waveform Template - Ainflue Desktop Assets -->
<!-- Copyright (c) 2025 Fahed Mlaiel. All rights reserved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="waveformGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099cc;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#006699;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="peakGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc4200;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#1a1a1a" rx="8"/>
  
  <!-- Grid lines -->
  <g stroke="#333" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100"/> <!-- Center line -->
    <line x1="0" y1="50" x2="800" y2="50"/>   <!-- +50% line -->
    <line x1="0" y1="150" x2="800" y2="150"/> <!-- -50% line -->
    <line x1="0" y1="25" x2="800" y2="25"/>   <!-- +75% line -->
    <line x1="0" y1="175" x2="800" y2="175"/> <!-- -75% line -->
  </g>
  
  <!-- Time markers -->
  <g fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <text x="100" y="195">0:10</text>
    <text x="200" y="195">0:20</text>
    <text x="300" y="195">0:30</text>
    <text x="400" y="195">0:40</text>
    <text x="500" y="195">0:50</text>
    <text x="600" y="195">1:00</text>
    <text x="700" y="195">1:10</text>
  </g>
  
  <!-- Waveform data -->
  <g fill="url(#waveformGradient)" filter="url(#glow)">
    <!-- Professional audio waveform simulation -->
    <rect x="10" y="85" width="2" height="30"/>
    <rect x="15" y="75" width="2" height="50"/>
    <rect x="20" y="60" width="2" height="80"/>
    <rect x="25" y="45" width="2" height="110"/>
    <rect x="30" y="35" width="2" height="130"/>
    <rect x="35" y="40" width="2" height="120"/>
    <rect x="40" y="55" width="2" height="90"/>
    <rect x="45" y="70" width="2" height="60"/>
    <rect x="50" y="80" width="2" height="40"/>
    <rect x="55" y="75" width="2" height="50"/>
    <rect x="60" y="65" width="2" height="70"/>
    <rect x="65" y="50" width="2" height="100"/>
    <rect x="70" y="30" width="2" height="140"/>
    <rect x="75" y="20" width="2" height="160"/>
    <rect x="80" y="15" width="2" height="170"/>
    <rect x="85" y="25" width="2" height="150"/>
    <rect x="90" y="40" width="2" height="120"/>
    <rect x="95" y="60" width="2" height="80"/>
    
    <!-- Continue waveform pattern across width -->
    <rect x="100" y="70" width="2" height="60"/>
    <rect x="110" y="55" width="2" height="90"/>
    <rect x="120" y="35" width="2" height="130"/>
    <rect x="130" y="20" width="2" height="160"/>
    <rect x="140" y="10" width="2" height="180"/>
    <rect x="150" y="5" width="2" height="190"/>
    <rect x="160" y="15" width="2" height="170"/>
    <rect x="170" y="30" width="2" height="140"/>
    <rect x="180" y="50" width="2" height="100"/>
    <rect x="190" y="75" width="2" height="50"/>
    
    <!-- Peak section with different color -->
    <g fill="url(#peakGradient)">
      <rect x="200" y="5" width="2" height="190"/>
      <rect x="210" y="2" width="2" height="196"/>
      <rect x="220" y="8" width="2" height="184"/>
      <rect x="230" y="12" width="2" height="176"/>
      <rect x="240" y="18" width="2" height="164"/>
      <rect x="250" y="25" width="2" height="150"/>
    </g>
    
    <!-- Continue normal pattern -->
    <rect x="260" y="40" width="2" height="120"/>
    <rect x="270" y="60" width="2" height="80"/>
    <rect x="280" y="80" width="2" height="40"/>
    <rect x="290" y="85" width="2" height="30"/>
    <rect x="300" y="75" width="2" height="50"/>
    <rect x="310" y="55" width="2" height="90"/>
    <rect x="320" y="35" width="2" height="130"/>
    <rect x="330" y="25" width="2" height="150"/>
    <rect x="340" y="40" width="2" height="120"/>
    <rect x="350" y="65" width="2" height="70"/>
    
    <!-- More dynamic sections -->
    <rect x="400" y="30" width="2" height="140"/>
    <rect x="420" y="15" width="2" height="170"/>
    <rect x="440" y="35" width="2" height="130"/>
    <rect x="460" y="60" width="2" height="80"/>
    <rect x="480" y="85" width="2" height="30"/>
    <rect x="500" y="75" width="2" height="50"/>
    <rect x="520" y="45" width="2" height="110"/>
    <rect x="540" y="25" width="2" height="150"/>
    <rect x="560" y="35" width="2" height="130"/>
    <rect x="580" y="55" width="2" height="90"/>
    
    <!-- Fade out section -->
    <rect x="600" y="70" width="2" height="60"/>
    <rect x="620" y="80" width="2" height="40"/>
    <rect x="640" y="85" width="2" height="30"/>
    <rect x="660" y="88" width="2" height="24"/>
    <rect x="680" y="92" width="2" height="16"/>
    <rect x="700" y="95" width="2" height="10"/>
    <rect x="720" y="97" width="2" height="6"/>
    <rect x="740" y="98" width="2" height="4"/>
    <rect x="760" y="99" width="2" height="2"/>
    <rect x="780" y="100" width="2" height="1"/>
  </g>
  
  <!-- Level indicators -->
  <g fill="#00ff00" font-family="Arial, sans-serif" font-size="8">
    <text x="5" y="30" text-anchor="start">+12dB</text>
    <text x="5" y="55" text-anchor="start">+6dB</text>
    <text x="5" y="105" text-anchor="start">0dB</text>
    <text x="5" y="155" text-anchor="start">-6dB</text>
    <text x="5" y="180" text-anchor="start">-12dB</text>
  </g>
  
  <!-- Professional branding -->
  <text x="750" y="15" fill="#666" font-family="Arial, sans-serif" font-size="8" text-anchor="end">AINFLUE PRO</text>
</svg>