<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 50" width="150" height="50">
  <defs>
    <linearGradient id="wavGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <filter id="badgeGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Badge Background -->
  <rect x="5" y="5" width="140" height="40" fill="url(#wavGradient)" stroke="#0D47A1" stroke-width="2" rx="8" filter="url(#badgeGlow)"/>
  
  <!-- Waveform Icon -->
  <rect x="18" y="18" width="14" height="14" fill="#FFFFFF" rx="2" opacity="0.9"/>
  <path d="M 20 25 L 22 20 L 24 30 L 26 18 L 28 27 L 30 22" stroke="#1565C0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Text -->
  <text x="40" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">WAV</text>
  <text x="40" y="35" font-family="Arial, sans-serif" font-size="10" fill="#E3F2FD">Uncompressed</text>
  
  <!-- Quality indicator -->
  <circle cx="125" cy="15" r="4" fill="#FFFFFF"/>
  <circle cx="125" cy="25" r="4" fill="#FFFFFF"/>
  <circle cx="125" cy="35" r="4" fill="#FFFFFF"/>
  
  <!-- Professional badge -->
  <text x="95" y="20" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">PRO</text>
  
  <!-- Copyright -->
  <text x="75" y="48" font-family="Arial, sans-serif" font-size="6" fill="#0D47A1">© Ainflue</text>
</svg>