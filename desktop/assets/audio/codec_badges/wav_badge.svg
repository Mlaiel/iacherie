<?xml version="1.0" encoding="UTF-8"?>
<!-- WAV Audio Codec Badge - Ainflue Desktop Assets -->
<!-- Copyright (c) 2025 Fahed Mlaiel. All rights reserved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="wavGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <filter id="badgeShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Badge background -->
  <rect width="120" height="40" fill="url(#wavGradient)" rx="8" filter="url(#badgeShadow)"/>
  
  <!-- Inner border -->
  <rect x="2" y="2" width="116" height="36" fill="none" stroke="#42A5F5" stroke-width="0.5" rx="6"/>
  
  <!-- Format label -->
  <text x="60" y="16" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WAV</text>
  
  <!-- Description -->
  <text x="60" y="28" fill="#E3F2FD" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">UNCOMPRESSED</text>
  
  <!-- Quality indicator -->
  <circle cx="15" cy="12" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="105" cy="12" r="3" fill="#ffffff" opacity="0.9"/>
  
  <!-- Waveform icon -->
  <g transform="translate(8, 18)" fill="#ffffff" opacity="0.8">
    <path d="M0,10 Q2,5 4,10 T8,10 T12,10 T16,10" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <path d="M0,12 Q2,17 4,12 T8,12 T12,12 T16,12" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- PCM indicator -->
  <text x="98" y="32" fill="#ffffff" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" opacity="0.8">PCM</text>
  
  <!-- Professional grade stars -->
  <g transform="translate(95, 20)" fill="#ffffff" opacity="0.9">
    <polygon points="5,2 6,4 9,4 7,6 8,9 5,7 2,9 3,6 1,4 4,4"/>
    <polygon points="12,2 13,4 16,4 14,6 15,9 12,7 9,9 10,6 8,4 11,4"/>
    <polygon points="19,2 20,4 23,4 21,6 22,9 19,7 16,9 17,6 15,4 18,4"/>
  </g>
  
  <!-- Copyright mark -->
  <text x="115" y="35" fill="#ffffff" font-family="Arial, sans-serif" font-size="6" text-anchor="end" opacity="0.6">©FM</text>
</svg>