<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="opusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A148C;stop-opacity:1" />
    </linearGradient>
    <filter id="badgeShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Badge background -->
  <rect width="120" height="40" fill="url(#opusGradient)" rx="8" filter="url(#badgeShadow)"/>
  
  <!-- Inner border -->
  <rect x="2" y="2" width="116" height="36" fill="none" stroke="#BA68C8" stroke-width="0.5" rx="6"/>
  
  <!-- Format label -->
  <text x="60" y="16" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">OPUS</text>
  
  <!-- Description -->
  <text x="60" y="28" fill="#F3E5F5" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">LOW LATENCY</text>
  
  <!-- Quality indicator -->
  <circle cx="15" cy="12" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="105" cy="12" r="3" fill="#ffffff" opacity="0.9"/>
  
  <!-- Modern codec icon -->
  <g transform="translate(8, 18)" fill="#ffffff" opacity="0.8">
    <rect x="0" y="8" width="1" height="4" rx="0.5"/>
    <rect x="2" y="6" width="1" height="8" rx="0.5"/>
    <rect x="4" y="4" width="1" height="12" rx="0.5"/>
    <rect x="6" y="2" width="1" height="16" rx="0.5"/>
    <rect x="8" y="1" width="1" height="18" rx="0.5"/>
    <rect x="10" y="3" width="1" height="14" rx="0.5"/>
    <rect x="12" y="5" width="1" height="10" rx="0.5"/>
    <rect x="14" y="7" width="1" height="6" rx="0.5"/>
    <rect x="16" y="9" width="1" height="2" rx="0.5"/>
  </g>
  
  <!-- Advanced tech stars -->
  <g transform="translate(93, 20)" fill="#ffffff" opacity="0.9">
    <polygon points="5,2 6,4 9,4 7,6 8,9 5,7 2,9 3,6 1,4 4,4"/>
    <polygon points="12,2 13,4 16,4 14,6 15,9 12,7 9,9 10,6 8,4 11,4"/>
    <polygon points="19,2 20,4 23,4 21,6 22,9 19,7 16,9 17,6 15,4 18,4"/>
    <polygon points="26,2 27,4 30,4 28,6 29,9 26,7 23,9 24,6 22,4 25,4"/>
  </g>
  
  <!-- Copyright mark -->
  <text x="115" y="35" fill="#ffffff" font-family="Arial, sans-serif" font-size="6" text-anchor="end" opacity="0.6">©FM</text>
</svg>