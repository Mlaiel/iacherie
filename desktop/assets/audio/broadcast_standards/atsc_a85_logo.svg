<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="atscGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#388E3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Background -->
  <rect x="5" y="5" width="190" height="70" fill="url(#atscGradient)" stroke="#1B5E20" stroke-width="2" rx="8" filter="url(#logoGlow)"/>
  
  <!-- ATSC Logo -->
  <rect x="30" y="20" width="40" height="40" fill="#FFFFFF" opacity="0.95" rx="6"/>
  <rect x="35" y="25" width="30" height="30" fill="#388E3C" rx="4"/>
  
  <!-- Signal waves -->
  <path d="M 40 35 Q 45 30 50 35 Q 55 40 60 35" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 40 40 Q 45 35 50 40 Q 55 45 60 40" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 40 45 Q 45 40 50 45 Q 55 50 60 45" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Main Title -->
  <text x="85" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">ATSC A/85</text>
  <text x="85" y="45" font-family="Arial, sans-serif" font-size="12" fill="#C8E6C9">Digital TV Audio</text>
  <text x="85" y="58" font-family="Arial, sans-serif" font-size="10" fill="#E8F5E8">-24 LKFS Target</text>
  
  <!-- US Standard badge -->
  <rect x="155" y="20" width="30" height="35" fill="#FFFFFF" opacity="0.1" rx="4"/>
  <text x="170" y="32" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">US</text>
  <text x="170" y="42" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STD</text>
  <text x="170" y="52" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DTV</text>
  
  <!-- Level indicators -->
  <rect x="158" y="20" width="3" height="8" fill="#FFFFFF" opacity="0.6"/>
  <rect x="162" y="18" width="3" height="12" fill="#FFFFFF" opacity="0.8"/>
  <rect x="166" y="16" width="3" height="16" fill="#FFFFFF" opacity="1.0"/>
  <rect x="170" y="18" width="3" height="12" fill="#FFFFFF" opacity="0.8"/>
  <rect x="174" y="20" width="3" height="8" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Copyright -->
  <text x="100" y="78" font-family="Arial, sans-serif" font-size="8" fill="#1B5E20" text-anchor="middle">© Ainflue Studio - ATSC Certified</text>
</svg>