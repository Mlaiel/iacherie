<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="ebuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Background -->
  <rect x="5" y="5" width="190" height="70" fill="url(#ebuGradient)" stroke="#0D47A1" stroke-width="2" rx="8" filter="url(#logoGlow)"/>
  
  <!-- EBU Circle Logo -->
  <circle cx="50" cy="40" r="20" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="50" cy="40" r="15" fill="#1976D2"/>
  <text x="50" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EBU</text>
  
  <!-- Main Title -->
  <text x="85" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">EBU R128</text>
  <text x="85" y="48" font-family="Arial, sans-serif" font-size="12" fill="#E3F2FD">Loudness Standard</text>
  <text x="85" y="62" font-family="Arial, sans-serif" font-size="10" fill="#BBDEFB">-23 LUFS Target</text>
  
  <!-- Professional Certification -->
  <rect x="150" y="15" width="35" height="50" fill="#FFFFFF" opacity="0.1" rx="4"/>
  <text x="167" y="28" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PROF</text>
  <text x="167" y="38" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CERT</text>
  
  <!-- Measurement icons -->
  <rect x="155" y="45" width="4" height="15" fill="#FFFFFF" opacity="0.7"/>
  <rect x="160" y="42" width="4" height="18" fill="#FFFFFF" opacity="0.9"/>
  <rect x="165" y="40" width="4" height="20" fill="#FFFFFF" opacity="1.0"/>
  <rect x="170" y="43" width="4" height="17" fill="#FFFFFF" opacity="0.8"/>
  <rect x="175" y="47" width="4" height="13" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Copyright -->
  <text x="100" y="78" font-family="Arial, sans-serif" font-size="8" fill="#0D47A1" text-anchor="middle">© Ainflue Studio - Professional Audio</text>
</svg>