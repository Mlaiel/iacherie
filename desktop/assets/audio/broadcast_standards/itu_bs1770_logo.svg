<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="ituGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Background -->
  <rect x="5" y="5" width="190" height="70" fill="url(#ituGradient)" stroke="#B71C1C" stroke-width="2" rx="8" filter="url(#logoGlow)"/>
  
  <!-- ITU Globe Logo -->
  <circle cx="50" cy="40" r="20" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="50" cy="40" r="15" fill="#D32F2F"/>
  
  <!-- Globe grid -->
  <circle cx="50" cy="40" r="12" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
  <line x1="38" y1="40" x2="62" y2="40" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
  <line x1="50" y1="28" x2="50" y2="52" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
  <path d="M 42 32 Q 50 36 58 32" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
  <path d="M 42 48 Q 50 44 58 48" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>
  
  <!-- Main Title -->
  <text x="85" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">ITU-R</text>
  <text x="85" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">BS.1770</text>
  <text x="85" y="55" font-family="Arial, sans-serif" font-size="11" fill="#FFCDD2">Loudness Measurement</text>
  <text x="85" y="67" font-family="Arial, sans-serif" font-size="9" fill="#FFEBEE">International Standard</text>
  
  <!-- Technical indicators -->
  <rect x="155" y="15" width="30" height="45" fill="#FFFFFF" opacity="0.1" rx="4"/>
  <text x="170" y="28" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GATED</text>
  <text x="170" y="38" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LUFS</text>
  <text x="170" y="48" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TRUE</text>
  <text x="170" y="57" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PEAK</text>
  
  <!-- Copyright -->
  <text x="100" y="78" font-family="Arial, sans-serif" font-size="8" fill="#B71C1C" text-anchor="middle">© Ainflue Studio - ITU-R Compliant</text>
</svg>