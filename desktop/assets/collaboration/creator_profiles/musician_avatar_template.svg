<?xml version="1.0" encoding="UTF-8"?>
<!-- Musician Avatar Template -->
<!-- © 2025 Fahed Mlaiel - Ainflue Studio -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="musicianGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9f40ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b21a8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveformGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00cc6a;stop-opacity:0.8" />
    </linearGradient>
    <filter id="avatarShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#musicianGradient)" filter="url(#avatarShadow)"/>
  
  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  
  <!-- Music Note Icon -->
  <g transform="translate(80, 70)">
    <!-- Staff lines -->
    <line x1="0" y1="20" x2="40" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="25" x2="40" y2="25" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="30" x2="40" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="35" x2="40" y2="35" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="40" x2="40" y2="40" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    
    <!-- Music note -->
    <ellipse cx="8" cy="32" rx="4" ry="3" fill="#ffffff"/>
    <rect x="12" y="15" width="2" height="17" fill="#ffffff"/>
    <path d="M 14,15 Q 18,12 22,15 Q 18,18 14,15" fill="#ffffff"/>
  </g>
  
  <!-- Waveform visualization -->
  <g transform="translate(20, 130)">
    <rect x="0" y="15" width="2" height="10" fill="url(#waveformGradient)" rx="1"/>
    <rect x="5" y="10" width="2" height="20" fill="url(#waveformGradient)" rx="1"/>
    <rect x="10" y="5" width="2" height="30" fill="url(#waveformGradient)" rx="1"/>
    <rect x="15" y="12" width="2" height="16" fill="url(#waveformGradient)" rx="1"/>
    <rect x="20" y="8" width="2" height="24" fill="url(#waveformGradient)" rx="1"/>
    <rect x="25" y="3" width="2" height="34" fill="url(#waveformGradient)" rx="1"/>
    <rect x="30" y="10" width="2" height="20" fill="url(#waveformGradient)" rx="1"/>
    <rect x="35" y="7" width="2" height="26" fill="url(#waveformGradient)" rx="1"/>
    <rect x="40" y="12" width="2" height="16" fill="url(#waveformGradient)" rx="1"/>
    <rect x="45" y="5" width="2" height="30" fill="url(#waveformGradient)" rx="1"/>
    <rect x="50" y="15" width="2" height="10" fill="url(#waveformGradient)" rx="1"/>
    
    <!-- Continue pattern -->
    <rect x="55" y="8" width="2" height="24" fill="url(#waveformGradient)" rx="1"/>
    <rect x="60" y="12" width="2" height="16" fill="url(#waveformGradient)" rx="1"/>
    <rect x="65" y="6" width="2" height="28" fill="url(#waveformGradient)" rx="1"/>
    <rect x="70" y="14" width="2" height="12" fill="url(#waveformGradient)" rx="1"/>
    <rect x="75" y="9" width="2" height="22" fill="url(#waveformGradient)" rx="1"/>
    <rect x="80" y="11" width="2" height="18" fill="url(#waveformGradient)" rx="1"/>
    <rect x="85" y="7" width="2" height="26" fill="url(#waveformGradient)" rx="1"/>
    <rect x="90" y="13" width="2" height="14" fill="url(#waveformGradient)" rx="1"/>
    <rect x="95" y="4" width="2" height="32" fill="url(#waveformGradient)" rx="1"/>
    <rect x="100" y="10" width="2" height="20" fill="url(#waveformGradient)" rx="1"/>
    <rect x="105" y="6" width="2" height="28" fill="url(#waveformGradient)" rx="1"/>
    <rect x="110" y="15" width="2" height="10" fill="url(#waveformGradient)" rx="1"/>
    <rect x="115" y="8" width="2" height="24" fill="url(#waveformGradient)" rx="1"/>
    <rect x="120" y="12" width="2" height="16" fill="url(#waveformGradient)" rx="1"/>
    <rect x="125" y="5" width="2" height="30" fill="url(#waveformGradient)" rx="1"/>
    <rect x="130" y="14" width="2" height="12" fill="url(#waveformGradient)" rx="1"/>
    <rect x="135" y="9" width="2" height="22" fill="url(#waveformGradient)" rx="1"/>
    <rect x="140" y="11" width="2" height="18" fill="url(#waveformGradient)" rx="1"/>
    <rect x="145" y="7" width="2" height="26" fill="url(#waveformGradient)" rx="1"/>
    <rect x="150" y="16" width="2" height="8" fill="url(#waveformGradient)" rx="1"/>
    <rect x="155" y="13" width="2" height="14" fill="url(#waveformGradient)" rx="1"/>
    <rect x="160" y="10" width="2" height="20" fill="url(#waveformGradient)" rx="1"/>
  </g>
  
  <!-- Status Badge -->
  <circle cx="160" cy="40" r="15" fill="#00ff88"/>
  <text x="160" y="46" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a202c" text-anchor="middle">♪</text>
  
  <!-- Bottom Label -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MUSICIAN</text>
</svg>