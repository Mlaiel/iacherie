<?xml version="1.0" encoding="UTF-8"?>
<!-- AI-Powered Machine Learning Predictions Dashboard -->
<!-- © 2025 Fahed Mlaiel - Ainflue Studio -->
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="predictionGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#9f40ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#9f40ff;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="actualGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.8" />
    </linearGradient>
    <filter id="aiGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#mlGradient)" rx="12"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="560" height="50" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="8"/>
  <text x="30" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">AI-Powered Content Performance Predictions</text>
  <text x="30" y="58" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e0">Machine learning model accuracy: 94.7%</text>
  
  <!-- AI Brain Icon -->
  <g transform="translate(520, 25)">
    <circle cx="20" cy="20" r="15" fill="#9f40ff" filter="url(#aiGlow)"/>
    <text x="20" y="26" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">🤖</text>
  </g>
  
  <!-- Main Chart Area -->
  <rect x="80" y="90" width="480" height="200" fill="none" stroke="#4a5568" stroke-width="1" rx="4"/>
  
  <!-- Grid Lines -->
  <g stroke="#4a5568" stroke-width="0.5" opacity="0.3">
    <!-- Horizontal lines -->
    <line x1="80" y1="130" x2="560" y2="130"/>
    <line x1="80" y1="170" x2="560" y2="170"/>
    <line x1="80" y1="210" x2="560" y2="210"/>
    <line x1="80" y1="250" x2="560" y2="250"/>
    
    <!-- Vertical lines -->
    <line x1="160" y1="90" x2="160" y2="290"/>
    <line x1="240" y1="90" x2="240" y2="290"/>
    <line x1="320" y1="90" x2="320" y2="290"/>
    <line x1="400" y1="90" x2="400" y2="290"/>
    <line x1="480" y1="90" x2="480" y2="290"/>
  </g>
  
  <!-- Y-axis labels -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0" text-anchor="end">
    <text x="75" y="95">100k</text>
    <text x="75" y="135">75k</text>
    <text x="75" y="175">50k</text>
    <text x="75" y="215">25k</text>
    <text x="75" y="255">10k</text>
    <text x="75" y="295">0</text>
  </g>
  
  <!-- X-axis labels -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0" text-anchor="middle">
    <text x="120" y="310">Week 1</text>
    <text x="200" y="310">Week 2</text>
    <text x="280" y="310">Week 3</text>
    <text x="360" y="310">Week 4</text>
    <text x="440" y="310">Week 5</text>
    <text x="520" y="310">Week 6</text>
  </g>
  
  <!-- Historical Data (Actual) -->
  <path d="M 120,270 L 160,250 L 200,220 L 240,200 L 280,180"
        fill="none" stroke="#00ff88" stroke-width="3" filter="url(#aiGlow)"/>
  
  <!-- Area under historical curve -->
  <path d="M 120,270 L 160,250 L 200,220 L 240,200 L 280,180 L 280,290 L 120,290 Z"
        fill="url(#actualGradient)"/>
  
  <!-- AI Prediction Line -->
  <path d="M 280,180 L 320,160 L 360,140 L 400,125 L 440,115 L 480,110 L 520,105"
        fill="none" stroke="#9f40ff" stroke-width="3" stroke-dasharray="8,4" filter="url(#aiGlow)"/>
  
  <!-- Prediction area -->
  <path d="M 280,180 L 320,160 L 360,140 L 400,125 L 440,115 L 480,110 L 520,105 L 520,290 L 280,290 Z"
        fill="url(#predictionGradient)"/>
  
  <!-- Data points -->
  <g fill="#00ff88" stroke="#1a202c" stroke-width="2">
    <circle cx="120" cy="270" r="4"/>
    <circle cx="160" cy="250" r="4"/>
    <circle cx="200" cy="220" r="4"/>
    <circle cx="240" cy="200" r="4"/>
    <circle cx="280" cy="180" r="4"/>
  </g>
  
  <!-- Prediction points -->
  <g fill="#9f40ff" stroke="#1a202c" stroke-width="2">
    <circle cx="320" cy="160" r="4"/>
    <circle cx="360" cy="140" r="4"/>
    <circle cx="400" cy="125" r="4"/>
    <circle cx="440" cy="115" r="4"/>
    <circle cx="480" cy="110" r="4"/>
    <circle cx="520" cy="105" r="4"/>
  </g>
  
  <!-- Current point highlight -->
  <circle cx="280" cy="180" r="8" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.8">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Legend -->
  <g transform="translate(90, 320)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#00ff88" stroke-width="3"/>
    <text x="25" y="5" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">Actual Performance</text>
    
    <line x1="150" y1="0" x2="170" y2="0" stroke="#9f40ff" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="175" y="5" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">AI Prediction</text>
  </g>
  
  <!-- Statistics Panel -->
  <rect x="20" y="340" width="560" height="45" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="6"/>
  
  <!-- Current Stats -->
  <g font-family="Arial, sans-serif">
    <text x="30" y="358" font-size="12" font-weight="bold" fill="#ffffff">Current Week Performance</text>
    <text x="30" y="375" font-size="20" font-weight="bold" fill="#00ff88">47,250 views</text>
    
    <!-- Prediction Stats -->
    <text x="200" y="358" font-size="12" font-weight="bold" fill="#ffffff">Next Week Prediction</text>
    <text x="200" y="375" font-size="20" font-weight="bold" fill="#9f40ff">62,100 views</text>
    <text x="200" y="387" font-size="8" fill="#cbd5e0">+31.4% growth predicted</text>
    
    <!-- Confidence -->
    <text x="380" y="358" font-size="12" font-weight="bold" fill="#ffffff">Confidence Level</text>
    <text x="380" y="375" font-size="20" font-weight="bold" fill="#f59e0b">94.7%</text>
    <text x="380" y="387" font-size="8" fill="#cbd5e0">High accuracy model</text>
    
    <!-- Model Status -->
    <circle cx="520" cy="365" r="6" fill="#00ff88"/>
    <text x="535" y="370" font-size="10" font-weight="bold" fill="#00ff88">Model Active</text>
  </g>
</svg>