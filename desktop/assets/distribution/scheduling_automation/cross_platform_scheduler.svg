<?xml version="1.0" encoding="UTF-8"?>
<!-- Cross-Platform Scheduler Interface -->
<!-- © 2025 Fahed Mlaiel - Ainflue Studio -->
<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="schedulerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="publishGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc6a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="url(#schedulerGradient)" rx="12"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="460" height="50" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="8"/>
  <text x="30" y="42" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Cross-Platform Content Scheduler</text>
  <text x="30" y="58" font-family="Arial, sans-serif" font-size="11" fill="#cbd5e0">Schedule across 15+ platforms simultaneously</text>
  
  <!-- Platform Grid -->
  <g id="platforms">
    <!-- YouTube -->
    <rect x="30" y="90" width="100" height="60" fill="#ff0000" fill-opacity="0.2" stroke="#ff0000" stroke-width="2" rx="6"/>
    <text x="80" y="108" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">YouTube</text>
    <text x="80" y="125" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e0" text-anchor="middle">Scheduled: 2:00 PM</text>
    <circle cx="110" cy="100" r="6" fill="#00ff88"/>
    <text x="80" y="142" font-family="Arial, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle">Ready to publish</text>
    
    <!-- Spotify -->
    <rect x="140" y="90" width="100" height="60" fill="#1db954" fill-opacity="0.2" stroke="#1db954" stroke-width="2" rx="6"/>
    <text x="190" y="108" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Spotify</text>
    <text x="190" y="125" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e0" text-anchor="middle">Scheduled: 2:15 PM</text>
    <circle cx="220" cy="100" r="6" fill="#00ff88"/>
    <text x="190" y="142" font-family="Arial, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle">Ready to publish</text>
    
    <!-- Apple Music -->
    <rect x="250" y="90" width="100" height="60" fill="#fa57c1" fill-opacity="0.2" stroke="#fa57c1" stroke-width="2" rx="6"/>
    <text x="300" y="108" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Apple Music</text>
    <text x="300" y="125" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e0" text-anchor="middle">Scheduled: 2:30 PM</text>
    <circle cx="330" cy="100" r="6" fill="#00ff88"/>
    <text x="300" y="142" font-family="Arial, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle">Ready to publish</text>
    
    <!-- TikTok -->
    <rect x="360" y="90" width="100" height="60" fill="#ff0050" fill-opacity="0.2" stroke="#ff0050" stroke-width="2" rx="6"/>
    <text x="410" y="108" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">TikTok</text>
    <text x="410" y="125" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e0" text-anchor="middle">Scheduled: 3:00 PM</text>
    <circle cx="440" cy="100" r="6" fill="#f59e0b"/>
    <text x="410" y="142" font-family="Arial, sans-serif" font-size="8" fill="#f59e0b" text-anchor="middle">Processing</text>
    
    <!-- Instagram -->
    <rect x="30" y="170" width="100" height="60" fill="#e4405f" fill-opacity="0.2" stroke="#e4405f" stroke-width="2" rx="6"/>
    <text x="80" y="188" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Instagram</text>
    <text x="80" y="205" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e0" text-anchor="middle">Scheduled: 4:00 PM</text>
    <circle cx="110" cy="180" r="6" fill="#00ff88"/>
    <text x="80" y="222" font-family="Arial, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle">Ready to publish</text>
    
    <!-- SoundCloud -->
    <rect x="140" y="170" width="100" height="60" fill="#ff5500" fill-opacity="0.2" stroke="#ff5500" stroke-width="2" rx="6"/>
    <text x="190" y="188" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SoundCloud</text>
    <text x="190" y="205" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e0" text-anchor="middle">Scheduled: 4:15 PM</text>
    <circle cx="220" cy="180" r="6" fill="#00ff88"/>
    <text x="190" y="222" font-family="Arial, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle">Ready to publish</text>
    
    <!-- Bandcamp -->
    <rect x="250" y="170" width="100" height="60" fill="#629aa0" fill-opacity="0.2" stroke="#629aa0" stroke-width="2" rx="6"/>
    <text x="300" y="188" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Bandcamp</text>
    <text x="300" y="205" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e0" text-anchor="middle">Scheduled: 5:00 PM</text>
    <circle cx="330" cy="180" r="6" fill="#00ff88"/>
    <text x="300" y="222" font-family="Arial, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle">Ready to publish</text>
    
    <!-- Twitter/X -->
    <rect x="360" y="170" width="100" height="60" fill="#1da1f2" fill-opacity="0.2" stroke="#1da1f2" stroke-width="2" rx="6"/>
    <text x="410" y="188" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Twitter/X</text>
    <text x="410" y="205" font-family="Arial, sans-serif" font-size="8" fill="#cbd5e0" text-anchor="middle">Scheduled: 6:00 PM</text>
    <circle cx="440" cy="180" r="6" fill="#00ff88"/>
    <text x="410" y="222" font-family="Arial, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle">Ready to publish</text>
  </g>
  
  <!-- Timeline -->
  <rect x="30" y="250" width="430" height="80" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="8"/>
  <text x="40" y="270" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Publishing Timeline</text>
  
  <!-- Timeline bars -->
  <rect x="40" y="280" width="400" height="4" fill="#4a5568" rx="2"/>
  <rect x="40" y="280" width="200" height="4" fill="url(#publishGradient)" rx="2"/>
  
  <!-- Time markers -->
  <g font-family="Arial, sans-serif" font-size="8" fill="#cbd5e0">
    <text x="40" y="295">2:00 PM</text>
    <text x="140" y="295">4:00 PM</text>
    <text x="240" y="295">6:00 PM</text>
    <text x="340" y="295">8:00 PM</text>
    <text x="420" y="295">10:00 PM</text>
  </g>
  
  <!-- Current time indicator -->
  <line x1="240" y1="275" x2="240" y2="290" stroke="#00ff88" stroke-width="2"/>
  <circle cx="240" cy="282" r="3" fill="#00ff88"/>
  <text x="240" y="305" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#00ff88" text-anchor="middle">NOW</text>
  
  <!-- Control Panel -->
  <rect x="30" y="340" width="430" height="40" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="8"/>
  
  <!-- Publish Now Button -->
  <rect x="40" y="350" width="80" height="20" fill="url(#publishGradient)" rx="10"/>
  <text x="80" y="363" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#1a202c" text-anchor="middle">Publish Now</text>
  
  <!-- Schedule Button -->
  <rect x="130" y="350" width="80" height="20" fill="#4a5568" stroke="#6b7280" stroke-width="1" rx="10"/>
  <text x="170" y="363" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">Reschedule</text>
  
  <!-- Analytics Button -->
  <rect x="220" y="350" width="80" height="20" fill="#9f40ff" rx="10"/>
  <text x="260" y="363" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">Analytics</text>
  
  <!-- Status -->
  <text x="320" y="363" font-family="Arial, sans-serif" font-size="9" fill="#cbd5e0">7/8 platforms ready</text>
  <circle cx="430" cy="360" r="5" fill="#00ff88"/>
  <text x="445" y="365" font-family="Arial, sans-serif" font-size="8" fill="#00ff88">Online</text>
</svg>