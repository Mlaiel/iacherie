<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="seoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8BC34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CDDC39;stop-opacity:1" />
    </linearGradient>
    <filter id="seoGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a1a"/>
  
  <!-- Gauge Background -->
  <circle cx="200" cy="150" r="100" fill="#2a2a2a" stroke="#444" stroke-width="4"/>
  <circle cx="200" cy="150" r="80" fill="#1a1a1a"/>
  
  <!-- Score Arc Background -->
  <path d="M 130 150 A 70 70 0 1 1 270 150" 
        fill="none" 
        stroke="#333" 
        stroke-width="15" 
        stroke-linecap="round"/>
  
  <!-- Score Arc -->
  <path d="M 130 150 A 70 70 0 0 1 235 95" 
        fill="none" 
        stroke="url(#seoGradient)" 
        stroke-width="15" 
        stroke-linecap="round"
        filter="url(#seoGlow)"/>
  
  <!-- Center Score Display -->
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#4CAF50" text-anchor="middle">87</text>
  <text x="200" y="165" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">SEO Score</text>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">Excellent</text>
  
  <!-- Scale Markings -->
  <g stroke="#666" stroke-width="2">
    <line x1="130" y1="150" x2="140" y2="150"/>
    <line x1="166" y1="95" x2="172" y2="102"/>
    <line x1="200" y1="80" x2="200" y2="90"/>
    <line x1="234" y1="95" x2="228" y2="102"/>
    <line x1="270" y1="150" x2="260" y2="150"/>
  </g>
  
  <!-- Scale Labels -->
  <g fill="#999" font-family="Arial, sans-serif" font-size="10">
    <text x="120" y="155">0</text>
    <text x="160" y="90">25</text>
    <text x="195" y="75">50</text>
    <text x="235" y="90">75</text>
    <text x="275" y="155">100</text>
  </g>
  
  <!-- Indicator Needle -->
  <line x1="200" y1="150" x2="235" y2="95" stroke="#4CAF50" stroke-width="3" stroke-linecap="round" filter="url(#seoGlow)"/>
  <circle cx="235" cy="95" r="4" fill="#4CAF50"/>
  <circle cx="200" cy="150" r="6" fill="#4CAF50"/>
  
  <!-- Performance Indicators -->
  <rect x="50" y="20" width="300" height="40" fill="#2a2a2a" stroke="#444" stroke-width="1" rx="8"/>
  <text x="200" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SEO Performance Dashboard</text>
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">Real-time optimization tracking</text>
  
  <!-- Metric Cards -->
  <g transform="translate(20, 250)">
    <!-- Keywords -->
    <rect x="0" y="0" width="80" height="40" fill="#4CAF50" rx="4" opacity="0.8"/>
    <text x="40" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Keywords</text>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">94%</text>
    <text x="40" y="38" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">Optimized</text>
    
    <!-- Meta Tags -->
    <rect x="90" y="0" width="80" height="40" fill="#8BC34A" rx="4" opacity="0.8"/>
    <text x="130" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Meta Tags</text>
    <text x="130" y="28" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">89%</text>
    <text x="130" y="38" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">Complete</text>
    
    <!-- Content -->
    <rect x="180" y="0" width="80" height="40" fill="#CDDC39" rx="4" opacity="0.8"/>
    <text x="220" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333" text-anchor="middle">Content</text>
    <text x="220" y="28" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">91%</text>
    <text x="220" y="38" font-family="Arial, sans-serif" font-size="8" fill="#333" text-anchor="middle">Quality</text>
    
    <!-- Backlinks -->
    <rect x="270" y="0" width="80" height="40" fill="#FF9800" rx="4" opacity="0.8"/>
    <text x="310" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Backlinks</text>
    <text x="310" y="28" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">73%</text>
    <text x="310" y="38" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">Authority</text>
  </g>
  
  <!-- Trend Indicators -->
  <g fill="#4CAF50" font-family="Arial, sans-serif" font-size="12">
    <text x="320" y="120">↗ +12%</text>
    <text x="320" y="135" font-size="8" fill="#999">This month</text>
  </g>
  
  <!-- Action Items -->
  <rect x="320" y="160" width="70" height="60" fill="#2a2a2a" stroke="#444" stroke-width="1" rx="4"/>
  <text x="355" y="175" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Actions</text>
  <text x="325" y="190" font-family="Arial, sans-serif" font-size="8" fill="#4CAF50">✓ Title optimized</text>
  <text x="325" y="200" font-family="Arial, sans-serif" font-size="8" fill="#4CAF50">✓ Meta updated</text>
  <text x="325" y="210" font-family="Arial, sans-serif" font-size="8" fill="#FF9800">⚠ Add keywords</text>
  
  <!-- Copyright -->
  <text x="200" y="295" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">© 2025 Ainflue Studio - SEO Intelligence</text>
</svg>