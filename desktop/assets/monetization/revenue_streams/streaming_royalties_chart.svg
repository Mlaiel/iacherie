<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <defs>
    <linearGradient id="chartGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8BC34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CDDC39;stop-opacity:1" />
    </linearGradient>
    <filter id="chartGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="300" fill="#1a1a1a"/>
  
  <!-- Chart Area -->
  <rect x="60" y="40" width="380" height="200" fill="#2a2a2a" stroke="#555" stroke-width="1" rx="4"/>
  
  <!-- Grid Lines -->
  <g stroke="#333" stroke-width="0.5" opacity="0.5">
    <line x1="60" y1="80" x2="440" y2="80"/>
    <line x1="60" y1="120" x2="440" y2="120"/>
    <line x1="60" y1="160" x2="440" y2="160"/>
    <line x1="60" y1="200" x2="440" y2="200"/>
    
    <line x1="120" y1="40" x2="120" y2="240"/>
    <line x1="180" y1="40" x2="180" y2="240"/>
    <line x1="240" y1="40" x2="240" y2="240"/>
    <line x1="300" y1="40" x2="300" y2="240"/>
    <line x1="360" y1="40" x2="360" y2="240"/>
  </g>
  
  <!-- Revenue Trend Line -->
  <path d="M 80 220 L 120 200 L 160 180 L 200 160 L 240 140 L 280 120 L 320 100 L 360 80 L 400 60" 
        fill="none" 
        stroke="url(#chartGradient)" 
        stroke-width="3" 
        filter="url(#chartGlow)"/>
  
  <!-- Data Points -->
  <g fill="#4CAF50" filter="url(#chartGlow)">
    <circle cx="80" cy="220" r="4"/>
    <circle cx="120" cy="200" r="4"/>
    <circle cx="160" cy="180" r="4"/>
    <circle cx="200" cy="160" r="4"/>
    <circle cx="240" cy="140" r="4"/>
    <circle cx="280" cy="120" r="4"/>
    <circle cx="320" cy="100" r="4"/>
    <circle cx="360" cy="80" r="4"/>
    <circle cx="400" cy="60" r="4"/>
  </g>
  
  <!-- Revenue Bars -->
  <g fill="url(#chartGradient)" opacity="0.7">
    <rect x="75" y="220" width="10" height="20"/>
    <rect x="115" y="200" width="10" height="40"/>
    <rect x="155" y="180" width="10" height="60"/>
    <rect x="195" y="160" width="10" height="80"/>
    <rect x="235" y="140" width="10" height="100"/>
    <rect x="275" y="120" width="10" height="120"/>
    <rect x="315" y="100" width="10" height="140"/>
    <rect x="355" y="80" width="10" height="160"/>
    <rect x="395" y="60" width="10" height="180"/>
  </g>
  
  <!-- Value Labels -->
  <g fill="#4CAF50" font-family="Arial, sans-serif" font-size="10">
    <text x="80" y="215" text-anchor="middle">$1.2K</text>
    <text x="120" y="195" text-anchor="middle">$2.8K</text>
    <text x="160" y="175" text-anchor="middle">$4.5K</text>
    <text x="200" y="155" text-anchor="middle">$6.9K</text>
    <text x="240" y="135" text-anchor="middle">$9.7K</text>
    <text x="280" y="115" text-anchor="middle">$13.2K</text>
    <text x="320" y="95" text-anchor="middle">$17.8K</text>
    <text x="360" y="75" text-anchor="middle">$23.1K</text>
    <text x="400" y="55" text-anchor="middle">$29.5K</text>
  </g>
  
  <!-- X-Axis Labels -->
  <g fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">
    <text x="80" y="255" text-anchor="middle">Jan</text>
    <text x="120" y="255" text-anchor="middle">Feb</text>
    <text x="160" y="255" text-anchor="middle">Mar</text>
    <text x="200" y="255" text-anchor="middle">Apr</text>
    <text x="240" y="255" text-anchor="middle">May</text>
    <text x="280" y="255" text-anchor="middle">Jun</text>
    <text x="320" y="255" text-anchor="middle">Jul</text>
    <text x="360" y="255" text-anchor="middle">Aug</text>
    <text x="400" y="255" text-anchor="middle">Sep</text>
  </g>
  
  <!-- Y-Axis Labels -->
  <g fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10">
    <text x="50" y="245" text-anchor="end">$0</text>
    <text x="50" y="205" text-anchor="end">$5K</text>
    <text x="50" y="165" text-anchor="end">$10K</text>
    <text x="50" y="125" text-anchor="end">$15K</text>
    <text x="50" y="85" text-anchor="end">$20K</text>
    <text x="50" y="45" text-anchor="end">$25K</text>
  </g>
  
  <!-- Title -->
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Streaming Royalties Growth</text>
  
  <!-- Performance Indicator -->
  <rect x="450" y="60" width="40" height="100" fill="#2a2a2a" stroke="#555" stroke-width="1" rx="4"/>
  <text x="470" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4CAF50" text-anchor="middle">+147%</text>
  <text x="470" y="95" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">Growth</text>
  <text x="470" y="105" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">Rate</text>
  
  <!-- Projection Arrow -->
  <path d="M 400 60 L 420 50 L 440 45" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
  </defs>
  
  <!-- Copyright -->
  <text x="250" y="290" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">© 2025 Ainflue Studio - Revenue Analytics</text>
</svg>