<?xml version="1.0" encoding="UTF-8"?>
<!-- Cryptocurrency Payment Icons -->
<!-- © 2025 Fahed Mlaiel - Ainflue Studio -->
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bitcoinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ethereumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#627eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a9cff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardanoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0033ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <filter id="cryptoShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#1a202c"/>
  
  <!-- Header -->
  <text x="50" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Cryptocurrency Payment Options</text>
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e0">Secure blockchain-based transactions</text>
  
  <!-- Bitcoin -->
  <g id="bitcoin" transform="translate(50, 80)">
    <circle cx="30" cy="30" r="25" fill="url(#bitcoinGradient)" filter="url(#cryptoShadow)"/>
    <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">₿</text>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Bitcoin (BTC)</text>
    <text x="70" y="40" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">Instant payments worldwide</text>
    <rect x="70" y="45" width="60" height="20" rx="10" fill="#00ff88" fill-opacity="0.2" stroke="#00ff88" stroke-width="1"/>
    <text x="100" y="58" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#00ff88" text-anchor="middle">ENABLED</text>
  </g>
  
  <!-- Ethereum -->
  <g id="ethereum" transform="translate(50, 140)">
    <circle cx="30" cy="30" r="25" fill="url(#ethereumGradient)" filter="url(#cryptoShadow)"/>
    <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Ξ</text>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Ethereum (ETH)</text>
    <text x="70" y="40" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">Smart contract payments</text>
    <rect x="70" y="45" width="60" height="20" rx="10" fill="#00ff88" fill-opacity="0.2" stroke="#00ff88" stroke-width="1"/>
    <text x="100" y="58" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#00ff88" text-anchor="middle">ENABLED</text>
  </g>
  
  <!-- Cardano -->
  <g id="cardano" transform="translate(50, 200)">
    <circle cx="30" cy="30" r="25" fill="url(#cardanoGradient)" filter="url(#cryptoShadow)"/>
    <text x="30" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">₳</text>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Cardano (ADA)</text>
    <text x="70" y="40" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">Sustainable blockchain</text>
    <rect x="70" y="45" width="60" height="20" rx="10" fill="#00ff88" fill-opacity="0.2" stroke="#00ff88" stroke-width="1"/>
    <text x="100" y="58" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#00ff88" text-anchor="middle">ENABLED</text>
  </g>
  
  <!-- Additional Cryptocurrencies -->
  <g id="others" transform="translate(250, 80)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Also Supported:</text>
    
    <!-- USDC -->
    <circle cx="15" cy="25" r="12" fill="#2775ca"/>
    <text x="15" y="30" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">USDC</text>
    <text x="35" y="30" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">USD Coin</text>
    
    <!-- USDT -->
    <circle cx="15" cy="50" r="12" fill="#26a17b"/>
    <text x="15" y="55" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">USDT</text>
    <text x="35" y="55" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">Tether</text>
    
    <!-- BNB -->
    <circle cx="15" cy="75" r="12" fill="#f3ba2f"/>
    <text x="15" y="80" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2d3748" text-anchor="middle">BNB</text>
    <text x="35" y="80" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">Binance Coin</text>
    
    <!-- Polygon -->
    <circle cx="15" cy="100" r="12" fill="#8247e5"/>
    <text x="15" y="105" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">MATIC</text>
    <text x="35" y="105" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">Polygon</text>
  </g>
  
  <!-- Security Features -->
  <rect x="50" y="250" width="300" height="40" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="8"/>
  <text x="60" y="268" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#00ff88">🔒 Multi-signature Security</text>
  <text x="60" y="282" font-family="Arial, sans-serif" font-size="10" fill="#cbd5e0">Hardware wallet support • Cold storage • Real-time verification</text>
</svg>