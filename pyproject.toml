[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ainflue"
version = "1.0.0"
description = "AI-Powered Content Protection & Monetization Platform"
authors = [
    {name = "Fahed Mlaiel", email = "mlaiel@live.de"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "redis>=5.0.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=41.0.7",
    "gunicorn>=21.2.0",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "safety>=3.0.0",
    "radon>=6.0.1",
    "licensecheck>=2024.1",
    "pip-audit>=2.6.0",
    "vulture>=2.9.1",
    "interrogate>=1.5.0",
    "pre-commit>=3.4.0",
]
quality = [
    "sonarqube-api>=1.3.4",
    "codeclimate-test-reporter>=0.2.3",
    "coverage[toml]>=7.3.0",
]
performance = [
    "locust>=2.17.0",
    "pytest-benchmark>=4.0.0",
    "memray>=1.10.0",
    "pyflame>=0.3.1",
]

[project.urls]
Homepage = "https://github.com/Mlaiel/Ainflue"
Repository = "https://github.com/Mlaiel/Ainflue"
Issues = "https://github.com/Mlaiel/Ainflue/issues"

# Code Quality Configuration
[tool.black]
line-length = 120
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "dist",
    "build",
    "*.egg-info",
    ".venv",
    ".tox",
    ".pytest_cache",
]
max-complexity = 10
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101,S311,S605,S607",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Coverage Configuration with Strict Thresholds
[tool.coverage.run]
source = [".", "ai", "api", "business", "core", "database", "monitoring", "security"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/.venv/*",
    "*/site-packages/*",
    "setup.py",
    "conftest.py",
    "*/migrations/*",
    "*/examples/*",
    "*/scripts/*",
]
branch = true
parallel = true

[tool.coverage.report]
# Strict coverage thresholds
fail_under = 90
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "except ImportError:",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Ainflue Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=90",
    "-v",
    "--tb=short",
    "--maxfail=5",
    "--disable-warnings",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "security: Security tests",
    "slow: Slow tests (>5s)",
    "fast: Fast tests (<1s)",
    "api: API tests",
    "database: Database tests",
    "ai: AI module tests",
    "business: Business logic tests",
    "critical: Critical path tests",
    "smoke: Smoke tests",
    "regression: Regression tests",
    "quality: Quality gates tests",
    "asyncio: Async tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Bandit Security Configuration
[tool.bandit]
exclude_dirs = ["tests", "test_*", "conftest.py"]
skips = ["B101", "B601"]
confidence_level = "medium"
severity_level = "medium"

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]

# Radon Complexity Configuration
[tool.radon]
exclude = "*/tests/*,*/test_*,*/__pycache__/*"
total_average = true

[tool.radon.cc]
min = "C"  # Minimum complexity threshold (A, B, C, D, E, F)
max = "F"  # Maximum complexity threshold
average = true
show_complexity = true

[tool.radon.mi]
min = "B"  # Minimum maintainability index
max = "C"  # Maximum maintainability index
show = true

# Vulture Dead Code Detection
[tool.vulture]
exclude = ["tests/", "*/test_*", "*/__pycache__/"]
ignore_decorators = ["@app.route", "@router.get", "@router.post", "@celery.task"]
ignore_names = ["_*", "setUp", "tearDown", "test_*"]
min_confidence = 60
paths = [".", "ai", "api", "business", "core"]
sort_by_size = true

# Interrogate Documentation Coverage
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = true
ignore-setters = false
fail-under = 80
exclude = ["setup.py", "docs", "tests", "examples", "scripts"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 0
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false
generate-badge = "."
badge-format = "svg"

# Ruff Linter Configuration (Alternative to flake8)
[tool.ruff]
target-version = "py311"
line-length = 120
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "S",   # bandit
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C90", # mccabe
    "PIE", # flake8-pie
    "T20", # flake8-print
    "RET", # flake8-return
    "TID", # flake8-tidy-imports
    "ICN", # flake8-import-conventions
    "ERA", # eradicate
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "TRY", # tryceratops
    "NPY", # NumPy-specific rules
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long, handled by black
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "S101",   # use of assert
    "S311",   # pseudo-random generators
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "TRY003",  # avoid long messages outside exception class
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "tests",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "S311", "PLR2004", "S105", "S106"]

[tool.ruff.mccabe]
max-complexity = 10

[tool.ruff.isort]
known-first-party = ["ainflue", "ai", "api", "business", "core", "database", "monitoring", "security"]

# License Check Configuration
[tool.licensecheck]
using = "PEP631"
zero = false
ignore_packages = [
    "pip",
    "setuptools",
    "wheel",
    "pkg_resources",
]