[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=html:coverage-reports
    --cov-report=term-missing
    --cov-report=xml
    --html=test-results/report.html
    --self-contained-html
    --maxfail=10
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    database: marks tests as database tests
    external: marks tests that require external services
    ai: marks tests for AI components
    monetization: marks tests for monetization features
    security: marks tests for security features
    performance: marks tests for performance validation

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore:.*pkg_resources.*:DeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S