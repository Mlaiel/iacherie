[tool:pytest]
# Pytest configuration for Ainflue platform
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-fail-under=95
    --cov-branch
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    stress: marks tests as stress tests
    slow: marks tests as slow running
    security: marks tests as security-related
    monetization: marks tests for monetization module
    crawlers: marks tests for crawler module
    analytics: marks tests for analytics module
    ai: marks tests for AI/ML components