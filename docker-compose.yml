version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ainflue_postgres_dev
    environment:
      POSTGRES_DB: ainflue_development
      POSTGRES_USER: ainflue_dev
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ainflue_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainflue_dev -d ainflue_development"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ainflue_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ainflue_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MongoDB (for documents and AI metadata)
  mongodb:
    image: mongo:7
    container_name: ainflue_mongodb_dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: ainflue_dev
      MONGO_INITDB_ROOT_PASSWORD: dev_password_123
      MONGO_INITDB_DATABASE: ainflue_documents
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    networks:
      - ainflue_dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5

  # Elasticsearch (for search and analytics)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ainflue_elasticsearch_dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ainflue_dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Main Application (with hot-reload)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: development
    container_name: ainflue_app_dev
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ainflue_dev
      - POSTGRES_PASSWORD=dev_password_123
      - POSTGRES_DB=ainflue_development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USER=ainflue_dev
      - MONGODB_PASSWORD=dev_password_123
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    ports:
      - "8000:8000"
      - "8001:8001"  # Debug port
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.pytest_cache
    networks:
      - ainflue_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app", "--log-level", "debug"]

  # Worker for background tasks
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: development
    container_name: ainflue_worker_dev
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - MONGODB_HOST=mongodb
      - ELASTICSEARCH_HOST=elasticsearch
    volumes:
      - .:/app
    networks:
      - ainflue_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "celery", "worker", "-A", "workers.celery_app", "--loglevel=debug"]

  # Nginx (for static files and load balancing in development)
  nginx:
    image: nginx:alpine
    container_name: ainflue_nginx_dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/nginx.conf
      - ./static:/usr/share/nginx/html/static
    networks:
      - ainflue_dev
    depends_on:
      - app
    restart: unless-stopped

  # Monitoring: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: ainflue_prometheus_dev
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - ainflue_dev
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Monitoring: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: ainflue_grafana_dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - ainflue_dev
    depends_on:
      - prometheus

  # MailHog (for email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ainflue_mailhog_dev
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - ainflue_dev

  # MinIO (S3-compatible object storage for development)
  minio:
    image: minio/minio:latest
    container_name: ainflue_minio_dev
    environment:
      MINIO_ROOT_USER: ainflue_dev
      MINIO_ROOT_PASSWORD: dev_password_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ainflue_dev
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  minio_data:

networks:
  ainflue_dev:
    driver: bridge
    name: ainflue_dev_network