apiVersion: v1
kind: Secret
metadata:
  name: ainflue-secrets
  namespace: ainflue
  labels:
    app.kubernetes.io/name: ainflue
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database Credentials
  DATABASE_USER: "ainflue_user"
  DATABASE_PASSWORD: "CHANGE_THIS_PRODUCTION_PASSWORD_123!"
  DATABASE_URL: "postgresql://ainflue_user:CHANGE_THIS_PRODUCTION_PASSWORD_123!@postgresql-service.ainflue.svc.cluster.local:5432/ainflue_production"
  
  # Redis Credentials
  REDIS_PASSWORD: "CHANGE_THIS_REDIS_PASSWORD_456!"
  REDIS_URL: "redis://:CHANGE_THIS_REDIS_PASSWORD_456!@redis-service.ainflue.svc.cluster.local:6379/0"
  
  # MongoDB Credentials
  MONGODB_USER: "ainflue_analytics"
  MONGODB_PASSWORD: "CHANGE_THIS_MONGO_PASSWORD_789!"
  MONGODB_URL: "mongodb://ainflue_analytics:CHANGE_THIS_MONGO_PASSWORD_789!@mongodb-service.ainflue.svc.cluster.local:27017/ainflue_analytics"
  
  # JWT Secret
  JWT_SECRET_KEY: "CHANGE_THIS_JWT_SECRET_KEY_VERY_LONG_AND_SECURE_123456789!"
  JWT_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    MIIEpAIBAAKCAQEA...
    [REPLACE WITH ACTUAL RSA PRIVATE KEY]
    -----END RSA PRIVATE KEY-----
