    -----BEGIN PUBLIC KEY-----
    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...
    [REPLACE WITH ACTUAL RSA PUBLIC KEY]
    -----END PUBLIC KEY-----
  
  # Platform API Keys
  YOUTUBE_API_KEY: "CHANGE_THIS_YOUTUBE_API_KEY"
  INSTAGRAM_ACCESS_TOKEN: "CHANGE_THIS_INSTAGRAM_TOKEN"
