# Ainflue Mobile API Module - Deployment Manifest
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready deployment for mobile API service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ainflue-mobile-api
  namespace: ainflue-mobile-api
  labels:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: mobile-api-server
    app.kubernetes.io/part-of: ainflue-platform
    app.kubernetes.io/managed-by: kubectl
    created-by: fahed-mlaiel
  annotations:
    description: "Mobile API server optimized for mobile app backends and responsive performance"
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mobile-api
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mobile-api
        app.kubernetes.io/instance: production
        app.kubernetes.io/version: "1.0"
        app.kubernetes.io/component: mobile-api-server
        app.kubernetes.io/part-of: ainflue-platform
        mobile-optimized: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: mobile-api-service-account
      imagePullSecrets:
        - name: docker-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: mobile-api-server
        image: ghcr.io/mlaiel/ainflue/mobile-api:1.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8006
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        - name: grpc
          containerPort: 9000
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "mobile-api"
        - name: SERVICE_PORT
          value: "8006"
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: MOBILE_OPTIMIZATION_ENABLED
          value: "true"
        - name: RESPONSE_COMPRESSION_ENABLED
          value: "true"
        - name: MOBILE_CACHE_ENABLED
          value: "true"
        - name: OFFLINE_SYNC_ENABLED
          value: "true"
        - name: PUSH_NOTIFICATIONS_ENABLED
          value: "true"
        - name: BACKGROUND_SYNC_ENABLED
          value: "true"
        - name: MOBILE_ANALYTICS_ENABLED
          value: "true"
        - name: ADAPTIVE_BITRATE_ENABLED
          value: "true"
        - name: NETWORK_OPTIMIZATION_ENABLED
          value: "true"
        - name: BATTERY_OPTIMIZATION_ENABLED
          value: "true"
        envFrom:
        - configMapRef:
            name: mobile-api-config
        - secretRef:
            name: mobile-api-secrets
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 3Gi
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 8
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health/startup
            port: health
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 20
          successThreshold: 1
        volumeMounts:
        - name: mobile-cache
          mountPath: /app/cache
        - name: offline-data
          mountPath: /app/offline
        - name: mobile-assets
          mountPath: /app/assets
        - name: temp-storage
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: mobile-cache
        persistentVolumeClaim:
          claimName: mobile-cache-pvc
      - name: offline-data
        persistentVolumeClaim:
          claimName: offline-data-pvc
      - name: mobile-assets
        configMap:
          name: mobile-assets-config
      - name: temp-storage
        emptyDir:
          sizeLimit: 2Gi
      - name: logs
        emptyDir:
          sizeLimit: 1Gi
      nodeSelector:
        node-type: cpu-optimized
        workload-type: api-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - mobile-api
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
              - key: instance-type
                operator: In
                values:
                - c5.large
                - c5.xlarge
                - c5n.large
      tolerations:
      - key: dedicated
        operator: Equal
        value: mobile-api
        effect: NoSchedule

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mobile-cache-pvc
  namespace: ainflue-mobile-api
  labels:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/component: cache-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: offline-data-pvc
  namespace: ainflue-mobile-api
  labels:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/component: offline-storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: efs-sc

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mobile-api-service-account
  namespace: ainflue-mobile-api
  labels:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/component: security
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/MobileAPIServiceRole
automountServiceAccountToken: true