apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ainflue-ingress-us-east-1
  namespace: production
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-2017-01
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=ainflue-alb-logs,access_logs.s3.prefix=prod
    external-dns.alpha.kubernetes.io/hostname: api-us-east-1.ainflue.com
    nginx.ingress.kubernetes.io/rate-limit-rps: '100'
    nginx.ingress.kubernetes.io/rate-limit-connections: '10'
  labels:
    app: ainflue
    environment: production
    region: us-east-1
    tier: frontend
spec:
  ingressClassName: alb
  rules:
  - host: api-us-east-1.ainflue.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ainflue-api
            port:
              number: 8000
  - host: app-us-east-1.ainflue.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ainflue-frontend
            port:
              number: 3000
  tls:
  - hosts:
    - api-us-east-1.ainflue.com
    - app-us-east-1.ainflue.com
    secretName: ainflue-tls-us-east-1
