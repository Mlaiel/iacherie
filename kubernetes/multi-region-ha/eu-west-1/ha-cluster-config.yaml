apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: ainflue-prod-eu-west-1
  region: eu-west-1
  version: '1.28'
  tags:
    Environment: production
    Project: ainflue
    Region: eu-west-1
    RegionType: secondary
    ManagedBy: eksctl
vpc:
  enableDnsHostnames: true
  enableDnsSupport: true
  cidr: 10.0.0.0/16
  subnets:
    private:
      private-eu-west-1a:
        id: subnet-086709
        az: eu-west-1a
        cidr: 10.0.0.0/20
      private-eu-west-1b:
        id: subnet-055963
        az: eu-west-1b
        cidr: 10.0.16.0/20
      private-eu-west-1c:
        id: subnet-898756
        az: eu-west-1c
        cidr: 10.0.32.0/20
    public:
      public-eu-west-1a:
        id: subnet-pub-086709
        az: eu-west-1a
        cidr: 10.0.100.0/20
      public-eu-west-1b:
        id: subnet-pub-055963
        az: eu-west-1b
        cidr: 10.0.116.0/20
      public-eu-west-1c:
        id: subnet-pub-898756
        az: eu-west-1c
        cidr: 10.0.132.0/20
  nat:
    gateway: HighlyAvailable
iam:
  withOIDC: true
  serviceAccounts:
  - metadata:
      name: cluster-autoscaler
      namespace: kube-system
    wellKnownPolicies:
      autoScaler: true
  - metadata:
      name: aws-load-balancer-controller
      namespace: kube-system
    wellKnownPolicies:
      awsLoadBalancerController: true
managedNodeGroups:
- name: api-nodes
  instanceTypes:
  - m5.large
  minSize: 3
  maxSize: 10
  desiredCapacity: 3
  availabilityZones:
  - eu-west-1a
  - eu-west-1b
  - eu-west-1c
  privateNetworking: true
  volumeType: gp3
  volumeSize: 100
  volumeEncrypted: true
  amiFamily: AmazonLinux2
  iam:
    withAddonPolicies:
      imageBuilder: true
      autoScaler: true
      externalDNS: true
      certManager: true
      appMesh: true
      appMeshPreview: true
      ebs: true
      fsx: true
      efs: true
      awsLoadBalancerController: true
      xRay: true
      cloudWatch: true
  labels:
    workload: api
    tier: frontend
  tags:
    Environment: production
    NodeGroup: api-nodes
    Region: eu-west-1
    k8s.io/cluster-autoscaler/enabled: 'true'
    k8s.io/cluster-autoscaler/ainflue-prod-eu-west-1: owned
  securityGroups:
    withShared: true
    withLocal: true
  ssh:
    allow: false
- name: worker-nodes
  instanceTypes:
  - c5.xlarge
  minSize: 2
  maxSize: 20
  desiredCapacity: 3
  availabilityZones:
  - eu-west-1a
  - eu-west-1b
  privateNetworking: true
  volumeType: gp3
  volumeSize: 100
  volumeEncrypted: true
  amiFamily: AmazonLinux2
  iam:
    withAddonPolicies:
      imageBuilder: true
      autoScaler: true
      externalDNS: true
      certManager: true
      appMesh: true
      appMeshPreview: true
      ebs: true
      fsx: true
      efs: true
      awsLoadBalancerController: true
      xRay: true
      cloudWatch: true
  labels:
    workload: processing
    tier: backend
  tags:
    Environment: production
    NodeGroup: worker-nodes
    Region: eu-west-1
    k8s.io/cluster-autoscaler/enabled: 'true'
    k8s.io/cluster-autoscaler/ainflue-prod-eu-west-1: owned
  securityGroups:
    withShared: true
    withLocal: true
  ssh:
    allow: false
  spot: true
  instancesDistribution:
    maxPrice: 0.1
    instanceTypes:
    - c5.xlarge
    - m5.xlarge
    - c5.large
    onDemandBaseCapacity: 1
    onDemandPercentageAboveBaseCapacity: 20
    spotInstancePools: 3
addons:
- name: vpc-cni
  version: latest
- name: coredns
  version: latest
- name: kube-proxy
  version: latest
- name: aws-ebs-csi-driver
  version: latest
  wellKnownPolicies:
    ebsCSIController: true
cloudWatch:
  clusterLogging:
    enable:
    - audit
    - authenticator
    - controllerManager
    - scheduler
    - api
    logRetentionInDays: 30
secretsEncryption:
  keyARN: arn:aws:kms:eu-west-1:123456789012:key/12345678-1234-1234-1234-123456789012
