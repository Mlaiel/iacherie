# Environment-specific values for production
# Override default values for production environment

global:
  environment: production
  region: us-east-1
  
replicaCount: 3

image:
  tag: "1.0.0"  # Will be overridden by CI/CD
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  hosts:
    - host: api.ainflue.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ainflue-prod-tls
      hosts:
        - api.ainflue.com

# Production database (full configuration)
postgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "gp3-encrypted"
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
  readReplicas:
    replicaCount: 2
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "gp3-encrypted"

# Production Redis (full configuration)
redis:
  enabled: true
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "gp3-encrypted"
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "gp3-encrypted"

# Enable all microservices in production
microservices:
  fingerprinting:
    enabled: true
    replicaCount: 3
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
  seo:
    enabled: true
    replicaCount: 2
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
  ai_engine:
    enabled: true
    replicaCount: 3
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
        nvidia.com/gpu: 1
      requests:
        cpu: 1000m
        memory: 2Gi

# Production-specific environment variables
env:
  - name: DEBUG
    value: "false"
  - name: LOG_LEVEL
    value: "WARNING"
  - name: ENVIRONMENT
    value: "production"
  - name: METRICS_ENABLED
    value: "true"
  - name: TRACING_ENABLED
    value: "true"

# Enhanced security for production
security:
  networkPolicies:
    enabled: true
  podSecurityPolicy:
    enabled: true
  rbac:
    enabled: true

# Production monitoring
monitoring:
  prometheus:
    enabled: true
    retention: 30d
    storage: 100Gi
  grafana:
    enabled: true
    persistence:
      enabled: true
      size: 10Gi