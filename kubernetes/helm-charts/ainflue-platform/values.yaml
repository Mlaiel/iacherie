# Default values for ainflue-platform
# This is a YAML-formatted file with production-ready defaults

global:
  imageRegistry: docker.io
  imagePullSecrets: []
  storageClass: ""
  
replicaCount: 3

image:
  registry: docker.io
  repository: ainflue/api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.ainflue.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ainflue-api-tls
      hosts:
        - api.ainflue.com

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - ainflue-platform
        topologyKey: kubernetes.io/hostname

# Database configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: ""
    username: ainflue
    password: ""
    database: ainflue
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
  readReplicas:
    replicaCount: 2
    persistence:
      enabled: true
      size: 20Gi

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: ""
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 8Gi

# Monitoring configuration
monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true

# Environment configuration
env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: ainflue-secrets
        key: database-url
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: ainflue-secrets
        key: redis-url
  - name: JWT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: ainflue-secrets
        key: jwt-secret

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Multi-region configuration
multiRegion:
  enabled: true
  regions:
    - name: us-east-1
      primary: true
    - name: us-west-2
      primary: false
    - name: eu-west-1
      primary: false
    - name: ap-southeast-1
      primary: false

# Microservices
microservices:
  fingerprinting:
    enabled: true
    replicaCount: 2
    image:
      repository: ainflue/fingerprinting
      tag: "1.0.0"
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi

  seo:
    enabled: true
    replicaCount: 2
    image:
      repository: ainflue/seo
      tag: "1.0.0"
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

  ai_engine:
    enabled: true
    replicaCount: 3
    image:
      repository: ainflue/ai-engine
      tag: "1.0.0"
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
        nvidia.com/gpu: 1
      requests:
        cpu: 1000m
        memory: 2Gi

# Security configuration
security:
  networkPolicies:
    enabled: true
  podSecurityPolicy:
    enabled: true
  rbac:
    enabled: true