# Ainflue Gamification Module - Ingress Configuration
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready ingress for gamification API endpoints

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamification-ingress
  namespace: ainflue-gamification
  labels:
    app.kubernetes.io/name: gamification
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: ainflue-platform
    app.kubernetes.io/managed-by: kubectl
    created-by: fahed-mlaiel
  annotations:
    description: "Ingress for gamification API - points, achievements, leaderboards"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.ainflue.com,https://dashboard.ainflue.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-ID,X-Session-ID"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-rps: "10"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "10M"
    nginx.ingress.kubernetes.io/proxy-body-size: "10M"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-ID,X-User-Role"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'";
      more_set_headers "X-Service-Name: gamification";
      more_set_headers "X-Service-Version: 1.0";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/server-snippet: |
      location /gamification/metrics {
        deny all;
        return 403;
      }
spec:
  tls:
  - hosts:
    - api.ainflue.com
    - gamification.ainflue.com
    secretName: gamification-tls-secret
  rules:
  - host: api.ainflue.com
    http:
      paths:
      - path: /v1/gamification/points
        pathType: Prefix
        backend:
          service:
            name: gamification-service
            port:
              number: 8004
      - path: /v1/gamification/achievements
        pathType: Prefix
        backend:
          service:
            name: gamification-service
            port:
              number: 8004
      - path: /v1/gamification/leaderboards
        pathType: Prefix
        backend:
          service:
            name: gamification-service
            port:
              number: 8004
      - path: /v1/gamification/tiers
        pathType: Prefix
        backend:
          service:
            name: gamification-service
            port:
              number: 8004
      - path: /v1/gamification/rewards
        pathType: Prefix
        backend:
          service:
            name: gamification-service
            port:
              number: 8004
      - path: /v1/gamification/engagement
        pathType: Prefix
        backend:
          service:
            name: gamification-service
            port:
              number: 8004
      - path: /v1/gamification/stats
        pathType: Prefix
        backend:
          service:
            name: gamification-service
            port:
              number: 8004
      - path: /v1/gamification/health
        pathType: Prefix
        backend:
          service:
            name: gamification-service
            port:
              number: 8081
  - host: gamification.ainflue.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gamification-service
            port:
              number: 8004
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: gamification-service
            port:
              number: 8081

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gamification-network-policy
  namespace: ainflue-gamification
  labels:
    app.kubernetes.io/name: gamification
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gamification
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: ainflue
    - namespaceSelector:
        matchLabels:
          name: ainflue-monitoring
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: ainflue-platform
    ports:
    - protocol: TCP
      port: 8004
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 9090
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8007