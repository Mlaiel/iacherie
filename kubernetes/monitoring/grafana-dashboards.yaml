apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-business-metrics
  namespace: ainflue-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    grafana_dashboard: "1"
data:
  business-metrics.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Business Metrics & Revenue",
        "tags": ["ainflue", "business", "revenue", "users"],
        "timezone": "UTC",
        "refresh": "5m",
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "Total Revenue (24h)",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "sum(increase(revenue_generated_total[24h]))",
                "legendFormat": "Total Revenue",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value",
              "unit": "currencyUSD"
            }
          },
          {
            "id": 2,
            "title": "New User Registrations",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "targets": [
              {
                "expr": "sum(increase(user_registrations_total[24h]))",
                "legendFormat": "New Users",
                "refId": "A"
              }
            ]
          },
          {
            "id": 3,
            "title": "Content Uploads",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "sum(increase(content_uploads_total[24h]))",
                "legendFormat": "Content Uploads",
                "refId": "A"
              }
            ]
          },
          {
            "id": 4,
            "title": "Violations Detected",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
            "targets": [
              {
                "expr": "sum(increase(violations_detected_total[24h]))",
                "legendFormat": "Violations",
                "refId": "A"
              }
            ],
            "options": {
              "colorMode": "value"
            }
          },
          {
            "id": 5,
            "title": "Revenue Trend",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "sum(rate(revenue_generated_total[1h]))",
                "legendFormat": "Revenue per Hour",
                "refId": "A"
              }
            ],
            "yAxes": [
              {
                "label": "USD/hour",
                "min": 0
              }
            ]
          },
          {
            "id": 6,
            "title": "User Activity",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "sum(rate(user_actions_total[5m]))",
                "legendFormat": "Actions per Minute",
                "refId": "A"
              }
            ],
            "yAxes": [
              {
                "label": "Actions/min",
                "min": 0
              }
            ]
          },
          {
            "id": 7,
            "title": "Content Processing",
            "type": "graph",
            "gridPos": {"h": 6, "w": 8, "x": 0, "y": 12},
            "targets": [
              {
                "expr": "sum(rate(content_processed_total[5m]))",
                "legendFormat": "Processing Rate",
                "refId": "A"
              }
            ],
            "yAxes": [
              {
                "label": "Content/min",
                "min": 0
              }
            ]
          },
          {
            "id": 8,
            "title": "Platform Distribution",
            "type": "piechart",
            "gridPos": {"h": 6, "w": 8, "x": 8, "y": 12},
            "targets": [
              {
                "expr": "sum by (platform) (content_uploads_total)",
                "legendFormat": "{{platform}}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 9,
            "title": "Payment Processing",
            "type": "graph",
            "gridPos": {"h": 6, "w": 8, "x": 16, "y": 12},
            "targets": [
              {
                "expr": "sum(rate(payments_processed_total[5m])) by (status)",
                "legendFormat": "{{status}}",
                "refId": "A"
              }
            ],
            "yAxes": [
              {
                "label": "Payments/min",
                "min": 0
              }
            ]
          }
        ]
      }
    }