apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: ai-orchestration-service
    service-type: ai-service
  name: ai-orchestration-service-vs
  namespace: ainflue-development
spec:
  hosts:
  - ai-orchestration-service.ainflue-development.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: /
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
    route:
    - destination:
        host: ai-orchestration-service.ainflue-development.svc.cluster.local
        port:
          number: 8004
    timeout: 30s
