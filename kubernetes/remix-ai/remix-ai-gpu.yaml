# Ainflue Remix AI Module - GPU Resource Management
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready GPU resource allocation and management for AI processing

apiVersion: v1
kind: ResourceQuota
metadata:
  name: remix-ai-gpu-quota
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: gpu-resource-management
    app.kubernetes.io/part-of: ainflue-platform
    created-by: fahed-mlaiel
  annotations:
    description: "GPU resource quota management for AI remix processing"
spec:
  hard:
    requests.nvidia.com/gpu: "8"
    limits.nvidia.com/gpu: "16"
    requests.cpu: "16"
    requests.memory: 64Gi
    limits.cpu: "32"
    limits.memory: 128Gi

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: gpu-ai-priority
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: gpu-scheduling
value: 1500
globalDefault: false
description: "High priority class for GPU-accelerated AI workloads"
preemptionPolicy: PreemptLowerPriority

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-device-plugin-config
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: gpu-configuration
data:
  config.yaml: |
    version: v1
    flags:
      migStrategy: "single"
      failOnInitError: true
      nvidiaDriverRoot: "/usr/local/nvidia"
      plugin:
        passDeviceSpecs: false
        deviceListStrategy: "envvar"
        deviceIDStrategy: "uuid"
    sharing:
      timeSlicing:
        resources:
        - name: nvidia.com/gpu
          replicas: 2
    
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: gpu-device-plugin
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
        app.kubernetes.io/name: remix-ai
        app.kubernetes.io/component: gpu-device-plugin
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
      - image: nvcr.io/nvidia/k8s-device-plugin:v0.14.1
        name: nvidia-device-plugin-ctr
        args: ["--fail-on-init-error=false", "--config-file=/etc/kubernetes/device-plugin/config.yaml"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: dev-dir
          mountPath: /dev
        - name: config
          mountPath: /etc/kubernetes/device-plugin
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: dev-dir
        hostPath:
          path: /dev
      - name: config
        configMap:
          name: gpu-device-plugin-config
      nodeSelector:
        accelerator: nvidia-tesla-v100

---
apiVersion: v1
kind: Service
metadata:
  name: gpu-monitoring-service
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: gpu-monitoring
spec:
  type: ClusterIP
  ports:
  - name: dcgm-exporter
    port: 9400
    targetPort: 9400
    protocol: TCP
  selector:
    app.kubernetes.io/name: dcgm-exporter

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/component: gpu-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
        app.kubernetes.io/component: gpu-monitoring
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: dcgm-exporter
        image: nvcr.io/nvidia/k8s/dcgm-exporter:3.1.8-3.1.5-ubuntu20.04
        ports:
        - name: metrics
          containerPort: 9400
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      nodeSelector:
        accelerator: nvidia-tesla-v100

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-node-selector-config
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: gpu-node-selection
data:
  node-selector.yaml: |
    gpu_nodes:
      preferred:
        - instance_type: "p3.2xlarge"
          gpu_type: "nvidia-tesla-v100"
          gpu_count: 1
          memory: "61GB"
          vcpus: 8
        - instance_type: "p3.8xlarge"
          gpu_type: "nvidia-tesla-v100"
          gpu_count: 4
          memory: "244GB"
          vcpus: 32
        - instance_type: "p4d.24xlarge"
          gpu_type: "nvidia-tesla-a100"
          gpu_count: 8
          memory: "1152GB"
          vcpus: 96
      node_selectors:
        accelerator: "nvidia-tesla-v100"
        node-type: "gpu-optimized"
        workload-type: "ai-processing"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "dedicated"
          operator: "Equal"
          value: "ai-processing"
          effect: "NoSchedule"