# Ainflue Remix AI Module - Service Manifest
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready service for AI remix engine

apiVersion: v1
kind: Service
metadata:
  name: remix-ai-service
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: ai-remix-service
    app.kubernetes.io/part-of: ainflue-platform
    app.kubernetes.io/managed-by: kubectl
    created-by: fahed-mlaiel
  annotations:
    description: "Service for AI remix engine - intelligent content generation and remixing"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8005
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  - name: health
    port: 8081
    targetPort: health
    protocol: TCP
  - name: model-server
    port: 8085
    targetPort: model-server
    protocol: TCP
  selector:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/instance: production
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack

---
apiVersion: v1
kind: Service
metadata:
  name: remix-ai-headless-service
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: headless-service
  annotations:
    description: "Headless service for direct pod communication and model coordination"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8005
    targetPort: http
    protocol: TCP
  - name: model-server
    port: 8085
    targetPort: model-server
    protocol: TCP
  selector:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/instance: production
  publishNotReadyAddresses: false

---
apiVersion: v1
kind: Service
metadata:
  name: remix-ai-model-coordination-service
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: model-coordination
  annotations:
    description: "Service for AI model coordination and distributed processing"
spec:
  type: ClusterIP
  ports:
  - name: coordination
    port: 8086
    targetPort: 8086
    protocol: TCP
  - name: model-sync
    port: 8087
    targetPort: 8087
    protocol: TCP
  selector:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/instance: production
  sessionAffinity: None

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: remix-ai-gpu-endpoints
  namespace: ainflue-remix-ai
  labels:
    kubernetes.io/service-name: remix-ai-service
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: gpu-endpoints
addressType: IPv4
ports:
- name: http
  port: 8005
  protocol: TCP
- name: model-server
  port: 8085
  protocol: TCP
endpoints:
- addresses:
  - "10.0.0.100"
  conditions:
    ready: true
    serving: true
    terminating: false
  targetRef:
    kind: Pod
    name: remix-ai-gpu-pod-1
    namespace: ainflue-remix-ai
- addresses:
  - "10.0.0.101"
  conditions:
    ready: true
    serving: true
    terminating: false
  targetRef:
    kind: Pod
    name: remix-ai-gpu-pod-2
    namespace: ainflue-remix-ai