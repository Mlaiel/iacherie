# Ainflue Remix AI Module - ConfigMap
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready configuration for AI remix engine

apiVersion: v1
kind: ConfigMap
metadata:
  name: remix-ai-config
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: ainflue-platform
    created-by: fahed-mlaiel
  annotations:
    description: "AI remix engine configuration for intelligent content generation"
data:
  # Application Configuration
  APP_NAME: "Ainflue-Remix-AI"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  SERVICE_NAME: "remix-ai"
  SERVICE_PORT: "8005"
  
  # AI Engine Configuration
  AI_ENGINE_MODE: "production"
  GPU_ACCELERATION_ENABLED: "true"
  CUDA_COMPUTE_CAPABILITY: "7.0"
  MIXED_PRECISION_ENABLED: "true"
  MODEL_PARALLEL_ENABLED: "true"
  TENSOR_RT_OPTIMIZATION: "true"
  
  # GPU Configuration
  GPU_MEMORY_FRACTION: "0.8"
  GPU_GROWTH_ENABLED: "true"
  CUDA_VISIBLE_DEVICES: "0,1"
  NVIDIA_VISIBLE_DEVICES: "all"
  GPU_BATCH_SIZE: "16"
  GPU_WORKER_THREADS: "4"
  
  # Model Configuration
  MODEL_BASE_PATH: "/app/models"
  MODEL_CACHE_PATH: "/app/cache"
  MODEL_WARMUP_ENABLED: "true"
  MODEL_PRELOAD_ENABLED: "true"
  MODEL_VERSIONS: "wavenet-v2,musenet-v3,tacotron2-v4,melgan-v2"
  
  # Audio Processing Configuration
  AUDIO_SAMPLE_RATE: "44100"
  AUDIO_BIT_DEPTH: "24"
  AUDIO_CHANNELS: "2"
  AUDIO_FORMAT: "wav"
  AUDIO_QUALITY_THRESHOLD: "0.95"
  
  # Generation Configuration
  GENERATION_BATCH_SIZE: "8"
  GENERATION_MAX_LENGTH: "300"
  GENERATION_TEMPERATURE: "0.8"
  GENERATION_TOP_P: "0.9"
  GENERATION_TOP_K: "50"
  GENERATION_SEED: "42"
  
  # Style Transfer Configuration
  STYLE_TRANSFER_ENABLED: "true"
  STYLE_MODELS: "neural_style,fast_style,cyclegan"
  STYLE_STRENGTH: "0.7"
  STYLE_PRESERVATION: "0.3"
  
  # Collaboration Configuration
  COLLABORATIVE_MODE_ENABLED: "true"
  REAL_TIME_COLLABORATION: "true"
  WEBSOCKET_ENABLED: "true"
  WEBSOCKET_PORT: "8088"
  MAX_CONCURRENT_SESSIONS: "50"
  SESSION_TIMEOUT: "3600"
  
  # Quality Enhancement Configuration
  QUALITY_ENHANCEMENT_ENABLED: "true"
  NOISE_REDUCTION_ENABLED: "true"
  AUDIO_MASTERING_ENABLED: "true"
  DYNAMIC_RANGE_COMPRESSION: "true"
  SPECTRAL_ENHANCEMENT: "true"
  
  # Processing Configuration
  BATCH_PROCESSING_ENABLED: "true"
  REAL_TIME_PROCESSING_ENABLED: "true"
  ASYNC_PROCESSING_ENABLED: "true"
  QUEUE_PROCESSING_ENABLED: "true"
  PRIORITY_PROCESSING_ENABLED: "true"
  
  # Cache Configuration
  GENERATION_CACHE_ENABLED: "true"
  MODEL_CACHE_ENABLED: "true"
  RESULT_CACHE_TTL: "3600"
  MODEL_CACHE_TTL: "86400"
  CACHE_COMPRESSION_ENABLED: "true"
  
  # Database Configuration
  DATABASE_HOST: "postgresql-primary.ainflue.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "ainflue_remix_ai"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "30"
  DATABASE_TIMEOUT: "60"
  
  # Redis Configuration
  REDIS_HOST: "redis-master.ainflue.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "3"
  REDIS_POOL_SIZE: "15"
  REDIS_TIMEOUT: "30"
  
  # Message Queue Configuration
  CELERY_BROKER_URL: "redis://redis-master.ainflue.svc.cluster.local:6379/4"
  CELERY_RESULT_BACKEND: "redis://redis-master.ainflue.svc.cluster.local:6379/5"
  CELERY_WORKER_CONCURRENCY: "4"
  CELERY_TASK_SERIALIZER: "json"
  CELERY_RESULT_SERIALIZER: "json"
  
  # Storage Configuration
  GENERATED_CONTENT_PATH: "/app/generated"
  TRAINING_DATA_PATH: "/app/training_data"
  TEMPORARY_FILES_PATH: "/tmp"
  MAX_STORAGE_SIZE: "500GB"
  CLEANUP_INTERVAL: "3600"
  
  # API Configuration
  API_RATE_LIMIT: "100"
  API_RATE_LIMIT_WINDOW: "3600"
  API_TIMEOUT: "300"
  API_MAX_RETRY: "3"
  API_BATCH_LIMIT: "10"
  
  # Monitoring Configuration
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_PORT: "8081"
  PROMETHEUS_ENABLED: "true"
  GPU_METRICS_ENABLED: "true"
  MODEL_METRICS_ENABLED: "true"
  
  # Security Configuration
  JWT_ALGORITHM: "RS256"
  SESSION_TIMEOUT: "7200"
  CORS_ORIGINS: "https://app.ainflue.com,https://studio.ainflue.com"
  ENCRYPTION_ENABLED: "true"
  
  # Feature Flags
  EXPERIMENTAL_MODELS_ENABLED: "false"
  ADVANCED_STYLE_TRANSFER_ENABLED: "true"
  VOICE_CLONING_ENABLED: "true"
  INSTRUMENT_SEPARATION_ENABLED: "true"
  LYRICS_GENERATION_ENABLED: "true"
  
  # Business Logic Configuration
  COPYRIGHT_PROTECTION_ENABLED: "true"
  WATERMARKING_ENABLED: "true"
  CREATOR_ATTRIBUTION_REQUIRED: "true"
  REVENUE_SHARING_ENABLED: "true"
  COLLABORATION_TRACKING_ENABLED: "true"
  
  # Performance Configuration
  WORKER_PROCESSES: "4"
  THREAD_POOL_SIZE: "8"
  MAX_MEMORY_USAGE: "28GB"
  GARBAGE_COLLECTION_ENABLED: "true"
  MEMORY_PROFILING_ENABLED: "false"
  
  # Integration Configuration
  CONTENT_SERVICE_URL: "http://content-service.ainflue.svc.cluster.local:8001"
  USER_SERVICE_URL: "http://user-service.ainflue.svc.cluster.local:8000"
  NOTIFICATION_SERVICE_URL: "http://notification-service.ainflue.svc.cluster.local:8007"
  COLLABORATION_SERVICE_URL: "http://collaboration-service.ainflue-gamification.svc.cluster.local:8004"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-model-config
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: model-configuration
data:
  wavenet_config.json: |
    {
      "model_name": "WaveNet",
      "version": "2.0",
      "type": "generative",
      "input_format": "audio",
      "output_format": "audio",
      "sample_rate": 44100,
      "channels": 2,
      "batch_size": 8,
      "sequence_length": 16000,
      "gpu_memory_required": "8GB",
      "inference_time_ms": 2000
    }
    
  musenet_config.json: |
    {
      "model_name": "MuseNet",
      "version": "3.0",
      "type": "compositional",
      "input_format": "midi",
      "output_format": "audio",
      "instruments": ["piano", "guitar", "drums", "bass", "violin"],
      "styles": ["classical", "jazz", "rock", "electronic"],
      "max_sequence_length": 4096,
      "gpu_memory_required": "12GB",
      "inference_time_ms": 5000
    }
    
  style_transfer_config.json: |
    {
      "model_name": "StyleTransfer",
      "version": "1.5",
      "type": "transformation",
      "supported_styles": [
        "classical_to_jazz",
        "acoustic_to_electronic",
        "vocal_to_instrumental",
        "slow_to_upbeat"
      ],
      "style_strength_range": [0.1, 1.0],
      "preservation_range": [0.0, 0.9],
      "gpu_memory_required": "6GB",
      "inference_time_ms": 3000
    }