apiVersion: v1
kind: Namespace
metadata:
  name: ainflue
  labels:
    name: ainflue
    environment: production
    app.kubernetes.io/name: ainflue
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: ainflue-platform
    app.kubernetes.io/managed-by: kubectl
    managed-by: fahed-mlaiel
  annotations:
    description: "Ainflue AI-powered Content Protection & Monetization Platform"
    contact: "mlaiel@live.de"
    created-by: "Fahed Mlaiel"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ainflue-quota
  namespace: ainflue
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    pods: "50"
    services: "20"
    secrets: "30"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ainflue-limits
  namespace: ainflue
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: 2
      memory: 4Gi
    min:
      cpu: 50m
      memory: 64Mi
  - type: PersistentVolumeClaim
    max:
      storage: 100Gi
    min:
      storage: 1Gi