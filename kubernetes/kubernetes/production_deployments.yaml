# Analytics Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-analytics-service
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: analytics-service
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Analytics service deployment for business intelligence"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ia-influencer-agent
      app.kubernetes.io/component: analytics-service
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia-influencer-agent
        app.kubernetes.io/component: analytics-service
        app.kubernetes.io/instance: production
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: analytics-service
        image: ia-influencer-analytics:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        - name: APP_COMPONENT
          value: "analytics-service"
        - name: ELASTICSEARCH_ENABLED
          value: "true"
        - name: KIBANA_ENABLED
          value: "true"
        - name: PROMETHEUS_ENABLED
          value: "true"
        - name: GRAFANA_ENABLED
          value: "true"
        envFrom:
        - configMapRef:
            name: ia-analytics-config
        - secretRef:
            name: ia-analytics-secrets
        volumeMounts:
        - name: analytics-data
          mountPath: /app/analytics_data
        - name: app-logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: analytics-data
        persistentVolumeClaim:
          claimName: ia-analytics-pvc
      - name: app-logs
        persistentVolumeClaim:
          claimName: ia-logs-pvc
      terminationGracePeriodSeconds: 45
---
# Content Fingerprinting Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-fingerprinting-service
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: fingerprinting-service
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Content fingerprinting service deployment"
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ia-influencer-agent
      app.kubernetes.io/component: fingerprinting-service
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia-influencer-agent
        app.kubernetes.io/component: fingerprinting-service
        app.kubernetes.io/instance: production
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: fingerprinting-service
        image: ia-influencer-fingerprinting:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 9090
          protocol: TCP
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        - name: APP_COMPONENT
          value: "fingerprinting-service"
        - name: PERCEPTUAL_HASH_ENABLED
          value: "true"
        - name: AUDIO_FINGERPRINT_ENABLED
          value: "true"
        - name: VIDEO_FINGERPRINT_ENABLED
          value: "true"
        - name: IMAGE_FINGERPRINT_ENABLED
          value: "true"
        - name: TEXT_FINGERPRINT_ENABLED
          value: "true"
        - name: GPU_ENABLED
          value: "true"
        envFrom:
        - configMapRef:
            name: ia-fingerprinting-config
        - secretRef:
            name: ia-fingerprinting-secrets
        volumeMounts:
        - name: fingerprint-data
          mountPath: /app/fingerprint_data
        - name: app-logs
          mountPath: /app/logs
        - name: models-cache
          mountPath: /app/models
        resources:
          requests:
            memory: "6Gi"
            cpu: "3000m"
            nvidia.com/gpu: 1
          limits:
            memory: "12Gi"
            cpu: "6000m"
            nvidia.com/gpu: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: fingerprint-data
        persistentVolumeClaim:
          claimName: ia-fingerprinting-pvc
      - name: app-logs
        persistentVolumeClaim:
          claimName: ia-logs-pvc
      - name: models-cache
        persistentVolumeClaim:
          claimName: ia-models-pvc
      terminationGracePeriodSeconds: 60
