# API Gateway HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ia-api-gateway-hpa
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: api-gateway
    environment: production
  annotations:
    description: "Auto-scaling for API Gateway based on CPU and memory"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ia-api-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metric: API requests per second
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
---
# ML Engine HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ia-ml-engine-hpa
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: ml-engine
    environment: production
  annotations:
    description: "Auto-scaling for ML Engine based on GPU and CPU utilization"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ia-ml-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  # Custom metric: ML processing queue length
  - type: Object
    object:
      metric:
        name: ml_processing_queue_length
      describedObject:
        apiVersion: v1
        kind: Service
        name: redis-service
      target:
        type: Value
        value: "50"
  # Custom metric: GPU utilization
  - type: Pods
    pods:
      metric:
        name: gpu_utilization_percent
      target:
        type: AverageValue
        averageValue: "80"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes for expensive ML pods
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120
      - type: Pods
        value: 1
        periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 100
        periodSeconds: 120
      - type: Pods
        value: 2
        periodSeconds: 120
      selectPolicy: Max
---
# Content Protection HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ia-protection-service-hpa
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: content-protection
    environment: production
  annotations:
    description: "Auto-scaling for Content Protection based on processing load"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ia-protection-service
  minReplicas: 2
  maxReplicas: 15
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  # Custom metric: Fingerprint processing queue
  - type: Object
    object:
      metric:
        name: fingerprint_processing_queue
      describedObject:
        apiVersion: v1
        kind: Service
        name: redis-service
      target:
        type: Value
        value: "100"
  # Custom metric: Content monitoring alerts
  - type: Pods
    pods:
      metric:
        name: content_monitoring_alerts_per_minute
      target:
        type: AverageValue
        averageValue: "10"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 20
        periodSeconds: 90
      - type: Pods
        value: 1
        periodSeconds: 90
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 90
      policies:
      - type: Percent
        value: 75
        periodSeconds: 90
      - type: Pods
        value: 3
        periodSeconds: 90
      selectPolicy: Max
