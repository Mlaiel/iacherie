# PostgreSQL HPA (Read Replicas Only)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: postgresql-read-replicas-hpa
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: database-replicas
    environment: production
  annotations:
    description: "Auto-scaling for PostgreSQL read replicas based on query load"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postgresql-read-replicas
  minReplicas: 2
  maxReplicas: 8
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  # Memory-based scaling
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metric: Database connections
  - type: Pods
    pods:
      metric:
        name: postgres_active_connections
      target:
        type: AverageValue
        averageValue: "80"
  # Custom metric: Query execution time
  - type: Pods
    pods:
      metric:
        name: postgres_avg_query_time_ms
      target:
        type: AverageValue
        averageValue: "500"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes for database replicas
      policies:
      - type: Percent
        value: 25
        periodSeconds: 300
      - type: Pods
        value: 1
        periodSeconds: 300
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 180
      - type: Pods
        value: 1
        periodSeconds: 180
      selectPolicy: Max
