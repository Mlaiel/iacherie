  RIGHTS_MANAGEMENT_ENABLED: "true"
  DISPUTE_RESOLUTION_ENABLED: "true"
  
  # Project Workflow
  PROJECT_STAGES: "proposal,negotiation,production,review,completion"
  MILESTONE_TRACKING: "true"
  DEADLINE_NOTIFICATIONS: "true"
  PROGRESS_REPORTING: "true"
---
# Distribution Engine Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ia-distribution-config
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: distribution-engine
    environment: production
  annotations:
    description: "Multi-platform content distribution configuration"
data:
  # Distribution Settings
  DISTRIBUTION_ENABLED: "true"
  AUTO_DISTRIBUTION: "false"
  DISTRIBUTION_QUEUE_SIZE: "1000"
  DISTRIBUTION_RETRY_ATTEMPTS: "3"
  DISTRIBUTION_TIMEOUT: "300"
  
  # Platform Distribution
  SPOTIFY_DISTRIBUTION_ENABLED: "true"
  YOUTUBE_DISTRIBUTION_ENABLED: "true"
  INSTAGRAM_DISTRIBUTION_ENABLED: "true"
  TIKTOK_DISTRIBUTION_ENABLED: "true"
  SOUNDCLOUD_DISTRIBUTION_ENABLED: "true"
  
  # Content Optimization
  CONTENT_OPTIMIZATION_ENABLED: "true"
  IMAGE_OPTIMIZATION: "true"
  VIDEO_TRANSCODING: "true"
  AUDIO_NORMALIZATION: "true"
  METADATA_OPTIMIZATION: "true"
  
  # SEO Optimization
  SEO_ENABLED: "true"
  HASHTAG_OPTIMIZATION: "true"
  TITLE_OPTIMIZATION: "true"
  DESCRIPTION_OPTIMIZATION: "true"
  KEYWORD_EXTRACTION: "true"
  
  # CDN Configuration
  CDN_ENABLED: "true"
  CDN_PROVIDER: "cloudflare"
  CDN_CACHE_TTL: "86400"
  CDN_COMPRESSION: "true"
  
  # Analytics Integration
  DISTRIBUTION_ANALYTICS: "true"
  PERFORMANCE_TRACKING: "true"
  ENGAGEMENT_METRICS: "true"
  CONVERSION_TRACKING: "true"
---
# Notification Service Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ia-notification-config
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: notification-service
    environment: production
  annotations:
    description: "Real-time notifications and alerts configuration"
data:
  # Notification Settings
  NOTIFICATIONS_ENABLED: "true"
  NOTIFICATION_QUEUE_SIZE: "10000"
  NOTIFICATION_RETRY_ATTEMPTS: "3"
  NOTIFICATION_BATCH_SIZE: "100"
  
  # Email Notifications
  EMAIL_ENABLED: "true"
  EMAIL_PROVIDER: "sendgrid"
  EMAIL_FROM_ADDRESS: "notifications@ia-influencer-agent.com"
  EMAIL_FROM_NAME: "IA Influencer Agent"
  EMAIL_TEMPLATE_ENGINE: "jinja2"
  
  # SMS Notifications
  SMS_ENABLED: "true"
  SMS_PROVIDER: "twilio"
  SMS_FROM_NUMBER: "+4915123456789"
  SMS_MAX_LENGTH: "160"
  
  # Push Notifications
  PUSH_ENABLED: "true"
  PUSH_PROVIDER: "firebase"
  PUSH_ICON: "https://ia-influencer-agent.com/icon.png"
  PUSH_BADGE: "https://ia-influencer-agent.com/badge.png"
  
  # WebSocket Notifications
  WEBSOCKET_ENABLED: "true"
  WEBSOCKET_PORT: "8013"
  WEBSOCKET_PING_INTERVAL: "30"
  WEBSOCKET_PING_TIMEOUT: "10"
  
  # Slack Integration
  SLACK_ENABLED: "true"
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/..."
  SLACK_CHANNEL: "#ia-influencer-alerts"
  SLACK_USERNAME: "IA Influencer Bot"
  
  # Discord Integration
  DISCORD_ENABLED: "true"
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/..."
  DISCORD_USERNAME: "IA Influencer Bot"
  
  # Notification Templates
  TEMPLATE_PROTECTION_ALERT: "protection_alert"
  TEMPLATE_REVENUE_UPDATE: "revenue_update"
  TEMPLATE_COLLABORATION_REQUEST: "collaboration_request"
  TEMPLATE_SYSTEM_MAINTENANCE: "system_maintenance"
  TEMPLATE_SECURITY_ALERT: "security_alert"
