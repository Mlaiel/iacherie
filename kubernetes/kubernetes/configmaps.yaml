# Monitoring Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ia-monitoring-config
  namespace: ia-monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: monitoring
    environment: production
  annotations:
    description: "Monitoring and observability configuration"
data:
  # Prometheus Configuration
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'ia-influencer-prod'
        environment: 'production'
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - 'alertmanager:9093'
    
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      - job_name: 'ia-influencer-app'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ia-influencer-prod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
  
  # AlertManager Configuration
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'alerts@ia-influencer-agent.com'
    
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
        - match:
            severity: warning
          receiver: 'warning-alerts'
    
    receivers:
      - name: 'web.hook'
        webhook_configs:
          - url: 'http://alertmanager-webhook:5000/alerts'
      
      - name: 'critical-alerts'
        email_configs:
          - to: 'mlaiel@live.de'
            subject: 'CRITICAL: IA Influencer Agent Alert'
            body: |
              Alert: {{ .GroupLabels.alertname }}
              Severity: {{ .GroupLabels.severity }}
              Instance: {{ .CommonLabels.instance }}
              Description: {{ .CommonAnnotations.description }}
        slack_configs:
          - api_url: '{{ .slack_webhook_url }}'
            channel: '#ia-influencer-alerts'
            title: 'CRITICAL Alert'
            text: '{{ .CommonAnnotations.description }}'
      
      - name: 'warning-alerts'
        email_configs:
          - to: 'alerts@ia-influencer-agent.com'
            subject: 'WARNING: IA Influencer Agent Alert'
            body: |
              Alert: {{ .GroupLabels.alertname }}
              Severity: {{ .GroupLabels.severity }}
              Instance: {{ .CommonLabels.instance }}
              Description: {{ .CommonAnnotations.description }}
  
  # Grafana Configuration
  grafana.ini: |
    [server]
    http_port = 3000
    root_url = https://monitoring.ia-influencer-agent.com
    
    [security]
    admin_user = admin
    cookie_secure = true
    cookie_samesite = strict
    
    [auth]
    disable_login_form = false
    
    [auth.anonymous]
    enabled = false
    
    [database]
    type = postgres
    host = postgresql-service:5432
    name = grafana
    user = grafana
    
    [alerting]
    enabled = true
    
    [metrics]
    enabled = true
    
    [log]
    mode = console
    level = info
---
# Logging Configuration
