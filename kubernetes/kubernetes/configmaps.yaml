# Fingerprinting Engine Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ia-fingerprinting-config
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: fingerprinting-engine
    environment: production
  annotations:
    description: "Multi-content fingerprinting engine configuration"
data:
  # General Fingerprinting Settings
  FINGERPRINTING_ENABLED: "true"
  FINGERPRINT_VECTOR_SIZE: "512"
  FINGERPRINT_SIMILARITY_THRESHOLD: "0.85"
  FINGERPRINT_BATCH_SIZE: "64"
  FINGERPRINT_PARALLEL_WORKERS: "8"
  
  # Audio Fingerprinting
  AUDIO_FINGERPRINTING_ENABLED: "true"
  AUDIO_FINGERPRINT_ALGORITHM: "chromaprint"
  AUDIO_SEGMENT_DURATION: "30"
  AUDIO_OVERLAP_DURATION: "5"
  AUDIO_FEATURE_EXTRACTION: "mfcc,spectral,tempo"
  
  # Video Fingerprinting
  VIDEO_FINGERPRINTING_ENABLED: "true"
  VIDEO_FRAME_EXTRACTION_RATE: "1"
  VIDEO_KEYFRAME_DETECTION: "true"
  VIDEO_OPTICAL_FLOW: "true"
  VIDEO_HASH_ALGORITHM: "phash"
  
  # Image Fingerprinting
  IMAGE_FINGERPRINTING_ENABLED: "true"
  IMAGE_RESIZE_TARGET: "224x224"
  IMAGE_HASH_ALGORITHMS: "phash,dhash,whash,colorhash"
  IMAGE_FEATURE_EXTRACTION: "clip,resnet,vgg"
  
  # Text Fingerprinting
  TEXT_FINGERPRINTING_ENABLED: "true"
  TEXT_EMBEDDING_MODEL: "bert-base-multilingual-cased"
  TEXT_SIMILARITY_ALGORITHM: "cosine"
  TEXT_PREPROCESSING: "lowercase,remove_punctuation,tokenize"
  
  # FAISS Configuration
  FAISS_INDEX_TYPE: "IndexIVFFlat"
  FAISS_NLIST: "1024"
  FAISS_NPROBE: "32"
  FAISS_METRIC_TYPE: "METRIC_INNER_PRODUCT"
  
  # OpenCV Settings
  OPENCV_NUM_THREADS: "8"
  OPENCV_USE_OPTIMIZED: "true"
  OPENCV_DNN_BACKEND: "OPENCV_DNN_BACKEND_CUDA"
  OPENCV_DNN_TARGET: "OPENCV_DNN_TARGET_CUDA"
---
