  LOG_CONSOLE_ENABLED: "true"
  
  # Structured Logging
  LOG_INCLUDE_TIMESTAMP: "true"
  LOG_INCLUDE_LEVEL: "true"
  LOG_INCLUDE_LOGGER: "true"
  LOG_INCLUDE_THREAD: "false"
  LOG_INCLUDE_PROCESS: "true"
  
  # Log Levels by Module
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_APP: "INFO"
  LOG_LEVEL_API: "INFO"
  LOG_LEVEL_DATABASE: "WARNING"
  LOG_LEVEL_CELERY: "INFO"
  LOG_LEVEL_ML: "INFO"
  LOG_LEVEL_PROTECTION: "DEBUG"
  
  # Log Retention
  LOG_RETENTION_DAYS: "30"
  LOG_CLEANUP_ENABLED: "true"
  LOG_CLEANUP_INTERVAL: "86400"
