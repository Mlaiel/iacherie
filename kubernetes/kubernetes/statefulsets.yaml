# MongoDB StatefulSet (for Analytics)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "MongoDB for analytics and unstructured data"
spec:
  serviceName: mongodb-headless
  replicas: 3
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/instance: production
        app.kubernetes.io/component: analytics
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9216"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        fsGroup: 999
      containers:
      - name: mongodb
        image: mongo:7.0.4
        imagePullPolicy: IfNotPresent
        ports:
        - name: mongodb
          containerPort: 27017
          protocol: TCP
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: mongodb-user
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: mongodb-password
        - name: MONGO_INITDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: mongodb-db
        - name: TZ
          value: "Europe/Berlin"
        command:
        - mongod
        - --auth
        - --bind_ip_all
        - --replSet
        - rs0
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: mongodb-config
          mountPath: /data/configdb
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      - name: mongodb-exporter
        image: percona/mongodb_exporter:0.40.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9216
          protocol: TCP
        env:
        - name: MONGODB_URI
          value: "mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@localhost:27017/admin"
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: mongodb-user
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: mongodb-password
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: mongodb-config
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: analytics
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ia-fast-ssd
      resources:
        requests:
          storage: 200Gi
