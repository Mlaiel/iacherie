# Elasticsearch StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Elasticsearch for search and logging"
spec:
  serviceName: elasticsearch-headless
  replicas: 3
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/instance: production
        app.kubernetes.io/component: search
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9114"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
      - name: increase-vm-max-map
        image: busybox:1.36
        command: ["sysctl", "-w", "vm.max_map_count=262144"]
        securityContext:
          privileged: true
      containers:
      - name: elasticsearch
        image: elasticsearch:8.11.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9200
          protocol: TCP
        - name: transport
          containerPort: 9300
          protocol: TCP
        env:
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: cluster.name
          value: "ia-elasticsearch"
        - name: cluster.initial_master_nodes
          value: "elasticsearch-0,elasticsearch-1,elasticsearch-2"
        - name: discovery.seed_hosts
          value: "elasticsearch-headless"
        - name: ES_JAVA_OPTS
          value: "-Xms2g -Xmx2g"
        - name: xpack.security.enabled
          value: "false"
        - name: xpack.monitoring.collection.enabled
          value: "true"
        - name: TZ
          value: "Europe/Berlin"
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
        - name: elasticsearch-config
          mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
          subPath: elasticsearch.yml
        resources:
          requests:
            memory: "3Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=5s
            port: 9200
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      - name: elasticsearch-exporter
        image: prometheuscommunity/elasticsearch-exporter:v1.6.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: metrics
          containerPort: 9114
          protocol: TCP
        args:
        - --es.uri=http://localhost:9200
        - --es.all
        - --es.indices
        - --es.cluster_settings
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: elasticsearch-config
        configMap:
          name: elasticsearch-config
  volumeClaimTemplates:
  - metadata:
      name: elasticsearch-data
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/component: search
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ia-fast-ssd
      resources:
        requests:
          storage: 300Gi
---
# FAISS Vector Database StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: faiss
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: faiss
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: vector-database
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "FAISS vector database for similarity search"
spec:
  serviceName: faiss-headless
  replicas: 2
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: faiss
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faiss
        app.kubernetes.io/instance: production
        app.kubernetes.io/component: vector-database
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        fsGroup: 1000
      containers:
      - name: faiss-server
        image: ia-influencer-faiss:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 8081
          protocol: TCP
        env:
        - name: FAISS_DATA_PATH
          value: "/data/faiss"
        - name: FAISS_INDEX_TYPE
          value: "IndexIVFFlat"
        - name: FAISS_DIMENSION
          value: "512"
        - name: FAISS_NLIST
          value: "1024"
        - name: FAISS_NPROBE
          value: "32"
        - name: FAISS_GPU_ENABLED
          value: "true"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        volumeMounts:
        - name: faiss-data
          mountPath: /data/faiss
        - name: faiss-config
          mountPath: /config
        - name: faiss-indexes
          mountPath: /indexes
        resources:
          requests:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
          limits:
            memory: "16Gi"
            cpu: "8000m"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: faiss-config
        configMap:
          name: faiss-config
      - name: faiss-indexes
        emptyDir:
          sizeLimit: 100Gi
  volumeClaimTemplates:
  - metadata:
      name: faiss-data
      labels:
        app.kubernetes.io/name: faiss
        app.kubernetes.io/component: vector-database
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ia-fast-ssd
      resources:
        requests:
          storage: 500Gi
---
# MinIO Object Storage StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: ia-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "MinIO S3-compatible object storage"
spec:
  serviceName: minio-headless
  replicas: 4
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/instance: production
        app.kubernetes.io/component: object-storage
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/minio/v2/metrics/cluster"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        fsGroup: 1000
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-01-01T16-36-33Z
        imagePullPolicy: IfNotPresent
        ports:
        - name: api
          containerPort: 9000
          protocol: TCP
        - name: console
          containerPort: 9001
          protocol: TCP
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: ia-storage-secrets
              key: minio-access-key
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ia-storage-secrets
              key: minio-secret-key
        - name: MINIO_CONSOLE_ADDRESS
          value: ":9001"
        - name: MINIO_PROMETHEUS_AUTH_TYPE
          value: "public"
        - name: MINIO_BROWSER_REDIRECT_URL
          value: "https://console.ia-influencer-agent.com"
        command:
        - /bin/bash
        - -c
        args:
        - minio server http://minio-{0...3}.minio-headless.ia-storage.svc.cluster.local/data --console-address ":9001"
        volumeMounts:
        - name: minio-data
          mountPath: /data
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: minio-data
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: object-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ia-standard
      resources:
        requests:
          storage: 1Ti
---
# ETCD for Distributed Configuration StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: distributed-config
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "ETCD for distributed configuration and coordination"
spec:
  serviceName: etcd-headless
  replicas: 3
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd
        app.kubernetes.io/instance: production
        app.kubernetes.io/component: distributed-config
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2379"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        fsGroup: 1000
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.10
        imagePullPolicy: IfNotPresent
        ports:
        - name: client
          containerPort: 2379
          protocol: TCP
        - name: peer
          containerPort: 2380
          protocol: TCP
        env:
        - name: ETCD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ETCD_DATA_DIR
          value: "/var/lib/etcd"
        - name: ETCD_LISTEN_CLIENT_URLS
          value: "http://0.0.0.0:2379"
        - name: ETCD_LISTEN_PEER_URLS
          value: "http://0.0.0.0:2380"
        - name: ETCD_ADVERTISE_CLIENT_URLS
          value: "http://$(ETCD_NAME).etcd-headless:2379"
        - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
          value: "http://$(ETCD_NAME).etcd-headless:2380"
        - name: ETCD_INITIAL_CLUSTER
          value: "etcd-0=http://etcd-0.etcd-headless:2380,etcd-1=http://etcd-1.etcd-headless:2380,etcd-2=http://etcd-2.etcd-headless:2380"
        - name: ETCD_INITIAL_CLUSTER_STATE
          value: "new"
        - name: ETCD_INITIAL_CLUSTER_TOKEN
          value: "ia-influencer-etcd-cluster"
        volumeMounts:
        - name: etcd-data
          mountPath: /var/lib/etcd
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 2379
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 2379
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: etcd-data
      labels:
        app.kubernetes.io/name: etcd
        app.kubernetes.io/component: distributed-config
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ia-fast-ssd
      resources:
        requests:
          storage: 20Gi
---
# Kafka for Event Streaming StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: event-streaming
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Apache Kafka for event streaming and messaging"
spec:
  serviceName: kafka-headless
  replicas: 3
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/instance: production
        app.kubernetes.io/component: event-streaming
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7071"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        fsGroup: 1001
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: kafka
          containerPort: 9092
          protocol: TCP
        - name: metrics
          containerPort: 7071
          protocol: TCP
        env:
        - name: KAFKA_BROKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['kafka.io/broker-id']
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-0.zookeeper-headless:2181,zookeeper-1.zookeeper-headless:2181,zookeeper-2.zookeeper-headless:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://$(POD_NAME).kafka-headless:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx2G -Xms2G"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data"
        - name: KAFKA_LOG_RETENTION_HOURS
          value: "168"
        - name: KAFKA_LOG_SEGMENT_BYTES
          value: "1073741824"
        - name: KAFKA_NUM_PARTITIONS
          value: "3"
        - name: KAFKA_DEFAULT_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: "2"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data
        resources:
          requests:
            memory: "3Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: event-streaming
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ia-fast-ssd
      resources:
        requests:
          storage: 200Gi
---
# ZooKeeper for Kafka Coordination StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: coordination
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Apache ZooKeeper for Kafka coordination"
spec:
  serviceName: zookeeper-headless
  replicas: 3
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/instance: production
        app.kubernetes.io/component: coordination
        environment: production
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        fsGroup: 1001
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: client
          containerPort: 2181
          protocol: TCP
        - name: server
          containerPort: 2888
          protocol: TCP
        - name: leader-election
          containerPort: 3888
          protocol: TCP
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: ZOOKEEPER_INIT_LIMIT
          value: "5"
        - name: ZOOKEEPER_SYNC_LIMIT
          value: "2"
        - name: ZOOKEEPER_SERVERS
          value: "zookeeper-0.zookeeper-headless:2888:3888;zookeeper-1.zookeeper-headless:2888:3888;zookeeper-2.zookeeper-headless:2888:3888"
        - name: ZOOKEEPER_SERVER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['zookeeper.io/server-id']
        - name: ZOOKEEPER_DATA_DIR
          value: "/var/lib/zookeeper/data"
        - name: ZOOKEEPER_DATA_LOG_DIR
          value: "/var/lib/zookeeper/log"
        volumeMounts:
        - name: zookeeper-data
          mountPath: /var/lib/zookeeper
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "echo ruok | nc localhost 2181 | grep imok"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "echo ruok | nc localhost 2181 | grep imok"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: zookeeper-data
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/component: coordination
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ia-fast-ssd
      resources:
        requests:
          storage: 50Gi
