---
# Allow Inter-Service Communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inter-service-communication
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: network-security
    environment: production
  annotations:
    description: "Allow communication between application services"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ia-influencer-agent
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: ia-influencer-agent
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8003
    - protocol: TCP
      port: 8004
    - protocol: TCP
      port: 8005
    - protocol: TCP
      port: 5555
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: ia-influencer-agent
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8002
    - protocol: TCP
      port: 8003
    - protocol: TCP
      port: 8004
    - protocol: TCP
      port: 8005
    - protocol: TCP
      port: 5555
---
# Allow External API Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-api-access
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: network-security
    environment: production
  annotations:
    description: "Allow services to access external APIs"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ia-influencer-agent
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS traffic to external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP traffic (for APIs that don't support HTTPS)
  - to: []
    ports:
    - protocol: TCP
      port: 80
  # Allow SMTP for email notifications
  - to: []
    ports:
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 465
---
# Allow Monitoring Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-access
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: network-security
    environment: production
  annotations:
    description: "Allow monitoring namespace to scrape metrics"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ia-monitoring
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9187
    - protocol: TCP
      port: 9121
    - protocol: TCP
      port: 9216
    - protocol: TCP
      port: 9114
    - protocol: TCP
      port: 8080
---
# Network Policy for Monitoring Namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-network-policy
  namespace: ia-monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/component: network-security
    environment: production
  annotations:
    description: "Network policy for monitoring services"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9093
  # Allow internal monitoring communication
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9093
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow access to application namespace for metrics
  - to:
    - namespaceSelector:
        matchLabels:
          name: ia-influencer-prod
  # Allow HTTPS for external integrations (Slack, PagerDuty)
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow SMTP for email alerts
  - to: []
    ports:
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 465
---
# Network Policy for Storage Namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-network-policy
  namespace: ia-storage
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/component: network-security
    environment: production
  annotations:
    description: "Network policy for storage services"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9001
  # Allow access from application namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: ia-influencer-prod
    ports:
    - protocol: TCP
      port: 9000
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# Deny Cross-Namespace Communication (except monitoring)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: network-security
    environment: production
  annotations:
    description: "Deny cross-namespace communication except monitoring"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  egress:
  # Deny egress to other namespaces except monitoring and storage
  - to:
    - namespaceSelector:
        matchLabels:
          name: ia-monitoring
  - to:
    - namespaceSelector:
        matchLabels:
          name: ia-storage
  # Allow same namespace communication
  - to:
    - namespaceSelector:
        matchLabels:
          name: ia-influencer-prod
  # Allow egress to external networks (internet)
  - to: []
