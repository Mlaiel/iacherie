# Default Deny All Policy for Production Namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: network-security
    environment: production
  annotations:
    description: "Default deny all traffic - explicit allow required"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow Ingress Controller Access to API Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api-gateway
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: network-security
    environment: production
  annotations:
    description: "Allow ingress controller to access API gateway"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 8000
---
# Allow API Gateway to Database Services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-to-databases
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: network-security
    environment: production
  annotations:
    description: "Allow API gateway to access database services"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: api-gateway
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: analytics
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: workers
    ports:
    - protocol: TCP
      port: 5432
---
# Allow Redis Access from Application Components
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-access
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: network-security
    environment: production
  annotations:
    description: "Allow application components to access Redis"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: api-gateway
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: ml-engine
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: content-protection
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: analytics
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: workers
