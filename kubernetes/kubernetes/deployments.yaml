# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-api-gateway
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Main API Gateway deployment"
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ia-influencer-agent
      app.kubernetes.io/component: api-gateway
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia-influencer-agent
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/instance: production
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: api-gateway
        image: ia-influencer-agent:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        - name: APP_COMPONENT
          value: "api-gateway"
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgresql-service:5432/$(POSTGRES_DB)"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-service:6379/0"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: postgres-db
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: redis-password
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ia-app-secrets
              key: jwt-secret-key
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: ia-app-secrets
              key: api-key
        envFrom:
        - configMapRef:
            name: ia-app-config
        - configMapRef:
            name: ia-database-config
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: app-config
          mountPath: /app/config
        - name: upload-storage
          mountPath: /app/uploads
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /startup
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: app-logs
        persistentVolumeClaim:
          claimName: ia-logs-pvc
      - name: app-config
        configMap:
          name: ia-app-config
      - name: upload-storage
        persistentVolumeClaim:
          claimName: ia-uploads-pvc
      terminationGracePeriodSeconds: 30
---
# ML Engine Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-ml-engine
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: ml-engine
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Machine Learning engine deployment"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ia-influencer-agent
      app.kubernetes.io/component: ml-engine
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia-influencer-agent
        app.kubernetes.io/component: ml-engine
        app.kubernetes.io/instance: production
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ml-engine
        image: ia-influencer-ml:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        - name: grpc
          containerPort: 8002
          protocol: TCP
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        - name: APP_COMPONENT
          value: "ml-engine"
        - name: GPU_ENABLED
          value: "true"
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1"
        envFrom:
        - configMapRef:
            name: ia-ml-config
        volumeMounts:
        - name: ml-models
          mountPath: /app/models
        - name: app-logs
          mountPath: /app/logs
        - name: tmp-processing
          mountPath: /tmp/processing
        resources:
          requests:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
          limits:
            memory: "16Gi"
            cpu: "8000m"
            nvidia.com/gpu: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: ml-models
        persistentVolumeClaim:
          claimName: ia-models-pvc
      - name: app-logs
        persistentVolumeClaim:
          claimName: ia-logs-pvc
      - name: tmp-processing
        emptyDir:
          sizeLimit: 50Gi
      terminationGracePeriodSeconds: 60
---
# Content Protection Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-protection-service
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: content-protection
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Content protection and fingerprinting deployment"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ia-influencer-agent
      app.kubernetes.io/component: content-protection
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia-influencer-agent
        app.kubernetes.io/component: content-protection
        app.kubernetes.io/instance: production
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: protection-service
        image: ia-influencer-protection:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8003
          protocol: TCP
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        - name: APP_COMPONENT
          value: "content-protection"
        - name: FAISS_SERVICE_URL
          value: "http://faiss-service:8080"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch-service:9200"
        envFrom:
        - configMapRef:
            name: ia-protection-config
        - secretRef:
            name: ia-api-keys
        volumeMounts:
        - name: fingerprint-data
          mountPath: /app/fingerprints
        - name: app-logs
          mountPath: /app/logs
        - name: crawl-cache
          mountPath: /app/cache
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: fingerprint-data
        persistentVolumeClaim:
          claimName: ia-faiss-pvc
      - name: app-logs
        persistentVolumeClaim:
          claimName: ia-logs-pvc
      - name: crawl-cache
        emptyDir:
          sizeLimit: 10Gi
      terminationGracePeriodSeconds: 45
