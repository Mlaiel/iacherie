# Celery Workers Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-celery-workers
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: workers
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Celery background workers deployment"
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ia-influencer-agent
      app.kubernetes.io/component: workers
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia-influencer-agent
        app.kubernetes.io/component: workers
        app.kubernetes.io/instance: production
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5555"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: celery-worker
        image: ia-influencer-agent:latest
        imagePullPolicy: Always
        command: ["celery", "-A", "app.tasks.celery", "worker", "--loglevel=info", "--concurrency=4"]
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        - name: APP_COMPONENT
          value: "worker"
        - name: CELERY_BROKER_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-service:6379/1"
        - name: CELERY_RESULT_BACKEND
          value: "redis://:$(REDIS_PASSWORD)@redis-service:6379/2"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: redis-password
        envFrom:
        - configMapRef:
            name: ia-app-config
        - configMapRef:
            name: ia-ml-config
        - configMapRef:
            name: ia-protection-config
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: worker-tmp
          mountPath: /tmp/worker
        - name: upload-storage
          mountPath: /app/uploads
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - app.tasks.celery
            - inspect
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      - name: flower
        image: mher/flower:1.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: flower
          containerPort: 5555
          protocol: TCP
        env:
        - name: CELERY_BROKER_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-service:6379/1"
        - name: FLOWER_PORT
          value: "5555"
        - name: FLOWER_BASIC_AUTH
          value: "admin:flower123"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ia-db-secrets
              key: redis-password
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
      volumes:
      - name: app-logs
        persistentVolumeClaim:
          claimName: ia-logs-pvc
      - name: worker-tmp
        emptyDir:
          sizeLimit: 10Gi
      - name: upload-storage
        persistentVolumeClaim:
          claimName: ia-uploads-pvc
      terminationGracePeriodSeconds: 60
---
