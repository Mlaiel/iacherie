# Analytics Service for Business Intelligence
apiVersion: v1
kind: Service
metadata:
  name: ia-analytics-service
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: analytics-service
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Analytics service for business intelligence and metrics"
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: analytics-service
    app.kubernetes.io/instance: production
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
---
