# Storage Class for High Performance SSD
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ia-fast-ssd
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: storage
    environment: production
  annotations:
    description: "High-performance SSD storage for databases and cache"
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: kubernetes.io/aws-ebs  # Change based on cloud provider
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
  fsType: ext4
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
# Storage Class for Standard Storage
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ia-standard
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: storage
    environment: production
  annotations:
    description: "Standard storage for application data and logs"
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: kubernetes.io/aws-ebs  # Change based on cloud provider
parameters:
  type: gp2
  encrypted: "true"
  fsType: ext4
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
# Storage Class for Backup and Archive
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ia-archive
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/component: storage
    environment: production
  annotations:
    description: "Archive storage for backups and long-term data"
provisioner: kubernetes.io/aws-ebs  # Change based on cloud provider
parameters:
  type: sc1
  encrypted: "true"
  fsType: ext4
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
# Persistent Volume for PostgreSQL Data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ia-postgres-pv-0
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    environment: production
  annotations:
    description: "PostgreSQL primary data volume"
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ia-fast-ssd
  hostPath:  # Replace with actual storage backend
    path: /data/postgres-0
    type: DirectoryOrCreate
---
# Persistent Volume for PostgreSQL Backup
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ia-postgres-backup-pv
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: backup
    environment: production
  annotations:
    description: "PostgreSQL backup storage"
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ia-archive
  hostPath:  # Replace with actual storage backend
    path: /backup/postgres
    type: DirectoryOrCreate
