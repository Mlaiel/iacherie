# Selenium Grid Hub Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-hub
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: selenium
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: hub
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Selenium Grid Hub for web crawling"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: selenium
      app.kubernetes.io/component: hub
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: selenium
        app.kubernetes.io/component: hub
        app.kubernetes.io/instance: production
        environment: production
    spec:
      serviceAccountName: ia-influencer-app
      containers:
      - name: selenium-hub
        image: selenium/hub:4.15.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: hub
          containerPort: 4444
          protocol: TCP
        - name: event-bus
          containerPort: 4442
          protocol: TCP
        - name: session-map
          containerPort: 4443
          protocol: TCP
        env:
        - name: GRID_MAX_SESSION
          value: "16"
        - name: GRID_BROWSER_TIMEOUT
          value: "300"
        - name: GRID_TIMEOUT
          value: "300"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /wd/hub/status
            port: 4444
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /wd/hub/status
            port: 4444
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      terminationGracePeriodSeconds: 30
---
# Selenium Chrome Node Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selenium-chrome-node
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: selenium
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: chrome-node
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Selenium Chrome Node for web crawling"
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: selenium
      app.kubernetes.io/component: chrome-node
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: selenium
        app.kubernetes.io/component: chrome-node
        app.kubernetes.io/instance: production
        environment: production
    spec:
      serviceAccountName: ia-influencer-app
      containers:
      - name: selenium-chrome-node
        image: selenium/node-chrome:4.15.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: node
          containerPort: 5555
          protocol: TCP
        env:
        - name: HUB_HOST
          value: "selenium-hub-service"
        - name: HUB_PORT
          value: "4444"
        - name: NODE_MAX_INSTANCES
          value: "4"
        - name: NODE_MAX_SESSION
          value: "4"
        - name: SE_EVENT_BUS_HOST
          value: "selenium-hub-service"
        - name: SE_EVENT_BUS_PUBLISH_PORT
          value: "4442"
        - name: SE_EVENT_BUS_SUBSCRIBE_PORT
          value: "4443"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: dev-shm
          mountPath: /dev/shm
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /status
            port: 5555
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /status
            port: 5555
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      terminationGracePeriodSeconds: 30
---
