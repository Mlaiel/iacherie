# Blockchain Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-blockchain-service
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: blockchain-service
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Blockchain and smart contracts deployment"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ia-influencer-agent
      app.kubernetes.io/component: blockchain-service
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia-influencer-agent
        app.kubernetes.io/component: blockchain-service
        app.kubernetes.io/instance: production
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8017"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: blockchain-service
        image: ia-influencer-blockchain:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8017
          protocol: TCP
        - name: rpc
          containerPort: 8545
          protocol: TCP
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        - name: APP_COMPONENT
          value: "blockchain-service"
        - name: ETHEREUM_ENABLED
          value: "true"
        - name: POLYGON_ENABLED
          value: "true"
        - name: IPFS_ENABLED
          value: "true"
        - name: SMART_CONTRACTS_ENABLED
          value: "true"
        - name: WEB3_PROVIDER_URL
          valueFrom:
            secretKeyRef:
              name: ia-blockchain-secrets
              key: ethereum-rpc-url
        - name: PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: ia-blockchain-secrets
              key: ethereum-private-key
        envFrom:
        - configMapRef:
            name: ia-blockchain-config
        volumeMounts:
        - name: blockchain-data
          mountPath: /app/blockchain_data
        - name: app-logs
          mountPath: /app/logs
        - name: contracts-cache
          mountPath: /app/contracts
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8017
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8017
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: blockchain-data
        persistentVolumeClaim:
          claimName: ia-blockchain-data-pvc
      - name: app-logs
        persistentVolumeClaim:
          claimName: ia-logs-pvc
      - name: contracts-cache
        emptyDir:
          sizeLimit: 2Gi
      terminationGracePeriodSeconds: 30
