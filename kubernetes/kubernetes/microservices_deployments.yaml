# MinIO Object Storage Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: ia-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "MinIO S3-compatible object storage"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/instance: production
        environment: production
    spec:
      serviceAccountName: ia-storage-app
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-01-16T16-07-38Z
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        args:
        - minio server /data --console-address ":9001"
        ports:
        - name: api
          containerPort: 9000
          protocol: TCP
        - name: console
          containerPort: 9001
          protocol: TCP
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: ia-storage-secrets
              key: minio-access-key
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ia-storage-secrets
              key: minio-secret-key
        - name: MINIO_BROWSER_REDIRECT_URL
          value: "https://minio-console.ia-influencer-agent.com"
        volumeMounts:
        - name: minio-data
          mountPath: /data
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: ia-minio-data-pvc
      terminationGracePeriodSeconds: 30
