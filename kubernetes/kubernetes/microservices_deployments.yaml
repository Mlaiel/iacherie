# Video Processing Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-video-processor
  namespace: ia-influencer-prod
  labels:
    app.kubernetes.io/name: ia-influencer-agent
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: video-processor
    app.kubernetes.io/part-of: ia-influencer-platform
    environment: production
  annotations:
    description: "Video processing and analysis deployment"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ia-influencer-agent
      app.kubernetes.io/component: video-processor
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ia-influencer-agent
        app.kubernetes.io/component: video-processor
        app.kubernetes.io/instance: production
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8014"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ia-influencer-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: video-processor
        image: ia-influencer-video:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8014
          protocol: TCP
        env:
        - name: APP_ENVIRONMENT
          value: "production"
        - name: APP_COMPONENT
          value: "video-processor"
        - name: GPU_ENABLED
          value: "true"
        - name: FFMPEG_ENABLED
          value: "true"
        - name: OPENCV_ENABLED
          value: "true"
        - name: YOLO_MODEL_ENABLED
          value: "true"
        - name: VIDEO_ANALYSIS_ENABLED
          value: "true"
        envFrom:
        - configMapRef:
            name: ia-video-config
        volumeMounts:
        - name: video-storage
          mountPath: /app/video
        - name: app-logs
          mountPath: /app/logs
        - name: video-tmp
          mountPath: /tmp/video
        - name: models-cache
          mountPath: /app/models
        resources:
          requests:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
          limits:
            memory: "16Gi"
            cpu: "8000m"
            nvidia.com/gpu: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8014
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8014
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: video-storage
        persistentVolumeClaim:
          claimName: ia-video-processing-pvc
      - name: app-logs
        persistentVolumeClaim:
          claimName: ia-logs-pvc
      - name: video-tmp
        emptyDir:
          sizeLimit: 100Gi
      - name: models-cache
        persistentVolumeClaim:
          claimName: ia-models-pvc
      terminationGracePeriodSeconds: 60
---
