# Ainflue Platform - Complete Kubernetes Manifests
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready Kubernetes configurations

---
apiVersion: v1
kind: Namespace
metadata:
  name: ainflue
  labels:
    name: ainflue
    environment: production
    managed-by: ainflue-platform
    
---
apiVersion: v1
kind: Namespace
metadata:
  name: ainflue-monitoring
  labels:
    name: ainflue-monitoring
    environment: production
    managed-by: ainflue-platform

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ainflue-config
  namespace: ainflue
data:
  # Application Configuration
  APP_NAME: "Ainflue"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  
  # Server Configuration
  HOST: "0.0.0.0"
  PORT: "8000"
  WORKERS: "4"
  MAX_CONNECTIONS: "1000"
  
  # Database Configuration
  DATABASE_HOST: "postgresql-primary.ainflue.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "ainflue_platform"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "30"
  DATABASE_POOL_TIMEOUT: "30"
  
  # Redis Configuration
  REDIS_HOST: "redis-master.ainflue.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "10"
  REDIS_TIMEOUT: "5"
  
  # MongoDB Configuration
  MONGO_HOST: "mongodb.ainflue.svc.cluster.local"
  MONGO_PORT: "27017"
  MONGO_DATABASE: "ainflue_documents"
  
  # Elasticsearch Configuration
  ELASTICSEARCH_HOST: "elasticsearch.ainflue.svc.cluster.local"
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_INDEX_PREFIX: "ainflue"
  
  # AI Configuration
  AI_MODEL_PATH: "/app/models"
  AI_BATCH_SIZE: "32"
  AI_MAX_WORKERS: "4"
  AI_TIMEOUT: "30"
  AI_GPU_ENABLED: "true"
  
  # Security Configuration
  CORS_ORIGINS: "https://app.ainflue.com,https://dashboard.ainflue.com"
  RATE_LIMIT_PER_MINUTE: "100"
  RATE_LIMIT_BURST: "200"
  SESSION_TIMEOUT: "3600"
  
  # Monitoring Configuration
  METRICS_PORT: "8080"
  HEALTH_CHECK_PORT: "8081"
  PROMETHEUS_ENABLED: "true"
  JAEGER_ENABLED: "true"
  
  # Platform Integration Configuration
  YOUTUBE_API_VERSION: "v3"
  INSTAGRAM_API_VERSION: "v17.0"
  TIKTOK_API_VERSION: "v1"
  SPOTIFY_API_VERSION: "v1"
  TWITTER_API_VERSION: "2"
  
  # Content Protection Configuration
  FINGERPRINT_ACCURACY_THRESHOLD: "0.85"
  VIOLATION_SCAN_INTERVAL: "300"
  AUTO_TAKEDOWN_ENABLED: "true"
  
  # Revenue Configuration
  REVENUE_CALCULATION_INTERVAL: "3600"
  PAYOUT_THRESHOLD_USD: "10.00"
  COMMISSION_RATE: "0.05"
  
  # Performance Configuration
  WORKER_TIMEOUT: "120"
  WORKER_KEEPALIVE: "5"
  MAX_REQUESTS_PER_WORKER: "1000"
  GRACEFUL_SHUTDOWN_TIMEOUT: "30"
  
  # AI Model Configuration
  AI_MODEL_CACHE_SIZE: "5GB"
  AI_MODEL_MEMORY_LIMIT: "8GB"
  AI_INFERENCE_TIMEOUT: "30"
  AI_BATCH_PROCESSING: "true"
  AI_GPU_MEMORY_FRACTION: "0.7"
  
  # Content Processing
  MAX_CONTENT_SIZE_MB: "500"
  SUPPORTED_FORMATS: "mp3,mp4,wav,flac,aac,mov,avi,mkv,jpg,jpeg,png,gif,webp,pdf,txt,doc,docx"
  CONTENT_RETENTION_DAYS: "2555"
  THUMBNAIL_GENERATION: "true"
  
  # API Configuration
  API_RATE_LIMIT_PER_MINUTE: "100"
  API_RATE_LIMIT_BURST: "200"
  API_KEY_ROTATION_DAYS: "90"
  API_TIMEOUT_SECONDS: "30"
  
  # Cache Configuration
  CACHE_TTL_SECONDS: "3600"
  CACHE_MAX_SIZE_MB: "1024"
  CACHE_COMPRESSION: "true"
  
  # Security Configuration
  SESSION_TIMEOUT_MINUTES: "30"
  JWT_EXPIRY_HOURS: "8"
  OAUTH_TOKEN_EXPIRY_HOURS: "24"
  PASSWORD_RESET_EXPIRY_MINUTES: "15"
  
  # Notification Configuration
  EMAIL_QUEUE_SIZE: "1000"
  SMS_QUEUE_SIZE: "500"
  PUSH_NOTIFICATION_QUEUE_SIZE: "5000"
  NOTIFICATION_RETRY_ATTEMPTS: "3"
  
  # Business Logic Configuration
  REVENUE_SHARING_PERCENTAGE: "85"
  PLATFORM_FEE_PERCENTAGE: "15"
  MINIMUM_PAYOUT_AMOUNT: "10.00"
  CURRENCY_DEFAULT: "USD"
  
  # Backup Configuration
  BACKUP_FREQUENCY_HOURS: "6"
  BACKUP_RETENTION_DAYS: "30"
  INCREMENTAL_BACKUP: "true"
  
  # Compliance Configuration
  GDPR_COMPLIANCE: "true"
  CCPA_COMPLIANCE: "true"
  DATA_RETENTION_POLICY_DAYS: "2555"
  AUDIT_LOG_RETENTION_DAYS: "2555"