#
# This configuration file provides examples for all cloud deployment
# settings for the IA Influencer Agent platform.

# Global Cloud Configuration
cloud:
  # Deployment Strategy
  strategy: "multi_cloud_active_active"  # single_cloud, multi_cloud_active_active, multi_cloud_active_passive, hybrid_cloud
  
  # Default Settings
  default_region: "us-east-1"
  default_environment: "production"
  
  # Provider Configuration
  providers:
    aws:
      enabled: true
      primary: true
      regions:
        - "us-east-1"
        - "eu-west-1"
        - "ap-southeast-1"
      credentials:
        access_key_id: "${AWS_ACCESS_KEY_ID}"
        secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
        session_token: "${AWS_SESSION_TOKEN}"
      
      # AWS-specific settings
      default_instance_type: "t3.medium"
      default_storage_type: "gp3"
      enable_enhanced_monitoring: true
      
    azure:
      enabled: true
      primary: false
      regions:
        - "eastus"
        - "westeurope"
        - "southeastasia"
      credentials:
        client_id: "${AZURE_CLIENT_ID}"
        client_secret: "${AZURE_CLIENT_SECRET}"
        tenant_id: "${AZURE_TENANT_ID}"
        subscription_id: "${AZURE_SUBSCRIPTION_ID}"
      
      # Azure-specific settings
      default_vm_size: "Standard_D2s_v3"
      default_storage_account_type: "Premium_LRS"
      
    gcp:
      enabled: true
      primary: false
      regions:
        - "us-central1"
        - "europe-west1"
        - "asia-southeast1"
      credentials:
        service_account_path: "${GOOGLE_APPLICATION_CREDENTIALS}"
        project_id: "${GCP_PROJECT_ID}"
      
      # GCP-specific settings
      default_machine_type: "e2-medium"
      default_disk_type: "pd-ssd"

# Infrastructure Configuration
infrastructure:
  # Network Configuration
  networking:
    vpc_cidr: "10.0.0.0/16"
    enable_nat_gateway: true
    enable_vpn_gateway: false
    dns_configuration:
      enable_dns_hostnames: true
      enable_dns_support: true
      private_dns_zones:
        - "ia-influencer.internal"
    
    # Subnets
    subnets:
      public:
        cidr: "10.0.1.0/24"
        availability_zones: ["a", "b", "c"]
        map_public_ip: true
      
      private:
        cidr: "10.0.2.0/24"
        availability_zones: ["a", "b", "c"]
        map_public_ip: false
      
      database:
        cidr: "10.0.3.0/24"
        availability_zones: ["a", "b"]
        map_public_ip: false
  
  # Security Configuration
  security:
    # Security Groups
    security_groups:
      web_servers:
        ingress_rules:
          - protocol: "tcp"
            port: 80
            source: "0.0.0.0/0"
            description: "HTTP traffic"
          - protocol: "tcp"
            port: 443
            source: "0.0.0.0/0"
            description: "HTTPS traffic"
          - protocol: "tcp"
            port: 22
            source: "10.0.0.0/16"
            description: "SSH from VPC"
        
        egress_rules:
          - protocol: "all"
            port: "all"
            destination: "0.0.0.0/0"
            description: "All outbound traffic"
      
      database_servers:
        ingress_rules:
          - protocol: "tcp"
            port: 5432
            source: "10.0.2.0/24"
            description: "PostgreSQL from app servers"
          - protocol: "tcp"
            port: 6379
            source: "10.0.2.0/24"
            description: "Redis from app servers"
        
        egress_rules: []
    
    # IAM Configuration
    iam:
      roles:
        ia_influencer_app_role:
          policies:
            - "CloudWatchAgentServerPolicy"
            - "AmazonS3ReadOnlyAccess"
          
        ia_influencer_admin_role:
          policies:
            - "PowerUserAccess"
      
      users:
        deployment_user:
          policies:
            - "IAMFullAccess"
            - "EC2FullAccess"
            - "S3FullAccess"
    
    # Encryption
    encryption:
      enable_encryption_at_rest: true
      enable_encryption_in_transit: true
      kms_key_rotation: true
      default_encryption_algorithm: "AES-256"

# Application Services Configuration
services:
  # Web Application
  web_app:
    instance_type: "t3.large"
    min_instances: 2
    max_instances: 10
    desired_instances: 3
    
    health_check:
      path: "/health"
      port: 8000
      protocol: "HTTP"
      timeout: 5
      interval: 30
      healthy_threshold: 2
      unhealthy_threshold: 3
    
    auto_scaling:
      target_cpu_utilization: 70
      target_memory_utilization: 80
      scale_up_cooldown: 300
      scale_down_cooldown: 600
  
  # API Services
  api_services:
    instance_type: "c5.xlarge"
    min_instances: 3
    max_instances: 20
    desired_instances: 5
    
    services:
      content_protection_api:
        port: 8001
        path: "/api/v1/protection"
      
      ai_processing_api:
        port: 8002
        path: "/api/v1/ai"
      
      monetization_api:
        port: 8003
        path: "/api/v1/monetization"
    
    auto_scaling:
      target_cpu_utilization: 75
      target_request_count: 1000
      scale_up_cooldown: 180
      scale_down_cooldown: 300
  
  # Database Services
  databases:
    postgresql:
      instance_class: "db.r5.xlarge"
      engine_version: "13.7"
      multi_az: true
      backup_retention_period: 30
      backup_window: "03:00-04:00"
      maintenance_window: "sun:04:00-sun:05:00"
      storage_type: "gp3"
      allocated_storage: 100
      max_allocated_storage: 1000
      
      # Performance Insights
      performance_insights_enabled: true
      performance_insights_retention_period: 7
      
      # Monitoring
      monitoring_interval: 60
      enhanced_monitoring: true
    
    redis:
      node_type: "cache.r6g.large"
      num_cache_nodes: 3
      engine_version: "6.2"
      port: 6379
      
      # Cluster configuration
      cluster_mode_enabled: true
      num_shards: 2
      replicas_per_shard: 1
      
      # Backup
      snapshot_retention_limit: 7
      snapshot_window: "02:00-03:00"
  
  # Storage Services
  storage:
    # Content Storage (Audio, Video, Images)
    content_storage:
      type: "s3"
      bucket_name: "ia-influencer-content-${ENVIRONMENT}"
      versioning_enabled: true
      lifecycle_policies:
        - id: "content_archival"
          status: "Enabled"
          transitions:
            - days: 30
              storage_class: "STANDARD_IA"
            - days: 90
              storage_class: "GLACIER"
            - days: 365
              storage_class: "DEEP_ARCHIVE"
      
      # Security
      encryption:
        sse_algorithm: "AES256"
        kms_master_key_id: "alias/ia-influencer-content-key"
      
      # Access Control
      bucket_policy: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowApplicationAccess",
              "Effect": "Allow",
              "Principal": {
                "AWS": "arn:aws:iam::ACCOUNT:role/IAInfluencerAppRole"
              },
              "Action": [
                "s3:GetObject",
                "s3:PutObject",
                "s3:DeleteObject"
              ],
              "Resource": "arn:aws:s3:::ia-influencer-content-${ENVIRONMENT}/*"
            }
          ]
        }
    
    # Backup Storage
    backup_storage:
      type: "s3"
      bucket_name: "ia-influencer-backups-${ENVIRONMENT}"
      cross_region_replication: true
      versioning_enabled: true
      mfa_delete: true

# Monitoring Configuration
monitoring:
  # CloudWatch / Azure Monitor / Stackdriver
  metrics:
    enabled: true
    retention_period: 90  # days
    detailed_monitoring: true
    
    # Custom Metrics
    custom_metrics:
      - name: "content_processing_latency"
        namespace: "IAInfluencer/ContentProcessing"
        unit: "Milliseconds"
      
      - name: "fingerprint_matches_per_second"
        namespace: "IAInfluencer/Protection"
        unit: "Count/Second"
      
      - name: "monetization_revenue_per_hour"
        namespace: "IAInfluencer/Monetization"
        unit: "Count"
  
  # Alerting
  alerting:
    enabled: true
    notification_channels:
      email:
        - "admin@ia-influencer.com"
        - "ops@ia-influencer.com"
      
      slack:
        webhook_url: "${SLACK_WEBHOOK_URL}"
        channel: "#ops-alerts"
      
      pagerduty:
        integration_key: "${PAGERDUTY_INTEGRATION_KEY}"
    
    # Alert Rules
    alerts:
      high_cpu_utilization:
        metric: "CPUUtilization"
        threshold: 85
        comparison: "GreaterThanThreshold"
        evaluation_periods: 2
        period: 300
        statistic: "Average"
        severity: "high"
      
      high_memory_utilization:
        metric: "MemoryUtilization"
        threshold: 90
        comparison: "GreaterThanThreshold"
        evaluation_periods: 2
        period: 300
        statistic: "Average"
        severity: "critical"
      
      database_connection_errors:
        metric: "DatabaseConnections"
        threshold: 0
        comparison: "LessThanThreshold"
        evaluation_periods: 1
        period: 60
        statistic: "Average"
        severity: "critical"
      
      content_processing_failures:
        metric: "ProcessingErrors"
        threshold: 5
        comparison: "GreaterThanThreshold"
        evaluation_periods: 1
        period: 300
        statistic: "Sum"
        severity: "high"
  
  # Logging
  logging:
    enabled: true
    log_groups:
      application:
        retention_days: 30
        log_level: "INFO"
      
      security:
        retention_days: 90
        log_level: "WARN"
      
      audit:
        retention_days: 365
        log_level: "INFO"
    
    # Log Streaming
    log_streaming:
      elasticsearch:
        enabled: true
        endpoint: "${ELASTICSEARCH_ENDPOINT}"
        index_pattern: "ia-influencer-logs-*"

# Backup Configuration
backup:
  # Automated Backup Strategy
  strategy: "cross_cloud_replication"
  
  # Backup Schedules
  schedules:
    database_backup:
      frequency: "daily"
      time: "02:00"
      retention_days: 30
      cross_region_backup: true
      encryption_enabled: true
    
    content_backup:
      frequency: "weekly"
      time: "sunday:01:00"
      retention_weeks: 12
      compression_enabled: true
      verification_enabled: true
    
    system_backup:
      frequency: "daily"
      time: "03:00"
      retention_days: 7
      incremental_backup: true
  
  # Backup Destinations
  destinations:
    primary:
      provider: "aws"
      region: "us-east-1"
      storage_class: "STANDARD_IA"
    
    secondary:
      provider: "azure"
      region: "eastus"
      storage_tier: "Cool"
    
    tertiary:
      provider: "gcp"
      region: "us-central1"
      storage_class: "NEARLINE"

# Disaster Recovery Configuration
disaster_recovery:
  # Recovery Objectives
  rto_minutes: 15  # Recovery Time Objective
  rpo_minutes: 5   # Recovery Point Objective
  
  # DR Strategy
  strategy: "multi_cloud_failover"
  
  # Primary and Secondary Regions
  primary_region: "us-east-1"
  secondary_regions:
    - "eu-west-1"
    - "ap-southeast-1"
  
  # Failover Configuration
  failover:
    automatic_failover: true
    health_check_interval: 60  # seconds
    failure_threshold: 3
    
    # Failover Actions
    actions:
      - update_dns_records
      - redirect_traffic
      - scale_up_secondary_resources
      - notify_operations_team
  
  # Recovery Testing
  testing:
    schedule: "monthly"
    test_scenarios:
      - "primary_region_failure"
      - "database_corruption"
      - "application_failure"
      - "network_partition"

# Security Configuration
security:
  # Compliance Frameworks
  compliance:
    enabled_frameworks:
      - "gdpr"
      - "soc2"
      - "iso27001"
    
    # GDPR Specific Settings
    gdpr:
      data_residency_regions:
        - "eu-west-1"
        - "eu-central-1"
      data_retention_days: 1095  # 3 years
      right_to_be_forgotten: true
      consent_management: true
    
    # SOC2 Specific Settings
    soc2:
      access_logging: true
      encryption_required: true
      regular_access_reviews: true
      incident_response_plan: true
  
  # Access Control
  access_control:
    # Multi-Factor Authentication
    mfa_required: true
    mfa_methods:
      - "totp"
      - "sms"
      - "hardware_token"
    
    # Role-Based Access Control
    rbac:
      enabled: true
      default_role: "viewer"
      
      roles:
        admin:
          permissions:
            - "manage_infrastructure"
            - "manage_users"
            - "view_all_resources"
            - "modify_security_settings"
        
        developer:
          permissions:
            - "deploy_applications"
            - "view_logs"
            - "manage_application_configs"
        
        viewer:
          permissions:
            - "view_dashboards"
            - "view_metrics"
  
  # Network Security
  network_security:
    # Web Application Firewall
    waf:
      enabled: true
      rules:
        - "sql_injection_protection"
        - "xss_protection"
        - "rate_limiting"
        - "geo_blocking"
    
    # DDoS Protection
    ddos_protection:
      enabled: true
      mitigation_threshold: 1000  # requests per second
    
    # VPN Configuration
    vpn:
      enabled: true
      type: "site_to_site"
      encryption: "AES-256"

# Cost Optimization Configuration
cost_optimization:
  # Optimization Strategy
  strategy: "balanced"  # cost_focused, performance_focused, balanced
  
  # Reserved Instances
  reserved_instances:
    enabled: true
    commitment: "1_year"  # 1_year, 3_year
    payment_option: "partial_upfront"  # no_upfront, partial_upfront, all_upfront
    coverage_target: 80  # percentage
  
  # Spot Instances
  spot_instances:
    enabled: true
    max_price_percentage: 70  # percentage of on-demand price
    applicable_services:
      - "batch_processing"
      - "development_environments"
      - "testing_environments"
  
  # Auto-Scaling Optimization
  auto_scaling_optimization:
    enabled: true
    aggressive_scale_down: true
    predictive_scaling: true
    
    # Schedule-based scaling
    scheduled_scaling:
      - name: "business_hours_scale_up"
        schedule: "0 8 * * 1-5"  # 8 AM weekdays
        min_capacity: 5
        max_capacity: 20
        desired_capacity: 8
      
      - name: "off_hours_scale_down"
        schedule: "0 18 * * 1-5"  # 6 PM weekdays
        min_capacity: 2
        max_capacity: 10
        desired_capacity: 3
  
  # Cost Monitoring
  cost_monitoring:
    budget_limits:
      monthly_budget: 10000  # USD
      alert_thresholds:
        - percentage: 50
          alert_type: "email"
        - percentage: 80
          alert_type: "slack"
        - percentage: 95
          alert_type: "pagerduty"
    
    cost_allocation_tags:
      - "Environment"
      - "Service"
      - "Team"
      - "CostCenter"

# Environment-Specific Overrides
environments:
  development:
    # Smaller instances for development
    services:
      web_app:
        instance_type: "t3.micro"
        min_instances: 1
        max_instances: 2
        desired_instances: 1
      
      api_services:
        instance_type: "t3.small"
        min_instances: 1
        max_instances: 3
        desired_instances: 1
    
    # Simplified database configuration
    databases:
      postgresql:
        instance_class: "db.t3.micro"
        multi_az: false
        backup_retention_period: 7
    
    # Reduced monitoring
    monitoring:
      metrics:
        retention_period: 7
        detailed_monitoring: false
  
  staging:
    # Production-like but smaller
    services:
      web_app:
        instance_type: "t3.medium"
        min_instances: 1
        max_instances: 5
        desired_instances: 2
      
      api_services:
        instance_type: "t3.medium"
        min_instances: 2
        max_instances: 8
        desired_instances: 3
    
    databases:
      postgresql:
        instance_class: "db.t3.small"
        multi_az: true
        backup_retention_period: 14
  
  production:
    # Full production configuration (uses defaults above)
    pass
