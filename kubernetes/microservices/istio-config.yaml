apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: ainflue-gateway
  namespace: production
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - api.ainflue.com
    - "*.ainflue.com"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: ainflue-tls-secret
    hosts:
    - api.ainflue.com
    - "*.ainflue.com"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ainflue-api
  namespace: production
spec:
  hosts:
  - api.ainflue.com
  gateways:
  - ainflue-gateway
  http:
  - match:
    - uri:
        prefix: /api/v1/auth
    - uri:
        prefix: /api/v1/users
    route:
    - destination:
        host: user-service
        port:
          number: 8000
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
  - match:
    - uri:
        prefix: /api/v1/content
    route:
    - destination:
        host: content-service
        port:
          number: 8000
    timeout: 60s
    retries:
      attempts: 3
      perTryTimeout: 20s
  - match:
    - uri:
        prefix: /api/v1/ai
    route:
    - destination:
        host: ai-service
        port:
          number: 8000
    timeout: 300s
    retries:
      attempts: 2
      perTryTimeout: 150s
  - match:
    - uri:
        prefix: /api/v1/protection
    route:
    - destination:
        host: protection-service
        port:
          number: 8000
    timeout: 60s
    retries:
      attempts: 3
      perTryTimeout: 20s
  - match:
    - uri:
        prefix: /api/v1/collaboration
    route:
    - destination:
        host: collaboration-service
        port:
          number: 8000
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
  - match:
    - uri:
        prefix: /api/v1/payments
    route:
    - destination:
        host: payment-service
        port:
          number: 8000
    timeout: 60s
    retries:
      attempts: 3
      perTryTimeout: 20s
  - match:
    - uri:
        prefix: /api/v1/notifications
    route:
    - destination:
        host: notification-service
        port:
          number: 8000
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
  - match:
    - uri:
        prefix: /api/v1/analytics
    route:
    - destination:
        host: analytics-service
        port:
          number: 8000
    timeout: 60s
    retries:
      attempts: 3
      perTryTimeout: 20s
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: ainflue-authz
  namespace: production
spec:
  selector:
    matchLabels:
      tier: service
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/production/sa/api-gateway"]
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: production
spec:
  mtls:
    mode: STRICT