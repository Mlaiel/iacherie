# Multi-Region Production Load Balancer Configuration
# Author: Fahed Mlaiel <mlaiel@live.de>
# Enterprise-grade global load balancing with high availability

---
apiVersion: v1
kind: Namespace
metadata:
  name: ainflue-global-lb
  labels:
    name: ainflue-global-lb
    app.kubernetes.io/name: global-load-balancer
    app.kubernetes.io/instance: ainflue

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: global-lb-nginx-config
  namespace: ainflue-global-lb
  labels:
    app.kubernetes.io/name: global-load-balancer
    app.kubernetes.io/component: config
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Logging format
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'region="$region_backend" response_time=$request_time';
        
        access_log /var/log/nginx/access.log main;
        
        # Performance optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        
        # Compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            application/atom+xml
            application/javascript
            application/json
            application/ld+json
            application/manifest+json
            application/rss+xml
            application/vnd.geo+json
            application/vnd.ms-fontobject
            application/x-font-ttf
            application/x-web-app-manifest+json
            application/xhtml+xml
            application/xml
            font/opentype
            image/bmp
            image/svg+xml
            image/x-icon
            text/cache-manifest
            text/css
            text/plain
            text/vcard
            text/vnd.rim.location.xloc
            text/vtt
            text/x-component
            text/x-cross-domain-policy;
        
        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
        limit_req_zone $binary_remote_addr zone=web:10m rate=1000r/m;
        
        # Health check for primary region
        upstream primary_region {
            least_conn;
            server api-us-east-1.ainflue.com:443 max_fails=3 fail_timeout=30s weight=10;
            keepalive 32;
        }
        
        # Backup regions
        upstream secondary_regions {
            least_conn;
            server api-us-west-2.ainflue.com:443 max_fails=3 fail_timeout=30s weight=8 backup;
            server api-eu-west-1.ainflue.com:443 max_fails=3 fail_timeout=30s weight=8 backup;
            server api-ap-southeast-1.ainflue.com:443 max_fails=3 fail_timeout=30s weight=6 backup;
            keepalive 16;
        }
        
        # Geographic routing based on CloudFlare country code
        map $http_cf_ipcountry $region_backend {
            default primary_region;
            
            # North America -> US East
            US primary_region;
            CA primary_region;
            MX primary_region;
            
            # Europe -> EU West
            GB secondary_regions;
            DE secondary_regions;
            FR secondary_regions;
            IT secondary_regions;
            ES secondary_regions;
            NL secondary_regions;
            CH secondary_regions;
            AT secondary_regions;
            BE secondary_regions;
            DK secondary_regions;
            FI secondary_regions;
            IE secondary_regions;
            LU secondary_regions;
            NO secondary_regions;
            PT secondary_regions;
            SE secondary_regions;
            
            # Asia Pacific -> AP Southeast
            SG secondary_regions;
            JP secondary_regions;
            AU secondary_regions;
            NZ secondary_regions;
            HK secondary_regions;
            KR secondary_regions;
            TW secondary_regions;
            TH secondary_regions;
            MY secondary_regions;
            ID secondary_regions;
            PH secondary_regions;
            VN secondary_regions;
            IN secondary_regions;
        }
        
        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Security headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self'; object-src 'none'; child-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;
        
        # Main server block
        server {
            listen 80;
            listen [::]:80;
            server_name api.ainflue.com www.ainflue.com ainflue.com;
            
            # Redirect HTTP to HTTPS
            return 301 https://$server_name$request_uri;
        }
        
        server {
            listen 443 ssl http2;
            listen [::]:443 ssl http2;
            server_name api.ainflue.com;
            
            # SSL certificates
            ssl_certificate /etc/nginx/ssl/ainflue.crt;
            ssl_certificate_key /etc/nginx/ssl/ainflue.key;
            
            # Health check endpoint
            location /health {
                access_log off;
                add_header Content-Type text/plain;
                return 200 "healthy";
            }
            
            # Metrics endpoint for monitoring
            location /lb-metrics {
                access_log off;
                stub_status on;
                allow 10.0.0.0/8;
                allow 172.16.0.0/12;
                allow 192.168.0.0/16;
                deny all;
            }
            
            # API rate limiting
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                
                # CORS headers
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Max-Age 3600 always;
                
                # Handle preflight requests
                if ($request_method = 'OPTIONS') {
                    return 204;
                }
                
                # Proxy to backend
                proxy_pass https://$region_backend;
                proxy_ssl_verify off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Region $http_cf_ipcountry;
                proxy_set_header X-Request-ID $request_id;
                
                # Connection settings
                proxy_connect_timeout 5s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                proxy_buffering on;
                proxy_buffer_size 128k;
                proxy_buffers 4 256k;
                proxy_busy_buffers_size 256k;
                
                # Failover configuration
                proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
                proxy_next_upstream_tries 3;
                proxy_next_upstream_timeout 10s;
            }
            
            # Default location for web traffic
            location / {
                limit_req zone=web burst=50 nodelay;
                
                proxy_pass https://$region_backend;
                proxy_ssl_verify off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Region $http_cf_ipcountry;
                proxy_set_header X-Request-ID $request_id;
                
                proxy_connect_timeout 5s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                
                proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
                proxy_next_upstream_tries 3;
                proxy_next_upstream_timeout 10s;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-load-balancer
  namespace: ainflue-global-lb
  labels:
    app.kubernetes.io/name: global-load-balancer
    app.kubernetes.io/component: load-balancer
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: global-load-balancer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: global-load-balancer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - global-load-balancer
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        env:
        - name: NGINX_ENVSUBST_OUTPUT_DIR
          value: "/etc/nginx"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: ssl-certs
          mountPath: /etc/nginx/ssl
          readOnly: true
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - nginx -s quit; while killall -0 nginx; do sleep 1; done
      
      # Nginx Prometheus Exporter
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:latest
        args:
          - -nginx.scrape-uri=http://localhost/lb-metrics
        ports:
        - containerPort: 9113
          name: metrics
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9113
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9113
          initialDelaySeconds: 5
          periodSeconds: 5
      
      volumes:
      - name: nginx-config
        configMap:
          name: global-lb-nginx-config
      - name: ssl-certs
        secret:
          secretName: ainflue-tls-cert
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: global-load-balancer
  namespace: ainflue-global-lb
  labels:
    app.kubernetes.io/name: global-load-balancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-connection-draining-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-connection-draining-timeout: "60"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9113"
spec:
  type: LoadBalancer
  sessionAffinity: None
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  selector:
    app.kubernetes.io/name: global-load-balancer

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: global-lb-network-policy
  namespace: ainflue-global-lb
  labels:
    app.kubernetes.io/name: global-load-balancer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: global-load-balancer
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 9113
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: global-load-balancer-hpa
  namespace: ainflue-global-lb
  labels:
    app.kubernetes.io/name: global-load-balancer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: global-load-balancer
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
# Pod Disruption Budget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: global-load-balancer-pdb
  namespace: ainflue-global-lb
  labels:
    app.kubernetes.io/name: global-load-balancer
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: global-load-balancer