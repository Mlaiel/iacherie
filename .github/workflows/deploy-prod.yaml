name: 🚀 Production Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deployment_strategy:
        description: 'Deployment strategy'
        required: false
        default: 'blue-green'
        type: choice
        options:
          - blue-green
          - canary
          - rolling
      skip_tests:
        description: 'Skip pre-deployment tests (emergency only)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOYMENT_STRATEGY: ${{ inputs.deployment_strategy || 'blue-green' }}
  TARGET_ENV: ${{ inputs.environment || 'production' }}

jobs:
  # Pre-deployment validation
  pre-deployment:
    name: 🔍 Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.skip_tests }}
    
    outputs:
      deploy-backend: ${{ steps.changes.outputs.backend }}
      deploy-frontend: ${{ steps.changes.outputs.frontend }}
      deploy-mobile: ${{ steps.changes.outputs.mobile }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: 🔍 Detect changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          backend:
            - 'backend/**'
            - 'api/**'
            - 'core/**'
            - 'services/**'
            - 'requirements*.txt'
          frontend:
            - 'frontend/**'
            - 'dashboard/**'
          mobile:
            - 'mobile/**'

    - name: ✅ Validate deployment readiness
      run: |
        echo "Deployment validation for ${{ env.TARGET_ENV }}:"
        echo "Backend changes: ${{ steps.changes.outputs.backend }}"
        echo "Frontend changes: ${{ steps.changes.outputs.frontend }}"
        echo "Mobile changes: ${{ steps.changes.outputs.mobile }}"
        echo "Strategy: ${{ env.DEPLOYMENT_STRATEGY }}"

  # Build and push container images
  build-images:
    name: 🏗️ Build Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pre-deployment]
    if: always() && (needs.pre-deployment.result == 'success' || needs.pre-deployment.result == 'skipped')
    
    strategy:
      matrix:
        component: [backend, frontend]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 📝 Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.component }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: 🏗️ Build and push ${{ matrix.component }} image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.${{ matrix.component }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy Backend Services
  deploy-backend:
    name: 🐍 Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [pre-deployment, build-images]
    if: always() && needs.build-images.result == 'success' && (needs.pre-deployment.outputs.deploy-backend == 'true' || github.event_name == 'workflow_dispatch')
    environment: 
      name: ${{ inputs.environment || 'production' }}
      url: https://api.ainflue.com
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: 🔐 Configure Kubernetes access
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        kubectl version --client

    - name: 🎭 Deploy with ${{ env.DEPLOYMENT_STRATEGY }} strategy
      run: |
        export KUBECONFIG=kubeconfig
        
        # Update image in deployment manifests
        IMAGE_TAG="${{ github.sha }}"
        sed -i "s|image: .*backend.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${IMAGE_TAG}|g" kubernetes/backend/deployment.yaml
        
        case "${{ env.DEPLOYMENT_STRATEGY }}" in
          "blue-green")
            echo "🎭 Deploying with Blue-Green strategy..."
            kubectl apply -f kubernetes/backend/ -n ainflue-${{ env.TARGET_ENV }}
            kubectl rollout status deployment/backend -n ainflue-${{ env.TARGET_ENV }} --timeout=600s
            ;;
          "canary")
            echo "🐤 Deploying with Canary strategy..."
            kubectl apply -f kubernetes/backend/canary/ -n ainflue-${{ env.TARGET_ENV }}
            kubectl rollout status deployment/backend-canary -n ainflue-${{ env.TARGET_ENV }} --timeout=600s
            ;;
          "rolling")
            echo "🔄 Deploying with Rolling strategy..."
            kubectl apply -f kubernetes/backend/ -n ainflue-${{ env.TARGET_ENV }}
            kubectl rollout status deployment/backend -n ainflue-${{ env.TARGET_ENV }} --timeout=600s
            ;;
        esac

    - name: 🏥 Health check
      run: |
        export KUBECONFIG=kubeconfig
        
        # Wait for pods to be ready
        kubectl wait --for=condition=ready pod -l app=backend -n ainflue-${{ env.TARGET_ENV }} --timeout=300s
        
        # Basic health check
        kubectl get pods -l app=backend -n ainflue-${{ env.TARGET_ENV }}
        
        # Test API endpoint
        API_URL="https://api.ainflue.com/health"
        for i in {1..10}; do
          if curl -f "$API_URL"; then
            echo "✅ Backend health check passed"
            break
          else
            echo "⏳ Waiting for backend to be ready... ($i/10)"
            sleep 30
          fi
        done

  # Deploy Frontend
  deploy-frontend:
    name: ⚛️ Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pre-deployment, build-images]
    if: always() && needs.build-images.result == 'success' && (needs.pre-deployment.outputs.deploy-frontend == 'true' || github.event_name == 'workflow_dispatch')
    environment: 
      name: ${{ inputs.environment || 'production' }}
      url: https://ainflue.com
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: 🔐 Configure Kubernetes access
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: 🎭 Deploy frontend with ${{ env.DEPLOYMENT_STRATEGY }} strategy
      run: |
        export KUBECONFIG=kubeconfig
        
        # Update image in deployment manifests
        IMAGE_TAG="${{ github.sha }}"
        sed -i "s|image: .*frontend.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${IMAGE_TAG}|g" kubernetes/frontend/deployment.yaml
        
        kubectl apply -f kubernetes/frontend/ -n ainflue-${{ env.TARGET_ENV }}
        kubectl rollout status deployment/frontend -n ainflue-${{ env.TARGET_ENV }} --timeout=600s

    - name: 🏥 Frontend health check
      run: |
        export KUBECONFIG=kubeconfig
        
        kubectl wait --for=condition=ready pod -l app=frontend -n ainflue-${{ env.TARGET_ENV }} --timeout=300s
        kubectl get pods -l app=frontend -n ainflue-${{ env.TARGET_ENV }}
        
        # Test frontend endpoint
        FRONTEND_URL="https://ainflue.com"
        for i in {1..5}; do
          if curl -f "$FRONTEND_URL" > /dev/null; then
            echo "✅ Frontend health check passed"
            break
          else
            echo "⏳ Waiting for frontend to be ready... ($i/5)"
            sleep 30
          fi
        done

  # Post-deployment validation
  post-deployment:
    name: ✅ Post-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-backend, deploy-frontend]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🧪 Run smoke tests
      run: |
        echo "🧪 Running post-deployment smoke tests..."
        
        # API smoke tests
        API_URL="https://api.ainflue.com"
        
        echo "Testing API health endpoint..."
        curl -f "$API_URL/health" || echo "⚠️ API health check failed"
        
        echo "Testing API version endpoint..."
        curl -f "$API_URL/version" || echo "⚠️ API version check failed"
        
        # Frontend smoke tests
        FRONTEND_URL="https://ainflue.com"
        
        echo "Testing frontend accessibility..."
        curl -f "$FRONTEND_URL" || echo "⚠️ Frontend accessibility check failed"
        
        echo "✅ Smoke tests completed"

    - name: 📊 Performance validation
      run: |
        echo "📊 Running performance validation..."
        
        # Basic performance check with curl
        API_URL="https://api.ainflue.com/health"
        RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}' "$API_URL")
        
        echo "API response time: ${RESPONSE_TIME}s"
        
        if (( $(echo "$RESPONSE_TIME > 2.0" | bc -l) )); then
          echo "⚠️ API response time above threshold (2s)"
        else
          echo "✅ API response time within acceptable range"
        fi

    - name: 🔔 Deployment notification
      run: |
        echo "🔔 Sending deployment notification..."
        
        DEPLOYMENT_STATUS="SUCCESS"
        if [[ "${{ needs.deploy-backend.result }}" == "failure" || "${{ needs.deploy-frontend.result }}" == "failure" ]]; then
          DEPLOYMENT_STATUS="FAILED"
        fi
        
        echo "Deployment to ${{ env.TARGET_ENV }} completed with status: $DEPLOYMENT_STATUS"
        echo "Strategy used: ${{ env.DEPLOYMENT_STRATEGY }}"
        echo "Commit: ${{ github.sha }}"
        echo "Deployed by: ${{ github.actor }}"

  # Rollback on failure
  rollback:
    name: 🔄 Rollback on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-backend, deploy-frontend, post-deployment]
    if: failure() && (needs.deploy-backend.result == 'failure' || needs.deploy-frontend.result == 'failure' || needs.post-deployment.result == 'failure')
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: 🔐 Configure Kubernetes access
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: 🔄 Perform rollback
      run: |
        export KUBECONFIG=kubeconfig
        
        echo "🔄 Performing automatic rollback..."
        
        # Rollback backend if it was deployed
        if [[ "${{ needs.deploy-backend.result }}" == "failure" ]]; then
          echo "Rolling back backend deployment..."
          kubectl rollout undo deployment/backend -n ainflue-${{ env.TARGET_ENV }}
          kubectl rollout status deployment/backend -n ainflue-${{ env.TARGET_ENV }} --timeout=300s
        fi
        
        # Rollback frontend if it was deployed  
        if [[ "${{ needs.deploy-frontend.result }}" == "failure" ]]; then
          echo "Rolling back frontend deployment..."
          kubectl rollout undo deployment/frontend -n ainflue-${{ env.TARGET_ENV }}
          kubectl rollout status deployment/frontend -n ainflue-${{ env.TARGET_ENV }} --timeout=300s
        fi
        
        echo "✅ Rollback completed"

    - name: 🚨 Rollback notification
      run: |
        echo "🚨 ALERT: Deployment failed and automatic rollback was triggered"
        echo "Environment: ${{ env.TARGET_ENV }}"
        echo "Failed commit: ${{ github.sha }}"
        echo "Please investigate the deployment logs and fix the issues before retrying."

  # Deployment summary
  deployment-summary:
    name: 📋 Deployment Summary
    runs-on: ubuntu-latest
    needs: [pre-deployment, build-images, deploy-backend, deploy-frontend, post-deployment, rollback]
    if: always()
    
    steps:
    - name: 📊 Summary
      run: |
        echo "🚀 Production Deployment Summary"
        echo "================================"
        echo "Environment: ${{ env.TARGET_ENV }}"
        echo "Strategy: ${{ env.DEPLOYMENT_STRATEGY }}"
        echo "Commit: ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"
        echo ""
        echo "Results:"
        echo "Pre-deployment: ${{ needs.pre-deployment.result }}"
        echo "Build Images: ${{ needs.build-images.result }}"
        echo "Deploy Backend: ${{ needs.deploy-backend.result }}"
        echo "Deploy Frontend: ${{ needs.deploy-frontend.result }}"
        echo "Post-deployment: ${{ needs.post-deployment.result }}"
        echo "Rollback: ${{ needs.rollback.result }}"
        echo ""
        
        if [[ "${{ needs.rollback.result }}" == "success" ]]; then
          echo "🔄 Deployment failed but rollback was successful"
          exit 1
        elif [[ "${{ needs.deploy-backend.result }}" == "success" || "${{ needs.deploy-frontend.result }}" == "success" ]]; then
          echo "✅ Deployment completed successfully"
        else
          echo "❌ Deployment failed"
          exit 1
        fi