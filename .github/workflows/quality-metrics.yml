---
name: 📊 Quality Metrics & Gates
# Comprehensive quality assessment with mandatory gates
# Author: Fahed Mlaiel (mlaiel@live.de)
# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.

on:
  push:
  branches: [main, develop]
  pull_request:
  branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
  inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production

env:
  PYTHON_VERSION: "3.12"
  QUALITY_THRESHOLD: 90
  SECURITY_THRESHOLD: 80
  DEBT_THRESHOLD: 50

jobs:
  quality-analysis:
  name: 🎯 Quality Analysis
  runs-on: ubuntu-latest
  timeout-minutes: 30

  steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for trend analysis

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov coverage bandit safety radon click
        pip install pyyaml  # For config parsing

    - name: 🧪 Run Tests with Coverage
      run: |
        python -m pytest \
          --cov=. \
          --cov-report=xml:coverage.xml \
          --cov-report=html:htmlcov \
          --cov-report=term-missing \
          --cov-fail-under=${{ env.QUALITY_THRESHOLD }} \
          --junitxml=pytest-report.xml \
          tests/ || echo "Tests completed with issues"

    - name: 📊 Run Quality Analysis
      id: quality
      run: |
        python scripts/quality_metrics_cli.py analyze \
          --format json \
          --output quality-report.json \
          --environment ${{ github.event.inputs.environment || 'development' }}

        # Extract metrics for status checks
        QUALITY_SCORE=$(python -c "import json; data=json.load(open('quality-report.json')); print(data['overall_score'])")
        echo "quality_score=$QUALITY_SCORE" >> $GITHUB_OUTPUT

        # Check if quality gate passes
        if (( $(echo "$QUALITY_SCORE < ${{ env.QUALITY_THRESHOLD }}" | bc -l) )); then
          echo "❌ Quality gate failed: $QUALITY_SCORE < ${{ env.QUALITY_THRESHOLD }}"
          exit 1
        else
          echo "✅ Quality gate passed: $QUALITY_SCORE >= ${{ env.QUALITY_THRESHOLD }}"
        fi

    - name: 📋 Upload Coverage Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/
          pytest-report.xml

    - name: 📈 Upload Quality Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: quality-reports
        path: quality-report.json

  security-analysis:
  name: 🛡️ Security Analysis
  runs-on: ubuntu-latest
  timeout-minutes: 20

  steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep
        pip install -r requirements.txt

    - name: 🔍 Static Security Analysis (Bandit)
      run: |
        bandit -r . -f json -o bandit-report.json || echo "Bandit analysis completed"
        bandit -r . -f txt || echo "Bandit analysis completed"

    - name: 🔐 Dependency Vulnerability Scan (Safety)
      run: |
        safety check --json --output safety-report.json || echo "Safety check completed"
        safety check || echo "Safety check completed"

    - name: 🛡️ Generate Security Scorecard
      id: security
      run: |
        python scripts/quality_metrics_cli.py security \
          --format json \
          --output security-scorecard.json

        # Extract security score
        SECURITY_SCORE=$(python -c "import json; data=json.load(open('security-scorecard.json')); print(data['overall_score'])")
        echo "security_score=$SECURITY_SCORE" >> $GITHUB_OUTPUT

        # Check security gate
        if (( $(echo "$SECURITY_SCORE < ${{ env.SECURITY_THRESHOLD }}" | bc -l) )); then
          echo "❌ Security gate failed: $SECURITY_SCORE < ${{ env.SECURITY_THRESHOLD }}"
          exit 1
        else
          echo "✅ Security gate passed: $SECURITY_SCORE >= ${{ env.SECURITY_THRESHOLD }}"
        fi

    - name: 🚨 Check for Secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

    - name: 📋 Upload Security Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          security-scorecard.json

  technical-debt-analysis:
  name: 🔧 Technical Debt Analysis
  runs-on: ubuntu-latest
  timeout-minutes: 15

  steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install Analysis Tools
      run: |
        python -m pip install --upgrade pip
        pip install radon lizard
        pip install -r requirements.txt

    - name: 🔧 Analyze Technical Debt
      id: debt
      run: |
        python scripts/quality_metrics_cli.py debt \
          --format json \
          --output technical-debt.json

        # Extract debt metrics
        DEBT_ITEMS=$(python -c "import json; data=json.load(open('technical-debt.json')); print(data['summary']['total_items'])")
        echo "debt_items=$DEBT_ITEMS" >> $GITHUB_OUTPUT

        # Check debt gate
        if (( $DEBT_ITEMS > ${{ env.DEBT_THRESHOLD }} )); then
          echo "❌ Technical debt gate failed: $DEBT_ITEMS > ${{ env.DEBT_THRESHOLD }}"
          exit 1
        else
          echo "✅ Technical debt gate passed: $DEBT_ITEMS <= ${{ env.DEBT_THRESHOLD }}"
        fi

    - name: 📈 Code Complexity Analysis
      run: |
        radon cc . --json --output-file complexity-report.json
        radon mi . --json --output-file maintainability-report.json
        radon hal . --json --output-file halstead-report.json

    - name: 📋 Upload Technical Debt Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: technical-debt-reports
        path: |
          technical-debt.json
          complexity-report.json
          maintainability-report.json
          halstead-report.json

  api-changes-analysis:
  name: 🔧 API Breaking Changes
  runs-on: ubuntu-latest
  timeout-minutes: 10
  if: github.event_name == 'pull_request'

  steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 📥 Download Baseline Contract
      run: |
        # Try to get baseline from main branch
        git show main:api_contract.json > baseline_contract.json 2>/dev/null || echo "{}" > baseline_contract.json

    - name: 🔧 Detect API Breaking Changes
      id: api_changes
      run: |
        python scripts/quality_metrics_cli.py api-changes \
          --baseline baseline_contract.json \
          --output api-changes-report.md

        # Check for breaking changes
        BREAKING_CHANGES=$(grep -c "Breaking" api-changes-report.md || echo "0")
        echo "breaking_changes=$BREAKING_CHANGES" >> $GITHUB_OUTPUT

        if ["$BREAKING_CHANGES" -gt "0"]; then
          echo "❌ Breaking API changes detected: $BREAKING_CHANGES"
          exit 1
        else
          echo "✅ No breaking API changes detected"
        fi

    - name: 📋 Upload API Changes Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: api-changes-reports
        path: |
          api-changes-report.md
          api_contract.json

  comprehensive-report:
  name: 📋 Comprehensive Report
  runs-on: ubuntu-latest
  needs: [quality-analysis, security-analysis, technical-debt-analysis]
  if: always()

  steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 📥 Download All Reports
      uses: actions/download-artifact@v3
      with:
        path: reports/

    - name: 📊 Generate Comprehensive Report
      run: |
        python scripts/quality_metrics_cli.py all \
          --format markdown \
          --output comprehensive-quality-report.md \
          --environment ${{ github.event.inputs.environment || 'development' }}

    - name: 📈 Create Quality Dashboard
      run: |
        # Create a simple quality dashboard
        cat > quality-dashboard.md << EOF
        # 📊 Quality Metrics Dashboard

        **Build:** #${{ github.run_number }}
        **Commit:** ${{ github.sha }}
        **Branch:** ${{ github.ref_name }}
        **Triggered by:** ${{ github.event_name }}
        **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

        ## Quality Gates Status

        | Gate | Status | Score/Count | Threshold |
        |------|--------|-------------|-----------|
        | 🎯 Quality Analysis | ${{ needs.quality-analysis.result == 'success' && '✅ PASS' || '❌ FAIL' }} | ${{ needs.quality-analysis.outputs.quality_score || 'N/A' }} | ${{ env.QUALITY_THRESHOLD }} |
        | 🛡️ Security Analysis | ${{ needs.security-analysis.result == 'success' && '✅ PASS' || '❌ FAIL' }} | ${{ needs.security-analysis.outputs.security_score || 'N/A' }} | ${{ env.SECURITY_THRESHOLD }} |
        | 🔧 Technical Debt | ${{ needs.technical-debt-analysis.result == 'success' && '✅ PASS' || '❌ FAIL' }} | ${{ needs.technical-debt-analysis.outputs.debt_items || 'N/A' }} | ${{ env.DEBT_THRESHOLD }} |

        ## Overall Status

        ${{ (needs.quality-analysis.result == 'success' && needs.security-analysis.result == 'success' && needs.technical-debt-analysis.result == 'success') && '🟢 **ALL QUALITY GATES PASSED**' || '🔴 **QUALITY GATES FAILED**' }}

        EOF

    - name: 📋 Upload Comprehensive Report
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-report
        path: |
          comprehensive-quality-report.md
          quality-dashboard.md

    - name: 💬 Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const dashboard = fs.readFileSync('quality-dashboard.md', 'utf8');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: dashboard
          });

  quality-gates-enforcement:
  name: 🚪 Quality Gates Enforcement
  runs-on: ubuntu-latest
  needs: [quality-analysis, security-analysis, technical-debt-analysis]
  if: always()

  steps:
    - name: 🚦 Evaluate Quality Gates
      run: |
        echo "Evaluating quality gates..."

        # Check if all quality gates passed
        QUALITY_RESULT="${{ needs.quality-analysis.result }}"
        SECURITY_RESULT="${{ needs.security-analysis.result }}"
        DEBT_RESULT="${{ needs.technical-debt-analysis.result }}"

        echo "Quality Analysis: $QUALITY_RESULT"
        echo "Security Analysis: $SECURITY_RESULT"
        echo "Technical Debt: $DEBT_RESULT"

        # Fail if any critical gate failed
        if ["$QUALITY_RESULT" != "success"] || ["$SECURITY_RESULT" != "success"] || ["$DEBT_RESULT" != "success"]; then
          echo "❌ Quality gates failed!"
          echo "::error::One or more quality gates failed. Please address the issues before merging."
          exit 1
        else
          echo "✅ All quality gates passed!"
        fi

  publish-metrics:
  name: 📈 Publish Metrics
  runs-on: ubuntu-latest
  needs: [comprehensive-report]
  if: github.ref == 'refs/heads/main' && github.event_name == 'push'

  steps:
    - name: 📥 Download Reports
      uses: actions/download-artifact@v3
      with:
        name: comprehensive-report

    - name: 📊 Publish to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        destination_dir: quality-reports/${{ github.run_number }}

    - name: 📈 Create Release Notes
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        # Create quality metrics summary for release notes
        cat > quality-summary.txt << EOF
        ## Quality Metrics Summary

        - 🎯 Quality Score: ${{ needs.quality-analysis.outputs.quality_score || 'N/A' }}%
        - 🛡️ Security Score: ${{ needs.security-analysis.outputs.security_score || 'N/A' }}%
        - 🔧 Technical Debt: ${{ needs.technical-debt-analysis.outputs.debt_items || 'N/A' }} items

        Full quality report: [View Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        EOF
