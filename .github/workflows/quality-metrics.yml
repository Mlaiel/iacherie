name: 📊 Quality Metrics Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      fail_on_warning:
        description: 'Fail build on warnings'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-metrics:
    name: 🎯 Comprehensive Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for baseline comparison
    
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: 📦 Cache Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: 🔧 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio bandit safety pip-licenses radon xenon licensecheck
        pip install coverage[toml] mypy flake8 black isort
    
    - name: 🏗️ Install Quality Tools
      run: |
        # Install additional quality tools
        sudo apt-get update
        sudo apt-get install -y cloc
        
        # Install Node.js tools if needed
        if [ -f "package.json" ]; then
          npm install
        fi
    
    - name: 📊 Run Comprehensive Quality Analysis
      id: quality_analysis
      run: |
        python scripts/run_quality_analysis.py \
          --project-root . \
          --output quality_report.html \
          --json \
          --verbose \
          ${{ github.event.inputs.fail_on_warning == 'true' && '--fail-on-warning' || '' }}
      continue-on-error: true
    
    - name: 📈 Generate Coverage Report
      run: |
        python -m pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing
      continue-on-error: true
    
    - name: 🔒 Security Scan
      run: |
        # Run Bandit security scan
        bandit -r . -f json -o bandit-report.json -x "*/tests/*,*/migrations/*" || true
        
        # Run Safety dependency scan
        safety check --json --output safety-report.json || true
      continue-on-error: true
    
    - name: 🔧 Code Complexity Analysis
      run: |
        # Run Radon complexity analysis
        radon cc . --json > complexity-report.json || true
        radon mi . --json > maintainability-report.json || true
      continue-on-error: true
    
    - name: 📚 Documentation Analysis
      run: |
        # Check documentation coverage
        python -c "
import ast
import os
from pathlib import Path

def analyze_documentation():
    total_files = 0
    documented_files = 0
    total_functions = 0
    documented_functions = 0
    
    for py_file in Path('.').rglob('*.py'):
        if 'test' in str(py_file) or '__pycache__' in str(py_file):
            continue
            
        try:
            with open(py_file, 'r', encoding='utf-8') as f:
                content = f.read()
                total_files += 1
                
                if '\"\"\"' in content or \"'''\" in content:
                    documented_files += 1
                
                tree = ast.parse(content)
                for node in ast.walk(tree):
                    if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                        total_functions += 1
                        if ast.get_docstring(node):
                            documented_functions += 1
        except:
            continue
    
    file_coverage = (documented_files / max(total_files, 1)) * 100
    func_coverage = (documented_functions / max(total_functions, 1)) * 100
    
    print(f'Documentation Coverage:')
    print(f'Files: {file_coverage:.1f}% ({documented_files}/{total_files})')
    print(f'Functions: {func_coverage:.1f}% ({documented_functions}/{total_functions})')
    
    return file_coverage, func_coverage

analyze_documentation()
        "
      continue-on-error: true
    
    - name: ⚖️ License Compliance Check
      run: |
        pip-licenses --format=json --output-file=licenses-report.json || true
      continue-on-error: true
    
    - name: 📊 Upload Coverage to Codecov
      if: github.event_name != 'schedule'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: 💾 Archive Quality Reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: quality-reports-${{ github.sha }}
        path: |
          quality_report.html
          coverage.xml
          htmlcov/
          bandit-report.json
          safety-report.json
          complexity-report.json
          maintainability-report.json
          licenses-report.json
        retention-days: 30
    
    - name: 📝 Comment PR with Quality Report
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          // Read quality report if it exists
          let reportContent = '## 📊 Quality Metrics Report\n\n';
          
          try {
            // Try to read JSON output from quality analysis
            const output = `${{ steps.quality_analysis.outputs.stdout }}`;
            reportContent += '### Quality Analysis Results\n';
            reportContent += '```\n' + output + '\n```\n\n';
          } catch (error) {
            reportContent += '⚠️ Quality analysis output not available\n\n';
          }
          
          // Add coverage information
          try {
            const coverageXml = fs.readFileSync('coverage.xml', 'utf8');
            const coverageMatch = coverageXml.match(/line-rate="([^"]+)"/);
            if (coverageMatch) {
              const coverage = (parseFloat(coverageMatch[1]) * 100).toFixed(1);
              reportContent += `### 📈 Code Coverage: ${coverage}%\n\n`;
            }
          } catch (error) {
            reportContent += '### 📈 Code Coverage: Not available\n\n';
          }
          
          // Add security scan results
          try {
            const banditReport = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
            const highIssues = banditReport.results.filter(r => r.issue_severity === 'HIGH').length;
            const mediumIssues = banditReport.results.filter(r => r.issue_severity === 'MEDIUM').length;
            reportContent += `### 🔒 Security Scan: ${banditReport.results.length} issues (${highIssues} high, ${mediumIssues} medium)\n\n`;
          } catch (error) {
            reportContent += '### 🔒 Security Scan: Not available\n\n';
          }
          
          reportContent += '---\n';
          reportContent += '> 📊 View detailed reports in the [build artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
          
          // Post comment on PR
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: reportContent
          });
    
    - name: 🚨 Check Quality Gates
      if: always()
      run: |
        # Check if quality analysis passed
        if [ "${{ steps.quality_analysis.outcome }}" = "success" ]; then
          echo "✅ Quality analysis passed"
          exit 0
        else
          echo "❌ Quality analysis failed"
          
          # If this is a scheduled run, don't fail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ℹ️ Scheduled run - not failing build"
            exit 0
          fi
          
          # Check if we should fail on warnings
          if [ "${{ github.event.inputs.fail_on_warning }}" = "true" ]; then
            echo "🚫 Failing build due to quality issues"
            exit 1
          fi
          
          exit 0
        fi