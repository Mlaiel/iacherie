name: 🔄 API Breaking Changes Detection

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  api-breaking-changes:
    name: 🔍 API Breaking Changes Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current code
        uses: actions/checkout@v4
        with:
          path: current

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: base

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install ast-grep griffe semver

      - name: Extract API signatures from base
        working-directory: base
        run: |
          python -c "
          import ast
          import json
          import os
          from pathlib import Path
          
          def extract_api_signatures(directory):
              signatures = {}
              
              for py_file in Path(directory).rglob('*.py'):
                  if 'test' in str(py_file) or '__pycache__' in str(py_file):
                      continue
                  
                  try:
                      with open(py_file, 'r', encoding='utf-8') as f:
                          content = f.read()
                      
                      tree = ast.parse(content)
                      file_sigs = []
                      
                      for node in ast.walk(tree):
                          if isinstance(node, ast.FunctionDef):
                              # Extract function signature
                              args = []
                              for arg in node.args.args:
                                  args.append(arg.arg)
                              
                              sig = {
                                  'type': 'function',
                                  'name': node.name,
                                  'args': args,
                                  'line': node.lineno,
                                  'is_public': not node.name.startswith('_')
                              }
                              file_sigs.append(sig)
                          
                          elif isinstance(node, ast.ClassDef):
                              # Extract class signature
                              methods = []
                              for item in node.body:
                                  if isinstance(item, ast.FunctionDef):
                                      method_args = []
                                      for arg in item.args.args:
                                          method_args.append(arg.arg)
                                      
                                      methods.append({
                                          'name': item.name,
                                          'args': method_args,
                                          'line': item.lineno,
                                          'is_public': not item.name.startswith('_')
                                      })
                              
                              sig = {
                                  'type': 'class',
                                  'name': node.name,
                                  'methods': methods,
                                  'line': node.lineno,
                                  'is_public': not node.name.startswith('_')
                              }
                              file_sigs.append(sig)
                      
                      if file_sigs:
                          signatures[str(py_file.relative_to(Path(directory)))] = file_sigs
                  
                  except Exception as e:
                      print(f'Error processing {py_file}: {e}')
                      continue
              
              return signatures
          
          # Extract from API-related directories
          api_dirs = ['api', 'business', 'core', 'ai']
          all_signatures = {}
          
          for api_dir in api_dirs:
              if os.path.exists(api_dir):
                  sigs = extract_api_signatures(api_dir)
                  all_signatures.update(sigs)
          
          with open('../base-api-signatures.json', 'w') as f:
              json.dump(all_signatures, f, indent=2)
          
          print(f'Extracted {len(all_signatures)} files with API signatures')
          "

      - name: Extract API signatures from current
        working-directory: current
        run: |
          python -c "
          import ast
          import json
          import os
          from pathlib import Path
          
          def extract_api_signatures(directory):
              signatures = {}
              
              for py_file in Path(directory).rglob('*.py'):
                  if 'test' in str(py_file) or '__pycache__' in str(py_file):
                      continue
                  
                  try:
                      with open(py_file, 'r', encoding='utf-8') as f:
                          content = f.read()
                      
                      tree = ast.parse(content)
                      file_sigs = []
                      
                      for node in ast.walk(tree):
                          if isinstance(node, ast.FunctionDef):
                              # Extract function signature
                              args = []
                              for arg in node.args.args:
                                  args.append(arg.arg)
                              
                              sig = {
                                  'type': 'function',
                                  'name': node.name,
                                  'args': args,
                                  'line': node.lineno,
                                  'is_public': not node.name.startswith('_')
                              }
                              file_sigs.append(sig)
                          
                          elif isinstance(node, ast.ClassDef):
                              # Extract class signature
                              methods = []
                              for item in node.body:
                                  if isinstance(item, ast.FunctionDef):
                                      method_args = []
                                      for arg in item.args.args:
                                          method_args.append(arg.arg)
                                      
                                      methods.append({
                                          'name': item.name,
                                          'args': method_args,
                                          'line': item.lineno,
                                          'is_public': not item.name.startswith('_')
                                      })
                              
                              sig = {
                                  'type': 'class',
                                  'name': node.name,
                                  'methods': methods,
                                  'line': node.lineno,
                                  'is_public': not node.name.startswith('_')
                              }
                              file_sigs.append(sig)
                      
                      if file_sigs:
                          signatures[str(py_file.relative_to(Path(directory)))] = file_sigs
                  
                  except Exception as e:
                      print(f'Error processing {py_file}: {e}')
                      continue
              
              return signatures
          
          # Extract from API-related directories
          api_dirs = ['api', 'business', 'core', 'ai']
          all_signatures = {}
          
          for api_dir in api_dirs:
              if os.path.exists(api_dir):
                  sigs = extract_api_signatures(api_dir)
                  all_signatures.update(sigs)
          
          with open('../current-api-signatures.json', 'w') as f:
              json.dump(all_signatures, f, indent=2)
          
          print(f'Extracted {len(all_signatures)} files with API signatures')
          "

      - name: Analyze breaking changes
        run: |
          python -c "
          import json
          import sys
          
          def load_signatures(filename):
              try:
                  with open(filename, 'r') as f:
                      return json.load(f)
              except FileNotFoundError:
                  return {}
          
          def find_breaking_changes(base_sigs, current_sigs):
              breaking_changes = []
              
              # Check for removed files
              for file_path in base_sigs:
                  if file_path not in current_sigs:
                      breaking_changes.append({
                          'type': 'REMOVED_FILE',
                          'severity': 'HIGH',
                          'file': file_path,
                          'description': f'File {file_path} was removed'
                      })
              
              # Check for changes in existing files
              for file_path in base_sigs:
                  if file_path not in current_sigs:
                      continue
                  
                  base_file_sigs = base_sigs[file_path]
                  current_file_sigs = current_sigs[file_path]
                  
                  # Create lookup maps
                  base_funcs = {sig['name']: sig for sig in base_file_sigs if sig['type'] == 'function' and sig['is_public']}
                  current_funcs = {sig['name']: sig for sig in current_file_sigs if sig['type'] == 'function' and sig['is_public']}
                  
                  base_classes = {sig['name']: sig for sig in base_file_sigs if sig['type'] == 'class' and sig['is_public']}
                  current_classes = {sig['name']: sig for sig in current_file_sigs if sig['type'] == 'class' and sig['is_public']}
                  
                  # Check removed functions
                  for func_name in base_funcs:
                      if func_name not in current_funcs:
                          breaking_changes.append({
                              'type': 'REMOVED_FUNCTION',
                              'severity': 'HIGH',
                              'file': file_path,
                              'function': func_name,
                              'description': f'Public function {func_name} was removed from {file_path}'
                          })
                  
                  # Check function signature changes
                  for func_name in base_funcs:
                      if func_name in current_funcs:
                          base_args = base_funcs[func_name]['args']
                          current_args = current_funcs[func_name]['args']
                          
                          if len(base_args) > len(current_args):
                              breaking_changes.append({
                                  'type': 'REMOVED_PARAMETER',
                                  'severity': 'HIGH',
                                  'file': file_path,
                                  'function': func_name,
                                  'description': f'Parameters removed from function {func_name} in {file_path}'
                              })
                          elif base_args[:len(current_args)] != current_args[:len(base_args)]:
                              breaking_changes.append({
                                  'type': 'CHANGED_PARAMETER_ORDER',
                                  'severity': 'MEDIUM',
                                  'file': file_path,
                                  'function': func_name,
                                  'description': f'Parameter order changed in function {func_name} in {file_path}'
                              })
                  
                  # Check removed classes
                  for class_name in base_classes:
                      if class_name not in current_classes:
                          breaking_changes.append({
                              'type': 'REMOVED_CLASS',
                              'severity': 'HIGH',
                              'file': file_path,
                              'class': class_name,
                              'description': f'Public class {class_name} was removed from {file_path}'
                          })
                  
                  # Check class method changes
                  for class_name in base_classes:
                      if class_name in current_classes:
                          base_methods = {m['name']: m for m in base_classes[class_name]['methods'] if m['is_public']}
                          current_methods = {m['name']: m for m in current_classes[class_name]['methods'] if m['is_public']}
                          
                          for method_name in base_methods:
                              if method_name not in current_methods:
                                  breaking_changes.append({
                                      'type': 'REMOVED_METHOD',
                                      'severity': 'HIGH',
                                      'file': file_path,
                                      'class': class_name,
                                      'method': method_name,
                                      'description': f'Public method {method_name} was removed from class {class_name} in {file_path}'
                                  })
              
              return breaking_changes
          
          base_signatures = load_signatures('base-api-signatures.json')
          current_signatures = load_signatures('current-api-signatures.json')
          
          breaking_changes = find_breaking_changes(base_signatures, current_signatures)
          
          print(f'🔍 API Breaking Changes Analysis')
          print(f'================================')
          print(f'Files analyzed: {len(set(list(base_signatures.keys()) + list(current_signatures.keys())))}')
          print(f'Breaking changes found: {len(breaking_changes)}')
          print()
          
          if breaking_changes:
              high_severity = [c for c in breaking_changes if c['severity'] == 'HIGH']
              medium_severity = [c for c in breaking_changes if c['severity'] == 'MEDIUM']
              
              print(f'❌ HIGH SEVERITY: {len(high_severity)}')
              print(f'⚠️ MEDIUM SEVERITY: {len(medium_severity)}')
              print()
              
              for change in breaking_changes:
                  severity_icon = '❌' if change['severity'] == 'HIGH' else '⚠️'
                  print(f'{severity_icon} [{change['severity']}] {change['type']}:')
                  print(f'    {change['description']}')
                  print()
              
              # Save detailed report
              with open('breaking-changes-report.json', 'w') as f:
                  json.dump(breaking_changes, f, indent=2)
              
              # Create markdown report
              with open('breaking-changes-report.md', 'w') as f:
                  f.write('# 🔄 API Breaking Changes Report\\n\\n')
                  f.write(f'**Total Changes**: {len(breaking_changes)}\\n')
                  f.write(f'**High Severity**: {len(high_severity)}\\n')
                  f.write(f'**Medium Severity**: {len(medium_severity)}\\n\\n')
                  
                  if breaking_changes:
                      f.write('## Breaking Changes\\n\\n')
                      for change in breaking_changes:
                          severity_icon = '❌' if change['severity'] == 'HIGH' else '⚠️'
                          f.write(f'### {severity_icon} {change['type']} ({change['severity']})\\n\\n')
                          f.write(f'**Description**: {change['description']}\\n\\n')
                          f.write(f'**File**: `{change['file']}`\\n\\n')
                          if 'function' in change:
                              f.write(f'**Function**: `{change['function']}`\\n\\n')
                          if 'class' in change:
                              f.write(f'**Class**: `{change['class']}`\\n\\n')
                          if 'method' in change:
                              f.write(f'**Method**: `{change['method']}`\\n\\n')
                          f.write('---\\n\\n')
              
              # Exit with error if high severity changes found
              if high_severity:
                  print('💥 HIGH SEVERITY BREAKING CHANGES DETECTED!')
                  print('Please review the changes and update the version accordingly.')
                  sys.exit(1)
              else:
                  print('⚠️ Medium severity changes detected. Consider version bump.')
          else:
              print('✅ No breaking changes detected!')
              
              # Create empty report
              with open('breaking-changes-report.md', 'w') as f:
                  f.write('# 🔄 API Breaking Changes Report\\n\\n')
                  f.write('✅ **No breaking changes detected!**\\n\\n')
                  f.write(f'Analysis completed on: {sys.version}\\n')
          "

      - name: Extract FastAPI OpenAPI schemas
        working-directory: current
        run: |
          python -c "
          import json
          import sys
          import os
          sys.path.insert(0, '.')
          
          try:
              # Try to import the FastAPI app
              from main import app
              
              # Generate OpenAPI schema
              openapi_schema = app.openapi()
              
              with open('../current-openapi.json', 'w') as f:
                  json.dump(openapi_schema, f, indent=2)
              
              print('✅ Generated current OpenAPI schema')
          except Exception as e:
              print(f'⚠️ Could not generate OpenAPI schema: {e}')
              # Create empty schema
              with open('../current-openapi.json', 'w') as f:
                  json.dump({}, f)
          "

      - name: Extract base FastAPI OpenAPI schemas
        working-directory: base
        run: |
          python -c "
          import json
          import sys
          import os
          sys.path.insert(0, '.')
          
          try:
              # Try to import the FastAPI app
              from main import app
              
              # Generate OpenAPI schema
              openapi_schema = app.openapi()
              
              with open('../base-openapi.json', 'w') as f:
                  json.dump(openapi_schema, f, indent=2)
              
              print('✅ Generated base OpenAPI schema')
          except Exception as e:
              print(f'⚠️ Could not generate base OpenAPI schema: {e}')
              # Create empty schema
              with open('../base-openapi.json', 'w') as f:
                  json.dump({}, f)
          "

      - name: Compare OpenAPI schemas
        run: |
          python -c "
          import json
          
          def load_schema(filename):
              try:
                  with open(filename, 'r') as f:
                      return json.load(f)
              except FileNotFoundError:
                  return {}
          
          def compare_openapi_schemas(base_schema, current_schema):
              changes = []
              
              base_paths = base_schema.get('paths', {})
              current_paths = current_schema.get('paths', {})
              
              # Check for removed endpoints
              for path in base_paths:
                  if path not in current_paths:
                      changes.append({
                          'type': 'REMOVED_ENDPOINT',
                          'severity': 'HIGH',
                          'path': path,
                          'description': f'API endpoint {path} was removed'
                      })
                      continue
                  
                  # Check for removed methods
                  base_methods = set(base_paths[path].keys())
                  current_methods = set(current_paths[path].keys())
                  
                  for method in base_methods:
                      if method not in current_methods:
                          changes.append({
                              'type': 'REMOVED_METHOD',
                              'severity': 'HIGH',
                              'path': path,
                              'method': method.upper(),
                              'description': f'HTTP method {method.upper()} was removed from {path}'
                          })
              
              return changes
          
          base_schema = load_schema('base-openapi.json')
          current_schema = load_schema('current-openapi.json')
          
          if base_schema and current_schema:
              api_changes = compare_openapi_schemas(base_schema, current_schema)
              
              print(f'🌐 OpenAPI Schema Changes')
              print(f'========================')
              print(f'API changes found: {len(api_changes)}')
              
              if api_changes:
                  for change in api_changes:
                      print(f'❌ {change['type']}: {change['description']}')
                  
                  # Append to existing report
                  try:
                      with open('breaking-changes-report.json', 'r') as f:
                          existing_changes = json.load(f)
                  except FileNotFoundError:
                      existing_changes = []
                  
                  existing_changes.extend(api_changes)
                  
                  with open('breaking-changes-report.json', 'w') as f:
                      json.dump(existing_changes, f, indent=2)
              else:
                  print('✅ No OpenAPI schema changes detected')
          else:
              print('⚠️ Could not compare OpenAPI schemas (missing base or current)')
          "

      - name: Upload breaking changes report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: breaking-changes-report
          path: |
            breaking-changes-report.json
            breaking-changes-report.md
            base-api-signatures.json
            current-api-signatures.json
            base-openapi.json
            current-openapi.json

      - name: Comment PR with breaking changes
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            try {
              const report = fs.readFileSync('breaking-changes-report.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.log('Could not post breaking changes comment:', error);
            }