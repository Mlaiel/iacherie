---
# Ainflue Platform - Production CI/CD Pipeline
# Author: Fahed Mlaiel (mlaiel@live.de)
# GitHub Actions workflow for automated production deployment

name: Production Deployment

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mlaiel/ainflue

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Bandit Security Scan
        run: |
          pip install bandit[toml]
          bandit -r . -f json -o bandit-report.json
          
      - name: Run Safety Check
        run: |
          pip install safety
          safety check --json --output safety-report.json || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: security-scan
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-production.txt
          
      - name: Run Linting
        run: |
          pip install black flake8 mypy
          black --check .
          flake8 .
          mypy . --ignore-missing-imports
          
      - name: Run Tests
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml --cov-report=term
          
      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            
      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom.spdx.json
          
      - name: Upload SBOM
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.spdx.json

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-docker
    
    steps:
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-docker.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker, vulnerability-scan]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}
          
      - name: Deploy to Staging
        run: |
          # Update image tags in manifests
          sed -i "s|image: .*|image: ${{ needs.build-docker.outputs.image-tag }}|g" kubernetes/environments/staging/*.yaml
          
          # Apply Kubernetes manifests
          kubectl apply -f kubernetes/environments/staging/
          
          # Wait for deployment to complete
          kubectl rollout status deployment/ainflue-api -n ainflue-staging --timeout=600s
          
      - name: Run Smoke Tests
        run: |
          # Wait for service to be ready
          sleep 30
          
          # Get service URL
          SERVICE_URL=$(kubectl get service ainflue-api -n ainflue-staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          # Run smoke tests
          curl -f http://$SERVICE_URL/health || exit 1
          curl -f http://$SERVICE_URL/api/v1/status || exit 1

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Test Dependencies
        run: |
          pip install pytest requests
          
      - name: Run Integration Tests
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          pytest tests/integration/ -v --tb=short

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker, vulnerability-scan, integration-tests]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
          
      - name: Create Kubernetes Secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          # Apply secrets
          envsubst < kubernetes/secrets/production-secrets.yaml | kubectl apply -f -
          
      - name: Blue-Green Deployment
        run: |
          # Create new deployment version
          TIMESTAMP=$(date +%s)
          NEW_VERSION="green-${TIMESTAMP}"
          
          # Update manifests with new image and version
          sed -i "s|image: .*|image: ${{ needs.build-docker.outputs.image-tag }}|g" kubernetes/environments/production/*.yaml
          sed -i "s|version: .*|version: ${NEW_VERSION}|g" kubernetes/environments/production/*.yaml
          
          # Deploy green version
          kubectl apply -f kubernetes/environments/production/
          
          # Wait for green deployment to be ready
          kubectl rollout status deployment/ainflue-api-green -n ainflue --timeout=600s
          
          # Run health checks on green deployment
          GREEN_SERVICE_URL=$(kubectl get service ainflue-api-green -n ainflue -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          # Health check loop
          for i in {1..10}; do
            if curl -f http://$GREEN_SERVICE_URL/health; then
              echo "Green deployment health check passed"
              break
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 30
          done
          
      - name: Switch Traffic to Green
        run: |
          # Update service selector to point to green deployment
          kubectl patch service ainflue-api -n ainflue -p '{"spec":{"selector":{"version":"green"}}}'
          
          # Wait for traffic switch
          sleep 60
          
          # Verify production traffic
          PROD_URL="https://api.ainflue.com"
          curl -f $PROD_URL/health || exit 1
          
      - name: Cleanup Blue Deployment
        run: |
          # Scale down blue deployment after successful green deployment
          kubectl scale deployment ainflue-api-blue -n ainflue --replicas=0
          
      - name: Update Monitoring
        run: |
          # Update deployment annotations for monitoring
          kubectl annotate deployment ainflue-api-green -n ainflue \
            deployment.kubernetes.io/revision="$(date +%s)" \
            deployment.kubernetes.io/deployed-by="${{ github.actor }}" \
            deployment.kubernetes.io/commit-sha="${{ github.sha }}"

  post-deployment:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    
    steps:
      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Run any pending database migrations
          python manage.py migrate --check || python manage.py migrate
          
      - name: Warm Up Caches
        run: |
          # Warm up application caches
          curl -X POST https://api.ainflue.com/admin/cache/warm-up \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}"
            
      - name: Update CDN
        run: |
          # Purge CDN cache for updated static assets
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
            
      - name: Notify Teams
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,commit,author,action,eventName,ref,workflow

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: failure()
    environment: production
    
    steps:
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
          
      - name: Rollback to Blue
        run: |
          # Switch traffic back to blue deployment
          kubectl patch service ainflue-api -n ainflue -p '{"spec":{"selector":{"version":"blue"}}}'
          
          # Scale up blue deployment
          kubectl scale deployment ainflue-api-blue -n ainflue --replicas=3
          
          # Wait for blue deployment to be ready
          kubectl rollout status deployment/ainflue-api-blue -n ainflue --timeout=300s
          
      - name: Notify Rollback
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#alerts'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: "🚨 Production deployment failed and was rolled back automatically"