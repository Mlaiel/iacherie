name: 🚀 Build & Push to AWS ECR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: iacherie-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: 🔐 Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: 🏗️ Build Docker image (Slim version)
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🐳 Building SLIM Docker image (optimized)..."
        echo "📦 Using pytorch/pytorch:2.1.2 base image"
        echo "📦 Installing only 25 critical dependencies (vs 97)"
        docker build -f Dockerfile.backend.slim \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          .
    
    - name: 📤 Push to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "📦 Pushing image to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "✅ Image pushed successfully!"
        echo "📍 Image: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
    
    - name: 🚀 Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        echo "🔄 Updating Kubernetes deployment..."
        aws eks update-kubeconfig --name iacherie-cluster --region $AWS_REGION
        
        echo "📦 Setting new image: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
        kubectl set image deployment/iacherie-backend \
          backend=$ECR_REGISTRY/$ECR_REPOSITORY:latest \
          -n iacherie-prod
        
        echo "⏳ Waiting for rollout to complete..."
        kubectl rollout status deployment/iacherie-backend -n iacherie-prod --timeout=5m
        
        echo "✅ Deployment successful!"
        kubectl get pods -n iacherie-prod
