---
name: 🔐 Vault Secrets Management Integration

on:
  workflow_call:
  inputs:
      action:
        description: 'Action to perform (read, write, rotate, audit)'
        required: true
        type: string
      secret_path:
        description: 'Vault secret path'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: string
  secrets:
      VAULT_ADDR:
        required: true
      VAULT_TOKEN:
        required: true
      VAULT_NAMESPACE:
        required: false

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
  VAULT_NAMESPACE: ${{ secrets.VAULT_NAMESPACE }}

jobs:
  # Setup Vault CLI
  vault-setup:
  name: 🔧 Vault Setup
  runs-on: ubuntu-latest
  outputs:
      vault-version: ${{ steps.install.outputs.version }}

  steps:
      - name: Install Vault CLI
        id: install
        run: |
          # Install HashiCorp Vault CLI
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault

          # Verify installation
          VAULT_VERSION=$(vault version | head -1 | awk '{print $2}')
          echo "version=$VAULT_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Vault CLI installed: $VAULT_VERSION"

      - name: Vault connection test
        run: |
          # Test Vault connectivity
          if vault status; then
            echo "✅ Vault connection successful"
          else
            echo "❌ Vault connection failed"
            exit 1
          fi

  # Read secrets from Vault
  read-secrets:
  name: 📖 Read Secrets
  runs-on: ubuntu-latest
  needs: vault-setup
  if: inputs.action == 'read'
  outputs:
      secrets-list: ${{ steps.read.outputs.secrets }}

  steps:
      - name: Install Vault CLI
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault

      - name: Read secrets from Vault
        id: read
        run: |
          echo "Reading secrets from path: ${{ inputs.secret_path }}"

          # Read secrets from specified path
          if vault kv get -format=json "${{ inputs.secret_path }}" > secrets.json; then
            echo "✅ Successfully read secrets from Vault"

            # Extract secret keys (without values for security)
            SECRETS_LIST=$(jq -r '.data.data | keys[]' secrets.json | tr '\n' ',' | sed 's/,$//')
            echo "secrets=$SECRETS_LIST" >> $GITHUB_OUTPUT

            echo "Available secrets: $SECRETS_LIST"
          else
            echo "❌ Failed to read secrets from path: ${{ inputs.secret_path }}"
            exit 1
          fi

      - name: Validate secret format
        run: |
          # Validate that secrets are in expected format
          if [-f "secrets.json"]; then
            # Check for required fields based on environment
            case "${{ inputs.environment }}" in
              "production")
                REQUIRED_SECRETS=("postgres-password" "redis-password" "jwt-secret" "api-key")
                ;;
              "staging")
                REQUIRED_SECRETS=("postgres-password" "redis-password" "jwt-secret")
                ;;
              *)
                REQUIRED_SECRETS=("postgres-password")
                ;;
            esac

            echo "Validating required secrets for ${{ inputs.environment }}..."

            for secret in "${REQUIRED_SECRETS[@]}"; do
              if jq -e ".data.data[\"$secret\"]" secrets.json > /dev/null; then
                echo "✅ Required secret found: $secret"
              else
                echo "❌ Missing required secret: $secret"
                exit 1
              fi
            done
          fi

  # Write secrets to Vault
  write-secrets:
  name: ✍️ Write Secrets
  runs-on: ubuntu-latest
  needs: vault-setup
  if: inputs.action == 'write'

  steps:
      - name: Install Vault CLI
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by /usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault

      - name: Generate new secrets
        run: |
          # Generate secure random secrets
          echo "Generating new secrets for ${{ inputs.environment }}..."

          # Generate strong passwords and keys
          POSTGRES_PASSWORD=$(openssl rand -base64 32)
          REDIS_PASSWORD=$(openssl rand -base64 32)
          JWT_SECRET=$(openssl rand -base64 64)
          API_KEY=$(openssl rand -hex 32)
          ENCRYPTION_KEY=$(openssl rand -base64 32)

          # Create secrets JSON
          cat > new_secrets.json << EOF
          {
            "postgres-password": "$POSTGRES_PASSWORD",
            "redis-password": "$REDIS_PASSWORD",
            "jwt-secret": "$JWT_SECRET",
            "api-key": "$API_KEY",
            "encryption-key": "$ENCRYPTION_KEY",
            "created-by": "github-actions",
            "created-at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "environment": "${{ inputs.environment }}"
          }
          EOF

          echo "✅ Generated new secrets"

      - name: Write secrets to Vault
        run: |
          echo "Writing secrets to Vault path: ${{ inputs.secret_path }}"

          # Write secrets to Vault
          if vault kv put "${{ inputs.secret_path }}" @new_secrets.json; then
            echo "✅ Successfully wrote secrets to Vault"
          else
            echo "❌ Failed to write secrets to Vault"
            exit 1
          fi

          # Clean up sensitive file
          shred -vfz -n 3 new_secrets.json

      - name: Verify written secrets
        run: |
          # Verify secrets were written correctly
          if vault kv get "${{ inputs.secret_path }}" > /dev/null; then
            echo "✅ Secrets verification successful"
          else
            echo "❌ Secrets verification failed"
            exit 1
          fi

  # Rotate secrets
  rotate-secrets:
  name: 🔄 Rotate Secrets
  runs-on: ubuntu-latest
  needs: vault-setup
  if: inputs.action == 'rotate'

  steps:
      - name: Install Vault CLI
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault

      - name: Backup current secrets
        run: |
          echo "Backing up current secrets before rotation..."

          # Read current secrets
          if vault kv get -format=json "${{ inputs.secret_path }}" > current_secrets_backup.json; then
            echo "✅ Current secrets backed up"

            # Add backup metadata
            BACKUP_PATH="${{ inputs.secret_path }}-backup-$(date +%Y%m%d%H%M%S)"
            vault kv put "$BACKUP_PATH" @current_secrets_backup.json
            echo "✅ Backup stored at: $BACKUP_PATH"
          else
            echo "❌ Failed to backup current secrets"
            exit 1
          fi

      - name: Generate rotated secrets
        run: |
          echo "Generating rotated secrets..."

          # Read current secrets to preserve non-rotatable values
          jq '.data.data' current_secrets_backup.json > current.json

          # Generate new rotatable secrets
          NEW_POSTGRES_PASSWORD=$(openssl rand -base64 32)
          NEW_REDIS_PASSWORD=$(openssl rand -base64 32)
          NEW_JWT_SECRET=$(openssl rand -base64 64)
          NEW_API_KEY=$(openssl rand -hex 32)

          # Create rotated secrets JSON, preserving some values
          jq --arg postgres_pwd "$NEW_POSTGRES_PASSWORD" \
             --arg redis_pwd "$NEW_REDIS_PASSWORD" \
             --arg jwt_secret "$NEW_JWT_SECRET" \
             --arg api_key "$NEW_API_KEY" \
             --arg rotated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '. + {
               "postgres-password": $postgres_pwd,
               "redis-password": $redis_pwd,
               "jwt-secret": $jwt_secret,
               "api-key": $api_key,
               "rotated-at": $rotated_at,
               "rotated-by": "github-actions"
             }' current.json > rotated_secrets.json

          echo "✅ Rotated secrets generated"

      - name: Write rotated secrets
        run: |
          echo "Writing rotated secrets to Vault..."

          if vault kv put "${{ inputs.secret_path }}" @rotated_secrets.json; then
            echo "✅ Successfully rotated secrets in Vault"
          else
            echo "❌ Failed to write rotated secrets"
            exit 1
          fi

          # Clean up sensitive files
          shred -vfz -n 3 rotated_secrets.json current.json current_secrets_backup.json

      - name: Notify about rotation
        run: |
          echo "🔄 Secret rotation completed for ${{ inputs.environment }}"
          echo "Path: ${{ inputs.secret_path }}"
          echo "Rotated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # Audit secrets access
  audit-secrets:
  name: 📋 Audit Secrets
  runs-on: ubuntu-latest
  needs: vault-setup
  if: inputs.action == 'audit'

  steps:
      - name: Install Vault CLI
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault

      - name: Generate secrets audit report
        run: |
          echo "Generating secrets audit report..."

          # Get secret metadata
          if vault kv metadata get "${{ inputs.secret_path }}" > metadata.txt 2>&1; then
            echo "✅ Retrieved secret metadata"

            # Extract key information
            CREATED_TIME=$(grep "Created Time" metadata.txt | awk -F': ' '{print $2}' || echo "Unknown")
            UPDATED_TIME=$(grep "Updated Time" metadata.txt | awk -F': ' '{print $2}' || echo "Unknown")
            VERSION=$(grep "Current Version" metadata.txt | awk -F': ' '{print $2}' || echo "Unknown")

            # Create audit report
            cat > audit_report.md << EOF
          # 🔍 Vault Secrets Audit Report

          **Path:** ${{ inputs.secret_path }}
          **Environment:** ${{ inputs.environment }}
          **Audit Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Secret Information
          - **Created:** $CREATED_TIME
          - **Last Updated:** $UPDATED_TIME
          - **Current Version:** $VERSION

          ## Security Status
          $(if vault kv get "${{ inputs.secret_path }}" > /dev/null 2>&1; then echo "✅ Secret accessible"; else echo "❌ Secret access failed"; fi)

          ## Compliance
          - Secrets stored in HashiCorp Vault ✅
          - Encrypted at rest ✅
          - Access controlled ✅
          - Audit logging enabled ✅

          ## Recommendations
          $(if ["$VERSION" -gt 10]; then echo "⚠️ Consider rotating secrets (version $VERSION)"; else echo "✅ Secret versions within acceptable range"; fi)

          ---
          *Generated by Ainflue Vault Integration*
          EOF

            cat audit_report.md
          else
            echo "❌ Failed to retrieve secret metadata"
            exit 1
          fi

      - name: Check secret age and rotation schedule
        run: |
          echo "Checking secret rotation schedule..."

          # Check when secrets were last rotated
          if vault kv get -format=json "${{ inputs.secret_path }}" > secret_data.json; then
            LAST_ROTATION=$(jq -r '.data.data."rotated-at" // .data.data."created-at" // "unknown"' secret_data.json)

            if ["$LAST_ROTATION" != "unknown"]; then
              # Calculate days since rotation
              ROTATION_DATE=$(date -d "$LAST_ROTATION" +%s 2>/dev/null || echo "0")
              CURRENT_DATE=$(date +%s)
              DAYS_SINCE=$((($CURRENT_DATE - $ROTATION_DATE) / 86400))

              echo "Days since last rotation: $DAYS_SINCE"

              # Recommend rotation based on environment and age
              case "${{ inputs.environment }}" in
                "production")
                  if [$DAYS_SINCE -gt 90]; then
                    echo "⚠️ Production secrets should be rotated (>90 days old)"
                  else
                    echo "✅ Production secrets rotation schedule acceptable"
                  fi
                  ;;
                "staging")
                  if [$DAYS_SINCE -gt 180]; then
                    echo "⚠️ Staging secrets could be rotated (>180 days old)"
                  else
                    echo "✅ Staging secrets rotation schedule acceptable"
                  fi
                  ;;
              esac
            else
              echo "⚠️ Unable to determine last rotation date"
            fi

            # Clean up
            rm -f secret_data.json
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v3
        with:
          name: vault-audit-report
          path: audit_report.md

  # Create Kubernetes secrets from Vault
  sync-to-kubernetes:
  name: 🔄 Sync to Kubernetes
  runs-on: ubuntu-latest
  needs: [vault-setup, read-secrets]
  if: always() && needs.read-secrets.result == 'success'

  steps:
      - name: Install tools
        run: |
          # Install Vault CLI
          wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install vault

          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: Read secrets from Vault
        run: |
          echo "Reading secrets from Vault for Kubernetes sync..."

          # Read secrets
          vault kv get -format=json "${{ inputs.secret_path }}" > vault_secrets.json

          # Extract secrets for Kubernetes
          jq -r '.data.data | to_entries | map("--from-literal=\(.key)=\(.value)") | join(" ")' vault_secrets.json > k8s_secret_args.txt

          echo "✅ Prepared secrets for Kubernetes"

      - name: Create/Update Kubernetes Secret
        env:
          KUBECONFIG_CONTENT: ${{ inputs.environment == 'production' && secrets.KUBE_CONFIG_PRODUCTION || secrets.KUBE_CONFIG_STAGING }}
        run: |
          # Setup kubeconfig
          echo "$KUBECONFIG_CONTENT" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

          # Determine namespace based on environment
          NAMESPACE="ainflue-${{ inputs.environment }}"
          SECRET_NAME="ainflue-secrets"

          # Create or update the secret
          SECRET_ARGS=$(cat k8s_secret_args.txt)

          if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" > /dev/null 2>&1; then
            echo "Updating existing Kubernetes secret..."
            kubectl delete secret "$SECRET_NAME" -n "$NAMESPACE"
          else
            echo "Creating new Kubernetes secret..."
          fi

          # Create the secret
          eval "kubectl create secret generic $SECRET_NAME -n $NAMESPACE $SECRET_ARGS"

          # Add labels and annotations
          kubectl label secret "$SECRET_NAME" -n "$NAMESPACE" \
            app=ainflue \
            environment="${{ inputs.environment }}" \
            managed-by=vault \
            --overwrite

          kubectl annotate secret "$SECRET_NAME" -n "$NAMESPACE" \
            vault.hashicorp.com/path="${{ inputs.secret_path }}" \
            vault.hashicorp.com/synced-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --overwrite

          echo "✅ Kubernetes secret synchronized"

          # Clean up sensitive files
          shred -vfz -n 3 vault_secrets.json k8s_secret_args.txt kubeconfig

  # Summary report
  vault-summary:
  name: 📊 Vault Operation Summary
  runs-on: ubuntu-latest
  needs: [read-secrets, write-secrets, rotate-secrets, audit-secrets, sync-to-kubernetes]
  if: always()

  steps:
      - name: Generate operation summary
        run: |
          echo "# 🔐 Vault Secrets Management Summary" > vault_summary.md
          echo "" >> vault_summary.md
          echo "**Operation:** ${{ inputs.action }}" >> vault_summary.md
          echo "**Path:** ${{ inputs.secret_path }}" >> vault_summary.md
          echo "**Environment:** ${{ inputs.environment }}" >> vault_summary.md
          echo "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> vault_summary.md
          echo "" >> vault_summary.md

          echo "## Operation Results:" >> vault_summary.md
          echo "" >> vault_summary.md

          # Check results of each job
          if ["${{ needs.read-secrets.result }}" = "success"]; then
            echo "✅ **Read Secrets:** Successful" >> vault_summary.md
            echo "   - Available secrets: ${{ needs.read-secrets.outputs.secrets-list }}" >> vault_summary.md
          elif ["${{ needs.read-secrets.result }}" = "skipped"]; then
            echo "⏭️ **Read Secrets:** Skipped" >> vault_summary.md
          else
            echo "❌ **Read Secrets:** Failed" >> vault_summary.md
          fi

          if ["${{ needs.write-secrets.result }}" = "success"]; then
            echo "✅ **Write Secrets:** Successful" >> vault_summary.md
          elif ["${{ needs.write-secrets.result }}" = "skipped"]; then
            echo "⏭️ **Write Secrets:** Skipped" >> vault_summary.md
          else
            echo "❌ **Write Secrets:** Failed" >> vault_summary.md
          fi

          if ["${{ needs.rotate-secrets.result }}" = "success"]; then
            echo "✅ **Rotate Secrets:** Successful" >> vault_summary.md
          elif ["${{ needs.rotate-secrets.result }}" = "skipped"]; then
            echo "⏭️ **Rotate Secrets:** Skipped" >> vault_summary.md
          else
            echo "❌ **Rotate Secrets:** Failed" >> vault_summary.md
          fi

          if ["${{ needs.audit-secrets.result }}" = "success"]; then
            echo "✅ **Audit Secrets:** Successful" >> vault_summary.md
          elif ["${{ needs.audit-secrets.result }}" = "skipped"]; then
            echo "⏭️ **Audit Secrets:** Skipped" >> vault_summary.md
          else
            echo "❌ **Audit Secrets:** Failed" >> vault_summary.md
          fi

          if ["${{ needs.sync-to-kubernetes.result }}" = "success"]; then
            echo "✅ **Kubernetes Sync:** Successful" >> vault_summary.md
          elif ["${{ needs.sync-to-kubernetes.result }}" = "skipped"]; then
            echo "⏭️ **Kubernetes Sync:** Skipped" >> vault_summary.md
          else
            echo "❌ **Kubernetes Sync:** Failed" >> vault_summary.md
          fi

          echo "" >> vault_summary.md
          echo "---" >> vault_summary.md
          echo "*Generated by Ainflue Vault Integration System*" >> vault_summary.md

          # Display summary
          cat vault_summary.md

      - name: Upload summary report
        uses: actions/upload-artifact@v3
        with:
          name: vault-operation-summary
          path: vault_summary.md
