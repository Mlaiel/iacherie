---
name: 🐍 Backend CI Pipeline

on:
  push:
  branches: [main, develop]
  paths:
      - 'backend/**'
      - 'api/**'
      - 'core/**'
      - 'services/**'
      - 'analytics/**'
      - 'ai_engine/**'
      - 'business/**'
      - 'microservices/**'
      - 'workflow/**'
      - 'security/**'
      - 'requirements*.txt'
      - 'pytest.ini'
      - '.github/workflows/backend-ci.yaml'
  pull_request:
  branches: [main, develop]
  paths:
      - 'backend/**'
      - 'api/**'
      - 'core/**'
      - 'services/**'
      - 'analytics/**'
      - 'ai_engine/**'
      - 'business/**'
      - 'microservices/**'
      - 'workflow/**'
      - 'security/**'
      - 'requirements*.txt'
      - 'pytest.ini'

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # Backend Code Quality & Testing
  backend-quality:
  name: 🔍 Backend Code Quality
  runs-on: ubuntu-latest
  timeout-minutes: 20

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 📦 Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pipenv
        key: ${{ runner.os }}-python-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-

    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy bandit safety pytest pytest-cov pytest-xdist
        if [-f requirements.txt]; then pip install -r requirements.txt; fi
        if [-f requirements-dev.txt]; then pip install -r requirements-dev.txt; fi

    - name: 🎨 Code formatting check (Black)
      run: |
        black --check --diff backend/ api/ core/ services/ analytics/ ai_engine/ business/ microservices/ workflow/ security/ || exit 1

    - name: 🔍 Linting (Flake8)
      run: |
        flake8 --max-line-length=120 --extend-ignore=E203,W503 \
          backend/ api/ core/ services/ analytics/ ai_engine/ business/ microservices/ workflow/ security/

    - name: 🏷️ Type checking (MyPy)
      run: |
        mypy --ignore-missing-imports --exclude '__pycache__' \
          backend/ api/ core/ services/ analytics/ ai_engine/ business/ microservices/ workflow/ security/ || true

    - name: 🔒 Security scan (Bandit)
      run: |
        bandit -r backend/ api/ core/ services/ analytics/ ai_engine/ business/ microservices/ workflow/ security/ \
          -f json -o bandit-report.json || true
        bandit -r backend/ api/ core/ services/ analytics/ ai_engine/ business/ microservices/ workflow/ security/ \
          --severity-level medium

    - name: 📊 Upload security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-security-report
        path: bandit-report.json

  # Backend Unit Tests
  backend-tests:
  name: 🧪 Backend Tests
  runs-on: ubuntu-latest
  timeout-minutes: 30

  strategy:
      matrix:
        python-version: ['3.11', '3.12']

  services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_ainflue
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: 📦 Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pipenv
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ matrix.python-version }}-

    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist pytest-mock
        if [-f requirements.txt]; then pip install -r requirements.txt; fi
        if [-f requirements-dev.txt]; then pip install -r requirements-dev.txt; fi

    - name: 🧪 Run backend tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_ainflue
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
      run: |
        pytest tests/ -v --cov=backend --cov=api --cov=core --cov=services \
          --cov=analytics --cov=ai_engine --cov=business --cov=microservices \
          --cov=workflow --cov=security \
          --cov-report=xml --cov-report=html --cov-report=term-missing \
          --junit-xml=pytest-results.xml \
          -n auto || true

    - name: 📊 Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results-${{ matrix.python-version }}
        path: |
          pytest-results.xml
          htmlcov/
          .coverage

    - name: 📈 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.12'
      with:
        files: ./coverage.xml
        flags: backend
        name: backend-coverage

  # Backend Performance Tests
  backend-performance:
  name: ⚡ Backend Performance
  runs-on: ubuntu-latest
  timeout-minutes: 15
  if: github.event_name == 'pull_request'

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install locust pytest-benchmark
        if [-f requirements.txt]; then pip install -r requirements.txt; fi

    - name: ⚡ Run performance benchmarks
      run: |
        # Run basic performance tests if they exist
        if [-d "tests/performance"]; then
          pytest tests/performance/ --benchmark-only --benchmark-json=benchmark-results.json || true
        fi

    - name: 📊 Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-performance-results
        path: benchmark-results.json

  # Backend Integration Tests
  backend-integration:
  name: 🔗 Backend Integration Tests
  runs-on: ubuntu-latest
  timeout-minutes: 25
  if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

  services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        if [-f requirements.txt]; then pip install -r requirements.txt; fi
        if [-f requirements-dev.txt]; then pip install -r requirements-dev.txt; fi

    - name: 🔗 Run integration tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integration_test
        REDIS_URL: redis://localhost:6379/0
        TESTING: true
        INTEGRATION_TESTING: true
      run: |
        if [-d "tests/integration"]; then
          pytest tests/integration/ -v --junit-xml=integration-results.xml || true
        else
          echo "No integration tests found, skipping..."
        fi

    - name: 📊 Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-integration-results
        path: integration-results.xml

  # Summary
  backend-summary:
  name: 📋 Backend CI Summary
  runs-on: ubuntu-latest
  needs: [backend-quality, backend-tests, backend-performance, backend-integration]
  if: always()

  steps:
    - name: 📊 Check results
      run: |
        echo "Backend CI Pipeline Results:"
        echo "Quality Check: ${{ needs.backend-quality.result }}"
        echo "Unit Tests: ${{ needs.backend-tests.result }}"
        echo "Performance: ${{ needs.backend-performance.result }}"
        echo "Integration: ${{ needs.backend-integration.result }}"

        if [["${{ needs.backend-quality.result }}" == "failure" || "${{ needs.backend-tests.result }}" == "failure"]]; then
          echo "❌ Backend CI failed - critical issues detected"
          exit 1
        else
          echo "✅ Backend CI completed successfully"
        fi
