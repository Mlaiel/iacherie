---
# Deployment Scheduling Workflow
# Manages deployment scheduling with maintenance windows and automated deployments
#
# Author: Fahed Mlaiel (mlaiel@live.de)
# Project: Ainflue Platform Production Deployment

name: 📅 Deployment Scheduling & Maintenance Windows

on:
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Type of deployment'
        required: true
        type: choice
        options:
          - scheduled
          - maintenance-window
          - emergency
      schedule_time:
        description: 'Scheduled deployment time (YYYY-MM-DD HH:MM UTC)'
        required: false
        type: string
      maintenance_duration:
        description: 'Maintenance window duration in minutes'
        required: false
        default: '60'
        type: string
      deployment_strategy:
        description: 'Deployment strategy to use'
        required: true
        default: 'blue-green'
        type: choice
        options:
          - blue-green
          - canary
          - rolling
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_approval:
        description: 'Skip approval for emergency deployments'
        required: false
        default: false
        type: boolean

  schedule:
    # Run daily at 2 AM UTC to check for scheduled deployments
    - cron: '0 2 * * *'

env:
  DEPLOYMENT_TYPE: ${{ inputs.deployment_type || 'scheduled' }}
  SCHEDULE_TIME: ${{ inputs.schedule_time }}
  MAINTENANCE_DURATION: ${{ inputs.maintenance_duration || '60' }}

jobs:
  validate-schedule:
    name: 📋 Validate Deployment Schedule
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.schedule-check.outputs.should_deploy }}
      deployment_window: ${{ steps.schedule-check.outputs.deployment_window }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Deployment Schedule
        id: schedule-check
        run: |
          echo "🕐 Checking deployment schedule..."
          
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M")
          CURRENT_TIMESTAMP=$(date -d "$CURRENT_TIME" +%s)
          
          # Default values
          SHOULD_DEPLOY="false"
          DEPLOYMENT_WINDOW="none"
          
          if [ "${{ env.DEPLOYMENT_TYPE }}" = "emergency" ]; then
            echo "🚨 Emergency deployment - bypassing schedule checks"
            SHOULD_DEPLOY="true"
            DEPLOYMENT_WINDOW="emergency"
          elif [ "${{ env.DEPLOYMENT_TYPE }}" = "maintenance-window" ]; then
            echo "🔧 Maintenance window deployment"
            # Check if we're in a valid maintenance window (weekends or after hours)
            DAY_OF_WEEK=$(date -u +%u)  # 1-7, Monday is 1
            HOUR=$(date -u +%H)
            
            # Weekend deployment (Saturday-Sunday) or after hours (22:00-06:00 UTC)
            if [ $DAY_OF_WEEK -ge 6 ] || [ $HOUR -ge 22 ] || [ $HOUR -le 6 ]; then
              echo "✅ Current time is within maintenance window"
              SHOULD_DEPLOY="true"
              DEPLOYMENT_WINDOW="maintenance"
            else
              echo "❌ Current time is outside maintenance window"
              echo "   Current: $CURRENT_TIME UTC (Day: $DAY_OF_WEEK, Hour: $HOUR)"
              echo "   Valid windows: Weekends or 22:00-06:00 UTC"
            fi
          elif [ -n "${{ env.SCHEDULE_TIME }}" ]; then
            echo "⏰ Scheduled deployment for: ${{ env.SCHEDULE_TIME }}"
            SCHEDULED_TIMESTAMP=$(date -d "${{ env.SCHEDULE_TIME }}" +%s 2>/dev/null || echo "0")
            
            if [ $SCHEDULED_TIMESTAMP -eq 0 ]; then
              echo "❌ Invalid schedule time format: ${{ env.SCHEDULE_TIME }}"
              exit 1
            fi
            
            # Allow deployment if we're within 5 minutes of scheduled time
            TIME_DIFF=$((CURRENT_TIMESTAMP - SCHEDULED_TIMESTAMP))
            if [ $TIME_DIFF -ge 0 ] && [ $TIME_DIFF -le 300 ]; then
              echo "✅ Current time matches scheduled deployment window"
              SHOULD_DEPLOY="true"
              DEPLOYMENT_WINDOW="scheduled"
            else
              echo "⏰ Deployment scheduled for later"
              echo "   Current: $CURRENT_TIME UTC"
              echo "   Scheduled: ${{ env.SCHEDULE_TIME }} UTC"
              echo "   Time difference: $TIME_DIFF seconds"
            fi
          else
            # Check for automatic deployment based on cron trigger
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "🤖 Automatic deployment check via cron"
              # Check if there are any scheduled deployments in the repository
              if [ -f ".github/deployment-schedule.json" ]; then
                SCHEDULED_DEPLOYMENTS=$(cat .github/deployment-schedule.json | jq -r ".deployments[] | select(.scheduled_time <= \"$CURRENT_TIME\") | .id" 2>/dev/null || echo "")
                if [ -n "$SCHEDULED_DEPLOYMENTS" ]; then
                  echo "✅ Found scheduled deployment(s): $SCHEDULED_DEPLOYMENTS"
                  SHOULD_DEPLOY="true"
                  DEPLOYMENT_WINDOW="auto-scheduled"
                fi
              fi
            fi
          fi
          
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          echo "deployment_window=$DEPLOYMENT_WINDOW" >> $GITHUB_OUTPUT
          
          echo "📊 Schedule validation results:"
          echo "   Should deploy: $SHOULD_DEPLOY"
          echo "   Deployment window: $DEPLOYMENT_WINDOW"

      - name: Check System Status
        if: steps.schedule-check.outputs.should_deploy == 'true'
        run: |
          echo "🔍 Checking system status before deployment..."
          
          # Check if there are any active incidents
          if [ -f ".github/incidents.json" ]; then
            ACTIVE_INCIDENTS=$(cat .github/incidents.json | jq -r '.incidents[] | select(.status == "active") | .id' 2>/dev/null || echo "")
            if [ -n "$ACTIVE_INCIDENTS" ]; then
              echo "🚨 Active incidents detected: $ACTIVE_INCIDENTS"
              echo "❌ Blocking deployment due to active incidents"
              exit 1
            fi
          fi
          
          # Check cluster health
          if [ -n "${{ secrets.KUBE_CONFIG_PRODUCTION }}" ]; then
            echo "🏥 Checking Kubernetes cluster health..."
            # This would include actual cluster health checks
            echo "✅ Cluster health check passed (placeholder)"
          fi
          
          # Check monitoring systems
          echo "📊 Checking monitoring systems availability..."
          if curl -f --max-time 10 "https://prometheus.ainflue.com/-/healthy" >/dev/null 2>&1; then
            echo "✅ Prometheus is healthy"
          else
            echo "⚠️ Prometheus health check failed"
          fi
          
          echo "✅ System status checks completed"

  maintenance-notification:
    name: 📢 Maintenance Window Notification
    runs-on: ubuntu-latest
    needs: validate-schedule
    if: needs.validate-schedule.outputs.should_deploy == 'true' && needs.validate-schedule.outputs.deployment_window == 'maintenance'
    
    steps:
      - name: Send Maintenance Start Notification
        uses: ./.github/workflows/enhanced-notifications.yml
        with:
          event_type: 'maintenance-start'
          environment: ${{ inputs.environment || 'production' }}
          service_name: 'Ainflue Platform'
          additional_info: |
            {
              "maintenance_duration": "${{ env.MAINTENANCE_DURATION }}",
              "deployment_strategy": "${{ inputs.deployment_strategy }}",
              "estimated_downtime": "5-10 minutes"
            }
        secrets:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}

  trigger-deployment:
    name: 🚀 Trigger Scheduled Deployment
    needs: [validate-schedule, maintenance-notification]
    if: needs.validate-schedule.outputs.should_deploy == 'true' && !failure()
    uses: ./.github/workflows/production-deployment.yml
    with:
      environment: ${{ inputs.environment || 'production' }}
      deployment_type: ${{ inputs.deployment_strategy || 'blue-green' }}
      skip_approval: ${{ inputs.skip_approval || (needs.validate-schedule.outputs.deployment_window == 'emergency') }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KUBE_CONFIG_PRODUCTION: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
      KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      VAULT_NAMESPACE: ${{ secrets.VAULT_NAMESPACE }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_DEPLOYMENTS: ${{ secrets.SLACK_WEBHOOK_DEPLOYMENTS }}
      SLACK_WEBHOOK_ALERTS: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBERS: ${{ secrets.TWILIO_PHONE_NUMBERS }}
      PRODUCTION_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
      STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  maintenance-complete:
    name: 📢 Maintenance Complete Notification
    runs-on: ubuntu-latest
    needs: [validate-schedule, trigger-deployment]
    if: needs.validate-schedule.outputs.deployment_window == 'maintenance' && success()
    
    steps:
      - name: Send Maintenance Complete Notification
        uses: ./.github/workflows/enhanced-notifications.yml
        with:
          event_type: 'maintenance-complete'
          environment: ${{ inputs.environment || 'production' }}
          service_name: 'Ainflue Platform'
          additional_info: |
            {
              "deployment_status": "success",
              "deployment_strategy": "${{ inputs.deployment_strategy }}",
              "total_duration": "${{ env.MAINTENANCE_DURATION }}"
            }
        secrets:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}

  deployment-skipped:
    name: ⏸️ Deployment Skipped
    runs-on: ubuntu-latest
    needs: validate-schedule
    if: needs.validate-schedule.outputs.should_deploy == 'false'
    
    steps:
      - name: Log Deployment Skip Reason
        run: |
          echo "⏸️ Deployment skipped"
          echo "Reason: Outside of scheduled deployment window"
          echo "Current time: $(date -u +"%Y-%m-%d %H:%M") UTC"
          echo "Deployment window: ${{ needs.validate-schedule.outputs.deployment_window }}"
          
          if [ "${{ env.DEPLOYMENT_TYPE }}" = "maintenance-window" ]; then
            echo "ℹ️ For maintenance window deployments, valid times are:"
            echo "   - Weekends (Saturday-Sunday)"
            echo "   - After hours (22:00-06:00 UTC)"
          fi