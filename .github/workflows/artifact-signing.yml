---
name: 🔏 Artifact Signing & Supply Chain Security

on:
  workflow_call:
  inputs:
      image_tags:
        description: 'Comma-separated list of image tags to sign'
        required: true
        type: string
      artifact_paths:
        description: 'Comma-separated list of artifact paths to sign'
        required: false
        type: string
        default: ''
      environment:
        description: 'Environment for deployment'
        required: true
        type: string
  secrets:
      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: true
      SIGNING_SECRET:
        required: false

env:
  REGISTRY: ghcr.io
  COSIGN_EXPERIMENTAL: 1

jobs:
  # Container image signing
  container-signing:
  name: 🐳 Container Image Signing
  runs-on: ubuntu-latest
  permissions:
      contents: read
      packages: read
      id-token: write
  outputs:
      signed-images: ${{ steps.sign-images.outputs.signed_images }}
      attestation-digest: ${{ steps.attest.outputs.digest }}

  steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.2'

      - name: Install Syft for SBOM generation
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container images
        id: sign-images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "Signing container images..."

          IFS=',' read -ra IMAGES <<< "${{ inputs.image_tags }}"
          SIGNED_IMAGES=""

          for image in "${IMAGES[@]}"; do
            image=$(echo $image | xargs)  # trim whitespace
            echo "Signing image: $image"

            # Sign the image
            cosign sign --yes "$image"

            # Verify the signature was created
            cosign verify "$image" --certificate-identity-regexp=".*" --certificate-oidc-issuer-regexp=".*"

            if [-n "$SIGNED_IMAGES"]; then
              SIGNED_IMAGES="$SIGNED_IMAGES,$image"
            else
              SIGNED_IMAGES="$image"
            fi

            echo "✅ Successfully signed: $image"
          done

          echo "signed_images=$SIGNED_IMAGES" >> $GITHUB_OUTPUT

      - name: Generate and sign SBOMs
        run: |
          echo "Generating and signing SBOMs..."

          IFS=',' read -ra IMAGES <<< "${{ inputs.image_tags }}"

          for image in "${IMAGES[@]}"; do
            image=$(echo $image | xargs)
            echo "Generating SBOM for: $image"

            # Generate SBOM
            syft "$image" -o spdx-json > sbom-$(echo $image | tr '/:' '-').json

            # Sign SBOM
            cosign sign-blob --yes sbom-$(echo $image | tr '/:' '-').json > sbom-$(echo $image | tr '/:' '-').json.sig

            # Attach SBOM to image
            cosign attest --yes --predicate sbom-$(echo $image | tr '/:' '-').json "$image"

            echo "✅ SBOM generated and signed for: $image"
          done

      - name: Create SLSA provenance
        id: attest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "Creating SLSA provenance attestation..."

          # Create provenance document
          cat > provenance.json << EOF
          {
            "_type": "https://in-toto.io/Statement/v0.1",
            "predicateType": "https://slsa.dev/provenance/v0.2",
            "subject": [
              $(IFS=',' read -ra IMAGES <<< "${{ inputs.image_tags }}"; for i in "${!IMAGES[@]}"; do echo "  {\"name\": \"${IMAGES[i]}\", \"digest\": {\"sha256\": \"$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGES[i]} | cut -d'@' -f2 | cut -d':' -f2)\"}}"; [ $i -lt $((${#IMAGES[@]} - 1)) ] && echo ","; done)
            ],
            "predicate": {
              "builder": {
                "id": "https://github.com/actions/runner"
              },
              "buildType": "https://github.com/actions/workflow",
              "invocation": {
                "configSource": {
                  "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                  "digest": {
                    "sha1": "${{ github.sha }}"
                  },
                  "entryPoint": "${{ github.workflow }}"
                },
                "parameters": {
                  "environment": "${{ inputs.environment }}",
                  "github_run_id": "${{ github.run_id }}",
                  "github_run_number": "${{ github.run_number }}",
                  "github_actor": "${{ github.actor }}"
                }
              },
              "metadata": {
                "buildInvocationID": "${{ github.run_id }}",
                "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "completeness": {
                  "parameters": true,
                  "environment": false,
                  "materials": false
                },
                "reproducible": false
              }
            }
          }
          EOF

          # Sign provenance
          DIGEST=$(cosign sign-blob --yes provenance.json)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

          # Attach provenance to images
          IFS=',' read -ra IMAGES <<< "${{ inputs.image_tags }}"
          for image in "${IMAGES[@]}"; do
            image=$(echo $image | xargs)
            cosign attest --yes --predicate provenance.json "$image"
            echo "✅ Provenance attached to: $image"
          done

      - name: Upload signing artifacts
        uses: actions/upload-artifact@v3
        with:
          name: signing-artifacts
          path: |
            *.json
            *.sig

  # File artifact signing
  file-signing:
  name: 📦 File Artifact Signing
  runs-on: ubuntu-latest
  if: inputs.artifact_paths != ''

  steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.2'

      - name: Download artifacts to sign
        uses: actions/download-artifact@v3

      - name: Sign file artifacts
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "Signing file artifacts..."

          IFS=',' read -ra ARTIFACTS <<< "${{ inputs.artifact_paths }}"

          for artifact in "${ARTIFACTS[@]}"; do
            artifact=$(echo $artifact | xargs)
            echo "Signing artifact: $artifact"

            if [-f "$artifact"]; then
              # Sign the file
              cosign sign-blob --yes "$artifact" > "$artifact.sig"

              # Create checksum
              sha256sum "$artifact" > "$artifact.sha256"

              # Sign the checksum too
              cosign sign-blob --yes "$artifact.sha256" > "$artifact.sha256.sig"

              echo "✅ Successfully signed: $artifact"
            else
              echo "⚠️ Artifact not found: $artifact"
            fi
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v3
        with:
          name: signed-file-artifacts
          path: |
            **/*.sig
            **/*.sha256

  # Supply chain verification
  supply-chain-verification:
  name: 🔍 Supply Chain Verification
  runs-on: ubuntu-latest
  needs: [container-signing]

  steps:
      - name: Install verification tools
        run: |
          # Install Cosign for verification
          curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64"
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign
          sudo chmod +x /usr/local/bin/cosign

          # Install Grype for vulnerability scanning
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Verify container signatures
        run: |
          echo "Verifying container signatures..."

          IFS=',' read -ra IMAGES <<< "${{ needs.container-signing.outputs.signed-images }}"

          for image in "${IMAGES[@]}"; do
            image=$(echo $image | xargs)
            echo "Verifying signature for: $image"

            # Verify signature
            if cosign verify "$image" --certificate-identity-regexp=".*" --certificate-oidc-issuer-regexp=".*"; then
              echo "✅ Signature verified for: $image"
            else
              echo "❌ Signature verification failed for: $image"
              exit 1
            fi

            # Verify attestations
            if cosign verify-attestation "$image" --certificate-identity-regexp=".*" --certificate-oidc-issuer-regexp=".*"; then
              echo "✅ Attestations verified for: $image"
            else
              echo "⚠️ Attestation verification failed for: $image"
            fi
          done

      - name: Scan for vulnerabilities
        run: |
          echo "Scanning signed images for vulnerabilities..."

          IFS=',' read -ra IMAGES <<< "${{ needs.container-signing.outputs.signed-images }}"

          for image in "${IMAGES[@]}"; do
            image=$(echo $image | xargs)
            echo "Scanning vulnerabilities in: $image"

            # Run Grype scan
            grype "$image" --output table --only-fixed

            # Generate SARIF report for GitHub Security tab
            grype "$image" --output sarif > "grype-$(echo $image | tr '/:' '-').sarif"

            echo "✅ Vulnerability scan completed for: $image"
          done

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v3
        with:
          name: vulnerability-reports
          path: "*.sarif"

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "*.sarif"

  # License compliance verification
  license-compliance:
  name: 📄 License Compliance Verification
  runs-on: ubuntu-latest
  needs: [container-signing]

  steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FOSSA CLI
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash

      - name: Install Trivy for license scanning
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy

      - name: Scan container licenses
        run: |
          echo "Scanning container images for license compliance..."

          IFS=',' read -ra IMAGES <<< "${{ needs.container-signing.outputs.signed-images }}"

          for image in "${IMAGES[@]}"; do
            image=$(echo $image | xargs)
            echo "Scanning licenses in: $image"

            # Scan with Trivy
            trivy image --format json --output "licenses-$(echo $image | tr '/:' '-').json" "$image"

            # Extract license information
            if command -v jq &> /dev/null; then
              jq '.Results[].Vulnerabilities[]?.PkgName' "licenses-$(echo $image | tr '/:' '-').json" 2>/dev/null || echo "No license data found"
            fi

            echo "✅ License scan completed for: $image"
          done

      - name: Upload license reports
        uses: actions/upload-artifact@v3
        with:
          name: license-reports
          path: "licenses-*.json"

  # Security attestation generation
  security-attestation:
  name: 🛡️ Security Attestation
  runs-on: ubuntu-latest
  needs: [container-signing, supply-chain-verification, license-compliance]
  if: always()

  steps:
      - name: Generate security attestation
        run: |
          echo "Generating comprehensive security attestation..."

          cat > security-attestation.json << EOF
          {
            "attestation_version": "1.0",
            "generation_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "environment": "${{ inputs.environment }}",
            "workflow_run": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "signed_artifacts": {
              "container_images": "${{ needs.container-signing.outputs.signed-images }}",
              "signature_digest": "${{ needs.container-signing.outputs.attestation-digest }}"
            },
            "verification_results": {
              "container_signing": "${{ needs.container-signing.result }}",
              "supply_chain_verification": "${{ needs.supply-chain-verification.result }}",
              "license_compliance": "${{ needs.license-compliance.result }}"
            },
            "security_controls": {
              "artifact_signing": true,
              "sbom_generation": true,
              "slsa_provenance": true,
              "vulnerability_scanning": true,
              "license_scanning": true
            },
            "compliance_frameworks": ["SLSA Level 2",
              "Supply Chain Security",
              "Container Security"
           ]
          }
          EOF

          echo "Security attestation generated:"
          cat security-attestation.json

      - name: Sign security attestation
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # Install Cosign if not available
          if ! command -v cosign &> /dev/null; then
            curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64"
            sudo mv cosign-linux-amd64 /usr/local/bin/cosign
            sudo chmod +x /usr/local/bin/cosign
          fi

          # Sign the attestation
          cosign sign-blob --yes security-attestation.json > security-attestation.json.sig

          echo "✅ Security attestation signed"

      - name: Upload security attestation
        uses: actions/upload-artifact@v3
        with:
          name: security-attestation
          path: |
            security-attestation.json
            security-attestation.json.sig

      - name: Verify overall security posture
        run: |
          echo "## 🛡️ Security Posture Summary"
          echo "
          **Environment:** ${{ inputs.environment }}
          **Workflow Run:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}

          ### Security Controls Status:
          - ✅ **Artifact Signing:** ${{ needs.container-signing.result }}
          - ✅ **Supply Chain Verification:** ${{ needs.supply-chain-verification.result }}
          - ✅ **License Compliance:** ${{ needs.license-compliance.result }}

          ### Signed Artifacts:
          - **Container Images:** ${{ needs.container-signing.outputs.signed-images }}

          ### Compliance:
          - SLSA Level 2 ✅
          - Supply Chain Security ✅
          - Container Security ✅
          "

          # Determine overall security status
          if ["${{ needs.container-signing.result }}" = "success"] && \
             ["${{ needs.supply-chain-verification.result }}" = "success"]; then
            echo "🎉 **Overall Security Status: PASSED**"
            echo "All security controls are in place and functioning correctly."
          else
            echo "⚠️ **Overall Security Status: NEEDS ATTENTION**"
            echo "Some security controls failed. Review the failed jobs before deployment."
            exit 1
          fi
