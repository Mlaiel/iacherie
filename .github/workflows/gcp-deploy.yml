name: 🚀 Deploy to Google Cloud (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  CLUSTER_NAME: iacherie-cluster
  IMAGE_NAME: iacherie-backend

jobs:
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true
      
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker
      
      - name: Extract Metadata
        id: meta
        run: |
          IMAGE_TAG="gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest"
          echo "tags=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "latest=$IMAGE_LATEST" >> $GITHUB_OUTPUT
      
      - name: Build Docker Image
        id: build
        run: |
          docker build -f Dockerfile.production \
            -t ${{ steps.meta.outputs.tags }} \
            -t ${{ steps.meta.outputs.latest }} \
            --label "commit=${{ github.sha }}" \
            --label "branch=${{ github.ref_name }}" \
            --label "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .
      
      - name: Push to Google Container Registry
        run: |
          docker push ${{ steps.meta.outputs.tags }}
          docker push ${{ steps.meta.outputs.latest }}
          
          # Get digest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.meta.outputs.tags }} | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom.spdx.json
      
      - name: Upload SBOM
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.spdx.json

  security-scan:
    name: 🔍 Security Scan
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Configure Docker
        run: gcloud auth configure-docker
      
      - name: Pull Image
        run: docker pull ${{ needs.build.outputs.image_tag }}
      
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    name: 🚀 Deploy to GKE
    needs: [build, security-scan]
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
      
      - name: Deploy to GKE
        run: |
          # Update image in deployment
          kubectl set image deployment/stable-diffusion-api \
            backend=${{ needs.build.outputs.image_tag }} \
            -n iacherie
          
          # Add deployment annotations
          kubectl annotate deployment stable-diffusion-api \
            kubernetes.io/change-cause="GitHub Actions: commit ${{ github.sha }}" \
            deployment.kubernetes.io/revision="$(date +%s)" \
            deployment.kubernetes.io/deployed-by="${{ github.actor }}" \
            deployment.kubernetes.io/commit-sha="${{ github.sha }}" \
            deployment.kubernetes.io/image-tag="${{ needs.build.outputs.image_tag }}" \
            -n iacherie --overwrite
      
      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/stable-diffusion-api \
            -n iacherie \
            --timeout=10m
      
      - name: Verify Deployment
        run: |
          echo "🔍 Checking pods..."
          kubectl get pods -n iacherie -l app=stable-diffusion
          
          echo ""
          echo "🔍 Checking services..."
          kubectl get svc -n iacherie stable-diffusion-service
          
          echo ""
          echo "🔍 Checking GPU allocation..."
          kubectl describe node -l workload=gpu | grep -A 10 "Allocated resources"
      
      - name: Health Check
        run: |
          # Get ingress IP
          INGRESS_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          echo "🔍 Testing health endpoint..."
          MAX_ATTEMPTS=20
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            if curl -f -H "Host: api.iacherie.com" http://$INGRESS_IP/health --max-time 30; then
              echo "✅ Health check passed!"
              break
            else
              if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "❌ Health check failed after $MAX_ATTEMPTS attempts"
                exit 1
              fi
              sleep 15
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
          done
      
      - name: Test GPU Availability
        run: |
          POD=$(kubectl get pod -n iacherie -l app=stable-diffusion -o jsonpath='{.items[0].metadata.name}')
          
          echo "🎮 Testing GPU in pod $POD..."
          kubectl exec -n iacherie $POD -- python3 -c "
          import torch
          print('CUDA available:', torch.cuda.is_available())
          if torch.cuda.is_available():
              print('GPU:', torch.cuda.get_device_name(0))
              print('GPU Count:', torch.cuda.device_count())
          "
      
      - name: Update Deployment Status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          kubectl annotate deployment stable-diffusion-api \
            deployment.kubernetes.io/last-deployment-status="$STATUS" \
            deployment.kubernetes.io/last-deployment-time="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -n iacherie --overwrite

  notify:
    name: 📢 Send Notifications
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Notify Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy.result }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          text: |
            🚀 *Déploiement GCP ${{ needs.deploy.result }}*
            
            📦 *Image:* `${{ needs.build.outputs.image_tag }}`
            🏷️ *Commit:* `${{ github.sha }}`
            👤 *Par:* ${{ github.actor }}
            🌍 *URLs:*
            - https://api.iacherie.com
            - https://api.iacherie.eu
            - https://api.iacherie.de
            - https://api.iacherie.online
            
            🔗 [Voir le workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          fields: repo,message,commit,author,action,eventName,ref,workflow
      
      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          environment-url: https://api.iacherie.com

  rollback:
    name: 🔄 Rollback on Failure
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
      
      - name: Execute Rollback
        run: |
          echo "🚨 Rollback triggered due to deployment failure"
          
          # Rollback to previous revision
          kubectl rollout undo deployment/stable-diffusion-api -n iacherie
          
          # Wait for rollback to complete
          kubectl rollout status deployment/stable-diffusion-api -n iacherie --timeout=5m
          
          echo "✅ Rollback completed"
      
      - name: Verify Rollback
        run: |
          POD=$(kubectl get pod -n iacherie -l app=stable-diffusion -o jsonpath='{.items[0].metadata.name}')
          
          # Health check
          INGRESS_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          if curl -f -H "Host: api.iacherie.com" http://$INGRESS_IP/health --max-time 30; then
            echo "✅ Rollback health check passed"
          else
            echo "❌ Rollback health check failed"
            exit 1
          fi
      
      - name: Notify Rollback
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚨 *ROLLBACK AUTOMATIQUE*",
              "attachments": [{
                "color": "warning",
                "text": "Déploiement échoué, rollback vers version précédente effectué.",
                "fields": [
                  {
                    "title": "Commit échoué",
                    "value": "${{ github.sha }}",
                    "short": true
                  },
                  {
                    "title": "Par",
                    "value": "${{ github.actor }}",
                    "short": true
                  }
                ]
              }]
            }
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
