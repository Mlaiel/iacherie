---
name: 📱 Mobile CI Pipeline

on:
  push:
  branches: [main, develop]
  paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yaml'
  pull_request:
  branches: [main, develop]
  paths:
      - 'mobile/**'

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.12'
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.16.0'

jobs:
  # Mobile Backend Services CI
  mobile-backend:
  name: 🐍 Mobile Backend Services
  runs-on: ubuntu-latest
  timeout-minutes: 20

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 📦 Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-mobile-python-${{ hashFiles('mobile/**/*.py', '**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-mobile-python-

    - name: 🔧 Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 mypy pytest pytest-cov
        if [-f requirements.txt]; then pip install -r requirements.txt; fi

    - name: 🎨 Python code formatting (Black)
      run: |
        black --check --diff mobile/ || exit 1

    - name: 🔍 Python linting (Flake8)
      run: |
        flake8 --max-line-length=120 --extend-ignore=E203,W503 mobile/

    - name: 🏷️ Python type checking (MyPy)
      run: |
        mypy --ignore-missing-imports mobile/ || true

    - name: 🧪 Run Python mobile backend tests
      run: |
        if [-d "mobile/tests"]; then
          pytest mobile/tests/ -v --cov=mobile --cov-report=xml || true
        else
          echo "No mobile backend tests found"
        fi

  # React Native CI
  react-native:
  name: ⚛️ React Native
  runs-on: ubuntu-latest
  timeout-minutes: 25

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: ☕ Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: 📦 Cache React Native dependencies
      uses: actions/cache@v3
      with:
        path: |
          mobile/react_native/node_modules
          ~/.npm
        key: ${{ runner.os }}-rn-${{ hashFiles('mobile/react_native/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-rn-

    - name: 🔧 Install React Native dependencies
      working-directory: mobile/react_native
      run: |
        if [-f "package.json"]; then
          npm ci --prefer-offline --no-audit
        else
          echo "No React Native package.json found, skipping..."
        fi

    - name: 🔍 React Native linting
      working-directory: mobile/react_native
      run: |
        if [-f "package.json"] && npm run lint --if-present; then
          npm run lint
        else
          echo "No React Native linting configured"
        fi

    - name: 🏷️ TypeScript type checking
      working-directory: mobile/react_native
      run: |
        if [-f "tsconfig.json"]; then
          npx tsc --noEmit
        else
          echo "No TypeScript configuration found"
        fi

    - name: 🧪 React Native tests
      working-directory: mobile/react_native
      run: |
        if [-f "package.json"] && npm run test --if-present; then
          npm run test -- --coverage --watchAll=false
        else
          echo "No React Native tests configured"
        fi

    - name: 📊 Upload React Native test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: react-native-test-results
        path: |
          mobile/react_native/coverage/
          mobile/react_native/test-results.xml

  # Android Build & Tests
  android-build:
  name: 🤖 Android Build
  runs-on: ubuntu-latest
  timeout-minutes: 45

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ☕ Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: 📦 Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: 📦 Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: 🔧 Install dependencies
      working-directory: mobile
      run: |
        if [-d "react_native"] && [-f "react_native/package.json"]; then
          cd react_native && npm ci --prefer-offline --no-audit
        fi

    - name: 🏗️ Build Android APK
      working-directory: mobile/android
      run: |
        if [-f "gradlew"]; then
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          echo "No Android project found, skipping build..."
        fi

    - name: 🧪 Run Android unit tests
      working-directory: mobile/android
      run: |
        if [-f "gradlew"]; then
          ./gradlew testDebugUnitTest --no-daemon || true
        else
          echo "No Android tests to run"
        fi

    - name: 📊 Upload Android build artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: android-build-artifacts
        path: |
          mobile/android/app/build/outputs/apk/debug/
          mobile/android/app/build/test-results/

  # iOS Build & Tests (macOS runner required)
  ios-build:
  name: 🍎 iOS Build
  runs-on: macos-latest
  timeout-minutes: 45
  if: github.event_name == 'pull_request'

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 🍎 Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: 📦 Cache CocoaPods
      uses: actions/cache@v3
      with:
        path: mobile/ios/Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('mobile/ios/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: 🔧 Install dependencies
      working-directory: mobile
      run: |
        if [-d "react_native"] && [-f "react_native/package.json"]; then
          cd react_native && npm ci --prefer-offline --no-audit
        fi

    - name: 📦 Install CocoaPods
      working-directory: mobile/ios
      run: |
        if [-f "Podfile"]; then
          pod install --deployment
        else
          echo "No iOS project found, skipping..."
        fi

    - name: 🏗️ Build iOS app
      working-directory: mobile/ios
      run: |
        if [-f "*.xcworkspace"] || [-f "*.xcodeproj"]; then
          xcodebuild -workspace *.xcworkspace -scheme * -configuration Debug -sdk iphonesimulator -derivedDataPath build/ || true
        else
          echo "No iOS project found, skipping build..."
        fi

    - name: 🧪 Run iOS tests
      working-directory: mobile/ios
      run: |
        if [-f "*.xcworkspace"] || [-f "*.xcodeproj"]; then
          xcodebuild test -workspace *.xcworkspace -scheme * -configuration Debug -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14' || true
        else
          echo "No iOS tests to run"
        fi

    - name: 📊 Upload iOS build artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ios-build-artifacts
        path: |
          mobile/ios/build/
          mobile/ios/test-results/

  # Flutter Build & Tests (if Flutter is used)
  flutter-build:
  name: 💙 Flutter Build
  runs-on: ubuntu-latest
  timeout-minutes: 30
  if: hashFiles('mobile/**/pubspec.yaml') != ''

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 💙 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: 📦 Cache Flutter dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.pub-cache
          mobile/flutter/.packages
        key: ${{ runner.os }}-flutter-${{ hashFiles('mobile/**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-

    - name: 🔧 Install Flutter dependencies
      working-directory: mobile
      run: |
        find . -name "pubspec.yaml" -execdir flutter pub get \;

    - name: 🔍 Flutter analyze
      working-directory: mobile
      run: |
        find . -name "pubspec.yaml" -execdir flutter analyze \;

    - name: 🧪 Flutter tests
      working-directory: mobile
      run: |
        find . -name "pubspec.yaml" -execdir flutter test --coverage \;

    - name: 🏗️ Flutter build APK
      working-directory: mobile
      run: |
        find . -name "pubspec.yaml" -execdir flutter build apk --debug \;

    - name: 📊 Upload Flutter artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: flutter-build-artifacts
        path: |
          mobile/build/app/outputs/flutter-apk/
          mobile/coverage/

  # Mobile Security & Performance
  mobile-security:
  name: 🔒 Mobile Security
  runs-on: ubuntu-latest
  timeout-minutes: 15

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔍 Scan for sensitive data
      run: |
        echo "Scanning mobile directory for sensitive data..."
        find mobile/ -type f \( -name "*.key" -o -name "*.pem" -o -name "*.p12" -o -name "*.keystore" \) | tee sensitive-files.txt

        # Check for hardcoded secrets in source files
        grep -r -i "api[_-]key\|secret\|password\|token" mobile/ --include="*.js" --include="*.ts" --include="*.py" --include="*.java" --include="*.swift" --include="*.dart" | grep -v "test" | head -20 > potential-secrets.txt || true

        if [-s sensitive-files.txt]; then
          echo "⚠️ Sensitive files detected!"
          cat sensitive-files.txt
        fi

    - name: 🔒 Mobile app security scan
      run: |
        echo "Running mobile security checks..."
        # Check for debug flags in production builds
        find mobile/ -name "*.js" -o -name "*.ts" -o -name "*.py" | xargs grep -l "__DEV__\|DEBUG\|console.log" | head -10 > debug-code.txt || true

        # Check permissions in Android manifest
        if [-f "mobile/android/app/src/main/AndroidManifest.xml"]; then
          grep "uses-permission" mobile/android/app/src/main/AndroidManifest.xml > android-permissions.txt || true
        fi

    - name: 📊 Upload security scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: mobile-security-scan
        path: |
          sensitive-files.txt
          potential-secrets.txt
          debug-code.txt
          android-permissions.txt

  # Mobile Performance Tests
  mobile-performance:
  name: ⚡ Mobile Performance
  runs-on: ubuntu-latest
  timeout-minutes: 20
  if: github.event_name == 'pull_request'

  steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: ⚡ Mobile bundle size analysis
      working-directory: mobile
      run: |
        if [-d "react_native"] && [-f "react_native/package.json"]; then
          cd react_native
          npm ci --prefer-offline --no-audit

          # Analyze bundle size if Metro bundler is configured
          if command -v npx && npx metro --help > /dev/null 2>&1; then
            npx metro build --platform android --dev false --minify true --bundle-output bundle-analysis.js --assets-dest assets/ || true
            ls -la bundle-analysis.js | tee bundle-size.txt || true
          fi
        fi

    - name: 📊 Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: mobile-performance-results
        path: |
          mobile/react_native/bundle-size.txt
          mobile/react_native/bundle-analysis.js

  # Summary
  mobile-summary:
  name: 📋 Mobile CI Summary
  runs-on: ubuntu-latest
  needs: [mobile-backend, react-native, android-build, ios-build, flutter-build, mobile-security, mobile-performance]
  if: always()

  steps:
    - name: 📊 Check results
      run: |
        echo "Mobile CI Pipeline Results:"
        echo "Mobile Backend: ${{ needs.mobile-backend.result }}"
        echo "React Native: ${{ needs.react-native.result }}"
        echo "Android Build: ${{ needs.android-build.result }}"
        echo "iOS Build: ${{ needs.ios-build.result }}"
        echo "Flutter Build: ${{ needs.flutter-build.result }}"
        echo "Security: ${{ needs.mobile-security.result }}"
        echo "Performance: ${{ needs.mobile-performance.result }}"

        # Only fail on critical components
        if [["${{ needs.mobile-backend.result }}" == "failure" || "${{ needs.react-native.result }}" == "failure" || "${{ needs.android-build.result }}" == "failure"]]; then
          echo "❌ Mobile CI failed - critical issues detected"
          exit 1
        else
          echo "✅ Mobile CI completed successfully"
        fi
