version: '3.8'

x-common-config: &common-config
  environment:
    - ENVIRONMENT=${ENVIRONMENT:-production}
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    - USER_TYPE=photographer
    - REDIS_HOST=redis-master
    - POSTGRES_HOST=postgres-master
  restart: unless-stopped
  networks:
    - photographer-network
    - backend-network
  logging:
    driver: "json-file"
    options:
      max-size: "200m"
      max-file: "5"

services:
  # =============================================================================
  # PROTECTION SERVICES FOR PHOTOGRAPHERS
  # =============================================================================
  photographer-protection-service:
    extends:
      file: docker/protection/docker-compose.protection.yml
      service: protection-service
    <<: *common-config
    environment:
      <<: *common-config
      IMAGE_FINGERPRINTING: true
      VISUAL_WATERMARKING: enabled
      METADATA_PROTECTION: true

  photographer-watermarking-service:
    extends:
      file: docker/protection/docker-compose.protection.yml
      service: watermarking-service
    <<: *common-config
    environment:
      <<: *common-config
      WATERMARK_TYPES: visible,invisible,metadata
      BATCH_PROCESSING: true
      IMAGE_FORMATS: jpg,png,tiff,raw

  # =============================================================================
  # SEO OPTIMIZATION FOR PHOTOGRAPHERS
  # =============================================================================
  photographer-seo-optimizer:
    image: ainflue/seo-optimizer:latest
    <<: *common-config
    ports:
      - "8050:8050"
    environment:
      <<: *common-config
      PHOTOGRAPHY_SEO: true
      IMAGE_ALT_GENERATION: true
      PORTFOLIO_OPTIMIZATION: enabled
    volumes:
      - photographer_seo:/app/storage

  photographer-metadata-enricher:
    image: ainflue/metadata-enricher:latest
    <<: *common-config
    environment:
      <<: *common-config
      EXIF_ENHANCEMENT: true
      KEYWORD_GENERATION: automated
      GEO_TAGGING: enabled

  # =============================================================================
  # MONETIZATION FOR PHOTOGRAPHERS
  # =============================================================================
  photographer-licensing-engine:
    extends:
      file: docker/monetization/docker-compose.monetization.yml
      service: licensing-engine
    <<: *common-config
    environment:
      <<: *common-config
      PHOTOGRAPHY_LICENSING: true
      STOCK_PHOTO_INTEGRATION: enabled
      USAGE_RIGHTS_MANAGEMENT: true

  photographer-merchandising-hub:
    extends:
      file: docker/monetization/docker-compose.monetization.yml
      service: merchandising-hub
    <<: *common-config
    environment:
      <<: *common-config
      PRINT_ON_DEMAND: true
      PHOTO_PRODUCTS: prints,canvas,books,calendars
      QUALITY_CONTROL: automated

  # =============================================================================
  # DISTRIBUTION FOR PHOTOGRAPHERS
  # =============================================================================
  photographer-distribution-hub:
    image: ainflue/distribution-hub:latest
    <<: *common-config
    ports:
      - "8060:8060"
    environment:
      <<: *common-config
      PHOTOGRAPHY_DISTRIBUTION: true
      PLATFORMS: instagram,flickr,500px,shutterstock,adobe_stock
      IMAGE_OPTIMIZATION: platform_specific
    volumes:
      - photographer_distribution:/app/storage

volumes:
  photographer_seo:
    driver: local
  photographer_distribution:
    driver: local

networks:
  photographer-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.41.0.0/24
  backend-network:
    external: true