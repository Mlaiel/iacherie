## 🔧 **Usage Instructions**

### **1. Prerequisites Installation**
```bash
# Install required tools
kubectl version --client
helm version
terraform version
ansible --version
```

### **2. Infrastructure Deployment**
```bash
# Deploy Terraform infrastructure
terraform init
terraform plan -var-file="production.tfvars"
terraform apply -var-file="production.tfvars"

# Deploy Kubernetes manifests
kubectl apply -f kubernetes-namespace.yml
kubectl apply -f kubernetes-deployment.yml
kubectl apply -f kubernetes-service.yml
kubectl apply -f kubernetes-ingress.yml

# Deploy with Helm
helm install artifacts-module ./helm-chart -f values-production.yml
```

### **3. Monitoring Setup**
```bash
# Deploy monitoring stack
kubectl apply -f prometheus-config.yml
kubectl apply -f grafana-dashboards.yml
kubectl apply -f elasticsearch-config.yml
```

### **4. Configuration Management**
```bash
# Run Ansible playbook
ansible-playbook -i inventory/production ansible-playbook.yml
```

