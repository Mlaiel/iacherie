## 🛡️ **Security Configuration**

### **Network Security**
```yaml
network_policies:
  default_deny: true
  allowed_ingress:
    - from_namespaces: ["ainflue-ingress"]
    - from_namespaces: ["ainflue-monitoring"]
  allowed_egress:
    - to_ports: [443, 53]
    - to_services: ["database", "cache"]
```

### **Pod Security**
```yaml
pod_security_standards:
  level: "restricted"
  security_context:
    run_as_non_root: true
    run_as_user: 1000
    fs_group: 2000
    seccomp_profile: "RuntimeDefault"
    capabilities:
      drop: ["ALL"]
```

