# GitHub Actions Security Scanning Workflow
# ========================================
# 
# Enterprise security scanning with:
# - SAST (Static Application Security Testing)
# - DAST (Dynamic Application Security Testing)
# - Dependency vulnerability scanning
# - Container image security scanning
# - Infrastructure as Code security
# - Secrets detection
# - License compliance checking
# - Security policy enforcement
#
# Author: Fahed Mlaiel (mlaiel@live.de)
# DevOps Engineer + Security Specialist

name: 🔒 Security Scanning Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily security scans at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - sast
          - dast
          - dependencies
          - containers
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Job 1: Pre-security validation
  pre-security-checks:
    name: 🔍 Pre-Security Validation
    runs-on: ubuntu-latest
    outputs:
      should-run-sast: ${{ steps.check-changes.outputs.backend-changed }}
      should-run-dast: ${{ steps.check-changes.outputs.api-changed }}
      should-run-container: ${{ steps.check-changes.outputs.docker-changed }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check File Changes
        id: check-changes
        run: |
          if git diff --name-only HEAD~1 | grep -E '\.(py|js|ts|tsx|dockerfile|yml|yaml)$'; then
            echo "code-changed=true" >> $GITHUB_OUTPUT
          fi
          
          if git diff --name-only HEAD~1 | grep -E '\.(py|sql)$'; then
            echo "backend-changed=true" >> $GITHUB_OUTPUT
          fi
          
          if git diff --name-only HEAD~1 | grep -E 'api/|backend/'; then
            echo "api-changed=true" >> $GITHUB_OUTPUT
          fi
          
          if git diff --name-only HEAD~1 | grep -E 'Dockerfile|docker-compose'; then
            echo "docker-changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Security Scan Summary
        run: |
          echo "### 🔒 Security Scan Plan" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | ${{ steps.check-changes.outputs.backend-changed == 'true' && '✅ Enabled' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST | ${{ steps.check-changes.outputs.api-changed == 'true' && '✅ Enabled' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container | ${{ steps.check-changes.outputs.docker-changed == 'true' && '✅ Enabled' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY

  # Job 2: Secrets Detection
  secrets-detection:
    name: 🕵️ Secrets Detection
    runs-on: ubuntu-latest
    needs: pre-security-checks
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 GitLeaks Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: 🕵️ TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: 📊 Upload Secrets Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-results
          path: |
            gitleaks-report.json
            trufflehog-report.json
          retention-days: 30

  # Job 3: SAST (Static Application Security Testing)
  sast-scan:
    name: 🔬 SAST Security Scan
    runs-on: ubuntu-latest
    needs: [pre-security-checks, secrets-detection]
    if: needs.pre-security-checks.outputs.should-run-sast == 'true' || github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'sast'
    
    strategy:
      matrix:
        language: [python, javascript, typescript]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Python Dependencies
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety semgrep
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔍 Bandit Security Scan (Python)
        if: matrix.language == 'python'
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f txt

      - name: 🛡️ Safety Vulnerability Check (Python)
        if: matrix.language == 'python'
        run: |
          safety check --json --output safety-report.json || true
          safety check

      - name: 🔬 Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/dockerfile
            p/kubernetes
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: 🔧 Setup Node.js
        if: matrix.language == 'javascript' || matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔍 ESLint Security Scan
        if: matrix.language == 'javascript' || matrix.language == 'typescript'
        run: |
          npm install -g eslint @typescript-eslint/parser eslint-plugin-security
          eslint . --ext .js,.ts,.tsx --format json --output-file eslint-security-report.json || true

      - name: 📊 Upload SAST Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results-${{ matrix.language }}
          path: |
            bandit-report.json
            safety-report.json
            eslint-security-report.json
            semgrep-report.json
          retention-days: 30

  # Job 4: Dependency Vulnerability Scanning
  dependency-scan:
    name: 📦 Dependency Security Scan
    runs-on: ubuntu-latest
    needs: secrets-detection
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 GitHub Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔍 Python Dependency Check
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit cyclone-core
          
          # Generate SBOM
          pip-audit --format=json --output=python-dependencies-audit.json || true
          
          # Check for known vulnerabilities
          pip-audit --desc --format=json

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔍 NPM Audit
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=moderate --json > npm-audit-report.json || true
            npm audit --audit-level=moderate
          fi

      - name: 🔍 Yarn Audit
        run: |
          if [ -f yarn.lock ]; then
            yarn audit --level moderate --json > yarn-audit-report.json || true
            yarn audit --level moderate
          fi

      - name: 📊 Upload Dependency Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-results
          path: |
            python-dependencies-audit.json
            npm-audit-report.json
            yarn-audit-report.json
          retention-days: 30

  # Job 5: Container Security Scanning
  container-security:
    name: 🐳 Container Security Scan
    runs-on: ubuntu-latest
    needs: [pre-security-checks, secrets-detection]
    if: needs.pre-security-checks.outputs.should-run-container == 'true' || github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'containers'
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Images
        run: |
          if [ -f Dockerfile ]; then
            docker build -t test-image:latest .
          fi
          
          if [ -f docker/backend/Dockerfile ]; then
            docker build -t backend-image:latest -f docker/backend/Dockerfile .
          fi
          
          if [ -f docker/frontend/Dockerfile ]; then
            docker build -t frontend-image:latest -f docker/frontend/Dockerfile .
          fi

      - name: 🛡️ Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'test-image:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 🔍 Grype Container Scan
        uses: anchore/scan-action@v3
        with:
          image: 'test-image:latest'
          fail-build: false
          output-format: json
          output-file: grype-results.json

      - name: 🔍 Docker Scout Scan
        if: github.event_name != 'pull_request'
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh
          docker scout cves test-image:latest --format json --output docker-scout-results.json || true

      - name: 📊 Upload Container Security Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-results
          path: |
            trivy-results.sarif
            grype-results.json
            docker-scout-results.json
          retention-days: 30

      - name: 📊 Upload to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif

  # Job 6: Infrastructure as Code Security
  iac-security:
    name: 🏗️ Infrastructure Security Scan
    runs-on: ubuntu-latest
    needs: secrets-detection
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,dockerfile,kubernetes
          output_format: json
          output_file_path: checkov-report.json

      - name: 🔍 TFSec Terraform Scan
        if: hashFiles('**/*.tf') != ''
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          additional_args: '--format json --out tfsec-results.json'

      - name: 🔍 Terrascan IaC Scan
        if: hashFiles('**/*.tf', '**/*.yml', '**/*.yaml') != ''
        run: |
          curl -L "$(curl -s https://api.github.com/repos/tenable/terrascan/releases/latest | grep -o -E "https://.+?_Linux_x86_64.tar.gz")" > terrascan.tar.gz
          tar -xf terrascan.tar.gz terrascan && rm terrascan.tar.gz
          install terrascan /usr/local/bin && rm terrascan
          terrascan scan -t terraform -f json -o terrascan-results.json || true

      - name: 📊 Upload IaC Security Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-security-results
          path: |
            checkov-report.json
            tfsec-results.json
            terrascan-results.json
          retention-days: 30

  # Job 7: DAST (Dynamic Application Security Testing)
  dast-scan:
    name: 🌐 DAST Security Scan
    runs-on: ubuntu-latest
    needs: [pre-security-checks, sast-scan]
    if: needs.pre-security-checks.outputs.should-run-dast == 'true' || github.event.inputs.scan_type == 'full' || github.event.inputs.scan_type == 'dast'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🚀 Start Application
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
          # Start the application in background
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 30
          
          # Wait for application to be ready
          timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      - name: 🔍 OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -m 10 -T 60'

      - name: 🔍 OWASP ZAP Full Scan
        if: github.ref == 'refs/heads/main'
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -m 10 -T 180'

      - name: 📊 Upload DAST Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-results
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30

  # Job 8: License Compliance
  license-compliance:
    name: 📄 License Compliance Check
    runs-on: ubuntu-latest
    needs: secrets-detection
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📄 Python License Check
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
          pip-licenses --format=json --output-file=python-licenses.json
          pip-licenses --format=table

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📄 NPM License Check
        run: |
          npm install -g license-checker
          if [ -f package.json ]; then
            npm install
            license-checker --json --out npm-licenses.json
            license-checker --summary
          fi

      - name: 📊 Upload License Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-compliance-results
          path: |
            python-licenses.json
            npm-licenses.json
          retention-days: 30

  # Job 9: Security Report Generation
  security-report:
    name: 📊 Security Report Generation
    runs-on: ubuntu-latest
    needs: [sast-scan, dependency-scan, container-security, iac-security, dast-scan, license-compliance]
    if: always()
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-results

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📊 Generate Security Report
        run: |
          python -m pip install jinja2 markdown2
          
          cat > generate_report.py << 'EOF'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          
          def collect_results():
              results = {
                  'scan_date': datetime.now().isoformat(),
                  'repository': '${{ github.repository }}',
                  'commit': '${{ github.sha }}',
                  'branch': '${{ github.ref_name }}',
                  'secrets': {'status': 'completed', 'issues': []},
                  'sast': {'status': 'completed', 'issues': []},
                  'dependencies': {'status': 'completed', 'issues': []},
                  'containers': {'status': 'completed', 'issues': []},
                  'iac': {'status': 'completed', 'issues': []},
                  'dast': {'status': 'completed', 'issues': []},
                  'licenses': {'status': 'completed', 'issues': []}
              }
              
              # Process results from artifacts
              results_dir = Path('security-results')
              if results_dir.exists():
                  for scan_dir in results_dir.iterdir():
                      if scan_dir.is_dir():
                          print(f"Processing {scan_dir.name}")
                          for file in scan_dir.glob('*.json'):
                              try:
                                  with open(file) as f:
                                      data = json.load(f)
                                      # Process scan results based on file name
                                      if 'bandit' in file.name:
                                          results['sast']['issues'].extend(data.get('results', []))
                                      elif 'safety' in file.name:
                                          results['dependencies']['issues'].extend(data.get('vulnerabilities', []))
                                      elif 'trivy' in file.name:
                                          results['containers']['issues'].extend(data.get('Results', []))
                              except Exception as e:
                                  print(f"Error processing {file}: {e}")
              
              return results
          
          def generate_html_report(results):
              html_template = '''
              <!DOCTYPE html>
              <html>
              <head>
                  <title>IA Chérie Security Scan Report</title>
                  <style>
                      body { font-family: Arial, sans-serif; margin: 40px; }
                      .header { background: #1f2937; color: white; padding: 20px; border-radius: 8px; }
                      .section { margin: 20px 0; padding: 15px; border: 1px solid #e5e7eb; border-radius: 8px; }
                      .success { background-color: #f0fdf4; border-color: #16a34a; }
                      .warning { background-color: #fffbeb; border-color: #f59e0b; }
                      .error { background-color: #fef2f2; border-color: #ef4444; }
                      .footer { text-align: center; color: #6b7280; margin-top: 40px; }
                  </style>
              </head>
              <body>
                  <div class="header">
                      <h1>🔒 IA Chérie Security Scan Report</h1>
                      <p><strong>Repository:</strong> {{ results.repository }}</p>
                      <p><strong>Branch:</strong> {{ results.branch }}</p>
                      <p><strong>Commit:</strong> {{ results.commit[:8] }}</p>
                      <p><strong>Scan Date:</strong> {{ results.scan_date }}</p>
                  </div>
                  
                  <div class="section success">
                      <h2>✅ Scan Summary</h2>
                      <ul>
                          <li><strong>Secrets Detection:</strong> {{ results.secrets.status }}</li>
                          <li><strong>SAST:</strong> {{ results.sast.status }}</li>
                          <li><strong>Dependencies:</strong> {{ results.dependencies.status }}</li>
                          <li><strong>Containers:</strong> {{ results.containers.status }}</li>
                          <li><strong>Infrastructure:</strong> {{ results.iac.status }}</li>
                          <li><strong>DAST:</strong> {{ results.dast.status }}</li>
                          <li><strong>Licenses:</strong> {{ results.licenses.status }}</li>
                      </ul>
                  </div>
                  
                  <div class="footer">
                      <p>© 2025 Fahed Mlaiel - IA Chérie Security Pipeline</p>
                      <p>⚠️ Propriété intellectuelle protégée - Utilisation commerciale interdite</p>
                  </div>
              </body>
              </html>
              '''
              
              # Simple template replacement
              html = html_template.replace('{{ results.repository }}', results['repository'])
              html = html.replace('{{ results.branch }}', results['branch'])
              html = html.replace('{{ results.commit[:8] }}', results['commit'][:8])
              html = html.replace('{{ results.scan_date }}', results['scan_date'])
              html = html.replace('{{ results.secrets.status }}', results['secrets']['status'])
              html = html.replace('{{ results.sast.status }}', results['sast']['status'])
              html = html.replace('{{ results.dependencies.status }}', results['dependencies']['status'])
              html = html.replace('{{ results.containers.status }}', results['containers']['status'])
              html = html.replace('{{ results.iac.status }}', results['iac']['status'])
              html = html.replace('{{ results.dast.status }}', results['dast']['status'])
              html = html.replace('{{ results.licenses.status }}', results['licenses']['status'])
              
              return html
          
          # Generate report
          results = collect_results()
          
          # Save JSON report
          with open('security-report.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          # Save HTML report
          html_report = generate_html_report(results)
          with open('security-report.html', 'w') as f:
              f.write(html_report)
          
          print("Security report generated successfully!")
          EOF
          
          python generate_report.py

      - name: 📊 Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-report.json
            security-report.html
          retention-days: 90

      - name: 📊 Comment PR with Security Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = `## 🔒 Security Scan Results\n\n`;
            comment += `**Scan completed at:** ${new Date().toISOString()}\n`;
            comment += `**Commit:** \`${{ github.sha }}\`\n\n`;
            
            comment += `| Security Check | Status |\n`;
            comment += `|---|---|\n`;
            comment += `| 🕵️ Secrets Detection | ✅ Completed |\n`;
            comment += `| 🔬 SAST | ✅ Completed |\n`;
            comment += `| 📦 Dependencies | ✅ Completed |\n`;
            comment += `| 🐳 Containers | ✅ Completed |\n`;
            comment += `| 🏗️ Infrastructure | ✅ Completed |\n`;
            comment += `| 🌐 DAST | ✅ Completed |\n`;
            comment += `| 📄 Licenses | ✅ Completed |\n\n`;
            
            comment += `---\n`;
            comment += `**⚠️ Propriété intellectuelle © 2025 Fahed Mlaiel**\n`;
            comment += `Contact: mlaiel@live.de\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Job 10: Security Policy Enforcement
  security-policy:
    name: 🛡️ Security Policy Enforcement
    runs-on: ubuntu-latest
    needs: security-report
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Download Security Report
        uses: actions/download-artifact@v4
        with:
          name: security-report

      - name: 🛡️ Enforce Security Policies
        run: |
          echo "🛡️ Enforcing security policies..."
          
          # Check if security report exists
          if [ -f security-report.json ]; then
            echo "✅ Security report found"
            
            # In a real implementation, you would:
            # 1. Parse the security report
            # 2. Check against security policies
            # 3. Block deployment if critical issues found
            # 4. Send notifications to security team
            
            echo "📊 Security policy check completed"
          else
            echo "❌ Security report not found"
            exit 1
          fi

      - name: 📧 Notify Security Team
        if: failure()
        run: |
          echo "🚨 Security policy violations detected"
          echo "Notifying security team..."
          # In production, send notifications via Slack, email, etc.

  # Job 11: Security Metrics Collection
  security-metrics:
    name: 📈 Security Metrics Collection
    runs-on: ubuntu-latest
    needs: security-report
    if: always()
    
    steps:
      - name: 📥 Download Security Report
        uses: actions/download-artifact@v4
        with:
          name: security-report

      - name: 📈 Collect Security Metrics
        run: |
