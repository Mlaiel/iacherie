# ⚡ Redis RBAC Permissions Configuration - IA Chérie Enterprise
# © 2025 Fahed Mlaiel <mlaiel@live.de> - All Rights Reserved
# Role-Based Access Control for Creator Economy Platform

# ========================================================================================
# ⚠️  PROTECTION PROPRIÉTÉ INTELLECTUELLE - Fahed Mlaiel (mlaiel@live.de)
# TOUS DROITS RÉSERVÉS - Utilisation commerciale strictement encadrée
# ========================================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-rbac-permissions
  namespace: iacherie-redis
  labels:
    app: iacherie-redis
    component: rbac-permissions
    environment: enterprise
    owner: fahed-mlaiel
    version: "4.0.0"
    security-level: "strict"
  annotations:
    author: "Fahed Mlaiel <mlaiel@live.de>"
    license: "Proprietary - All Rights Reserved"
    description: "Enterprise RBAC Permissions for Redis"
    rbac-version: "2.0"
    compliance: "SOX,GDPR,PCI-DSS"

data:
  # ===================================================================================
  # ENTERPRISE ADMIN ROLE
  # ===================================================================================
  admin_role: |
    # Enterprise Administrator - Full Access
    user admin_enterprise on >iacherie_admin_enterprise_2025_ultra_secure_key 
    ~* &* +@all -flushdb -flushall -debug -shutdown -config
    
    # Admin permissions breakdown:
    # ~* : Access to all keys
    # &* : Access to all channels (Pub/Sub)
    # +@all : All command categories
    # Exceptions: Dangerous commands still restricted

  # ===================================================================================
  # CREATOR ROLES & PERMISSIONS
  # ===================================================================================
  creator_roles: |
    # Lead Creator - Enhanced privileges
    user creator_lead on >iacherie_creator_lead_2025_secure_key
    ~creator:lead:* ~content:* ~collaboration:lead:* ~analytics:creator:*
    +@read +@write +@list +@string +@hash +@set +@sortedset +@stream +@bitmap +@hyperloglog
    +ping +info +client +memory +latency
    
    # Standard Creator - Content management
    user creator_standard on >iacherie_creator_standard_2025_secure_key
    ~creator:${username}:* ~content:${username}:* ~collaboration:${username}:*
    ~session:${username}:* ~cache:creator:${username}:*
    +@read +@write +@string +@hash +@set +@list +@sortedset +@stream
    +ping +info +client
    
    # Creator Collaborator - Limited collaboration access
    user creator_collaborator on >iacherie_creator_collab_2025_secure_key
    ~collaboration:* ~content:shared:* ~project:*
    +@read +@write +@string +@hash +@set +@list
    +ping +info
    
    # Creator Analytics - Read-only analytics access
    user creator_analytics on >iacherie_creator_analytics_2025_secure_key
    ~analytics:* ~metrics:* ~reports:*
    +@read +@string +@hash +@set +@list +@sortedset
    +ping +info

  # ===================================================================================
  # APPLICATION SERVICE ROLES
  # ===================================================================================
  service_roles: |
    # Main Application Service
    user app_service on >iacherie_app_service_2025_ultra_secure_key
    ~cache:* ~session:* ~temp:* ~queue:* ~lock:*
    +@read +@write +@list +@string +@hash +@set +@sortedset +@stream +@bitmap
    +ping +info +client +memory
    
    # Content Processing Service
    user content_processor on >iacherie_content_proc_2025_secure_key
    ~content:processing:* ~temp:processing:* ~queue:content:*
    ~thumbnail:* ~preview:* ~metadata:*
    +@read +@write +@string +@hash +@set +@list +@sortedset +@stream
    +ping +info +client
    
    # AI Processing Service
    user ai_processor on >iacherie_ai_proc_2025_secure_key
    ~ai:* ~ml:* ~prediction:* ~recommendation:* ~analysis:*
    +@read +@write +@string +@hash +@set +@list +@sortedset +@stream +@bitmap
    +ping +info +client +memory
    
    # Authentication Service
    user auth_service on >iacherie_auth_service_2025_secure_key
    ~auth:* ~session:* ~token:* ~oauth:* ~jwt:*
    +@read +@write +@string +@hash +@set +@list
    +ping +info +client
    
    # Notification Service
    user notification_service on >iacherie_notification_2025_secure_key
    ~notification:* ~email:* ~push:* ~sms:* &notification:*
    +@read +@write +@string +@hash +@set +@list +@stream +publish +subscribe
    +ping +info +client

  # ===================================================================================
  # MONETIZATION & FINANCIAL ROLES
  # ===================================================================================
  financial_roles: |
    # Payment Processing Service - PCI Compliant
    user payment_processor on >iacherie_payment_proc_2025_pci_secure_key
    ~payment:* ~transaction:* ~billing:* ~invoice:*
    +@read +@write +@string +@hash +@set +@list +@sortedset
    +ping +info +client +memory
    
    # Revenue Analytics Service
    user revenue_analytics on >iacherie_revenue_analytics_2025_secure_key
    ~revenue:* ~analytics:financial:* ~reports:revenue:*
    +@read +@string +@hash +@set +@list +@sortedset
    +ping +info
    
    # Commission Calculator
    user commission_calc on >iacherie_commission_calc_2025_secure_key
    ~commission:* ~calculation:* ~payout:*
    +@read +@write +@string +@hash +@set +@sortedset
    +ping +info +client
    
    # Affiliate Tracking
    user affiliate_tracker on >iacherie_affiliate_track_2025_secure_key
    ~affiliate:* ~referral:* ~tracking:*
    +@read +@write +@string +@hash +@set +@list +@sortedset
    +ping +info +client

  # ===================================================================================
  # OPERATIONAL & MONITORING ROLES
  # ===================================================================================
  operational_roles: |
    # Monitoring Service - Read-only system access
    user monitoring_service on >iacherie_monitoring_2025_secure_key
    ~* +@read +info +ping +client +memory +latency +slowlog +config|get
    
    # Backup Service - Backup operations only
    user backup_service on >iacherie_backup_2025_secure_key
    ~* +@read +bgsave +lastsave +info +ping +client
    
    # Health Check Service - Minimal access
    user healthcheck_service on >iacherie_healthcheck_2025_secure_key
    ~health:* +@read +ping +info +client
    
    # Log Aggregator - Log data access
    user log_aggregator on >iacherie_log_aggregator_2025_secure_key
    ~log:* ~audit:* +@read +@string +@list +@stream
    +ping +info +client
    
    # Metrics Collector - Metrics access
    user metrics_collector on >iacherie_metrics_collector_2025_secure_key
    ~metrics:* ~stats:* +@read +@string +@hash +@sortedset
    +ping +info +client +memory +latency

  # ===================================================================================
  # SECURITY & AUDIT ROLES
  # ===================================================================================
  security_roles: |
    # Security Auditor - Audit access only
    user security_auditor on >iacherie_security_auditor_2025_secure_key
    ~audit:* ~security:* ~access:* +@read +@string +@hash +@list +@set
    +ping +info +client +acl|list +acl|getuser
    
    # Compliance Officer - Compliance data access
    user compliance_officer on >iacherie_compliance_2025_secure_key
    ~compliance:* ~gdpr:* ~sox:* ~pci:* +@read +@string +@hash +@list
    +ping +info +client
    
    # Incident Response - Emergency access
    user incident_response on >iacherie_incident_response_2025_secure_key
    ~incident:* ~alert:* ~emergency:* +@read +@write +@string +@hash +@set +@list
    +ping +info +client +memory +slowlog

  # ===================================================================================
  # DEVELOPMENT & STAGING ROLES
  # ===================================================================================
  development_roles: |
    # Developer - Development environment access
    user developer on >iacherie_developer_2025_secure_key
    ~dev:* ~test:* ~staging:* ~debug:*
    +@read +@write +@string +@hash +@set +@list +@sortedset +@stream
    +ping +info +client +memory +config|get
    
    # QA Tester - Testing environment access
    user qa_tester on >iacherie_qa_tester_2025_secure_key
    ~test:* ~qa:* ~staging:*
    +@read +@write +@string +@hash +@set +@list
    +ping +info +client
    
    # Performance Tester - Performance testing access
    user perf_tester on >iacherie_perf_tester_2025_secure_key
    ~perf:* ~load:* ~stress:*
    +@read +@write +@string +@hash +@set +@list
    +ping +info +client +memory +latency +slowlog

  # ===================================================================================
  # GAMIFICATION ROLES
  # ===================================================================================
  gamification_roles: |
    # Gamification Engine - Game mechanics access
    user gamification_engine on >iacherie_gamification_2025_secure_key
    ~game:* ~achievement:* ~leaderboard:* ~point:* ~badge:*
    ~challenge:* ~reward:* ~level:*
    +@read +@write +@string +@hash +@set +@list +@sortedset +@stream
    +ping +info +client
    
    # Achievement Processor - Achievement system access
    user achievement_processor on >iacherie_achievement_2025_secure_key
    ~achievement:* ~badge:* ~milestone:* ~progress:*
    +@read +@write +@string +@hash +@set +@list +@sortedset
    +ping +info +client
    
    # Leaderboard Manager - Leaderboard operations
    user leaderboard_manager on >iacherie_leaderboard_2025_secure_key
    ~leaderboard:* ~ranking:* ~score:* ~competition:*
    +@read +@write +@string +@hash +@sortedset +@list
    +ping +info +client

  # ===================================================================================
  # API & INTEGRATION ROLES
  # ===================================================================================
  integration_roles: |
    # API Gateway - API access management
    user api_gateway on >iacherie_api_gateway_2025_secure_key
    ~api:* ~rate:* ~quota:* ~throttle:*
    +@read +@write +@string +@hash +@set +@list +@sortedset
    +ping +info +client
    
    # External Integrations - Third-party access
    user external_integrations on >iacherie_external_int_2025_secure_key
    ~integration:* ~webhook:* ~sync:* ~import:* ~export:*
    +@read +@write +@string +@hash +@set +@list
    +ping +info +client
    
    # CDN Manager - CDN cache management
    user cdn_manager on >iacherie_cdn_manager_2025_secure_key
    ~cdn:* ~cache:content:* ~media:cache:*
    +@read +@write +@string +@hash +@set +@list
    +ping +info +client

  # ===================================================================================
  # ROLE INHERITANCE & GROUPS
  # ===================================================================================
  role_groups: |
    # Creator Group Permissions
    creator_group_permissions:
      - content_access: "~creator:${username}:*"
      - collaboration_access: "~collaboration:${username}:*"
      - analytics_access: "~analytics:creator:${username}:*"
      - session_access: "~session:${username}:*"
    
    # Service Group Permissions
    service_group_permissions:
      - cache_access: "~cache:service:*"
      - queue_access: "~queue:service:*"
      - temp_access: "~temp:service:*"
      - lock_access: "~lock:service:*"
    
    # Admin Group Permissions
    admin_group_permissions:
      - full_read_access: "~*"
      - monitoring_access: "+info +ping +client +memory +latency"
      - config_access: "+config|get +config|set"
      - cluster_access: "+cluster"

  # ===================================================================================
  # DYNAMIC PERMISSION PATTERNS
  # ===================================================================================
  dynamic_patterns: |
    # User-specific patterns
    user_patterns:
      creator_content: "~creator:${username}:content:*"
      creator_session: "~session:creator:${username}:*"
      creator_analytics: "~analytics:creator:${username}:*"
      creator_collaboration: "~collaboration:${username}:*"
    
    # Service-specific patterns
    service_patterns:
      service_cache: "~cache:${service_name}:*"
      service_queue: "~queue:${service_name}:*"
      service_temp: "~temp:${service_name}:*"
      service_metrics: "~metrics:${service_name}:*"
    
    # Environment-specific patterns
    environment_patterns:
      dev_data: "~dev:${environment}:*"
      test_data: "~test:${environment}:*"
      staging_data: "~staging:${environment}:*"

  # ===================================================================================
  # PERMISSION AUDIT & COMPLIANCE
  # ===================================================================================
  audit_config: |
    # Permission change tracking
    track_permission_changes: true
    log_access_attempts: true
    monitor_privilege_escalation: true
    
    # Compliance requirements
    sox_permission_review: quarterly
    gdpr_access_audit: monthly
    pci_privilege_validation: weekly
    
    # Automated compliance checks
    excessive_permissions_detection: enabled
    unused_permissions_cleanup: monthly
    role_certification_required: quarterly

---
# RBAC Management Scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-rbac-management
  namespace: iacherie-redis
data:
  create_users.sh: |
    #!/bin/bash
    # RBAC User Creation Script
    # © 2025 Fahed Mlaiel <mlaiel@live.de>
    
    echo "🔐 Creating Redis RBAC users..."
    
    # Connect to Redis with admin privileges
    REDIS_CLI="redis-cli -h localhost -p 16379 --tls --cert /etc/redis/ssl/certs/admin.crt --key /etc/redis/ssl/private/admin.key --cacert /etc/redis/ssl/ca/iacherie-ca.crt"
    
    # Create enterprise admin
    $REDIS_CLI ACL SETUSER admin_enterprise on '>iacherie_admin_enterprise_2025_ultra_secure_key' '~*' '&*' '+@all' '-flushdb' '-flushall' '-debug' '-shutdown' '-config'
    
    # Create creator roles
    $REDIS_CLI ACL SETUSER creator_lead on '>iacherie_creator_lead_2025_secure_key' '~creator:lead:*' '~content:*' '~collaboration:lead:*' '+@read' '+@write' '+@list' '+@string' '+@hash'
    
    echo "✅ RBAC users created successfully"

  audit_permissions.sh: |
    #!/bin/bash
    # RBAC Audit Script
    # © 2025 Fahed Mlaiel <mlaiel@live.de>
    
    echo "📊 Auditing Redis RBAC permissions..."
    
    REDIS_CLI="redis-cli -h localhost -p 16379 --tls --cert /etc/redis/ssl/certs/admin.crt --key /etc/redis/ssl/private/admin.key --cacert /etc/redis/ssl/ca/iacherie-ca.crt"
    
    # List all users
    echo "Current users:"
    $REDIS_CLI ACL LIST
    
    # Check user permissions
    echo "User permissions audit:"
    for user in admin_enterprise creator_lead creator_standard; do
      echo "User: $user"
      $REDIS_CLI ACL GETUSER $user
      echo "---"
    done
    
    echo "✅ RBAC audit completed"