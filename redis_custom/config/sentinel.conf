# =============================================================================

# Sentinel port
port 26379

# Sentinel announce IP
# sentinel announce-ip <ip>

# Sentinel announce port
# sentinel announce-port <port>

# Working directory
dir /data

# Monitor master Redis instance
# sentinel monitor <master-name> <master-ip> <master-port> <quorum>
sentinel monitor ainflue-master redis-master 6379 2

# Master authentication (if password is set)
# sentinel auth-pass ainflue-master <password>

# Timeouts and thresholds
sentinel down-after-milliseconds ainflue-master 5000
sentinel parallel-syncs ainflue-master 1
sentinel failover-timeout ainflue-master 10000

# Security: Disable dangerous commands
sentinel deny-scripts-reconfig yes

# Logging
loglevel notice
logfile /data/sentinel.log

# Sentinel configuration persistence
sentinel config-epoch ainflue-master 0

# Notification scripts (optional)
# sentinel notification-script ainflue-master /path/to/notify.sh
# sentinel client-reconfig-script ainflue-master /path/to/reconfig.sh

# Sentinel ID (auto-generated on first run)
# sentinel myid <id>

# Performance tuning
tcp-keepalive 60
timeout 0

# Security
protected-mode no
bind 0.0.0.0

# Memory optimization
save ""