# Staging Environment Configuration for Creator Economy Platform

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-staging-config
  namespace: ainflue-redis-staging
  labels:
    app: ainflue-redis
    component: staging-config
    environment: staging
    owner: fahed-mlaiel
    version: "4.0.0"
  annotations:
    author: "Fahed Mlaiel <mlaiel@live.de>"
    license: "Proprietary - All Rights Reserved"

data:
  staging_config: |
    # Staging Environment Settings
    environment: "staging"
    debug_mode: false
    verbose_logging: false
    
    # Memory Configuration (Production-like)
    maxmemory: 16gb
    maxmemory-policy: allkeys-lru
    
    # Persistence (Production-like)
    save: "900 1 300 10 60 10000"
    appendonly: true
    appendfsync: "everysec"
    
    # Security (Production-like)
    protected-mode: true
    requirepass: "staging_secure_password_2025"
    tls-port: 16379
    
    # Staging-specific features
    staging_features:
      performance_testing: true
      load_testing_support: true
      integration_testing: true
      pre_production_validation: true
      
    # Creator Staging Features
    creator_staging_features:
      payment_simulation: true
      content_validation: true
      analytics_verification: true
      collaboration_testing: true
---