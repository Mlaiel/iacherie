# Development Environment Configuration for Creator Economy Platform

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-development-config
  namespace: iacherie-redis-dev
  labels:
    app: iacherie-redis
    component: development-config
    environment: development
    owner: fahed-mlaiel
    version: "4.0.0"
  annotations:
    author: "Fahed Mlaiel <mlaiel@live.de>"
    license: "Proprietary - All Rights Reserved"

data:
  development_config: |
    # Development Environment Settings
    environment: "development"
    debug_mode: true
    verbose_logging: true
    
    # Memory Configuration (Reduced for development)
    maxmemory: 4gb
    maxmemory-policy: allkeys-lru
    
    # Persistence (Relaxed for development)
    save: "60 1000"
    appendonly: false
    
    # Security (Relaxed for development)
    protected-mode: false
    requirepass: "dev_password_2025"
    
    # Developer-friendly features
    developer_features:
      command_monitoring: true
      slow_log_enabled: true
      debug_commands_enabled: true
      test_data_generation: true
      
    # Creator Development Features
    creator_dev_features:
      mock_payment_processing: true
      test_content_generation: true
      fake_analytics_data: true
      collaboration_simulation: true
---