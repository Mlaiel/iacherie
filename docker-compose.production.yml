Docker Configuration for Ainflue Platform Services
Docker Compose configuration for running the complete platform.

Author: Fahed Mlaiel (mlaiel@live.de)
Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.
"""

version: '3.8'

services:
  # Main Ainflue Application
  ainflue-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_MASTER_HOST=postgres-master
      - POSTGRES_SLAVE_HOST=postgres-slave
      - REDIS_HOST=redis
      - MONGODB_HOST=mongodb
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-slave:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    networks:
      - ainflue-network

  # PostgreSQL Master Database
  postgres-master:
    image: postgres:15
    environment:
      POSTGRES_DB: ainflue_platform
      POSTGRES_USER: ainflue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: replication_user
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    command: |
      postgres -c wal_level=replica 
               -c max_wal_senders=3 
               -c max_replication_slots=3 
               -c synchronous_commit=on 
               -c archive_mode=on 
               -c archive_command='test ! -f /archive/%f && cp %p /archive/%f'
               -c shared_preload_libraries=pg_stat_statements
               -c track_activity_query_size=2048
               -c log_checkpoints=on
               -c log_connections=on
               -c log_disconnections=on
               -c log_lock_waits=on
               -c log_min_duration_statement=1000
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - postgres_archive:/archive
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/postgresql/master.conf:/etc/postgresql/postgresql.conf
      - ./database/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"
    networks:
      - ainflue-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainflue -d ainflue_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Slave Database (Read Replica)
  postgres-slave:
    image: postgres:15
    environment:
      POSTGRES_DB: ainflue_platform
      POSTGRES_USER: ainflue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: replication_user
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PGUSER: postgres
    command: |
      bash -c "
      until pg_basebackup --pgdata=/var/lib/postgresql/data --format=p --write-recovery-conf --checkpoint=fast --label=myclone --host=postgres-master --port=5432 --username=replication_user --verbose --progress --wal-method=stream; do
        echo 'Waiting for master to be available...'
        sleep 1s
      done
      echo 'Backup done, starting replica...'
      chmod 0700 /var/lib/postgresql/data
      postgres -c wal_level=replica -c hot_standby=on -c max_wal_senders=3 -c max_replication_slots=3
      "
    volumes:
      - postgres_slave_data:/var/lib/postgresql/data
      - ./database/postgresql/slave.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5433:5432"
    networks:
      - ainflue-network
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainflue -d ainflue_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ainflue-network

  # MongoDB for Documents
  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: ainflue
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ainflue_documents
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - ainflue-network

  # Crawler Service
  crawler-service:
    build:
      context: .
      dockerfile: docker/crawler.dockerfile
    environment:
      - POSTGRES_MASTER_HOST=postgres-master
      - POSTGRES_SLAVE_HOST=postgres-slave
      - REDIS_HOST=redis
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-slave:
        condition: service_healthy
    volumes:
      - ./storage/crawled_data:/app/crawled_data
    networks:
      - ainflue-network

  # Monetization Service
  monetization-service:
    build:
      context: .
      dockerfile: docker/monetization.dockerfile
    environment:
      - POSTGRES_MASTER_HOST=postgres-master
      - POSTGRES_SLAVE_HOST=postgres-slave
      - REDIS_HOST=redis
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-slave:
        condition: service_healthy
    networks:
      - ainflue-network

  # Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: docker/analytics.dockerfile
    environment:
      - POSTGRES_MASTER_HOST=postgres-master
      - POSTGRES_SLAVE_HOST=postgres-slave
      - REDIS_HOST=redis
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-slave:
        condition: service_healthy
    networks:
      - ainflue-network

  # AI Processing Service
  ai-service:
    build:
      context: .
      dockerfile: docker/ai.dockerfile
    environment:
      - REDIS_HOST=redis
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis
    volumes:
      - ./storage/ai_models:/app/models
      - ./storage/processed_content:/app/processed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ainflue-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - ainflue-app
    networks:
      - ainflue-network

volumes:
  postgres_master_data:
  postgres_slave_data:
  postgres_archive:
  redis_data:
  mongodb_data:

networks:
  ainflue-network:
    driver: bridge