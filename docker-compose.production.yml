# =============================================================================
# AINFLUE PLATFORM - PRODUCTION DOCKER COMPOSE
# =============================================================================
# Enterprise-grade multi-service deployment with high availability,
# monitoring, security, and scalability features.
#
# Author: Fahed Mlaiel (mlaiel@live.de)
# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.
# =============================================================================

version: '3.8'

x-common-variables: &common-variables
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  POSTGRES_HOST: postgres-master
  POSTGRES_PORT: 5432
  REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  MONGODB_HOSTS: mongodb-primary:27017,mongodb-secondary:27017,mongodb-arbiter:27017
  MONITORING_ENABLED: "true"

x-resource-limits: &default-resources
  limits:
    cpus: '2.0'
    memory: 2G
  reservations:
    cpus: '0.5'
    memory: 512M

x-restart-policy: &restart-policy
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s

services:
  # =============================================================================
  # LOAD BALANCER & REVERSE PROXY
  # =============================================================================
  nginx-loadbalancer:
    image: nginx:alpine
    container_name: ainflue-nginx-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    depends_on:
      - ainflue-app-1
      - ainflue-app-2
      - ainflue-app-3
    deploy:
      replicas: 2
      <<: *restart-policy
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-network
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # =============================================================================
  # MAIN APPLICATION SERVICES (LOAD BALANCED)
  # =============================================================================
  ainflue-app-1:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
      args:
        BUILD_ENV: production
        SECURITY_SCAN: "true"
    container_name: ainflue-app-1
    environment:
      <<: *common-variables
      INSTANCE_ID: "app-1"
      WORKER_PROCESSES: 4
    depends_on:
      postgres-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      mongodb-primary:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    deploy:
      <<: *restart-policy
      resources: *default-resources
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "5"

  ainflue-app-2:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
      args:
        BUILD_ENV: production
        SECURITY_SCAN: "true"
    container_name: ainflue-app-2
    environment:
      <<: *common-variables
      INSTANCE_ID: "app-2"
      WORKER_PROCESSES: 4
    depends_on:
      postgres-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      mongodb-primary:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    deploy:
      <<: *restart-policy
      resources: *default-resources
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "5"

  ainflue-app-3:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
      args:
        BUILD_ENV: production
        SECURITY_SCAN: "true"
    container_name: ainflue-app-3
    environment:
      <<: *common-variables
      INSTANCE_ID: "app-3"
      WORKER_PROCESSES: 4
    depends_on:
      postgres-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      mongodb-primary:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    deploy:
      <<: *restart-policy
      resources: *default-resources
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "5"

  # =============================================================================
  # DATABASE CLUSTER - POSTGRESQL (MASTER-SLAVE REPLICATION)
  # =============================================================================
  postgres-master:
    image: postgres:15
    container_name: ainflue-postgres-master
    environment:
      POSTGRES_DB: ainflue_platform
      POSTGRES_USER: ${POSTGRES_USER:-ainflue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c wal_level=replica
      -c max_wal_senders=3
      -c max_replication_slots=3
      -c hot_standby=on
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ainflue} -d ainflue_platform"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - database-network
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "5"

  postgres-slave:
    image: postgres:15
    container_name: ainflue-postgres-slave
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ainflue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MASTER_SERVICE: postgres-master
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PGUSER: ${POSTGRES_USER:-ainflue}
    volumes:
      - postgres_slave_data:/var/lib/postgresql/data
      - ./database/scripts/setup_replica.sh:/docker-entrypoint-initdb.d/setup_replica.sh:ro
    command: >
      postgres
      -c hot_standby=on
      -c wal_level=replica
      -c max_connections=200
    depends_on:
      postgres-master:
        condition: service_healthy
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ainflue}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - database-network
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "5"

  # =============================================================================
  # REDIS CLUSTER WITH SENTINEL (HIGH AVAILABILITY)
  # =============================================================================
  redis-master:
    image: redis:7-alpine
    container_name: ainflue-redis-master
    command: >
      redis-server
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_master_data:/data
      - ./redis/config/redis.conf:/etc/redis/redis.conf:ro
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cache-network
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"

  redis-slave:
    image: redis:7-alpine
    container_name: ainflue-redis-slave
    command: >
      redis-server
      --slaveof redis-master 6379
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_slave_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cache-network
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: ainflue-redis-sentinel-1
    command: >
      redis-sentinel /etc/redis/sentinel.conf
      --sentinel deny-scripts-reconfig yes
    volumes:
      - ./redis/config/sentinel.conf:/etc/redis/sentinel.conf:ro
      - redis_sentinel_1_data:/data
    depends_on:
      - redis-master
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cache-network

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: ainflue-redis-sentinel-2
    command: >
      redis-sentinel /etc/redis/sentinel.conf
      --sentinel deny-scripts-reconfig yes
    volumes:
      - ./redis/config/sentinel.conf:/etc/redis/sentinel.conf:ro
      - redis_sentinel_2_data:/data
    depends_on:
      - redis-master
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cache-network

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: ainflue-redis-sentinel-3
    command: >
      redis-sentinel /etc/redis/sentinel.conf
      --sentinel deny-scripts-reconfig yes
    volumes:
      - ./redis/config/sentinel.conf:/etc/redis/sentinel.conf:ro
      - redis_sentinel_3_data:/data
    depends_on:
      - redis-master
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cache-network

  # =============================================================================
  # MONGODB REPLICA SET
  # =============================================================================
  mongodb-primary:
    image: mongo:7
    container_name: ainflue-mongodb-primary
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ainflue_documents
      MONGO_REPLICA_SET_NAME: ainflue-rs
    volumes:
      - mongodb_primary_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb/config/mongod.conf:/etc/mongod.conf:ro
      - ./mongodb/scripts:/docker-entrypoint-initdb.d:ro
    command: >
      mongod
      --config /etc/mongod.conf
      --replSet ainflue-rs
      --bind_ip_all
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - database-network
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "5"

  mongodb-secondary:
    image: mongo:7
    container_name: ainflue-mongodb-secondary
    environment:
      MONGO_REPLICA_SET_NAME: ainflue-rs
    volumes:
      - mongodb_secondary_data:/data/db
      - ./mongodb/config/mongod.conf:/etc/mongod.conf:ro
    command: >
      mongod
      --config /etc/mongod.conf
      --replSet ainflue-rs
      --bind_ip_all
    depends_on:
      mongodb-primary:
        condition: service_healthy
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - database-network

  mongodb-arbiter:
    image: mongo:7
    container_name: ainflue-mongodb-arbiter
    environment:
      MONGO_REPLICA_SET_NAME: ainflue-rs
    volumes:
      - mongodb_arbiter_data:/data/db
    command: >
      mongod
      --replSet ainflue-rs
      --bind_ip_all
      --smallfiles
      --noprealloc
    depends_on:
      mongodb-primary:
        condition: service_healthy
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - database-network

  # =============================================================================
  # MICROSERVICES
  # =============================================================================
  crawler-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.crawler
      target: production
    container_name: ainflue-crawler-service
    environment:
      <<: *common-variables
      SERVICE_NAME: crawler
      WORKER_CONCURRENCY: 8
    depends_on:
      postgres-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    volumes:
      - crawler_storage:/app/crawled_data
      - crawler_logs:/app/logs
    deploy:
      replicas: 2
      <<: *restart-policy
      resources:
        limits:
          cpus: '3.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "300m"
        max-file: "5"

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
      target: production
    container_name: ainflue-ai-service
    environment:
      <<: *common-variables
      SERVICE_NAME: ai
      GPU_ENABLED: "true"
      MODEL_CACHE_SIZE: 8GB
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - ai_models:/app/models
      - ai_processed:/app/processed
      - ai_logs:/app/logs
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '4.0'
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 45s
      timeout: 20s
      retries: 3
      start_period: 120s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "5"

  monetization-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.monetization
      target: production
    container_name: ainflue-monetization-service
    environment:
      <<: *common-variables
      SERVICE_NAME: monetization
      PAYMENT_PROCESSOR_TIMEOUT: 30s
    depends_on:
      postgres-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    deploy:
      replicas: 2
      <<: *restart-policy
      resources: *default-resources
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "5"

  analytics-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.analytics
      target: production
    container_name: ainflue-analytics-service
    environment:
      <<: *common-variables
      SERVICE_NAME: analytics
      ANALYTICS_BATCH_SIZE: 1000
    depends_on:
      postgres-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    volumes:
      - analytics_reports:/app/reports
    deploy:
      <<: *restart-policy
      resources: *default-resources
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend-network
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "5"

  # =============================================================================
  # MONITORING STACK
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ainflue-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring-network
      - backend-network

  grafana:
    image: grafana/grafana:latest
    container_name: ainflue-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: ainflue-alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    volumes:
      - ./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - monitoring-network

  # =============================================================================
  # LOG AGGREGATION
  # =============================================================================
  elasticsearch:
    image: elasticsearch:8.9.0
    container_name: ainflue-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - logging-network

  logstash:
    image: logstash:8.9.0
    container_name: ainflue-logstash
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./monitoring/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - logging-network

  kibana:
    image: kibana:8.9.0
    container_name: ainflue-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      <<: *restart-policy
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - logging-network

# =============================================================================
# PERSISTENT VOLUMES
# =============================================================================
volumes:
  # Application data
  app_storage:
    driver: local
  app_logs:
    driver: local
  app_uploads:
    driver: local
  nginx_cache:
    driver: local

  # Database volumes
  postgres_master_data:
    driver: local
  postgres_slave_data:
    driver: local
  mongodb_primary_data:
    driver: local
  mongodb_secondary_data:
    driver: local
  mongodb_arbiter_data:
    driver: local
  mongodb_config:
    driver: local

  # Cache volumes
  redis_master_data:
    driver: local
  redis_slave_data:
    driver: local
  redis_sentinel_1_data:
    driver: local
  redis_sentinel_2_data:
    driver: local
  redis_sentinel_3_data:
    driver: local

  # Service volumes
  crawler_storage:
    driver: local
  crawler_logs:
    driver: local
  ai_models:
    driver: local
  ai_processed:
    driver: local
  ai_logs:
    driver: local
  analytics_reports:
    driver: local

  # Monitoring volumes
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

  # Logging volumes
  elasticsearch_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  database-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
  cache-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/24
  monitoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24
  logging-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24