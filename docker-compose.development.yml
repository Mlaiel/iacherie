# License: Proprietary - Unauthorized use strictly prohibited.

version: '3.8'

services:
  # Backend API Server - Lead Dev IA + Backend Senior
  iacherie-backend:
    build:
      context: .
      dockerfile: docker/infrastructure/Dockerfile
      target: development
    container_name: iacherie-backend-dev
    ports:
      - "8000:8000"      # Main API
      - "8001:8001"      # AI Processing API
      - "8765:8765"      # WebSocket Server
      - "5678:5678"      # Python Debugger
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://iacherie_admin:dev_password@postgres:5432/iacherie_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - MONGODB_URL=mongodb://mongo:27017/iacherie_dev
      - LOG_LEVEL=DEBUG
      - HOT_RELOAD=true
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./cache:/app/cache
    networks:
      - iacherie-dev
    depends_on:
      - postgres
      - redis
      - mongo
      - elasticsearch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app/backend
        - action: sync
          path: ./api
          target: /app/api
        - action: sync
          path: ./core
          target: /app/core
        - action: sync
          path: ./services
          target: /app/services

  # Frontend Development Server - Frontend Expert
  iacherie-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: iacherie-frontend-dev
    ports:
      - "3000:3000"      # Next.js Dev Server
      - "3001:3001"      # Storybook
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8765
      - NEXT_PUBLIC_ANALYTICS_URL=http://localhost:8000/api/analytics
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - iacherie-dev
    depends_on:
      - iacherie-backend
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/pages
          target: /app/pages
        - action: sync
          path: ./frontend/components
          target: /app/components

  # AI/ML Processing Engine - ML Engineer + Lead Dev IA
  iacherie-ai-engine:
    build:
      context: .
      dockerfile: docker/ai_orchestration_hub.dockerfile
      target: development
    container_name: iacherie-ai-engine-dev
    ports:
      - "8002:8000"      # AI API
      - "8888:8888"      # Jupyter Notebook
      - "6006:6006"      # TensorBoard
    environment:
      - ENVIRONMENT=development
      - CUDA_VISIBLE_DEVICES=0
      - OMP_NUM_THREADS=4
      - PYTORCH_TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - ./ai_processing:/app/ai_processing
      - ./ml:/app/ml
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./experiments:/app/experiments
      - ./notebooks:/app/notebooks
      - ./cache:/app/cache
    networks:
      - iacherie-dev
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Database Services - DBA Expert
  postgres:
    image: postgres:15-alpine
    container_name: iacherie-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=iacherie_dev
      - POSTGRES_USER=iacherie_admin
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/backups:/backups
    networks:
      - iacherie-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iacherie_admin", "-d", "iacherie_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker - Backend Senior
  redis:
    image: redis:7-alpine
    container_name: iacherie-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
      - ./redis/config:/etc/redis
    networks:
      - iacherie-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MongoDB for Content Storage - DBA Expert
  mongo:
    image: mongo:7
    container_name: iacherie-mongo-dev
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=dev_password
      - MONGO_INITDB_DATABASE=iacherie_dev
    volumes:
      - mongo_dev_data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d
    networks:
      - iacherie-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Elasticsearch for Search & Analytics - Backend Senior
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: iacherie-elasticsearch-dev
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    volumes:
      - elasticsearch_dev_data:/usr/share/elasticsearch/data
    networks:
      - iacherie-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Background Workers - Backend Senior
  iacherie-worker:
    build:
      context: .
      dockerfile: docker/infrastructure/Dockerfile
      target: development
    container_name: iacherie-worker-dev
    command: ["celery", "worker", "-A", "core.celery", "--loglevel=debug", "--concurrency=4"]
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://iacherie_admin:dev_password@postgres:5432/iacherie_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - iacherie-dev
    depends_on:
      - postgres
      - redis
      - mongo
    restart: unless-stopped

  # Celery Beat Scheduler - Backend Senior
  iacherie-scheduler:
    build:
      context: .
      dockerfile: docker/infrastructure/Dockerfile
      target: development
    container_name: iacherie-scheduler-dev
    command: ["celery", "beat", "-A", "core.celery", "--loglevel=debug"]
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://iacherie_admin:dev_password@postgres:5432/iacherie_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - .:/app
      - ./logs:/app/logs
    networks:
      - iacherie-dev
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Monitoring & Observability - DevOps Engineer
  prometheus:
    image: prom/prometheus:latest
    container_name: iacherie-prometheus-dev
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/config:/etc/prometheus
      - prometheus_dev_data:/prometheus
    networks:
      - iacherie-dev
    restart: unless-stopped

  # Grafana Dashboard - DevOps Engineer
  grafana:
    image: grafana/grafana:latest
    container_name: iacherie-grafana-dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=dev_password
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - iacherie-dev
    depends_on:
      - prometheus
    restart: unless-stopped

  # MinIO S3-Compatible Storage - Backend Senior
  minio:
    image: minio/minio:latest
    container_name: iacherie-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=iacherie_admin
      - MINIO_ROOT_PASSWORD=dev_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_dev_data:/data
    networks:
      - iacherie-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Audio Processing Service - Audio Engineer
  iacherie-audio:
    build:
      context: .
      dockerfile: docker/audio_processor.dockerfile
      target: development
    container_name: iacherie-audio-dev
    ports:
      - "8003:8000"
    environment:
      - ENVIRONMENT=development
      - AUDIO_SAMPLE_RATE=48000
      - AUDIO_CHANNELS=2
      - BUFFER_SIZE=512
      - FFMPEG_PATH=/usr/bin/ffmpeg
    volumes:
      - ./audio:/app/audio
      - ./uploads/audio:/app/input
      - ./processed/audio:/app/output
      - ./models/audio:/app/models
    networks:
      - iacherie-dev
    depends_on:
      - iacherie-backend
    restart: unless-stopped

  # Security Scanner Service - Security Specialist
  iacherie-security:
    build:
      context: .
      dockerfile: docker/security_hardening.dockerfile
      target: development
    container_name: iacherie-security-dev
    ports:
      - "8004:8000"
    environment:
      - ENVIRONMENT=development
      - SECURITY_LEVEL=development
      - SCAN_INTERVAL=3600
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app/source
      - ./security/scans:/app/scans
      - ./security/reports:/app/reports
      - ./logs:/app/logs
    networks:
      - iacherie-dev
    restart: unless-stopped

  # API Gateway - Microservices Architect
  api-gateway:
    image: nginx:alpine
    container_name: iacherie-gateway-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/development/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/development/conf.d:/etc/nginx/conf.d
      - ./ssl/dev-certs:/etc/ssl/certs
    networks:
      - iacherie-dev
    depends_on:
      - iacherie-backend
      - iacherie-frontend
      - iacherie-ai-engine
    restart: unless-stopped

  # Message Queue UI - DevOps Engineer
  celery-flower:
    build:
      context: .
      dockerfile: docker/infrastructure/Dockerfile
      target: development
    container_name: iacherie-flower-dev
    command: ["celery", "flower", "-A", "core.celery", "--port=5555"]
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - FLOWER_BASIC_AUTH=admin:dev_password
    networks:
      - iacherie-dev
    depends_on:
      - redis
      - iacherie-worker
    restart: unless-stopped

  # Database Admin UI - DBA Expert
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: iacherie-pgadmin-dev
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@iacherie.com
      - PGADMIN_DEFAULT_PASSWORD=dev_password
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - iacherie-dev
    depends_on:
      - postgres
    restart: unless-stopped

  # MongoDB Admin UI - DBA Expert
  mongo-express:
    image: mongo-express:latest
    container_name: iacherie-mongo-express-dev
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=dev_password
      - ME_CONFIG_MONGODB_URL=mongodb://admin:dev_password@mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=dev_password
    networks:
      - iacherie-dev
    depends_on:
      - mongo
    restart: unless-stopped

  # Redis Admin UI - Backend Senior
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: iacherie-redis-commander-dev
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=redis:redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=dev_password
    networks:
      - iacherie-dev
    depends_on:
      - redis
    restart: unless-stopped

  # Testing Environment - DevOps Engineer
  iacherie-test:
    build:
      context: .
      dockerfile: docker/infrastructure/Dockerfile
      target: testing
    container_name: iacherie-test-dev
    command: ["python", "-m", "pytest", "--verbose", "--cov=.", "--cov-report=html"]
    environment:
      - ENVIRONMENT=testing
      - DATABASE_URL=postgresql://iacherie_admin:dev_password@postgres:5432/iacherie_test
      - REDIS_URL=redis://redis:6379/3
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - ./test_reports:/app/test_reports
      - ./coverage:/app/coverage
    networks:
      - iacherie-dev
    depends_on:
      - postgres
      - redis
      - mongo
    profiles:
      - testing

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  mongo_dev_data:
    driver: local
  elasticsearch_dev_data:
    driver: local
  prometheus_dev_data:
    driver: local
  grafana_dev_data:
    driver: local
  minio_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local

networks:
  iacherie-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
    driver_opts:
      com.docker.network.bridge.name: iacherie-dev-bridge

# Development-specific overrides
x-development-common: &development-common
  environment:
    - ENVIRONMENT=development
    - DEBUG=true
    - LOG_LEVEL=DEBUG
  restart: unless-stopped
  
x-database-common: &database-common
  networks:
    - iacherie-dev
  restart: unless-stopped
  healthcheck:
    interval: 10s
    timeout: 5s
    retries: 5

# Resource limits for development
x-resource-limits: &resource-limits
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 2G
      reservations:
        cpus: '0.5'
        memory: 512M