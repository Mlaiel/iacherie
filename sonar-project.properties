# SonarQube Configuration for Ainflue Platform
# Quality Gates and Code Analysis Settings

sonar.projectKey=ainflue-platform
sonar.projectName=Ainflue AI Platform
sonar.projectVersion=1.0.0
sonar.organization=mlaiel

# Source Code Settings
sonar.sources=.
sonar.exclusions=**/tests/**,**/test_*,**/__pycache__/**,**/venv/**,**/virtualenv/**,**/.venv/**,**/site-packages/**,**/migrations/**,**/examples/**,**/scripts/**,**/docs/**,**/build/**,**/dist/**,**/*.egg-info/**
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py,**/test_*.py
sonar.test.exclusions=tests/performance/**,tests/load/**

# Language Settings
sonar.python.version=3.11,3.12
sonar.language=python

# Coverage Settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/tests/**,**/test_*,**/__pycache__/**,**/migrations/**,**/examples/**,**/scripts/**

# Quality Gate Thresholds
sonar.qualitygate.wait=true

# Code Coverage Thresholds
sonar.coverage.line.minimum=90.0
sonar.coverage.branch.minimum=85.0

# Duplicated Lines Threshold
sonar.cpd.exclusions=**/tests/**,**/migrations/**
sonar.duplicated_lines_density.maximum=3.0

# Code Complexity Thresholds
sonar.complexity.functions.maximum=15
sonar.complexity.file.maximum=200

# Technical Debt Thresholds
sonar.sqale.rating.grid=0.05,0.1,0.2,0.5,1
sonar.maintainability_rating.minimum=A
sonar.reliability_rating.minimum=A
sonar.security_rating.minimum=A

# Issues and Bugs Thresholds
sonar.blocker_violations.maximum=0
sonar.critical_violations.maximum=0
sonar.major_violations.maximum=10
sonar.minor_violations.maximum=50
sonar.info_violations.maximum=100

# Security Hotspots
sonar.security_hotspots.maximum=5
sonar.security_review_rating.minimum=A

# Code Smells
sonar.code_smells.maximum=50
sonar.sqale_index.maximum=1d

# File Size Limits
sonar.file.size.maximum=500

# Comment Density
sonar.comment_lines_density.minimum=20.0

# Additional Quality Metrics
sonar.cognitive_complexity.maximum=15
sonar.cognitive_complexity.threshold=15

# External Reports
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.flake8.reportPaths=flake8-report.txt
sonar.python.mypy.reportPaths=mypy-report.txt
sonar.python.pylint.reportPaths=pylint-report.json

# Branch Analysis
sonar.branch.name=${GITHUB_HEAD_REF}
sonar.pullrequest.key=${GITHUB_PR_NUMBER}
sonar.pullrequest.branch=${GITHUB_HEAD_REF}
sonar.pullrequest.base=${GITHUB_BASE_REF}

# GitHub Integration
sonar.pullrequest.github.repository=${GITHUB_REPOSITORY}
sonar.github.oauth=${GITHUB_TOKEN}

# Performance Analysis
sonar.analysis.mode=preview