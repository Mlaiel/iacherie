# SonarQube Configuration for Ainflue Platform
# Author: Fahed Mlaiel (mlaiel@live.de)

# Project identification
sonar.projectKey=Mlaiel_Ainflue
sonar.organization=mlaiel
sonar.projectName=Ainflue AI Content Protection Platform
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=.
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/.venv/**,**/venv/**,**/env/**,**/ENV/**,**/*.pyc,**/dist/**,**/build/**,**/tmp/**,**/logs/**,**/test_*,**/demo_*,**/*test*.py,**/conftest*.py

# Test configuration
sonar.tests=tests/
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/tests/**
sonar.test.exclusions=**/test_*.py.backup,**/test_*.py.bak

# Python specific settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-results.xml

# Quality gate settings
sonar.qualitygate.wait=true

# Coverage thresholds
sonar.coverage.exclusions=**/test_*,**/conftest*.py,**/setup.py,**/main.py,**/simple_main.py

# Code complexity thresholds
sonar.python.complexity.threshold=10

# Duplication settings
sonar.cpd.exclusions=**/test_*,**/migrations/**

# Security hotspots
sonar.security.hotspots.inheritFromParent=true

# Technical debt settings
sonar.technicalDebt.developmentCost=30
sonar.technicalDebt.ratingGrid=0.05,0.1,0.2,0.5

# Language settings
sonar.sourceEncoding=UTF-8