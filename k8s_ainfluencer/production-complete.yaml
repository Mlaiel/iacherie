# IA Chérie Platform - Production Kubernetes Deployment
# Author: Fahed Mlaiel (mlaiel@live.de)
# Role: DevOps Expert + Infrastructure Architect
# Purpose: Complete production-ready Kubernetes deployment

apiVersion: v1
kind: Namespace
metadata:
  name: iacherie-production
  labels:
    name: iacherie-production
    environment: production
    team: devops
    project: iacherie-platform
---
# API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-api-gateway
  namespace: iacherie-production
  labels:
    app: iacherie-api-gateway
    component: api-gateway
    version: v2.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: iacherie-api-gateway
  template:
    metadata:
      labels:
        app: iacherie-api-gateway
        component: api-gateway
        version: v2.0.0
    spec:
      serviceAccountName: iacherie-api-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
      - name: api-gateway
        image: iacherie/platform:2.0.0-production
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 8765
          name: websocket
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG
          value: "false"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: iacherie-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: iacherie-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-secrets
              key: secret-key
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        - name: API_WORKERS
          value: "4"
        - name: RATE_LIMIT_ENABLED
          value: "true"
        - name: API_ENABLE_MONITORING
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: logs-volume
          mountPath: /app/logs
        - name: uploads-volume
          mountPath: /app/uploads
        - name: config-volume
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: logs-volume
        persistentVolumeClaim:
          claimName: iacherie-logs-pvc
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: iacherie-uploads-pvc
      - name: config-volume
        configMap:
          name: iacherie-config
      imagePullSecrets:
      - name: iacherie-registry-secret
---
# API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: iacherie-api-gateway-service
  namespace: iacherie-production
  labels:
    app: iacherie-api-gateway
    component: api-gateway
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: websocket
    port: 8765
    targetPort: 8765
    protocol: TCP
  selector:
    app: iacherie-api-gateway
---
# Analytics Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-analytics
  namespace: iacherie-production
  labels:
    app: iacherie-analytics
    component: analytics
    version: v2.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: iacherie-analytics
  template:
    metadata:
      labels:
        app: iacherie-analytics
        component: analytics
        version: v2.0.0
    spec:
      serviceAccountName: iacherie-analytics-service-account
      containers:
      - name: analytics
        image: iacherie/analytics:2.0.0-production
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: ANALYTICS_PORT
          value: "8001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: iacherie-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: iacherie-secrets
              key: redis-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Analytics Service
apiVersion: v1
kind: Service
metadata:
  name: iacherie-analytics-service
  namespace: iacherie-production
  labels:
    app: iacherie-analytics
    component: analytics
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8001
    targetPort: 8001
    protocol: TCP
  selector:
    app: iacherie-analytics
---
# WebSocket Manager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-websocket-manager
  namespace: iacherie-production
  labels:
    app: iacherie-websocket-manager
    component: websocket
    version: v2.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: iacherie-websocket-manager
  template:
    metadata:
      labels:
        app: iacherie-websocket-manager
        component: websocket
        version: v2.0.0
    spec:
      containers:
      - name: websocket-manager
        image: iacherie/websocket-manager:2.0.0-production
        imagePullPolicy: Always
        ports:
        - containerPort: 8765
          name: websocket
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: WS_PORT
          value: "8765"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: iacherie-secrets
              key: redis-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
# WebSocket Manager Service
apiVersion: v1
kind: Service
metadata:
  name: iacherie-websocket-service
  namespace: iacherie-production
  labels:
    app: iacherie-websocket-manager
    component: websocket
spec:
  type: ClusterIP
  ports:
  - name: websocket
    port: 8765
    targetPort: 8765
    protocol: TCP
  selector:
    app: iacherie-websocket-manager
---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iacherie-postgres
  namespace: iacherie-production
  labels:
    app: iacherie-postgres
    component: database
spec:
  serviceName: iacherie-postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: iacherie-postgres
  template:
    metadata:
      labels:
        app: iacherie-postgres
        component: database
    spec:
      securityContext:
        runAsUser: 999
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: Always
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: "ainflue_prod"
        - name: POSTGRES_USER
          value: "ainflue_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iacherie-secrets
              key: postgres-password
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - ainflue_user
            - -d
            - ainflue_prod
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - ainflue_user
            - -d
            - ainflue_prod
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 50Gi
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: iacherie-postgres-service
  namespace: iacherie-production
  labels:
    app: iacherie-postgres
    component: database
spec:
  type: ClusterIP
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: iacherie-postgres
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-redis
  namespace: iacherie-production
  labels:
    app: iacherie-redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iacherie-redis
  template:
    metadata:
      labels:
        app: iacherie-redis
        component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: Always
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --requirepass
        - $(REDIS_PASSWORD)
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iacherie-secrets
              key: redis-password
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: iacherie-redis-pvc
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: iacherie-redis-service
  namespace: iacherie-production
  labels:
    app: iacherie-redis
    component: cache
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  selector:
    app: iacherie-redis
---
# Horizontal Pod Autoscaler for API Gateway
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iacherie-api-gateway-hpa
  namespace: iacherie-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iacherie-api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iacherie-ingress
  namespace: iacherie-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.iacherie.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  tls:
  - hosts:
    - api.iacherie.com
    - ws.iacherie.com
    secretName: iacherie-tls
  rules:
  - host: api.iacherie.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iacherie-api-gateway-service
            port:
              number: 8000
  - host: ws.iacherie.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iacherie-websocket-service
            port:
              number: 8765
---
# Network Policy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iacherie-network-policy
  namespace: iacherie-production
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: UDP
      port: 53