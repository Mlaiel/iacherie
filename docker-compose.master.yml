version: '3.8'

# Global configuration templates
x-common-variables: &common-variables
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: postgres-master
  REDIS_HOST: redis-master
  MONGODB_HOST: mongodb-primary
  MONITORING_ENABLED: "true"
  SECURITY_ENABLED: "true"

x-security-labels: &security-labels
  - "ainflue.security.scan=enabled"
  - "ainflue.compliance.gdpr=true"
  - "ainflue.compliance.ccpa=true"

x-resource-limits: &resource-limits
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 4G
      reservations:
        cpus: '0.5'
        memory: 1G
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 3

services:
  # =============================================================================
  # INFRASTRUCTURE LAYER
  # =============================================================================
  
  # Load Balancer
  nginx-lb:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    networks:
      - frontend-network
    labels:
      <<: *security-labels
      - "ainflue.layer=infrastructure"
      - "ainflue.component=load-balancer"

  # =============================================================================
  # AUDIO PROCESSING CLUSTER
  # =============================================================================
  
  audio-processing-cluster:
    extends:
      file: docker/audio/docker-compose.audio.yml
      service: audio-processing
    environment:
      <<: *common-variables
      CLUSTER_MODE: "true"
      INSTANCE_ID: "audio-01"
    labels:
      <<: *security-labels
      - "ainflue.layer=processing"
      - "ainflue.category=audio"
    <<: *resource-limits

  source-separation-cluster:
    extends:
      file: docker/audio/docker-compose.audio.yml
      service: source-separation
    environment:
      <<: *common-variables
      CLUSTER_MODE: "true"
    labels:
      <<: *security-labels
    <<: *resource-limits

  # =============================================================================
  # PROTECTION SERVICES CLUSTER
  # =============================================================================
  
  protection-cluster:
    extends:
      file: docker/protection/docker-compose.protection.yml
      service: protection-service
    environment:
      <<: *common-variables
      CLUSTER_MODE: "true"
      HIGH_AVAILABILITY: "true"
    labels:
      <<: *security-labels
      - "ainflue.layer=security"
      - "ainflue.category=protection"
    <<: *resource-limits

  fingerprinting-cluster:
    extends:
      file: docker/protection/docker-compose.protection.yml
      service: fingerprinting-engine
    environment:
      <<: *common-variables
      CLUSTER_MODE: "true"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  # =============================================================================
  # MONETIZATION SERVICES CLUSTER
  # =============================================================================
  
  monetization-cluster:
    extends:
      file: docker/monetization/docker-compose.monetization.yml
      service: revenue-tracker
    environment:
      <<: *common-variables
      CLUSTER_MODE: "true"
      FINANCIAL_COMPLIANCE: "true"
    labels:
      <<: *security-labels
      - "ainflue.layer=business"
      - "ainflue.category=monetization"
    <<: *resource-limits

  payment-processing-cluster:
    extends:
      file: docker/monetization/docker-compose.monetization.yml
      service: payment-processor
    environment:
      <<: *common-variables
      PCI_DSS_COMPLIANCE: "true"
      ENCRYPTION_AT_REST: "true"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

  # =============================================================================
  # USER-SPECIFIC SERVICE ORCHESTRATION
  # =============================================================================
  
  # Musician Services
  musician-orchestrator:
    image: ainflue/service-orchestrator:latest
    environment:
      <<: *common-variables
      USER_TYPE: "musician"
      ENABLED_SERVICES: "audio,protection,monetization,distribution"
      MUSIC_INDUSTRY_COMPLIANCE: "true"
    volumes:
      - musician_data:/data
    networks:
      - musician-network
      - backend-network
    labels:
      - "ainflue.user-type=musician"
      - "ainflue.orchestration=enabled"

  # Photographer Services  
  photographer-orchestrator:
    image: ainflue/service-orchestrator:latest
    environment:
      <<: *common-variables
      USER_TYPE: "photographer"
      ENABLED_SERVICES: "protection,seo,monetization,distribution"
      VISUAL_CONTENT_OPTIMIZATION: "true"
    volumes:
      - photographer_data:/data
    networks:
      - photographer-network
      - backend-network
    labels:
      - "ainflue.user-type=photographer"

  # =============================================================================
  # MONITORING & OBSERVABILITY
  # =============================================================================
  
  # Prometheus with enterprise configuration
  prometheus-enterprise:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=30d'
      - '--query.max-concurrency=50'
    volumes:
      - ./monitoring/prometheus/enterprise.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
    labels:
      - "ainflue.monitoring=prometheus"
      - "ainflue.tier=enterprise"

  # Grafana with custom dashboards
  grafana-enterprise:
    image: grafana/grafana-enterprise:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ENTERPRISE_LICENSE_TEXT: ${GRAFANA_LICENSE}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_LDAP_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3000:3000"
    networks:
      - monitoring-network

  # =============================================================================
  # SECURITY & COMPLIANCE
  # =============================================================================
  
  # Security scanner
  security-scanner:
    image: aquasec/trivy:latest
    command: ["server", "--listen", "0.0.0.0:8080"]
    ports:
      - "8080:8080"
    volumes:
      - trivy_cache:/root/.cache
    networks:
      - security-network
    labels:
      - "ainflue.security=scanner"
      - "ainflue.compliance=enabled"

  # Vault for secrets management
  vault-enterprise:
    image: vault:enterprise
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
    networks:
      - security-network

# =============================================================================
# ENTERPRISE VOLUMES
# =============================================================================
volumes:
  # User-specific data
  musician_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},rw
      device: ":/musician_data"
  
  photographer_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NFS_SERVER},rw
      device: ":/photographer_data"

  # Monitoring data
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  
  # Security data
  trivy_cache:
    driver: local
  vault_data:
    driver: local

# =============================================================================
# ENTERPRISE NETWORKS
# =============================================================================
networks:
  # Frontend network (DMZ)
  frontend-network:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 172.100.0.0/24
    labels:
      - "ainflue.network=frontend"
      - "ainflue.security=dmz"

  # Backend network (Internal)
  backend-network:
    driver: overlay
    internal: true
    ipam:
      config:
        - subnet: 172.101.0.0/24
    labels:
      - "ainflue.network=backend"
      - "ainflue.security=internal"

  # User-specific networks
  musician-network:
    driver: overlay
    ipam:
      config:
        - subnet: 172.110.0.0/24
  
  photographer-network:
    driver: overlay
    ipam:
      config:
        - subnet: 172.111.0.0/24

  # Infrastructure networks
  monitoring-network:
    driver: overlay
    ipam:
      config:
        - subnet: 172.120.0.0/24
  
  security-network:
    driver: overlay
    internal: true
    ipam:
      config:
        - subnet: 172.121.0.0/24

# =============================================================================
# ENTERPRISE SECRETS
# =============================================================================
secrets:
  ssl_certificate:
    external: true
  ssl_private_key:
    external: true
  database_credentials:
    external: true
  api_keys:
    external: true
  encryption_keys:
    external: true

# =============================================================================
# ENTERPRISE CONFIGS
# =============================================================================
configs:
  nginx_config:
    file: ./nginx/nginx.conf
  prometheus_config:
    file: ./monitoring/prometheus/enterprise.yml
  grafana_config:
    file: ./monitoring/grafana/grafana.ini