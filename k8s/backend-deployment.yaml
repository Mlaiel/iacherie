apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-backend
  namespace: iacherie-prod
  labels:
    app: iacherie-backend
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iacherie-backend
  template:
    metadata:
      labels:
        app: iacherie-backend
        tier: backend
    spec:
      containers:
      - name: backend
        image: gcr.io/iacherie/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        # Import toutes les variables depuis ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: ENVIRONMENT
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: DEBUG
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: LOG_LEVEL
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: HOST
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: PORT
        - name: WORKERS
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: WORKERS
        - name: API_V1_PREFIX
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: API_V1_PREFIX
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: CORS_ORIGINS
        - name: MAX_TOKENS
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: MAX_TOKENS
        - name: MODEL_CACHE_DIR
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: MODEL_CACHE_DIR
        
        # Import TOUTES les clés API depuis Secret
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: SECRET_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: JWT_SECRET
        - name: DATABASE_URL
          value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres-service:5432/iacherie"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: POSTGRES_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-service:6379/0"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: REDIS_PASSWORD
        
        # 🤖 IA APIs
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: OPENAI_API_KEY
        - name: HUGGINGFACE_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: HUGGINGFACE_API_KEY
        - name: GOOGLE_GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: GOOGLE_GEMINI_API_KEY
        - name: COHERE_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: COHERE_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: ANTHROPIC_API_KEY
              optional: true
        
        # 🎨 Image/Vidéo APIs
        - name: STABILITY_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: STABILITY_API_KEY
        - name: LEONARDO_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: LEONARDO_API_KEY
              optional: true
        - name: RUNWAYML_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: RUNWAYML_API_KEY
        - name: UNSPLASH_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: UNSPLASH_ACCESS_KEY
        
        # 🎵 Audio APIs
        - name: ELEVENLABS_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: ELEVENLABS_API_KEY
        - name: FREESOUND_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: FREESOUND_API_KEY
        
        # 📱 Social Media APIs
        - name: TWITTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: TWITTER_API_KEY
        - name: TWITTER_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: TWITTER_BEARER_TOKEN
        - name: INSTAGRAM_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: INSTAGRAM_ACCESS_TOKEN
        - name: FACEBOOK_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: FACEBOOK_ACCESS_TOKEN
        - name: DISCORD_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: DISCORD_BOT_TOKEN
        - name: YOUTUBE_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: YOUTUBE_API_KEY
        
        # 📧 Communication APIs
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: RESEND_API_KEY
        
        # 🔗 Utilitaires APIs
        - name: TINYURL_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: TINYURL_API_KEY
        - name: IPGEOLOCATION_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: IPGEOLOCATION_API_KEY
        - name: TEXTRAZOR_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: TEXTRAZOR_API_KEY
        - name: TYPEFORM_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: TYPEFORM_API_KEY
        
        # 📊 Analytics APIs
        - name: GOOGLE_ANALYTICS_API_SECRET
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: GOOGLE_ANALYTICS_API_SECRET
        - name: ALGOLIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: ALGOLIA_API_KEY
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: SENTRY_DSN
        
        # ☁️ Cloud APIs
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: SUPABASE_ANON_KEY
        - name: AZURE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: AZURE_CLIENT_SECRET
        - name: PINECONE_API_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: PINECONE_API_KEY
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: GITHUB_TOKEN
        
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        volumeMounts:
        - name: models-cache
          mountPath: /app/models
      
      volumes:
      - name: models-cache
        emptyDir:
          sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: iacherie-prod
  labels:
    app: iacherie-backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: iacherie-backend
