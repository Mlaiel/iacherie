apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-frontend
  namespace: iacherie-prod
  labels:
    app: iacherie-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iacherie-frontend
  template:
    metadata:
      labels:
        app: iacherie-frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/iacherie/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://iacherie.com/api"
        - name: NEXT_PUBLIC_WS_URL
          value: "wss://iacherie.com/api"
        
        # Clés publiques (safe for frontend)
        - name: NEXT_PUBLIC_SUPABASE_URL
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: SUPABASE_URL
        - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: iacherie-api-keys
              key: SUPABASE_ANON_KEY
        - name: NEXT_PUBLIC_GA_MEASUREMENT_ID
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: GOOGLE_ANALYTICS_MEASUREMENT_ID
        - name: NEXT_PUBLIC_ALGOLIA_APP_ID
          valueFrom:
            configMapKeyRef:
              name: iacherie-config
              key: ALGOLIA_APPLICATION_ID
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: iacherie-prod
  labels:
    app: iacherie-frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: iacherie-frontend
