# Ainflue Database Service
# Service definition for PostgreSQL database
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-database
  namespace: ainflue
  labels:
    app: ainflue-database
    component: database
    tier: data
    environment: production
  annotations:
    description: "PostgreSQL database service for Ainflue platform"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
  - name: metrics
    port: 9187
    targetPort: metrics
    protocol: TCP
  selector:
    app: ainflue-database
    component: database
  sessionAffinity: None

---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-redis
  namespace: ainflue
  labels:
    app: ainflue-redis
    component: cache
    tier: data
    environment: production
  annotations:
    description: "Redis cache service for Ainflue platform"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  - name: metrics
    port: 9121
    targetPort: metrics
    protocol: TCP
  selector:
    app: ainflue-redis
    component: cache
  sessionAffinity: None