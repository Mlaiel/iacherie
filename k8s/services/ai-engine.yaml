# Ainflue AI Engine Service
# Service definition for AI Engine
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-ai-engine
  namespace: ainflue
  labels:
    app: ainflue-ai-engine
    component: ai-engine
    tier: processing
    environment: production
  annotations:
    description: "AI Engine service for content analysis and protection"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9091"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 8001
    targetPort: grpc
    protocol: TCP
  - name: metrics
    port: 9091
    targetPort: metrics
    protocol: TCP
  - name: health
    port: 8081
    targetPort: health
    protocol: TCP
  selector:
    app: ainflue-ai-engine
    component: ai-engine
  sessionAffinity: None

---
# Headless service for service discovery
apiVersion: v1
kind: Service
metadata:
  name: ainflue-ai-engine-headless
  namespace: ainflue
  labels:
    app: ainflue-ai-engine
    component: ai-engine
    tier: processing
    environment: production
    service-type: headless
  annotations:
    description: "Headless service for AI Engine service discovery"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: grpc
    port: 8001
    targetPort: grpc
    protocol: TCP
  - name: metrics
    port: 9091
    targetPort: metrics
    protocol: TCP
  selector:
    app: ainflue-ai-engine
    component: ai-engine