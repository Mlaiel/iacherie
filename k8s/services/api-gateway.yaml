# Ainflue API Gateway Service
# Service definition for API Gateway
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-api-gateway
  namespace: ainflue
  labels:
    app: ainflue-api-gateway
    component: api-gateway
    tier: backend
    environment: production
  annotations:
    description: "API Gateway service for Ainflue platform"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  - name: health
    port: 8080
    targetPort: health
    protocol: TCP
  selector:
    app: ainflue-api-gateway
    component: api-gateway
  sessionAffinity: None

---
# Headless service for service discovery
apiVersion: v1
kind: Service
metadata:
  name: ainflue-api-gateway-headless
  namespace: ainflue
  labels:
    app: ainflue-api-gateway
    component: api-gateway
    tier: backend
    environment: production
    service-type: headless
  annotations:
    description: "Headless service for API Gateway service discovery"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: ainflue-api-gateway
    component: api-gateway