# Ainflue Platform Kubernetes Namespace
# Dedicated namespace for the Ainflue AI-powered Content Protection & Monetization Platform
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

---
apiVersion: v1
kind: Namespace
metadata:
  name: ainflue
  labels:
    name: ainflue
    environment: production
    app.kubernetes.io/name: ainflue
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: ainflue-platform
    app.kubernetes.io/managed-by: kubectl
    managed-by: fahed-mlaiel
  annotations:
    description: "Ainflue AI-powered Content Protection & Monetization Platform"
    contact: "mlaiel@live.de"
    created-by: "Fahed Mlaiel"
    
---
# Resource Quota for Ainflue Namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ainflue-quota
  namespace: ainflue
  labels:
    app.kubernetes.io/name: ainflue
    app.kubernetes.io/component: resource-quota
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    pods: "50"
    services: "20"
    secrets: "30"
    configmaps: "20"
    count/ingresses.networking.k8s.io: "5"
    count/horizontalpodautoscalers.autoscaling: "10"

---
# Limit Range for Ainflue Namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: ainflue-limits
  namespace: ainflue
  labels:
    app.kubernetes.io/name: ainflue
    app.kubernetes.io/component: limit-range
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 256Mi
    max:
      cpu: 2
      memory: 4Gi
      ephemeral-storage: 10Gi
    min:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 128Mi
  - type: PersistentVolumeClaim
    max:
      storage: 100Gi
    min:
      storage: 1Gi

---
# Network Policy for Ainflue Namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ainflue-default-deny
  namespace: ainflue
  labels:
    app.kubernetes.io/name: ainflue
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring