# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ainflue-api-gateway-config
  namespace: ainflue
  labels:
    app: ainflue-api-gateway
    component: api-gateway
    tier: backend
    environment: production
  annotations:
    description: "Configuration for API Gateway service"
data:
  # Application Configuration
  APP_NAME: "ainflue-api-gateway"
  APP_VERSION: "1.0.0"
  APP_ENVIRONMENT: "production"
  
  # Server Configuration
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8000"
  SERVER_WORKERS: "4"
  SERVER_TIMEOUT: "30"
  SERVER_KEEPALIVE: "65"
  
  # API Configuration
  API_VERSION: "v1"
  API_PREFIX: "/api/v1"
  API_DOCS_URL: "/docs"
  API_REDOC_URL: "/redoc"
  API_OPENAPI_URL: "/openapi.json"
  
  # CORS Configuration
  CORS_ORIGINS: "https://ainflue.com,https://www.ainflue.com,https://app.ainflue.com"
  CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  CORS_HEADERS: "Content-Type,Authorization,X-API-Key,X-Request-ID"
  CORS_EXPOSE_HEADERS: "X-Request-ID,X-Rate-Limit-Remaining"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_MAX_AGE: "86400"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW: "60"
  RATE_LIMIT_PER_IP: "100"
  
  # Security Configuration
  SECURITY_ENABLED: "true"
  SECURITY_CORS_ENABLED: "true"
  SECURITY_RATE_LIMITING_ENABLED: "true"
  SECURITY_CSRF_ENABLED: "true"
  SECURITY_XSS_PROTECTION: "true"
  
  # Database Configuration
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "30"
  DATABASE_POOL_TIMEOUT: "30"
  DATABASE_POOL_RECYCLE: "3600"
  DATABASE_ECHO: "false"
  
  # Cache Configuration
  CACHE_TYPE: "redis"
  CACHE_TTL: "3600"
  CACHE_PREFIX: "ainflue:api:"
  CACHE_SERIALIZER: "json"
  
  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  LOG_REQUESTS: "true"
  LOG_RESPONSES: "false"
  LOG_SQL: "false"
  
  # Monitoring Configuration
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  METRICS_PATH: "/metrics"
  HEALTH_CHECK_ENABLED: "true"
  HEALTH_CHECK_PORT: "8080"
  
  # Tracing Configuration
  TRACING_ENABLED: "true"
  TRACING_JAEGER_AGENT_HOST: "jaeger-agent"
  TRACING_JAEGER_AGENT_PORT: "6831"
  TRACING_SERVICE_NAME: "ainflue-api-gateway"
  
  # Feature Flags
  FEATURE_AI_ANALYSIS: "true"
  FEATURE_CONTENT_PROTECTION: "true"
  FEATURE_MONETIZATION: "true"
  FEATURE_COLLABORATION: "true"
  FEATURE_SEO_OPTIMIZATION: "true"
  
  # External Services
  AI_ENGINE_HOST: "ainflue-ai-engine"
  AI_ENGINE_PORT: "8001"
  AI_ENGINE_TIMEOUT: "30"
  
  # File Upload Configuration
  UPLOAD_MAX_SIZE: "100MB"
  UPLOAD_ALLOWED_EXTENSIONS: "jpg,jpeg,png,gif,mp4,avi,mov,mp3,wav"
  UPLOAD_STORAGE_TYPE: "s3"
  
  # Performance Configuration
  ASYNC_WORKERS: "10"
  ASYNC_POOL_SIZE: "50"
  CONNECTION_TIMEOUT: "30"
  READ_TIMEOUT: "60"
  
  # Timezone and Locale
  TIMEZONE: "UTC"
  LOCALE: "en_US.UTF-8"