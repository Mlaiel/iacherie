---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ainflue-database-config
  namespace: ainflue
  labels:
    app: ainflue-database
    component: database
    tier: data
    environment: production
  annotations:
    description: "PostgreSQL configuration for Ainflue platform"
data:
  # Database Configuration
  database_name: "ainflue_production"
  database_host: "ainflue-database"
  database_port: "5432"
  
  # PostgreSQL Configuration File
  postgresql.conf: |
    # Memory Settings
    shared_buffers = 256MB
    effective_cache_size = 1GB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    
    # Checkpoint Settings
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    default_statistics_target = 100
    
    # Connection Settings
    max_connections = 200
    listen_addresses = '*'
    port = 5432
    
    # Logging Settings
    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'pg_log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_min_duration_statement = 1000
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_statement = 'ddl'
    log_lock_waits = on
    log_temp_files = 0
    
    # Performance Settings
    random_page_cost = 1.1
    effective_io_concurrency = 200
    max_worker_processes = 8
    max_parallel_workers_per_gather = 4
    max_parallel_workers = 8
    max_parallel_maintenance_workers = 4
    
    # WAL Settings
    wal_level = replica
    max_wal_senders = 3
    max_replication_slots = 3
    wal_keep_segments = 32
    hot_standby = on
    
    # Vacuum Settings
    vacuum_cost_page_hit = 1
    vacuum_cost_page_miss = 10
    vacuum_cost_page_dirty = 20
    vacuum_cost_limit = 200
    
    # Auto Vacuum Settings
    autovacuum = on
    autovacuum_naptime = 1min
    autovacuum_vacuum_threshold = 50
    autovacuum_analyze_threshold = 50
    autovacuum_vacuum_scale_factor = 0.2
    autovacuum_analyze_scale_factor = 0.1
    autovacuum_vacuum_cost_delay = 20ms
    autovacuum_vacuum_cost_limit = -1

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ainflue-redis-config
  namespace: ainflue
  labels:
    app: ainflue-redis
    component: cache
    tier: data
    environment: production
  annotations:
    description: "Redis configuration for Ainflue platform"
data:
  redis.conf: |
    # Network
    bind 0.0.0.0
    port 6379
    timeout 300
    tcp-keepalive 60
    
    # General
    daemonize no
    pidfile /var/run/redis_6379.pid
    loglevel notice
    databases 16
    
    # Snapshotting
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    
    # Security
    requirepass ${REDIS_PASSWORD}
    
    # Memory Management
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    maxmemory-samples 5
    
    # Append Only File
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aof-load-truncated yes
    
    # Slow Log
    slowlog-log-slower-than 10000
    slowlog-max-len 128
    
    # Client Output Buffer Limits
    client-output-buffer-limit normal 0 0 0
    client-output-buffer-limit replica 256mb 64mb 60
    client-output-buffer-limit pubsub 32mb 8mb 60
    
    # Performance
    tcp-backlog 511
    hz 10
    dynamic-hz yes