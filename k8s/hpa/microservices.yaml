---
# Vertical Pod Autoscaler for Database (VPA instead of HPA for stateful services)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ainflue-database-vpa
  namespace: ainflue
  labels:
    app: ainflue-database
    component: database
    tier: data
    environment: production
  annotations:
    description: "VPA for PostgreSQL database to optimize resource allocation"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ainflue-database
  updatePolicy:
    updateMode: "Off"  # Recommendation only, no auto-updates for database
  resourcePolicy:
    containerPolicies:
    - containerName: postgres
      minAllowed:
        cpu: 200m
        memory: 512Mi
      maxAllowed:
        cpu: 2000m
        memory: 4Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
    - containerName: postgres-exporter
      minAllowed:
        cpu: 50m
        memory: 64Mi
      maxAllowed:
        cpu: 200m
        memory: 256Mi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits

---
# Vertical Pod Autoscaler for Redis
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ainflue-redis-vpa
  namespace: ainflue
  labels:
    app: ainflue-redis
    component: cache
    tier: data
    environment: production
  annotations:
    description: "VPA for Redis cache to optimize resource allocation"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ainflue-redis
  updatePolicy:
    updateMode: "Auto"  # Auto-update for cache service
  resourcePolicy:
    containerPolicies:
    - containerName: redis
      minAllowed:
        cpu: 100m
        memory: 256Mi
      maxAllowed:
        cpu: 1000m
        memory: 2Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
    - containerName: redis-exporter
      minAllowed:
        cpu: 50m
        memory: 64Mi
      maxAllowed:
        cpu: 200m
        memory: 256Mi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits

---
# HPA for future microservices (example template)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ainflue-content-protection-hpa
  namespace: ainflue
  labels:
    app: ainflue-content-protection
    component: content-protection
    tier: processing
    environment: production
  annotations:
    description: "HPA template for content protection microservice"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ainflue-content-protection
  minReplicas: 1
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      selectPolicy: Max

---
# HPA for monetization microservice
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ainflue-monetization-hpa
  namespace: ainflue
  labels:
    app: ainflue-monetization
    component: monetization
    tier: business
    environment: production
  annotations:
    description: "HPA for monetization microservice"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ainflue-monetization
  minReplicas: 2
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  - type: Pods
    pods:
      metric:
        name: payment_processing_queue_length
      target:
        type: AverageValue
        averageValue: "5"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
      - type: Percent
        value: 20
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      selectPolicy: Max