apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: platform-sync-service
    service-type: platform-service
  name: platform-sync-service-vs
  namespace: iacherie-staging
spec:
  hosts:
  - platform-sync-service.iacherie-staging.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: /
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
    route:
    - destination:
        host: platform-sync-service.iacherie-staging.svc.cluster.local
        port:
          number: 8008
    timeout: 30s
