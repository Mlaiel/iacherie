---
# AI Engine Service
apiVersion: v1
kind: Service
metadata:
  name: ainflue-ai-engine-service
  namespace: ainflue-production
  labels:
    app: ainflue-ai-engine
    component: ai-processing
    environment: production
  annotations:
    description: "AI Engine service for Ainflue platform"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9091
    targetPort: metrics
    protocol: TCP
  selector:
    app: ainflue-ai-engine
    component: ai-processing
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

