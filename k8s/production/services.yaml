---
# Main API Service
apiVersion: v1
kind: Service
metadata:
  name: ainflue-api-service
  namespace: ainflue-production
  labels:
    app: ainflue-api
    component: backend
    environment: production
  annotations:
    description: "Main API service for Ainflue platform"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: ainflue-api
    component: backend
  sessionAffinity: None

