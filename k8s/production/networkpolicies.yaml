---
# Default Deny All Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ainflue-production
  labels:
    app: security
    environment: production
  annotations:
    description: "Default deny all ingress and egress traffic"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Frontend Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ainflue-frontend-netpol
  namespace: ainflue-production
  labels:
    app: ainflue-frontend
    environment: production
  annotations:
    description: "Network policy for frontend pods"
spec:
  podSelector:
    matchLabels:
      app: ainflue-frontend
      component: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: nginx-ingress-controller
    ports:
    - protocol: TCP
      port: 3000
  # Allow traffic from load balancer
  - from:
    - podSelector:
        matchLabels:
          app: nginx-load-balancer
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow connection to API service
  - to:
    - podSelector:
        matchLabels:
          app: ainflue-api
          component: backend
    ports:
    - protocol: TCP
      port: 8000
  # Allow HTTPS egress for external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443

---
# API Backend Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ainflue-api-netpol
  namespace: ainflue-production
  labels:
    app: ainflue-api
    environment: production
  annotations:
    description: "Network policy for API backend pods"
spec:
  podSelector:
    matchLabels:
      app: ainflue-api
      component: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from frontend
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-frontend
          component: frontend
    ports:
    - protocol: TCP
      port: 8000
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: nginx-ingress-controller
    ports:
    - protocol: TCP
      port: 8000
  # Allow traffic from AI engine
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-ai-engine
          component: ai-processing
    ports:
    - protocol: TCP
      port: 8000
  # Allow traffic from content protection
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-content-protection
          component: protection
    ports:
    - protocol: TCP
      port: 8000
  # Allow traffic from analytics
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-analytics
          component: analytics
    ports:
    - protocol: TCP
      port: 8000
  # Allow monitoring scraping
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
          component: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow connection to database
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
          component: database
    ports:
    - protocol: TCP
      port: 5432
  # Allow connection to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
          component: cache
    ports:
    - protocol: TCP
      port: 6379
  # Allow connection to Elasticsearch
  - to:
    - podSelector:
        matchLabels:
          app: elasticsearch
          component: search
    ports:
    - protocol: TCP
      port: 9200
  # Allow HTTPS egress for external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow SMTP for email
  - to: []
    ports:
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 465

---
# AI Engine Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ainflue-ai-engine-netpol
  namespace: ainflue-production
  labels:
    app: ainflue-ai-engine
    environment: production
  annotations:
    description: "Network policy for AI engine pods"
spec:
  podSelector:
    matchLabels:
      app: ainflue-ai-engine
      component: ai-processing
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from API
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-api
          component: backend
    ports:
    - protocol: TCP
      port: 8001
  # Allow traffic from ingress controller for AI endpoints
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: nginx-ingress-controller
    ports:
    - protocol: TCP
      port: 8001
  # Allow monitoring scraping
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
          component: monitoring
    ports:
    - protocol: TCP
      port: 9091
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow connection to Redis for job queues
  - to:
    - podSelector:
        matchLabels:
          app: redis
          component: cache
    ports:
    - protocol: TCP
      port: 6379
  # Allow connection to MongoDB for model storage
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
          component: document-db
    ports:
    - protocol: TCP
      port: 27017
  # Allow HTTPS egress for model downloads
  - to: []
    ports:
    - protocol: TCP
      port: 443

