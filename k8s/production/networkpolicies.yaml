---
# Database Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-netpol
  namespace: ainflue-production
  labels:
    app: postgresql
    environment: production
  annotations:
    description: "Network policy for PostgreSQL database pods"
spec:
  podSelector:
    matchLabels:
      app: postgresql
      component: database
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from API
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-api
          component: backend
    ports:
    - protocol: TCP
      port: 5432
  # Allow traffic from analytics
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-analytics
          component: analytics
    ports:
    - protocol: TCP
      port: 5432
  # Allow traffic from content protection
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-content-protection
          component: protection
    ports:
    - protocol: TCP
      port: 5432
  # Allow traffic from backup jobs
  - from:
    - podSelector:
        matchLabels:
          app: database-backup
    ports:
    - protocol: TCP
      port: 5432
  # Allow monitoring
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
          component: monitoring
    ports:
    - protocol: TCP
      port: 9187  # postgres_exporter port
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow replication traffic between database pods
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
          component: database
    ports:
    - protocol: TCP
      port: 5432

---
# Redis Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-netpol
  namespace: ainflue-production
  labels:
    app: redis
    environment: production
  annotations:
    description: "Network policy for Redis cache pods"
spec:
  podSelector:
    matchLabels:
      app: redis
      component: cache
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from API
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-api
          component: backend
    ports:
    - protocol: TCP
      port: 6379
  # Allow traffic from AI engine
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-ai-engine
          component: ai-processing
    ports:
    - protocol: TCP
      port: 6379
  # Allow traffic from analytics
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-analytics
          component: analytics
    ports:
    - protocol: TCP
      port: 6379
  # Allow traffic from content protection
  - from:
    - podSelector:
        matchLabels:
          app: ainflue-content-protection
          component: protection
    ports:
    - protocol: TCP
      port: 6379
  # Allow monitoring
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
          component: monitoring
    ports:
    - protocol: TCP
      port: 9121  # redis_exporter port
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow cluster communication between Redis pods
  - to:
    - podSelector:
        matchLabels:
          app: redis
          component: cache
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 16379  # Redis cluster bus

---
# Monitoring Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-netpol
  namespace: ainflue-production
  labels:
    app: monitoring
    environment: production
  annotations:
    description: "Network policy for monitoring components"
spec:
  podSelector:
    matchLabels:
      component: monitoring
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from ingress controller for monitoring UI
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: nginx-ingress-controller
    ports:
    - protocol: TCP
      port: 9090  # Prometheus
    - protocol: TCP
      port: 3000  # Grafana
  # Allow internal monitoring communication
  - from:
    - podSelector:
        matchLabels:
          component: monitoring
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow scraping all pods with prometheus.io/scrape annotation
  - to:
    - podSelector: {}
  # Allow HTTPS egress for external alerting
  - to: []
    ports:
    - protocol: TCP
      port: 443

