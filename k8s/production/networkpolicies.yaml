---
# Egress Policy for External Services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-services-egress
  namespace: ainflue-production
  labels:
    app: external-egress
    environment: production
  annotations:
    description: "Allow specific egress to external services"
spec:
  podSelector:
    matchLabels:
      external-access: "allowed"
  policyTypes:
  - Egress
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS to external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP for health checks and webhooks
  - to: []
    ports:
    - protocol: TCP
      port: 80
  # Allow SMTP for email notifications
  - to: []
    ports:
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 465