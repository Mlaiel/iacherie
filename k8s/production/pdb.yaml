# Production Pod Disruption Budgets for Ainflue Platform
# Ensure high availability during cluster maintenance and disruptions
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

---
# Main API PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ainflue-api-pdb
  namespace: ainflue-production
  labels:
    app: ainflue-api
    component: backend
    environment: production
  annotations:
    description: "Pod Disruption Budget for Ainflue API - ensures minimum availability"
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ainflue-api
      component: backend
  maxUnavailable: 1

