---
# Spot Instance Node Group for General Workloads - AZ us-east-1a
apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  name: ainflue-spot-general-us-east-1a
  namespace: ainflue-production
  labels:
    environment: production
    node-type: spot-general
    availability-zone: us-east-1a
    cost-optimization: spot-instance
  annotations:
    description: "Spot instance node group for general workloads in us-east-1a"
    cluster-autoscaler/node-template/label/node-type: "spot-general"
    cluster-autoscaler/node-template/label/availability-zone: "us-east-1a"
    cluster-autoscaler/node-template/label/spot-instance: "true"
    cluster-autoscaler/node-template/taint/spot-instance: "true:NoSchedule"
spec:
  image: 099720109477/ubuntu/images/hvm-ssd/ubuntu-focal-20.04-amd64-server-20231025
  machineType: m5.large
  maxSize: 10
  minSize: 0
  rootVolumeSize: 50
  rootVolumeType: gp3
  rootVolumeIops: 3000
  subnets:
  - us-east-1a
  role: Node
  nodeLabels:
    node-type: spot-general
    availability-zone: us-east-1a
    spot-instance: "true"
    cost-optimization: enabled
    k8s.io/cluster-autoscaler/enabled: "true"
    k8s.io/cluster-autoscaler/ainflue-production: "owned"
  taints:
  - spot-instance=true:NoSchedule
  instanceMetadata:
    httpTokens: required
    httpPutResponseHopLimit: 1
  spotDurationInMinutes: 0  # No duration limit for maximum savings
  spotMaxPrice: "0.10"  # Maximum price per hour
  mixedInstancesPolicy:
    instances:
    - m5.large
    - m5.xlarge
    - m5a.large
    - m5a.xlarge
    - m4.large
    - m4.xlarge
    onDemandAboveBase: 0
    onDemandBase: 0
    spotAllocationStrategy: diversified
    spotInstancePools: 4
  cloudLabels:
    Environment: production
    Project: ainflue
    NodeType: spot-general
    CostOptimization: spot-instance
    k8s.io/cluster-autoscaler/enabled: "true"
    k8s.io/cluster-autoscaler/ainflue-production: "owned"

