# Spot Instance Node Group for AI/GPU Workloads - Multi-AZ
apiVersion: kops.k8s.io/v1alpha2
kind: InstanceGroup
metadata:
  name: ainflue-spot-gpu-multi-az
  namespace: ainflue-production
  labels:
    environment: production
    node-type: spot-gpu
    cost-optimization: spot-instance
    workload-type: ai-processing
  annotations:
    description: "Spot instance node group for AI/GPU workloads across multiple AZs"
    cluster-autoscaler/node-template/label/node-type: "spot-gpu"
    cluster-autoscaler/node-template/label/gpu-enabled: "true"
    cluster-autoscaler/node-template/label/spot-instance: "true"
    cluster-autoscaler/node-template/taint/spot-instance: "true:NoSchedule"
    cluster-autoscaler/node-template/taint/gpu-workload: "true:NoSchedule"
spec:
  image: 099720109477/ubuntu/images/hvm-ssd/ubuntu-focal-20.04-amd64-server-20231025
  machineType: g4dn.xlarge
  maxSize: 8
  minSize: 0
  rootVolumeSize: 100
  rootVolumeType: gp3
  rootVolumeIops: 3000
  subnets:
  - us-east-1a
  - us-east-1b
  - us-east-1c
  role: Node
  nodeLabels:
    node-type: spot-gpu
    gpu-enabled: "true"
    spot-instance: "true"
    cost-optimization: enabled
    nvidia.com/gpu.present: "true"
    k8s.io/cluster-autoscaler/enabled: "true"
    k8s.io/cluster-autoscaler/ainflue-production: "owned"
  taints:
  - spot-instance=true:NoSchedule
  - gpu-workload=true:NoSchedule
  - nvidia.com/gpu=true:NoSchedule
  instanceMetadata:
    httpTokens: required
    httpPutResponseHopLimit: 1
  spotDurationInMinutes: 0
  spotMaxPrice: "0.50"  # Higher price for GPU instances
  mixedInstancesPolicy:
    instances:
    - g4dn.xlarge
    - g4dn.2xlarge
    - g4ad.xlarge
    - g4ad.2xlarge
    onDemandAboveBase: 0
    onDemandBase: 0
    spotAllocationStrategy: diversified
    spotInstancePools: 2
  cloudLabels:
    Environment: production
    Project: ainflue
    NodeType: spot-gpu
    CostOptimization: spot-instance
    WorkloadType: ai-processing
    k8s.io/cluster-autoscaler/enabled: "true"
    k8s.io/cluster-autoscaler/ainflue-production: "owned"
  # GPU driver installation
  additionalUserData: |
    #!/bin/bash
    # Install NVIDIA drivers and container runtime
    curl -s -L https://nvidia.github.io/nvidia-docker/gpgkey | apt-key add -
    distribution=$(. /etc/os-release;echo $ID$VERSION_ID)
    curl -s -L https://nvidia.github.io/nvidia-docker/$distribution/nvidia-docker.list | tee /etc/apt/sources.list.d/nvidia-docker.list
    apt-get update && apt-get install -y nvidia-docker2
    systemctl restart docker
    
    # Install NVIDIA device plugin
    kubectl apply -f https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.14.0/nvidia-device-plugin.yml

