# Rate Limiting Configuration for Ainflue Platform
# Comprehensive rate limiting rules for different endpoints
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=global:10m rate=2000r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=1000r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=50r/m;
limit_req_zone $binary_remote_addr zone=ai_processing:10m rate=200r/m;
limit_req_zone $binary_remote_addr zone=content_protection:10m rate=500r/m;
limit_req_zone $binary_remote_addr zone=analytics:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=search:10m rate=400r/m;
limit_req_zone $binary_remote_addr zone=websocket:10m rate=100r/m;

# Rate limiting by user (using JWT token hash if available)
limit_req_zone $http_authorization zone=user_api:10m rate=5000r/m;
limit_req_zone $http_authorization zone=user_upload:10m rate=200r/m;

# Rate limiting by API key
limit_req_zone $http_x_api_key zone=api_key:10m rate=10000r/m;

# Connection limiting zones
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_zone $server_name zone=perserver:10m;
limit_conn_zone $http_authorization zone=peruser:10m;

# Geographic rate limiting (example for high-risk countries)
geo $rate_limit_geo {
    default 0;
    # Add specific IP ranges that need stricter limits
    # 192.168.1.0/24 1;
}

map $rate_limit_geo $rate_limit_zone {
    0 api;
    1 api_restricted;
}

# Rate limiting for restricted zones
limit_req_zone $binary_remote_addr zone=api_restricted:10m rate=100r/m;

# Status code rate limiting (limit based on response codes)
limit_req_status 429;

# Custom rate limiting headers
add_header X-RateLimit-Limit $limit_req_rate always;
add_header X-RateLimit-Remaining $limit_req_remaining always;
add_header X-RateLimit-Reset $limit_req_reset always;

# Bot detection rate limiting
map $http_user_agent $is_bot {
    default 0;
    ~*bot 1;
    ~*crawler 1;
    ~*spider 1;
    ~*scraper 1;
}

limit_req_zone $binary_remote_addr zone=bots:10m rate=10r/m;

# Rate limiting based on request method
map $request_method $method_limit_zone {
    GET api_get;
    POST api_post;
    PUT api_put;
    DELETE api_delete;
    PATCH api_patch;
    default api;
}

limit_req_zone $binary_remote_addr zone=api_get:10m rate=2000r/m;
limit_req_zone $binary_remote_addr zone=api_post:10m rate=500r/m;
limit_req_zone $binary_remote_addr zone=api_put:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=api_delete:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=api_patch:10m rate=200r/m;