# Production Nginx Configuration for Ainflue Platform
# High-performance load balancing, SSL termination, and security
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Maximum number of connections
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    # Basic Settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Character encoding
    charset utf-8;
    
    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time" '
                   'cache_status="$upstream_cache_status"';
    
    log_format json escape=json '{'
                   '"time_local":"$time_local",'
                   '"remote_addr":"$remote_addr",'
                   '"remote_user":"$remote_user",'
                   '"request":"$request",'
                   '"status":"$status",'
                   '"body_bytes_sent":"$body_bytes_sent",'
                   '"request_time":"$request_time",'
                   '"http_referrer":"$http_referer",'
                   '"http_user_agent":"$http_user_agent",'
                   '"upstream_addr":"$upstream_addr",'
                   '"upstream_status":"$upstream_status",'
                   '"upstream_response_time":"$upstream_response_time",'
                   '"upstream_cache_status":"$upstream_cache_status"'
                   '}';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Performance Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    types_hash_bucket_size 64;
    server_names_hash_bucket_size 128;
    server_names_hash_max_size 512;
    server_tokens off;
    
    # Buffer Settings
    client_body_buffer_size 128k;
    client_max_body_size 100m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    output_buffers 1 32k;
    postpone_output 1460;
    
    # Gzip Compression Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/x-font-truetype
        application/font-woff
        application/font-woff2
        font/opentype
        font/eot
        font/otf
        image/svg+xml
        image/x-icon
        image/vnd.microsoft.icon;
    
    # Brotli Compression (if module available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=50r/m;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=protection_limit:10m rate=500r/m;
    limit_req_zone $binary_remote_addr zone=analytics_limit:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=global_limit:10m rate=2000r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;
    
    # Proxy Cache Configuration
    proxy_cache_path /var/cache/nginx/main 
                     levels=1:2 
                     keys_zone=main_cache:100m 
                     max_size=2g 
                     inactive=60m 
                     use_temp_path=off;
    
    proxy_cache_path /var/cache/nginx/static 
                     levels=1:2 
                     keys_zone=static_cache:50m 
                     max_size=1g 
                     inactive=7d 
                     use_temp_path=off;
    
    proxy_cache_path /var/cache/nginx/api 
                     levels=1:2 
                     keys_zone=api_cache:50m 
                     max_size=500m 
                     inactive=30m 
                     use_temp_path=off;
    
    # FastCGI Cache (if needed)
    fastcgi_cache_path /var/cache/nginx/fastcgi 
                       levels=1:2 
                       keys_zone=fastcgi_cache:50m 
                       max_size=500m 
                       inactive=30m;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    
    # OCSP resolver
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;
    
    # Security Headers (Global)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Download-Options "noopen" always;
    
    # Upstream Configurations
    upstream ainflue_api {
        least_conn;
        server ainflue-api-service:80 max_fails=3 fail_timeout=30s weight=100;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    
    upstream ainflue_frontend {
        least_conn;
        server ainflue-frontend-service:80 max_fails=3 fail_timeout=30s weight=100;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    
    upstream ainflue_ai_engine {
        least_conn;
        server ainflue-ai-engine-service:80 max_fails=3 fail_timeout=30s weight=100;
        keepalive 16;
        keepalive_requests 100;
        keepalive_timeout 120s;
    }
    
    upstream ainflue_content_protection {
        least_conn;
        server ainflue-content-protection-service:80 max_fails=3 fail_timeout=30s weight=100;
        keepalive 16;
        keepalive_requests 500;
        keepalive_timeout 60s;
    }
    
    upstream ainflue_analytics {
        least_conn;
        server ainflue-analytics-service:80 max_fails=3 fail_timeout=30s weight=100;
        keepalive 16;
        keepalive_requests 500;
        keepalive_timeout 60s;
    }
    
    # Maps for dynamic configurations
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    
    map $request_uri $cache_bypass {
        ~*/api/v1/auth/ 1;
        ~*/api/v1/admin/ 1;
        ~*/api/v1/user/ 1;
        default 0;
    }
    
    map $http_origin $cors_origin {
        ~^https?://(.*\.)?ainflue\.com$ $http_origin;
        default "";
    }
    
    # Include additional configurations
    include /etc/nginx/conf.d/*.conf;
    
    # Default Server (Catch-all)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Security
        return 444;
    }
    
    # HTTP to HTTPS Redirect Server
    server {
        listen 80;
        listen [::]:80;
        server_name ainflue.com www.ainflue.com api.ainflue.com app.ainflue.com static.ainflue.com cdn.ainflue.com monitoring.ainflue.com;
        
        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }
        
        # Redirect everything else to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    # Main Application Server (Frontend)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ainflue.com www.ainflue.com;
        
        # SSL Configuration
        ssl_certificate /etc/ssl/certs/ainflue.crt;
        ssl_certificate_key /etc/ssl/private/ainflue.key;
        ssl_dhparam /etc/ssl/certs/dhparam.pem;
        
        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # CSP for frontend
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.google-analytics.com *.googletagmanager.com *.hotjar.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: *.google-analytics.com *.googletagmanager.com *.hotjar.com; connect-src 'self' *.ainflue.com wss: ws:; frame-ancestors 'self';" always;
        
        # Rate limiting
        limit_req zone=global_limit burst=500 nodelay;
        limit_conn perip 50;
        limit_conn perserver 1000;
        
        # Root and index
        root /var/www/html;
        index index.html index.htm;
        
        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Main location
        location / {
            proxy_pass http://ainflue_frontend;
            proxy_cache main_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $cache_bypass;
            proxy_no_cache $cache_bypass;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            
            # Add cache status header
            add_header X-Cache-Status $upstream_cache_status always;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
        
        # WebSocket support
        location /ws/ {
            proxy_pass http://ainflue_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass 1;
        }
        
        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Static files with aggressive caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|svg|woff|woff2|ttf|eot|otf)$ {
            proxy_pass http://ainflue_frontend;
            proxy_cache static_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1h;
            
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
        }
    }
    
    # API Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.ainflue.com;
        
        # SSL Configuration
        ssl_certificate /etc/ssl/certs/api.ainflue.crt;
        ssl_certificate_key /etc/ssl/private/api.ainflue.key;
        
        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # API-specific headers
        add_header X-API-Version "1.0.0" always;
        add_header X-Response-Time $request_time always;
        add_header X-Request-ID $request_id always;
        
        # Rate limiting for API
        limit_req zone=api_limit burst=200 nodelay;
        limit_conn perip 20;
        
        # CORS configuration
        location / {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 3600;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # Add CORS headers for actual requests
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            
            proxy_pass http://ainflue_api;
            proxy_cache api_cache;
            proxy_cache_valid 200 302 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_bypass $cache_bypass;
            proxy_no_cache $cache_bypass;
            
            # Timeouts for API
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Disable buffering for streaming responses
            proxy_buffering off;
            proxy_request_buffering off;
        }
        
        # AI Engine endpoints
        location /api/v1/ai/ {
            limit_req zone=ai_limit burst=50 nodelay;
            
            proxy_pass http://ainflue_ai_engine/;
            proxy_cache off;
            
            # Extended timeouts for AI processing
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Disable buffering
            proxy_buffering off;
            proxy_request_buffering off;
        }
        
        # Content Protection endpoints
        location /api/v1/protection/ {
            limit_req zone=protection_limit burst=100 nodelay;
            
            proxy_pass http://ainflue_content_protection/;
            proxy_cache api_cache;
            proxy_cache_valid 200 10m;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
        
        # Analytics endpoints
        location /api/v1/analytics/ {
            limit_req zone=analytics_limit burst=75 nodelay;
            
            proxy_pass http://ainflue_analytics/;
            proxy_cache api_cache;
            proxy_cache_valid 200 15m;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }
        
        # Authentication endpoints (no caching, strict rate limiting)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            
            proxy_pass http://ainflue_api;
            proxy_cache off;
            proxy_no_cache 1;
            
            # Add additional security headers
            add_header X-Auth-Endpoint "true" always;
        }
        
        # File upload endpoints
        location /api/v1/upload/ {
            limit_req zone=upload_limit burst=10 nodelay;
            
            # Increase body size for uploads
            client_max_body_size 1000m;
            client_body_timeout 300s;
            
            proxy_pass http://ainflue_api;
            proxy_cache off;
            
            # Extended timeouts for uploads
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # Enable request buffering for uploads
            proxy_request_buffering on;
        }
    }
    
    # Application Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.ainflue.com;
        
        # SSL Configuration
        ssl_certificate /etc/ssl/certs/app.ainflue.crt;
        ssl_certificate_key /etc/ssl/private/app.ainflue.key;
        
        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # App-specific CSP
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' api.ainflue.com wss: ws:;" always;
        
        location / {
            proxy_pass http://ainflue_frontend;
            proxy_cache main_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_bypass $cache_bypass;
        }
    }
    
    # Static CDN Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name static.ainflue.com cdn.ainflue.com;
        
        # SSL Configuration
        ssl_certificate /etc/ssl/certs/static.ainflue.crt;
        ssl_certificate_key /etc/ssl/private/static.ainflue.key;
        
        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # Aggressive caching for static assets
        location / {
            proxy_pass http://ainflue_frontend;
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1h;
            
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            
            # Disable logging for static files
            access_log off;
        }
    }
    
    # Monitoring Server (with basic auth)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name monitoring.ainflue.com;
        
        # SSL Configuration
        ssl_certificate /etc/ssl/certs/monitoring.ainflue.crt;
        ssl_certificate_key /etc/ssl/private/monitoring.ainflue.key;
        
        # Basic authentication
        auth_basic "Ainflue Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        # IP whitelist (adjust as needed)
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        location / {
            return 403;
        }
        
        location /prometheus/ {
            proxy_pass http://prometheus-service:9090/;
            proxy_cache off;
        }
        
        location /grafana/ {
            proxy_pass http://grafana-service:3000/;
            proxy_cache off;
        }
    }
}

# Stream configuration for TCP/UDP load balancing (if needed)
stream {
    # Log format for stream
    log_format stream '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/stream.log stream;
    
    # Example TCP load balancing for database connections
    # upstream database_pool {
    #     server postgresql-service:5432 max_fails=3 fail_timeout=30s;
    # }
    # 
    # server {
    #     listen 5432;
    #     proxy_pass database_pool;
    #     proxy_timeout 1s;
    #     proxy_responses 1;
    # }
}