apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-frontend
  namespace: iacherie-production
  labels:
    app: iacherie-frontend
    component: frontend
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: iacherie-frontend
  template:
    metadata:
      labels:
        app: iacherie-frontend
        component: frontend
        environment: production
    spec:
      containers:
      - name: iacherie-frontend
        image: iacherie/frontend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.iacherie.com"
        - name: NEXT_PUBLIC_APP_VERSION
          value: "1.0.0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: iacherie-frontend-service
  namespace: iacherie-production
  labels:
    app: iacherie-frontend
    component: frontend
spec:
  selector:
    app: iacherie-frontend
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP