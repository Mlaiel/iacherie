# 📊 Compliance Monitoring and Alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: compliance-alerts
  namespace: iacherie-system
  labels:
    app: compliance-monitoring
spec:
  groups:
  - name: compliance.rules
    rules:
    - alert: GDPRDataRetentionViolation
      expr: |
        (time() - gdpr_data_creation_timestamp) > gdpr_retention_period_seconds
      for: 0m
      labels:
        severity: critical
        compliance: gdpr
      annotations:
        summary: "GDPR data retention violation"
        description: "Data type {{ $labels.data_type }} has exceeded retention period"
    
    - alert: PCIUnencryptedCardholderData
      expr: |
        pci_cardholder_data_encrypted == 0
      for: 0m
      labels:
        severity: critical
        compliance: pci-dss
      annotations:
        summary: "PCI DSS violation - unencrypted cardholder data"
        description: "Unencrypted cardholder data detected in {{ $labels.location }}"
    
    - alert: SOC2AvailabilityBreach
      expr: |
        rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.001
      for: 5m
      labels:
        severity: warning
        compliance: soc2
      annotations:
        summary: "SOC 2 availability target at risk"
        description: "Service availability below 99.9% target"
    
    - alert: ComplianceAuditLogFailure
      expr: |
        rate(audit_log_errors_total[5m]) > 0
      for: 1m
      labels:
        severity: critical
        compliance: all
      annotations:
        summary: "Compliance audit logging failure"
        description: "Audit log errors detected - compliance at risk"
    
    - alert: DataClassificationViolation
      expr: |
        unclassified_data_count > 0
      for: 0m
      labels:
        severity: warning
        compliance: data-governance
      annotations:
        summary: "Data classification violation"
        description: "{{ $value }} unclassified data items detected"
---
# 🔍 Compliance Scanning Job
apiVersion: batch/v1
kind: CronJob
metadata:
  name: compliance-scan
  namespace: iacherie-system
  labels:
    app: compliance-scanning
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: compliance-scanner
          restartPolicy: OnFailure
          containers:
          - name: compliance-scanner
            image: iacherie/compliance-scanner:v1.0.0
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting compliance scan at $(date)"
              
              # GDPR Compliance Scan
              echo "Scanning for GDPR compliance..."
              ./gdpr-scan.sh
              
              # PCI DSS Compliance Scan
              echo "Scanning for PCI DSS compliance..."
              ./pci-scan.sh
              
              # SOC 2 Compliance Scan
              echo "Scanning for SOC 2 compliance..."
              ./soc2-scan.sh
              
              # Data Classification Scan
              echo "Scanning data classification..."
              ./data-classification-scan.sh
              
              # Generate compliance report
              echo "Generating compliance report..."
              ./generate-report.sh
              
              echo "Compliance scan completed at $(date)"
            env:
            - name: SCAN_MODE
              value: "automated"
            - name: NOTIFICATION_WEBHOOK
              valueFrom:
                secretRef:
                  name: compliance-notifications
                  key: webhook-url
            volumeMounts:
            - name: scan-results
              mountPath: /results
            - name: compliance-config
              mountPath: /config
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 2
                memory: 4Gi
          volumes:
          - name: scan-results
            persistentVolumeClaim:
              claimName: compliance-scan-results
          - name: compliance-config
            configMap:
              name: global-compliance-config
---
# 📋 Data Subject Rights Management
apiVersion: v1
