# 🛡️ Global Compliance Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: global-compliance-config
  namespace: iacherie-system
  labels:
    app: compliance-management
    component: global-config
data:
  compliance.yaml: |
    # Global Compliance Configuration
    compliance:
      # Framework Configuration
      frameworks:
        gdpr:
          enabled: true
          region: "EU"
          controller: "iacherie Creator Economy Platform"
          dpo: "dpo@iacherie.com"
          supervisoryAuthority: "CNIL"
          dataRetentionDefault: "30d"
          consentRequired: true
          rightToErasure: true
          dataPortability: true
          
        pci:
          enabled: true
          level: "Level 1"  # Level 1, 2, 3, or 4
          merchantId: "IACHERIE001"
          acquirer: "First Data"
          assessor: "QSA Company"
          validationMethod: "self-assessment"  # self-assessment, qsa-onsite
          
        soc2:
          enabled: true
          type: "Type II"  # Type I, Type II
          criteria: ["security", "availability", "processing", "confidentiality"]
          auditor: "Independent Auditor LLC"
          reportingPeriod: "12m"
          
        ccpa:
          enabled: true
          businessType: "business"
          thresholdMet: true
          doNotSellOptOut: true
          dataSubjectRights: true
          
        hipaa:
          enabled: false  # Enable if health data is processed
          entity: "covered-entity"  # covered-entity, business-associate
          safeguards: ["administrative", "physical", "technical"]
          
        iso27001:
          enabled: true
          scope: "Information Security Management"
          certificationBody: "ISO Certification Authority"
          controls: "Annex A"
      
      # Data Classification
      dataClassification:
        enabled: true
        levels:
          public:
            description: "Information available to the public"
            retention: "unlimited"
            encryption: "optional"
            access: "unrestricted"
            
          internal:
            description: "Internal business information"
            retention: "7y"
            encryption: "recommended"
            access: "employee-only"
            
          confidential:
            description: "Sensitive business information"
            retention: "5y"
            encryption: "required"
            access: "authorized-personnel"
            
          restricted:
            description: "Highly sensitive information"
            retention: "3y"
            encryption: "end-to-end"
            access: "need-to-know"
            
          personal:
            description: "Personal data under GDPR"
            retention: "lawful-basis-dependent"
            encryption: "required"
            access: "data-processor-only"
            
        dataTypes:
          - name: "personal-data"
            classification: "personal"
            examples: ["email", "name", "address", "phone"]
            specialCategories: false
            
          - name: "special-personal-data"
            classification: "restricted"
            examples: ["biometric", "health", "political-opinions"]
            specialCategories: true
            
          - name: "payment-data"
            classification: "restricted"
            examples: ["credit-card", "bank-account", "payment-token"]
            specialCategories: false
            pciScope: true
            
          - name: "creator-content"
            classification: "confidential"
            examples: ["videos", "images", "drafts", "analytics"]
            specialCategories: false
            
          - name: "business-data"
            classification: "internal"
            examples: ["metrics", "reports", "configurations"]
            specialCategories: false
      
      # Audit Configuration
      audit:
        enabled: true
        retention: "7y"
        encryption: "AES-256-GCM"
        integrity: "SHA-256"
        storage: ["local", "cloud", "archive"]
        
        events:
          - "data-access"
          - "data-modification"
          - "authentication"
          - "authorization"
          - "configuration-changes"
          - "privacy-requests"
          - "consent-changes"
          - "data-breaches"
          
        frequency: "real-time"
        monitoring: "24x7"
        alerts: true
        
      # Privacy Configuration
      privacy:
        cookieConsent:
          enabled: true
          granular: true
          categories: ["necessary", "functional", "analytics", "marketing"]
          
        dataSubjectRights:
          access: true
          rectification: true
          erasure: true
          portability: true
          restriction: true
          objection: true
          
        consentManagement:
          explicit: true
          withdrawable: true
          granular: true
          proofOfConsent: true
          
        privacyByDesign:
          dataMinimization: true
          purposeLimitation: true
          storageMinimization: true
          transparencyByDefault: true
          
      # Security Controls
      securityControls:
        encryption:
          atRest: "AES-256-GCM"
          inTransit: "TLS-1.3"
          keyManagement: "FIPS-140-2-Level-3"
          
        accessControls:
          authentication: "multi-factor"
          authorization: "role-based"
          sessionManagement: "secure"
          privilegedAccess: "monitored"
          
        networkSecurity:
          segmentation: true
          firewalls: true
          intrusion: "detection-and-prevention"
          monitoring: "continuous"
          
        applicationSecurity:
          secure-coding: true
          vulnerability-scanning: "automated"
          penetration-testing: "quarterly"
          code-review: "mandatory"
          
      # Incident Response
      incidentResponse:
        enabled: true
        team: "security-incident-response-team@iacherie.com"
        procedures: "documented"
        training: "annual"
        
        breachNotification:
          authorities: "72h"
          dataSubjects: "without-undue-delay"
          documentation: "required"
          
        forensics:
          enabled: true
          preservation: "automatic"
          chain-of-custody: "maintained"
          
      # Vendor Management
      vendorManagement:
        enabled: true
        dueDigence: "mandatory"
        contracts: "compliant"
        monitoring: "ongoing"
        
        assessments:
          security: "required"
          privacy: "required"
          compliance: "required"
          frequency: "annual"
---
