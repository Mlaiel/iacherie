---
# 📋 Compliance Reports Generation
apiVersion: batch/v1
kind: CronJob
metadata:
  name: compliance-reporting
  namespace: iacherie-system
  labels:
    app: compliance-reporting
spec:
  schedule: "0 6 1 * *"  # Monthly on 1st at 6 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: compliance-reporter
          restartPolicy: OnFailure
          containers:
          - name: compliance-reporter
            image: iacherie/compliance-reporter:v1.0.0
            command:
            - /bin/sh
            - -c
            - |
              echo "Generating monthly compliance report..."
              
              # Generate GDPR report
              ./generate-gdpr-report.sh
              
              # Generate PCI DSS report
              ./generate-pci-report.sh
              
              # Generate SOC 2 report
              ./generate-soc2-report.sh
              
              # Generate privacy impact assessment
              ./generate-pia-report.sh
              
              # Combine reports
              ./combine-reports.sh
              
              # Send to stakeholders
              ./distribute-reports.sh
              
              echo "Compliance reporting completed"
            env:
            - name: REPORT_PERIOD
              value: "monthly"
            - name: OUTPUT_FORMAT
              value: "pdf"
            volumeMounts:
            - name: reports-storage
              mountPath: /reports
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 2
                memory: 4Gi
          volumes:
          - name: reports-storage
            persistentVolumeClaim:
              claimName: compliance-reports-pvc

