  rights-management.yaml: |
    # Data Subject Rights Management
    dataSubjectRights:
      requests:
        channels: ["web-form", "email", "phone"]
        verification: "multi-factor"
        timeframes:
          acknowledgment: "72h"
          response: "30d"
          fulfillment: "30d"
        
      access:
        formats: ["JSON", "CSV", "PDF"]
        delivery: ["secure-download", "encrypted-email"]
        scope: "all-personal-data"
        
      rectification:
        verification: "required"
        approval: "data-controller"
        notification: "downstream-recipients"
        
      erasure:
        exceptions: ["legal-obligation", "legitimate-interest"]
        verification: "identity-verification"
        confirmation: "certificate-of-deletion"
        
      portability:
        formats: ["JSON", "XML"]
        transmission: "secure-transfer"
        scope: "structured-data"
        
      restriction:
        triggers: ["accuracy-contested", "unlawful-processing"]
        duration: "until-resolved"
        notification: "data-subjects"
        
      objection:
        processing: ["direct-marketing", "legitimate-interest"]
        effect: "immediate-cessation"
        exceptions: ["compelling-legitimate-grounds"]
        
      automation:
        enabled: true
        workflows: ["verification", "data-retrieval", "fulfillment"]
        approval: "human-review"
        
      reporting:
        frequency: "monthly"
        metrics: ["request-volume", "response-time", "fulfillment-rate"]
        compliance: "regulatory-reporting"
