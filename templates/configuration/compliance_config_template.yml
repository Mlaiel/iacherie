            - "Default password changes"
            - "Unnecessary services disabled"
            - "System hardening"
            
        req3:
          name: "Cardholder Data Protection"
          implemented: true
          controls:
            - "Data encryption AES-256"
            - "Key management FIPS 140-2"
            - "Data masking"
            
        req4:
          name: "Encryption in Transit"
          implemented: true
          controls:
            - "TLS 1.3 minimum"
            - "Strong cryptography"
            - "Certificate management"
            
        req5:
          name: "Anti-virus"
          implemented: true
          controls:
            - "Regular updates"
            - "Real-time scanning"
            - "Centralized management"
            
        req6:
          name: "Secure Development"
          implemented: true
          controls:
            - "Secure coding practices"
            - "Vulnerability scanning"
            - "Code review"
            
        req7:
          name: "Access Control"
          implemented: true
          controls:
            - "Need-to-know basis"
            - "Role-based access"
            - "Least privilege"
            
        req8:
          name: "User Authentication"
          implemented: true
          controls:
            - "Multi-factor authentication"
            - "Strong passwords"
            - "Account lockout"
            
        req9:
          name: "Physical Access"
          implemented: true
          controls:
            - "Facility access controls"
            - "Visitor management"
            - "Media handling"
            
        req10:
          name: "Monitoring"
          implemented: true
          controls:
            - "Audit logging"
            - "Log monitoring"
            - "Time synchronization"
            
        req11:
          name: "Security Testing"
          implemented: true
          controls:
            - "Vulnerability scans"
            - "Penetration testing"
            - "Intrusion detection"
            
        req12:
          name: "Information Security Policy"
          implemented: true
          controls:
            - "Security policy"
            - "Security awareness"
            - "Incident response"
            
      cardholderDataEnvironment:
        systems:
          - "Payment processing API"
          - "Database servers"
          - "Web application servers"
          
        network:
          segmentation: true
          vlans: ["VLAN-100", "VLAN-200"]
          firewalls: ["PCI-FW-01", "PCI-FW-02"]
          
        storage:
          prohibited: ["track-data", "cvc2", "pin"]
          encrypted: ["pan", "cardholder-name"]
          tokenized: true
          
      assessments:
        qsa: "Qualified Security Assessor"
        frequency: "annual"
        scope: "full-assessment"
        
      compensatingControls: []
