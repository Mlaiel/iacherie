# 🌐 Global Traffic Management Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: global-traffic-config
  namespace: iacherie-system
  labels:
    app: traffic-management
    component: global-config
data:
  traffic-management.yaml: |
    # Global Traffic Management Configuration
    globalTrafficManagement:
      # Load Balancing Configuration
      loadBalancing:
        defaultPolicy: "round_robin"  # round_robin, least_request, random, ring_hash, maglev
        localityPreference:
          enabled: true
          failover:
            enabled: true
            regions: ["us-west-2", "us-east-1", "eu-west-1"]
        healthCheck:
          enabled: true
          interval: "10s"
          timeout: "3s"
          unhealthyThreshold: 3
          healthyThreshold: 2
          path: "/health"
          httpHeaders:
            - name: "User-Agent"
              value: "iacherie-health-checker/1.0"
        outlierDetection:
          enabled: true
          consecutiveErrors: 5
          interval: "30s"
          baseEjectionTime: "30s"
          maxEjectionPercent: 50
          minHealthPercent: 50
      
      # Circuit Breaker Configuration
      circuitBreaker:
        enabled: true
        maxConnections: 1024
        maxPendingRequests: 1024
        maxRequests: 1024
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: "30s"
        baseEjectionTime: "30s"
        maxEjectionPercent: 50
      
      # Retry Configuration
      retryPolicy:
        enabled: true
        retryOn: "gateway-error,connect-failure,refused-stream"
        numRetries: 3
        perTryTimeout: "15s"
        retryHostPredicate:
        - name: "previous_hosts"
        hostSelectionRetryMaxAttempts: 5
        retriableStatusCodes: [502, 503, 504]
      
      # Timeout Configuration
      timeouts:
        requestTimeout: "30s"
        connectTimeout: "5s"
        streamIdleTimeout: "300s"
        requestHeadersTimeout: "5s"
        maxStreamDuration: "600s"
      
      # Rate Limiting Configuration
      rateLimiting:
        enabled: true
        defaultLimits:
          rps: 1000
          burst: 2000
          fillInterval: "1s"
        perUserLimits:
          rps: 100
          burst: 200
          windowSize: "1m"
        perIPLimits:
          rps: 500
          burst: 1000
          windowSize: "1m"
        customLimits:
          - path: "/api/v1/upload"
            method: "POST"
            rps: 10
            burst: 20
          - path: "/api/v1/payments"
            method: "POST"
            rps: 50
            burst: 100
      
      # Traffic Shaping
      trafficShaping:
        enabled: true
        qos:
          classes:
            - name: "critical"
              priority: 0
              weight: 100
              services: ["iacherie-payment-service"]
            - name: "high"
              priority: 1
              weight: 80
              services: ["iacherie-api", "iacherie-auth"]
            - name: "normal"
              priority: 2
              weight: 60
              services: ["iacherie-content-processor"]
            - name: "low"
              priority: 3
              weight: 40
              services: ["iacherie-analytics"]
        bandwidthLimits:
          upload: "100Mbps"
          download: "1Gbps"
          burst: "200Mbps"
---
# 🎯 Istio Traffic Management Configuration
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: iacherie-api-vs
  namespace: iacherie-production
spec:
  hosts:
  - api.iacherie.com
  - iacherie-api.iacherie-production.svc.cluster.local
  gateways:
  - iacherie-gateway
  - mesh
  http:
  - match:
    - uri:
        prefix: "/api/v1/creators"
    route:
    - destination:
        host: iacherie-creator-service.iacherie-production.svc.cluster.local
        port:
          number: 8080
      weight: 90
    - destination:
        host: iacherie-creator-service-v2.iacherie-production.svc.cluster.local
        port:
          number: 8080
      weight: 10
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 5s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
    timeout: 30s
    headers:
      request:
        set:
          x-service-version: "v1"
        add:
          x-request-id: "%REQ(x-request-id)%"
      response:
        set:
          x-served-by: "iacherie-creator-service"
        remove:
        - x-internal-header
  - match:
    - uri:
        prefix: "/api/v1/content"
    route:
    - destination:
        host: iacherie-content-processor.iacherie-production.svc.cluster.local
        port:
          number: 8080
    fault:
      abort:
        percentage:
          value: 0.01
        httpStatus: 503
    retries:
      attempts: 2
      perTryTimeout: 60s
      retryOn: 5xx
    timeout: 120s
    headers:
      request:
        set:
          x-content-processing: "enabled"
  - match:
    - uri:
        prefix: "/api/v1/payments"
    route:
    - destination:
        host: iacherie-payment-service.iacherie-production.svc.cluster.local
        port:
          number: 8080
    retries:
      attempts: 5
      perTryTimeout: 5s
      retryOn: 5xx,reset,connect-failure,refused-stream
    timeout: 15s
    headers:
      request:
        set:
          x-payment-processing: "secure"
      response:
        set:
          x-payment-status: "processed"
  - match:
    - uri:
        prefix: "/api/v1/"
    route:
    - destination:
        host: iacherie-api.iacherie-production.svc.cluster.local
        port:
          number: 8080
    retries:
      attempts: 3
      perTryTimeout: 15s
    timeout: 30s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: iacherie-api-dr
  namespace: iacherie-production
spec:
  host: iacherie-api.iacherie-production.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
      localityLbSetting:
        enabled: true
        distribute:
        - from: "region1/zone1/*"
          to:
            "region1/zone1/*": 80
            "region1/zone2/*": 20
        - from: "region1/zone2/*"
          to:
            "region1/zone2/*": 80
            "region1/zone1/*": 20
        failover:
        - from: region1
          to: region2
        - from: region2
          to: region1
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 5s
        keepAlive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
        idleTimeout: 90s
        h2UpgradePolicy: UPGRADE
        useClientProtocol: true
    circuitBreaker:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
    outlierDetection:
      consecutive5xxErrors: 5
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy:
      loadBalancer:
        simple: ROUND_ROBIN
  - name: v2
    labels:
      version: v2
    trafficPolicy:
      loadBalancer:
        simple: LEAST_REQUEST
  - name: canary
    labels:
      version: canary
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 50
        http:
          http1MaxPendingRequests: 50
          http2MaxRequests: 500
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: iacherie-gateway
  namespace: iacherie-production
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - api.iacherie.com
    - app.iacherie.com
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: iacherie-tls-secret
      minProtocolVersion: TLSV1_2
      maxProtocolVersion: TLSV1_3
      cipherSuites:
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
    hosts:
    - api.iacherie.com
    - app.iacherie.com
  - port:
      number: 8080
      name: grpc
      protocol: GRPC
    hosts:
    - grpc.iacherie.com
    tls:
      mode: SIMPLE
      credentialName: iacherie-grpc-tls-secret
---
# 🚀 Istio Service Entry for External Services
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-payment-gateway
  namespace: iacherie-production
spec:
  hosts:
  - api.stripe.com
  - api.paypal.com
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-cloud-storage
  namespace: iacherie-production
spec:
  hosts:
  - s3.amazonaws.com
  - storage.googleapis.com
  - blob.core.windows.net
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS
---
# 🎯 Envoy Filter for Advanced Traffic Management
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: iacherie-rate-limiting
  namespace: iacherie-production
spec:
  workloadSelector:
    labels:
      app: iacherie-api
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          "@type": type.googleapis.com/udpa.type.v1.TypedStruct
          type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          value:
            stat_prefix: local_rate_limiter
            token_bucket:
              max_tokens: 1000
              tokens_per_fill: 1000
              fill_interval: 60s
            filter_enabled:
              runtime_key: local_rate_limit_enabled
              default_value:
                numerator: 100
                denominator: HUNDRED
            filter_enforced:
              runtime_key: local_rate_limit_enforced
              default_value:
                numerator: 100
                denominator: HUNDRED
            response_headers_to_add:
            - append: false
              header:
                key: x-local-rate-limit
                value: 'true'
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: iacherie-compression
  namespace: iacherie-production
spec:
  workloadSelector:
    labels:
      app: iacherie-api
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.compressor
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
          response_direction_config:
            common_config:
              min_content_length: 100
              content_type:
              - "application/json"
              - "text/html"
              - "text/css"
              - "text/javascript"
              - "application/javascript"
            disable_on_etag_header: true
          compressor_library:
            name: text_optimized
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
              memory_level: 3
              window_bits: 12
              compression_level: BEST_COMPRESSION
              compression_strategy: DEFAULT_STRATEGY

# ===================================================================
# 🔗 LINKERD TRAFFIC MANAGEMENT CONFIGURATION
# ===================================================================

# 🎯 Linkerd Service Profile for Advanced Traffic Management
apiVersion: linkerd.io/v1alpha2
kind: ServiceProfile
metadata:
  name: iacherie-api-traffic
  namespace: iacherie-production
spec:
  routes:
  - name: creators-api
    condition:
      method: GET
      pathRegex: "/api/v1/creators/.*"
    responseClasses:
    - condition:
        status:
          min: 200
          max: 299
      isFailure: false
    - condition:
        status:
          min: 500
          max: 599
      isFailure: true
    timeout: 30s
    retryBudget:
      retryRatio: 0.2
      minRetriesPerSecond: 10
      ttl: 10s
  - name: content-upload
    condition:
      method: POST
      pathRegex: "/api/v1/content/upload"
    responseClasses:
    - condition:
        status:
          min: 200
          max: 299
      isFailure: false
    - condition:
        status:
          min: 400
          max: 499
      isFailure: false
    - condition:
        status:
          min: 500
          max: 599
      isFailure: true
    timeout: 120s
    retryBudget:
      retryRatio: 0.1
      minRetriesPerSecond: 2
      ttl: 30s
  - name: payment-processing
    condition:
      method: POST
      pathRegex: "/api/v1/payments/.*"
    responseClasses:
    - condition:
        status:
          min: 200
          max: 299
      isFailure: false
    - condition:
        status:
          min: 400
          max: 499
      isFailure: false
    - condition:
        status:
          min: 500
          max: 599
      isFailure: true
    timeout: 15s
    retryBudget:
      retryRatio: 0.3
      minRetriesPerSecond: 20
      ttl: 10s
---
# 🎯 Linkerd Traffic Split for Canary Deployments
apiVersion: split.smi-spec.io/v1alpha1
kind: TrafficSplit
metadata:
  name: iacherie-api-canary-split
  namespace: iacherie-production
spec:
  service: iacherie-api
  backends:
  - service: iacherie-api-v1
    weight: 90
  - service: iacherie-api-canary
    weight: 10
---
apiVersion: split.smi-spec.io/v1alpha1
kind: TrafficSplit
metadata:
  name: iacherie-content-processor-split
  namespace: iacherie-production
spec:
  service: iacherie-content-processor
  backends:
  - service: iacherie-content-processor-stable
    weight: 95
  - service: iacherie-content-processor-beta
    weight: 5

