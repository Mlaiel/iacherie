# 🌐 CONSUL CONNECT TRAFFIC MANAGEMENT
# ===================================================================

# 🎯 Consul Service Router
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-service-router-traffic
  namespace: consul
data:
  service-router.hcl: |
    # iacherie API Service Router
    Kind = "service-router"
    Name = "iacherie-api"
    Namespace = "iacherie-production"
    Routes = [
      {
        Match {
          HTTP {
            PathPrefix = "/api/v1/creators"
            Methods = ["GET", "POST", "PUT", "DELETE"]
            Header = [
              {
                Name = "Authorization"
                Present = true
              }
            ]
          }
        }
        Destination {
          Service = "iacherie-creator-service"
          Namespace = "iacherie-production"
          RequestTimeout = "30s"
          NumRetries = 3
          RetryOnConnectFailure = true
          RetryOnStatusCodes = [500, 502, 503, 504]
          RequestHeaders {
            Set = {
              "x-service" = "creator-service"
              "x-request-start" = "${NOW}"
            }
          }
          ResponseHeaders {
            Set = {
              "x-served-by" = "creator-service"
            }
            Remove = ["x-internal-header"]
          }
        }
      },
      {
        Match {
          HTTP {
            PathPrefix = "/api/v1/content"
            Methods = ["POST", "PUT"]
            Header = [
              {
                Name = "Content-Type"
                Regex = "multipart/form-data|application/octet-stream"
              }
            ]
          }
        }
        Destination {
          Service = "iacherie-content-processor"
          Namespace = "iacherie-production"
          RequestTimeout = "120s"
          NumRetries = 2
          RetryOnConnectFailure = true
          RetryOnStatusCodes = [500, 502, 503, 504]
          RequestHeaders {
            Set = {
              "x-service" = "content-processor"
              "x-processing-priority" = "high"
            }
          }
        }
      },
      {
        Match {
          HTTP {
            PathPrefix = "/api/v1/payments"
            Methods = ["POST", "PUT", "GET"]
            Header = [
              {
                Name = "X-API-Key"
                Present = true
              }
            ]
          }
        }
        Destination {
          Service = "iacherie-payment-service"
          Namespace = "iacherie-production"
          RequestTimeout = "15s"
          NumRetries = 5
          RetryOnConnectFailure = true
          RetryOnStatusCodes = [500, 502, 503, 504]
          RequestHeaders {
            Set = {
              "x-service" = "payment-service"
              "x-security-level" = "high"
            }
          }
          ResponseHeaders {
            Set = {
              "x-payment-processed" = "true"
            }
          }
        }
      },
      {
        Match {
          HTTP {
            PathPrefix = "/api/v1/"
          }
        }
        Destination {
          Service = "iacherie-api"
          Namespace = "iacherie-production"
          RequestTimeout = "30s"
          NumRetries = 3
          RetryOnConnectFailure = true
          RetryOnStatusCodes = [500, 502, 503, 504]
        }
      }
    ]
---
# 🎯 Consul Service Splitter
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-service-splitter-traffic
  namespace: consul
data:
  service-splitter.hcl: |
    # iacherie API Service Splitter
    Kind = "service-splitter"
    Name = "iacherie-api"
    Namespace = "iacherie-production"
    Splits = [
      {
        Weight = 90
        Service = "iacherie-api-stable"
        Namespace = "iacherie-production"
        ServiceSubset = "v1"
        RequestHeaders {
          Set = {
            "x-version" = "v1"
            "x-deployment" = "stable"
          }
        }
        ResponseHeaders {
          Set = {
            "x-served-by" = "stable"
          }
        }
      },
      {
        Weight = 10
        Service = "iacherie-api-canary"
        Namespace = "iacherie-production"
        ServiceSubset = "v2"
        RequestHeaders {
          Set = {
            "x-version" = "v2"
            "x-deployment" = "canary"
          }
        }
        ResponseHeaders {
          Set = {
            "x-served-by" = "canary"
            "x-canary-version" = "v2"
          }
        }
      }
    ]
    
    # Content Processor Service Splitter
    Kind = "service-splitter"
    Name = "iacherie-content-processor"
    Namespace = "iacherie-production"
    Splits = [
      {
        Weight = 95
        Service = "iacherie-content-processor-stable"
        Namespace = "iacherie-production"
        ServiceSubset = "stable"
      },
      {
        Weight = 5
        Service = "iacherie-content-processor-beta"
        Namespace = "iacherie-production"
        ServiceSubset = "beta"
        RequestHeaders {
          Set = {
            "x-beta-testing" = "true"
          }
        }
      }
    ]
---
# 🎯 Consul Service Resolver
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-service-resolver-traffic
  namespace: consul
data:
  service-resolver.hcl: |
    # iacherie API Service Resolver
    Kind = "service-resolver"
    Name = "iacherie-api"
    Namespace = "iacherie-production"
    
    DefaultSubset = "v1"
    
    Subsets = {
      v1 = {
        Filter = "Service.Meta.version == v1"
        OnlyPassing = true
      }
      v2 = {
        Filter = "Service.Meta.version == v2"
        OnlyPassing = true
      }
      canary = {
        Filter = "Service.Meta.version == canary"
        OnlyPassing = true
      }
    }
    
    LoadBalancer = {
      Policy = "least_request"
      RingHashConfig = {
        MinimumRingSize = 1024
        MaximumRingSize = 8192
      }
      LeastRequestConfig = {
        ChoiceCount = 2
      }
      HashPolicies = [
        {
          Field = "header"
          FieldValue = "x-user-id"
        }
      ]
    }
    
    ConnectTimeout = "5s"
    
    Failover = {
      "*" = {
        Service = "iacherie-api-fallback"
        Namespace = "iacherie-production"
        Datacenters = ["dc2", "dc3"]
      }
    }
    
    # Content Processor Service Resolver
    Kind = "service-resolver"
    Name = "iacherie-content-processor"
    Namespace = "iacherie-production"
    
    DefaultSubset = "stable"
    
    Subsets = {
      stable = {
        Filter = "Service.Meta.stability == stable"
        OnlyPassing = true
      }
      beta = {
        Filter = "Service.Meta.stability == beta"
        OnlyPassing = true
      }
    }
    
    LoadBalancer = {
      Policy = "round_robin"
    }
    
    ConnectTimeout = "10s"

# ===================================================================
# 🔄 ADVANCED TRAFFIC MANAGEMENT FEATURES
# ===================================================================

# 🚀 Progressive Delivery Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: progressive-delivery-config
  namespace: iacherie-system
data:
  progressive-delivery.yaml: |
    # Progressive Delivery Configuration
    progressiveDelivery:
      # Canary Deployment
      canary:
        enabled: true
        trafficSplit:
          initial: 5
          increment: 5
          maxWeight: 50
          interval: "5m"
        successConditions:
          - "error_rate < 0.01"
          - "latency_p99 < 500ms"
          - "success_rate > 0.99"
        rollbackConditions:
          - "error_rate > 0.05"
          - "latency_p99 > 1000ms"
          - "success_rate < 0.95"
        analysis:
          interval: "1m"
          threshold: 5
          stepWeightPromotion: 20
        webhooks:
          - name: "slack-notification"
            url: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"
          - name: "datadog-event"
            url: "https://api.datadoghq.com/api/v1/events"
      
      # Blue-Green Deployment
      blueGreen:
        enabled: true
        autoPromotionEnabled: false
        scaleDownDelaySeconds: 30
        prePromotionAnalysis:
          templates:
          - templateName: success-rate
          args:
          - name: service-name
            value: "iacherie-api"
        postPromotionAnalysis:
          templates:
          - templateName: success-rate
          args:
          - name: service-name
            value: "iacherie-api"
        activeService: "iacherie-api-active"
        previewService: "iacherie-api-preview"
      
      # Feature Flags Integration
      featureFlags:
        enabled: true
        provider: "launchdarkly"  # launchdarkly, flagsmith, unleash
        config:
          sdkKey: "sdk-key-here"
          environment: "production"
        flags:
          - name: "new-payment-flow"
            trafficPercentage: 10
            rolloutStrategy: "gradual"
          - name: "enhanced-content-processing"
            trafficPercentage: 25
            rolloutStrategy: "user-based"
          - name: "new-creator-dashboard"
            trafficPercentage: 5
            rolloutStrategy: "beta-users"
---
# 🎯 Traffic Mirroring Configuration
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: iacherie-api-mirror
  namespace: iacherie-production
spec:
  hosts:
  - iacherie-api.iacherie-production.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: "/api/v1/"
    route:
    - destination:
        host: iacherie-api.iacherie-production.svc.cluster.local
        port:
          number: 8080
      weight: 100
    mirror:
      host: iacherie-api-test.iacherie-staging.svc.cluster.local
      port:
        number: 8080
    mirrorPercentage:
      value: 1.0  # Mirror 1% of traffic
    headers:
      request:
        set:
          x-mirrored-traffic: "true"
---
# 🔄 Circuit Breaker Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: circuit-breaker-config
  namespace: iacherie-system
data:
  circuit-breaker.yaml: |
    # Circuit Breaker Configuration
    circuitBreaker:
      # Global Settings
      global:
        enabled: true
        requestVolumeThreshold: 20
        sleepWindow: "5s"
        errorThresholdPercentage: 50
        timeout: "1s"
        maxConcurrentRequests: 100
      
      # Service-Specific Settings
      services:
        iacherie-api:
          requestVolumeThreshold: 50
          sleepWindow: "10s"
          errorThresholdPercentage: 30
          timeout: "2s"
          maxConcurrentRequests: 200
        iacherie-content-processor:
          requestVolumeThreshold: 10
          sleepWindow: "30s"
          errorThresholdPercentage: 20
          timeout: "10s"
          maxConcurrentRequests: 50
        iacherie-payment-service:
          requestVolumeThreshold: 100
          sleepWindow: "5s"
          errorThresholdPercentage: 10
          timeout: "3s"
          maxConcurrentRequests: 500
      
      # Fallback Configuration
      fallback:
        enabled: true
        strategies:
          - service: "iacherie-api"
            fallbackService: "iacherie-api-fallback"
            fallbackResponse: |
              {
                "status": "service_unavailable",
                "message": "Service temporarily unavailable. Please try again later.",
                "retry_after": 30
              }
          - service: "iacherie-content-processor"
            fallbackService: "iacherie-content-processor-basic"
            fallbackResponse: |
              {
                "status": "degraded_service",
                "message": "Using basic processing mode.",
                "features_disabled": ["ai_enhancement", "format_conversion"]
              }
---
# 🎯 Load Balancing Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: load-balancing-config
  namespace: iacherie-system
data:
  load-balancing.yaml: |
    # Load Balancing Configuration
    loadBalancing:
      # Algorithm Configuration
      algorithms:
        default: "least_request"
        services:
          iacherie-api: "round_robin"
          iacherie-content-processor: "least_request"
          iacherie-payment-service: "ip_hash"
          iacherie-database: "least_connections"
      
      # Health Check Configuration
      healthCheck:
        interval: "10s"
        timeout: "3s"
        unhealthyThreshold: 3
        healthyThreshold: 2
        httpGet:
          path: "/health"
          port: 8080
          scheme: "HTTP"
          httpHeaders:
          - name: "User-Agent"
            value: "iacherie-lb-health-checker/1.0"
          - name: "Accept"
            value: "application/json"
      
      # Session Affinity
      sessionAffinity:
        enabled: true
        type: "ClientIP"  # ClientIP, Cookie, Header
        cookieConfig:
          name: "iacherie-session"
          maxAge: "86400"
          path: "/"
          secure: true
          httpOnly: true
        headerConfig:
          name: "X-Session-ID"
      
      # Weighted Routing
      weightedRouting:
        enabled: true
        weights:
          iacherie-api-v1: 90
          iacherie-api-v2: 10
        dynamicWeights:
          enabled: true
          adjustmentInterval: "1m"
          metrics:
            - "response_time"
            - "error_rate"
            - "cpu_usage"
      
      # Geographic Routing
      geoRouting:
        enabled: true
        regions:
          - name: "us-west"
            endpoints:
              - "us-west-1a.iacherie.com"
              - "us-west-1b.iacherie.com"
            weight: 40
          - name: "us-east"
            endpoints:
              - "us-east-1a.iacherie.com"
              - "us-east-1b.iacherie.com"
            weight: 40
          - name: "eu-west"
            endpoints:
              - "eu-west-1a.iacherie.com"
              - "eu-west-1b.iacherie.com"
            weight: 20
        failover:
          - from: "us-west"
            to: ["us-east", "eu-west"]
          - from: "us-east"
            to: ["us-west", "eu-west"]
          - from: "eu-west"
            to: ["us-west", "us-east"]

# ===================================================================
# 📊 TRAFFIC ANALYTICS AND MONITORING
# ===================================================================

# 📈 Traffic Metrics Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-metrics-config
  namespace: iacherie-system
data:
  traffic-metrics.yaml: |
    # Traffic Metrics Configuration
    trafficMetrics:
      # Prometheus Metrics
      prometheus:
        enabled: true
        scrapeInterval: "15s"
        metrics:
          - name: "iacherie_request_total"
            help: "Total number of requests"
            type: "counter"
            labels: ["service", "method", "status_code", "path"]
          - name: "iacherie_request_duration_seconds"
            help: "Request duration in seconds"
            type: "histogram"
            buckets: [0.001, 0.01, 0.1, 0.5, 1.0, 2.5, 5.0, 10.0]
            labels: ["service", "method", "status_code"]
          - name: "iacherie_active_connections"
            help: "Number of active connections"
            type: "gauge"
            labels: ["service", "backend"]
          - name: "iacherie_traffic_split_weight"
            help: "Current traffic split weight"
            type: "gauge"
            labels: ["service", "version", "deployment"]
      
      # Custom Metrics
      customMetrics:
        enabled: true
        metrics:
          - name: "iacherie_creator_requests_total"
            help: "Total requests by creator"
            type: "counter"
            labels: ["creator_id", "content_type", "processing_stage"]
          - name: "iacherie_revenue_per_request"
            help: "Revenue generated per request"
            type: "histogram"
            buckets: [0.01, 0.1, 1.0, 10.0, 100.0]
            labels: ["creator_id", "revenue_source"]
          - name: "iacherie_content_processing_queue"
            help: "Content processing queue length"
            type: "gauge"
            labels: ["queue_type", "priority"]
      
      # Real-time Analytics
      realTimeAnalytics:
        enabled: true
        interval: "1s"
        aggregationWindow: "5m"
        metrics:
          - "request_rate"
          - "error_rate"
          - "response_time_p95"
          - "response_time_p99"
          - "active_users"
          - "concurrent_requests"
        alerting:
          enabled: true
          rules:
            - name: "high_error_rate"
              condition: "error_rate > 0.05"
              severity: "warning"
              for: "2m"
            - name: "very_high_error_rate"
              condition: "error_rate > 0.1"
              severity: "critical"
              for: "1m"
            - name: "high_response_time"
              condition: "response_time_p95 > 1000"
              severity: "warning"
              for: "5m"
      
      # Business Metrics
      businessMetrics:
        enabled: true
        metrics:
          - name: "creator_engagement_rate"
            calculation: "active_creators / total_creators"
            interval: "1h"
          - name: "content_upload_success_rate"
            calculation: "successful_uploads / total_uploads"
            interval: "15m"
          - name: "payment_success_rate"
            calculation: "successful_payments / total_payments"
            interval: "5m"
          - name: "user_session_duration"
            calculation: "avg(session_end_time - session_start_time)"
            interval: "1h"

# ===================================================================
# 🎯 CREATOR ECONOMY SPECIFIC TRAFFIC MANAGEMENT
# ===================================================================

# 🎨 Creator Content Traffic Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: creator-traffic-config
  namespace: iacherie-production
data:
  creator-traffic.yaml: |
    # Creator Economy Traffic Management
    creatorTrafficManagement:
      # Content Upload Traffic
      contentUpload:
        rateLimits:
          perCreator:
            images: "100/hour"
            videos: "20/hour"
            audio: "50/hour"
            documents: "200/hour"
          perPlan:
            free: "10/day"
            pro: "1000/day"
            enterprise: "unlimited"
        prioritization:
          - tier: "enterprise"
            priority: 1
            bandwidth: "1Gbps"
          - tier: "pro"
            priority: 2
            bandwidth: "100Mbps"
          - tier: "free"
            priority: 3
            bandwidth: "10Mbps"
        queueManagement:
          enabled: true
          maxQueueSize: 1000
          priorityQueues:
            - name: "urgent"
              weight: 100
              services: ["live-streaming", "real-time-collaboration"]
            - name: "high"
              weight: 80
              services: ["content-upload", "ai-processing"]
            - name: "normal"
              weight: 60
              services: ["analytics", "reporting"]
            - name: "low"
              weight: 40
              services: ["background-tasks", "cleanup"]
      
      # Monetization Traffic
      monetization:
        paymentProcessing:
          timeout: "15s"
          retries: 5
          circuitBreaker:
            enabled: true
            threshold: 0.1
            timeout: "30s"
        subscriptionManagement:
          timeout: "10s"
          retries: 3
          batchProcessing:
            enabled: true
            batchSize: 100
            interval: "5m"
        analyticsReporting:
          timeout: "30s"
          retries: 2
          caching:
            enabled: true
            ttl: "15m"
      
      # Collaboration Traffic
      collaboration:
        realTimeEditing:
          timeout: "5s"
          websocketConfig:
            maxConnections: 1000
            heartbeatInterval: "30s"
            messageQueueSize: 10000
        fileSharing:
          timeout: "60s"
          chunkSize: "1MB"
          parallelUploads: 5
          compressionEnabled: true
        notifications:
          timeout: "3s"
          retries: 3
          priorityLevels:
            - name: "critical"
              timeout: "1s"
              retries: 5
            - name: "high"
              timeout: "3s"
              retries: 3
            - name: "normal"
              timeout: "5s"
              retries: 2
            - name: "low"
              timeout: "10s"
              retries: 1

