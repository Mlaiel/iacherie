# ArgoCD Application Configuration Template for iacherie Platform
# GitOps continuous deployment using ArgoCD

# Main Application Configuration
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iacherie-platform
  namespace: argocd
  labels:
    app: iacherie
    environment: production
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: iacherie-project
  
  source:
    repoURL: https://github.com/iacherie/platform-manifests.git
    targetRevision: main
    path: environments/production
    
    # Helm configuration if using Helm charts
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
      parameters:
        - name: image.tag
          value: "${IMAGE_TAG}"
        - name: environment
          value: "production"
        - name: replicas.api
          value: "3"
        - name: replicas.web
          value: "2"
        - name: replicas.ml
          value: "2"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: iacherie-production
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP

---
# Staging Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iacherie-staging
  namespace: argocd
  labels:
    app: iacherie
    environment: staging
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: iacherie-project
  
  source:
    repoURL: https://github.com/iacherie/platform-manifests.git
    targetRevision: develop
    path: environments/staging
    
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
      parameters:
        - name: image.tag
          value: "${IMAGE_TAG}"
        - name: environment
          value: "staging"
        - name: replicas.api
          value: "1"
        - name: replicas.web
          value: "1"
        - name: replicas.ml
          value: "1"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: iacherie-staging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

---
# Development Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iacherie-development
  namespace: argocd
  labels:
    app: iacherie
    environment: development
spec:
  project: iacherie-project
  
  source:
    repoURL: https://github.com/iacherie/platform-manifests.git
    targetRevision: develop
    path: environments/development
    
    helm:
      valueFiles:
        - values.yaml
        - values-development.yaml
      parameters:
        - name: image.tag
          value: "latest"
        - name: environment
          value: "development"
        - name: replicas.api
          value: "1"
        - name: replicas.web
          value: "1"
        - name: replicas.ml
          value: "1"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: iacherie-development
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
# ArgoCD Project Configuration
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: iacherie-project
  namespace: argocd
  labels:
    app: iacherie
spec:
  description: "iacherie Creator Economy Platform Project"
  
  sourceRepos:
    - 'https://github.com/iacherie/platform-manifests.git'
    - 'https://github.com/iacherie/helm-charts.git'
    - 'https://charts.bitnami.com/bitnami'
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://grafana.github.io/helm-charts'
  
  destinations:
    - namespace: 'iacherie-*'
      server: https://kubernetes.default.svc
    - namespace: 'monitoring'
      server: https://kubernetes.default.svc
    - namespace: 'ingress-nginx'
      server: https://kubernetes.default.svc
  
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: security.istio.io
      kind: PeerAuthentication
    - group: security.istio.io
      kind: AuthorizationPolicy
  
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
  
  roles:
    - name: admin
      description: "Full access to iacherie project"
      policies:
        - p, proj:iacherie-project:admin, applications, *, iacherie-project/*, allow
        - p, proj:iacherie-project:admin, logs, get, iacherie-project/*, allow
        - p, proj:iacherie-project:admin, exec, create, iacherie-project/*, allow
      groups:
        - iacherie:admins
    
    - name: developer
      description: "Developer access to iacherie project"
      policies:
        - p, proj:iacherie-project:developer, applications, get, iacherie-project/*, allow
        - p, proj:iacherie-project:developer, applications, sync, iacherie-project/iacherie-development, allow
        - p, proj:iacherie-project:developer, applications, sync, iacherie-project/iacherie-staging, allow
        - p, proj:iacherie-project:developer, logs, get, iacherie-project/*, allow
      groups:
        - iacherie:developers
    
    - name: readonly
      description: "Read-only access to iacherie project"
      policies:
        - p, proj:iacherie-project:readonly, applications, get, iacherie-project/*, allow
        - p, proj:iacherie-project:readonly, logs, get, iacherie-project/*, allow
      groups:
        - iacherie:viewers

---
# Application Set for Multi-Environment Deployment
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: iacherie-environments
  namespace: argocd
  labels:
    app: iacherie
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: staging
        values:
          environment: staging
          revision: develop
          replicas: "1"
    - clusters:
        selector:
          matchLabels:
            environment: production
        values:
          environment: production
          revision: main
          replicas: "3"
  
  template:
    metadata:
      name: 'iacherie-{{values.environment}}'
      labels:
        app: iacherie
        environment: '{{values.environment}}'
    spec:
      project: iacherie-project
      
      source:
        repoURL: https://github.com/iacherie/platform-manifests.git
        targetRevision: '{{values.revision}}'
        path: 'environments/{{values.environment}}'
        
        helm:
          valueFiles:
            - values.yaml
            - 'values-{{values.environment}}.yaml'
          parameters:
            - name: environment
              value: '{{values.environment}}'
            - name: replicas.api
              value: '{{values.replicas}}'
      
      destination:
        server: '{{server}}'
        namespace: 'iacherie-{{values.environment}}'
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

---
# ArgoCD Repository Configuration
apiVersion: v1
kind: Secret
metadata:
  name: iacherie-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/iacherie/platform-manifests.git
  username: ${GIT_USERNAME}
  password: ${GIT_TOKEN}

---
# ArgoCD Notifications Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: ${SLACK_TOKEN}
    
  template.app-deployed: |
    webhook:
      slack:
        attachments: |
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#18be52",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            },
            {
              "title": "Revision",
              "value": "{{.app.status.sync.revision}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    
  template.app-health-degraded: |
    webhook:
      slack:
        attachments: |
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#f4c430",
            "fields": [
            {
              "title": "Health Status",
              "value": "{{.app.status.health.status}}",
              "short": true
            },
            {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    
  template.app-sync-failed: |
    webhook:
      slack:
        attachments: |
          [{
            "title": "{{ .app.metadata.name}}",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#E96D76",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "Repository",
              "value": "{{.app.spec.source.repoURL}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            {{if not $index}},{{end}}
            {{if $index}},{{end}}
            {
              "title": "{{$c.type}}",
              "value": "{{$c.message}}",
              "short": true
            }
            {{end}}
            ]
          }]
    
  trigger.on-deployed: |
    - description: Application is synced and healthy
      send:
      - app-deployed
      when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
    
  trigger.on-health-degraded: |
    - description: Application has degraded
      send:
      - app-health-degraded
      when: app.status.health.status == 'Degraded'
    
  trigger.on-sync-failed: |
    - description: Application syncing has failed
      send:
      - app-sync-failed
      when: app.status.operationState.phase in ['Error', 'Failed']
    
  subscriptions: |
    - recipients:
      - slack:deployments
      triggers:
      - on-deployed
      - on-health-degraded
      - on-sync-failed

---
# ArgoCD Webhook Configuration for Automatic Sync
apiVersion: v1
kind: Secret
metadata:
  name: argocd-webhooks-secret
  namespace: argocd
type: Opaque
stringData:
  webhook.github.secret: ${GITHUB_WEBHOOK_SECRET}

---
# ArgoCD Image Updater Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  registries.conf: |
    registries:
    - name: Docker Hub
      prefix: docker.io
      api_url: https://registry-1.docker.io
      credentials: pullsecret:argocd/dockerhub
    - name: iacherie Registry
      prefix: registry.iacherie.com
      api_url: https://registry.iacherie.com/v2
      credentials: secret:argocd/iacherie-registry
  
  applications.yaml: |
    applications:
    - name: iacherie-staging
      image_list:
      - registry.iacherie.com/iacherie-api
      - registry.iacherie.com/iacherie-web
      - registry.iacherie.com/iacherie-ml
      update_strategy: semver
      
    - name: iacherie-production
      image_list:
      - registry.iacherie.com/iacherie-api
      - registry.iacherie.com/iacherie-web
      - registry.iacherie.com/iacherie-ml
      update_strategy: semver
      ignore_tags:
      - latest
      - develop
      - alpha
      - beta