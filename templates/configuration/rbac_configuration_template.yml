# =====================================================================================
# RBAC AUDIT AND MONITORING
# =====================================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: rbac-audit-policy
  namespace: ainflue-rbac-system
  labels:
    app.kubernetes.io/name: rbac-audit-policy
    ainflue.com/component: auditing
data:
  audit-policy.yaml: |
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
    # Log all RBAC changes at RequestResponse level
    - level: RequestResponse
      namespaces: ["ainflue-rbac-system"]
      resources:
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    # Log Creator Economy resource access
    - level: Request
      resources:
      - group: "ainflue.com"
        resources: ["*"]
    # Log access to financial services
    - level: RequestResponse
      namespaces: ["ainflue-production"]
      resources:
      - group: ""
        resources: ["pods", "services"]
        resourceNames: ["monetization-service"]
    # Log admin actions
    - level: RequestResponse
      users: ["fahed.mlaiel@ainflue.com"]
      verbs: ["create", "update", "patch", "delete"]

---

# =====================================================================================
# RBAC VALIDATION AND COMPLIANCE
# =====================================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: rbac-compliance-rules
  namespace: ainflue-rbac-system
  labels:
    app.kubernetes.io/name: rbac-compliance-rules
    ainflue.com/component: compliance
data:
  compliance-rules.yaml: |
    # PCI-DSS Compliance Rules
    pci_dss:
      - rule: "Financial services must use dedicated service accounts"
        resources: ["monetization-service"]
        requirement: "dedicated_service_account"
      - rule: "Payment data access must be logged"
        resources: ["payments", "billing"]
        requirement: "audit_logging"
    
    # GDPR Compliance Rules
    gdpr:
      - rule: "Creator data access must be role-based"
        resources: ["creators", "content"]
        requirement: "rbac_enforced"
      - rule: "Data processing must be authorized"
        resources: ["contentprocessingjobs"]
        requirement: "creator_consent"
    
    # SOX Compliance Rules
    sox:
      - rule: "Financial operations must have segregation of duties"
        resources: ["monetization-service", "analytics"]
        requirement: "segregated_access"

---

# =====================================================================================
# END OF RBAC CONFIGURATION
# =====================================================================================