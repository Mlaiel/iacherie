# Role-Based Access Control (RBAC) Configuration for Ainflue Creator Economy Platform
# Comprehensive security model with fine-grained permissions

apiVersion: v1
kind: Namespace
metadata:
  name: ainflue-rbac-system
  labels:
    app.kubernetes.io/name: ainflue-rbac
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: security
    ainflue.com/environment: production
    ainflue.com/security-level: critical

---

