# =====================================================================================
# POD SECURITY POLICIES
# =====================================================================================

apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: ainflue-restricted-psp
  labels:
    app.kubernetes.io/name: restricted-psp
    ainflue.com/security-level: high
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: true

---

apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: ainflue-ai-gpu-psp
  labels:
    app.kubernetes.io/name: ai-gpu-psp
    ainflue.com/security-level: high
    ainflue.com/gpu-access: required
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  allowedCapabilities:
    - 'SYS_ADMIN'  # Required for GPU access
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
    - 'hostPath'  # Required for GPU device access
  allowedHostPaths:
    - pathPrefix: "/dev"
      readOnly: false
    - pathPrefix: "/usr/lib/x86_64-linux-gnu"
      readOnly: true
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535

---

# =====================================================================================
# NETWORK POLICIES - Creator Economy Segmentation
# =====================================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ainflue-creator-isolation
  namespace: ainflue-production
  labels:
    app.kubernetes.io/name: creator-isolation
    ainflue.com/policy-type: isolation
spec:
  podSelector:
    matchLabels:
      ainflue.com/component: creator-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          ainflue.com/component: api-gateway
    - podSelector:
        matchLabels:
          ainflue.com/component: load-balancer
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 8080  # Health check
  egress:
  - to:
    - podSelector:
        matchLabels:
          ainflue.com/component: database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          ainflue.com/component: cache
    ports:
    - protocol: TCP
      port: 6379
  - to: []  # DNS
    ports:
    - protocol: UDP
      port: 53

