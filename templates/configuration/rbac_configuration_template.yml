# =====================================================================================
# CLUSTER ROLES - Platform-wide Permissions
# =====================================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ainflue-creator-platform-admin
  labels:
    app.kubernetes.io/name: creator-platform-admin
    ainflue.com/permission-level: admin
rules:
# Full control over Ainflue resources
- apiGroups: [""]
  resources: ["*"]
  verbs: ["*"]
  resourceNames: []
- apiGroups: ["apps", "extensions"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["autoscaling"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["batch"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["networking.k8s.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["policy"]
  resources: ["*"]
  verbs: ["*"]
# Monitoring and metrics
- apiGroups: ["metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]
# Custom resources for Creator Economy
- apiGroups: ["ainflue.com"]
  resources: ["*"]
  verbs: ["*"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ainflue-creator-role
  labels:
    app.kubernetes.io/name: creator-role
    ainflue.com/permission-level: creator
rules:
# Pod management for creator workloads
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  resourceNames: []
# ConfigMaps for creator configurations
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
  resourceNames: []
# Secrets for creator content encryption
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
  resourceNames: []
# Services for creator endpoints
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# Deployments for creator applications
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Jobs for content processing
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# HPA for scaling creator workloads
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# Network policies for creator isolation
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# Creator-specific resources
- apiGroups: ["ainflue.com"]
  resources: ["creators", "content", "monetization"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ainflue-content-processor-role
  labels:
    app.kubernetes.io/name: content-processor-role
    ainflue.com/permission-level: processing
rules:
# Pod management for processing workloads
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# PersistentVolumes for content storage
- apiGroups: [""]
