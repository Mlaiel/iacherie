# Tekton CI/CD Pipeline Template for iacherie Platform
# Cloud-native CI/CD using Tekton Pipelines on Kubernetes

apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: iacherie-pipeline
  namespace: tekton-pipelines
  labels:
    app: iacherie
    type: ci-cd
spec:
  description: |
    Complete CI/CD pipeline for iacherie creator economy platform
    including build, test, security scan, and deployment
  
  params:
    - name: git-url
      type: string
      description: Git repository URL
      default: "https://github.com/iacherie/platform.git"
    
    - name: git-revision
      type: string
      description: Git revision to checkout
      default: "main"
    
    - name: image-registry
      type: string
      description: Container registry URL
      default: "registry.iacherie.com"
    
    - name: image-tag
      type: string
      description: Container image tag
      default: "latest"
    
    - name: target-namespace
      type: string
      description: Target Kubernetes namespace
      default: "iacherie-staging"
    
    - name: deploy-environment
      type: string
      description: Deployment environment
      default: "staging"

  workspaces:
    - name: shared-data
      description: Shared workspace for pipeline data
    
    - name: git-credentials
      description: Git credentials for private repositories
    
    - name: registry-credentials
      description: Container registry credentials

  tasks:
    # 1. Git Clone Task
    - name: fetch-source
      taskRef:
        name: git-clone
        kind: ClusterTask
      workspaces:
        - name: output
          workspace: shared-data
        - name: ssh-directory
          workspace: git-credentials
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: deleteExisting
          value: "true"

    # 2. Code Quality and Linting
    - name: code-quality
      taskRef:
        name: iacherie-code-quality
      runAfter: ["fetch-source"]
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: image
          value: "node:18-alpine"

    # 3. Security Scanning
    - name: security-scan
      taskRef:
        name: iacherie-security-scan
      runAfter: ["fetch-source"]
      workspaces:
        - name: source
          workspace: shared-data

    # 4. Unit Tests - API Service
    - name: test-api
      taskRef:
        name: iacherie-node-test
      runAfter: ["code-quality"]
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: service-path
          value: "services/api"
        - name: test-command
          value: "npm run test:unit -- --coverage"

    # 5. Unit Tests - Web Service
    - name: test-web
      taskRef:
        name: iacherie-node-test
      runAfter: ["code-quality"]
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: service-path
          value: "services/web"
        - name: test-command
          value: "npm run test:unit -- --coverage"

    # 6. Unit Tests - ML Service
    - name: test-ml
      taskRef:
        name: iacherie-python-test
      runAfter: ["code-quality"]
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: service-path
          value: "services/ml"
        - name: test-command
          value: "pytest tests/ --cov=src --cov-report=xml"

    # 7. Build API Image
    - name: build-api-image
      taskRef:
        name: buildah
        kind: ClusterTask
      runAfter: ["test-api", "security-scan"]
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: registry-credentials
      params:
        - name: IMAGE
          value: "$(params.image-registry)/iacherie-api:$(params.image-tag)"
        - name: DOCKERFILE
          value: "./services/api/Dockerfile"
        - name: CONTEXT
          value: "./services/api"

    # 8. Build Web Image
    - name: build-web-image
      taskRef:
        name: buildah
        kind: ClusterTask
      runAfter: ["test-web", "security-scan"]
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: registry-credentials
      params:
        - name: IMAGE
          value: "$(params.image-registry)/iacherie-web:$(params.image-tag)"
        - name: DOCKERFILE
          value: "./services/web/Dockerfile"
        - name: CONTEXT
          value: "./services/web"

    # 9. Build ML Image
    - name: build-ml-image
      taskRef:
        name: buildah
        kind: ClusterTask
      runAfter: ["test-ml", "security-scan"]
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: registry-credentials
      params:
        - name: IMAGE
          value: "$(params.image-registry)/iacherie-ml:$(params.image-tag)"
        - name: DOCKERFILE
          value: "./services/ml/Dockerfile"
        - name: CONTEXT
          value: "./services/ml"

    # 10. Integration Tests
    - name: integration-tests
      taskRef:
        name: iacherie-integration-test
      runAfter: ["build-api-image", "build-web-image", "build-ml-image"]
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: api-image
          value: "$(params.image-registry)/iacherie-api:$(params.image-tag)"
        - name: web-image
          value: "$(params.image-registry)/iacherie-web:$(params.image-tag)"
        - name: ml-image
          value: "$(params.image-registry)/iacherie-ml:$(params.image-tag)"

    # 11. Container Security Scan
    - name: container-security-scan
      taskRef:
        name: iacherie-container-scan
      runAfter: ["build-api-image", "build-web-image", "build-ml-image"]
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: images
          value: |
            $(params.image-registry)/iacherie-api:$(params.image-tag)
            $(params.image-registry)/iacherie-web:$(params.image-tag)
            $(params.image-registry)/iacherie-ml:$(params.image-tag)

    # 12. Deploy to Environment
    - name: deploy-application
      taskRef:
        name: iacherie-deploy
      runAfter: ["integration-tests", "container-security-scan"]
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: namespace
          value: $(params.target-namespace)
        - name: environment
          value: $(params.deploy-environment)
        - name: api-image
          value: "$(params.image-registry)/iacherie-api:$(params.image-tag)"
        - name: web-image
          value: "$(params.image-registry)/iacherie-web:$(params.image-tag)"
        - name: ml-image
          value: "$(params.image-registry)/iacherie-ml:$(params.image-tag)"

    # 13. Post-deployment Tests
    - name: smoke-tests
      taskRef:
        name: iacherie-smoke-test
      runAfter: ["deploy-application"]
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: environment
          value: $(params.deploy-environment)
        - name: namespace
          value: $(params.target-namespace)

  finally:
    # Cleanup and notifications
    - name: cleanup
      taskRef:
        name: iacherie-cleanup
      workspaces:
        - name: source
          workspace: shared-data
    
    - name: notify-slack
      taskRef:
        name: send-to-webhook-slack
        kind: ClusterTask
      params:
        - name: webhook-secret
          value: slack-webhook-secret
        - name: message
          value: |
            Pipeline $(context.pipeline.name) completed
            Status: $(tasks.status)
            Git Revision: $(params.git-revision)
            Environment: $(params.deploy-environment)

---
# Custom Task: Code Quality Check
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: iacherie-code-quality
  namespace: tekton-pipelines
spec:
  description: "Run code quality checks for iacherie platform"
  params:
    - name: image
      description: Node.js image to use
      default: "node:18-alpine"
  workspaces:
    - name: source
      description: Source code workspace
  steps:
    - name: install-dependencies
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm ci
    
    - name: lint-check
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm run lint
        echo "✅ Linting passed"
    
    - name: format-check
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm run format:check
        echo "✅ Format check passed"
    
    - name: type-check
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm run type-check
        echo "✅ Type checking passed"

---
# Custom Task: Security Scanning
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: iacherie-security-scan
  namespace: tekton-pipelines
spec:
  description: "Security scanning for iacherie platform"
  workspaces:
    - name: source
      description: Source code workspace
  steps:
    - name: dependency-scan
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm audit --audit-level high
        echo "✅ Dependency scan completed"
    
    - name: secret-scan
      image: zricethezav/gitleaks:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        gitleaks detect --source . --verbose
        echo "✅ Secret scan completed"

---
# Custom Task: Node.js Testing
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: iacherie-node-test
  namespace: tekton-pipelines
spec:
  description: "Run Node.js tests for iacherie services"
  params:
    - name: service-path
      description: Path to the service directory
    - name: test-command
      description: Test command to run
      default: "npm test"
  workspaces:
    - name: source
      description: Source code workspace
  results:
    - name: coverage
      description: Test coverage percentage
  steps:
    - name: install-dependencies
      image: node:18-alpine
      workingDir: $(workspaces.source.path)/$(params.service-path)
      script: |
        #!/bin/sh
        set -e
        npm ci
    
    - name: run-tests
      image: node:18-alpine
      workingDir: $(workspaces.source.path)/$(params.service-path)
      script: |
        #!/bin/sh
        set -e
        $(params.test-command)
        
        # Extract coverage percentage if available
        if [ -f coverage/lcov.info ]; then
          COVERAGE=$(grep -o "Lines.*[0-9]*\.[0-9]*%" coverage/lcov-report/index.html | grep -o "[0-9]*\.[0-9]*" | head -1)
          echo -n "$COVERAGE" > $(results.coverage.path)
        fi
        
        echo "✅ Tests completed for $(params.service-path)"

---
# Custom Task: Python Testing
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: iacherie-python-test
  namespace: tekton-pipelines
spec:
  description: "Run Python tests for iacherie ML service"
  params:
    - name: service-path
      description: Path to the service directory
    - name: test-command
      description: Test command to run
      default: "pytest"
  workspaces:
    - name: source
      description: Source code workspace
  steps:
    - name: install-dependencies
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)/$(params.service-path)
      script: |
        #!/bin/bash
        set -e
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: code-quality
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)/$(params.service-path)
      script: |
        #!/bin/bash
        set -e
        black --check src/
        flake8 src/
        isort --check-only src/
        mypy src/
        echo "✅ Python code quality checks passed"
    
    - name: run-tests
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)/$(params.service-path)
      script: |
        #!/bin/bash
        set -e
        $(params.test-command)
        echo "✅ Python tests completed"

---
# Custom Task: Integration Testing
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: iacherie-integration-test
  namespace: tekton-pipelines
spec:
  description: "Run integration tests for iacherie platform"
  params:
    - name: api-image
      description: API service image
    - name: web-image
      description: Web service image
    - name: ml-image
      description: ML service image
  workspaces:
    - name: source
      description: Source code workspace
  sidecars:
    - name: postgres
      image: postgres:13
      env:
        - name: POSTGRES_DB
          value: "iacherie_test"
        - name: POSTGRES_USER
          value: "test_user"
        - name: POSTGRES_PASSWORD
          value: "test_password"
    - name: redis
      image: redis:7-alpine
  steps:
    - name: wait-for-services
      image: busybox
      script: |
        #!/bin/sh
        echo "Waiting for services to be ready..."
        sleep 30
    
    - name: run-integration-tests
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URL
          value: "postgresql://test_user:test_password@localhost:5432/iacherie_test"
        - name: REDIS_URL
          value: "redis://localhost:6379"
      script: |
        #!/bin/sh
        set -e
        npm ci
        npm run test:integration
        echo "✅ Integration tests completed"

---
# Custom Task: Container Security Scanning
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: iacherie-container-scan
  namespace: tekton-pipelines
spec:
  description: "Scan container images for vulnerabilities"
  params:
    - name: images
      description: List of images to scan
      type: array
  workspaces:
    - name: source
      description: Source code workspace
  steps:
    - name: scan-images
      image: aquasec/trivy:latest
      script: |
        #!/bin/sh
        set -e
        for image in $(params.images[*]); do
          echo "Scanning image: $image"
          trivy image --severity HIGH,CRITICAL --exit-code 1 $image
        done
        echo "✅ Container security scan completed"

---
# Custom Task: Deployment
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: iacherie-deploy
  namespace: tekton-pipelines
spec:
  description: "Deploy iacherie application to Kubernetes"
  params:
    - name: namespace
      description: Target namespace
    - name: environment
      description: Environment name
    - name: api-image
      description: API service image
    - name: web-image
      description: Web service image
    - name: ml-image
      description: ML service image
  workspaces:
    - name: source
      description: Source code workspace
  steps:
    - name: deploy-manifests
      image: bitnami/kubectl:latest
      script: |
        #!/bin/bash
        set -e
        
        # Update image tags in deployment manifests
        sed -i "s|image: .*iacherie-api.*|image: $(params.api-image)|g" kubernetes/api-deployment.yaml
        sed -i "s|image: .*iacherie-web.*|image: $(params.web-image)|g" kubernetes/web-deployment.yaml
        sed -i "s|image: .*iacherie-ml.*|image: $(params.ml-image)|g" kubernetes/ml-deployment.yaml
        
        # Apply deployments
        kubectl apply -f kubernetes/ -n $(params.namespace)
        
        # Wait for rollout to complete
        kubectl rollout status deployment/iacherie-api -n $(params.namespace) --timeout=300s
        kubectl rollout status deployment/iacherie-web -n $(params.namespace) --timeout=300s
        kubectl rollout status deployment/iacherie-ml -n $(params.namespace) --timeout=300s
        
        echo "✅ Deployment completed to $(params.environment)"

---
# Custom Task: Smoke Testing
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: iacherie-smoke-test
  namespace: tekton-pipelines
spec:
  description: "Run smoke tests after deployment"
  params:
    - name: environment
      description: Environment name
    - name: namespace
      description: Target namespace
  workspaces:
    - name: source
      description: Source code workspace
  steps:
    - name: wait-for-deployment
      image: bitnami/kubectl:latest
      script: |
        #!/bin/bash
        echo "Waiting for deployment to stabilize..."
        sleep 60
    
    - name: smoke-tests
      image: node:18-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        
        # Set environment-specific URLs
        if [ "$(params.environment)" = "staging" ]; then
          export API_BASE_URL="https://api.staging.iacherie.com"
          export WEB_BASE_URL="https://staging.iacherie.com"
        elif [ "$(params.environment)" = "production" ]; then
          export API_BASE_URL="https://api.iacherie.com"
          export WEB_BASE_URL="https://app.iacherie.com"
        fi
        
        npm ci
        npm run test:smoke
        echo "✅ Smoke tests passed"

---
# Custom Task: Cleanup
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: iacherie-cleanup
  namespace: tekton-pipelines
spec:
  description: "Cleanup resources after pipeline execution"
  workspaces:
    - name: source
      description: Source code workspace
  steps:
    - name: cleanup-workspace
      image: busybox
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Cleaning up workspace..."
        rm -rf node_modules || true
        rm -rf */node_modules || true
        rm -rf */*/node_modules || true
        echo "✅ Cleanup completed"

---
# PipelineRun for triggering the pipeline
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: iacherie-pipeline-run-$(uid)
  namespace: tekton-pipelines
spec:
  pipelineRef:
    name: iacherie-pipeline
  params:
    - name: git-url
      value: "https://github.com/iacherie/platform.git"
    - name: git-revision
      value: "main"
    - name: image-registry
      value: "registry.iacherie.com"
    - name: image-tag
      value: "$(context.pipelineRun.uid)"
    - name: target-namespace
      value: "iacherie-staging"
    - name: deploy-environment
      value: "staging"
  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    - name: git-credentials
      secret:
        secretName: git-credentials
    - name: registry-credentials
      secret:
        secretName: registry-credentials