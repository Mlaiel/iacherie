# Elasticsearch Configuration Template for iacherie Platform
# Comprehensive configuration for log storage, search, and analytics

# Elasticsearch cluster configuration
cluster.name: iacherie-elasticsearch
node.name: ${NODE_NAME}
node.roles: ["master", "data", "ingest", "ml"]

# Network configuration
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300

# Discovery and cluster formation
discovery.seed_hosts: 
  - elasticsearch-master-0.elasticsearch-headless
  - elasticsearch-master-1.elasticsearch-headless
  - elasticsearch-master-2.elasticsearch-headless

cluster.initial_master_nodes:
  - elasticsearch-master-0
  - elasticsearch-master-1
  - elasticsearch-master-2

# Data paths
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs
path.repo: ["/usr/share/elasticsearch/backups"]

# Memory and performance settings
bootstrap.memory_lock: true
indices.memory.index_buffer_size: 20%
indices.memory.min_index_buffer_size: 96mb

# Thread pools for different operations
thread_pool:
  write:
    size: ${WRITE_THREAD_POOL_SIZE:8}
    queue_size: ${WRITE_QUEUE_SIZE:1000}
  search:
    size: ${SEARCH_THREAD_POOL_SIZE:13}
    queue_size: ${SEARCH_QUEUE_SIZE:1000}
  analyze:
    size: ${ANALYZE_THREAD_POOL_SIZE:1}
    queue_size: ${ANALYZE_QUEUE_SIZE:16}

# Index settings
index:
  number_of_shards: ${INDEX_SHARDS:3}
  number_of_replicas: ${INDEX_REPLICAS:1}
  refresh_interval: 30s
  translog:
    flush_threshold_size: 512mb
    sync_interval: 30s
  merge:
    scheduler:
      max_thread_count: 1

# Security configuration
xpack.security.enabled: true
xpack.security.transport.ssl.enabled: true
xpack.security.transport.ssl.verification_mode: certificate
xpack.security.transport.ssl.client_authentication: required
xpack.security.transport.ssl.keystore.path: elastic-certificates.p12
xpack.security.transport.ssl.truststore.path: elastic-certificates.p12

xpack.security.http.ssl.enabled: true
xpack.security.http.ssl.keystore.path: elastic-certificates.p12

# Monitoring and management
xpack.monitoring.enabled: true
xpack.monitoring.collection.enabled: true
xpack.monitoring.collection.interval: 30s

# Machine learning configuration
xpack.ml.enabled: true
xpack.ml.max_machine_memory_percent: 30

# License configuration
xpack.license.self_generated.type: basic

# Audit logging
xpack.security.audit.enabled: true
xpack.security.audit.logfile.events.emit_request_body: false

# Action destructive requires name
action.destructive_requires_name: true

# CORS settings for web clients
http.cors.enabled: true
http.cors.allow-origin: "https://*.iacherie.com"
http.cors.allow-methods: "OPTIONS, HEAD, GET, POST, PUT, DELETE"
http.cors.allow-headers: "X-Requested-With, Content-Type, Content-Length, Authorization"

# Index lifecycle management
xpack.ilm.enabled: true

---
# Index templates for different log types

# Application logs template
PUT _index_template/iacherie-app-logs
{
  "index_patterns": ["iacherie-app-*"],
  "template": {
    "settings": {
      "number_of_shards": 2,
      "number_of_replicas": 1,
      "index.lifecycle.name": "iacherie-app-logs-policy",
      "index.lifecycle.rollover_alias": "iacherie-app-logs"
    },
    "mappings": {
      "properties": {
        "@timestamp": {
          "type": "date"
        },
        "level": {
          "type": "keyword"
        },
        "logger": {
          "type": "keyword"
        },
        "message": {
          "type": "text",
          "analyzer": "standard"
        },
        "service": {
          "type": "keyword"
        },
        "environment": {
          "type": "keyword"
        },
        "version": {
          "type": "keyword"
        },
        "trace_id": {
          "type": "keyword"
        },
        "span_id": {
          "type": "keyword"
        },
        "user_id": {
          "type": "keyword"
        },
        "request_id": {
          "type": "keyword"
        },
        "error": {
          "properties": {
            "message": {
              "type": "text"
            },
            "stack": {
              "type": "text",
              "index": false
            },
            "type": {
              "type": "keyword"
            }
          }
        },
        "http": {
          "properties": {
            "method": {
              "type": "keyword"
            },
            "url": {
              "type": "keyword"
            },
            "status_code": {
              "type": "short"
            },
            "response_time": {
              "type": "float"
            },
            "user_agent": {
              "type": "text"
            },
            "remote_ip": {
              "type": "ip"
            }
          }
        }
      }
    }
  }
}

# Metrics template
PUT _index_template/iacherie-metrics
{
  "index_patterns": ["iacherie-metrics-*"],
  "template": {
    "settings": {
      "number_of_shards": 1,
      "number_of_replicas": 0,
      "index.lifecycle.name": "iacherie-metrics-policy",
      "refresh_interval": "10s"
    },
    "mappings": {
      "properties": {
        "@timestamp": {
          "type": "date"
        },
        "metric_name": {
          "type": "keyword"
        },
        "metric_value": {
          "type": "double"
        },
        "metric_type": {
          "type": "keyword"
        },
        "service": {
          "type": "keyword"
        },
        "environment": {
          "type": "keyword"
        },
        "labels": {
          "type": "object",
          "dynamic": true
        }
      }
    }
  }
}

# Security events template
PUT _index_template/iacherie-security-events
{
  "index_patterns": ["iacherie-security-*"],
  "template": {
    "settings": {
      "number_of_shards": 2,
      "number_of_replicas": 2,
      "index.lifecycle.name": "iacherie-security-policy"
    },
    "mappings": {
      "properties": {
        "@timestamp": {
          "type": "date"
        },
        "event_type": {
          "type": "keyword"
        },
        "severity": {
          "type": "keyword"
        },
        "source_ip": {
          "type": "ip"
        },
        "destination_ip": {
          "type": "ip"
        },
        "user_id": {
          "type": "keyword"
        },
        "session_id": {
          "type": "keyword"
        },
        "action": {
          "type": "keyword"
        },
        "result": {
          "type": "keyword"
        },
        "description": {
          "type": "text"
        },
        "risk_score": {
          "type": "float"
        }
      }
    }
  }
}

# Creator economy events template
PUT _index_template/iacherie-creator-events
{
  "index_patterns": ["iacherie-creator-*"],
  "template": {
    "settings": {
      "number_of_shards": 3,
      "number_of_replicas": 1,
      "index.lifecycle.name": "iacherie-creator-policy"
    },
    "mappings": {
      "properties": {
        "@timestamp": {
          "type": "date"
        },
        "event_type": {
          "type": "keyword"
        },
        "creator_id": {
          "type": "keyword"
        },
        "brand_id": {
          "type": "keyword"
        },
        "campaign_id": {
          "type": "keyword"
        },
        "content_id": {
          "type": "keyword"
        },
        "platform": {
          "type": "keyword"
        },
        "engagement": {
          "properties": {
            "likes": {
              "type": "long"
            },
            "shares": {
              "type": "long"
            },
            "comments": {
              "type": "long"
            },
            "views": {
              "type": "long"
            },
            "reach": {
              "type": "long"
            }
          }
        },
        "revenue": {
          "properties": {
            "amount": {
              "type": "scaled_float",
              "scaling_factor": 100
            },
            "currency": {
              "type": "keyword"
            },
            "commission": {
              "type": "scaled_float",
              "scaling_factor": 100
            }
          }
        }
      }
    }
  }
}

---
# Index Lifecycle Management Policies

# Application logs ILM policy
PUT _ilm/policy/iacherie-app-logs-policy
{
  "policy": {
    "phases": {
      "hot": {
        "actions": {
          "rollover": {
            "max_size": "5GB",
            "max_age": "1d"
          },
          "set_priority": {
            "priority": 100
          }
        }
      },
      "warm": {
        "min_age": "7d",
        "actions": {
          "shrink": {
            "number_of_shards": 1
          },
          "forcemerge": {
            "max_num_segments": 1
          },
          "set_priority": {
            "priority": 50
          }
        }
      },
      "cold": {
        "min_age": "30d",
        "actions": {
          "set_priority": {
            "priority": 0
          }
        }
      },
      "delete": {
        "min_age": "90d"
      }
    }
  }
}

# Metrics ILM policy
PUT _ilm/policy/iacherie-metrics-policy
{
  "policy": {
    "phases": {
      "hot": {
        "actions": {
          "rollover": {
            "max_size": "2GB",
            "max_age": "12h"
          }
        }
      },
      "warm": {
        "min_age": "3d",
        "actions": {
          "forcemerge": {
            "max_num_segments": 1
          }
        }
      },
      "delete": {
        "min_age": "30d"
      }
    }
  }
}

# Security events ILM policy
PUT _ilm/policy/iacherie-security-policy
{
  "policy": {
    "phases": {
      "hot": {
        "actions": {
          "rollover": {
            "max_size": "10GB",
            "max_age": "1d"
          }
        }
      },
      "warm": {
        "min_age": "7d",
        "actions": {
          "shrink": {
            "number_of_shards": 1
          },
          "forcemerge": {
            "max_num_segments": 1
          }
        }
      },
      "cold": {
        "min_age": "90d",
        "actions": {
          "set_priority": {
            "priority": 0
          }
        }
      },
      "delete": {
        "min_age": "2y"
      }
    }
  }
}

# Creator economy ILM policy
PUT _ilm/policy/iacherie-creator-policy
{
  "policy": {
    "phases": {
      "hot": {
        "actions": {
          "rollover": {
            "max_size": "5GB",
            "max_age": "1d"
          }
        }
      },
      "warm": {
        "min_age": "30d",
        "actions": {
          "shrink": {
            "number_of_shards": 1
          },
          "forcemerge": {
            "max_num_segments": 1
          }
        }
      },
      "cold": {
        "min_age": "365d"
      }
    }
  }
}

---
# Snapshot repository configuration
PUT _snapshot/iacherie-backups
{
  "type": "s3",
  "settings": {
    "bucket": "${BACKUP_S3_BUCKET}",
    "region": "${AWS_REGION}",
    "base_path": "elasticsearch-snapshots",
    "compress": true,
    "server_side_encryption": true
  }
}

# Snapshot lifecycle policy
PUT _slm/policy/daily-snapshots
{
  "schedule": "0 2 * * *",
  "name": "<iacherie-snapshot-{now/d}>",
  "repository": "iacherie-backups",
  "config": {
    "indices": "iacherie-*",
    "ignore_unavailable": false,
    "include_global_state": false
  },
  "retention": {
    "expire_after": "30d",
    "min_count": 5,
    "max_count": 50
  }
}

---
# Watcher alerts for monitoring

# High error rate alert
PUT _watcher/watch/high-error-rate
{
  "trigger": {
    "schedule": {
      "interval": "5m"
    }
  },
  "input": {
    "search": {
      "request": {
        "search_type": "query_then_fetch",
        "indices": ["iacherie-app-*"],
        "body": {
          "size": 0,
          "query": {
            "bool": {
              "must": [
                {
                  "range": {
                    "@timestamp": {
                      "gte": "now-5m"
                    }
                  }
                },
                {
                  "term": {
                    "level": "error"
                  }
                }
              ]
            }
          },
          "aggs": {
            "error_count": {
              "cardinality": {
                "field": "message.keyword"
              }
            }
          }
        }
      }
    }
  },
  "condition": {
    "compare": {
      "ctx.payload.aggregations.error_count.value": {
        "gt": 10
      }
    }
  },
  "actions": {
    "send_email": {
      "email": {
        "to": ["${ALERT_EMAIL}"],
        "subject": "High Error Rate Alert - iacherie Platform",
        "body": "High error rate detected: {{ctx.payload.aggregations.error_count.value}} unique errors in the last 5 minutes"
      }
    }
  }
}