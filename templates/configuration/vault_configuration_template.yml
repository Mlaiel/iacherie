# 🔐 Vault Initialization Job
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  namespace: vault
  labels:
    app: vault
    component: init
spec:
  template:
    metadata:
      labels:
        app: vault
        component: init
    spec:
      serviceAccountName: vault-init
      restartPolicy: OnFailure
      containers:
      - name: vault-init
        image: hashicorp/vault:1.15.0
        command:
        - "/bin/sh"
        - "-ec"
        args:
        - |
          # Wait for Vault to be ready
          until vault status -address=https://vault.vault.svc.cluster.local:8200; do
            echo "Waiting for Vault to be ready..."
            sleep 5
          done
          
          # Check if Vault is already initialized
          if vault status -address=https://vault.vault.svc.cluster.local:8200 | grep -q "Initialized.*true"; then
            echo "Vault is already initialized"
            exit 0
          fi
          
          # Initialize Vault
          vault operator init \
            -address=https://vault.vault.svc.cluster.local:8200 \
            -key-shares=5 \
            -key-threshold=3 \
            -recovery-shares=5 \
            -recovery-threshold=3 \
            -format=json > /tmp/vault-init.json
          
          # Store init keys in Kubernetes secrets
          kubectl create secret generic vault-unseal-keys \
            --from-file=vault-init.json=/tmp/vault-init.json \
            --namespace=vault
          
          echo "Vault initialization completed"
        env:
        - name: VAULT_ADDR
          value: "https://vault.vault.svc.cluster.local:8200"
        - name: VAULT_CACERT
          value: "/vault/tls/ca.pem"
        - name: VAULT_SKIP_VERIFY
          value: "false"
        volumeMounts:
        - name: tls
          mountPath: /vault/tls
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: tls
        secret:
          secretName: vault-tls
---
# 🔧 Vault Configuration Job
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-configure
  namespace: vault
  labels:
    app: vault
    component: configure
spec:
  template:
    metadata:
      labels:
        app: vault
        component: configure
    spec:
      serviceAccountName: vault-configure
      restartPolicy: OnFailure
      containers:
      - name: vault-configure
        image: hashicorp/vault:1.15.0
        command:
        - "/bin/sh"
        - "-ec"
        args:
        - |
          # Wait for Vault to be ready and unsealed
          until vault status -address=https://vault.vault.svc.cluster.local:8200 | grep -q "Sealed.*false"; do
            echo "Waiting for Vault to be unsealed..."
            sleep 10
          done
          
          # Authenticate with root token
          export VAULT_TOKEN=$(kubectl get secret vault-unseal-keys -o jsonpath='{.data.vault-init\.json}' | base64 -d | jq -r '.root_token')
          
          # Enable audit devices
          vault audit enable -path="file" file file_path=/vault/logs/audit.log log_raw=false hmac_accessor=true mode=0600 format=json || true
          vault audit enable -path="syslog" syslog facility=LOCAL0 tag=vault format=json || true
          
          # Enable secret engines
          vault secrets enable -path=secret kv-v2
          vault secrets enable -path=transit transit
          vault secrets enable -path=pki pki
          vault secrets enable -path=database database
          vault secrets enable -path=aws aws
          vault secrets enable -path=gcp gcp
          vault secrets enable -path=azure azure
          
          # Configure PKI
          vault secrets tune -max-lease-ttl=87600h pki
          vault write pki/root/generate/internal \
            common_name="Ainflue Root CA" \
            ttl=87600h \
            key_bits=4096
          
          vault write pki/config/urls \
            issuing_certificates="https://vault.ainflue.internal:8200/v1/pki/ca" \
            crl_distribution_points="https://vault.ainflue.internal:8200/v1/pki/crl"
          
          # Create intermediate CA
          vault secrets enable -path=pki_int pki
          vault secrets tune -max-lease-ttl=43800h pki_int
          
          vault write -format=json pki_int/intermediate/generate/internal \
            common_name="Ainflue Intermediate Authority" \
            | jq -r '.data.csr' > pki_intermediate.csr
          
          vault write -format=json pki/root/sign-intermediate \
            csr=@pki_intermediate.csr \
            format=pem_bundle ttl="43800h" \
            | jq -r '.data.certificate' > intermediate.cert.pem
          
          vault write pki_int/intermediate/set-signed certificate=@intermediate.cert.pem
          
          # Configure Transit Engine
          vault write -f transit/keys/ainflue-key
          vault write -f transit/keys/creator-content-key
          vault write -f transit/keys/payment-data-key
          
          # Enable auth methods
          vault auth enable -path=kubernetes kubernetes
          vault auth enable -path=userpass userpass
          vault auth enable -path=ldap ldap
          vault auth enable -path=oidc oidc
          
          # Configure Kubernetes auth
          vault write auth/kubernetes/config \
            token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443" \
            kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            issuer="https://kubernetes.default.svc.cluster.local" \
            disable_iss_validation=true
          
          # Apply policies from configmap
          kubectl get configmap vault-policies -o jsonpath='{.data}' | jq -r 'to_entries[] | select(.key | endswith(".hcl")) | "vault policy write " + (.key | sub(".hcl$"; "")) + " -<<EOF\n" + .value + "\nEOF"' | sh
          
          # Configure roles
          vault write auth/kubernetes/role/ainflue-api \
            bound_service_account_names=ainflue-api \
            bound_service_account_namespaces=ainflue-production \
            policies=ainflue-api-policy \
            ttl=24h
          
          vault write auth/kubernetes/role/ainflue-backend \
            bound_service_account_names=ainflue-backend \
            bound_service_account_namespaces=ainflue-production \
            policies=ainflue-backend-policy \
            ttl=24h
          
          vault write auth/kubernetes/role/external-secrets \
            bound_service_account_names=external-secrets-sa \
            bound_service_account_namespaces=ainflue-production \
            policies=external-secrets-policy \
            ttl=1h
          
          # Configure database secrets engine
          vault write database/config/postgresql \
            plugin_name=postgresql-database-plugin \
            connection_url="postgresql://{{username}}:{{password}}@postgres.ainflue-database.svc.cluster.local:5432/ainflue?sslmode=require" \
            allowed_roles="ainflue-role" \
            username="vault" \
            password="$POSTGRES_PASSWORD"
          
          vault write database/roles/ainflue-role \
            db_name=postgresql \
            creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
            default_ttl="1h" \
            max_ttl="24h"
          
          echo "Vault configuration completed successfully"
        env:
        - name: VAULT_ADDR
          value: "https://vault.vault.svc.cluster.local:8200"
        - name: VAULT_CACERT
          value: "/vault/tls/ca.pem"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretRef:
              name: postgres-vault-user
              key: password
        volumeMounts:
        - name: tls
          mountPath: /vault/tls
          readOnly: true
        - name: policies
          mountPath: /vault/policies
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: tls
        secret:
          secretName: vault-tls
      - name: policies
        configMap:
          name: vault-policies
---
# 🔐 Vault Policies ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-policies
  namespace: vault
  labels:
    app: vault
    component: policies
data:
  admin-policy.hcl: |
    # Admin policy for Vault management
    path "*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }
  
  ainflue-api-policy.hcl: |
    # Policy for Ainflue API service
    path "secret/data/ainflue/api/*" {
      capabilities = ["read"]
    }
    
    path "secret/data/ainflue/database/*" {
      capabilities = ["read"]
    }
    
    path "secret/data/ainflue/payment/*" {
      capabilities = ["read"]
    }
    
    path "transit/encrypt/ainflue-key" {
      capabilities = ["update"]
    }
    
    path "transit/decrypt/ainflue-key" {
      capabilities = ["update"]
    }
    
    path "database/creds/ainflue-role" {
      capabilities = ["read"]
    }
    
    path "pki_int/issue/ainflue-dot-com" {
      capabilities = ["create", "update"]
    }
  
  ainflue-backend-policy.hcl: |
    # Policy for Ainflue backend services
    path "secret/data/ainflue/backend/*" {
      capabilities = ["read"]
    }
    
    path "secret/data/ainflue/shared/*" {
      capabilities = ["read"]
    }
    
    path "transit/encrypt/creator-content-key" {
      capabilities = ["update"]
    }
    
    path "transit/decrypt/creator-content-key" {
      capabilities = ["update"]
    }
    
    path "database/creds/ainflue-role" {
      capabilities = ["read"]
    }
  
  external-secrets-policy.hcl: |
    # Policy for External Secrets Operator
    path "secret/data/ainflue/*" {
      capabilities = ["read"]
    }
    
    path "secret/metadata/ainflue/*" {
      capabilities = ["read", "list"]
    }
  
  creator-economy-policy.hcl: |
    # Policy for Creator Economy services
    path "secret/data/ainflue/creator/*" {
      capabilities = ["read"]
    }
    
    path "secret/data/ainflue/payment/*" {
      capabilities = ["read"]
    }
    
    path "secret/data/ainflue/ai-services/*" {
      capabilities = ["read"]
    }
    
    path "transit/encrypt/creator-content-key" {
      capabilities = ["update"]
    }
    
    path "transit/decrypt/creator-content-key" {
      capabilities = ["update"]
    }
    
    path "transit/encrypt/payment-data-key" {
      capabilities = ["update"]
    }
    
    path "transit/decrypt/payment-data-key" {
      capabilities = ["update"]
    }
  
  backup-policy.hcl: |
    # Policy for Vault backup operations
    path "sys/storage/raft/snapshot" {
      capabilities = ["read"]
    }
    
    path "sys/policies/acl/*" {
      capabilities = ["read", "list"]
    }
    
    path "auth/*/role/*" {
      capabilities = ["read", "list"]
    }
    
    path "sys/mounts" {
      capabilities = ["read"]
    }
---
# 🛡️ Vault RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-init
  namespace: vault
  labels:
    app: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-configure
  namespace: vault
  labels:
    app: vault
---
