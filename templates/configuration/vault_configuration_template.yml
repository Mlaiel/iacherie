# 💾 Vault Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
  namespace: vault
  labels:
    app: vault
    component: backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: vault
            component: backup
        spec:
          serviceAccountName: vault-backup
          restartPolicy: OnFailure
          containers:
          - name: vault-backup
            image: hashicorp/vault:1.15.0
            command:
            - /bin/sh
            - -c
            - |
              # Wait for Vault leader
              until vault status -address=https://vault.vault.svc.cluster.local:8200 | grep -q "HA Enabled.*true"; do
                echo "Waiting for Vault HA..."
                sleep 5
              done
              
              # Get current leader
              LEADER=$(vault status -address=https://vault.vault.svc.cluster.local:8200 -format=json | jq -r '.leader_address')
              echo "Current leader: $LEADER"
              
              # Take snapshot
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="/backup/vault_snapshot_${TIMESTAMP}.snap"
              
              vault operator raft snapshot save -address="$LEADER" "$BACKUP_FILE"
              
              # Compress and encrypt backup
              gzip "$BACKUP_FILE"
              
              # Upload to S3
              aws s3 cp "${BACKUP_FILE}.gz" "s3://ainflue-vault-backups/snapshots/"
              
              # Upload to Azure Blob
              az storage blob upload \
                --account-name ainfluebackups \
                --container-name vault-snapshots \
                --name "vault_snapshot_${TIMESTAMP}.snap.gz" \
                --file "${BACKUP_FILE}.gz"
              
              # Cleanup old local backups (keep last 7 days)
              find /backup -name "vault_snapshot_*.snap.gz" -mtime +7 -delete
              
              echo "Backup completed: vault_snapshot_${TIMESTAMP}.snap.gz"
            env:
            - name: VAULT_ADDR
              value: "https://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretRef:
                  name: vault-backup-token
                  key: token
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretRef:
                  name: vault-backup-aws
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretRef:
                  name: vault-backup-aws
                  key: secret-access-key
            - name: AZURE_STORAGE_KEY
              valueFrom:
                secretRef:
                  name: vault-backup-azure
                  key: storage-key
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
            - name: vault-tls
              mountPath: /vault/tls
              readOnly: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: vault-backup-pvc
          - name: vault-tls
            secret:
              secretName: vault-tls
---
# 🔄 Vault Auto-Unseal Monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-unseal-monitor
  namespace: vault
data:
  monitor.sh: |
    #!/bin/bash
    # Vault Auto-Unseal Monitor
    
    while true; do
      # Check all Vault instances
      for i in 0 1 2; do
        VAULT_ADDR="https://vault-${i}.vault-internal.vault.svc.cluster.local:8200"
        
        # Check if sealed
        if vault status -address="$VAULT_ADDR" | grep -q "Sealed.*true"; then
          echo "Vault instance vault-${i} is sealed, checking auto-unseal status..."
          
          # Check auto-unseal configuration
          if vault status -address="$VAULT_ADDR" | grep -q "Recovery Seal Type.*awskms"; then
            echo "Auto-unseal configured, waiting for automatic unseal..."
          else
            echo "Manual unseal required for vault-${i}"
            # Send alert
            curl -X POST \
              -H 'Content-type: application/json' \
              --data '{"text":"Vault instance vault-'${i}' requires manual unseal"}' \
              "$SLACK_WEBHOOK_URL"
          fi
        fi
      done
      
      sleep 30
    done
---
