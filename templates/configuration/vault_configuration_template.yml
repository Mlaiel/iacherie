metadata:
  name: vault-server
  labels:
    app: vault
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-server
  labels:
    app: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-server
subjects:
- kind: ServiceAccount
  name: vault
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-init
  labels:
    app: vault
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "list", "update", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-init
  labels:
    app: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-init
subjects:
- kind: ServiceAccount
  name: vault-init
  namespace: vault
---
# 🔐 Vault Agent Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config
  namespace: vault
  labels:
    app: vault-agent
data:
  vault-agent.hcl: |
    # Vault Agent Configuration
    exit_after_auth = false
    pid_file = "/tmp/pidfile"
    
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "ainflue-api"
        }
      }
      
      sink "file" {
        config = {
          path = "/vault/secrets/token"
        }
      }
    }
    
    cache {
      use_auto_auth_token = true
    }
    
    listener "tcp" {
      address = "127.0.0.1:8007"
      tls_disable = true
    }
    
    template {
      source = "/vault/templates/database.ctmpl"
      destination = "/vault/secrets/database.env"
      error_on_missing_key = true
      perms = 0640
      command = "pkill -HUP application"
      command_timeout = "60s"
      wait {
        min = "2s"
        max = "10s"
      }
    }
    
    template {
      source = "/vault/templates/api-keys.ctmpl"
      destination = "/vault/secrets/api-keys.env"
      error_on_missing_key = true
      perms = 0640
    }
    
    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/ca.pem"
      retry {
        num_retries = 5
      }
    }
---
# 📊 Vault Monitoring
apiVersion: v1
kind: Service
metadata:
  name: vault-metrics
  namespace: vault
  labels:
    app: vault
    component: metrics
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8200"
    prometheus.io/path: "/v1/sys/metrics"
    prometheus.io/scheme: "https"
spec:
  type: ClusterIP
  ports:
  - name: vault-metrics
    port: 8200
    targetPort: 8200
    protocol: TCP
  selector:
    app: vault
    component: server
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vault-metrics
  namespace: vault
  labels:
    app: vault
    component: metrics
spec:
  selector:
    matchLabels:
      app: vault
      component: metrics
  endpoints:
  - port: vault-metrics
    path: /v1/sys/metrics
    scheme: https
    tlsConfig:
      caFile: /etc/ssl/certs/vault-ca.pem
      serverName: vault.vault.svc.cluster.local
    interval: 30s
    scrapeTimeout: 10s
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
---
# 🚨 Vault Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vault-alerts
  namespace: vault
  labels:
    app: vault
    component: alerts
spec:
  groups:
  - name: vault.rules
    rules:
    - alert: VaultDown
      expr: up{job="vault-metrics"} == 0
      for: 5m
      labels:
        severity: critical
        service: vault
      annotations:
        summary: "Vault instance is down"
        description: "Vault instance {{ $labels.instance }} has been down for more than 5 minutes"
    
    - alert: VaultSealed
      expr: vault_core_unsealed == 0
      for: 0m
      labels:
        severity: critical
        service: vault
      annotations:
        summary: "Vault is sealed"
        description: "Vault instance {{ $labels.instance }} is sealed"
    
    - alert: VaultTooManyPendingTokens
      expr: vault_token_count_by_ttl{creation_ttl="+Inf"} > 10000
      for: 5m
      labels:
        severity: warning
        service: vault
      annotations:
        summary: "Too many pending tokens in Vault"
        description: "Vault has {{ $value }} pending tokens"
    
    - alert: VaultTooManyLeases
      expr: vault_expire_num_leases > 50000
      for: 5m
      labels:
        severity: warning
        service: vault
      annotations:
        summary: "Too many leases in Vault"
        description: "Vault has {{ $value }} active leases"
    
    - alert: VaultLeadershipLost
      expr: vault_core_leader == 0
      for: 1m
      labels:
        severity: critical
        service: vault
      annotations:
        summary: "Vault leadership lost"
        description: "Vault instance {{ $labels.instance }} lost leadership"

