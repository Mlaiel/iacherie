# 💰 Payment Service Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iacherie-payment-service-network-policy
  namespace: iacherie-production
  labels:
    app: iacherie-payment-service
    policy-type: application
    security-level: critical
spec:
  podSelector:
    matchLabels:
      app: iacherie-payment-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from API service only
  - from:
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-api
    ports:
    - protocol: TCP
      port: 8080
  # Allow from monetization service
  - from:
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-monetization
    ports:
    - protocol: TCP
      port: 8080
  # Allow webhook calls from payment providers
  - from: []  # External sources
    ports:
    - protocol: TCP
      port: 8080
  # Allow monitoring (restricted)
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Allow to database (encrypted)
  - to:
    - namespaceSelector:
        matchLabels:
          name: iacherie-database
      podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432
  # Allow to payment gateways
  - to: []
    ports:
    - protocol: TCP
      port: 443  # Only HTTPS
  # Allow DNS
  - to: []
    ports:
    - protocol: UDP
      port: 53
---
# 💾 Database Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iacherie-database-network-policy
  namespace: iacherie-database
  labels:
    app: postgresql
    policy-type: database
    security-level: critical
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from application services only
  - from:
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-api
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-content-processor
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-payment-service
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-auth-service
    ports:
    - protocol: TCP
      port: 5432
  # Allow from backup services
  - from:
    - namespaceSelector:
        matchLabels:
          name: iacherie-database
      podSelector:
        matchLabels:
          app: pg-backup
    ports:
    - protocol: TCP
      port: 5432
  # Allow monitoring (limited)
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
      podSelector:
        matchLabels:
          app: postgres-exporter
    ports:
    - protocol: TCP
      port: 5432
  egress:
  # Allow DNS for replication/backup
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow backup to external storage
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
