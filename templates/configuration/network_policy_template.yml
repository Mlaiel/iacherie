# ===================================================================
# 🔒 CALICO NETWORK POLICIES (Enhanced Security)
# ===================================================================

# 🛡️ Calico Global Network Policy
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: iacherie-global-security-policy
spec:
  tier: security
  order: 100
  namespaceSelector: 'has(projectcalico.org/name) && projectcalico.org/name startsWith "iacherie"'
  types:
  - Ingress
  - Egress
  ingress:
  # Allow from same namespace
  - action: Allow
    source:
      namespaceSelector: 'projectcalico.org/name == global.projectcalico.org/name'
  # Deny by default
  - action: Deny
  egress:
  # Allow DNS
  - action: Allow
    protocol: UDP
    destination:
      ports: [53]
  - action: Allow
    protocol: TCP
    destination:
      ports: [53]
  # Allow NTP
  - action: Allow
    protocol: UDP
    destination:
      ports: [123]
  # Deny by default
  - action: Deny
---
# 🌐 Calico Network Policy for External Access
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: iacherie-external-access-policy
  namespace: iacherie-production
spec:
  tier: platform
  order: 200
  selector: 'app == "iacherie-api"'
  types:
  - Egress
  egress:
  # Allow HTTPS to payment gateways
  - action: Allow
    protocol: TCP
    destination:
      nets:
      - 0.0.0.0/0
      ports: [443]
      domains:
      - "api.stripe.com"
      - "api.paypal.com"
      - "api.square.com"
  # Allow specific AWS services
  - action: Allow
    protocol: TCP
    destination:
      nets:
      - 52.94.0.0/22    # AWS S3
      - 54.231.0.0/16   # AWS S3
      ports: [443]
  # Allow specific GCP services
  - action: Allow
    protocol: TCP
    destination:
      nets:
      - 64.233.160.0/19  # Google APIs
      - 66.249.80.0/20   # Google APIs
      ports: [443]
  # Deny all other external access
  - action: Deny
    protocol: TCP
    destination:
      nets: [0.0.0.0/0]
---
# 🔐 Calico Host Endpoint Policy
apiVersion: projectcalico.org/v3
kind: HostEndpoint
metadata:
  name: iacherie-node-security
  labels:
    environment: production
    security-zone: restricted
spec:
  node: "*"
  expectedIPs: ["10.0.0.0/8"]
---
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: iacherie-host-security-policy
spec:
  tier: host
  order: 0
  nodeSelector: 'has(environment) && environment == "production"'
  types:
  - Ingress
  - Egress
  ingress:
  # Allow SSH from bastion hosts only
  - action: Allow
    protocol: TCP
    source:
      nets: ["10.0.0.10/32", "10.0.0.11/32"]  # Bastion hosts
    destination:
      ports: [22]
  # Allow kubelet
  - action: Allow
    protocol: TCP
    source:
      nets: ["10.0.0.0/8"]
    destination:
      ports: [10250, 10255]
  # Allow node communication
  - action: Allow
    protocol: TCP
    source:
      nets: ["10.0.0.0/8"]
    destination:
      ports: [2379, 2380, 6443]
  # Allow monitoring
  - action: Allow
    protocol: TCP
    source:
      nets: ["10.0.1.0/24"]  # Monitoring subnet
    destination:
      ports: [9100, 9256]  # Node exporter, Calico metrics
  egress:
  # Allow cluster communication
  - action: Allow
    protocol: TCP
    destination:
      nets: ["10.0.0.0/8"]
  # Allow DNS
  - action: Allow
    protocol: UDP
    destination:
      ports: [53]
  # Allow NTP
  - action: Allow
    protocol: UDP
    destination:
      ports: [123]
  # Allow package updates (controlled)
  - action: Allow
    protocol: TCP
    destination:
      nets: ["0.0.0.0/0"]
      ports: [80, 443]

