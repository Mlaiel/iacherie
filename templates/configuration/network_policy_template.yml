# 🎨 Creator Content Upload Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: creator-content-upload-policy
  namespace: iacherie-production
  labels:
    app: creator-upload
    policy-type: creator-economy
    security-level: medium
spec:
  podSelector:
    matchLabels:
      app: iacherie-upload-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from creators (authenticated)
  - from:
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-frontend
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-mobile
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow to content processor
  - to:
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-content-processor
    ports:
    - protocol: TCP
      port: 8080
  # Allow to storage
  - to:
    - namespaceSelector:
        matchLabels:
          name: iacherie-storage
      podSelector:
        matchLabels:
          app: minio
    ports:
    - protocol: TCP
      port: 9000
  # Allow external cloud storage
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# 💰 Creator Monetization Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: creator-monetization-policy
  namespace: iacherie-production
  labels:
    app: creator-monetization
    policy-type: creator-economy
    security-level: critical
spec:
  podSelector:
    matchLabels:
      app: iacherie-monetization
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from authenticated users only
  - from:
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-api
    ports:
    - protocol: TCP
      port: 8080
  # Allow webhook callbacks
  - from: []  # External payment providers
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow to payment service
  - to:
    - namespaceSelector:
        matchLabels:
          name: iacherie-production
      podSelector:
        matchLabels:
          app: iacherie-payment-service
    ports:
    - protocol: TCP
      port: 8080
  # Allow to analytics
  - to:
    - namespaceSelector:
        matchLabels:
          name: iacherie-analytics
      podSelector:
        matchLabels:
          app: analytics-engine
    ports:
    - protocol: TCP
      port: 8080
  # Allow to database
  - to:
    - namespaceSelector:
        matchLabels:
          name: iacherie-database
      podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432

