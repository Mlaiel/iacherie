version: "3.8"

# ==============================================================================
# BUILDX BUILDER CONFIGURATION
# ==============================================================================

# Create a custom builder instance for Creator Economy builds
x-builder-config: &builder-config
  name: iacherie-creator-economy-builder
  driver: docker-container
  driver-opts:
    - image=moby/buildkit:buildx-stable-1
    - network=host
  use: true
  platforms:
    - linux/amd64
    - linux/arm64
    - linux/arm/v7
  buildkitd-flags:
    - --allow-insecure-entitlement=security.insecure
    - --allow-insecure-entitlement=network.host
  config: |
    [worker.oci]
      max-parallelism = 4
    [worker.containerd]
      max-parallelism = 4
    [registry."docker.io"]
      mirrors = ["mirror.gcr.io"]

# ==============================================================================
# BUILD TARGETS AND CONFIGURATIONS
# ==============================================================================

services:
  # ==============================================================================
  # CREATOR PLATFORM BUILD
  # ==============================================================================
  creator-platform-build:
    build:
      context: ./services/creator-platform
      dockerfile: Dockerfile
      target: production
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        - BUILDKIT_INLINE_CACHE=1
        - APP_VERSION=${CREATOR_PLATFORM_VERSION:-latest}
        - BUILD_DATE=${BUILD_DATE}
        - VCS_REF=${GIT_COMMIT}
        - BUILD_ENV=production
        - PYTHON_VERSION=3.11
        - NODE_VERSION=18
      cache_from:
        - type=registry,ref=ghcr.io/iacherie/creator-platform:buildcache
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=registry,ref=ghcr.io/iacherie/creator-platform:buildcache,mode=max
        - type=local,dest=/tmp/.buildx-cache-new,mode=max
      secrets:
        - id=github_token,src=./secrets/github_token
        - id=npm_token,src=./secrets/npm_token
      ssh:
        default: $SSH_AUTH_SOCK
      labels:
        - "org.opencontainers.image.title=iacherie Creator Platform"
        - "org.opencontainers.image.description=Creator Economy Platform Service"
        - "org.opencontainers.image.version=${CREATOR_PLATFORM_VERSION:-latest}"
        - "org.opencontainers.image.authors=Fahed Mlaiel <mlaiel@live.de>"
        - "org.opencontainers.image.vendor=iacherie"
        - "org.opencontainers.image.licenses=Proprietary"
        - "org.opencontainers.image.source=https://github.com/Mlaiel/iacherie"
        - "org.opencontainers.image.revision=${GIT_COMMIT}"
        - "org.opencontainers.image.created=${BUILD_DATE}"
        - "iacherie.business.unit=creator-economy"
        - "iacherie.service.type=platform"
        - "iacherie.security.level=enterprise"
    image: ghcr.io/iacherie/creator-platform:${CREATOR_PLATFORM_VERSION:-latest}
    
  # ==============================================================================
  # AI PROCESSING SERVICE BUILD
  # ==============================================================================
  ai-processor-build:
    build:
      context: ./services/ai-processor
      dockerfile: Dockerfile.gpu
      target: ai-processing
      platforms:
        - linux/amd64  # GPU support primarily on AMD64
      args:
        - BUILDKIT_INLINE_CACHE=1
        - APP_VERSION=${AI_PROCESSOR_VERSION:-latest}
        - BUILD_DATE=${BUILD_DATE}
        - VCS_REF=${GIT_COMMIT}
        - BUILD_ENV=production
        - PYTHON_VERSION=3.11
        - CUDA_VERSION=11.8
        - PYTORCH_VERSION=2.1.0
        - TENSORFLOW_VERSION=2.13.0
      cache_from:
        - type=registry,ref=ghcr.io/iacherie/ai-processor:buildcache
        - type=local,src=/tmp/.buildx-cache-ai
      cache_to:
        - type=registry,ref=ghcr.io/iacherie/ai-processor:buildcache,mode=max
        - type=local,dest=/tmp/.buildx-cache-ai-new,mode=max
      secrets:
        - id=huggingface_token,src=./secrets/huggingface_token
        - id=pytorch_token,src=./secrets/pytorch_token
      labels:
        - "org.opencontainers.image.title=iacherie AI Processor"
        - "org.opencontainers.image.description=AI Processing Service with GPU Support"
        - "org.opencontainers.image.version=${AI_PROCESSOR_VERSION:-latest}"
        - "org.opencontainers.image.authors=Fahed Mlaiel <mlaiel@live.de>"
        - "org.opencontainers.image.vendor=iacherie"
        - "org.opencontainers.image.licenses=Proprietary"
        - "org.opencontainers.image.source=https://github.com/Mlaiel/iacherie"
        - "org.opencontainers.image.revision=${GIT_COMMIT}"
        - "org.opencontainers.image.created=${BUILD_DATE}"
        - "iacherie.business.unit=ai-processing"
        - "iacherie.service.type=compute"
        - "iacherie.gpu.enabled=true"
        - "iacherie.security.level=enterprise"
    image: ghcr.io/iacherie/ai-processor:${AI_PROCESSOR_VERSION:-latest}
    
  # ==============================================================================
  # COLLABORATION SERVICE BUILD  
  # ==============================================================================
  collaboration-service-build:
    build:
      context: ./services/collaboration
      dockerfile: Dockerfile
      target: production
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        - BUILDKIT_INLINE_CACHE=1
        - APP_VERSION=${COLLABORATION_VERSION:-latest}
        - BUILD_DATE=${BUILD_DATE}
        - VCS_REF=${GIT_COMMIT}
        - BUILD_ENV=production
        - NODE_VERSION=18
        - WEBSOCKET_ENABLED=true
        - REAL_TIME_EDITING=true
      cache_from:
        - type=registry,ref=ghcr.io/iacherie/collaboration-service:buildcache
      cache_to:
        - type=registry,ref=ghcr.io/iacherie/collaboration-service:buildcache,mode=max
      secrets:
        - id=npm_token,src=./secrets/npm_token
      labels:
        - "org.opencontainers.image.title=iacherie Collaboration Service"
        - "org.opencontainers.image.description=Real-time Collaboration Service"
        - "org.opencontainers.image.version=${COLLABORATION_VERSION:-latest}"
        - "org.opencontainers.image.authors=Fahed Mlaiel <mlaiel@live.de>"
        - "org.opencontainers.image.vendor=iacherie"
        - "org.opencontainers.image.licenses=Proprietary"
        - "iacherie.business.unit=creator-economy"
        - "iacherie.service.type=collaboration"
        - "iacherie.realtime.enabled=true"
    image: ghcr.io/iacherie/collaboration-service:${COLLABORATION_VERSION:-latest}
    
  # ==============================================================================
  # MONETIZATION SERVICE BUILD
  # ==============================================================================
  monetization-service-build:
    build:
      context: ./services/monetization
      dockerfile: Dockerfile
      target: production
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        - BUILDKIT_INLINE_CACHE=1
        - APP_VERSION=${MONETIZATION_VERSION:-latest}
        - BUILD_DATE=${BUILD_DATE}
        - VCS_REF=${GIT_COMMIT}
        - BUILD_ENV=production
        - PYTHON_VERSION=3.11
        - PAYMENT_PROVIDERS=stripe,paypal,square
        - SECURITY_LEVEL=high
      cache_from:
        - type=registry,ref=ghcr.io/iacherie/monetization-service:buildcache
      cache_to:
        - type=registry,ref=ghcr.io/iacherie/monetization-service:buildcache,mode=max
      secrets:
        - id=stripe_key,src=./secrets/stripe_key
        - id=paypal_key,src=./secrets/paypal_key
      labels:
        - "org.opencontainers.image.title=iacherie Monetization Service"
        - "org.opencontainers.image.description=Payment and Revenue Sharing Service"
        - "org.opencontainers.image.version=${MONETIZATION_VERSION:-latest}"
        - "org.opencontainers.image.authors=Fahed Mlaiel <mlaiel@live.de>"
        - "org.opencontainers.image.vendor=iacherie"
        - "org.opencontainers.image.licenses=Proprietary"
        - "iacherie.business.unit=creator-economy"
        - "iacherie.service.type=monetization"
        - "iacherie.security.level=high"
        - "iacherie.compliance.pci=required"
    image: ghcr.io/iacherie/monetization-service:${MONETIZATION_VERSION:-latest}
    
  # ==============================================================================
  # API GATEWAY BUILD
  # ==============================================================================
  api-gateway-build:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
      target: production
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        - BUILDKIT_INLINE_CACHE=1
        - APP_VERSION=${API_GATEWAY_VERSION:-latest}
        - BUILD_DATE=${BUILD_DATE}
        - VCS_REF=${GIT_COMMIT}
        - BUILD_ENV=production
        - GO_VERSION=1.21
        - RATE_LIMITING=true
        - AUTHENTICATION=jwt
      cache_from:
        - type=registry,ref=ghcr.io/iacherie/api-gateway:buildcache
      cache_to:
        - type=registry,ref=ghcr.io/iacherie/api-gateway:buildcache,mode=max
      labels:
        - "org.opencontainers.image.title=iacherie API Gateway"
        - "org.opencontainers.image.description=Creator Economy API Gateway"
        - "org.opencontainers.image.version=${API_GATEWAY_VERSION:-latest}"
        - "org.opencontainers.image.authors=Fahed Mlaiel <mlaiel@live.de>"
        - "org.opencontainers.image.vendor=iacherie"
        - "org.opencontainers.image.licenses=Proprietary"
        - "iacherie.business.unit=creator-economy"
        - "iacherie.service.type=gateway"
        - "iacherie.rate.limiting=enabled"
    image: ghcr.io/iacherie/api-gateway:${API_GATEWAY_VERSION:-latest}

# ==============================================================================
# BUILDX BAKE CONFIGURATION
# ==============================================================================

# Bake file for coordinated multi-service builds
x-bake-config: &bake-config
  group:
    default:
      targets:
        - creator-platform-build
        - ai-processor-build
        - collaboration-service-build
        - monetization-service-build
        - api-gateway-build
    
    creator-economy:
      targets:
        - creator-platform-build
        - collaboration-service-build
        - monetization-service-build
    
    ai-processing:
      targets:
        - ai-processor-build
    
    core-services:
      targets:
        - api-gateway-build
        - creator-platform-build

# ==============================================================================
# BUILD OPTIMIZATION CONFIGURATIONS
# ==============================================================================

x-build-optimizations: &build-optimizations
  # Build context optimizations
  context_optimization:
    - name: "Use .dockerignore"
      description: "Exclude unnecessary files from build context"
      dockerignore_patterns:
        - "**/.git"
        - "**/.gitignore"
        - "**/README.md"
        - "**/docs"
        - "**/tests"
        - "**/__pycache__"
        - "**/*.pyc"
        - "**/node_modules"
        - "**/.npm"
        - "**/.cache"
        - "**/tmp"
        - "**/*.log"
  
  # Layer caching strategies
  layer_caching:
    - name: "Dependency layers first"
      description: "Install dependencies before copying source code"
      strategy: "separate_dependency_installation"
    
    - name: "Multi-stage builds"
      description: "Use multi-stage builds to minimize final image size"
      strategy: "build_stage_separation"
    
    - name: "Cache mount optimization"
      description: "Use BuildKit cache mounts for package managers"
      cache_mounts:
        - "/root/.cache/pip"
        - "/root/.npm"
        - "/go/pkg/mod"
        - "/root/.cache/go-build"
  
  # Build parallelization
  parallelization:
    - name: "Concurrent builds"
      description: "Build multiple services in parallel"
      max_parallel_builds: 4
    
    - name: "Platform parallel builds"
      description: "Build multiple platforms concurrently"
      parallel_platforms: true

# ==============================================================================
# SECURITY SCANNING INTEGRATION
# ==============================================================================

x-security-scanning: &security-scanning
  # Vulnerability scanning
  vulnerability_scanning:
    - scanner: "trivy"
      config:
        severity: "HIGH,CRITICAL"
        ignore_unfixed: false
        format: "sarif"
        output: "./security-reports/trivy-results.sarif"
    
    - scanner: "snyk"
      config:
        test_all_projects: true
        fail_on: "all"
        severity_threshold: "high"
        output: "./security-reports/snyk-results.json"
  
  # License scanning
  license_scanning:
    - scanner: "fossa"
      config:
        project: "iacherie-creator-economy"
        revision: "${GIT_COMMIT}"
        output: "./security-reports/license-report.json"
  
  # Secret scanning
  secret_scanning:
    - scanner: "gitleaks"
      config:
        config_path: "./.gitleaks.toml"
        no_git: true
        redact: true
        report_path: "./security-reports/gitleaks-report.json"

# ==============================================================================
# CI/CD INTEGRATION
# ==============================================================================

x-cicd-integration: &cicd-integration
  # GitHub Actions integration
  github_actions:
    workflow_triggers:
      - push
      - pull_request
      - release
    
    build_matrix:
      platform:
        - linux/amd64
        - linux/arm64
      service:
        - creator-platform
        - ai-processor
        - collaboration-service
        - monetization-service
        - api-gateway
    
    cache_strategy:
      - type: "gha"
        scope: "buildx"
      - type: "registry"
        ref: "ghcr.io/iacherie/buildcache"
  
  # GitLab CI integration
  gitlab_ci:
    stages:
      - build
      - test
      - security-scan
      - deploy
    
    build_jobs:
      - name: "build-creator-platform"
        stage: "build"
        image: "docker:24-dind"
        services:
          - "docker:24-dind"
        variables:
          DOCKER_BUILDKIT: "1"
          BUILDX_PLATFORMS: "linux/amd64,linux/arm64"
  
  # Jenkins integration
  jenkins:
    pipeline_type: "declarative"
    agent:
      label: "docker-buildx"
    
    stages:
      - checkout
      - build
      - test
      - security-scan
      - push
      - deploy
    
    parallel_builds:
      enabled: true
      max_concurrent: 4

# ==============================================================================
# MONITORING AND METRICS
# ==============================================================================

x-build-monitoring: &build-monitoring
  # Build metrics collection
  metrics:
    - name: "build_duration"
      type: "histogram"
      description: "Time taken for each build"
      labels:
        - service
        - platform
        - stage
    
    - name: "build_cache_hit_ratio"
      type: "gauge"
      description: "Cache hit ratio for builds"
      labels:
        - service
        - cache_type
    
    - name: "image_size"
      type: "gauge"
      description: "Final image size in bytes"
      labels:
        - service
        - platform
    
    - name: "build_success_rate"
      type: "counter"
      description: "Number of successful builds"
      labels:
        - service
        - platform
  
  # Build notifications
  notifications:
    - type: "slack"
      webhook_url: "${SLACK_WEBHOOK_URL}"
      channels:
        - "#devops-builds"
        - "#creator-economy-alerts"
      events:
        - build_success
        - build_failure
        - security_scan_failure
    
    - type: "email"
      recipients:
        - "devops@iacherie.com"
        - "security@iacherie.com"
      events:
        - build_failure
        - security_scan_failure

# ==============================================================================
# BUILD ENVIRONMENT VARIABLES
# ==============================================================================

x-environment-variables: &environment-variables
  # Build metadata
  BUILD_DATE: "${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"
  GIT_COMMIT: "${GIT_COMMIT:-$(git rev-parse HEAD)}"
  GIT_BRANCH: "${GIT_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
  BUILD_NUMBER: "${BUILD_NUMBER:-local}"
  
  # Registry configuration
  REGISTRY_URL: "ghcr.io/iacherie"
  IMAGE_TAG_STRATEGY: "semantic"
  
  # Creator Economy specific
  CREATOR_ECONOMY_FEATURES: "true"
  AI_PROCESSING_ENABLED: "true"
  COLLABORATION_ENABLED: "true"
  MONETIZATION_ENABLED: "true"
  SEO_OPTIMIZATION_ENABLED: "true"
  
  # Security settings
  SECURITY_SCANNING_ENABLED: "true"
  VULNERABILITY_THRESHOLD: "HIGH"
  LICENSE_COMPLIANCE_CHECK: "true"
  
  # Performance settings
  BUILD_PARALLELISM: "4"
  CACHE_OPTIMIZATION: "true"
  LAYER_COMPRESSION: "true"

# ==============================================================================
# CREATOR ECONOMY BUILD PROFILES
# ==============================================================================

profiles:
  # Development profile
  development:
    services:
      creator-platform-build:
        build:
          target: development
          cache_from: []
          cache_to: []
      ai-processor-build:
        build:
          target: development
          args:
            - BUILD_ENV=development
            - DEBUG=true
  
  # Staging profile
  staging:
    services:
      creator-platform-build:
        build:
          target: staging
          args:
            - BUILD_ENV=staging
            - MONITORING_ENABLED=true
      ai-processor-build:
        build:
          target: staging
          args:
            - BUILD_ENV=staging
            - PROFILING_ENABLED=true
  
  # Production profile  
  production:
    services:
      creator-platform-build:
        build:
          target: production
          args:
            - BUILD_ENV=production
            - OPTIMIZATION_LEVEL=max
            - SECURITY_HARDENING=true
      ai-processor-build:
        build:
          target: production
          args:
            - BUILD_ENV=production
            - GPU_OPTIMIZATION=true
            - SECURITY_HARDENING=true