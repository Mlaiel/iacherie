# PostgreSQL Configuration for Ainflue Creator Economy Platform
# Optimized for high-performance content processing and analytics

# =====================================================================================
# POSTGRESQL.CONF - MAIN CONFIGURATION
# =====================================================================================

# -----------------------------------------------------------------------------
# FILE LOCATIONS
# -----------------------------------------------------------------------------

# Location of the database cluster directory
# data_directory = '/var/lib/postgresql/15/main'

# Location of the configuration files
# hba_file = '/etc/postgresql/15/main/pg_hba.conf'
# ident_file = '/etc/postgresql/15/main/pg_ident.conf'

# Location of external PID file
# external_pid_file = '/var/run/postgresql/15-main.pid'

# -----------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
# -----------------------------------------------------------------------------

# Connection settings
listen_addresses = '*'  # Listen on all interfaces for containerized environments
port = 5432

# Connection limits
max_connections = 500  # Increased for creator economy workloads
superuser_reserved_connections = 5

# Connection pooling (for use with PgBouncer)
# reserved_connections = 10

# Authentication
authentication_timeout = 1min
password_encryption = scram-sha-256  # Strongest encryption
ssl = on
ssl_cert_file = '/etc/ssl/certs/server.crt'
ssl_key_file = '/etc/ssl/private/server.key'
ssl_ca_file = '/etc/ssl/certs/ca.crt'
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# Database settings
max_databases = 100  # Support for multiple creator tenants

# -----------------------------------------------------------------------------
# RESOURCE USAGE (MEMORY)
# -----------------------------------------------------------------------------

# Memory configuration optimized for creator content processing
shared_buffers = 2GB  # 25% of system RAM for dedicated server
huge_pages = try
temp_buffers = 32MB
max_prepared_transactions = 100

# Work memory for complex queries (creator analytics)
work_mem = 32MB  # Per operation
maintenance_work_mem = 512MB  # For VACUUM, CREATE INDEX, etc.
autovacuum_work_mem = 512MB  # For autovacuum workers

# Memory for connections
max_stack_depth = 7MB

# Kernel resource usage
dynamic_shared_memory_type = posix

# -----------------------------------------------------------------------------
# RESOURCE USAGE (DISK)
# -----------------------------------------------------------------------------

# Disk usage parameters
temp_file_limit = 10GB  # Limit for temporary files (content processing)
max_files_per_process = 4000

# -----------------------------------------------------------------------------
# RESOURCE USAGE (KERNEL RESOURCES)
# -----------------------------------------------------------------------------

# Semaphore usage
max_pred_locks_per_transaction = 128
max_pred_locks_per_relation = 512
max_pred_locks_per_page = 4

# -----------------------------------------------------------------------------
# WRITE-AHEAD LOGGING (WAL)
# -----------------------------------------------------------------------------

# WAL configuration for high-availability creator platform
wal_level = replica  # Support for streaming replication
fsync = on  # Ensure data durability
synchronous_commit = on  # Wait for WAL to be written to disk
wal_sync_method = fdatasync

# WAL buffers
wal_buffers = 64MB  # Large buffer for high write workloads
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# Checkpoints
checkpoint_completion_target = 0.9  # Spread checkpoint I/O
checkpoint_timeout = 15min
checkpoint_warning = 30s
checkpoint_flush_after = 256kB

# Archiving for backup (creator content protection)
archive_mode = on
archive_command = '/usr/local/bin/archive_wal.sh %p %f'
archive_timeout = 1800s  # 30 minutes

# Recovery settings
max_wal_size = 4GB
min_wal_size = 1GB
wal_compression = on  # Compress WAL for storage efficiency
wal_log_hints = on  # Support for pg_rewind

# -----------------------------------------------------------------------------
# REPLICATION
# -----------------------------------------------------------------------------

# Streaming replication for high availability
max_wal_senders = 10  # Support multiple read replicas
max_replication_slots = 20
wal_keep_size = 2GB
wal_sender_timeout = 60s
max_slot_wal_keep_size = 5GB

# Hot standby settings
hot_standby = on
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s
wal_receiver_create_temp_slot = off
hot_standby_feedback = on

# Logical replication for data synchronization
max_logical_replication_workers = 8
max_sync_workers_per_subscription = 4

# -----------------------------------------------------------------------------
# QUERY TUNING
# -----------------------------------------------------------------------------

# Query planning
enable_bitmapscan = on
enable_hashagg = on
enable_hashjoin = on
enable_indexscan = on
enable_indexonlyscan = on
enable_material = on
enable_mergejoin = on
enable_nestloop = on
enable_parallel_append = on
enable_parallel_hash = on
enable_partition_pruning = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
enable_seqscan = on
enable_sort = on
enable_tidscan = on

# Planner cost constants (tuned for SSD storage)
seq_page_cost = 1.0
random_page_cost = 1.1  # SSD-optimized
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0
min_parallel_table_scan_size = 8MB
min_parallel_index_scan_size = 512kB

# Genetic query optimizer
geqo = on
geqo_threshold = 12
geqo_effort = 5
geqo_pool_size = 0
geqo_generations = 0
geqo_selection_bias = 2.0
geqo_seed = 0.0

# Other planner options
default_statistics_target = 1000  # Higher for better query planning
constraint_exclusion = partition
cursor_tuple_fraction = 0.1
from_collapse_limit = 8
join_collapse_limit = 8
force_parallel_mode = off
jit = on  # Just-in-time compilation for complex queries
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# -----------------------------------------------------------------------------
# REPORTING AND LOGGING
# -----------------------------------------------------------------------------

# Error reporting
log_destination = 'csvlog'  # Structured logging for analysis
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# What to log
client_min_messages = notice
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000  # Log queries > 1 second

# Detailed logging for creator platform monitoring
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_error_verbosity = default
log_hostname = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_lock_waits = on  # Log lock waits > deadlock_timeout
log_parameter_max_length = 4096
log_parameter_max_length_on_error = 0
log_statement = 'ddl'  # Log DDL statements
log_replication_commands = on
log_temp_files = 0  # Log all temporary files
log_timezone = 'UTC'

# Process title
cluster_name = 'ainflue-production'  # Identify cluster in process list

# -----------------------------------------------------------------------------
# RUNTIME STATISTICS
# -----------------------------------------------------------------------------

# Statistics collection
track_activities = on
track_activity_query_size = 8192  # Larger for complex creator queries
track_counts = on
track_io_timing = on  # Monitor I/O performance
track_wal_io_timing = on
track_functions = all  # Track function call statistics
stats_temp_directory = '/var/run/postgresql/stats_temp'

# -----------------------------------------------------------------------------
# AUTOVACUUM
# -----------------------------------------------------------------------------

# Autovacuum settings optimized for creator content workloads
autovacuum = on
autovacuum_max_workers = 6  # More workers for busy creator platform
autovacuum_naptime = 30s  # Check more frequently
autovacuum_vacuum_threshold = 500
autovacuum_vacuum_insert_threshold = 1000
autovacuum_analyze_threshold = 250
autovacuum_vacuum_scale_factor = 0.1  # More aggressive for high churn
autovacuum_vacuum_insert_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_freeze_max_age = 200000000
autovacuum_multixact_freeze_max_age = 400000000
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 2000  # Higher for better performance

# -----------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
# -----------------------------------------------------------------------------

# Statement behavior
search_path = '"$user", public, ainflue_shared'  # Include shared schemas
row_security = on
default_table_access_method = 'heap'
default_tablespace = ''
temp_tablespaces = ''
check_function_bodies = on
default_transaction_isolation = 'read committed'
default_transaction_read_only = off
default_transaction_deferrable = off
session_replication_role = 'origin'
statement_timeout = 300s  # 5 minutes for creator processing queries
lock_timeout = 60s
idle_in_transaction_session_timeout = 600s  # 10 minutes
idle_session_timeout = 3600s  # 1 hour
vacuum_cleanup_index_scale_factor = 0.1

# Locale and formatting
datestyle = 'iso, mdy'
intervalstyle = 'postgres'
timezone = 'UTC'
timezone_abbreviations = 'Default'
extra_float_digits = 1
client_encoding = 'UTF8'

# Shared library preloading
shared_preload_libraries = 'pg_stat_statements,auto_explain,pg_prewarm'
local_preload_libraries = ''
session_preload_libraries = ''

# Other defaults
dynamic_library_path = '$libdir'

# -----------------------------------------------------------------------------
# LOCK MANAGEMENT
# -----------------------------------------------------------------------------

deadlock_timeout = 1s
max_locks_per_transaction = 256  # Higher for creator content operations
max_pred_locks_per_transaction = 128

# -----------------------------------------------------------------------------
# VERSION AND PLATFORM COMPATIBILITY
# -----------------------------------------------------------------------------

array_nulls = on
backslash_quote = safe_encoding
escape_string_warning = on
lo_compat_privileges = off
quote_all_identifiers = off
standard_conforming_strings = on
synchronize_seqscans = on

# -----------------------------------------------------------------------------
# ERROR HANDLING
# -----------------------------------------------------------------------------

exit_on_error = off
restart_after_crash = on
data_sync_retry = off

# -----------------------------------------------------------------------------
# CONFIG FILE INCLUDES
# -----------------------------------------------------------------------------

# Include other configuration files
include_dir = 'conf.d'  # Include additional config files
# include_if_exists = 'exists.conf'
# include = 'special.conf'

# =====================================================================================
# PG_HBA.CONF - CLIENT AUTHENTICATION
# =====================================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256  # Private networks
host    all             all             172.16.0.0/12           scram-sha-256  # Docker networks
host    all             all             192.168.0.0/16          scram-sha-256  # Private networks

# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256

# Creator Economy specific databases
host    ainflue_production    ainflue_app       10.0.0.0/8        scram-sha-256
host    ainflue_production    ainflue_readonly  10.0.0.0/8        scram-sha-256
host    ainflue_analytics     ainflue_analytics 10.0.0.0/8        scram-sha-256
host    ainflue_content       ainflue_content   10.0.0.0/8        scram-sha-256

# Replication connections
host    replication     replicator      10.0.0.0/8              scram-sha-256
host    replication     replicator      172.16.0.0/12           scram-sha-256

# SSL connections (production)
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl replication     replicator      0.0.0.0/0               scram-sha-256

# Reject all other connections
host    all             all             0.0.0.0/0               reject

# =====================================================================================
# CREATOR ECONOMY SPECIFIC CONFIGURATION
# =====================================================================================

# Custom configuration for Ainflue Creator Economy Platform

# Extension configuration
shared_preload_libraries = 'pg_stat_statements,auto_explain,pg_prewarm,timescaledb'

# pg_stat_statements configuration
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

# auto_explain configuration
auto_explain.log_min_duration = '5s'
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_triggers = on
auto_explain.log_verbose = on
auto_explain.log_nested_statements = on

# TimescaleDB configuration (for creator analytics)
timescaledb.telemetry_level = off
max_background_workers = 16  # Increased for TimescaleDB

# Custom GUC parameters for Ainflue
ainflue.content_retention_days = 2555  # 7 years
ainflue.analytics_batch_size = 10000
ainflue.max_content_size_mb = 1024  # 1GB
ainflue.ai_processing_timeout = 3600  # 1 hour

# =====================================================================================
# PERFORMANCE TUNING FOR CREATOR WORKLOADS
# =====================================================================================

# Index configuration
maintenance_work_mem = 1GB  # For large index builds
max_parallel_maintenance_workers = 4
max_parallel_workers_per_gather = 8
max_parallel_workers = 16
parallel_leader_participation = on

# Vacuum configuration for high-churn creator content
vacuum_buffer_usage_limit = 256kB
vacuum_cost_delay = 0  # No delay for vacuum operations
vacuum_cost_limit = 10000
vacuum_cost_page_hit = 1
vacuum_cost_page_miss = 2
vacuum_cost_page_dirty = 20

# Background writer tuning
bgwriter_delay = 100ms
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 10.0
bgwriter_flush_after = 512kB

# Effective cache size (80% of system RAM)
effective_cache_size = 6GB
effective_io_concurrency = 200  # For SSD storage
maintenance_io_concurrency = 10
max_worker_processes = 16

# =====================================================================================
# MONITORING AND ALERTING CONFIGURATION
# =====================================================================================

# Logging for monitoring systems
log_statement_stats = off
log_parser_stats = off
log_planner_stats = off
log_executor_stats = off

# Custom log line format for structured logging
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h,txid=%x,qid=%Q '

# Additional logging for creator platform
log_autovacuum_min_duration = 10s  # Log slow autovacuum
log_recovery_conflict_waits = on
log_startup_progress_interval = 10s

# =====================================================================================
# SECURITY CONFIGURATION
# =====================================================================================

# SSL/TLS configuration
ssl_crl_file = '/etc/ssl/certs/crl.pem'
ssl_dh_params_file = '/etc/ssl/certs/dhparam.pem'
ssl_ecdh_curve = 'prime256v1'
ssl_passphrase_command = '/usr/local/bin/ssl_passphrase.sh %p'
ssl_passphrase_command_supports_reload = on

# Password configuration
password_encryption = scram-sha-256
scram_iterations = 4096

# Connection security
tcp_keepalives_idle = 600  # 10 minutes
tcp_keepalives_interval = 30
tcp_keepalives_count = 3
tcp_user_timeout = 30000  # 30 seconds

# Database security
row_security = on
default_transaction_read_only = off

# =====================================================================================
# BACKUP AND RECOVERY CONFIGURATION
# =====================================================================================

# Archive configuration for backup
archive_command = '/usr/local/bin/backup_wal.sh %p %f'
archive_timeout = 300s  # 5 minutes
restore_command = '/usr/local/bin/restore_wal.sh %f %p'
recovery_end_command = '/usr/local/bin/recovery_end.sh'

# Point-in-time recovery
recovery_target_timeline = 'latest'
recovery_target_action = 'promote'

