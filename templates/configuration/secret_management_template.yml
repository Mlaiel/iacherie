# SECRET MANAGEMENT CONFIGURATION TEMPLATE
# Enterprise-grade secret management system
# Vault + External Secrets + Sealed Secrets + Secret Store CSI
# ===================================================================

# 🔐 Global Secret Management Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: global-secret-management-config
  namespace: ainflue-system
  labels:
    app: secret-management
    component: global-config
data:
  secret-management.yaml: |
    # Global Secret Management Configuration
    secretManagement:
      # Providers Configuration
      providers:
        vault:
          enabled: true
          address: "https://vault.ainflue.internal:8200"
          namespace: "ainflue"
          authMethod: "kubernetes"
          role: "ainflue-secret-manager"
          mount: "secret"
          version: "v2"
          transitEngine: "transit"
          keyName: "ainflue-encryption-key"
        
        aws:
          enabled: true
          region: "us-west-2"
          role: "arn:aws:iam::123456789012:role/AinflueSecretsRole"
          
        azure:
          enabled: true
          vaultUrl: "https://ainflue-vault.vault.azure.net/"
          tenantId: "tenant-id-here"
          clientId: "client-id-here"
          
        gcp:
          enabled: true
          projectId: "ainflue-project"
          serviceAccountKey: "gcp-sa-key"
      
      # Encryption Configuration
      encryption:
        atRest:
          enabled: true
          algorithm: "AES-256-GCM"
          keyRotationInterval: "90d"
          provider: "vault"
        inTransit:
          enabled: true
          algorithm: "TLS-1.3"
          certificateProvider: "cert-manager"
        envelope:
          enabled: true
          dataKeyLength: 256
          masterKeyProvider: "vault"
      
      # Secret Lifecycle
      lifecycle:
        rotation:
          enabled: true
          defaultInterval: "30d"
          scheduleFormat: "cron"
          notifications: true
        expiration:
          enabled: true
          defaultTTL: "8760h"  # 1 year
          warningPeriod: "720h"  # 30 days
        versioning:
          enabled: true
          maxVersions: 10
          retentionPeriod: "2160h"  # 90 days
      
      # Access Control
      accessControl:
        rbac:
          enabled: true
          strictMode: true
        policies:
          - name: "application-secrets"
            path: "secret/data/application/*"
            capabilities: ["read"]
            bound_service_account_names: ["ainflue-api", "ainflue-frontend"]
            bound_service_account_namespaces: ["ainflue-production"]
          - name: "database-secrets"
            path: "secret/data/database/*"
            capabilities: ["read"]
            bound_service_account_names: ["ainflue-database"]
            bound_service_account_namespaces: ["ainflue-database"]
        mfa:
          enabled: true
          methods: ["totp", "duo"]
          gracePeriod: "300s"
      
      # Compliance & Auditing
      compliance:
        pci:
          enabled: true
          dataClassification: true
          accessLogging: true
        gdpr:
          enabled: true
          dataSubjectRights: true
          consentTracking: true
        soc2:
          enabled: true
          auditTrail: true
          accessReviews: true
      
      # Monitoring & Alerting
      monitoring:
        metrics:
          enabled: true
          provider: "prometheus"
        logging:
          enabled: true
          level: "info"
          auditLevel: "detailed"
        alerting:
          enabled: true
          channels: ["slack", "email", "pagerduty"]
          rules:
            - name: "secret-access-anomaly"
              condition: "unusual_access_pattern"
              severity: "warning"
            - name: "secret-expiration"
              condition: "expires_in < 7d"
              severity: "critical"
            - name: "unauthorized-access"
              condition: "access_denied"
              severity: "critical"
---
# 🏦 Vault Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    # Vault Configuration for Ainflue
    ui = true
    
    # Storage Backend
    storage "postgresql" {
      connection_url = "postgres://vault:${VAULT_DB_PASSWORD}@postgres.vault.svc.cluster.local:5432/vault?sslmode=require"
      table = "vault_kv_store"
      max_parallel = "128"
      max_idle_conns = "10"
      max_conn_lifetime = "0"
    }
    
    # High Availability
    ha_storage "consul" {
      address = "consul.consul.svc.cluster.local:8500"
      path = "vault/"
      scheme = "https"
      service = "vault"
      check_timeout = "5s"
      max_parallel = "128"
      
      # TLS Configuration
      tls_ca_file = "/vault/tls/ca.pem"
      tls_cert_file = "/vault/tls/consul.pem"
      tls_key_file = "/vault/tls/consul-key.pem"
      tls_skip_verify = false
    }
    
    # Listeners
    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_cert_file = "/vault/tls/vault.pem"
      tls_key_file = "/vault/tls/vault-key.pem"
      tls_client_ca_file = "/vault/tls/ca.pem"
      tls_min_version = "tls12"
      tls_cipher_suites = "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
    }
    
    # Telemetry
    telemetry {
      prometheus_retention_time = "30s"
      disable_hostname = true
      statsd_address = "datadog-agent.monitoring.svc.cluster.local:8125"
    }
    
    # Seal Configuration
    seal "awskms" {
      region = "us-west-2"
      kms_key_id = "arn:aws:kms:us-west-2:123456789012:key/12345678-1234-1234-1234-123456789012"
      endpoint = "https://kms.us-west-2.amazonaws.com"
    }
    
    # API Options
    api_addr = "https://vault.ainflue.internal:8200"
    cluster_addr = "https://vault.ainflue.internal:8201"
    
    # Logging
    log_level = "Info"
    log_format = "json"
    
    # Performance
    max_lease_ttl = "8760h"
    default_lease_ttl = "720h"
    
    # Plugin Directory
    plugin_directory = "/vault/plugins"
---
# 🔑 Vault Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
    component: server
spec:
  serviceName: vault
  replicas: 3
  selector:
    matchLabels:
      app: vault
      component: server
  template:
    metadata:
      labels:
        app: vault
        component: server
    spec:
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vault
        image: hashicorp/vault:1.15.0
        imagePullPolicy: IfNotPresent
        command:
        - "/bin/sh"
        - "-ec"
        args:
        - |
          exec vault server -config=/vault/config/vault.hcl
        env:
        - name: VAULT_ADDR
          value: "https://127.0.0.1:8200"
        - name: VAULT_API_ADDR
          value: "https://vault.ainflue.internal:8200"
        - name: VAULT_CLUSTER_ADDR
          value: "https://$(POD_NAME).vault.$(NAMESPACE).svc.cluster.local:8201"
        - name: VAULT_RAFT_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VAULT_DB_PASSWORD
          valueFrom:
            secretRef:
              name: vault-db-secret
              key: password
        ports:
        - containerPort: 8200
          name: vault-port
        - containerPort: 8201
          name: cluster-port
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: config
          mountPath: /vault/config
        - name: tls
          mountPath: /vault/tls
        - name: data
          mountPath: /vault/data
        - name: plugins
          mountPath: /vault/plugins
        livenessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: vault-config
      - name: tls
        secret:
          secretName: vault-tls
      - name: plugins
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
# 🌐 Vault Service
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
    component: server
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
  - name: vault-port
    port: 8200
    targetPort: 8200
  - name: cluster-port
    port: 8201
    targetPort: 8201
  selector:
    app: vault
    component: server
---
# 🔐 External Secrets Operator Configuration
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ainflue-vault-secret-store
  namespace: ainflue-production
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ainflue-secret-reader"
          serviceAccountRef:
            name: "external-secrets-sa"
          secretRef:
            name: "vault-token"
            key: "token"
      caBundle: |
        -----BEGIN CERTIFICATE-----
        MIIDCzCCAfOgAwIBAgIQJ... (Vault CA Certificate)
        -----END CERTIFICATE-----
---
# 🔑 External Secret for Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ainflue-database-secret
  namespace: ainflue-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ainflue-vault-secret-store
    kind: SecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        host: "{{ .host }}"
        port: "{{ .port }}"
        database: "{{ .database }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
        connection-string: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}?sslmode=require"
  data:
  - secretKey: host
    remoteRef:
      key: database/production
      property: host
  - secretKey: port
    remoteRef:
      key: database/production
      property: port
  - secretKey: database
    remoteRef:
      key: database/production
      property: database
  - secretKey: username
    remoteRef:
      key: database/production
      property: username
  - secretKey: password
    remoteRef:
      key: database/production
      property: password
---
# 🔐 External Secret for API Keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ainflue-api-keys-secret
  namespace: ainflue-production
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: ainflue-vault-secret-store
    kind: SecretStore
  target:
    name: api-keys
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        stripe-secret-key: "{{ .stripeSecretKey }}"
        stripe-webhook-secret: "{{ .stripeWebhookSecret }}"
        paypal-client-id: "{{ .paypalClientId }}"
        paypal-client-secret: "{{ .paypalClientSecret }}"
        jwt-secret: "{{ .jwtSecret }}"
        encryption-key: "{{ .encryptionKey }}"
  data:
  - secretKey: stripeSecretKey
    remoteRef:
      key: api-keys/payment
      property: stripe_secret_key
  - secretKey: stripeWebhookSecret
    remoteRef:
      key: api-keys/payment
      property: stripe_webhook_secret
  - secretKey: paypalClientId
    remoteRef:
      key: api-keys/payment
      property: paypal_client_id
  - secretKey: paypalClientSecret
    remoteRef:
      key: api-keys/payment
      property: paypal_client_secret
  - secretKey: jwtSecret
    remoteRef:
      key: api-keys/auth
      property: jwt_secret
  - secretKey: encryptionKey
    remoteRef:
      key: api-keys/encryption
      property: master_key
---
# 🔒 Sealed Secrets Configuration
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ainflue-ssl-certificates
  namespace: ainflue-production
spec:
  encryptedData:
    tls.crt: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
    tls.key: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
    ca.crt: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx...
  template:
    metadata:
      name: ssl-certificates
      namespace: ainflue-production
    type: kubernetes.io/tls
---
# 🗝️ Secret Store CSI Driver Configuration
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ainflue-vault-secrets
  namespace: ainflue-production
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc.cluster.local:8200"
    vaultSkipTLSVerify: "false"
    vaultCACertPath: "/etc/ssl/certs/vault-ca.pem"
    roleName: "ainflue-csi-role"
    objects: |
      - objectName: "database-password"
        secretPath: "secret/data/database/production"
        secretKey: "password"
      - objectName: "api-key"
        secretPath: "secret/data/api-keys/auth"
        secretKey: "jwt_secret"
      - objectName: "encryption-key"
        secretPath: "secret/data/api-keys/encryption"
        secretKey: "master_key"
  secretObjects:
  - secretName: vault-csi-secrets
    type: Opaque
    data:
    - objectName: "database-password"
      key: "db-password"
    - objectName: "api-key"
      key: "jwt-secret"
    - objectName: "encryption-key"
      key: "encryption-key"

# ===================================================================
# 🔐 VAULT POLICIES AND AUTHENTICATION
# ===================================================================

# 🎯 Vault Authentication Method
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-auth-config
  namespace: vault
data:
  kubernetes-auth.sh: |
    #!/bin/bash
    # Enable Kubernetes authentication
    vault auth enable -path=kubernetes kubernetes
    
    # Configure Kubernetes authentication
    vault write auth/kubernetes/config \
        token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
        kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443" \
        kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
        issuer="https://kubernetes.default.svc.cluster.local" \
        disable_iss_validation=true
    
    # Create role for Ainflue applications
    vault write auth/kubernetes/role/ainflue-secret-reader \
        bound_service_account_names=external-secrets-sa,ainflue-api,ainflue-frontend \
        bound_service_account_namespaces=ainflue-production,ainflue-staging \
        policies=ainflue-secret-reader \
        ttl=24h
    
    # Create role for CSI driver
    vault write auth/kubernetes/role/ainflue-csi-role \
        bound_service_account_names=secrets-store-csi-driver \
        bound_service_account_namespaces=ainflue-production \
        policies=ainflue-csi-policy \
        ttl=1h
---
# 🔐 Vault Policies
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-policies
  namespace: vault
data:
  ainflue-secret-reader.hcl: |
    # Policy for reading application secrets
    path "secret/data/application/*" {
      capabilities = ["read"]
    }
    
    path "secret/data/database/production" {
      capabilities = ["read"]
    }
    
    path "secret/data/api-keys/*" {
      capabilities = ["read"]
    }
    
    path "secret/metadata/application/*" {
      capabilities = ["list", "read"]
    }
    
    # Deny access to admin secrets
    path "secret/data/admin/*" {
      capabilities = ["deny"]
    }
  
  ainflue-csi-policy.hcl: |
    # Policy for CSI driver
    path "secret/data/database/production" {
      capabilities = ["read"]
    }
    
    path "secret/data/api-keys/auth" {
      capabilities = ["read"]
    }
    
    path "secret/data/api-keys/encryption" {
      capabilities = ["read"]
    }
  
  ainflue-admin-policy.hcl: |
    # Admin policy for secret management
    path "secret/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    
    path "auth/kubernetes/role/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    
    path "sys/policies/acl/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    
    path "sys/mounts/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
  
  ainflue-rotation-policy.hcl: |
    # Policy for secret rotation service
    path "secret/data/database/*" {
      capabilities = ["read", "update"]
    }
    
    path "secret/data/api-keys/*" {
      capabilities = ["read", "update"]
    }
    
    path "database/creds/ainflue-role" {
      capabilities = ["read"]
    }
    
    path "transit/encrypt/ainflue-key" {
      capabilities = ["update"]
    }
    
    path "transit/decrypt/ainflue-key" {
      capabilities = ["update"]
    }
---
# 🔄 Secret Rotation Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-rotation-config
  namespace: ainflue-system
data:
  rotation-schedule.yaml: |
    # Secret Rotation Configuration
    secretRotation:
      enabled: true
      schedule: "0 2 * * 0"  # Weekly at 2 AM on Sunday
      
      secrets:
        database:
          enabled: true
          interval: "30d"
          method: "dynamic"
          provider: "vault-database"
          rollback: true
          notifications: true
          
        apiKeys:
          enabled: true
          interval: "90d"
          method: "manual"
          approval: true
          notifications: true
          
        certificates:
          enabled: true
          interval: "60d"
          method: "automatic"
          provider: "cert-manager"
          renewBefore: "30d"
          
        encryptionKeys:
          enabled: true
          interval: "180d"
          method: "envelope"
          provider: "vault-transit"
          approval: true
      
      notifications:
        slack:
          enabled: true
          webhook: "https://hooks.slack.com/services/..."
          channel: "#security-alerts"
        email:
          enabled: true
          recipients: ["security@ainflue.com"]
        pagerduty:
          enabled: true
          serviceKey: "pagerduty-service-key"
---
# 🎯 Secret Rotation CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-rotation-job
  namespace: ainflue-system
spec:
  schedule: "0 2 * * 0"  # Weekly at 2 AM on Sunday
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: secret-rotation-sa
          containers:
          - name: secret-rotator
            image: ainflue/secret-rotator:v1.0.0
            imagePullPolicy: IfNotPresent
            env:
            - name: VAULT_ADDR
              value: "https://vault.vault.svc.cluster.local:8200"
            - name: VAULT_ROLE
              value: "ainflue-rotation-role"
            - name: ROTATION_CONFIG
              value: "/config/rotation-schedule.yaml"
            - name: DRY_RUN
              value: "false"
            volumeMounts:
            - name: config
              mountPath: /config
            - name: vault-token
              mountPath: /vault-token
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
          volumes:
          - name: config
            configMap:
              name: secret-rotation-config
          - name: vault-token
            secret:
              secretName: vault-rotation-token
          restartPolicy: OnFailure
          activeDeadlineSeconds: 3600

# ===================================================================
# 🔐 SECRET SCANNING AND COMPLIANCE
# ===================================================================

# 🔍 Secret Scanning Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-scanning-config
  namespace: ainflue-system
data:
  scanning-rules.yaml: |
    # Secret Scanning Rules
    secretScanning:
      enabled: true
      scope: ["code", "containers", "configurations"]
      
      patterns:
        # API Keys
        - name: "aws-access-key"
          pattern: "AKIA[0-9A-Z]{16}"
          severity: "high"
        - name: "gcp-service-account"
          pattern: "\"type\": \"service_account\""
          severity: "high"
        - name: "azure-connection-string"
          pattern: "DefaultEndpointsProtocol=https"
          severity: "high"
        - name: "stripe-key"
          pattern: "(sk|pk)_(test|live)_[0-9a-zA-Z]{24}"
          severity: "critical"
        - name: "jwt-secret"
          pattern: "jwt[_-]?secret"
          severity: "medium"
        
        # Database Credentials
        - name: "database-url"
          pattern: "(postgres|mysql|mongodb)://[^\\s]*:[^\\s]*@"
          severity: "critical"
        - name: "redis-url"
          pattern: "redis://[^\\s]*:[^\\s]*@"
          severity: "high"
        
        # Generic Secrets
        - name: "password"
          pattern: "password\\s*[=:]\\s*['\"][^'\"]{8,}['\"]"
          severity: "medium"
        - name: "api-key"
          pattern: "api[_-]?key\\s*[=:]\\s*['\"][^'\"]{16,}['\"]"
          severity: "high"
        - name: "private-key"
          pattern: "-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----"
          severity: "critical"
      
      exclusions:
        paths:
          - "test/"
          - "examples/"
          - "docs/"
        files:
          - "*.md"
          - "*.txt"
          - "*.example"
        patterns:
          - "fake"
          - "example"
          - "test"
          - "placeholder"
      
      notifications:
        enabled: true
        severity: "medium"
        channels: ["slack", "email"]
---
# 🚨 Secret Compliance Monitoring
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secret-compliance-alerts
  namespace: ainflue-system
spec:
  groups:
  - name: secret.compliance
    rules:
    - alert: SecretExpiringWithin7Days
      expr: |
        (vault_secret_lease_expiry_timestamp - time()) / 86400 < 7
      for: 0m
      labels:
        severity: warning
        category: secret-management
      annotations:
        summary: "Secret expiring within 7 days"
        description: "Secret {{ $labels.secret_path }} expires in {{ $value }} days"
    
    - alert: SecretExpiringWithin1Day
      expr: |
        (vault_secret_lease_expiry_timestamp - time()) / 86400 < 1
      for: 0m
      labels:
        severity: critical
        category: secret-management
      annotations:
        summary: "Secret expiring within 1 day"
        description: "Secret {{ $labels.secret_path }} expires in {{ $value }} days"
    
    - alert: UnauthorizedSecretAccess
      expr: |
        increase(vault_audit_log_request_failure_total[5m]) > 10
      for: 2m
      labels:
        severity: critical
        category: secret-security
      annotations:
        summary: "Unauthorized secret access attempts"
        description: "{{ $value }} unauthorized secret access attempts in the last 5 minutes"
    
    - alert: SecretRotationFailed
      expr: |
        increase(secret_rotation_failure_total[1h]) > 0
      for: 0m
      labels:
        severity: critical
        category: secret-management
      annotations:
        summary: "Secret rotation failed"
        description: "Secret rotation failed for {{ $labels.secret_name }}"
    
    - alert: ExcessiveSecretAccess
      expr: |
        rate(vault_audit_log_request_total[5m]) > 100
      for: 5m
      labels:
        severity: warning
        category: secret-security
      annotations:
        summary: "Excessive secret access rate"
        description: "Secret access rate is {{ $value }} requests/second"

