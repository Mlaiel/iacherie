# 🔐 SECRET BACKUP AND DISASTER RECOVERY
# ===================================================================

# 💾 Vault Backup Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-backup-config
  namespace: vault
data:
  backup-script.sh: |
    #!/bin/bash
    # Vault Backup Script
    
    set -euo pipefail
    
    BACKUP_DIR="/backup"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    BACKUP_FILE="${BACKUP_DIR}/vault_backup_${TIMESTAMP}.tar.gz"
    
    # Create backup directory
    mkdir -p "${BACKUP_DIR}"
    
    # Take Vault snapshot
    vault operator raft snapshot save "/tmp/vault_snapshot_${TIMESTAMP}"
    
    # Export Vault policies
    vault policy list | while read -r policy; do
        vault policy read "${policy}" > "/tmp/policy_${policy}.hcl"
    done
    
    # Export auth methods
    vault auth list -format=json > "/tmp/auth_methods.json"
    
    # Export secret engines
    vault secrets list -format=json > "/tmp/secret_engines.json"
    
    # Create compressed backup
    tar -czf "${BACKUP_FILE}" -C /tmp \
        "vault_snapshot_${TIMESTAMP}" \
        policy_*.hcl \
        auth_methods.json \
        secret_engines.json
    
    # Upload to S3
    aws s3 cp "${BACKUP_FILE}" "s3://ainflue-vault-backups/"
    
    # Clean up local files
    rm -f /tmp/vault_snapshot_* /tmp/policy_* /tmp/auth_methods.json /tmp/secret_engines.json
    
    # Retain only last 30 backups locally
    ls -t ${BACKUP_DIR}/vault_backup_*.tar.gz | tail -n +31 | xargs -r rm
    
    echo "Backup completed: ${BACKUP_FILE}"
---
# 🔄 Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup-job
  namespace: vault
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault-backup-sa
          containers:
          - name: vault-backup
            image: hashicorp/vault:1.15.0
            command: ["/bin/sh"]
            args: ["/scripts/backup-script.sh"]
            env:
            - name: VAULT_ADDR
              value: "https://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretRef:
                  name: vault-backup-token
                  key: token
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretRef:
                  name: vault-backup-aws-creds
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretRef:
                  name: vault-backup-aws-creds
                  key: secret-access-key
            volumeMounts:
            - name: backup-scripts
              mountPath: /scripts
            - name: backup-storage
              mountPath: /backup
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
          volumes:
          - name: backup-scripts
            configMap:
              name: vault-backup-config
              defaultMode: 0755
          - name: backup-storage
            persistentVolumeClaim:
              claimName: vault-backup-pvc
          restartPolicy: OnFailure

