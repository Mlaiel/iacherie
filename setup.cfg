[flake8]
max-line-length = 88
extend-ignore = 
    E203,  # whitespace before ':'
    W503,  # line break before binary operator
    E501,  # line too long (handled by black)
    W504,  # line break after binary operator
    E402,  # module level import not at top of file
    F401,  # imported but unused (handled by autoflake)
exclude = 
    .git,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    migrations,
    node_modules,
    .tox,
    htmlcov,
    coverage-reports,
    test-results,
    performance-reports

per-file-ignores =
    __init__.py:F401
    test_*.py:F401,F811
    conftest.py:F401,F811
    **/tests/*:F401,F811,S101
    docs/*:F401,E402

max-complexity = 12
inline-quotes = double
import-order-style = google
application-import-names = ainflue,api,core,ai_agents,business,config

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True
show_column_numbers = True
pretty = True

# Third-party libraries without type hints
ignore_missing_imports = True

# Specific module configurations
[mypy-tests.*]
disallow_untyped_defs = False

[mypy-conftest]
disallow_untyped_defs = False

[mypy-setup]
disallow_untyped_defs = False

[isort]
profile = black
multi_line_output = 3
line_length = 88
known_first_party = ainflue,api,core,ai_agents,business,config,monitoring,utils
known_third_party = fastapi,pydantic,sqlalchemy,redis,pytest,numpy,pandas
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
import_heading_future = Future imports
import_heading_stdlib = Standard library imports
import_heading_thirdparty = Third-party imports
import_heading_firstparty = First-party imports
import_heading_localfolder = Local imports
force_sort_within_sections = True
combine_as_imports = True
force_grid_wrap = 0
include_trailing_comma = True
use_parentheses = True

[coverage:run]
source = .
omit = 
    */tests/*
    */test_*
    setup.py
    conftest.py
    */migrations/*
    */venv/*
    */.venv/*
    */node_modules/*
    */htmlcov/*
    */coverage-reports/*
    */test-results/*
    */performance-reports/*
    */__pycache__/*
    */.*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
    # Type checking imports
    if TYPE_CHECKING:

show_missing = True
skip_covered = False
precision = 2

[coverage:html]
directory = coverage-reports
title = Ainflue Platform Coverage Report

[coverage:xml]
output = coverage-reports/coverage.xml