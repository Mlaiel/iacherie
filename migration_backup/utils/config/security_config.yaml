# Core Security Settings
security_level: "maximum"
quantum_resistant: true
zero_trust_architecture: true
defense_in_depth: true

# Encryption Configuration
encryption:
  # Symmetric encryption
  symmetric:
    algorithm: "AES-256-GCM"
    key_size: 256
    mode: "GCM"
    padding: "PKCS7"
    
    # Advanced encryption settings
    use_hardware_acceleration: true
    constant_time_operations: true
    secure_key_derivation: true
    
  # Asymmetric encryption  
  asymmetric:
    algorithm: "RSA-4096"
    key_size: 4096
    padding: "OAEP"
    hash_algorithm: "SHA-256"
    
    # Post-quantum cryptography preparation
    quantum_resistant_backup:
      algorithm: "CRYSTALS-Kyber"
      key_size: 768
      
  # Key management
  key_management:
    rotation_policy: "automatic"
    rotation_interval_days: 30
    key_escrow_enabled: true
    key_versioning: true
    secure_deletion: true
    
    # Hardware Security Module
    hsm:
      enabled: true
      provider: "AWS CloudHSM"
      cluster_id: "${HSM_CLUSTER_ID}"
      
  # Key derivation
  key_derivation:
    algorithm: "PBKDF2"
    iterations: 100000
    salt_length: 32
    hash_function: "SHA-256"
    
    # Advanced KDF options
    scrypt_options:
      n: 32768
      r: 8
      p: 1
      
    argon2_options:
      variant: "Argon2id"
      memory_cost: 65536
      time_cost: 3
      parallelism: 4

# Authentication Configuration
authentication:
  # Primary authentication
  primary:
    method: "multi_factor"
    password_policy:
      min_length: 12
      max_length: 128
      require_uppercase: true
      require_lowercase: true
      require_numbers: true
      require_symbols: true
      prevent_common_passwords: true
      password_history: 12
      max_age_days: 90
      
  # Multi-factor authentication
  mfa:
    required: true
    methods:
      - "totp"
      - "webauthn"
      - "sms"
      - "email"
      - "hardware_token"
    backup_codes: true
    recovery_options: true
    
    # TOTP settings
    totp:
      issuer: "IA Chéries"
      algorithm: "SHA-256"
      digits: 6
      period: 30
      window: 1
      
    # WebAuthn settings
    webauthn:
      rp_name: "IA Chéries"
      rp_id: "ainflue.com"
      origin: "https://ainflue.com"
      timeout: 60000
      
  # Single Sign-On
  sso:
    enabled: true
    providers:
      - name: "google"
        client_id: "${GOOGLE_SSO_CLIENT_ID}"
        enabled: true
        
      - name: "microsoft"
        client_id: "${MICROSOFT_SSO_CLIENT_ID}"
        enabled: true
        
      - name: "okta"
        domain: "${OKTA_DOMAIN}"
        enabled: true
        
  # Session management
  session:
    timeout_minutes: 30
    absolute_timeout_hours: 8
    concurrent_sessions_limit: 3
    secure_cookies: true
    httponly_cookies: true
    samesite_policy: "Strict"
    
  # Account security
  account_security:
    max_login_attempts: 3
    lockout_duration_minutes: 15
    progressive_lockout: true
    breach_detection: true
    suspicious_activity_monitoring: true

# Authorization Configuration
authorization:
  # Access control model
  model: "rbac_with_abac"    # Role-Based + Attribute-Based
  
  # Role-based access control
  rbac:
    strict_hierarchies: true
    role_inheritance: true
    principle_of_least_privilege: true
    
    # Default roles
    default_roles:
      - name: "user"
        permissions: ["read_own_content", "create_content"]
        
      - name: "creator"
        permissions: ["read_own_content", "create_content", "publish_content", "collaborate"]
        
      - name: "admin"
        permissions: ["all"]
        
  # Attribute-based access control
  abac:
    enabled: true
    policy_language: "XACML"
    dynamic_policies: true
    context_aware: true
    
  # Permission management
  permissions:
    granular_permissions: true
    resource_based_permissions: true
    time_based_permissions: true
    location_based_permissions: true
    
  # API authorization
  api_authorization:
    oauth2_enabled: true
    jwt_validation: true
    scope_based_access: true
    rate_limiting_per_user: true

# Data Protection Configuration
data_protection:
  # Data classification
  classification:
    levels:
      - "public"
      - "internal"
      - "confidential"
      - "restricted"
    auto_classification: true
    
  # Data Loss Prevention
  dlp:
    enabled: true
    scan_uploads: true
    scan_communications: true
    block_sensitive_data: true
    
    # Patterns to detect
    patterns:
      - "credit_card_numbers"
      - "social_security_numbers"
      - "email_addresses"
      - "api_keys"
      - "passwords"
      
  # Data encryption at rest
  encryption_at_rest:
    enabled: true
    algorithm: "AES-256-GCM"
    key_management: "customer_managed"
    transparent_encryption: true
    
  # Data encryption in transit
  encryption_in_transit:
    enabled: true
    tls_version: "1.3"
    cipher_suites:
      - "TLS_AES_256_GCM_SHA384"
      - "TLS_CHACHA20_POLY1305_SHA256"
      - "TLS_AES_128_GCM_SHA256"
    perfect_forward_secrecy: true
    
  # Data anonymization
  anonymization:
    enabled: true
    techniques:
      - "k_anonymity"
      - "l_diversity"
      - "t_closeness"
      - "differential_privacy"
    retention_policies: true

# Network Security Configuration
network_security:
  # Firewall configuration
  firewall:
    enabled: true
    default_policy: "deny"
    stateful_inspection: true
    deep_packet_inspection: true
    
    # Firewall rules
    rules:
      - name: "allow_https"
        action: "allow"
        protocol: "tcp"
        port: 443
        source: "any"
        
      - name: "allow_http_redirect"
        action: "allow"
        protocol: "tcp"
        port: 80
        source: "any"
        
  # Intrusion Detection System
  ids:
    enabled: true
    mode: "active"
    signature_based: true
    anomaly_based: true
    machine_learning_enhanced: true
    
  # Intrusion Prevention System
  ips:
    enabled: true
    auto_blocking: true
    threat_intelligence_integration: true
    
  # Web Application Firewall
  waf:
    enabled: true
    mode: "blocking"
    owasp_top_10_protection: true
    custom_rules: true
    rate_limiting: true
    geo_blocking: true
    
    # OWASP protection
    owasp_protection:
      injection: true
      broken_authentication: true
      sensitive_data_exposure: true
      xxe: true
      broken_access_control: true
      security_misconfiguration: true
      xss: true
      insecure_deserialization: true
      known_vulnerabilities: true
      insufficient_logging: true
      
  # DDoS Protection
  ddos_protection:
    enabled: true
    mitigation_automatic: true
    rate_limiting: true
    geo_filtering: true
    
# Vulnerability Management
vulnerability_management:
  # Vulnerability scanning
  scanning:
    enabled: true
    frequency: "daily"
    scope: "comprehensive"
    
    # Scan types
    scan_types:
      - "network_scan"
      - "web_application_scan"
      - "database_scan"
      - "container_scan"
      - "dependency_scan"
      
  # Vulnerability assessment
  assessment:
    risk_scoring: "cvss_v3"
    prioritization: "business_impact"
    sla_compliance: true
    
  # Patch management
  patch_management:
    automated_patching: true
    patch_window: "sunday_2am_utc"
    rollback_capability: true
    testing_required: true

# Security Monitoring Configuration
monitoring:
  # Security Information and Event Management
  siem:
    enabled: true
    real_time_analysis: true
    correlation_rules: true
    threat_intelligence_feeds: true
    
  # User and Entity Behavior Analytics
  ueba:
    enabled: true
    machine_learning: true
    baseline_establishment: 30  # days
    anomaly_detection: true
    
  # Security metrics
  metrics:
    failed_logins: true
    privilege_escalations: true
    data_access_patterns: true
    network_anomalies: true
    
  # Alerting
  alerting:
    real_time_alerts: true
    escalation_procedures: true
    integration_with_soc: true
    
    # Alert channels
    channels:
      - "email"
      - "sms"
      - "slack"
      - "pagerduty"

# Compliance Configuration
compliance:
  # Regulatory frameworks
  frameworks:
    gdpr:
      enabled: true
      data_protection_officer: true
      privacy_by_design: true
      consent_management: true
      right_to_erasure: true
      
    hipaa:
      enabled: true
      business_associate_agreements: true
      access_controls: true
      audit_logs: true
      
    sox:
      enabled: true
      financial_controls: true
      change_management: true
      audit_trails: true
      
    iso27001:
      enabled: true
      information_security_management: true
      risk_management: true
      continuous_improvement: true
      
    pci_dss:
      enabled: true
      cardholder_data_protection: true
      secure_network: true
      vulnerability_management: true
      
  # Audit and logging
  audit:
    comprehensive_logging: true
    log_integrity: true
    log_retention_years: 7
    real_time_monitoring: true
    
# Incident Response Configuration
incident_response:
  # Response procedures
  procedures:
    automated_response: true
    escalation_matrix: true
    communication_plan: true
    
  # Response team
  team:
    security_operations_center: true
    incident_commander: true
    technical_specialists: true
    legal_counsel: true
    
  # Recovery procedures
  recovery:
    backup_restoration: true
    system_hardening: true
    lessons_learned: true

# Security Training Configuration
security_training:
  # Employee training
  mandatory_training: true
  frequency: "quarterly"
  role_specific_training: true
  
  # Training topics
  topics:
    - "phishing_awareness"
    - "password_security"
    - "social_engineering"
    - "data_handling"
    - "incident_reporting"
    
  # Phishing simulation
  phishing_simulation:
    enabled: true
    frequency: "monthly"
    targeted_campaigns: true