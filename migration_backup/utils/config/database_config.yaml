# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.
# Module: Enterprise Database Configuration
# Purpose: Comprehensive database management for creator economy platform

database:
  # =======================
  # GLOBAL DATABASE SETTINGS
  # =======================
  global:
    environment: "production"
    timezone: "UTC"
    character_set: "utf8mb4"
    collation: "utf8mb4_unicode_ci"
    
    # Connection Management
    connection_management:
      max_connections: 1000
      connection_timeout: 30
      idle_timeout: 300
      query_timeout: 60
      transaction_timeout: 120
      
    # Performance Settings
    performance:
      query_cache_enabled: true
      query_cache_size: "256MB"
      buffer_pool_size: "2GB"
      log_buffer_size: "64MB"
      sort_buffer_size: "2MB"

  # =======================
  # PRIMARY DATABASE (PostgreSQL)
  # =======================
  postgresql:
    # Connection Details
    connection:
      host: "postgres-primary.ainflue.com"
      port: 5432
      database: "ainflue_production"
      username: "ainflue_app"
      password: "${POSTGRES_PASSWORD}"
      ssl_mode: "require"
      ssl_cert: "/etc/ssl/certs/postgres-client.crt"
      ssl_key: "/etc/ssl/private/postgres-client.key"
      ssl_ca: "/etc/ssl/certs/postgres-ca.crt"
      
    # Connection Pool Settings
    connection_pool:
      min_connections: 10
      max_connections: 100
      connection_timeout: 30
      idle_timeout: 300
      max_lifetime: 3600
      health_check_period: 30
      
    # Performance Configuration
    performance:
      shared_buffers: "2GB"
      effective_cache_size: "6GB"
      work_mem: "64MB"
      maintenance_work_mem: "512MB"
      wal_buffers: "16MB"
      checkpoint_completion_target: 0.9
      random_page_cost: 1.1
      effective_io_concurrency: 200
      
    # Replication Setup
    replication:
      enabled: true
      synchronous_standby_names: "standby1,standby2"
      wal_level: "replica"
      max_wal_senders: 10
      wal_keep_segments: 256
      hot_standby: true
      
    # Read Replicas
    read_replicas:
      - host: "postgres-replica-1.ainflue.com"
        port: 5432
        weight: 50
        lag_threshold: "5s"
        
      - host: "postgres-replica-2.ainflue.com"
        port: 5432
        weight: 50
        lag_threshold: "5s"
        
    # Backup Configuration
    backup:
      enabled: true
      method: "continuous_archiving"
      wal_archive_command: "cp %p /backup/wal/%f"
      base_backup_schedule: "daily"
      retention_period: "30_days"
      compression: true
      encryption: true

  # =======================
  # CACHE DATABASE (Redis)
  # =======================
  redis:
    # Primary Redis Instance
    primary:
      host: "redis-primary.ainflue.com"
      port: 6379
      password: "${REDIS_PASSWORD}"
      database: 0
      ssl_enabled: true
      ssl_cert_file: "/etc/ssl/certs/redis-client.crt"
      ssl_key_file: "/etc/ssl/private/redis-client.key"
      ssl_ca_file: "/etc/ssl/certs/redis-ca.crt"
      
    # Redis Cluster Configuration
    cluster:
      enabled: true
      nodes:
        - "redis-cluster-1.ainflue.com:6379"
        - "redis-cluster-2.ainflue.com:6379"
        - "redis-cluster-3.ainflue.com:6379"
        - "redis-cluster-4.ainflue.com:6379"
        - "redis-cluster-5.ainflue.com:6379"
        - "redis-cluster-6.ainflue.com:6379"
      
    # Memory Management
    memory:
      maxmemory: "4GB"
      maxmemory_policy: "allkeys-lru"
      save_schedule: "900 1 300 10 60 10000"
      
    # Performance Settings
    performance:
      tcp_keepalive: 300
      timeout: 0
      tcp_backlog: 511
      databases: 16
      
    # Persistence Configuration
    persistence:
      rdb_enabled: true
      aof_enabled: true
      aof_rewrite_percentage: 100
      aof_rewrite_min_size: "64MB"

  # =======================
  # DOCUMENT DATABASE (MongoDB)
  # =======================
  mongodb:
    # Connection String
    connection:
      uri: "mongodb://ainflue_mongo:${MONGO_PASSWORD}@mongo-cluster.ainflue.com:27017,mongo-cluster-2.ainflue.com:27017,mongo-cluster-3.ainflue.com:27017/ainflue_production?replicaSet=ainflue-rs&ssl=true"
      options:
        retryWrites: true
        w: "majority"
        readPreference: "primary"
        maxPoolSize: 100
        minPoolSize: 10
        maxIdleTimeMS: 300000
        
    # Replica Set Configuration
    replica_set:
      name: "ainflue-rs"
      members:
        - host: "mongo-primary.ainflue.com:27017"
          priority: 2
          votes: 1
          
        - host: "mongo-secondary-1.ainflue.com:27017"
          priority: 1
          votes: 1
          
        - host: "mongo-secondary-2.ainflue.com:27017"
          priority: 1
          votes: 1
          
        - host: "mongo-arbiter.ainflue.com:27017"
          arbiterOnly: true
          votes: 1
          
    # Sharding Configuration
    sharding:
      enabled: true
      config_servers:
        - "config-1.ainflue.com:27019"
        - "config-2.ainflue.com:27019"
        - "config-3.ainflue.com:27019"
      mongos_routers:
        - "mongos-1.ainflue.com:27017"
        - "mongos-2.ainflue.com:27017"
        
    # Performance Settings
    performance:
      cache_size_gb: 2
      journal_commit_interval: 100
      operation_profiling_slow_ms: 100
      index_build_retry: true

  # =======================
  # SEARCH DATABASE (Elasticsearch)
  # =======================
  elasticsearch:
    # Cluster Configuration
    cluster:
      name: "ainflue-search-cluster"
      nodes:
        - host: "es-master-1.ainflue.com"
          port: 9200
          roles: ["master", "data", "ingest"]
          
        - host: "es-master-2.ainflue.com"
          port: 9200
          roles: ["master", "data", "ingest"]
          
        - host: "es-master-3.ainflue.com"
          port: 9200
          roles: ["master", "data", "ingest"]
          
        - host: "es-data-1.ainflue.com"
          port: 9200
          roles: ["data", "ingest"]
          
        - host: "es-data-2.ainflue.com"
          port: 9200
          roles: ["data", "ingest"]
          
    # Security Configuration
    security:
      enabled: true
      ssl_enabled: true
      authentication: "native"
      authorization_realms: ["native"]
      
    # Index Management
    index_management:
      number_of_shards: 3
      number_of_replicas: 2
      refresh_interval: "30s"
      max_result_window: 10000
      
    # Performance Settings
    performance:
      heap_size: "4g"
      thread_pool_search_size: 50
      thread_pool_write_size: 30
      circuit_breaker_request_size: "40%"

  # =======================
  # TIME-SERIES DATABASE (InfluxDB)
  # =======================
  influxdb:
    # Connection Configuration
    connection:
      host: "influxdb.ainflue.com"
      port: 8086
      database: "ainflue_metrics"
      username: "ainflue_metrics"
      password: "${INFLUXDB_PASSWORD}"
      ssl_enabled: true
      
    # Retention Policies
    retention_policies:
      - name: "real_time"
        duration: "24h"
        replication: 1
        default: true
        
      - name: "daily_aggregates"
        duration: "30d"
        replication: 1
        
      - name: "monthly_aggregates"
        duration: "365d"
        replication: 2
        
    # Performance Configuration
    performance:
      max_series_per_database: 1000000
      max_values_per_tag: 100000
      cache_max_memory_size: "1g"
      cache_snapshot_memory_size: "25m"

  # =======================
  # DATA WAREHOUSING (ClickHouse)
  # =======================
  clickhouse:
    # Cluster Configuration
    cluster:
      name: "ainflue_analytics"
      nodes:
        - host: "clickhouse-1.ainflue.com"
          port: 9000
          shard: 1
          replica: 1
          
        - host: "clickhouse-2.ainflue.com"
          port: 9000
          shard: 1
          replica: 2
          
        - host: "clickhouse-3.ainflue.com"
          port: 9000
          shard: 2
          replica: 1
          
        - host: "clickhouse-4.ainflue.com"
          port: 9000
          shard: 2
          replica: 2
          
    # Performance Settings
    performance:
      max_memory_usage: "10000000000"
      max_execution_time: 300
      max_query_size: "10000000"
      max_insert_block_size: "1048576"

# =======================
# DATABASE SCHEMAS
# =======================
schemas:
  # Core Business Schema
  core_business:
    tables:
      - users
      - creators
      - content
      - collaborations
      - monetization
      - payments
      - analytics
      
  # AI Processing Schema
  ai_processing:
    tables:
      - ai_models
      - processing_jobs
      - model_versions
      - training_data
      - inference_results
      
  # Security Schema
  security:
    tables:
      - audit_logs
      - access_tokens
      - permissions
      - security_events
      - threat_intelligence
      
  # Analytics Schema
  analytics:
    tables:
      - user_events
      - content_metrics
      - financial_metrics
      - performance_metrics
      - business_intelligence

# =======================
# DATA MIGRATION
# =======================
migration:
  # Migration Strategy
  strategy:
    blue_green_deployment: true
    zero_downtime_migration: true
    rollback_capability: true
    data_validation: true
    
  # Migration Tools
  tools:
    flyway_enabled: true
    alembic_enabled: true
    custom_scripts: true
    
  # Validation
  validation:
    schema_validation: true
    data_integrity_checks: true
    performance_testing: true
    rollback_testing: true

# =======================
# MONITORING AND HEALTH
# =======================
monitoring:
  # Health Checks
  health_checks:
    enabled: true
    interval: 30
    timeout: 10
    endpoints:
      - "/health"
      - "/ready"
      - "/metrics"
      
  # Performance Metrics
  metrics:
    connection_pool_usage: true
    query_performance: true
    replication_lag: true
    cache_hit_ratio: true
    storage_usage: true
    
  # Alerting
  alerting:
    slow_queries: true
    high_memory_usage: true
    replication_lag: true
    connection_pool_exhaustion: true
    disk_space_low: true

# =======================
# SECURITY AND COMPLIANCE
# =======================
security:
  # Data Encryption
  encryption:
    at_rest: true
    in_transit: true
    key_management: "vault"
    encryption_algorithm: "AES-256"
    
  # Access Control
  access_control:
    role_based_access: true
    least_privilege: true
    regular_access_review: true
    
  # Audit and Compliance
  audit:
    all_queries: false
    sensitive_operations: true
    schema_changes: true
    access_patterns: true

