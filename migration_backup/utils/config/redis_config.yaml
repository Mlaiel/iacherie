"""
Redis Configuration - Enterprise Caching & Session Management
============================================================

Ultra-optimized Redis configuration for enterprise-grade caching, session
management, and real-time data operations in the Ainflue creator economy platform.

Author: Fahed Mlaiel <mlaiel@live.de>
Copyright (c) 2025 Fahed Mlaiel. All rights reserved.
"""

# Redis Connection Configuration
connection:
  host: "${REDIS_HOST:localhost}"
  port: ${REDIS_PORT:6379}
  username: "${REDIS_USERNAME:}"
  password: "${REDIS_PASSWORD:}"
  database: ${REDIS_DB:0}
  ssl: ${REDIS_SSL:false}
  
  # Connection Pool Settings
  pool_size: ${REDIS_POOL_SIZE:20}
  max_connections: ${REDIS_MAX_CONNECTIONS:100}
  retry_on_timeout: true
  health_check_interval: 30
  socket_timeout: 5
  socket_connect_timeout: 10

# Performance Optimization
performance:
  # Memory Management
  memory:
    maxmemory_policy: "allkeys-lru"
    maxmemory_samples: 5
    memory_usage_threshold: 0.8
    eviction_strategy: "volatile-lru"
  
  # Persistence Settings
  persistence:
    save_enabled: true
    save_seconds: [900, 300, 60]
    save_changes: [1, 10, 10000]
    rdb_compression: true
    rdb_checksum: true
    appendonly: true
    appendfsync: "everysec"
    auto_aof_rewrite_percentage: 100
    auto_aof_rewrite_min_size: "64mb"

# Caching Configuration
caching:
  # Content Cache (Creator Media)
  content_cache:
    ttl: 3600  # 1 hour
    max_size: "1gb"
    compression: true
    serialization: "json"
    key_prefix: "ainflue:content:"
  
  # Session Cache
  session_cache:
    ttl: 1800  # 30 minutes
    sliding_expiration: true
    key_prefix: "ainflue:session:"
    secure_keys: true
  
  # API Response Cache
  api_cache:
    ttl: 300  # 5 minutes
    vary_by_user: true
    key_prefix: "ainflue:api:"
    cache_control: "private, max-age=300"
  
  # Creator Profile Cache
  creator_cache:
    ttl: 7200  # 2 hours
    key_prefix: "ainflue:creator:"
    cache_tags: ["profile", "stats", "content"]

# Real-time Features
realtime:
  # Pub/Sub Configuration
  pubsub:
    channels:
      - "creator_updates"
      - "collaboration_events"
      - "content_notifications"
      - "payment_alerts"
    pattern_channels:
      - "creator:*:notifications"
      - "collab:*:updates"
    max_subscribers: 10000
    message_ttl: 3600
  
  # Streams Configuration
  streams:
    creator_activity:
      max_length: 10000
      trim_strategy: "maxlen"
      consumer_groups: ["analytics", "notifications"]
    collaboration_events:
      max_length: 5000
      trim_strategy: "maxlen"
      consumer_groups: ["realtime", "audit"]

# Security Configuration
security:
  # Authentication
  auth:
    require_auth: ${REDIS_AUTH_REQUIRED:true}
    auth_timeout: 60
    protected_mode: true
    
  # ACL Configuration
  acl:
    enabled: true
    default_user_permissions: "off"
    user_categories:
      - name: "creators"
        permissions: ["+@read", "+@write", "-@dangerous"]
      - name: "admin"
        permissions: ["+@all"]
      - name: "api"
        permissions: ["+@read", "+@write", "+@pubsub", "-@admin"]
  
  # Encryption
  encryption:
    in_transit: true
    cert_file: "${REDIS_CERT_FILE:}"
    key_file: "${REDIS_KEY_FILE:}"
    ca_file: "${REDIS_CA_FILE:}"
    verify_peer: true

# Monitoring & Metrics
monitoring:
  # Health Checks
  health:
    enabled: true
    check_interval: 30
    timeout: 5
    failure_threshold: 3
    recovery_threshold: 2
  
  # Metrics Collection
  metrics:
    enabled: true
    collection_interval: 60
    retention_days: 7
    export_format: "prometheus"
    
    # Key Metrics
    tracked_metrics:
      - "memory_usage"
      - "cpu_usage"
      - "connection_count"
      - "commands_per_second"
      - "hit_rate"
      - "evicted_keys"
      - "expired_keys"
      - "keyspace_hits"
      - "keyspace_misses"
  
  # Alerting
  alerts:
    memory_usage_threshold: 85
    connection_threshold: 90
    hit_rate_threshold: 0.8
    response_time_threshold: 100

# Backup & Recovery
backup:
  # Automated Backups
  schedule:
    enabled: true
    frequency: "daily"
    time: "02:00"
    retention_days: 30
    compression: true
  
  # Backup Storage
  storage:
    provider: "aws_s3"
    bucket: "${REDIS_BACKUP_BUCKET:ainflue-redis-backups}"
    encryption: true
    versioning: true
  
  # Recovery Configuration
  recovery:
    point_in_time: true
    max_recovery_time: 15  # minutes
    verification_enabled: true

# High Availability
high_availability:
  # Replication
  replication:
    enabled: ${REDIS_REPLICATION_ENABLED:false}
    replicas: 2
    sync_mode: "async"
    replica_read_only: true
    replica_serve_stale_data: true
  
  # Sentinel Configuration
  sentinel:
    enabled: ${REDIS_SENTINEL_ENABLED:false}
    master_name: "ainflue-master"
    quorum: 2
    down_after_milliseconds: 5000
    parallel_syncs: 1
    failover_timeout: 10000
  
  # Cluster Configuration
  cluster:
    enabled: ${REDIS_CLUSTER_ENABLED:false}
    nodes: []
    replica_count: 1
    require_full_coverage: true

# Creator Economy Specific
creator_economy:
  # Content Metadata Cache
  content_metadata:
    ttl: 86400  # 24 hours
    tags: ["video", "audio", "image", "text"]
    versioning: true
  
  # Revenue Tracking Cache
  revenue_cache:
    ttl: 3600  # 1 hour
    precision: 2  # decimal places
    currency_cache: 1800  # 30 minutes
  
  # Collaboration Cache
  collaboration:
    active_sessions_ttl: 7200  # 2 hours
    invitation_ttl: 604800  # 7 days
    project_cache_ttl: 3600  # 1 hour
  
  # Analytics Cache
  analytics:
    realtime_ttl: 300  # 5 minutes
    hourly_ttl: 3600  # 1 hour
    daily_ttl: 86400  # 24 hours
    aggregation_cache: 1800  # 30 minutes

# Development Configuration
development:
  debug: ${REDIS_DEBUG:false}
  log_level: "info"
  slow_log:
    enabled: true
    slower_than: 10000  # microseconds
    max_length: 1000
  
  # Testing Configuration
  testing:
    flush_on_start: false
    test_database: 15
    mock_latency: 0

# Environment Overrides
environments:
  production:
    connection:
      pool_size: 50
      max_connections: 500
    performance:
      memory:
        maxmemory_policy: "allkeys-lru"
    security:
      auth:
        require_auth: true
      encryption:
        in_transit: true
    backup:
      schedule:
        frequency: "hourly"
        retention_days: 90
  
  staging:
    connection:
      pool_size: 20
      max_connections: 100
    performance:
      persistence:
        appendonly: false
    backup:
      schedule:
        frequency: "daily"
        retention_days: 7
  
  development:
    connection:
      pool_size: 5
      max_connections: 20
    security:
      auth:
        require_auth: false
    backup:
      schedule:
        enabled: false