# Docker Compose for Protection Services
# Copyright protection, watermarking, and content security
# Author: Fahed Mlaiel (mlaiel@live.de)

version: '3.8'

services:
  # Fingerprinting engine
  fingerprinting-engine:
    build:
      context: ../..
      dockerfile: docker/protection/fingerprinting_engine.dockerfile
      target: production
    container_name: ainflue-fingerprinting-engine
    ports:
      - "8021:8021"
    environment:
      - SERVICE_NAME=fingerprinting_engine
      - ALGORITHM_TYPE=perceptual
      - BATCH_SIZE=100
    volumes:
      - fingerprint_storage:/app/storage
      - fingerprint_models:/app/models
      - fingerprint_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8021/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - protection-network

  # Watermarking service
  watermarking-service:
    build:
      context: ../..
      dockerfile: docker/protection/watermarking_service.dockerfile
      target: production
    container_name: ainflue-watermarking-service
    ports:
      - "8022:8022"
    environment:
      - SERVICE_NAME=watermarking_service
      - WATERMARK_STRENGTH=medium
      - INVISIBLE_ENABLED=true
    volumes:
      - watermark_storage:/app/storage
      - watermark_templates:/app/templates
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8022/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - protection-network

networks:
  protection-network:
    driver: bridge

volumes:
  fingerprint_storage:
    driver: local
  fingerprint_models:
    driver: local
  fingerprint_logs:
    driver: local
  watermark_storage:
    driver: local
  watermark_templates:
    driver: local
