# Security Configuration
version: '3.8'

security_defaults:
  user_namespace: enabled
  apparmor: docker-default
  seccomp: default
  no_new_privileges: true
  read_only_rootfs: true
  
container_security:
  drop_capabilities:
    - ALL
  add_capabilities:
    - NET_BIND_SERVICE
    - CHOWN
    - SETUID
    - SETGID
  
network_security:
  encryption: true
  ingress_filtering: enabled
  egress_filtering: enabled
  
secrets_management:
  backend: vault
  rotation: enabled
  encryption_at_rest: true
  
image_security:
  scanning: enabled
  vulnerability_threshold: HIGH
  signed_images_only: true
  
runtime_security:
  process_monitoring: enabled
  file_integrity: enabled
  network_monitoring: enabled
  
compliance:
  cis_benchmark: enabled
  nist_framework: enabled
  gdpr_compliance: enabled