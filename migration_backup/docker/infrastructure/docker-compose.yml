# Docker Compose for Ainflue Platform
# Production-ready multi-service deployment

services:
  # Main Application
  ainflue-app:
    build: .
    container_name: ainflue-platform
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - MONGODB_HOST=mongodb
    depends_on:
      - postgres
      - redis
      - mongodb
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - ainflue-network

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: ainflue-postgres
    environment:
      POSTGRES_DB: ainflue_platform
      POSTGRES_USER: ainflue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ainflue123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - ainflue-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ainflue-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - ainflue-network

  # MongoDB Document Store
  mongodb:
    image: mongo:7
    container_name: ainflue-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ainflue
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-ainflue123}
      MONGO_INITDB_DATABASE: ainflue_documents
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped
    networks:
      - ainflue-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ainflue-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - ainflue-app
    restart: unless-stopped
    networks:
      - ainflue-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus
    container_name: ainflue-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    networks:
      - ainflue-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana
    container_name: ainflue-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - ainflue-network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  prometheus_data:
  grafana_data:

networks:
  ainflue-network:
    driver: bridge