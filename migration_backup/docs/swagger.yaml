components:
  examples: {}
  parameters: {}
  responses: {}
  schemas:
    AnalyticsData:
      properties:
        active_workflows:
          description: Number of active workflows
          type: integer
        last_updated:
          description: Last update timestamp
          format: date-time
          type: string
        protected_content:
          description: Number of protected content items
          type: integer
        revenue_this_month:
          description: This month's revenue
          type: number
        revenue_today:
          description: Today's revenue
          type: number
        total_content:
          description: Total content items
          type: integer
        total_creators:
          description: Total number of creators
          type: integer
      required:
      - total_creators
      - total_content
      - last_updated
      type: object
    Content:
      properties:
        content_type:
          description: Type of content
          enum:
          - audio
          - video
          - image
          - text
          - mixed
          type: string
        created_at:
          description: Upload timestamp
          format: date-time
          type: string
        creator_id:
          description: ID of the content creator
          type: string
        description:
          description: Content description
          type: string
        duration:
          description: Content duration in seconds (for audio/video)
          type: number
        file_size:
          description: File size in bytes
          type: integer
        id:
          description: Unique content identifier
          type: string
        metadata:
          description: Additional content metadata
          type: object
        protection_level:
          description: Content protection level
          enum:
          - low
          - medium
          - high
          type: string
        status:
          description: Content processing status
          enum:
          - uploaded
          - processing
          - processed
          - failed
          - deleted
          type: string
        title:
          description: Content title
          type: string
      required:
      - id
      - creator_id
      - content_type
      - status
      type: object
    Creator:
      properties:
        country:
          description: Creator's country code
          type: string
        created_at:
          description: Account creation timestamp
          format: date-time
          type: string
        email:
          description: Creator's email address
          format: email
          type: string
        id:
          description: Unique creator identifier
          type: string
        language:
          description: Creator's primary language
          type: string
        name:
          description: Creator's full name
          type: string
        type:
          description: Type of creator
          enum:
          - musician
          - blogger
          - photographer
          - influencer
          - comedian
          - podcaster
          - writer
          - artist
          - videographer
          type: string
        updated_at:
          description: Last update timestamp
          format: date-time
          type: string
        verification_status:
          description: Creator verification status
          enum:
          - pending
          - verified
          - rejected
          type: string
      required:
      - id
      - name
      - email
      - type
      type: object
    ErrorResponse:
      properties:
        error:
          description: Error message
          type: string
        error_code:
          description: Machine-readable error code
          type: string
        request_id:
          description: Request ID for tracking
          type: string
        timestamp:
          description: Error timestamp
          format: date-time
          type: string
      required:
      - error
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: API key for authentication
      in: header
      name: X-API-Key
      type: apiKey
    BearerAuth:
      bearerFormat: JWT
      description: JWT token for authentication
      scheme: bearer
      type: http
info:
  contact:
    email: mlaiel@live.de
    name: Ainflue API Support
    url: https://ainflue.com/support
  description: "\n# Ainflue AI Platform API\n\nComplete API documentation for the\
    \ Ainflue AI-powered content protection and monetization platform.\n\n## Features\n\
    \n- **Content Protection**: Advanced AI-powered fingerprinting and rights management\n\
    - **Creator Management**: Comprehensive creator profiles and content management\n\
    - **Monetization**: Revenue tracking, licensing, and payment processing\n- **Analytics**:\
    \ Real-time analytics and performance metrics\n- **Multi-platform Support**: Integration\
    \ with major content platforms\n- **Security**: Enterprise-grade security and\
    \ compliance features\n\n## Authentication\n\nAll API endpoints require authentication\
    \ using API keys or JWT tokens.\n                "
  license:
    name: Proprietary
    url: https://ainflue.com/license
  termsOfService: https://ainflue.com/terms
  title: Ainflue AI Platform API
  version: 1.0.0
openapi: 3.0.3
paths:
  /admin/config:
    get:
      description: Retrieve current system configuration (admin only)
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  environment:
                    type: string
                  features:
                    type: object
                  limits:
                    type: object
                  security_settings:
                    type: object
                  version:
                    type: string
                type: object
          description: System configuration
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Insufficient permissions
      security:
      - BearerAuth: []
      summary: Get system configuration
      tags:
      - Admin
  /analytics/dashboard:
    get:
      description: Retrieve key metrics for the analytics dashboard
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsData'
          description: Dashboard analytics data
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get dashboard analytics
      tags:
      - Analytics
  /content/upload:
    post:
      description: Upload new content for protection and management
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              example:
                content_type: audio
                creator_id: creator_123
                description: A beautiful acoustic piece
                file_data: base64_encoded_file_data
                title: My New Song
              type: object
        description: Content upload data
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  content_id:
                    type: string
                  processing_eta:
                    description: ETA in seconds
                    type: integer
                  status:
                    type: string
                  upload_time:
                    format: date-time
                    type: string
                type: object
          description: Content uploaded successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid upload data
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: File too large
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Upload content
      tags:
      - Content
  /content/{content_id}:
    get:
      description: Retrieve detailed information about specific content
      parameters:
      - description: Content identifier
        example: content_123
        in: path
        name: content_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
          description: Content details
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Content not found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get content details
      tags:
      - Content
  /content/{content_id}/analyze:
    post:
      description: Run AI analysis on uploaded content for protection and classification
      parameters:
      - description: Content identifier
        example: content_123
        in: path
        name: content_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  analysis_score:
                    maximum: 1
                    minimum: 0
                    type: number
                  analyzed_at:
                    format: date-time
                    type: string
                  content_id:
                    type: string
                  fingerprint:
                    description: Content fingerprint
                    type: string
                  metadata:
                    type: object
                  protection_level:
                    enum:
                    - low
                    - medium
                    - high
                    type: string
                type: object
          description: Analysis completed
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Content not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Content already analyzed
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Analyze content
      tags:
      - Content
      - Protection
  /creators:
    get:
      description: Get a paginated list of creators with optional filtering
      parameters:
      - description: Page number (1-based)
        example: 1
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Items per page
        example: 10
        in: query
        name: per_page
        required: false
        schema:
          type: integer
      - description: Filter by creator type
        in: query
        name: type
        required: false
        schema:
          enum:
          - musician
          - blogger
          - photographer
          - influencer
          type: string
      - description: Filter by verification status
        in: query
        name: status
        required: false
        schema:
          enum:
          - pending
          - verified
          - rejected
          type: string
      - description: Search by name or email
        in: query
        name: search
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  creators:
                    items:
                      $ref: '#/components/schemas/Creator'
                    type: array
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer
                  total_pages:
                    type: integer
                type: object
          description: List of creators
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: List creators
      tags:
      - Creators
    post:
      description: Create a new creator account with the provided information
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              example:
                country: US
                email: john@example.com
                language: en
                name: John Doe
                type: musician
              type: object
        description: Creator information
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creator'
          description: Creator created successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid input data
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Creator with email already exists
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Create new creator
      tags:
      - Creators
  /creators/{creator_id}:
    get:
      description: Retrieve detailed information about a specific creator
      parameters:
      - description: Creator identifier
        example: creator_123
        in: path
        name: creator_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creator'
          description: Creator details
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Creator not found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get creator by ID
      tags:
      - Creators
  /health:
    get:
      description: Check the overall health and status of the API system
      parameters: []
      responses:
        '200':
          content:
            application/json:
              examples:
                healthy:
                  summary: Healthy system response
                  value:
                    status: healthy
                    timestamp: '2025-01-07T10:00:00Z'
                    uptime: 3600
                    version: 1.0.0
              schema:
                properties:
                  status:
                    example: healthy
                    type: string
                  timestamp:
                    format: date-time
                    type: string
                  uptime:
                    description: Uptime in seconds
                    type: number
                  version:
                    example: 1.0.0
                    type: string
                type: object
          description: System is healthy
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: System is unhealthy
      summary: System health check
      tags:
      - Health
  /health/detailed:
    get:
      description: Get detailed health information about all system components
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  components:
                    properties:
                      ai_engine:
                        type: string
                      database:
                        type: string
                      redis:
                        type: string
                      storage:
                        type: string
                    type: object
                  metrics:
                    properties:
                      cpu_usage:
                        type: number
                      disk_usage:
                        type: number
                      memory_usage:
                        type: number
                    type: object
                  status:
                    type: string
                type: object
          description: Detailed health information
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Detailed system health check
      tags:
      - Health
  /monetization/revenue:
    get:
      description: Retrieve revenue reports for creators and content
      parameters:
      - description: Filter by creator
        in: query
        name: creator_id
        required: false
        schema:
          type: string
      - description: Start date (ISO 8601)
        in: query
        name: start_date
        required: false
        schema:
          type: string
      - description: End date (ISO 8601)
        in: query
        name: end_date
        required: false
        schema:
          type: string
      - description: Group results by
        in: query
        name: group_by
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  breakdown:
                    items:
                      properties:
                        period:
                          type: string
                        revenue:
                          type: number
                        transactions:
                          type: integer
                      type: object
                    type: array
                  period_end:
                    format: date-time
                    type: string
                  period_start:
                    format: date-time
                    type: string
                  total_revenue:
                    type: number
                type: object
          description: Revenue report data
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get revenue reports
      tags:
      - Monetization
  /protection/check:
    post:
      description: Check if content matches any protected content in the system
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              example:
                content_data: base64_encoded_content
                content_type: audio
                threshold: 0.85
              type: object
        description: Content to check
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  check_timestamp:
                    format: date-time
                    type: string
                  matches:
                    items:
                      properties:
                        content_id:
                          type: string
                        creator_id:
                          type: string
                        match_segments:
                          type: array
                        similarity_score:
                          type: number
                      type: object
                    type: array
                  matches_found:
                    type: boolean
                type: object
          description: Infringement check results
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Check for content infringement
      tags:
      - Protection
  /security/audit:
    get:
      description: Retrieve security audit information and compliance status
      parameters:
      - description: Type of audit
        in: query
        name: audit_type
        required: false
        schema:
          enum:
          - access
          - data
          - infrastructure
          - compliance
          type: string
      - description: Audit period start
        in: query
        name: start_date
        required: false
        schema:
          type: string
      - description: Audit period end
        in: query
        name: end_date
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  audit_id:
                    type: string
                  audit_type:
                    type: string
                  findings:
                    items:
                      properties:
                        category:
                          type: string
                        description:
                          type: string
                        recommendation:
                          type: string
                        severity:
                          type: string
                      type: object
                    type: array
                  generated_at:
                    format: date-time
                    type: string
                  score:
                    maximum: 100
                    minimum: 0
                    type: number
                  status:
                    enum:
                    - passed
                    - failed
                    - warning
                    type: string
                type: object
          description: Security audit report
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get security audit report
      tags:
      - Security
security:
- ApiKeyAuth: []
- BearerAuth: []
servers:
- description: Production server
  url: https://api.ainflue.com/v1
- description: Staging server
  url: https://staging-api.ainflue.com/v1
- description: Development server
  url: http://localhost:8000/api/v1
tags:
- description: API health check and system status endpoints
  name: Health
- description: Creator management and profile operations
  name: Creators
- description: Content upload, management, and analysis
  name: Content
- description: Content protection and rights management
  name: Protection
- description: Revenue tracking and payment processing
  name: Monetization
- description: Analytics and reporting endpoints
  name: Analytics
- description: Security and audit endpoints
  name: Security
- description: Administrative operations (admin only)
  name: Admin
