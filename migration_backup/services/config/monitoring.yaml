# Enterprise Monitoring Configuration
# Author: Fahed Mlaiel (mlaiel@live.de)
# Version: 1.0.0 Enterprise Creator Economy Platform
# ⚠️ AVERTISSEMENT LÉGAL: Configuration propriétaire - Utilisation commerciale interdite sans autorisation

# Prometheus Configuration
prometheus:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
    external_labels:
      cluster: "ainflue-creator"
      environment: "${ENVIRONMENT}"
      
  rule_files:
    - "/etc/prometheus/rules/*.yml"
    - "/etc/prometheus/creator_rules/*.yml"
    
  scrape_configs:
    - job_name: "ainflue-services"
      static_configs:
        - targets:
          - "localhost:8090"  # Services metrics
          - "localhost:8091"  # Health monitor
          - "localhost:8092"  # AI orchestrator
          
    - job_name: "postgres-exporter"
      static_configs:
        - targets: ["localhost:9187"]
        
    - job_name: "redis-exporter"
      static_configs:
        - targets: ["localhost:9121"]
        
    - job_name: "node-exporter"
      static_configs:
        - targets: ["localhost:9100"]
        
    - job_name: "creator-app"
      metrics_path: "/metrics"
      scrape_interval: 30s
      static_configs:
        - targets:
          - "app-1:8080"
          - "app-2:8080"
          - "app-3:8080"
          
  alerting:
    alertmanagers:
      - static_configs:
        - targets: ["localhost:9093"]
        
  storage:
    tsdb:
      retention_time: "90d"
      retention_size: "50GB"
      wal_compression: true

# Grafana Configuration
grafana:
  server:
    http_port: 3000
    domain: "monitoring.ainflue.com"
    root_url: "https://monitoring.ainflue.com"
    
  security:
    admin_user: "${GRAFANA_ADMIN_USER}"
    admin_password: "${GRAFANA_ADMIN_PASSWORD}"
    secret_key: "${GRAFANA_SECRET_KEY}"
    
  database:
    type: "postgres"
    host: "${GRAFANA_DB_HOST}"
    name: "grafana"
    user: "${GRAFANA_DB_USER}"
    password: "${GRAFANA_DB_PASSWORD}"
    ssl_mode: "require"
    
  auth:
    oauth_auto_login: true
    google:
      enabled: true
      client_id: "${GOOGLE_OAUTH_CLIENT_ID}"
      client_secret: "${GOOGLE_OAUTH_CLIENT_SECRET}"
      allowed_domains: "ainflue.com"
      
  dashboards:
    default_home_dashboard_path: "/var/lib/grafana/dashboards/creator-overview.json"
    
  provisioning:
    datasources:
      - name: "Prometheus"
        type: "prometheus"
        url: "http://localhost:9090"
        access: "proxy"
        is_default: true
        
      - name: "Elasticsearch"
        type: "elasticsearch"
        url: "http://localhost:9200"
        database: "ainflue-logs"
        
    dashboards:
      - name: "Creator Economy"
        folder: "Creator Dashboards"
        type: "file"
        options:
          path: "/etc/grafana/dashboards/creator"

# Alertmanager Configuration
alertmanager:
  global:
    smtp_smarthost: "smtp.gmail.com:587"
    smtp_from: "alerts@ainflue.com"
    smtp_auth_username: "${SMTP_USERNAME}"
    smtp_auth_password: "${SMTP_PASSWORD}"
    
  route:
    group_by: ["alertname", "cluster", "service"]
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 1h
    receiver: "default"
    
    routes:
      - match:
          severity: "critical"
        receiver: "critical-alerts"
        group_wait: 5s
        repeat_interval: 5m
        
      - match:
          service: "creator-app"
        receiver: "creator-team"
        
      - match:
          service: "ai-processing"
        receiver: "ai-team"
        
  receivers:
    - name: "default"
      email_configs:
        - to: "devops@ainflue.com"
          subject: "IA Chéries Alert: {{ .GroupLabels.alertname }}"
          
    - name: "critical-alerts"
      email_configs:
        - to: "critical@ainflue.com"
          subject: "🚨 CRITICAL: {{ .GroupLabels.alertname }}"
          
      slack_configs:
        - api_url: "${SLACK_WEBHOOK_CRITICAL}"
          channel: "#critical-alerts"
          title: "Critical Alert: {{ .GroupLabels.alertname }}"
          
    - name: "creator-team"
      slack_configs:
        - api_url: "${SLACK_WEBHOOK_CREATOR}"
          channel: "#creator-alerts"
          
    - name: "ai-team"
      slack_configs:
        - api_url: "${SLACK_WEBHOOK_AI}"
          channel: "#ai-alerts"

# Jaeger Tracing Configuration
jaeger:
  collector:
    grpc_port: 14250
    http_port: 14268
    
  agent:
    http_port: 5778
    grpc_port: 6831
    
  query:
    http_port: 16686
    base_path: "/jaeger"
    
  storage:
    type: "elasticsearch"
    elasticsearch:
      server_urls: ["http://localhost:9200"]
      index_prefix: "jaeger"
      
  sampling:
    default_strategy:
      type: "probabilistic"
      param: 0.1  # 10% sampling rate
      
    per_service_strategies:
      - service: "creator-app"
        type: "adaptive"
        max_traces_per_second: 100
        
      - service: "ai-processing"
        type: "probabilistic"
        param: 0.5  # 50% sampling for AI services

# ELK Stack Configuration
elasticsearch:
  cluster:
    name: "ainflue-logs"
    
  network:
    host: "0.0.0.0"
    port: 9200
    
  discovery:
    type: "single-node"
    
  indices:
    application_logs:
      index_pattern: "logs-*"
      settings:
        number_of_shards: 3
        number_of_replicas: 1
        refresh_interval: "30s"
        
    audit_logs:
      index_pattern: "audit-*"
      settings:
        number_of_shards: 2
        number_of_replicas: 2
        
    performance_metrics:
      index_pattern: "metrics-*"
      settings:
        number_of_shards: 5
        number_of_replicas: 0

logstash:
  input:
    beats:
      port: 5044
      
    http:
      port: 8080
      
  filter:
    grok:
      patterns:
        - "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}"
        
    mutate:
      add_field:
        environment: "${ENVIRONMENT}"
        application: "ainflue-creator"
        
  output:
    elasticsearch:
      hosts: ["localhost:9200"]
      index: "logs-%{+YYYY.MM.dd}"

kibana:
  server:
    port: 5601
    host: "0.0.0.0"
    
  elasticsearch:
    hosts: ["http://localhost:9200"]
    
  security:
    enabled: true
    auth_provider: "oidc"

# Application Performance Monitoring
apm:
  elastic_apm:
    service_name: "ainflue-creator"
    environment: "${ENVIRONMENT}"
    server_url: "http://localhost:8200"
    
  new_relic:
    enabled: false
    license_key: "${NEW_RELIC_LICENSE_KEY}"
    app_name: "IA Chéries Creator Platform"
    
  datadog:
    enabled: false
    api_key: "${DATADOG_API_KEY}"
    service: "ainflue-creator"

# Custom Metrics Configuration
custom_metrics:
  creator_metrics:
    content_uploads_total:
      type: "counter"
      description: "Total number of content uploads"
      labels: ["creator_id", "content_type", "platform"]
      
    content_processing_duration:
      type: "histogram"
      description: "Time taken to process content"
      labels: ["content_type", "processing_stage"]
      buckets: [0.1, 0.5, 1.0, 2.5, 5.0, 10.0]
      
    ai_model_requests:
      type: "counter"
      description: "AI model API requests"
      labels: ["model_provider", "model_name", "status"]
      
    collaboration_events:
      type: "counter"
      description: "Collaboration events"
      labels: ["event_type", "creator_tier"]
      
    revenue_generated:
      type: "gauge"
      description: "Revenue generated by creators"
      labels: ["creator_id", "revenue_source"]
      
    platform_engagement:
      type: "gauge"
      description: "Engagement metrics per platform"
      labels: ["platform", "metric_type"]

# Health Checks Configuration
health_checks:
  endpoints:
    database:
      url: "/health/db"
      timeout: 5s
      interval: 30s
      
    redis:
      url: "/health/redis"
      timeout: 3s
      interval: 15s
      
    external_apis:
      url: "/health/apis"
      timeout: 10s
      interval: 60s
      
    ai_services:
      url: "/health/ai"
      timeout: 15s
      interval: 120s
      
  thresholds:
    response_time_warning: 1000ms
    response_time_critical: 5000ms
    success_rate_warning: 95%
    success_rate_critical: 90%

# SLA Monitoring
sla:
  targets:
    api_availability: 99.9%
    api_response_time: 500ms
    content_processing_time: 30s
    ai_response_time: 10s
    
  monitoring:
    window: "30d"
    alerting_threshold: 0.1%  # Alert if SLA drops by 0.1%
    
  reporting:
    frequency: "weekly"
    recipients: ["sre@ainflue.com", "product@ainflue.com"]

# Synthetic Monitoring
synthetic:
  uptime_checks:
    main_app:
      url: "https://creator.ainflue.com"
      method: "GET"
      timeout: 10s
      interval: 60s
      locations: ["us-east-1", "eu-west-1", "ap-southeast-1"]
      
    api_health:
      url: "https://api.ainflue.com/health"
      method: "GET"
      timeout: 5s
      interval: 30s
      
  user_journey_tests:
    creator_signup:
      steps:
        - action: "navigate"
          url: "https://creator.ainflue.com/signup"
        - action: "fill_form"
          selectors:
            email: "#email"
            password: "#password"
        - action: "click"
          selector: "#signup-button"
      interval: 300s
      
    content_upload:
      steps:
        - action: "login"
          credentials: "test_user"
        - action: "navigate"
          url: "https://creator.ainflue.com/upload"
        - action: "upload_file"
          selector: "#file-input"
          file: "test_video.mp4"
      interval: 600s

# Error Tracking
error_tracking:
  sentry:
    dsn: "${SENTRY_DSN}"
    environment: "${ENVIRONMENT}"
    release: "${APP_VERSION}"
    
    performance:
      traces_sample_rate: 0.1
      profiles_sample_rate: 0.1
      
  rollbar:
    enabled: false
    access_token: "${ROLLBAR_ACCESS_TOKEN}"

# Log Aggregation
logging:
  level: "${LOG_LEVEL:-INFO}"
  format: "json"
  
  outputs:
    console:
      enabled: true
      format: "human"
      
    file:
      enabled: true
      path: "/var/log/ainflue/app.log"
      rotation:
        max_size: "100MB"
        max_files: 10
        
    elasticsearch:
      enabled: true
      index: "logs-ainflue"
      
  structured_logging:
    correlation_id: true
    user_id: true
    request_id: true
    timestamp: true
    
  log_sampling:
    debug_sample_rate: 0.01
    info_sample_rate: 1.0
    warn_sample_rate: 1.0
    error_sample_rate: 1.0

# Real-time Monitoring
real_time:
  websocket_metrics:
    active_connections: true
    message_throughput: true
    connection_duration: true
    
  streaming_analytics:
    content_views: true
    engagement_rates: true
    revenue_tracking: true
    
  event_processing:
    kafka_lag: true
    processing_rate: true
    error_rate: true

# Business Metrics
business_metrics:
  creator_kpis:
    daily_active_creators: true
    content_upload_rate: true
    collaboration_success_rate: true
    revenue_per_creator: true
    
  platform_kpis:
    total_revenue: true
    user_acquisition_cost: true
    lifetime_value: true
    churn_rate: true
    
  content_metrics:
    viral_content_detection: true
    trending_topics: true
    platform_performance: true

# Alerting Rules
alerting_rules:
  infrastructure:
    high_cpu_usage:
      condition: "cpu_usage > 80"
      duration: "5m"
      severity: "warning"
      
    out_of_memory:
      condition: "memory_usage > 90"
      duration: "2m"
      severity: "critical"
      
    disk_space_low:
      condition: "disk_usage > 85"
      duration: "5m"
      severity: "warning"
      
  application:
    high_error_rate:
      condition: "error_rate > 5"
      duration: "2m"
      severity: "critical"
      
    slow_response_time:
      condition: "response_time > 2s"
      duration: "5m"
      severity: "warning"
      
  business:
    revenue_drop:
      condition: "revenue_change < -10"
      duration: "30m"
      severity: "critical"
      
    creator_churn_spike:
      condition: "churn_rate > 15"
      duration: "1h"
      severity: "warning"