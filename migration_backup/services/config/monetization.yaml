# Payment Gateway Configuration
payment_gateways:
  stripe:
    api_key: "${STRIPE_SECRET_KEY}"
    publishable_key: "${STRIPE_PUBLISHABLE_KEY}"
    webhook_secret: "${STRIPE_WEBHOOK_SECRET}"
    
    features:
      payments: true
      subscriptions: true
      marketplace: true
      connect: true
      
    supported_currencies: ["USD", "EUR", "GBP", "CAD", "AUD"]
    
    fees:
      standard_rate: 0.029  # 2.9%
      fixed_fee: 0.30
      international_rate: 0.039  # 3.9%
      
    payout_schedule: "daily"
    minimum_payout: 1.00
    
  paypal:
    client_id: "${PAYPAL_CLIENT_ID}"
    client_secret: "${PAYPAL_CLIENT_SECRET}"
    
    features:
      payments: true
      subscriptions: true
      payouts: true
      
    supported_currencies: ["USD", "EUR", "GBP", "CAD", "AUD", "JPY"]
    
    fees:
      standard_rate: 0.034  # 3.4%
      fixed_fee: 0.30
      
  crypto_payments:
    enabled: true
    providers:
      coinbase:
        api_key: "${COINBASE_API_KEY}"
        api_secret: "${COINBASE_API_SECRET}"
        
      binance_pay:
        api_key: "${BINANCE_PAY_API_KEY}"
        api_secret: "${BINANCE_PAY_SECRET}"
        
    supported_currencies: ["BTC", "ETH", "USDC", "USDT"]
    conversion_to_fiat: true
    
# Revenue Sharing Model
revenue_sharing:
  creator_percentage: 70
  platform_percentage: 30
  
  tier_based_sharing:
    bronze:
      creator_percentage: 65
      platform_percentage: 35
      
    silver:
      creator_percentage: 70
      platform_percentage: 30
      
    gold:
      creator_percentage: 75
      platform_percentage: 25
      
    platinum:
      creator_percentage: 80
      platform_percentage: 20
      
    diamond:
      creator_percentage: 85
      platform_percentage: 15
      
  collaboration_revenue:
    equal_split: true
    custom_split_allowed: true
    platform_fee: 5  # Additional 5% for facilitation
    
  referral_bonus:
    referrer_percentage: 2
    source: "platform_percentage"
    duration_months: 12

