version: "2.0.0"
metadata:
  name: "grafana-creator-dashboards"
  description: "Dashboards Grafana Creator Economy"
  created_by: "Fahed Mlaiel"
  created_date: "2025-01-08"
  dashboard_count: 12
  visualization_type: "enterprise"

# 🏗️ Configuration globale Grafana
grafana_config:
  # Datasources Configuration
  datasources:
    - name: "Prometheus-Creator-Metrics"
      type: "prometheus"
      url: "http://prometheus:9090"
      access: "proxy"
      isDefault: true
      basicAuth: false
      
    - name: "Elasticsearch-Creator-Logs"
      type: "elasticsearch"
      url: "http://elasticsearch:9200"
      access: "proxy"
      database: "ainflue-logs-*"
      timeField: "@timestamp"
      
    - name: "InfluxDB-Creator-Timeseries"
      type: "influxdb"
      url: "http://influxdb:8086"
      access: "proxy"
      database: "ainflue_creator_metrics"
      
  # Global Dashboard Settings
  global_settings:
    timezone: "UTC"
    refresh_intervals: ["5s", "10s", "30s", "1m", "5m", "15m", "30m", "1h", "2h", "1d"]
    time_ranges: ["5m", "15m", "1h", "3h", "6h", "12h", "24h", "2d", "7d", "30d"]
    theme: "dark"
    auto_refresh: "30s"

# 📊 Dashboards Creator Economy
dashboards:
  # 🎯 1. Creator Overview Dashboard - Vue d'ensemble créateurs
  creator_overview:
    uid: "creator-overview-main"
    title: "🎨 Creator Economy - Vue d'Ensemble"
    description: "Dashboard principal monitoring Creator Economy IA Chéries"
    tags: ["creator", "overview", "kpi", "business"]
    timezone: "UTC"
    refresh: "30s"
    time:
      from: "now-24h"
      to: "now"
    
    # Variables pour filtrage dynamique
    templating:
      list:
        - name: "creator_tier"
          type: "custom"
          multi: true
          includeAll: true
          options: ["enterprise", "premium", "standard", "basic"]
          current: "All"
          
        - name: "creator_type"
          type: "custom" 
          multi: true
          includeAll: true
          options: ["musician", "blogger", "photographer", "influencer", "comedian"]
          current: "All"
          
        - name: "time_range"
          type: "custom"
          options: ["1h", "6h", "24h", "7d", "30d"]
          current: "24h"
    
    panels:
      # Row 1: KPIs Globaux
      - title: "📊 KPIs Globaux Creator Economy"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 0}
        
      - title: "Total Créateurs Actifs"
        type: "stat"
        gridPos: {h: 4, w: 6, x: 0, y: 1}
        targets:
          - expr: 'sum(ainflue_active_creators_total{creator_tier=~"$creator_tier", creator_type=~"$creator_type"})'
        fieldConfig:
          defaults:
            unit: "short"
            color: {mode: "palette-classic"}
            custom: {displayMode: "basic"}
        options:
          colorMode: "background"
          graphMode: "area"
          justifyMode: "center"
          
      - title: "Revenus Totaux (24h)"
        type: "stat"
        gridPos: {h: 4, w: 6, x: 6, y: 1}
        targets:
          - expr: 'sum(increase(ainflue_revenue_usd_total{creator_tier=~"$creator_tier"}[24h]))'
        fieldConfig:
          defaults:
            unit: "currencyUSD"
            color: {mode: "palette-classic"}
        options:
          colorMode: "background"
          graphMode: "area"
          
      - title: "Score Satisfaction Créateurs"
        type: "gauge"
        gridPos: {h: 4, w: 6, x: 12, y: 1}
        targets:
          - expr: 'avg(ainflue_creator_satisfaction_score{creator_tier=~"$creator_tier"})'
        fieldConfig:
          defaults:
            min: 0
            max: 5
            unit: "short"
            thresholds:
              steps:
                - color: "red"
                  value: 0
                - color: "yellow" 
                  value: 3
                - color: "green"
                  value: 4
                  
      - title: "Taux Croissance Créateurs"
        type: "stat"
        gridPos: {h: 4, w: 6, x: 18, y: 1}
        targets:
          - expr: 'rate(ainflue_new_creators_total[7d]) * 86400 * 7'
        fieldConfig:
          defaults:
            unit: "percent"
            color: {mode: "palette-classic"}
            
      # Row 2: Performance par Type de Créateur
      - title: "🎨 Performance par Type de Créateur"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 5}
        
      - title: "Revenus par Type de Créateur"
        type: "timeseries"
        gridPos: {h: 8, w: 12, x: 0, y: 6}
        targets:
          - expr: 'sum by (creator_type) (rate(ainflue_revenue_usd_total{creator_tier=~"$creator_tier", creator_type=~"$creator_type"}[1h]))'
            legendFormat: "{{creator_type}}"
        fieldConfig:
          defaults:
            unit: "currencyUSD"
            custom:
              drawStyle: "line"
              pointSize: 5
              
      - title: "Engagement par Type de Créateur"
        type: "barchart"
        gridPos: {h: 8, w: 12, x: 12, y: 6}
        targets:
          - expr: 'avg by (creator_type) (ainflue_creator_engagement_score{creator_tier=~"$creator_tier", creator_type=~"$creator_type"})'
            legendFormat: "{{creator_type}}"
        fieldConfig:
          defaults:
            unit: "percent"
            min: 0
            max: 100

  # 🎵 2. Musicians Dashboard - Dashboard musiciens
  musicians_dashboard:
    uid: "creator-musicians-detail"
    title: "🎵 Musicians - Monitoring Détaillé"
    description: "Dashboard spécialisé pour les créateurs musiciens"
    tags: ["creator", "musician", "audio", "streaming"]
    
    templating:
      list:
        - name: "musician_id"
          type: "query"
          query: 'label_values(ainflue_audio_processing_duration_ms{creator_type="musician"}, creator_id)'
          multi: true
          includeAll: true
          
        - name: "audio_format"
          type: "custom"
          options: ["mp3", "wav", "flac", "aac"]
          multi: true
          includeAll: true
    
    panels:
      # Audio Processing Performance
      - title: "⚡ Performance Traitement Audio"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 0}
        
      - title: "Latence Traitement Audio"
        type: "timeseries"
        gridPos: {h: 8, w: 12, x: 0, y: 1}
        targets:
          - expr: 'avg by (creator_id) (ainflue_audio_processing_duration_ms{creator_id=~"$musician_id", audio_format=~"$audio_format"})'
            legendFormat: "{{creator_id}}"
        fieldConfig:
          defaults:
            unit: "ms"
            custom:
              thresholds:
                - color: "green"
                  value: 0
                - color: "yellow"
                  value: 100
                - color: "red"
                  value: 500
                  
      - title: "Qualité Streaming Audio"
        type: "gauge"
        gridPos: {h: 8, w: 12, x: 12, y: 1}
        targets:
          - expr: 'avg(ainflue_audio_streaming_quality_score{creator_id=~"$musician_id"})'
        fieldConfig:
          defaults:
            min: 0
            max: 1
            unit: "short"
            
      # Collaboration Metrics
      - title: "🤝 Métriques Collaboration Musicale"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 9}
        
      - title: "Taux Succès Collaborations"
        type: "stat"
        gridPos: {h: 4, w: 8, x: 0, y: 10}
        targets:
          - expr: 'avg(ainflue_music_collaboration_success_rate{creator_id=~"$musician_id"})'
        fieldConfig:
          defaults:
            unit: "percent"
            
      - title: "Revenus par Stream"
        type: "timeseries"
        gridPos: {h: 4, w: 16, x: 8, y: 10}
        targets:
          - expr: 'sum by (platform) (ainflue_music_revenue_per_stream{creator_id=~"$musician_id"})'
            legendFormat: "{{platform}}"

  # 📝 3. Bloggers Dashboard - Dashboard blogueurs
  bloggers_dashboard:
    uid: "creator-bloggers-detail"
    title: "📝 Bloggers - Monitoring SEO & Content"
    description: "Dashboard spécialisé pour les créateurs blogueurs"
    tags: ["creator", "blogger", "seo", "content"]
    
    panels:
      # SEO Performance
      - title: "🔍 Performance SEO"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 0}
        
      - title: "Positions Ranking SEO"
        type: "timeseries"
        gridPos: {h: 8, w: 24, x: 0, y: 1}
        targets:
          - expr: 'avg by (keyword) (ainflue_blog_seo_ranking_position{creator_type="blogger"})'
            legendFormat: "{{keyword}}"
        fieldConfig:
          defaults:
            unit: "short"
            custom:
              drawStyle: "line"
              axisPlacement: "left"
              axisLabel: "Position (plus bas = mieux)"
              
      # Content Delivery
      - title: "📄 Performance Contenu"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 9}
        
      - title: "Temps Chargement Pages"
        type: "heatmap"
        gridPos: {h: 8, w: 12, x: 0, y: 10}
        targets:
          - expr: 'ainflue_blog_content_delivery_ms{creator_type="blogger"}'
        fieldConfig:
          defaults:
            unit: "ms"
            
      - title: "Engagement Articles"
        type: "table"
        gridPos: {h: 8, w: 12, x: 12, y: 10}
        targets:
          - expr: 'sum by (article_id) (ainflue_blog_engagement_metrics{creator_type="blogger"})'
            format: "table"
        fieldConfig:
          defaults:
            custom:
              displayMode: "table"

  # 📸 4. Photographers Dashboard
  photographers_dashboard:
    uid: "creator-photographers-detail"
    title: "📸 Photographers - Image Processing & Storage"
    description: "Dashboard spécialisé pour les créateurs photographes"
    tags: ["creator", "photographer", "image", "storage"]
    
    panels:
      # Image Processing
      - title: "🖼️ Traitement Images"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 0}
        
      - title: "Performance Traitement Images"
        type: "timeseries"
        gridPos: {h: 8, w: 12, x: 0, y: 1}
        targets:
          - expr: 'histogram_quantile(0.95, rate(ainflue_image_processing_duration_ms_bucket{creator_type="photographer"}[5m]))'
            legendFormat: "95th percentile"
          - expr: 'histogram_quantile(0.50, rate(ainflue_image_processing_duration_ms_bucket{creator_type="photographer"}[5m]))'
            legendFormat: "50th percentile"
            
      - title: "Utilisation Stockage"
        type: "piechart"
        gridPos: {h: 8, w: 12, x: 12, y: 1}
        targets:
          - expr: 'sum by (storage_tier) (ainflue_photographer_storage_utilization{creator_type="photographer"})'
            legendFormat: "{{storage_tier}}"

  # 🎬 5. Influencers Dashboard
  influencers_dashboard:
    uid: "creator-influencers-detail"
    title: "🎬 Influencers - Cross-Platform Analytics"
    description: "Dashboard spécialisé pour les influenceurs multi-plateformes"
    tags: ["creator", "influencer", "social", "cross-platform"]
    
    panels:
      # Cross-Platform Reach
      - title: "📱 Portée Multi-Plateformes"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 0}
        
      - title: "Followers par Plateforme"
        type: "barchart"
        gridPos: {h: 8, w: 12, x: 0, y: 1}
        targets:
          - expr: 'sum by (platform) (ainflue_influencer_followers_total{creator_type="influencer"})'
            legendFormat: "{{platform}}"
            
      - title: "Taux Engagement par Plateforme"
        type: "timeseries"
        gridPos: {h: 8, w: 12, x: 12, y: 1}
        targets:
          - expr: 'avg by (platform) (ainflue_influencer_engagement_rate{creator_type="influencer"})'
            legendFormat: "{{platform}}"

  # 🏆 6. Creator Tier Performance Dashboard
  creator_tier_performance:
    uid: "creator-tier-performance"
    title: "🏆 Performance par Tier de Créateur"
    description: "Comparaison performance entre tiers de créateurs"
    tags: ["tier", "performance", "sla", "comparison"]
    
    panels:
      # SLA Compliance par Tier
      - title: "✅ Conformité SLA par Tier"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 0}
        
      - title: "Compliance SLA Global"
        type: "stat"
        gridPos: {h: 4, w: 6, x: 0, y: 1}
        targets:
          - expr: 'avg by (creator_tier) (ainflue_sla_compliance_rate)'
        fieldConfig:
          defaults:
            unit: "percent"
            thresholds:
              steps:
                - color: "red"
                  value: 0
                - color: "yellow"
                  value: 95
                - color: "green"
                  value: 99
                  
      - title: "Temps Réponse Support par Tier"
        type: "bargauge"
        gridPos: {h: 4, w: 18, x: 6, y: 1}
        targets:
          - expr: 'avg by (creator_tier) (ainflue_support_response_time_minutes)'
            legendFormat: "{{creator_tier}}"
        fieldConfig:
          defaults:
            unit: "m"
            max: 240  # 4 hours max

  # 💰 7. Revenue & Monetization Dashboard
  revenue_monetization:
    uid: "creator-revenue-monetization"
    title: "💰 Revenus & Monétisation Creator Economy"
    description: "Dashboard dédié aux métriques financières et monétisation"
    tags: ["revenue", "monetization", "financial", "kpi"]
    
    panels:
      # Revenue Streams
      - title: "💵 Flux de Revenus"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 0}
        
      - title: "Revenus par Stream"
        type: "piechart"
        gridPos: {h: 8, w: 12, x: 0, y: 1}
        targets:
          - expr: 'sum by (revenue_stream) (ainflue_revenue_by_stream_usd)'
            legendFormat: "{{revenue_stream}}"
        options:
          pieType: "donut"
          
      - title: "Évolution Revenus Mensuelle"
        type: "timeseries"
        gridPos: {h: 8, w: 12, x: 12, y: 1}
        targets:
          - expr: 'sum(increase(ainflue_revenue_usd_total[30d]))'
            legendFormat: "Revenus Mensuels"
        fieldConfig:
          defaults:
            unit: "currencyUSD"

  # 🤖 8. AI/ML Performance Dashboard  
  ai_ml_performance:
    uid: "creator-ai-ml-performance"
    title: "🤖 Performance IA/ML Creator Economy"
    description: "Monitoring des modèles IA et algorithmes ML"
    tags: ["ai", "ml", "models", "performance"]
    
    panels:
      # Model Performance
      - title: "🧠 Performance Modèles IA"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 0}
        
      - title: "Précision Modèles par Type"
        type: "gauge"
        gridPos: {h: 8, w: 8, x: 0, y: 1}
        targets:
          - expr: 'avg by (model_type) (ainflue_ml_model_accuracy)'
            legendFormat: "{{model_type}}"
        fieldConfig:
          defaults:
            min: 0
            max: 1
            unit: "percentunit"
            
      - title: "Latence Inférence IA"
        type: "timeseries"
        gridPos: {h: 8, w: 8, x: 8, y: 1}
        targets:
          - expr: 'histogram_quantile(0.95, rate(ainflue_ai_inference_duration_ms_bucket[5m]))'
            legendFormat: "95th percentile"
            
      - title: "Drift Detection Modèles"
        type: "table"
        gridPos: {h: 8, w: 8, x: 16, y: 1}
        targets:
          - expr: 'ainflue_ml_model_drift_score'
            format: "table"

  # 🛡️ 9. Security & Protection Dashboard
  security_protection:
    uid: "creator-security-protection"
    title: "🛡️ Sécurité & Protection Contenu"
    description: "Monitoring sécurité et protection propriété intellectuelle"
    tags: ["security", "protection", "copyright", "compliance"]
    
    panels:
      # Content Protection
      - title: "🔒 Protection Contenu"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 0}
        
      - title: "Incidents Piratage Détectés"
        type: "stat"
        gridPos: {h: 4, w: 8, x: 0, y: 1}
        targets:
          - expr: 'sum(increase(ainflue_content_piracy_incidents_total[24h]))'
        fieldConfig:
          defaults:
            unit: "short"
            color: {mode: "thresholds"}
            thresholds:
              steps:
                - color: "green"
                  value: 0
                - color: "yellow"
                  value: 1
                - color: "red"
                  value: 5
                  
      - title: "Efficacité Protection par Type"
        type: "bargauge"
        gridPos: {h: 4, w: 16, x: 8, y: 1}
        targets:
          - expr: 'avg by (protection_type) (ainflue_protection_effectiveness_rate)'
            legendFormat: "{{protection_type}}"

  # 🎮 10. Gamification Dashboard
  gamification_engagement:
    uid: "creator-gamification"
    title: "🎮 Gamification & Engagement"
    description: "Métriques gamification et engagement créateurs"
    tags: ["gamification", "engagement", "achievements", "rewards"]
    
    panels:
      # Achievement System
      - title: "🏆 Système d'Achievements"
        type: "row"
        gridPos: {h: 1, w: 24, x: 0, y: 0}
        
      - title: "Achievements Débloqués (24h)"
        type: "stat"
        gridPos: {h: 4, w: 6, x: 0, y: 1}
        targets:
          - expr: 'sum(increase(ainflue_achievements_unlocked_total[24h]))'
        fieldConfig:
          defaults:
            unit: "short"
            color: {mode: "palette-classic"}
            
      - title: "Participation Challenges"
        type: "timeseries"
        gridPos: {h: 4, w: 18, x: 6, y: 1}
        targets:
          - expr: 'sum by (challenge_type) (ainflue_challenge_participation_rate)'
            legendFormat: "{{challenge_type}}"

# 🔄 Configuration Templates & Themes
dashboard_templates:
  # Template Standard Creator
  standard_creator_template:
    base_panels:
      - "creator_metrics_overview"
      - "performance_indicators"  
      - "revenue_tracking"
      - "engagement_metrics"
      - "sla_compliance"
      
  # Template Enterprise Creator
  enterprise_creator_template:
    base_panels:
      - "advanced_analytics"
      - "predictive_insights"
      - "custom_kpi_tracking"
      - "detailed_drill_down"
      - "real_time_alerting"

# 🎨 Custom Themes
themes:
  ainflue_dark:
    colors:
      primary: "#1a1a2e"
      secondary: "#16213e"
      accent: "#0f3460"
      success: "#00d4aa"
      warning: "#ffb400"
      error: "#ff4757"
      
  ainflue_light:
    colors:
      primary: "#ffffff"
      secondary: "#f8f9fa"
      accent: "#007bff"
      success: "#28a745"
      warning: "#ffc107"
      error: "#dc3545"

# 📱 Mobile Optimizations
mobile_config:
  responsive_breakpoints:
    xs: 480
    sm: 768
    md: 992
    lg: 1200
    
  mobile_panels:
    simplified_layout: true
    touch_friendly_controls: true
    reduced_data_points: true
    optimized_refresh_rates: true

