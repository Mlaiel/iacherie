# Configuration globale Prometheus
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'ainflue-creator-economy'
    environment: 'production'
    region: 'global'

# Configuration règles d'évaluation
rule_files:
  - "creator_economy_rules.yml"
  - "creator_tier_rules.yml"
  - "monetization_rules.yml"
  - "ai_ml_rules.yml"

# Configuration AlertManager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      path_prefix: /alertmanager
      scheme: http
      timeout: 10s

# 🎨 Configuration Scraping Creator Economy
scrape_configs:

  # 🎵 Musicians - Audio Processing & Streaming Metrics
  - job_name: 'creator-audio-processing'
    scrape_interval: 15s  # Haute fréquence pour audio
    metrics_path: '/metrics/audio'
    static_configs:
      - targets: ['ainflue-audio-engine:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'ainflue-audio-engine:8080'
    params:
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      processing_type: ['upload', 'transcode', 'streaming', 'collaboration']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_audio_.*'
        target_label: 'creator_type'
        replacement: 'musician'

  # 📝 Bloggers - SEO & Content Performance Metrics  
  - job_name: 'creator-seo-content'
    scrape_interval: 60s
    metrics_path: '/metrics/seo'
    static_configs:
      - targets: ['ainflue-seo-engine:8081']
    params:
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      content_type: ['article', 'tutorial', 'review', 'news']
      traffic_source: ['organic', 'social', 'direct', 'referral']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_blog_.*|ainflue_seo_.*'
        target_label: 'creator_type'
        replacement: 'blogger'

  # 📸 Photographers - Image Processing & Storage Metrics
  - job_name: 'creator-image-processing'
    scrape_interval: 30s
    metrics_path: '/metrics/images'
    static_configs:
      - targets: ['ainflue-image-engine:8082']
    params:
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      image_format: ['jpeg', 'png', 'raw', 'webp']
      processing_type: ['upload', 'resize', 'watermark', 'ai_enhance']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_image_.*|ainflue_photo_.*'
        target_label: 'creator_type'
        replacement: 'photographer'

  # 🎬 Influencers - Cross-Platform Metrics
  - job_name: 'creator-cross-platform'
    scrape_interval: 45s
    metrics_path: '/metrics/social'
    static_configs:
      - targets: ['ainflue-social-engine:8083']
    params:
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      platform: ['youtube', 'tiktok', 'instagram', 'twitter', 'linkedin']
      content_format: ['video', 'image', 'story', 'live']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_influencer_.*|ainflue_social_.*'
        target_label: 'creator_type'
        replacement: 'influencer'

  # 🤖 AI/ML Inference Metrics
  - job_name: 'creator-ai-inference'
    scrape_interval: 15s  # Haute fréquence pour IA
    metrics_path: '/metrics/ai'
    static_configs:
      - targets: ['ainflue-ai-engine:8084']
    params:
      model_type: ['classification', 'generation', 'protection', 'recommendation']
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      inference_type: ['real_time', 'batch', 'streaming']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_ai_.*|ainflue_ml_.*'
        target_label: 'service_type'
        replacement: 'ai_ml'

  # 💰 Monetization & Revenue Metrics
  - job_name: 'creator-monetization'
    scrape_interval: 30s
    metrics_path: '/metrics/revenue'
    static_configs:
      - targets: ['ainflue-payment-engine:8085']
    params:
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      revenue_stream: ['licensing', 'partnerships', 'subscriptions', 'merchandise']
      payment_method: ['stripe', 'paypal', 'bank_transfer', 'crypto']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_revenue_.*|ainflue_payment_.*'
        target_label: 'service_type'
        replacement: 'monetization'

  # 🤝 Collaboration Platform Metrics
  - job_name: 'creator-collaboration'
    scrape_interval: 60s
    metrics_path: '/metrics/collaboration'
    static_configs:
      - targets: ['ainflue-collaboration-engine:8086']
    params:
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      collaboration_type: ['music', 'video', 'photo', 'article', 'campaign']
      matching_algorithm: ['ai_based', 'manual', 'recommended']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_collaboration_.*'
        target_label: 'service_type'
        replacement: 'collaboration'

  # 🛡️ Content Protection Metrics
  - job_name: 'creator-content-protection'
    scrape_interval: 30s
    metrics_path: '/metrics/protection'
    static_configs:
      - targets: ['ainflue-protection-engine:8087']
    params:
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      protection_type: ['copyright', 'watermark', 'drm', 'blockchain']
      content_type: ['audio', 'video', 'image', 'text']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_protection_.*'
        target_label: 'service_type'
        replacement: 'content_protection'

  # 📺 Distribution Channel Metrics
  - job_name: 'creator-distribution'
    scrape_interval: 60s
    metrics_path: '/metrics/distribution'
    static_configs:
      - targets: ['ainflue-distribution-engine:8088']
    params:
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      distribution_channel: ['youtube', 'spotify', 'instagram', 'tiktok', 'own_website']
      content_format: ['video', 'audio', 'image', 'article']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_distribution_.*'
        target_label: 'service_type'
        replacement: 'distribution'

  # 🎮 Gamification Metrics
  - job_name: 'creator-gamification'
    scrape_interval: 60s
    metrics_path: '/metrics/gamification'
    static_configs:
      - targets: ['ainflue-gamification-engine:8089']
    params:
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      gamification_type: ['achievements', 'leaderboards', 'challenges', 'rewards']
      engagement_type: ['daily', 'weekly', 'monthly', 'seasonal']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_gamification_.*'
        target_label: 'service_type'
        replacement: 'gamification'

  # 🔍 SEO Performance Metrics
  - job_name: 'creator-seo-performance'
    scrape_interval: 300s  # 5 minutes - moins fréquent
    metrics_path: '/metrics/seo-performance'
    static_configs:
      - targets: ['ainflue-seo-tracker:8090']
    params:
      creator_tier: ['premium', 'standard', 'basic', 'enterprise']
      search_engine: ['google', 'bing', 'yahoo', 'duckduckgo']
      geo_location: ['global', 'us', 'eu', 'asia']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_seo_.*'
        target_label: 'service_type'
        replacement: 'seo_performance'

  # 🏗️ Infrastructure & Performance Metrics
  - job_name: 'ainflue-infrastructure'
    scrape_interval: 30s
    static_configs:
      - targets: 
          - 'ainflue-api-gateway:8080'
          - 'ainflue-database:5432'
          - 'ainflue-redis:6379'
          - 'ainflue-storage:9000'
    metric_relabel_configs:
      # Enrichissement des métriques infrastructure
      - source_labels: [__name__]
        regex: 'http_.*'
        target_label: 'metric_type'
        replacement: 'http'
      - source_labels: [__name__]
        regex: 'db_.*'
        target_label: 'metric_type'
        replacement: 'database'
      - source_labels: [__name__]
        regex: 'redis_.*'
        target_label: 'metric_type'
        replacement: 'cache'

  # 📊 Business Intelligence Metrics
  - job_name: 'creator-business-intelligence'
    scrape_interval: 300s  # 5 minutes
    metrics_path: '/metrics/business'
    static_configs:
      - targets: ['ainflue-bi-engine:8091']
    params:
      report_type: ['daily', 'weekly', 'monthly', 'real_time']
      kpi_category: ['revenue', 'engagement', 'growth', 'retention']
      creator_segment: ['top_performers', 'emerging', 'at_risk', 'new']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ainflue_bi_.*|ainflue_kpi_.*'
        target_label: 'service_type'
        replacement: 'business_intelligence'

# 🎯 Configuration Spécifique par Tier de Créateur
# Différenciation SLA et fréquence de collecte
creator_tier_configurations:
  premium:
    scrape_interval_override: 15s  # Plus fréquent pour premium
    timeout: 5s
    honor_labels: true
    priority: "high"
    
  enterprise:
    scrape_interval_override: 10s  # Ultra-fréquent pour enterprise
    timeout: 3s
    honor_labels: true
    priority: "critical"
    dedicated_endpoints: true
    
  standard:
    scrape_interval_override: 30s
    timeout: 10s
    honor_labels: true
    priority: "medium"
    
  basic:
    scrape_interval_override: 60s
    timeout: 15s
    honor_labels: false
    priority: "low"

# 📈 Métriques Personnalisées Creator Economy
custom_metrics_definitions:
  # Métriques de succès créateur
  creator_success_metrics:
    - metric: 'ainflue_creator_success_score'
      type: 'gauge'
      description: 'Score de succès global du créateur (0-100)'
      labels: ['creator_id', 'creator_type', 'tier']
      
    - metric: 'ainflue_creator_growth_rate'
      type: 'gauge'
      description: 'Taux de croissance mensuel du créateur'
      labels: ['creator_id', 'metric_type', 'period']
      
    - metric: 'ainflue_creator_engagement_score'
      type: 'gauge'
      description: 'Score engagement global créateur'
      labels: ['creator_id', 'platform', 'content_type']

  # Métriques de plateforme
  platform_health_metrics:
    - metric: 'ainflue_platform_active_creators'
      type: 'gauge'
      description: 'Nombre de créateurs actifs sur la plateforme'
      labels: ['tier', 'creator_type', 'region']
      
    - metric: 'ainflue_platform_content_processed'
      type: 'counter'
      description: 'Contenu total traité par la plateforme'
      labels: ['content_type', 'processing_status']
      
    - metric: 'ainflue_platform_revenue_total'
      type: 'counter'
      description: 'Revenus totaux générés sur la plateforme'
      labels: ['revenue_stream', 'creator_tier']

  # Métriques prédictives IA
  ai_predictive_metrics:
    - metric: 'ainflue_content_virality_prediction'
      type: 'gauge'
      description: 'Prédiction viralité contenu (0-1)'
      labels: ['creator_id', 'content_id', 'prediction_confidence']
      
    - metric: 'ainflue_creator_churn_risk'
      type: 'gauge'
      description: 'Risque de churn créateur (0-1)'
      labels: ['creator_id', 'risk_factors', 'prediction_horizon']
      
    - metric: 'ainflue_revenue_forecast'
      type: 'gauge'
      description: 'Prévision revenus créateur'
      labels: ['creator_id', 'forecast_period', 'confidence_interval']

# 🔄 Configuration Recording Rules
recording_rules:
  # Agrégations par créateur
  creator_aggregations:
    - record: 'ainflue:creator_avg_processing_time'
      expr: 'avg by (creator_id, creator_type) (ainflue_processing_duration_ms)'
      
    - record: 'ainflue:creator_total_revenue_hourly'
      expr: 'sum by (creator_id) (increase(ainflue_revenue_usd[1h]))'
      
    - record: 'ainflue:creator_engagement_rate_daily'
      expr: 'avg by (creator_id) (ainflue_engagement_score) * 100'

  # Agrégations par tier
  tier_aggregations:
    - record: 'ainflue:tier_performance_score'
      expr: 'avg by (creator_tier) (ainflue_creator_success_score)'
      
    - record: 'ainflue:tier_sla_compliance'
      expr: 'sum by (creator_tier) (ainflue_sla_met) / sum by (creator_tier) (ainflue_sla_total)'
      
    - record: 'ainflue:tier_revenue_per_creator'
      expr: 'sum by (creator_tier) (ainflue_revenue_usd) / count by (creator_tier) (ainflue_active_creators)'

  # Agrégations plateforme
  platform_aggregations:
    - record: 'ainflue:platform_health_score'
      expr: 'avg(up{job=~"creator-.*"})'
      
    - record: 'ainflue:platform_total_creators'
      expr: 'count(count by (creator_id) (ainflue_creator_active))'
      
    - record: 'ainflue:platform_content_velocity'
      expr: 'sum(rate(ainflue_content_created_total[5m]))'

# 🚨 Configuration Alerting avancée
advanced_alerting:
  # Seuils dynamiques basés sur ML
  dynamic_thresholds:
    enabled: true
    learning_period: '30d'
    confidence_level: 0.95
    adjustment_frequency: '24h'
    
  # Alertes prédictives
  predictive_alerts:
    enabled: true
    prediction_horizon: '7d'
    confidence_threshold: 0.80
    
  # Corrélation d'alertes
  alert_correlation:
    enabled: true
    correlation_window: '15m'
    minimum_correlation_score: 0.70

