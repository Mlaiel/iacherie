# ==============================================================================
# OPEN POLICY AGENT (OPA) GATEKEEPER POLICIES
# ==============================================================================

# Constraint Template for Creator Economy Security
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: ainfluecreatoreconomysecurity
  labels:
    app: opa-gatekeeper
    component: constraint-template
    business-unit: creator-economy
spec:
  crd:
    spec:
      names:
        kind: IA ChériescreatoreconomySecurity
      validation:
        type: object
        properties:
          requiredLabels:
            type: array
            items:
              type: string
          allowedServiceAccounts:
            type: array
            items:
              type: string
          maxReplicas:
            type: integer
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package ainfluecreatoreconomysecurity
        
        violation[{"msg": msg}] {
          # Ensure Creator Economy workloads have required labels
          required_labels := input.parameters.requiredLabels
          provided_labels := input.review.object.metadata.labels
          missing := required_labels[_]
          not provided_labels[missing]
          msg := sprintf("Missing required label: %v", [missing])
        }
        
        violation[{"msg": msg}] {
          # Ensure service accounts are from allowed list
          sa := input.review.object.spec.serviceAccountName
          allowed := input.parameters.allowedServiceAccounts
          not sa in allowed
          msg := sprintf("Service account %v is not allowed", [sa])
        }
        
        violation[{"msg": msg}] {
          # Limit maximum replicas for cost control
          replicas := input.review.object.spec.replicas
          max_replicas := input.parameters.maxReplicas
          replicas > max_replicas
          msg := sprintf("Replica count %v exceeds maximum of %v", [replicas, max_replicas])
        }
---
# Creator Economy Security Constraint
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: IA ChériescreatoreconomySecurity
metadata:
  name: creator-economy-security
  labels:
    app: opa-gatekeeper
    component: constraint
    business-unit: creator-economy
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["ainflue-platform"]
  parameters:
    requiredLabels:
      - "app"
      - "business-unit"
      - "security-level"
    allowedServiceAccounts:
      - "creator-platform-sa"
      - "ai-processor-sa"
      - "collaboration-sa"
      - "monetization-sa"
      - "api-gateway-sa"
    maxReplicas: 50
---
# ==============================================================================
# FALCO SECURITY MONITORING RULES
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-creator-economy-rules
  namespace: ainflue-platform
  labels:
    app: falco
    component: rules
    business-unit: creator-economy
data:
  creator_economy_rules.yaml: |
    # Creator Economy specific security rules
    
    # Rule: Detect privilege escalation attempts
    - rule: Creator Economy Privilege Escalation
      desc: Detect attempts to escalate privileges in Creator Economy workloads
      condition: >
        spawned_process and container and
        k8s_ns = "ainflue-platform" and
        (proc.name in (sudo, su, doas) or
         proc.args contains "privilege" or
         proc.args contains "escalate")
      output: >
        Privilege escalation attempt detected in Creator Economy workload
        (user=%user.name container=%container.name pod=%k8s.pod.name
         command=%proc.cmdline)
      priority: HIGH
      tags: [creator-economy, privilege-escalation, security]
    
    # Rule: Detect unauthorized network connections
    - rule: Creator Economy Unauthorized Network Connection
      desc: Detect unauthorized outbound network connections
      condition: >
        outbound and container and
        k8s_ns = "ainflue-platform" and
        not fd.sip in (creator_economy_allowed_ips) and
        not fd.sport in (80, 443, 53, 5432, 6379)
      output: >
        Unauthorized network connection from Creator Economy workload
        (container=%container.name pod=%k8s.pod.name dest=%fd.sip:%fd.sport
         command=%proc.cmdline)
      priority: MEDIUM
      tags: [creator-economy, network, unauthorized]
    
    # Rule: Detect file system modifications
    - rule: Creator Economy File System Modification
      desc: Detect unauthorized file system modifications
      condition: >
        open_write and container and
        k8s_ns = "ainflue-platform" and
        fd.typechar = 'f' and
        (fd.name startswith "/etc" or
         fd.name startswith "/usr/bin" or
         fd.name startswith "/bin")
      output: >
        Unauthorized file modification in Creator Economy workload
        (container=%container.name pod=%k8s.pod.name file=%fd.name
         command=%proc.cmdline)
      priority: HIGH
      tags: [creator-economy, filesystem, modification]
    
    # Rule: Detect crypto mining activities
    - rule: Creator Economy Crypto Mining Detection
      desc: Detect potential cryptocurrency mining activities
      condition: >
        spawned_process and container and
        k8s_ns = "ainflue-platform" and
        (proc.name in (xmrig, minerd, cpuminer, ethminer) or
         proc.args contains "mining" or
         proc.args contains "stratum" or
         proc.args contains "pool")
      output: >
        Potential crypto mining activity detected in Creator Economy workload
        (container=%container.name pod=%k8s.pod.name command=%proc.cmdline)
      priority: CRITICAL
      tags: [creator-economy, crypto-mining, security]
    
    # Rule: Detect payment processing anomalies
    - rule: Creator Economy Payment Processing Anomaly
      desc: Detect unusual payment processing activities
      condition: >
        spawned_process and container and
        k8s_pod_label_app = "monetization-service" and
        (proc.args contains "transfer" or
         proc.args contains "payment" or
         proc.args contains "transaction") and
        proc.args contains amount and
        not proc.pname in (payment_processor_binaries)
      output: >
        Unusual payment processing activity detected
        (container=%container.name pod=%k8s.pod.name command=%proc.cmdline)
      priority: HIGH
      tags: [creator-economy, monetization, anomaly]
    
    # List of allowed IPs for Creator Economy services
    - list: creator_economy_allowed_ips
      items: [
        "10.0.0.0/8",      # VPC CIDR
        "172.16.0.0/12",   # Docker networks
        "8.8.8.8",         # Google DNS
        "1.1.1.1",         # Cloudflare DNS
        "api.stripe.com",  # Payment processing
        "api.paypal.com",  # Payment processing
        "api.openai.com",  # AI services
        "huggingface.co"   # AI models
      ]
    
    # List of allowed payment processor binaries
    - list: payment_processor_binaries
      items: [
        "python3",
        "node",
        "stripe-cli",
        "paypal-processor"
      ]
---
# ==============================================================================
# IMAGE SECURITY POLICIES
# ==============================================================================

# Image Policy Webhook Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-security-policy
  namespace: ainflue-platform
  labels:
    app: image-security
    component: policy
    business-unit: creator-economy
data:
  policy.yaml: |
    # Creator Economy Image Security Policy
    apiVersion: v1alpha1
    kind: ImagePolicy
    metadata:
      name: creator-economy-image-policy
    spec:
      # Allowed registries
      allowedRegistries:
        - "ghcr.io/ainflue"
        - "docker.io/library"  # Official images only
        - "quay.io/prometheus"
        - "gcr.io/istio-release"
      
      # Denied registries
      deniedRegistries:
        - "docker.io/*"  # Block user images from Docker Hub
        - "*.ru"         # Block Russian registries
        - "*.cn"         # Block Chinese registries
      
      # Image signing requirements
      signingRequirements:
        - registry: "ghcr.io/ainflue"
          keyPath: "/etc/cosign/cosign.pub"
          required: true
      
      # Vulnerability scanning
      vulnerabilityPolicy:
        maxSeverity: "HIGH"
        allowedCVEs: []
        denyUnscanned: true
      
      # License compliance
      licensePolicy:
        allowedLicenses:
          - "MIT"
          - "Apache-2.0"
          - "BSD-3-Clause"
        deniedLicenses:
          - "GPL-3.0"
          - "AGPL-3.0"
      
      # Content trust
      contentTrust:
        enabled: true
        notaryURL: "https://notary.ainflue.com"
---
# ==============================================================================
# RUNTIME SECURITY
# ==============================================================================

# AppArmor Profile for Creator Economy Containers
apiVersion: v1
kind: ConfigMap
metadata:
  name: creator-economy-apparmor-profile
  namespace: ainflue-platform
  labels:
    app: apparmor
    component: profile
    business-unit: creator-economy
data:
  creator-economy-profile: |
    #include <tunables/global>
    
    profile creator-economy-profile flags=(attach_disconnected,mediate_deleted) {
      #include <abstractions/base>
      #include <abstractions/nameservice>
      #include <abstractions/openssl>
      
      # Allow network access
      network inet tcp,
      network inet udp,
      network inet6 tcp,
      network inet6 udp,
      
      # Allow file access (read-only for most paths)
      /usr/local/bin/python3 ix,
      /usr/bin/node ix,
      /app/** r,
      /tmp/** rw,
      /var/tmp/** rw,
      
      # Deny dangerous operations
      deny /proc/sys/kernel/** w,
      deny /sys/** w,
      deny mount,
      deny umount,
      deny pivot_root,
      deny chroot,
      
      # Creator Economy specific allowances
      /app/content/** rw,
      /app/uploads/** rw,
      /app/logs/** w,
      
      # AI processing specific
      /dev/nvidia* rw,
      /usr/local/cuda/** r,
      
      # Monetization service restrictions
      owner /app/monetization/secure/** rw,
      deny /app/monetization/keys/** w,
    }
---
