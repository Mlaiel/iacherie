# SECRET MANAGEMENT
# ==============================================================================

# External Secrets Operator Configuration
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: creator-economy-secret-store
  namespace: ainflue-platform
  labels:
    app: external-secrets
    component: secret-store
    business-unit: creator-economy
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
# External Secret for Database Credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: ainflue-platform
  labels:
    app: external-secrets
    component: database-credentials
    business-unit: creator-economy
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: creator-economy-secret-store
    kind: SecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        username: "{{ .username | toString }}"
        password: "{{ .password | toString }}"
        host: "{{ .host | toString }}"
        database: "{{ .database | toString }}"
  data:
  - secretKey: username
    remoteRef:
      key: ainflue/database/postgresql
      property: username
  - secretKey: password
    remoteRef:
      key: ainflue/database/postgresql
      property: password
  - secretKey: host
    remoteRef:
      key: ainflue/database/postgresql
      property: host
