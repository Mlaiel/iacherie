# ==============================================================================
# POD SECURITY POLICY
# ==============================================================================
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: ainflue-creator-economy-psp
  namespace: ainflue-platform
  labels:
    app: security-policy
    component: pod-security
    environment: production
    business-unit: creator-economy
  annotations:
    seccomp.security.alpha.kubernetes.io/allowedProfileNames: 'runtime/default'
    seccomp.security.alpha.kubernetes.io/defaultProfileName:  'runtime/default'
    apparmor.security.beta.kubernetes.io/allowedProfileNames: 'runtime/default'
    apparmor.security.beta.kubernetes.io/defaultProfileName:  'runtime/default'
spec:
  # Privilege and access controls
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  allowedCapabilities: []
  
  # Host controls
  hostNetwork: false
  hostIPC: false
  hostPID: false
  hostPorts: []
  
  # Volume controls
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
    - 'csi'
  allowedHostPaths: []
  
  # File system controls
  runAsUser:
    rule: 'MustRunAsNonRoot'
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 65535
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 65535
  
  # Read-only root filesystem
  readOnlyRootFilesystem: true
  
  # Security contexts
  allowedProcMountTypes:
    - Default
  
  # Runtime security
  runtimeClass:
    allowedRuntimeClassNames:
      - kata
      - gvisor
    defaultRuntimeClassName: kata
---
# ==============================================================================
# POD SECURITY STANDARDS (Pod Security Admission)
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: ainflue-platform
  labels:
    # Pod Security Standards enforcement
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Creator Economy labels
    business-unit: creator-economy
    security-level: enterprise
    compliance: gdpr
    data-classification: confidential
  annotations:
    # Security policies version
    pod-security.kubernetes.io/enforce-version: v1.28
    pod-security.kubernetes.io/audit-version: v1.28
    pod-security.kubernetes.io/warn-version: v1.28
---
# ==============================================================================
# RBAC CONFIGURATION
# ==============================================================================

# Cluster Role for Creator Economy Services
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ainflue-creator-economy-role
  labels:
    app: rbac
    component: cluster-role
    business-unit: creator-economy
rules:
# Pods permissions
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["get"]

# Services permissions
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]

# ConfigMaps and Secrets (limited)
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
  resourceNames: ["creator-platform-config", "ai-processor-config", "collaboration-config"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["creator-platform-secrets", "ai-processor-secrets"]

# Metrics access
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

# Custom Resource Definitions for Creator Economy
- apiGroups: ["ainflue.com"]
  resources: ["creators", "contents", "collaborations", "monetizations"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
# Service Account for Creator Platform
apiVersion: v1
kind: ServiceAccount
metadata:
  name: creator-platform-sa
  namespace: ainflue-platform
  labels:
    app: creator-platform
    component: service-account
    business-unit: creator-economy
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/IA ChériesPlatformRole
automountServiceAccountToken: true
---
# Cluster Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ainflue-creator-economy-binding
  labels:
    app: rbac
    component: cluster-role-binding
    business-unit: creator-economy
subjects:
- kind: ServiceAccount
  name: creator-platform-sa
  namespace: ainflue-platform
- kind: ServiceAccount
  name: ai-processor-sa
  namespace: ainflue-platform
- kind: ServiceAccount
  name: collaboration-sa
  namespace: ainflue-platform
- kind: ServiceAccount
  name: monetization-sa
  namespace: ainflue-platform
roleRef:
  kind: ClusterRole
  name: ainflue-creator-economy-role
  apiGroup: rbac.authorization.k8s.io
---
# Role for Monetization Service (Higher Privileges)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monetization-service-role
  namespace: ainflue-platform
  labels:
    app: rbac
    component: role
    service: monetization
    security-level: high
rules:
# Payment processing secrets access
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
  resourceNames: ["stripe-api-keys", "paypal-credentials", "square-credentials"]

# Payment audit logs
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]

# Service mesh configuration
- apiGroups: ["networking.istio.io"]
  resources: ["virtualservices", "destinationrules"]
  verbs: ["get", "list", "watch"]
---
# Service Account for Monetization Service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monetization-sa
  namespace: ainflue-platform
  labels:
    app: monetization-service
    component: service-account
    security-level: high
    compliance: pci-dss
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/IA ChériesPlatformMonetizationRole
automountServiceAccountToken: true
---
# Role Binding for Monetization Service
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monetization-service-binding
  namespace: ainflue-platform
  labels:
    app: rbac
    component: role-binding
    service: monetization
subjects:
- kind: ServiceAccount
  name: monetization-sa
  namespace: ainflue-platform
roleRef:
  kind: Role
  name: monetization-service-role
  apiGroup: rbac.authorization.k8s.io
---
# ==============================================================================
# NETWORK SECURITY POLICIES
# ==============================================================================

# Default Deny All Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ainflue-platform
  labels:
    app: network-policy
    component: default-deny
    security-level: enterprise
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Creator Platform Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: creator-platform-netpol
  namespace: ainflue-platform
  labels:
    app: network-policy
    component: creator-platform
    business-unit: creator-economy
spec:
  podSelector:
    matchLabels:
      app: creator-platform
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow traffic from API Gateway
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8000
  
  # Allow traffic from Load Balancer
  - from:
    - namespaceSelector:
        matchLabels:
          name: istio-system
    ports:
    - protocol: TCP
      port: 8000
  
  # Allow metrics collection
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  
  egress:
  # Allow connection to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432
  
  # Allow connection to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  
  # Allow connection to AI Processing Service
  - to:
    - podSelector:
        matchLabels:
          app: ai-processor
    ports:
    - protocol: TCP
      port: 8000
  
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  
  # Allow HTTPS to external services
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# AI Processing Network Policy (Restricted)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-processor-netpol
  namespace: ainflue-platform
  labels:
    app: network-policy
    component: ai-processor
    security-level: high
spec:
  podSelector:
    matchLabels:
      app: ai-processor
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Only allow traffic from Creator Platform
  - from:
    - podSelector:
        matchLabels:
          app: creator-platform
    ports:
    - protocol: TCP
      port: 8000
  
  # Allow metrics collection
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  
  egress:
  # Allow connection to AI model storage
  - to:
    - podSelector:
        matchLabels:
          app: model-storage
    ports:
    - protocol: TCP
      port: 9000  # MinIO/S3
  
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  
  # Allow HTTPS to AI services (HuggingFace, OpenAI, etc.)
  - to: []
    ports:
    - protocol: TCP
      port: 443
---
# Monetization Service Network Policy (Highest Security)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monetization-service-netpol
  namespace: ainflue-platform
  labels:
    app: network-policy
    component: monetization
    security-level: critical
    compliance: pci-dss
spec:
  podSelector:
    matchLabels:
      app: monetization-service
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Only allow traffic from Creator Platform with specific source
  - from:
    - podSelector:
        matchLabels:
          app: creator-platform
    - namespaceSelector:
        matchLabels:
          name: istio-system
    ports:
    - protocol: TCP
      port: 8000
  
  egress:
  # Allow connection to PostgreSQL for transaction logs
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432
  
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  
  # Allow HTTPS to payment providers (Stripe, PayPal, etc.)
  - to: []
    ports:
    - protocol: TCP
      port: 443
    # Restrict to known payment provider IPs
    namespaceSelector: {}
---
