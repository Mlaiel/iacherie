# 🎨 Creator Content Processor Security
apiVersion: v1
kind: Pod
metadata:
  name: ainflue-content-processor-example
  namespace: ainflue-production
  labels:
    app: ainflue-content-processor
    security-level: restricted
  annotations:
    seccomp.security.alpha.kubernetes.io/pod: "localhost/ainflue-default"
    apparmor.security.beta.kubernetes.io/container.content-processor: "localhost/ainflue-default"
spec:
  serviceAccountName: ainflue-restricted-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: Localhost
      localhostProfile: ainflue-default.json
  containers:
  - name: content-processor
    image: ainflue.azurecr.io/content-processor:v1.2.3
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 1Gi
      limits:
        cpu: 2
        memory: 4Gi
        ephemeral-storage: 2Gi
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: config
      mountPath: /app/config
      readOnly: true
    env:
    - name: PROCESSING_MODE
      value: "secure"
    - name: SECURITY_LEVEL
      value: "high"
  volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 1Gi
  - name: config
    configMap:
      name: content-processor-config
  automountServiceAccountToken: false
  enableServiceLinks: false

