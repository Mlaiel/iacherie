  name: ainflue-restricted-sa
  namespace: ainflue-production
- kind: ServiceAccount
  name: ainflue-api
  namespace: ainflue-production
- kind: ServiceAccount
  name: ainflue-frontend
  namespace: ainflue-production
- kind: ServiceAccount
