# 🔒 ADMISSION CONTROLLERS CONFIGURATION
# ===================================================================

# 🛡️ Pod Security Admission Controller
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-security-webhook-config
  namespace: kube-system
data:
  config.yaml: |
    # Pod Security Admission Configuration
    apiVersion: apiserver.config.k8s.io/v1
    kind: AdmissionConfiguration
    plugins:
    - name: PodSecurity
      configuration:
        apiVersion: pod-security.admission.config.k8s.io/v1beta1
        kind: PodSecurityConfiguration
        defaults:
          enforce: "baseline"
          enforce-version: "v1.29"
          audit: "restricted"
          audit-version: "v1.29"
          warn: "restricted"
          warn-version: "v1.29"
        exemptions:
          usernames: []
          runtimeClasses: []
          namespaces: ["kube-system", "kube-public", "kube-node-lease"]
---
# 🔐 ValidatingAdmissionWebhook for Custom Policies
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionWebhook
metadata:
  name: ainflue-pod-security-webhook
webhooks:
- name: pod-security.ainflue.com
  clientConfig:
    service:
      name: ainflue-pod-security-webhook
      namespace: ainflue-system
      path: "/validate"
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
  admissionReviewVersions: ["v1", "v1beta1"]
  sideEffects: None
  failurePolicy: Fail
  namespaceSelector:
    matchLabels:
      pod-security-webhook: enabled

