# 🛡️ Global Pod Security Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: global-pod-security-config
  namespace: ainflue-system
  labels:
    app: pod-security
    component: global-config
data:
  pod-security.yaml: |
    # Global Pod Security Configuration
    podSecurity:
      # Security Standards
      standards:
        default: "restricted"    # restricted, baseline, privileged
        enforcement: "enforce"   # enforce, audit, warn
        version: "v1.29"
        exemptions:
          usernames: ["system:serviceaccount:kube-system:*"]
          runtimeClasses: ["gvisor", "kata"]
          namespaces: ["kube-system", "istio-system", "monitoring"]
      
      # Security Contexts
      securityContexts:
        runAsNonRoot: true
        runAsUser: 65534  # nobody user
        runAsGroup: 65534
        fsGroup: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: []  # No capabilities by default
        seccompProfile:
          type: "RuntimeDefault"
        seLinuxOptions:
          level: "s0:c123,c456"
      
      # Resource Management
      resources:
        limits:
          cpu: "1000m"
          memory: "1Gi"
          ephemeral-storage: "2Gi"
        requests:
          cpu: "100m"
          memory: "128Mi"
          ephemeral-storage: "1Gi"
        quotas:
          enabled: true
          defaultCpuLimit: "2"
          defaultMemoryLimit: "2Gi"
          defaultStorageLimit: "10Gi"
      
      # Network Security
      network:
        hostNetwork: false
        hostPID: false
        hostIPC: false
        hostPorts:
          min: 0
          max: 0  # No host ports allowed
        dnsPolicy: "ClusterFirst"
        dnsConfig:
          options:
            - name: "ndots"
              value: "2"
            - name: "edns0"
      
      # Volume Security
      volumes:
        allowed:
          - "configMap"
          - "downwardAPI"
          - "emptyDir"
          - "persistentVolumeClaim"
          - "projected"
          - "secret"
        forbidden:
          - "hostPath"
          - "nfs"
          - "glusterfs"
          - "rbd"
          - "flexVolume"
        hostPathAllowed: []  # No host paths allowed
        readOnlyRootFilesystem: true
      
      # Service Account Security
      serviceAccount:
        automountToken: false
        tokenProjection: true
        tokenExpirationSeconds: 3600
        tokenAudiences: ["https://kubernetes.default.svc"]
---
# 🔒 Restricted Pod Security Policy
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: ainflue-restricted-psp
  namespace: ainflue-production
  labels:
    security-level: restricted
    policy-type: production
  annotations:
    seccomp.security.alpha.kubernetes.io/allowedProfileNames: 'runtime/default'
    seccomp.security.alpha.kubernetes.io/defaultProfileName: 'runtime/default'
    apparmor.security.beta.kubernetes.io/allowedProfileNames: 'runtime/default'
    apparmor.security.beta.kubernetes.io/defaultProfileName: 'runtime/default'
spec:
  # Privilege and Access Controls
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  allowedCapabilities: []
  defaultAddCapabilities: []
  
  # Users and Groups
  runAsUser:
    rule: 'MustRunAsNonRoot'
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 65535
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 65535
  
  # Host Controls
  hostNetwork: false
  hostIPC: false
  hostPID: false
  hostPorts: []
  
  # Volume Controls
  volumes:
    - 'configMap'
    - 'downwardAPI'
    - 'emptyDir'
    - 'persistentVolumeClaim'
    - 'projected'
    - 'secret'
  allowedHostPaths: []
  
  # File System
  readOnlyRootFilesystem: true
  
  # SELinux
  seLinux:
    rule: 'MustRunAs'
    seLinuxOptions:
      level: 's0:c123,c456'
  
  # Runtime
  runtimeClass:
    allowedRuntimeClassNames: ['gvisor', 'kata-containers']
    defaultRuntimeClassName: 'gvisor'
  
  # Forbidden syscalls
  forbiddenSysctls:
    - '*'
  allowedUnsafeSysctls: []
---
# 🎯 Application Pod Security Policy
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: ainflue-application-psp
  namespace: ainflue-production
  labels:
    security-level: baseline
    policy-type: application
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  allowedCapabilities:
    - NET_BIND_SERVICE  # Allow binding to ports < 1024
  defaultAddCapabilities: []
  
  runAsUser:
    rule: 'MustRunAsNonRoot'
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 65535
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 65535
  
  hostNetwork: false
  hostIPC: false
  hostPID: false
  hostPorts:
    - min: 8080
      max: 8080
  
  volumes:
    - 'configMap'
    - 'downwardAPI'
    - 'emptyDir'
    - 'persistentVolumeClaim'
    - 'projected'
    - 'secret'
  
  readOnlyRootFilesystem: true
  
  seLinux:
    rule: 'RunAsAny'
---
# 🔐 Database Pod Security Policy
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: ainflue-database-psp
  namespace: ainflue-database
  labels:
    security-level: baseline
    policy-type: database
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  allowedCapabilities:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
  
  runAsUser:
    rule: 'MustRunAs'
    ranges:
      - min: 999    # postgres user
        max: 999
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 999
        max: 999
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 999
        max: 999
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 999
        max: 999
  
  hostNetwork: false
  hostIPC: false
  hostPID: false
  hostPorts: []
  
  volumes:
    - 'configMap'
    - 'downwardAPI'
    - 'emptyDir'
    - 'persistentVolumeClaim'
    - 'projected'
    - 'secret'
  
  readOnlyRootFilesystem: false  # Database needs write access
  
  seLinux:
    rule: 'RunAsAny'
---
# 🛡️ Monitoring Pod Security Policy
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: ainflue-monitoring-psp
  namespace: monitoring
  labels:
    security-level: baseline
    policy-type: monitoring
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  allowedCapabilities:
    - NET_BIND_SERVICE
    - SYS_TIME  # For time-series databases
  
  runAsUser:
    rule: 'RunAsAny'
  runAsGroup:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  
  hostNetwork: false
  hostIPC: false
  hostPID: false
  hostPorts:
    - min: 9090
      max: 9100
  
  volumes:
    - 'configMap'
    - 'downwardAPI'
    - 'emptyDir'
    - 'persistentVolumeClaim'
    - 'projected'
    - 'secret'
    - 'hostPath'  # Limited hostPath for node metrics
  
  allowedHostPaths:
    - pathPrefix: "/proc"
      readOnly: true
    - pathPrefix: "/sys"
      readOnly: true
    - pathPrefix: "/var/run/docker.sock"
      readOnly: true
  
  readOnlyRootFilesystem: false
  
  seLinux:
    rule: 'RunAsAny'

