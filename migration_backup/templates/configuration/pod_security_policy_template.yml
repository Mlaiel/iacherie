# 🔐 AppArmor Profiles
apiVersion: v1
kind: ConfigMap
metadata:
  name: ainflue-apparmor-profiles
  namespace: ainflue-system
data:
  ainflue-default: |
    #include <tunables/global>
    
    profile ainflue-default flags=(attach_disconnected,mediate_deleted) {
      #include <abstractions/base>
      
      # Network access
      network inet tcp,
      network inet udp,
      network inet6 tcp,
      network inet6 udp,
      
      # File access
      /usr/bin/** mr,
      /usr/lib/** mr,
      /lib/** mr,
      /etc/ssl/certs/** r,
      /etc/ca-certificates/** r,
      
      # Application directory
      /app/** mr,
      
      # Temporary files
      /tmp/** rw,
      /var/tmp/** rw,
      
      # Deny dangerous operations
      deny /proc/sys/** w,
      deny /sys/** w,
      deny /dev/** w,
      deny capability sys_admin,
      deny capability sys_module,
      deny capability dac_override,
      deny capability dac_read_search,
      deny mount,
      deny umount,
      deny pivot_root,
      deny @{PROC}/sys/kernel/core_pattern w,
      deny @{PROC}/sysrq-trigger w,
      deny @{PROC}/mem r,
      deny @{PROC}/kmem r,
    }

