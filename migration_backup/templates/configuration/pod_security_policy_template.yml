# 📊 Falco Rules for Pod Security
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-pod-security-rules
  namespace: falco-system
data:
  pod_security_rules.yaml: |
    # Falco Rules for Pod Security Monitoring
    - rule: Privilege Escalation Attempt
      desc: Detect attempts to escalate privileges
      condition: >
        spawned_process and
        (proc.args contains "sudo" or
         proc.args contains "su" or
         proc.args contains "chmod +s")
      output: >
        Privilege escalation attempt detected
        (user=%user.name command=%proc.cmdline container=%container.name)
      priority: WARNING
      tags: [privilege_escalation, security]
    
    - rule: Unauthorized Capability Usage
      desc: Detect use of unauthorized capabilities
      condition: >
        spawned_process and
        proc.name in (ping, ping6) and
        not container.privileged=true
      output: >
        Unauthorized capability usage detected
        (user=%user.name command=%proc.cmdline container=%container.name)
      priority: WARNING
      tags: [capabilities, security]
    
    - rule: Suspicious Container Activity
      desc: Detect suspicious activity in containers
      condition: >
        spawned_process and
        (proc.name in (nc, netcat, ncat, nmap, telnet, socat) or
         proc.args contains "/dev/tcp/")
      output: >
        Suspicious network activity in container
        (user=%user.name command=%proc.cmdline container=%container.name)
      priority: WARNING
      tags: [network, security]
    
    - rule: Container Escape Attempt
      desc: Detect attempts to escape containers
      condition: >
        spawned_process and
        (proc.args contains "docker" or
         proc.args contains "runc" or
         proc.args contains "kubectl" or
         proc.args contains "/var/run/docker.sock")
      output: >
        Container escape attempt detected
        (user=%user.name command=%proc.cmdline container=%container.name)
      priority: CRITICAL
      tags: [container_escape, security]
---
# 🚨 Pod Security Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-security-alerts
  namespace: ainflue-system
spec:
  groups:
  - name: pod.security
    rules:
    - alert: PodSecurityPolicyViolation
      expr: |
        increase(pod_security_policy_violations_total[5m]) > 0
      for: 0m
      labels:
        severity: critical
        category: pod-security
      annotations:
        summary: "Pod Security Policy violation detected"
        description: "{{ $value }} PSP violations detected in the last 5 minutes"
    
    - alert: PrivilegedPodCreated
      expr: |
        increase(kube_pod_container_status_running{container_security_context_privileged="true"}[5m]) > 0
      for: 0m
      labels:
        severity: critical
        category: pod-security
      annotations:
        summary: "Privileged pod created"
        description: "A privileged pod has been created in namespace {{ $labels.namespace }}"
    
    - alert: PodWithHostNetworkCreated
      expr: |
        increase(kube_pod_spec_host_network{host_network="true"}[5m]) > 0
      for: 0m
      labels:
        severity: warning
        category: pod-security
      annotations:
        summary: "Pod with host network created"
        description: "A pod with host network access has been created in namespace {{ $labels.namespace }}"

