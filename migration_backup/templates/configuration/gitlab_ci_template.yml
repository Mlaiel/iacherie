# GitLab CI/CD Pipeline Template for IA Chéries Platform
# Comprehensive CI/CD configuration for multi-service creator economy platform

# Global configuration
variables:
  # Docker configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1
  
  # Application configuration
  APP_NAME: "ainflue"
  REGISTRY: "${CI_REGISTRY}"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  
  # Environment configuration
  STAGING_CLUSTER: "ainflue-staging"
  PRODUCTION_CLUSTER: "ainflue-production"
  
  # Security scanning
  SECURITY_SCAN_ENABLED: "true"
  VULNERABILITY_THRESHOLD: "HIGH"
  
  # Testing configuration
  COVERAGE_THRESHOLD: "80"
  E2E_TESTS_ENABLED: "true"
  
  # Performance testing
  LOAD_TEST_ENABLED: "true"
  PERFORMANCE_THRESHOLD: "2000" # milliseconds

# Pipeline stages
stages:
  - validate
  - build
  - test
  - security
  - package
  - deploy-staging
  - integration-tests
  - performance-tests
  - deploy-production
  - monitoring

# Job templates
.node_template: &node_template
  image: node:18-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci --production=false

.docker_template: &docker_template
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_TLS_CERTDIR: "/certs"

.kubectl_template: &kubectl_template
  image: bitnami/kubectl:latest
  before_script:
    - echo $KUBE_CONFIG | base64 -d > ~/.kube/config
    - kubectl version --client

# Validation Stage
validate-code:
  stage: validate
  <<: *node_template
  script:
    - npm run lint
    - npm run type-check
    - npm run format:check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate-terraform:
  stage: validate
  image: hashicorp/terraform:1.6
  script:
    - cd infrastructure/
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - changes:
        - "infrastructure/**/*"

validate-kubernetes:
  stage: validate
  image: alpine/k8s:1.28.2
  script:
    - cd kubernetes/
    - for file in *.yaml; do kubectl --dry-run=client apply -f $file; done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - changes:
        - "kubernetes/**/*"

# Build Stage
build-api:
  stage: build
  <<: *node_template
  script:
    - cd services/api/
    - npm run build
    - npm run test:unit
  artifacts:
    paths:
      - services/api/dist/
      - services/api/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/api/coverage/cobertura-coverage.xml
    expire_in: 1 day
  coverage: '/Statements\s*:\s*([^%]+)/'

build-web:
  stage: build
  <<: *node_template
  script:
    - cd services/web/
    - npm run build
    - npm run test:unit
  artifacts:
    paths:
      - services/web/dist/
      - services/web/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/web/coverage/cobertura-coverage.xml
    expire_in: 1 day

build-ml-service:
  stage: build
  image: python:3.11-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r services/ml/requirements.txt
  script:
    - cd services/ml/
    - python -m pytest tests/ --cov=src --cov-report=xml
    - python -m black --check src/
    - python -m flake8 src/
  artifacts:
    paths:
      - services/ml/src/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: services/ml/coverage.xml
    expire_in: 1 day

# Testing Stage
test-integration:
  stage: test
  <<: *node_template
  services:
    - postgres:13
    - redis:7-alpine
  variables:
    POSTGRES_DB: ainflue_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/ainflue_test
  script:
    - npm run test:integration
  artifacts:
    reports:
      junit: test-results.xml
    expire_in: 1 day

test-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-focal
  services:
    - postgres:13
    - redis:7-alpine
  variables:
    POSTGRES_DB: ainflue_e2e
    POSTGRES_USER: e2e_user
    POSTGRES_PASSWORD: e2e_password
    DATABASE_URL: postgresql://e2e_user:e2e_password@postgres:5432/ainflue_e2e
  script:
    - npm run start:test &
    - sleep 30
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - e2e-results/
      - playwright-report/
    expire_in: 1 week
  rules:
    - if: $E2E_TESTS_ENABLED == "true"

# Security Stage
security-scan-dependencies:
  stage: security
  <<: *node_template
  script:
    - npm audit --audit-level high
    - npm run security:check
  allow_failure: true

security-scan-containers:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --security-checks vuln --format template --template "@contrib/sarif.tpl" -o security-report.sarif .
  artifacts:
    reports:
      sast: security-report.sarif
    expire_in: 1 week
  rules:
    - if: $SECURITY_SCAN_ENABLED == "true"

secret-detection:
  stage: security
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --verbose --source . --report-format sarif --report-path gitleaks-report.sarif
  artifacts:
    reports:
      secret_detection: gitleaks-report.sarif
    expire_in: 1 week

# Package Stage
package-api:
  stage: package
  <<: *docker_template
  dependencies:
    - build-api
  script:
    - cd services/api/
    - docker build -t ${REGISTRY}/ainflue-api:${IMAGE_TAG} .
    - docker push ${REGISTRY}/ainflue-api:${IMAGE_TAG}
    - docker tag ${REGISTRY}/ainflue-api:${IMAGE_TAG} ${REGISTRY}/ainflue-api:latest
    - docker push ${REGISTRY}/ainflue-api:latest

package-web:
  stage: package
  <<: *docker_template
  dependencies:
    - build-web
  script:
    - cd services/web/
    - docker build -t ${REGISTRY}/ainflue-web:${IMAGE_TAG} .
    - docker push ${REGISTRY}/ainflue-web:${IMAGE_TAG}
    - docker tag ${REGISTRY}/ainflue-web:${IMAGE_TAG} ${REGISTRY}/ainflue-web:latest
    - docker push ${REGISTRY}/ainflue-web:latest

package-ml-service:
  stage: package
  <<: *docker_template
  dependencies:
    - build-ml-service
  script:
    - cd services/ml/
    - docker build -t ${REGISTRY}/ainflue-ml:${IMAGE_TAG} .
    - docker push ${REGISTRY}/ainflue-ml:${IMAGE_TAG}
    - docker tag ${REGISTRY}/ainflue-ml:${IMAGE_TAG} ${REGISTRY}/ainflue-ml:latest
    - docker push ${REGISTRY}/ainflue-ml:latest

# Staging Deployment
deploy-staging:
  stage: deploy-staging
  <<: *kubectl_template
  environment:
    name: staging
    url: https://staging.ainflue.com
  script:
    - kubectl config use-context ${STAGING_CLUSTER}
    - |
      for service in api web ml; do
        kubectl set image deployment/ainflue-${service} \
          ainflue-${service}=${REGISTRY}/ainflue-${service}:${IMAGE_TAG} \
          --namespace=staging
        kubectl rollout status deployment/ainflue-${service} --namespace=staging --timeout=300s
      done
    - kubectl get pods --namespace=staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Integration Tests on Staging
integration-tests-staging:
  stage: integration-tests
  <<: *node_template
  environment:
    name: staging
  variables:
    API_BASE_URL: "https://api.staging.ainflue.com"
    WEB_BASE_URL: "https://staging.ainflue.com"
  script:
    - npm run test:staging
  artifacts:
    reports:
      junit: staging-test-results.xml
    expire_in: 1 day

# Performance Tests
performance-tests:
  stage: performance-tests
  image: grafana/k6:latest
  environment:
    name: staging
  variables:
    API_BASE_URL: "https://api.staging.ainflue.com"
  script:
    - k6 run --vus 50 --duration 5m performance/load-test.js
    - k6 run --vus 100 --duration 2m performance/stress-test.js
  artifacts:
    reports:
      performance: performance-results.json
    expire_in: 1 week
  rules:
    - if: $LOAD_TEST_ENABLED == "true"

# Production Deployment
deploy-production:
  stage: deploy-production
  <<: *kubectl_template
  environment:
    name: production
    url: https://app.ainflue.com
  script:
    - kubectl config use-context ${PRODUCTION_CLUSTER}
    - |
      for service in api web ml; do
        kubectl set image deployment/ainflue-${service} \
          ainflue-${service}=${REGISTRY}/ainflue-${service}:${IMAGE_TAG} \
          --namespace=production
        kubectl rollout status deployment/ainflue-${service} --namespace=production --timeout=600s
      done
    - kubectl get pods --namespace=production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: false

# Database Migration
database-migration:
  stage: deploy-production
  image: postgres:13
  environment:
    name: production
  variables:
    PGPASSWORD: $PRODUCTION_DB_PASSWORD
  script:
    - psql -h $PRODUCTION_DB_HOST -U $PRODUCTION_DB_USER -d $PRODUCTION_DB_NAME -f migrations/latest.sql
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: false
    - changes:
        - "migrations/**/*"

# Monitoring Setup
setup-monitoring:
  stage: monitoring
  <<: *kubectl_template
  environment:
    name: production
  script:
    - kubectl apply -f monitoring/grafana-dashboard.yaml --namespace=monitoring
    - kubectl apply -f monitoring/prometheus-rules.yaml --namespace=monitoring
    - kubectl apply -f monitoring/alertmanager-config.yaml --namespace=monitoring
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - "monitoring/**/*"

# Smoke Tests Production
smoke-tests-production:
  stage: monitoring
  <<: *node_template
  environment:
    name: production
  variables:
    API_BASE_URL: "https://api.ainflue.com"
    WEB_BASE_URL: "https://app.ainflue.com"
  script:
    - npm run test:smoke
  artifacts:
    reports:
      junit: smoke-test-results.xml
    expire_in: 1 day

# Cleanup
cleanup-staging:
  stage: monitoring
  <<: *kubectl_template
  environment:
    name: staging
  script:
    - kubectl delete deployment --selector=app=ainflue,environment=review --namespace=staging
    - kubectl delete service --selector=app=ainflue,environment=review --namespace=staging
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: manual
      allow_failure: true

# Notifications
notify-success:
  stage: monitoring
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -X POST \
        -H "Content-Type: application/json" \
        -d "{
          \"text\": \"✅ IA Chéries deployment to production successful!\",
          \"attachments\": [{
            \"color\": \"good\",
            \"fields\": [
              {\"title\": \"Commit\", \"value\": \"${CI_COMMIT_SHORT_SHA}\", \"short\": true},
              {\"title\": \"Branch\", \"value\": \"${CI_COMMIT_BRANCH}\", \"short\": true},
              {\"title\": \"Author\", \"value\": \"${CI_COMMIT_AUTHOR}\", \"short\": true},
              {\"title\": \"Pipeline\", \"value\": \"${CI_PIPELINE_URL}\", \"short\": true}
            ]
          }]
        }" \
        $SLACK_WEBHOOK_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: on_success

notify-failure:
  stage: monitoring
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -X POST \
        -H "Content-Type: application/json" \
        -d "{
          \"text\": \"❌ IA Chéries pipeline failed!\",
          \"attachments\": [{
            \"color\": \"danger\",
            \"fields\": [
              {\"title\": \"Commit\", \"value\": \"${CI_COMMIT_SHORT_SHA}\", \"short\": true},
              {\"title\": \"Branch\", \"value\": \"${CI_COMMIT_BRANCH}\", \"short\": true},
              {\"title\": \"Author\", \"value\": \"${CI_COMMIT_AUTHOR}\", \"short\": true},
              {\"title\": \"Pipeline\", \"value\": \"${CI_PIPELINE_URL}\", \"short\": true}
            ]
          }]
        }" \
        $SLACK_WEBHOOK_URL
  rules:
    - when: on_failure

# Include additional pipeline configurations
include:
  - local: 'ci/security-scanning.yml'
  - local: 'ci/dependency-updates.yml'
  - local: 'ci/feature-branch-deploy.yml'
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml