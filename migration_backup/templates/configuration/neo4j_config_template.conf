# Neo4j Backup and Monitoring

#!/bin/bash
# Neo4j backup script
BACKUP_DIR="/backups/neo4j/$(date +%Y%m%d_%H%M%S)"
mkdir -p $BACKUP_DIR

# Stop Neo4j for consistent backup
systemctl stop neo4j

# Create backup
neo4j-admin backup --backup-dir=$BACKUP_DIR --name=ainflue-backup

# Restart Neo4j
systemctl start neo4j

# Compress backup
tar -czf $BACKUP_DIR.tar.gz $BACKUP_DIR

# Upload to S3
aws s3 cp $BACKUP_DIR.tar.gz s3://ainflue-db-backups/neo4j/

# Clean up
rm -rf $BACKUP_DIR
rm $BACKUP_DIR.tar.gz

echo "Neo4j backup completed"

# Performance monitoring queries
# Check active transactions
CALL dbms.listTransactions();

# Check running queries
CALL dbms.listQueries();

# Database statistics
CALL db.stats();

# Index usage
CALL db.indexes();

# Memory usage
CALL dbms.queryJmx('org.neo4j:instance=kernel#0,name=Memory Pools') 
YIELD attributes 
RETURN keys(attributes) as MemoryPool, attributes;

---
# Neo4j User Management

# Create admin user
CALL dbms.security.createUser('ainflue_admin', '${NEO4J_ADMIN_PASSWORD}', false);
CALL dbms.security.addRoleToUser('admin', 'ainflue_admin');

# Create application user
CALL dbms.security.createUser('ainflue_app', '${NEO4J_APP_PASSWORD}', false);
CALL dbms.security.createRole('ainflue_app_role');
CALL dbms.security.grantRoleToUser('ainflue_app_role', 'ainflue_app');

# Grant permissions to application user
CALL dbms.security.grantWriteOnDatabase('ainflue', 'ainflue_app_role');
CALL dbms.security.grantReadOnDatabase('ainflue', 'ainflue_app_role');

# Create read-only user for analytics
CALL dbms.security.createUser('ainflue_readonly', '${NEO4J_READONLY_PASSWORD}', false);
CALL dbms.security.createRole('ainflue_readonly_role');
CALL dbms.security.grantRoleToUser('ainflue_readonly_role', 'ainflue_readonly');
CALL dbms.security.grantReadOnDatabase('ainflue', 'ainflue_readonly_role');

---
# Graph Data Science Algorithms for Ainflue

# Install Graph Data Science library
# Download from https://neo4j.com/graph-data-science-library/

# Create graph projection for analysis
CALL gds.graph.project(
  'ainflue-social-network',
  ['Creator', 'Brand', 'Campaign'],
  {
    FOLLOWS: {orientation: 'NATURAL'},
    COLLABORATES_WITH: {orientation: 'UNDIRECTED'},
    PARTICIPATES_IN: {orientation: 'NATURAL'}
  }
);

# PageRank to find influential creators
CALL gds.pageRank.stream('ainflue-social-network')
YIELD nodeId, score
MATCH (c:Creator) WHERE id(c) = nodeId
RETURN c.username, c.followerCount, score
ORDER BY score DESC
LIMIT 20;

# Community detection to find creator clusters
CALL gds.louvain.stream('ainflue-social-network')
YIELD nodeId, communityId
MATCH (c:Creator) WHERE id(c) = nodeId
RETURN communityId, collect(c.username) as creators, count(*) as size
ORDER BY size DESC;

# Centrality analysis for brand influence
CALL gds.betweenness.stream('ainflue-social-network')
YIELD nodeId, score
MATCH (b:Brand) WHERE id(b) = nodeId
RETURN b.companyName, score
ORDER BY score DESC;

# Similarity algorithm for creator recommendations
CALL gds.nodeSimilarity.stream('ainflue-social-network')
YIELD node1, node2, similarity
MATCH (c1:Creator) WHERE id(c1) = node1
MATCH (c2:Creator) WHERE id(c2) = node2
RETURN c1.username, c2.username, similarity
ORDER BY similarity DESC
LIMIT 50;