# Neo4j Configuration Template for Ainflue Platform
# Graph database for relationship mapping and social network analysis

#*****************************************************************
# Neo4j configuration for Ainflue Creator Economy Platform
#*****************************************************************

# The name of the default database
dbms.default_database=ainflue

# Databases location
dbms.directories.data=/var/lib/neo4j/data
dbms.directories.plugins=/var/lib/neo4j/plugins
dbms.directories.logs=/var/log/neo4j
dbms.directories.lib=/usr/share/neo4j/lib
dbms.directories.run=/var/run/neo4j

# This setting constrains all `LOAD CSV` import files to be under the `import` directory
dbms.directories.import=/var/lib/neo4j/import

# Whether requests to Neo4j are authenticated
dbms.security.auth_enabled=true

# Enable this to be able to upgrade a store from an older version
dbms.allow_upgrade=true

#*****************************************************************
# Network connector configuration
#*****************************************************************

# Bolt connector
dbms.connector.bolt.enabled=true
dbms.connector.bolt.tls_level=OPTIONAL
dbms.connector.bolt.listen_address=0.0.0.0:7687
dbms.connector.bolt.advertised_address=:7687

# HTTP Connector
dbms.connector.http.enabled=true
dbms.connector.http.listen_address=0.0.0.0:7474
dbms.connector.http.advertised_address=:7474

# HTTPS Connector
dbms.connector.https.enabled=true
dbms.connector.https.listen_address=0.0.0.0:7473
dbms.connector.https.advertised_address=:7473

# Number of Neo4j worker threads
dbms.threads.worker_count=

#*****************************************************************
# SSL system configuration
#*****************************************************************

# Names of the SSL policies to be used for the respective components
dbms.ssl.policy.bolt.enabled=true
dbms.ssl.policy.bolt.base_directory=/var/lib/neo4j/certificates/bolt
dbms.ssl.policy.bolt.private_key=private.key
dbms.ssl.policy.bolt.public_certificate=public.crt
dbms.ssl.policy.bolt.trusted_dir=trusted
dbms.ssl.policy.bolt.client_auth=NONE

dbms.ssl.policy.https.enabled=true
dbms.ssl.policy.https.base_directory=/var/lib/neo4j/certificates/https
dbms.ssl.policy.https.private_key=private.key
dbms.ssl.policy.https.public_certificate=public.crt
dbms.ssl.policy.https.trusted_dir=trusted
dbms.ssl.policy.https.client_auth=NONE

#*****************************************************************
# Memory Settings
#*****************************************************************

# Initial heap size (Xms)
dbms.memory.heap.initial_size=2g

# Maximum heap size (Xmx)
dbms.memory.heap.max_size=4g

# The amount of memory to use for mapping the store files
dbms.memory.pagecache.size=2g

# Transaction state memory allocation
dbms.memory.transaction.global_max_size=1g
dbms.memory.transaction.database_max_size=512m

#*****************************************************************
# Network Settings
#*****************************************************************

# Bolt server unencrypted
dbms.connector.bolt.enabled=true
dbms.connector.bolt.listen_address=0.0.0.0:7687

# Bolt server encrypted
dbms.connector.bolt.tls_level=OPTIONAL

# HTTP server
dbms.connector.http.enabled=true
dbms.connector.http.listen_address=0.0.0.0:7474

# HTTPS server
dbms.connector.https.enabled=true
dbms.connector.https.listen_address=0.0.0.0:7473

# Number of threads to keep in the thread pool for handling HTTP requests
dbms.threads.worker_count=4

#*****************************************************************
# Logging Configuration
#*****************************************************************

# Enable query logging
dbms.logs.query.enabled=true
dbms.logs.query.threshold=0
dbms.logs.query.parameter_logging_enabled=true
dbms.logs.query.time_logging_enabled=true
dbms.logs.query.allocation_logging_enabled=true
dbms.logs.query.page_logging_enabled=true

# Security event logging
dbms.logs.security.level=INFO

# Server logs
dbms.logs.debug.level=INFO

#*****************************************************************
# Performance Settings
#*****************************************************************

# Relationship cache settings
dbms.relationship_grouping_threshold=100

# Index settings
dbms.index_sampling.background_enabled=true
dbms.index_sampling.sample_size_limit=1000000

# Query cache settings
dbms.query_cache_size=1000

# Transaction timeout
dbms.transaction.timeout=60s
dbms.transaction.bookmark_ready_timeout=30s

# Maximum number of concurrent transactions
dbms.transaction.concurrent.maximum=1000

# Cypher runtime
cypher.default_language_version=4

# Query execution
cypher.forbid_exhaustive_shortestpath=false
cypher.forbid_shortestpath_common_nodes=true

# Memory pool settings
dbms.memory.transaction.max_size=512m

#*****************************************************************
# Security Configuration
#*****************************************************************

# Require authorization for all access
dbms.security.auth_enabled=true

# Procedures that are allowed to be called
dbms.security.procedures.unrestricted=apoc.*,algo.*

# Configure SSL policy for cluster communication
causal_clustering.ssl_policy=cluster

#*****************************************************************
# Clustering Configuration (for Enterprise)
#*****************************************************************

# Enable causal clustering
causal_clustering.minimum_core_cluster_size_at_formation=3
causal_clustering.minimum_core_cluster_size_at_runtime=3

# Core servers
causal_clustering.initial_discovery_members=neo4j-core-1:5000,neo4j-core-2:5000,neo4j-core-3:5000

# Server groups for targeting specific workloads
causal_clustering.server_groups=neo4j-core-1,neo4j-core-2,neo4j-core-3

# Read replica configuration
causal_clustering.read_replica_time_to_live=30s

#*****************************************************************
# Metrics and Monitoring
#*****************************************************************

# Enable metrics
metrics.enabled=true
metrics.csv.enabled=true
metrics.csv.interval=5s
metrics.csv.rotation.compression=gzip

# Prometheus metrics
metrics.prometheus.enabled=true
metrics.prometheus.endpoint=0.0.0.0:2004

# JMX monitoring
metrics.jmx.enabled=true

#*****************************************************************
# Browser Configuration
#*****************************************************************

# Browser guides
browser.post_connect_cmd=config;

# Browser credential storage
browser.credential_timeout=0

#*****************************************************************
# Ainflue-specific Graph Schema
#*****************************************************************

# Node labels: User, Creator, Brand, Campaign, Content, Category, Platform, Location

# Relationship types:
# - FOLLOWS (Creator -> Creator)
# - COLLABORATES_WITH (Creator -> Brand)
# - PARTICIPATES_IN (Creator -> Campaign)
# - CREATES (Creator -> Content)
# - BELONGS_TO (Creator -> Category)
# - LOCATED_IN (Creator -> Location)
# - ACTIVE_ON (Creator -> Platform)
# - ENGAGES_WITH (User -> Content)
# - TARGETS (Campaign -> Category)
# - SPONSORS (Brand -> Campaign)

---
# Neo4j Cypher Queries for Ainflue Platform

# Create Users
CREATE CONSTRAINT ON (u:User) ASSERT u.userId IS UNIQUE;
CREATE CONSTRAINT ON (c:Creator) ASSERT c.creatorId IS UNIQUE;
CREATE CONSTRAINT ON (b:Brand) ASSERT b.brandId IS UNIQUE;
CREATE CONSTRAINT ON (cam:Campaign) ASSERT cam.campaignId IS UNIQUE;
CREATE CONSTRAINT ON (con:Content) ASSERT con.contentId IS UNIQUE;

# Create Indexes for performance
CREATE INDEX ON :Creator(username);
CREATE INDEX ON :Creator(category);
CREATE INDEX ON :Creator(followerCount);
CREATE INDEX ON :Creator(engagementRate);
CREATE INDEX ON :Brand(industry);
CREATE INDEX ON :Campaign(status);
CREATE INDEX ON :Campaign(startDate);
CREATE INDEX ON :Content(platform);
CREATE INDEX ON :Content(publishedAt);

# Sample data creation for Ainflue
# Create Creator nodes
CREATE (c:Creator:User {
  creatorId: 'creator_001',
  userId: 'user_001',
  username: 'fashionista_jane',
  email: 'jane@example.com',
  followerCount: 150000,
  engagementRate: 0.045,
  categories: ['fashion', 'lifestyle'],
  platforms: ['instagram', 'tiktok'],
  location: 'New York, NY',
  isVerified: true,
  rating: 4.8,
  createdAt: datetime()
});

# Create Brand nodes
CREATE (b:Brand:User {
  brandId: 'brand_001',
  userId: 'user_002',
  companyName: 'StyleCorp',
  industry: 'Fashion',
  website: 'https://stylecorp.com',
  location: 'Los Angeles, CA',
  companySize: 'medium',
  isVerified: true,
  createdAt: datetime()
});

# Create Campaign nodes
CREATE (cam:Campaign {
  campaignId: 'campaign_001',
  brandId: 'brand_001',
  title: 'Summer Fashion 2024',
  description: 'Promote our new summer collection',
  budget: {min: 5000, max: 15000},
  startDate: date('2024-06-01'),
  endDate: date('2024-08-31'),
  status: 'active',
  targetCategories: ['fashion', 'lifestyle'],
  platforms: ['instagram', 'tiktok'],
  createdAt: datetime()
});

# Create relationships
# Creator follows another creator
MATCH (c1:Creator {creatorId: 'creator_001'}), (c2:Creator {creatorId: 'creator_002'})
CREATE (c1)-[r:FOLLOWS {since: date('2023-01-15')}]->(c2);

# Creator collaborates with brand
MATCH (c:Creator {creatorId: 'creator_001'}), (b:Brand {brandId: 'brand_001'})
CREATE (c)-[r:COLLABORATES_WITH {
  startDate: date('2024-01-01'),
  collaborationCount: 3,
  avgRating: 4.7,
  totalEarnings: 12500.00
}]->(b);

# Creator participates in campaign
MATCH (c:Creator {creatorId: 'creator_001'}), (cam:Campaign {campaignId: 'campaign_001'})
CREATE (c)-[r:PARTICIPATES_IN {
  appliedAt: datetime('2024-05-15T10:00:00Z'),
  approvedAt: datetime('2024-05-16T14:30:00Z'),
  status: 'approved',
  agreedRate: 2500.00
}]->(cam);

# Brand sponsors campaign
MATCH (b:Brand {brandId: 'brand_001'}), (cam:Campaign {campaignId: 'campaign_001'})
CREATE (b)-[r:SPONSORS {createdAt: datetime()}]->(cam);

---
# Advanced Neo4j Queries for Ainflue Analytics

# Find most influential creators (highest follower count and engagement)
MATCH (c:Creator)
WHERE c.isVerified = true
RETURN c.username, c.followerCount, c.engagementRate, c.categories
ORDER BY c.followerCount * c.engagementRate DESC
LIMIT 20;

# Discover creator collaboration networks
MATCH (c1:Creator)-[:COLLABORATES_WITH]->(b:Brand)<-[:COLLABORATES_WITH]-(c2:Creator)
WHERE c1 <> c2
RETURN c1.username, c2.username, b.companyName, 
       count(*) as sharedBrands
ORDER BY sharedBrands DESC
LIMIT 50;

# Find creators by similarity (shared categories and platforms)
MATCH (c1:Creator), (c2:Creator)
WHERE c1 <> c2
  AND any(cat IN c1.categories WHERE cat IN c2.categories)
  AND any(plat IN c1.platforms WHERE plat IN c2.platforms)
WITH c1, c2, 
     size([cat IN c1.categories WHERE cat IN c2.categories]) as sharedCategories,
     size([plat IN c1.platforms WHERE plat IN c2.platforms]) as sharedPlatforms
RETURN c1.username, c2.username, sharedCategories, sharedPlatforms,
       abs(c1.followerCount - c2.followerCount) as followerDiff
ORDER BY sharedCategories DESC, sharedPlatforms DESC, followerDiff ASC
LIMIT 30;

# Campaign performance analysis
MATCH (cam:Campaign)<-[:PARTICIPATES_IN]-(c:Creator)
OPTIONAL MATCH (c)-[:CREATES]->(con:Content)-[:PART_OF]->(cam)
RETURN cam.title, 
       count(DISTINCT c) as participatingCreators,
       sum(c.followerCount) as totalReach,
       avg(c.engagementRate) as avgEngagementRate,
       count(DISTINCT con) as contentPieces
ORDER BY totalReach DESC;

# Creator recommendation algorithm
MATCH (target:Creator {creatorId: $targetCreatorId})
MATCH (target)-[:COLLABORATES_WITH]->(b:Brand)<-[:COLLABORATES_WITH]-(similar:Creator)
WHERE similar <> target
  AND any(cat IN target.categories WHERE cat IN similar.categories)
WITH similar, count(b) as sharedBrands, target
MATCH (similar)-[:PARTICIPATES_IN]->(cam:Campaign)
WHERE any(cat IN cam.targetCategories WHERE cat IN target.categories)
WITH similar, sharedBrands, count(cam) as relevantCampaigns, target
RETURN similar.username, similar.followerCount, similar.engagementRate,
       sharedBrands, relevantCampaigns,
       (sharedBrands * 2 + relevantCampaigns + similar.engagementRate * 100) as score
ORDER BY score DESC
LIMIT 10;

# Trend analysis - emerging creators
MATCH (c:Creator)-[:PARTICIPATES_IN]->(cam:Campaign)
WHERE cam.startDate >= date() - duration({months: 3})
WITH c, count(cam) as recentCampaigns
WHERE recentCampaigns >= 2
  AND c.followerCount < 100000  // Micro-influencers
  AND c.engagementRate > 0.03   // High engagement
RETURN c.username, c.followerCount, c.engagementRate, 
       recentCampaigns, c.categories
ORDER BY c.engagementRate DESC, recentCampaigns DESC
LIMIT 25;

# Brand collaboration network analysis
MATCH (b:Brand)-[:SPONSORS]->(cam:Campaign)<-[:PARTICIPATES_IN]-(c:Creator)
WITH b, collect(DISTINCT c) as collaboratedCreators
MATCH (b2:Brand)-[:SPONSORS]->(cam2:Campaign)<-[:PARTICIPATES_IN]-(c2:Creator)
WHERE b <> b2 AND c2 IN collaboratedCreators
WITH b, b2, size([c IN collaboratedCreators WHERE c IN collect(c2)]) as sharedCreators
WHERE sharedCreators > 0
RETURN b.companyName, b2.companyName, sharedCreators
ORDER BY sharedCreators DESC
LIMIT 20;

# Content virality prediction
MATCH (c:Creator)-[:CREATES]->(con:Content)
WHERE con.publishedAt >= datetime() - duration({days: 7})
WITH con, c.followerCount as reach, c.engagementRate as engagement
RETURN con.contentId, con.platform, con.contentType,
       reach * engagement * 1000 as viralityScore,
       con.currentViews, con.currentLikes
ORDER BY viralityScore DESC
LIMIT 15;

