# Alertmanager Configuration Template for IA Chéries Platform
# This template provides comprehensive alerting configuration for monitoring
# the IA Chéries creator economy platform

global:
  # SMTP configuration for email notifications
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${SMTP_FROM_ADDRESS}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true
  
  # Slack webhook for team notifications
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  
  # PagerDuty integration key
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Templates for notification messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'
  
  routes:
    # Critical alerts go to PagerDuty and Slack immediately
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
      
    # Database alerts
    - match:
        service: database
      receiver: 'database-team'
      group_interval: 5m
      
    # API alerts
    - match:
        service: api
      receiver: 'backend-team'
      
    # Frontend alerts  
    - match:
        service: frontend
      receiver: 'frontend-team'
      
    # Creator economy specific alerts
    - match:
        category: creator-economy
      receiver: 'creator-team'
      
    # AI/ML model alerts
    - match:
        category: ai-ml
      receiver: 'ml-team'
      
    # Security alerts
    - match:
        category: security
      receiver: 'security-team'
      group_wait: 0s
      repeat_interval: 15m
      
    # Infrastructure alerts
    - match:
        category: infrastructure
      receiver: 'devops-team'

# Inhibition rules to prevent spam
inhibit_rules:
  # Inhibit warning alerts if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
    
  # Inhibit low priority alerts during maintenance
  - source_match:
      maintenance: 'true'
    target_match:
      severity: 'warning'
    equal: ['cluster']

# Receivers configuration
receivers:
  # Default receiver for non-routed alerts
  - name: 'default-receiver'
    email_configs:
      - to: '${DEFAULT_EMAIL}'
        subject: '[IA Chéries] Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          
          Labels:
          {{ range .Labels.SortedPairs }}  {{ .Name }}: {{ .Value }}
          {{ end }}
          
          Firing Time: {{ .StartsAt }}
          {{ if .EndsAt }}Resolved Time: {{ .EndsAt }}{{ end }}
          {{ end }}

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        description: 'Critical alert on IA Chéries platform'
        details:
          alert: '{{ .GroupLabels.alertname }}'
          summary: '{{ .CommonAnnotations.summary }}'
          environment: '{{ .CommonLabels.environment }}'
          
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#critical-alerts'
        username: 'Alertmanager'
        icon_emoji: ':fire:'
        title: 'CRITICAL: {{ .CommonAnnotations.summary }}'
        text: |
          🚨 *Critical Alert Firing* 🚨
          
          *Environment:* {{ .CommonLabels.environment }}
          *Service:* {{ .CommonLabels.service }}
          *Instance:* {{ .CommonLabels.instance }}
          
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
          
    email_configs:
      - to: '${CRITICAL_EMAIL_LIST}'
        subject: '🚨 CRITICAL ALERT: {{ .CommonAnnotations.summary }}'

  # Database team alerts
  - name: 'database-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#database-alerts'
        username: 'DB Monitor'
        icon_emoji: ':database:'
        title: 'Database Alert: {{ .CommonAnnotations.summary }}'
        text: |
          📊 *Database Alert*
          
          *Database:* {{ .CommonLabels.database }}
          *Instance:* {{ .CommonLabels.instance }}
          
          {{ range .Alerts }}
          *Issue:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
          
    email_configs:
      - to: '${DBA_EMAIL_LIST}'
        subject: '[DB Alert] {{ .CommonAnnotations.summary }}'

  # Backend team alerts
  - name: 'backend-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#backend-alerts'
        username: 'API Monitor'
        icon_emoji: ':gear:'
        title: 'API Alert: {{ .CommonAnnotations.summary }}'
        
    email_configs:
      - to: '${BACKEND_EMAIL_LIST}'
        subject: '[API Alert] {{ .CommonAnnotations.summary }}'

  # Frontend team alerts
  - name: 'frontend-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#frontend-alerts'
        username: 'Frontend Monitor'
        icon_emoji: ':computer:'
        title: 'Frontend Alert: {{ .CommonAnnotations.summary }}'
        
    email_configs:
      - to: '${FRONTEND_EMAIL_LIST}'
        subject: '[Frontend Alert] {{ .CommonAnnotations.summary }}'

  # Creator economy team alerts
  - name: 'creator-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#creator-economy-alerts'
        username: 'Creator Monitor'
        icon_emoji: ':moneybag:'
        title: 'Creator Economy Alert: {{ .CommonAnnotations.summary }}'
        text: |
          💰 *Creator Economy Alert*
          
          {{ range .Alerts }}
          *Issue:* {{ .Annotations.description }}
          *Impact:* {{ .Annotations.impact }}
          *Recommended Action:* {{ .Annotations.action }}
          {{ end }}
        
    email_configs:
      - to: '${CREATOR_TEAM_EMAIL_LIST}'
        subject: '[Creator Economy] {{ .CommonAnnotations.summary }}'

  # ML team alerts
  - name: 'ml-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#ml-alerts'
        username: 'ML Monitor'
        icon_emoji: ':robot_face:'
        title: 'AI/ML Alert: {{ .CommonAnnotations.summary }}'
        text: |
          🤖 *AI/ML System Alert*
          
          *Model:* {{ .CommonLabels.model }}
          *Service:* {{ .CommonLabels.service }}
          
          {{ range .Alerts }}
          *Issue:* {{ .Annotations.description }}
          *Model Performance Impact:* {{ .Annotations.performance_impact }}
          {{ end }}
        
    email_configs:
      - to: '${ML_TEAM_EMAIL_LIST}'
        subject: '[AI/ML Alert] {{ .CommonAnnotations.summary }}'

  # Security team alerts
  - name: 'security-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#security-alerts'
        username: 'Security Monitor'
        icon_emoji: ':shield:'
        title: 'Security Alert: {{ .CommonAnnotations.summary }}'
        text: |
          🛡️ *Security Alert*
          
          *Severity:* {{ .CommonLabels.severity }}
          *Type:* {{ .CommonLabels.alert_type }}
          
          {{ range .Alerts }}
          *Threat:* {{ .Annotations.description }}
          *Immediate Action Required:* {{ .Annotations.action }}
          {{ end }}
        
    email_configs:
      - to: '${SECURITY_EMAIL_LIST}'
        subject: '🛡️ SECURITY ALERT: {{ .CommonAnnotations.summary }}'
        
    pagerduty_configs:
      - routing_key: '${SECURITY_PAGERDUTY_KEY}'
        description: 'Security alert on IA Chéries platform'

  # DevOps team alerts
  - name: 'devops-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#devops-alerts'
        username: 'Infrastructure Monitor'
        icon_emoji: ':cloud:'
        title: 'Infrastructure Alert: {{ .CommonAnnotations.summary }}'
        
    email_configs:
      - to: '${DEVOPS_EMAIL_LIST}'
        subject: '[Infrastructure] {{ .CommonAnnotations.summary }}'

# Additional configuration for webhook receivers
webhook_configs:
  # Custom webhook for integration with ticketing system
  - url: '${TICKETING_WEBHOOK_URL}'
    send_resolved: true
    http_config:
      bearer_token: '${TICKETING_API_TOKEN}'
    max_alerts: 0
    
  # Integration with monitoring dashboard
  - url: '${MONITORING_WEBHOOK_URL}'
    send_resolved: true
    
# Time intervals for different notification types
time_intervals:
  - name: business-hours
    time_ranges:
      - start_time: '09:00'
        end_time: '17:00'
    weekdays: ['monday:friday']
    
  - name: off-hours
    time_ranges:
      - start_time: '17:01'
        end_time: '08:59'
    weekdays: ['monday:friday']
      
  - name: weekends
    weekdays: ['saturday', 'sunday']