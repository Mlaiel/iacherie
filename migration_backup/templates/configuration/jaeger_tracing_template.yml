# Jaeger Tracing Configuration Template for Ainflue Platform
# Distributed tracing configuration for microservices monitoring

apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: monitoring
  labels:
    app: jaeger
    component: config
    platform: ainflue
data:
  jaeger.yml: |
    # Jaeger configuration for Ainflue distributed tracing
    
    # Collector configuration
    collector:
      # Receivers for different protocols
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:14317
            http:
              endpoint: 0.0.0.0:14318
              cors:
                allowed_origins:
                  - "https://*.ainflue.com"
                  - "http://localhost:*"
        jaeger:
          protocols:
            grpc:
              endpoint: 0.0.0.0:14250
            thrift_http:
              endpoint: 0.0.0.0:14268
            thrift_compact:
              endpoint: 0.0.0.0:6831
            thrift_binary:
              endpoint: 0.0.0.0:6832
        zipkin:
          endpoint: 0.0.0.0:9411
      
      # Processors for trace processing
      processors:
        batch:
          timeout: 1s
          send_batch_size: 1024
          send_batch_max_size: 2048
        memory_limiter:
          limit_mib: 512
        resource:
          attributes:
            - key: service.namespace
              value: ainflue
              action: upsert
        
      # Exporters to storage backend
      exporters:
        jaeger:
          endpoint: jaeger-collector:14250
          tls:
            insecure: true
        elasticsearch:
          endpoints:
            - "${ELASTICSEARCH_ENDPOINT}"
          index: jaeger-traces
          pipeline: jaeger-pipeline
          
      # Service configuration
      service:
        extensions: [health_check, pprof]
        pipelines:
          traces:
            receivers: [otlp, jaeger, zipkin]
            processors: [memory_limiter, batch, resource]
            exporters: [jaeger, elasticsearch]
        telemetry:
          logs:
            level: info
          metrics:
            address: 0.0.0.0:8888

---
# Jaeger All-in-One Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-all-in-one
  namespace: monitoring
  labels:
    app: jaeger
    component: all-in-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
      component: all-in-one
  template:
    metadata:
      labels:
        app: jaeger
        component: all-in-one
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: QUERY_BASE_PATH
          value: "/jaeger"
        - name: SPAN_STORAGE_TYPE
          value: "elasticsearch"
        - name: ES_SERVER_URLS
          value: "${ELASTICSEARCH_ENDPOINT}"
        - name: ES_INDEX_PREFIX
          value: "jaeger"
        - name: ES_USERNAME
          valueFrom:
            secretKeyRef:
              name: elasticsearch-credentials
              key: username
        - name: ES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-credentials
              key: password
        ports:
        - containerPort: 16686
          name: ui
        - containerPort: 14268
          name: http-collector
        - containerPort: 14250
          name: grpc-collector
        - containerPort: 6831
          name: compact-udp
        - containerPort: 6832
          name: binary-udp
        - containerPort: 14317
          name: otlp-grpc
        - containerPort: 14318
          name: otlp-http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 10
          periodSeconds: 5

---
# Jaeger Query Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: monitoring
  labels:
    app: jaeger
    component: query
spec:
  type: ClusterIP
  ports:
  - port: 16686
    targetPort: 16686
    name: ui
  selector:
    app: jaeger
    component: all-in-one

---
# Jaeger Collector Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: monitoring
  labels:
    app: jaeger
    component: collector
spec:
  type: ClusterIP
  ports:
  - port: 14268
    targetPort: 14268
    name: http-collector
  - port: 14250
    targetPort: 14250
    name: grpc-collector
  - port: 6831
    targetPort: 6831
    name: compact-udp
    protocol: UDP
  - port: 6832
    targetPort: 6832
    name: binary-udp
    protocol: UDP
  - port: 14317
    targetPort: 14317
    name: otlp-grpc
  - port: 14318
    targetPort: 14318
    name: otlp-http
  selector:
    app: jaeger
    component: all-in-one

---
# Jaeger Agent DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: jaeger-agent
  namespace: monitoring
  labels:
    app: jaeger
    component: agent
spec:
  selector:
    matchLabels:
      app: jaeger
      component: agent
  template:
    metadata:
      labels:
        app: jaeger
        component: agent
    spec:
      containers:
      - name: jaeger-agent
        image: jaegertracing/jaeger-agent:latest
        args:
        - --collector.host-port=jaeger-collector:14267
        - --reporter.grpc.host-port=jaeger-collector:14250
        ports:
        - containerPort: 6831
          name: compact-udp
          protocol: UDP
        - containerPort: 6832
          name: binary-udp
          protocol: UDP
        - containerPort: 5778
          name: config-rest
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

---
# Ingress for Jaeger UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-ui
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: jaeger-auth
    nginx.ingress.kubernetes.io/auth-realm: "Jaeger Tracing UI"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - tracing.ainflue.com
    secretName: jaeger-tls
  rules:
  - host: tracing.ainflue.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jaeger-query
            port:
              number: 16686

---
# ServiceMonitor for Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
spec:
  selector:
    matchLabels:
      app: jaeger
  endpoints:
  - port: ui
    path: /metrics
    interval: 30s
    
---
# Application tracing configuration examples

# Example Go application with Jaeger tracing
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracing-config-go
  namespace: ainflue
data:
  tracing.go: |
    package tracing
    
    import (
        "context"
        "io"
        "log"
        
        "github.com/opentracing/opentracing-go"
        "github.com/uber/jaeger-client-go"
        "github.com/uber/jaeger-client-go/config"
    )
    
    func InitTracing(serviceName string) (opentracing.Tracer, io.Closer) {
        cfg := config.Configuration{
            ServiceName: serviceName,
            Sampler: &config.SamplerConfig{
                Type:  jaeger.SamplerTypeConst,
                Param: 1,
            },
            Reporter: &config.ReporterConfig{
                LogSpans:           true,
                LocalAgentHostPort: "jaeger-agent:6831",
            },
        }
        
        tracer, closer, err := cfg.NewTracer()
        if err != nil {
            log.Fatalf("Could not initialize jaeger tracer: %s", err.Error())
        }
        
        opentracing.SetGlobalTracer(tracer)
        return tracer, closer
    }

---
# Example Node.js application tracing configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracing-config-nodejs
  namespace: ainflue
data:
  tracing.js: |
    const { initTracer } = require('jaeger-client');
    
    function initJaegerTracer(serviceName) {
        const config = {
            serviceName: serviceName,
            reporter: {
                agentHost: 'jaeger-agent',
                agentPort: 6832,
                logSpans: true,
            },
            sampler: {
                type: 'const',
                param: 1,
            },
        };
        
        const options = {
            logger: {
                info(msg) {
                    console.log('INFO', msg);
                },
                error(msg) {
                    console.error('ERROR', msg);
                },
            },
        };
        
        return initTracer(config, options);
    }
    
    module.exports = { initJaegerTracer };

---
# Python application tracing configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracing-config-python
  namespace: ainflue
data:
  tracing.py: |
    from jaeger_client import Config
    import logging
    
    def init_tracer(service_name):
        logging.getLogger('').handlers = []
        logging.basicConfig(format='%(message)s', level=logging.DEBUG)
        
        config = Config(
            config={
                'sampler': {
                    'type': 'const',
                    'param': 1,
                },
                'local_agent': {
                    'reporting_host': 'jaeger-agent',
                    'reporting_port': 6831,
                },
                'logging': True,
            },
            service_name=service_name,
            validate=True,
        )
        
        return config.initialize_tracer()

---
# Jaeger sampling strategies
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-sampling-strategies
  namespace: monitoring
data:
  strategies.json: |
    {
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.1
      },
      "per_service_strategies": [
        {
          "service": "ainflue-api",
          "type": "probabilistic",
          "param": 0.5
        },
        {
          "service": "ainflue-auth",
          "type": "probabilistic",
          "param": 1.0
        },
        {
          "service": "ainflue-payment",
          "type": "probabilistic",
          "param": 1.0
        },
        {
          "service": "ainflue-ml",
          "type": "probabilistic",
          "param": 0.2
        }
      ]
    }