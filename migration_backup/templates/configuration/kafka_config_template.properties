# Apache Kafka Configuration Template for Ainflue Platform
# Distributed streaming platform for real-time data processing and event-driven architecture

############################# Server Basics #############################

# The id of the broker. This must be set to a unique integer for each broker.
broker.id=${KAFKA_BROKER_ID:1}

# Hostname and port the broker will advertise to producers and consumers
advertised.listeners=PLAINTEXT://${KAFKA_ADVERTISED_HOST}:9092,SSL://${KAFKA_ADVERTISED_HOST}:9093

# Listeners to use for communication between brokers
listeners=PLAINTEXT://0.0.0.0:9092,SSL://0.0.0.0:9093

# Security settings
security.inter.broker.protocol=SSL
ssl.client.auth=required

# SSL Configuration
ssl.keystore.location=/etc/kafka/ssl/kafka.server.keystore.jks
ssl.keystore.password=${KAFKA_KEYSTORE_PASSWORD}
ssl.key.password=${KAFKA_KEY_PASSWORD}
ssl.truststore.location=/etc/kafka/ssl/kafka.server.truststore.jks
ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
ssl.enabled.protocols=TLSv1.2,TLSv1.3
ssl.keystore.type=JKS
ssl.truststore.type=JKS

# SASL Configuration
sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512

############################# Socket Server Settings #############################

# The number of threads that the server uses for receiving requests
num.network.threads=8

# The number of threads that the server uses for processing requests
num.io.threads=16

# The send buffer (SO_SNDBUF) used by the socket server
socket.send.buffer.bytes=102400

# The receive buffer (SO_RCVBUF) used by the socket server
socket.receive.buffer.bytes=102400

# The maximum size of a request that the socket server will accept
socket.request.max.bytes=104857600

############################# Log Basics #############################

# A comma separated list of directories under which to store log files
log.dirs=/var/lib/kafka/logs

# The default number of log partitions per topic
num.partitions=3

# The number of threads per data directory to be used for log recovery at startup and flushing at shutdown
num.recovery.threads.per.data.dir=2

############################# Internal Topic Settings #############################

# The replication factor for the group metadata internal topics
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

############################# Log Flush Policy #############################

# The number of messages to accept before forcing a flush of data to disk
log.flush.interval.messages=10000

# The maximum amount of time a message can sit in a log before we force a flush
log.flush.interval.ms=1000

############################# Log Retention Policy #############################

# The minimum age of a log file to be eligible for deletion due to age
log.retention.hours=168

# The maximum size of a log segment file
log.segment.bytes=1073741824

# The interval at which log segments are checked to see if they can be deleted
log.retention.check.interval.ms=300000

# Compression type for all topics
compression.type=snappy

# Log cleanup policy
log.cleanup.policy=delete

############################# Zookeeper #############################

# Zookeeper connection string
zookeeper.connect=${ZOOKEEPER_HOSTS:localhost:2181}

# Timeout in ms for connecting to zookeeper
zookeeper.connection.timeout.ms=18000

# Root directory for all kafka znodes
zookeeper.set.acl=true

############################# Group Coordinator Settings #############################

# The following configuration specifies the time, in milliseconds, that the GroupCoordinator will delay the initial consumer rebalance
group.initial.rebalance.delay.ms=3000

############################# Performance Tuning #############################

# Replica fetcher threads
num.replica.fetchers=4

# Producer and consumer request queues
queued.max.requests=500

# Background threads
background.threads=10

# Message max bytes
message.max.bytes=1000000
replica.fetch.max.bytes=1048576

# JVM settings (in kafka-server-start.sh)
# export KAFKA_HEAP_OPTS="-Xmx4G -Xms4G"
# export KAFKA_JVM_PERFORMANCE_OPTS="-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+ExplicitGCInvokesConcurrent -Djava.awt.headless=true"

############################# Topic-specific Settings #############################

# Auto create topics
auto.create.topics.enable=false

# Delete topic enable
delete.topic.enable=true

# Default replication factor
default.replication.factor=3

# Minimum in-sync replicas
min.insync.replicas=2

# Unclean leader election
unclean.leader.election.enable=false

############################# Ainflue-specific Topic Configurations #############################

# User activity events
# Topic: user-activity-events
# Partitions: 12, Replication: 3, Retention: 7 days

# Content performance metrics
# Topic: content-metrics
# Partitions: 8, Replication: 3, Retention: 30 days

# Creator engagement events
# Topic: creator-engagement
# Partitions: 6, Replication: 3, Retention: 7 days

# Campaign analytics
# Topic: campaign-analytics
# Partitions: 4, Replication: 3, Retention: 90 days

# Revenue tracking events
# Topic: revenue-events
# Partitions: 3, Replication: 3, Retention: 365 days

# Notification events
# Topic: notification-events
# Partitions: 6, Replication: 3, Retention: 30 days

# Audit logs
# Topic: audit-logs
# Partitions: 3, Replication: 3, Retention: 2 years

# Real-time recommendations
# Topic: ml-recommendations
# Partitions: 8, Replication: 3, Retention: 1 day

---
# Kafka Topic Creation Scripts

#!/bin/bash
# Create Ainflue Kafka Topics

KAFKA_HOME=/opt/kafka
BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}

# Function to create topic
create_topic() {
    local topic_name=$1
    local partitions=$2
    local replication_factor=$3
    local retention_ms=$4
    local cleanup_policy=${5:-delete}
    
    echo "Creating topic: $topic_name"
    $KAFKA_HOME/bin/kafka-topics.sh --create \
        --bootstrap-server $BOOTSTRAP_SERVERS \
        --topic $topic_name \
        --partitions $partitions \
        --replication-factor $replication_factor \
        --config retention.ms=$retention_ms \
        --config cleanup.policy=$cleanup_policy \
        --config compression.type=snappy \
        --config min.insync.replicas=2
}

# User activity events
create_topic "user-activity-events" 12 3 604800000  # 7 days

# Content performance metrics
create_topic "content-metrics" 8 3 2592000000  # 30 days

# Creator engagement events
create_topic "creator-engagement" 6 3 604800000  # 7 days

# Campaign analytics
create_topic "campaign-analytics" 4 3 7776000000  # 90 days

# Revenue tracking events
create_topic "revenue-events" 3 3 31536000000  # 365 days

# Notification events
create_topic "notification-events" 6 3 2592000000  # 30 days

# Audit logs
create_topic "audit-logs" 3 3 63072000000  # 2 years

# Real-time recommendations
create_topic "ml-recommendations" 8 3 86400000  # 1 day

# System health metrics
create_topic "system-health" 3 3 604800000  # 7 days

# API request logs
create_topic "api-request-logs" 6 3 2592000000  # 30 days

echo "All topics created successfully!"

---
# Kafka Producer Configuration for Ainflue

# Producer properties
bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.JsonSerializer

# Performance settings
batch.size=16384
linger.ms=5
buffer.memory=33554432
compression.type=snappy

# Reliability settings
acks=all
retries=2147483647
max.in.flight.requests.per.connection=5
enable.idempotence=true

# Security settings
security.protocol=SSL
ssl.truststore.location=/etc/kafka/ssl/kafka.client.truststore.jks
ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
ssl.keystore.location=/etc/kafka/ssl/kafka.client.keystore.jks
ssl.keystore.password=${KAFKA_KEYSTORE_PASSWORD}
ssl.key.password=${KAFKA_KEY_PASSWORD}

# SASL settings
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";

---
# Kafka Consumer Configuration for Ainflue

# Consumer properties
bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.JsonDeserializer

# Consumer group settings
group.id=ainflue-consumer-group
enable.auto.commit=false
auto.offset.reset=earliest
max.poll.records=500
max.poll.interval.ms=300000

# Performance settings
fetch.min.bytes=1
fetch.max.wait.ms=500
max.partition.fetch.bytes=1048576

# Security settings (same as producer)
security.protocol=SSL
ssl.truststore.location=/etc/kafka/ssl/kafka.client.truststore.jks
ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
ssl.keystore.location=/etc/kafka/ssl/kafka.client.keystore.jks
ssl.keystore.password=${KAFKA_KEYSTORE_PASSWORD}
ssl.key.password=${KAFKA_KEY_PASSWORD}

sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";

---
# Kafka Connect Configuration

# Connect worker properties
bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
group.id=ainflue-connect-cluster

# Converter settings
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

# Offset storage
offset.storage.topic=connect-offsets
offset.storage.replication.factor=3
offset.storage.partitions=25

# Config storage
config.storage.topic=connect-configs
config.storage.replication.factor=3

# Status storage
status.storage.topic=connect-status
status.storage.replication.factor=3
status.storage.partitions=5

# Plugin path
plugin.path=/opt/kafka/plugins

---
# Kafka Streams Configuration for Real-time Processing

# Streams application properties
application.id=ainflue-analytics-streams
bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}

# Processing settings
num.stream.threads=4
num.standby.replicas=1
state.dir=/var/lib/kafka-streams

# Serialization
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
default.value.serde=org.apache.kafka.common.serialization.Serdes$JsonSerde

# Caching and commit intervals
cache.max.bytes.buffering=10485760
commit.interval.ms=30000

# Security settings
security.protocol=SSL
ssl.truststore.location=/etc/kafka/ssl/kafka.client.truststore.jks
ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}

---
# Schema Registry Configuration

# Basic settings
listeners=http://0.0.0.0:8081
kafkastore.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
kafkastore.topic=_schemas
kafkastore.topic.replication.factor=3

# Security
kafkastore.security.protocol=SSL
kafkastore.ssl.truststore.location=/etc/kafka/ssl/kafka.client.truststore.jks
kafkastore.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}

# Schema compatibility
avro.compatibility.level=backward

---
# Monitoring and JMX Configuration

# JMX settings for monitoring
export JMX_PORT=9999
export KAFKA_JMX_OPTS="-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=${KAFKA_JMX_HOSTNAME} -Dcom.sun.management.jmxremote.rmi.port=9999"

# Log4j configuration for Kafka logs
log4j.rootLogger=INFO, stdout, kafkaAppender

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d] %p %m (%c)%n

log4j.appender.kafkaAppender=org.apache.log4j.DailyRollingFileAppender
log4j.appender.kafkaAppender.DatePattern='.'yyyy-MM-dd-HH
log4j.appender.kafkaAppender.File=/var/log/kafka/server.log
log4j.appender.kafkaAppender.layout=org.apache.log4j.PatternLayout
log4j.appender.kafkaAppender.layout.ConversionPattern=[%d] %p %m (%c)%n

# Specific loggers
log4j.logger.kafka=INFO
log4j.logger.org.apache.kafka=INFO
log4j.logger.kafka.controller=TRACE
log4j.logger.kafka.log.LogCleaner=INFO
log4j.logger.state.change.logger=TRACE
log4j.logger.kafka.authorizer.logger=WARN