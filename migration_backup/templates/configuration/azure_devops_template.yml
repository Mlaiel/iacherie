# Azure DevOps Pipeline Template for IA Chéries Platform
# Comprehensive CI/CD pipeline using Azure DevOps YAML

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
  paths:
    exclude:
      - README.md
      - docs/*

pr:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/*

variables:
  # Application configuration
  - name: appName
    value: 'ainflue'
  - name: buildConfiguration
    value: 'Release'
  
  # Version and build info
  - name: buildVersion
    value: '$(Build.BuildNumber)'
  - name: gitCommitShort
    value: '$(Build.SourceVersion)'
  - name: imageTag
    value: '$(gitCommitShort)-$(buildVersion)'
  
  # Container registry
  - name: containerRegistry
    value: 'ainflueacr.azurecr.io'
  - name: dockerRegistryServiceConnection
    value: 'IA ChériesContainerRegistry'
  
  # Kubernetes configuration
  - name: kubernetesServiceConnection
    value: 'IA ChériesKubernetes'
  - name: stagingNamespace
    value: 'ainflue-staging'
  - name: productionNamespace
    value: 'ainflue-production'
  
  # Testing configuration
  - name: coverageThreshold
    value: '80'
  - name: performanceThreshold
    value: '2000'

# Variable groups (defined in Azure DevOps)
- group: 'IA Chéries-Development'
- group: 'IA Chéries-Staging'
- group: 'IA Chéries-Production'

resources:
  repositories:
    - repository: templates
      type: git
      name: ainflue/azure-pipelines-templates
      ref: main

stages:
  # Build and Test Stage
  - stage: BuildAndTest
    displayName: 'Build and Test'
    jobs:
      - job: CodeQuality
        displayName: 'Code Quality & Validation'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 0 # Required for SonarCloud analysis
          
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '18.x'
          
          - task: Cache@2
            displayName: 'Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: '$(npm_config_cache)'
          
          - script: |
              npm ci
              npm run lint
              npm run format:check
              npm run type-check
            displayName: 'Code Quality Checks'
          
          - task: SonarCloudPrepare@1
            displayName: 'Prepare SonarCloud analysis'
            inputs:
              SonarCloud: 'SonarCloud-IA Chéries'
              organization: 'ainflue'
              scannerMode: 'CLI'
              configMode: 'manual'
              cliProjectKey: 'ainflue'
              cliProjectName: 'IA Chéries'
              cliSources: '.'
              extraProperties: |
                sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
                sonar.javascript.lcov.reportPaths=*/coverage/lcov.info
                sonar.python.coverage.reportPaths=services/ml/coverage.xml

      - job: BuildAPI
        displayName: 'Build API Service'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '18.x'
          
          - script: |
              cd services/api
              npm ci
              npm run build
              npm run test:unit -- --coverage --ci --reporter=junit --outputFile=test-results.xml
            displayName: 'Build and Test API'
          
          - task: PublishTestResults@2
            displayName: 'Publish API Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'services/api/test-results.xml'
              testRunTitle: 'API Unit Tests'
          
          - task: PublishCodeCoverageResults@1
            displayName: 'Publish API Coverage'
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: 'services/api/coverage/cobertura-coverage.xml'
              reportDirectory: 'services/api/coverage/lcov-report'
          
          - task: PublishBuildArtifacts@1
            displayName: 'Publish API Artifacts'
            inputs:
              pathToPublish: 'services/api/dist'
              artifactName: 'api-build'

      - job: BuildWeb
        displayName: 'Build Web Service'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '18.x'
          
          - script: |
              cd services/web
              npm ci
              npm run build
              npm run test:unit -- --coverage --ci --reporter=junit --outputFile=test-results.xml
            displayName: 'Build and Test Web'
          
          - task: PublishTestResults@2
            displayName: 'Publish Web Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'services/web/test-results.xml'
              testRunTitle: 'Web Unit Tests'
          
          - task: PublishCodeCoverageResults@1
            displayName: 'Publish Web Coverage'
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: 'services/web/coverage/cobertura-coverage.xml'
              reportDirectory: 'services/web/coverage/lcov-report'
          
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Web Artifacts'
            inputs:
              pathToPublish: 'services/web/dist'
              artifactName: 'web-build'

      - job: BuildML
        displayName: 'Build ML Service'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          
          - task: UsePythonVersion@0
            displayName: 'Use Python 3.11'
            inputs:
              versionSpec: '3.11'
              addToPath: true
          
          - script: |
              cd services/ml
              pip install --upgrade pip
              pip install -r requirements.txt
              pip install -r requirements-dev.txt
            displayName: 'Install Python Dependencies'
          
          - script: |
              cd services/ml
              black --check src/
              flake8 src/
              isort --check-only src/
              mypy src/
            displayName: 'Python Code Quality Checks'
          
          - script: |
              cd services/ml
              pytest tests/ --cov=src --cov-report=xml --cov-report=html --junit-xml=test-results.xml
            displayName: 'Run ML Tests'
          
          - task: PublishTestResults@2
            displayName: 'Publish ML Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'services/ml/test-results.xml'
              testRunTitle: 'ML Unit Tests'
          
          - task: PublishCodeCoverageResults@1
            displayName: 'Publish ML Coverage'
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: 'services/ml/coverage.xml'
              reportDirectory: 'services/ml/htmlcov'

      - job: IntegrationTests
        displayName: 'Integration Tests'
        dependsOn: [BuildAPI, BuildWeb, BuildML]
        pool:
          vmImage: 'ubuntu-latest'
        services:
          postgres:
            image: postgres:13
            env:
              POSTGRES_DB: ainflue_test
              POSTGRES_USER: test_user
              POSTGRES_PASSWORD: test_password
            ports:
              - 5432:5432
          redis:
            image: redis:7-alpine
            ports:
              - 6379:6379
        steps:
          - checkout: self
          
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '18.x'
          
          - script: |
              npm ci
              npm run test:integration
            displayName: 'Run Integration Tests'
            env:
              DATABASE_URL: 'postgresql://test_user:test_password@localhost:5432/ainflue_test'
              REDIS_URL: 'redis://localhost:6379'
          
          - task: PublishTestResults@2
            displayName: 'Publish Integration Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'integration-test-results.xml'
              testRunTitle: 'Integration Tests'

  # Security Scanning Stage
  - stage: SecurityScanning
    displayName: 'Security Scanning'
    dependsOn: BuildAndTest
    jobs:
      - job: SecurityScan
        displayName: 'Security Scanning'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          
          - task: SonarCloudAnalyze@1
            displayName: 'Run SonarCloud Analysis'
          
          - task: SonarCloudPublish@1
            displayName: 'Publish SonarCloud Results'
            inputs:
              pollingTimeoutSec: '300'
          
          - task: WhiteSource@21
            displayName: 'WhiteSource Security Scan'
            inputs:
              cwd: '$(System.DefaultWorkingDirectory)'
              projectName: 'IA Chéries'
          
          - script: |
              # Install and run GitLeaks for secret detection
              wget -O gitleaks.tar.gz https://github.com/zricethezav/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
              tar -xzf gitleaks.tar.gz
              ./gitleaks detect --source . --report-format sarif --report-path gitleaks-report.sarif
            displayName: 'Secret Detection with GitLeaks'
          
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Security Reports'
            inputs:
              pathToPublish: '$(System.DefaultWorkingDirectory)'
              artifactName: 'security-reports'
              publishLocation: 'Container'

  # Container Build Stage
  - stage: ContainerBuild
    displayName: 'Build Container Images'
    dependsOn: [BuildAndTest, SecurityScanning]
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/develop'))
    jobs:
      - job: BuildContainers
        displayName: 'Build Docker Images'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          
          - task: Docker@2
            displayName: 'Build API Image'
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: 'ainflue-api'
              command: 'buildAndPush'
              Dockerfile: 'services/api/Dockerfile'
              buildContext: 'services/api'
              tags: |
                $(imageTag)
                latest
          
          - task: Docker@2
            displayName: 'Build Web Image'
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: 'ainflue-web'
              command: 'buildAndPush'
              Dockerfile: 'services/web/Dockerfile'
              buildContext: 'services/web'
              tags: |
                $(imageTag)
                latest
          
          - task: Docker@2
            displayName: 'Build ML Image'
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: 'ainflue-ml'
              command: 'buildAndPush'
              Dockerfile: 'services/ml/Dockerfile'
              buildContext: 'services/ml'
              tags: |
                $(imageTag)
                latest
          
          - task: AquaScanner@4
            displayName: 'Container Security Scan'
            inputs:
              image: '$(containerRegistry)/ainflue-api:$(imageTag)'
              scanner: 'Trivy'
              connection: 'AquaSecurity'

  # Staging Deployment
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: ContainerBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployToStaging
        displayName: 'Deploy to Staging Environment'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'IA Chéries-Staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@0
                  displayName: 'Deploy API to Staging'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: '$(stagingNamespace)'
                    manifests: 'kubernetes/api-deployment.yaml'
                    containers: '$(containerRegistry)/ainflue-api:$(imageTag)'
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy Web to Staging'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: '$(stagingNamespace)'
                    manifests: 'kubernetes/web-deployment.yaml'
                    containers: '$(containerRegistry)/ainflue-web:$(imageTag)'
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy ML to Staging'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: '$(stagingNamespace)'
                    manifests: 'kubernetes/ml-deployment.yaml'
                    containers: '$(containerRegistry)/ainflue-ml:$(imageTag)'

  # Staging Tests
  - stage: StagingTests
    displayName: 'Staging Environment Tests'
    dependsOn: DeployStaging
    jobs:
      - job: SmokeTests
        displayName: 'Smoke Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '18.x'
          
          - script: |
              npm ci
              export API_BASE_URL="https://api.staging.ainflue.com"
              export WEB_BASE_URL="https://staging.ainflue.com"
              npm run test:smoke
            displayName: 'Run Smoke Tests'
          
          - task: PublishTestResults@2
            displayName: 'Publish Smoke Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'smoke-test-results.xml'
              testRunTitle: 'Staging Smoke Tests'

      - job: E2ETests
        displayName: 'End-to-End Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '18.x'
          
          - script: |
              npm ci
              npx playwright install
              export API_BASE_URL="https://api.staging.ainflue.com"
              export WEB_BASE_URL="https://staging.ainflue.com"
              npm run test:e2e:staging
            displayName: 'Run E2E Tests'
          
          - task: PublishTestResults@2
            displayName: 'Publish E2E Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'e2e-test-results.xml'
              testRunTitle: 'Staging E2E Tests'
          
          - task: PublishBuildArtifacts@1
            displayName: 'Publish E2E Reports'
            condition: always()
            inputs:
              pathToPublish: 'e2e-results'
              artifactName: 'e2e-reports'

      - job: PerformanceTests
        displayName: 'Performance Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              # Install k6
              sudo gpg -k
              sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
              echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
              sudo apt-get update
              sudo apt-get install k6
            displayName: 'Install k6'
          
          - script: |
              k6 run --vus 50 --duration 5m performance/load-test.js
              k6 run --vus 100 --duration 2m performance/stress-test.js
            displayName: 'Run Performance Tests'
            env:
              API_BASE_URL: 'https://api.staging.ainflue.com'
          
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Performance Reports'
            inputs:
              pathToPublish: 'performance-results'
              artifactName: 'performance-reports'

  # Production Deployment
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: StagingTests
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToProduction
        displayName: 'Deploy to Production Environment'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'IA Chéries-Production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Database Migration'
                  inputs:
                    azureSubscription: 'Azure-Production'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      # Run database migrations
                      az postgres flexible-server execute \
                        --name $(PRODUCTION_DB_SERVER) \
                        --admin-user $(PRODUCTION_DB_USER) \
                        --admin-password $(PRODUCTION_DB_PASSWORD) \
                        --database-name $(PRODUCTION_DB_NAME) \
                        --file-path migrations/latest.sql
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy API to Production'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: '$(productionNamespace)'
                    manifests: 'kubernetes/api-deployment.yaml'
                    containers: '$(containerRegistry)/ainflue-api:$(imageTag)'
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy Web to Production'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: '$(productionNamespace)'
                    manifests: 'kubernetes/web-deployment.yaml'
                    containers: '$(containerRegistry)/ainflue-web:$(imageTag)'
                
                - task: KubernetesManifest@0
                  displayName: 'Deploy ML to Production'
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: '$(kubernetesServiceConnection)'
                    namespace: '$(productionNamespace)'
                    manifests: 'kubernetes/ml-deployment.yaml'
                    containers: '$(containerRegistry)/ainflue-ml:$(imageTag)'

  # Production Validation
  - stage: ProductionValidation
    displayName: 'Production Validation'
    dependsOn: DeployProduction
    jobs:
      - job: ProductionSmokeTests
        displayName: 'Production Smoke Tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: '18.x'
          
          - script: |
              npm ci
              export API_BASE_URL="https://api.ainflue.com"
              export WEB_BASE_URL="https://app.ainflue.com"
              npm run test:smoke:production
            displayName: 'Run Production Smoke Tests'
          
          - task: PublishTestResults@2
            displayName: 'Publish Production Test Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'production-smoke-test-results.xml'
              testRunTitle: 'Production Smoke Tests'
          
          - task: InvokeRESTAPI@1
            displayName: 'Notify Teams of Deployment'
            inputs:
              connectionType: 'connectedServiceName'
              serviceConnection: 'TeamsWebhook'
              method: 'POST'
              body: |
                {
                  "text": "✅ IA Chéries successfully deployed to production!",
                  "sections": [
                    {
                      "activityTitle": "Production Deployment Complete",
                      "activitySubtitle": "Build $(Build.BuildNumber) - Commit $(Build.SourceVersionMessage)",
                      "facts": [
                        {
                          "name": "Environment",
                          "value": "Production"
                        },
                        {
                          "name": "Build Number",
                          "value": "$(Build.BuildNumber)"
                        },
                        {
                          "name": "Commit",
                          "value": "$(Build.SourceVersion)"
                        },
                        {
                          "name": "Deployed By",
                          "value": "$(Build.RequestedFor)"
                        }
                      ]
                    }
                  ]
                }