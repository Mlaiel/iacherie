# 🔐 Global Certificate Management Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: global-certificate-config
  namespace: cert-manager
  labels:
    app: certificate-management
    component: global-config
data:
  certificate-management.yaml: |
    # Global Certificate Management Configuration
    certificateManagement:
      # Certificate Authorities
      certificateAuthorities:
        letsencrypt:
          enabled: true
          environment: "production"  # production, staging
          email: "certificates@ainflue.com"
          acmeServer: "https://acme-v02.api.letsencrypt.org/directory"
          keyAlgorithm: "RSA"
          keySize: 2048
        
        internal:
          enabled: true
          provider: "vault"
          vaultPath: "pki_int"
          rootCA: "Ainflue Internal CA"
          intermediateCA: "Ainflue Services CA"
          keyAlgorithm: "RSA"
          keySize: 2048
        
        venafi:
          enabled: false
          tppUrl: "https://tpp.ainflue.internal"
          zone: "Ainflue\\Kubernetes"
          
        selfSigned:
          enabled: true
          keyAlgorithm: "RSA"
          keySize: 2048
      
      # Certificate Profiles
      certificateProfiles:
        webServer:
          keyUsage:
            - "digital signature"
            - "key encipherment"
          extKeyUsage:
            - "server auth"
          duration: "2160h"  # 90 days
          renewBefore: "720h"  # 30 days
          
        clientAuth:
          keyUsage:
            - "digital signature"
            - "key encipherment"
          extKeyUsage:
            - "client auth"
          duration: "8760h"  # 1 year
          renewBefore: "2160h"  # 90 days
          
        codeSign:
          keyUsage:
            - "digital signature"
          extKeyUsage:
            - "code signing"
          duration: "26280h"  # 3 years
          renewBefore: "8760h"  # 1 year
          
        emailProtection:
          keyUsage:
            - "digital signature"
            - "key encipherment"
          extKeyUsage:
            - "email protection"
          duration: "8760h"  # 1 year
          renewBefore: "2160h"  # 90 days
      
      # Automation Settings
      automation:
        autoRenewal:
          enabled: true
          renewBeforeExpiry: "30d"
          checkInterval: "1h"
        
        certificateTemplating:
          enabled: true
          defaultTemplate: "web-server"
          customTemplates: true
        
        compliance:
          enforceKeySize: true
          minKeySize: 2048
          allowedAlgorithms: ["RSA", "ECDSA"]
          requireSAN: true
          maxValidityPeriod: "90d"
        
        notifications:
          enabled: true
          channels: ["slack", "email"]
          events: ["issued", "renewed", "expiring", "failed"]
          expiryWarnings: ["30d", "7d", "1d"]
      
      # Security Settings
      security:
        keyStorage:
          provider: "kubernetes"
          encryption: "AES-256-GCM"
          backup: true
        
        accessControl:
          rbac: true
          serviceAccounts: true
          namespaceIsolation: true
        
        auditLogging:
          enabled: true
          level: "detailed"
          retention: "2y"
        
        certificateValidation:
          ocsp: true
          crl: true
          ctLogs: true
---
# 🎯 cert-manager ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  labels:
    issuer-type: acme
    environment: production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: certificates@ainflue.com
    privateKeySecretRef:
      name: letsencrypt-production-private-key
    solvers:
    # HTTP-01 Challenge Solver
    - http01:
        ingress:
          class: nginx
          podTemplate:
            metadata:
              annotations:
                "cluster-autoscaler.kubernetes.io/safe-to-evict": "true"
            spec:
              nodeSelector:
                "kubernetes.io/os": linux
              tolerations:
              - key: "node-role.kubernetes.io/master"
                operator: "Equal"
                effect: "NoSchedule"
    # DNS-01 Challenge Solver for Wildcard Certificates
    - dns01:
        route53:
          region: us-west-2
          hostedZoneID: Z1D633PJN98FT9
          accessKeyID: AKIAIOSFODNN7EXAMPLE
          secretAccessKeySecretRef:
            name: route53-credentials
            key: secret-access-key
      selector:
        dnsNames:
        - "*.ainflue.com"
        - "*.api.ainflue.com"
        - "*.app.ainflue.com"
    # Alternative DNS-01 with CloudFlare
    - dns01:
        cloudflare:
          email: dns@ainflue.com
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
      selector:
        dnsNames:
        - "*.staging.ainflue.com"
        - "*.dev.ainflue.com"
---
# 🔒 cert-manager ClusterIssuer for Let's Encrypt Staging
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    issuer-type: acme
    environment: staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: certificates@ainflue.com
    privateKeySecretRef:
      name: letsencrypt-staging-private-key
    solvers:
    - http01:
        ingress:
          class: nginx
    - dns01:
        route53:
          region: us-west-2
          hostedZoneID: Z1D633PJN98FT9
          accessKeyID: AKIAIOSFODNN7EXAMPLE
          secretAccessKeySecretRef:
            name: route53-credentials
            key: secret-access-key
      selector:
        dnsNames:
        - "*.staging.ainflue.com"
        - "*.dev.ainflue.com"
---
# 🏦 cert-manager Vault Issuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
  labels:
    issuer-type: vault
    environment: internal
spec:
  vault:
    server: https://vault.vault.svc.cluster.local:8200
    path: pki_int/sign/ainflue-dot-com
    caBundle: |
      -----BEGIN CERTIFICATE-----
      MIIDCzCCAfOgAwIBAgIQJ... (Base64 encoded Vault CA certificate)
      -----END CERTIFICATE-----
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager
        secretRef:
          name: cert-manager-vault-token
          key: token
---
# 🔐 Self-Signed ClusterIssuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
  labels:
    issuer-type: self-signed
    environment: development
spec:
  selfSigned: {}
---
# 🎯 Root CA ClusterIssuer
apiVersion: cert-manager.io/v1
