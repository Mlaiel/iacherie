# 📊 Certificate Monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager-metrics
  namespace: cert-manager
  labels:
    app: cert-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  endpoints:
  - port: tcp-prometheus-servicemonitor
    interval: 30s
    path: /metrics
---
# 🚨 Certificate Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: certificate-alerts
  namespace: cert-manager
  labels:
    app: cert-manager
spec:
  groups:
  - name: certificate.rules
    rules:
    - alert: CertificateExpiresWithin7Days
      expr: |
        (
          certmanager_certificate_expiration_timestamp_seconds - time()
        ) / 86400 < 7
      for: 0m
      labels:
        severity: critical
        category: certificate
      annotations:
        summary: "Certificate expires within 7 days"
        description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires in {{ $value }} days"
    
    - alert: CertificateExpiresWithin30Days
      expr: |
        (
          certmanager_certificate_expiration_timestamp_seconds - time()
        ) / 86400 < 30
      for: 0m
      labels:
        severity: warning
        category: certificate
      annotations:
        summary: "Certificate expires within 30 days"
        description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires in {{ $value }} days"
    
    - alert: CertificateRenewalFailed
      expr: |
        increase(certmanager_certificate_renewal_failures_total[1h]) > 0
      for: 0m
      labels:
        severity: critical
        category: certificate
      annotations:
        summary: "Certificate renewal failed"
        description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} failed to renew"
    
    - alert: CertificateNotReady
      expr: |
        certmanager_certificate_ready_status == 0
      for: 15m
      labels:
        severity: warning
        category: certificate
      annotations:
        summary: "Certificate not ready"
        description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} is not ready"
    
    - alert: CertManagerDown
      expr: |
        up{job="cert-manager"} == 0
      for: 5m
      labels:
        severity: critical
        category: cert-manager
      annotations:
        summary: "cert-manager is down"
        description: "cert-manager has been down for more than 5 minutes"
---
# 🔄 Certificate Renewal Job
apiVersion: batch/v1
kind: CronJob
metadata:
  name: certificate-renewal-check
  namespace: cert-manager
  labels:
    app: certificate-renewal
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: certificate-renewal
          restartPolicy: OnFailure
          containers:
          - name: certificate-renewal
            image: quay.io/jetstack/cert-manager-ctl:v1.13.0
            command:
            - /bin/sh
            - -c
            - |
              # Check all certificates for renewal
              kubectl get certificates --all-namespaces -o json | \
              jq -r '.items[] | select(.status.renewalTime != null and (.status.renewalTime | fromdateiso8601) < now) | "\(.metadata.namespace)/\(.metadata.name)"' | \
              while read cert; do
                namespace=$(echo $cert | cut -d'/' -f1)
                name=$(echo $cert | cut -d'/' -f2)
                echo "Triggering renewal for certificate $name in namespace $namespace"
                kubectl annotate certificate $name -n $namespace cert-manager.io/issue-temporary-certificate="$(date +%s)" --overwrite
              done
              
              # Check for certificates expiring within 7 days
              kubectl get certificates --all-namespaces -o json | \
              jq -r '.items[] | select(.status.notAfter != null and (.status.notAfter | fromdateiso8601) - now < 604800) | "\(.metadata.namespace)/\(.metadata.name) expires \(.status.notAfter)"' | \
              while read line; do
                echo "WARNING: Certificate $line"
              done
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
---
# 📋 Certificate Inventory Report
apiVersion: batch/v1
kind: CronJob
metadata:
  name: certificate-inventory
  namespace: cert-manager
  labels:
    app: certificate-inventory
spec:
  schedule: "0 2 * * 0"  # Weekly on Sunday at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: certificate-inventory
          restartPolicy: OnFailure
          containers:
          - name: inventory
            image: quay.io/jetstack/cert-manager-ctl:v1.13.0
            command:
            - /bin/sh
            - -c
            - |
              # Generate certificate inventory report
              echo "Certificate Inventory Report - $(date)" > /tmp/certificate-report.txt
              echo "=========================================" >> /tmp/certificate-report.txt
              
              kubectl get certificates --all-namespaces -o custom-columns=NAMESPACE:.metadata.namespace,NAME:.metadata.name,READY:.status.conditions[?(@.type==\"Ready\")].status,SECRET:.spec.secretName,ISSUER:.spec.issuerRef.name,EXPIRES:.status.notAfter --sort-by='.status.notAfter' >> /tmp/certificate-report.txt
              
              # Send report via webhook
              curl -X POST \
                -H 'Content-Type: application/json' \
                -d "{\"text\": \"Weekly Certificate Inventory Report\", \"attachments\": [{\"text\": \"$(cat /tmp/certificate-report.txt)\"}]}" \
                "$SLACK_WEBHOOK_URL"
            env:
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretRef:
                  name: notification-webhooks
                  key: slack-webhook
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

