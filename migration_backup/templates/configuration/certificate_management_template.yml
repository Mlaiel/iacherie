# 🌐 Main Domain Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ainflue-com-tls
  namespace: ainflue-production
  labels:
    certificate-type: public
    domain: ainflue.com
spec:
  secretName: ainflue-com-tls-secret
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: ainflue.com
  dnsNames:
  - ainflue.com
  - www.ainflue.com
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days
  subject:
    organizationalUnits:
    - "IT Department"
    organizations:
    - "Ainflue Creator Economy Platform"
    countries:
    - "US"
    localities:
    - "San Francisco"
    provinces:
    - "California"
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
    rotationPolicy: Always
  usages:
  - digital signature
  - key encipherment
  - server auth
  keystores:
    jks:
      create: true
      passwordSecretRef:
        name: ainflue-com-jks-password
        key: password
    pkcs12:
      create: true
      passwordSecretRef:
        name: ainflue-com-p12-password
        key: password
