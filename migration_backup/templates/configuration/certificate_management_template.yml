# 🔐 CERTIFICATE BACKUP AND RECOVERY
# ===================================================================

# 💾 Certificate Backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: certificate-backup
  namespace: cert-manager
  labels:
    app: certificate-backup
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: certificate-backup
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: bitnami/kubectl:latest
            command:
            - /bin/bash
            - -c
            - |
              # Create backup directory
              BACKUP_DIR="/backup/certificates/$(date +%Y%m%d_%H%M%S)"
              mkdir -p "$BACKUP_DIR"
              
              # Backup all certificate secrets
              kubectl get secrets --all-namespaces -l certificate.cert-manager.io/certificate-name -o yaml > "$BACKUP_DIR/certificate-secrets.yaml"
              
              # Backup all certificates
              kubectl get certificates --all-namespaces -o yaml > "$BACKUP_DIR/certificates.yaml"
              
              # Backup all issuers
              kubectl get issuers,clusterissuers --all-namespaces -o yaml > "$BACKUP_DIR/issuers.yaml"
              
              # Create compressed archive
              tar -czf "$BACKUP_DIR.tar.gz" -C "$(dirname $BACKUP_DIR)" "$(basename $BACKUP_DIR)"
              rm -rf "$BACKUP_DIR"
              
              # Upload to S3
              aws s3 cp "$BACKUP_DIR.tar.gz" "s3://ainflue-certificate-backups/"
              
              # Cleanup old backups (keep 30 days)
              find /backup/certificates -name "*.tar.gz" -mtime +30 -delete
              
              echo "Certificate backup completed: $BACKUP_DIR.tar.gz"
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretRef:
                  name: certificate-backup-aws
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretRef:
                  name: certificate-backup-aws
                  key: secret-access-key
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: certificate-backup-pvc

