# 🔐 CERTIFICATE TEMPLATES AND POLICIES
# ===================================================================

# 🎯 Certificate Template for Web Services
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-service-cert-template
  namespace: cert-manager
  labels:
    template-type: web-service
data:
  template.yaml: |
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: "{{ .serviceName }}-tls"
      namespace: "{{ .namespace }}"
      labels:
        certificate-type: web-service
        service: "{{ .serviceName }}"
    spec:
      secretName: "{{ .serviceName }}-tls-secret"
      issuerRef:
        name: "{{ .issuer | default "letsencrypt-production" }}"
        kind: ClusterIssuer
      commonName: "{{ .domain }}"
      dnsNames:
      - "{{ .domain }}"
      {{- range .additionalDomains }}
      - "{{ . }}"
      {{- end }}
      duration: "{{ .duration | default "2160h" }}"
      renewBefore: "{{ .renewBefore | default "720h" }}"
      privateKey:
        algorithm: RSA
        size: 2048
      usages:
      - digital signature
      - key encipherment
      - server auth
---
# 🔒 Certificate Template for Microservices
apiVersion: v1
kind: ConfigMap
metadata:
  name: microservice-cert-template
  namespace: cert-manager
  labels:
    template-type: microservice
data:
  template.yaml: |
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: "{{ .serviceName }}-internal-tls"
      namespace: "{{ .namespace }}"
      labels:
        certificate-type: microservice
        service: "{{ .serviceName }}"
    spec:
      secretName: "{{ .serviceName }}-internal-tls-secret"
      issuerRef:
        name: vault-issuer
        kind: ClusterIssuer
      commonName: "{{ .serviceName }}.{{ .namespace }}.svc.cluster.local"
      dnsNames:
      - "{{ .serviceName }}.{{ .namespace }}.svc.cluster.local"
      - "{{ .serviceName }}"
      - "{{ .serviceName }}.{{ .namespace }}"
      duration: "8760h"
      renewBefore: "2160h"
      privateKey:
        algorithm: RSA
        size: 2048
      usages:
      - digital signature
      - key encipherment
      - server auth
      - client auth
---
# 🎯 Certificate Policy
apiVersion: v1
kind: ConfigMap
metadata:
  name: certificate-policies
  namespace: cert-manager
data:
  default-policy.yaml: |
    # Default Certificate Policy
    certificatePolicy:
      security:
        minKeySize: 2048
        allowedAlgorithms: ["RSA", "ECDSA"]
        maxValidityPeriod: "90d"
        requireSAN: true
        
      compliance:
        requireOrganization: true
        allowedOrganizations: ["Ainflue Creator Economy Platform"]
        requireCountry: true
        allowedCountries: ["US", "CA", "GB", "DE", "FR"]
        
      automation:
        autoRenewBefore: "30d"
        retryAttempts: 3
        retryInterval: "1h"
        
      validation:
        dnsValidation: true
        httpValidation: true
        emailValidation: false
  
  high-security-policy.yaml: |
    # High Security Certificate Policy
    certificatePolicy:
      security:
        minKeySize: 4096
        allowedAlgorithms: ["RSA"]
        maxValidityPeriod: "30d"
        requireSAN: true
        requireEKU: true
        allowedEKUs: ["server auth", "client auth"]
        
      compliance:
        requireOrganization: true
        allowedOrganizations: ["Ainflue Creator Economy Platform"]
        requireOU: true
        allowedOUs: ["Security", "Infrastructure"]
        requireCountry: true
        allowedCountries: ["US"]
        
      automation:
        autoRenewBefore: "7d"
        retryAttempts: 5
        retryInterval: "30m"
        
      validation:
        dnsValidation: true
        httpValidation: false
        emailValidation: false
        extendedValidation: true

