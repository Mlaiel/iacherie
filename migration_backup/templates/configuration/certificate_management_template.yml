# 🎯 Certificate Request Template for Creators
apiVersion: v1
kind: ConfigMap
metadata:
  name: creator-certificate-template
  namespace: ainflue-production
data:
  creator-cert-request.yaml: |
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: "creator-{{ .creatorId }}-cert"
      namespace: "{{ .namespace | default "ainflue-production" }}"
      labels:
        certificate-type: creator-auth
        creator-id: "{{ .creatorId }}"
        tier: "{{ .tier | default "standard" }}"
    spec:
      secretName: "creator-{{ .creatorId }}-cert-secret"
      issuerRef:
        name: vault-issuer
        kind: ClusterIssuer
      commonName: "creator-{{ .creatorId }}.ainflue.com"
      subject:
        organizationalUnits:
        - "Creator"
        - "{{ .tier | title }} Tier"
        organizations:
        - "Ainflue Creator Economy Platform"
        commonName: "{{ .creatorName }}"
      dnsNames:
      - "creator-{{ .creatorId }}.ainflue.com"
      - "{{ .creatorId }}.creators.ainflue.com"
      duration: "{{ .duration | default "8760h" }}"
      renewBefore: "{{ .renewBefore | default "2160h" }}"
      privateKey:
        algorithm: RSA
        size: 2048
      usages:
      - digital signature
      - key encipherment
      - client auth

# ===================================================================
# 🔒 CERTIFICATE RBAC AND SECURITY
# ===================================================================

# 🎯 Certificate Manager Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: certificate-manager
  namespace: cert-manager
  labels:
    app: cert-manager
---
# 🔐 Certificate RBAC
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: certificate-manager
  labels:
    app: cert-manager
rules:
- apiGroups: ["cert-manager.io"]
  resources: ["certificates", "certificaterequests", "issuers", "clusterissuers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingadmissionwebhooks", "mutatingadmissionwebhooks"]
  verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: certificate-manager
  labels:
    app: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: certificate-manager
subjects:
- kind: ServiceAccount
  name: certificate-manager
  namespace: cert-manager
---
# 🔒 Certificate Validation Webhook
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionWebhook
metadata:
  name: certificate-validation-webhook
  labels:
    app: cert-manager
webhooks:
- name: certificates.cert-manager.io
  clientConfig:
    service:
      name: cert-manager-webhook
      namespace: cert-manager
      path: /validate
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["cert-manager.io"]
    apiVersions: ["v1"]
    resources: ["certificates"]
  admissionReviewVersions: ["v1", "v1beta1"]
  sideEffects: None
  failurePolicy: Fail

