apiVersion: v1
kind: Namespace
metadata:
  name: ainflue-platform
  labels:
    name: ainflue-platform
    environment: production
---
# 🚀 KUBERNETES DEPLOYMENT TEMPLATE - DEVOPS EXPERT IMPLEMENTATION
# ================================================================
#
# Enterprise-grade Kubernetes deployment template with:
# - Multi-tier application architecture
# - Horizontal Pod Autoscaler (HPA)
# - Vertical Pod Autoscaler (VPA)
# - Network policies and security
# - Ingress with SSL termination
# - StatefulSets for databases
# - ConfigMaps and Secrets management
# - Monitoring and logging integration
# - Blue-Green and Canary deployment support
#
# Author: DevOps Expert
# Version: 1.0.0
#
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ainflue-config
  namespace: ainflue-platform
data:
  # Application configuration
  APP_ENV: "production"
  LOG_LEVEL: "info"
  API_VERSION: "v1"
  
  # Database configuration
  DB_HOST: "postgresql-service"
  DB_PORT: "5432"
  DB_NAME: "ainflue"
  
  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # External services
  ELASTICSEARCH_URL: "http://elasticsearch-service:9200"
  MONITORING_ENABLED: "true"
  
  # Feature flags
  ENABLE_AI_FEATURES: "true"
  ENABLE_ANALYTICS: "true"
  ENABLE_CACHING: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: ainflue-secrets
  namespace: ainflue-platform
type: Opaque
stringData:
  # Database credentials
  DB_PASSWORD: "your-db-password"
  DB_USER: "ainflue_user"
  
  # JWT secrets
  JWT_SECRET_KEY: "your-jwt-secret-key"
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    your-private-key-here
    -----END PRIVATE KEY-----
  
  # API keys
  OPENAI_API_KEY: "your-openai-api-key"
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  
  # External service credentials
  STRIPE_SECRET_KEY: "your-stripe-secret-key"
  SENDGRID_API_KEY: "your-sendgrid-api-key"

---
# PostgreSQL StatefulSet for persistent data
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: ainflue-platform
spec:
  serviceName: postgresql-service
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: ainflue-config
              key: DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ainflue-secrets
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ainflue-secrets
              key: DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgresql-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 5
          timeoutSeconds: 1
  volumeClaimTemplates:
  - metadata:
      name: postgresql-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 100Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
  namespace: ainflue-platform
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP

---
# Redis StatefulSet for caching and sessions
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ainflue-platform
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --maxmemory
        - "2gb"
        - --maxmemory-policy
        - "allkeys-lru"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          timeoutSeconds: 1
  volumeClaimTemplates:
  - metadata:
      name: redis-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: ainflue-platform
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP

---
# Elasticsearch for search and analytics
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: ainflue-platform
spec:
  serviceName: elasticsearch-service
  replicas: 3
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      initContainers:
      - name: increase-vm-max-map
        image: busybox
        command: ["sysctl", "-w", "vm.max_map_count=262144"]
        securityContext:
          privileged: true
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        ports:
        - containerPort: 9200
        - containerPort: 9300
        env:
        - name: cluster.name
          value: "ainflue-search"
        - name: node.name
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: discovery.seed_hosts
          value: "elasticsearch-service"
        - name: cluster.initial_master_nodes
          value: "elasticsearch-0,elasticsearch-1,elasticsearch-2"
        - name: ES_JAVA_OPTS
          value: "-Xms2g -Xmx2g"
        - name: xpack.security.enabled
          value: "false"
        volumeMounts:
        - name: elasticsearch-storage
          mountPath: /usr/share/elasticsearch/data
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 60
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 30
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: elasticsearch-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 200Gi

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: ainflue-platform
spec:
  selector:
    app: elasticsearch
  ports:
  - name: rest
    port: 9200
    targetPort: 9200
  - name: inter-node
    port: 9300
    targetPort: 9300
  type: ClusterIP

---
# Main API Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  namespace: ainflue-platform
  labels:
    app: api-backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-backend
      version: v1
  template:
    metadata:
      labels:
        app: api-backend
        version: v1
    spec:
      containers:
      - name: api-backend
        image: ainflue/api-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        envFrom:
        - configMapRef:
            name: ainflue-config
        - secretRef:
            name: ainflue-secrets
        volumeMounts:
        - name: app-config
          mountPath: /app/config
          readOnly: true
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          timeoutSeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
      volumes:
      - name: app-config
        configMap:
          name: ainflue-config
      imagePullSecrets:
      - name: registry-secret

---
apiVersion: v1
kind: Service
metadata:
  name: api-backend-service
  namespace: ainflue-platform
spec:
  selector:
    app: api-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

---
# AI Processing Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-processing
  namespace: ainflue-platform
  labels:
    app: ai-processing
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ai-processing
      version: v1
  template:
    metadata:
      labels:
        app: ai-processing
        version: v1
    spec:
      containers:
      - name: ai-processing
        image: ainflue/ai-processing:latest
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          value: "8001"
        - name: GPU_ENABLED
          value: "true"
        envFrom:
        - configMapRef:
            name: ainflue-config
        - secretRef:
            name: ainflue-secrets
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
          limits:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          timeoutSeconds: 30
          periodSeconds: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 30
          timeoutSeconds: 10
          periodSeconds: 30
      nodeSelector:
        gpu: "true"
      tolerations:
      - key: "gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: ai-processing-service
  namespace: ainflue-platform
spec:
  selector:
    app: ai-processing
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP

---
# Frontend Web Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: ainflue-platform
  labels:
    app: frontend-web
    version: v1
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend-web
      version: v1
  template:
    metadata:
      labels:
        app: frontend-web
        version: v1
    spec:
      containers:
      - name: frontend-web
        image: ainflue/frontend-web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: API_BASE_URL
          value: "https://api.ainflue.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          timeoutSeconds: 2
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web-service
  namespace: ainflue-platform
spec:
  selector:
    app: frontend-web
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP

---
# Worker Service for Background Tasks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: ainflue-platform
  labels:
    app: worker-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: worker-service
      version: v1
  template:
    metadata:
      labels:
        app: worker-service
        version: v1
    spec:
      containers:
      - name: worker
        image: ainflue/worker-service:latest
        env:
        - name: WORKER_CONCURRENCY
          value: "4"
        - name: WORKER_PREFETCH
          value: "1"
        envFrom:
        - configMapRef:
            name: ainflue-config
        - secretRef:
            name: ainflue-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import sys; sys.exit(0)"
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 30

---
# Horizontal Pod Autoscaler for API Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-backend-hpa
  namespace: ainflue-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max

---
# Horizontal Pod Autoscaler for Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-web-hpa
  namespace: ainflue-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-web
  minReplicas: 4
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70

---
# Ingress Controller with SSL Termination
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ainflue-ingress
  namespace: ainflue-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  tls:
  - hosts:
    - ainflue.com
    - www.ainflue.com
    - api.ainflue.com
    secretName: ainflue-tls
  rules:
  - host: ainflue.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-web-service
            port:
              number: 3000
  - host: www.ainflue.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-web-service
            port:
              number: 3000
  - host: api.ainflue.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-backend-service
            port:
              number: 8000

---
# Network Policy for Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ainflue-network-policy
  namespace: ainflue-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: nginx-ingress
    - namespaceSelector:
        matchLabels:
          name: ainflue-platform
  - from: []
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 3000
  egress:
  - {}

---
# Pod Disruption Budget for High Availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-backend-pdb
  namespace: ainflue-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-backend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-web-pdb
  namespace: ainflue-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: frontend-web

---
# ServiceMonitor for Prometheus Monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ainflue-metrics
  namespace: ainflue-platform
  labels:
    app: ainflue-platform
spec:
  selector:
    matchLabels:
      app: api-backend
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
# Vertical Pod Autoscaler for AI Processing
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ai-processing-vpa
  namespace: ainflue-platform
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-processing
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: ai-processing
      minAllowed:
        cpu: 1000m
        memory: 2Gi
      maxAllowed:
        cpu: 8000m
        memory: 16Gi
      controlledResources: ["cpu", "memory"]

---
# CronJob for Database Backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: ainflue-platform
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: db-backup
            image: postgres:15-alpine
            command:
            - /bin/bash
            - -c
            - |
              pg_dump -h postgresql-service -U $POSTGRES_USER -d $POSTGRES_DB > /backup/dump_$(date +%Y%m%d_%H%M%S).sql
              # Upload to S3 or your backup storage
            env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ainflue-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ainflue-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ainflue-config
                  key: DB_NAME
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-pvc
          restartPolicy: OnFailure

---
# Persistent Volume Claim for Backups
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: ainflue-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "standard"
  resources:
    requests:
      storage: 500Gi

---
# RBAC Configuration
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ainflue-service-account
  namespace: ainflue-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ainflue-platform
  name: ainflue-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ainflue-role-binding
  namespace: ainflue-platform
subjects:
- kind: ServiceAccount
  name: ainflue-service-account
  namespace: ainflue-platform
roleRef:
  kind: Role
  name: ainflue-role
  apiGroup: rbac.authorization.k8s.io