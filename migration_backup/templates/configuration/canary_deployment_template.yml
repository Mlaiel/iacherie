      steps:
      - setWeight: 2   # Very conservative for payments
      - pause:
          duration: 5m
      - analysis:
          templates:
          - templateName: payment-success-rate
          - templateName: payment-latency
          - templateName: payment-fraud-rate
          args:
          - name: service-name
            value: ainflue-payment-service
      - setWeight: 5
      - pause:
          duration: 15m
      - analysis:
          templates:
          - templateName: payment-success-rate
          - templateName: payment-latency
          - templateName: payment-fraud-rate
          - templateName: payment-revenue-impact
          args:
          - name: service-name
            value: ainflue-payment-service
      - setWeight: 10
      - pause:
          duration: 30m
      - analysis:
          templates:
          - templateName: payment-success-rate
          - templateName: payment-latency
          - templateName: payment-fraud-rate
          - templateName: payment-revenue-impact
          args:
          - name: service-name
            value: ainflue-payment-service
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 60  # Longer for payment service
  selector:
    matchLabels:
      app: ainflue-payment-service
  template:
    metadata:
      labels:
        app: ainflue-payment-service
        version: stable
    spec:
      containers:
      - name: payment-service
        image: ainflue/payment-service:v1.0.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PAYMENT_PROCESSOR_VERSION
          value: "stable"
        - name: FRAUD_DETECTION_MODE
          value: "strict"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi

# ===================================================================
# 📊 CANARY ANALYSIS TEMPLATES
# ===================================================================

# 🎨 Content Processing Analysis
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: content-processing-success
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  metrics:
  - name: content-processing-success-rate
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(content_processing_total{service="{{args.service-name}}",status="success"}[5m])) /
          sum(rate(content_processing_total{service="{{args.service-name}}"}[5m]))
    successCondition: result[0] >= 0.98
    interval: 2m
    count: 5
    failureLimit: 2
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: content-processing-latency
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  metrics:
  - name: content-processing-latency-p99
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          histogram_quantile(0.99,
            sum(rate(content_processing_duration_seconds_bucket{service="{{args.service-name}}"}[5m])) by (le)
          )
    successCondition: result[0] <= 30  # 30 seconds for content processing
    interval: 2m
    count: 5
    failureLimit: 2
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ai-processing-accuracy
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  metrics:
  - name: ai-processing-accuracy
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(ai_processing_accuracy_total{service="{{args.service-name}}"}[10m])) /
          sum(rate(ai_processing_total{service="{{args.service-name}}"}[10m]))
    successCondition: result[0] >= 0.95
    interval: 5m
    count: 3
    failureLimit: 1
---
# 💰 Payment Service Analysis
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: payment-success-rate
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  metrics:
  - name: payment-success-rate
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(payment_transactions_total{service="{{args.service-name}}",status="success"}[5m])) /
          sum(rate(payment_transactions_total{service="{{args.service-name}}"}[5m]))
    successCondition: result[0] >= 0.995  # 99.5% success rate for payments
    interval: 1m
    count: 10
    failureLimit: 1
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: payment-latency
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  metrics:
  - name: payment-latency-p95
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          histogram_quantile(0.95,
            sum(rate(payment_duration_seconds_bucket{service="{{args.service-name}}"}[5m])) by (le)
          )
    successCondition: result[0] <= 3  # 3 seconds for payments
    interval: 1m
    count: 10
    failureLimit: 2
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: payment-fraud-rate
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  metrics:
  - name: payment-fraud-rate
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(rate(payment_fraud_detected_total{service="{{args.service-name}}"}[5m])) /
          sum(rate(payment_transactions_total{service="{{args.service-name}}"}[5m]))
    successCondition: result[0] <= 0.001  # Less than 0.1% fraud rate
    interval: 2m
    count: 5
    failureLimit: 1
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: payment-revenue-impact
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  metrics:
  - name: payment-revenue-impact
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          (
            sum(rate(payment_amount_total{service="{{args.service-name}}",version="canary"}[10m])) -
            sum(rate(payment_amount_total{service="{{args.service-name}}",version="stable"}[10m])) * 0.05
          ) / sum(rate(payment_amount_total{service="{{args.service-name}}",version="stable"}[10m])) * 0.05
    successCondition: result[0] >= -0.05  # No more than 5% revenue impact
    interval: 5m
    count: 3
    failureLimit: 1

