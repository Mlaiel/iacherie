# 🎯 ISTIO CANARY DEPLOYMENT CONFIGURATION
# ===================================================================

# 🌐 Istio Virtual Service for Canary
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ainflue-api-canary-vs
  namespace: ainflue-production
spec:
  hosts:
  - api.ainflue.com
  - ainflue-api.ainflue-production.svc.cluster.local
  gateways:
  - ainflue-gateway
  - mesh
  http:
  - match:
    - headers:
        canary:
          exact: "true"
    route:
    - destination:
        host: ainflue-api.ainflue-production.svc.cluster.local
        subset: canary
      weight: 100
    fault:
      delay:
        percentage:
          value: 0.5
        fixedDelay: 100ms  # Slight delay for canary
    headers:
      request:
        set:
          x-canary-request: "true"
      response:
        set:
          x-served-by: "canary"
  - match:
    - headers:
        x-user-type:
          exact: "beta"
    route:
    - destination:
        host: ainflue-api.ainflue-production.svc.cluster.local
        subset: canary
      weight: 100
    headers:
      request:
        set:
          x-beta-user: "true"
      response:
        set:
          x-served-by: "canary-beta"
  - match:
    - uri:
        prefix: "/api/v1/"
    route:
    - destination:
        host: ainflue-api.ainflue-production.svc.cluster.local
        subset: stable
      weight: 95
    - destination:
        host: ainflue-api.ainflue-production.svc.cluster.local
        subset: canary
      weight: 5
    headers:
      request:
        set:
          x-deployment-type: "canary-split"
    fault:
      abort:
        percentage:
          value: 0.001
        httpStatus: 503
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,gateway-error,connect-failure,refused-stream
---
# 🎯 Istio Destination Rule for Canary
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ainflue-api-canary-dr
  namespace: ainflue-production
spec:
  host: ainflue-api.ainflue-production.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      simple: LEAST_REQUEST
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 5s
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
        maxRetries: 3
        idleTimeout: 90s
    circuitBreaker:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    outlierDetection:
      consecutive5xxErrors: 5
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
  subsets:
  - name: stable
    labels:
      version: stable
    trafficPolicy:
      loadBalancer:
        simple: ROUND_ROBIN
  - name: canary
    labels:
      version: canary
    trafficPolicy:
      loadBalancer:
        simple: LEAST_REQUEST
      connectionPool:
        tcp:
          maxConnections: 50
        http:
          http1MaxPendingRequests: 50
          http2MaxRequests: 500
      circuitBreaker:
        consecutiveGatewayErrors: 3
        interval: 15s
        baseEjectionTime: 15s
        maxEjectionPercent: 30

# ===================================================================
# 🔗 LINKERD CANARY DEPLOYMENT CONFIGURATION
# ===================================================================

# 🎯 Linkerd Traffic Split for Canary
apiVersion: split.smi-spec.io/v1alpha1
kind: TrafficSplit
metadata:
  name: ainflue-api-canary-split
  namespace: ainflue-production
  annotations:
    split.smi-spec.io/canary: "true"
spec:
  service: ainflue-api
  backends:
  - service: ainflue-api-stable
    weight: 95
  - service: ainflue-api-canary
    weight: 5
---
# 🎯 Linkerd Service Profile for Canary
apiVersion: linkerd.io/v1alpha2
kind: ServiceProfile
metadata:
  name: ainflue-api-canary
  namespace: ainflue-production
spec:
  routes:
  - name: api-routes
    condition:
      method: GET
      pathRegex: "/api/v1/.*"
    responseClasses:
    - condition:
        status:
          min: 200
          max: 299
      isFailure: false
    - condition:
        status:
          min: 500
          max: 599
      isFailure: true
    timeout: 30s
    retryBudget:
      retryRatio: 0.1
      minRetriesPerSecond: 5
      ttl: 10s
  - name: canary-routes
    condition:
      method: POST
      pathRegex: "/api/v1/.*"
      headers:
      - name: "x-canary"
        value: "true"
    responseClasses:
    - condition:
        status:
          min: 200
          max: 299
      isFailure: false
    - condition:
        status:
          min: 400
          max: 499
      isFailure: false
    - condition:
        status:
          min: 500
          max: 599
      isFailure: true
    timeout: 45s
    retryBudget:
      retryRatio: 0.05
      minRetriesPerSecond: 2
      ttl: 15s

# ===================================================================
# 🌐 CONSUL CONNECT CANARY DEPLOYMENT
# ===================================================================

# 🎯 Consul Service Splitter for Canary
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-canary-splitter
  namespace: consul
data:
  canary-splitter.hcl: |
    # IA Chéries API Canary Service Splitter
    Kind = "service-splitter"
    Name = "ainflue-api"
    Namespace = "ainflue-production"
    Splits = [
      {
        Weight = 95
        Service = "ainflue-api-stable"
        Namespace = "ainflue-production"
        ServiceSubset = "stable"
        RequestHeaders {
          Set = {
            "x-version" = "stable"
            "x-deployment" = "production"
          }
        }
        ResponseHeaders {
          Set = {
            "x-served-by" = "stable"
            "x-canary-weight" = "95"
          }
        }
      },
      {
        Weight = 5
        Service = "ainflue-api-canary"
        Namespace = "ainflue-production"
        ServiceSubset = "canary"
        RequestHeaders {
          Set = {
            "x-version" = "canary"
            "x-deployment" = "canary"
            "x-canary-request" = "true"
          }
        }
        ResponseHeaders {
          Set = {
            "x-served-by" = "canary"
            "x-canary-weight" = "5"
            "x-experimental" = "true"
          }
        }
      }
    ]
---
# 🎯 Consul Service Router for Canary Features
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-canary-router
  namespace: consul
data:
  canary-router.hcl: |
    # IA Chéries API Canary Service Router
    Kind = "service-router"
    Name = "ainflue-api"
    Namespace = "ainflue-production"
    Routes = [
      {
        Match {
          HTTP {
            Header = [
              {
                Name = "x-canary"
                Exact = "true"
              }
            ]
          }
        }
        Destination {
          Service = "ainflue-api-canary"
          Namespace = "ainflue-production"
          ServiceSubset = "canary"
          RequestHeaders {
            Set = {
              "x-force-canary" = "true"
            }
          }
          ResponseHeaders {
            Set = {
              "x-canary-forced" = "true"
            }
          }
        }
      },
      {
        Match {
          HTTP {
            Header = [
              {
                Name = "x-user-type"
                Exact = "beta"
              }
            ]
          }
        }
        Destination {
          Service = "ainflue-api-canary"
          Namespace = "ainflue-production"
          ServiceSubset = "canary"
          RequestHeaders {
            Set = {
              "x-beta-user" = "true"
            }
          }
        }
      },
      {
        Match {
          HTTP {
            Header = [
              {
                Name = "x-feature-flag"
                Regex = ".*new-api.*"
              }
            ]
          }
        }
        Destination {
          Service = "ainflue-api-canary"
          Namespace = "ainflue-production"
          ServiceSubset = "canary"
          RequestHeaders {
            Set = {
              "x-feature-enabled" = "true"
            }
          }
        }
      }
    ]

