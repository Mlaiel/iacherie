# 🎯 ADVANCED CANARY FEATURES
# ===================================================================

# 🧪 Experiment Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-experiment-config
  namespace: ainflue-system
data:
  experiments.yaml: |
    # Canary Experiment Configuration
    experiments:
      # A/B Testing Integration
      abTesting:
        enabled: true
        framework: "optimizely"  # optimizely, launchdarkly, split
        config:
          sdkKey: "optimizely-sdk-key"
          projectId: "ainflue-experiments"
        experiments:
          - name: "new-payment-flow"
            trafficAllocation: 10
            variations:
              - name: "control"
                weight: 50
                service: "ainflue-payment-service-stable"
              - name: "treatment"
                weight: 50
                service: "ainflue-payment-service-canary"
            metrics:
              - "conversion_rate"
              - "payment_success_rate"
              - "user_satisfaction"
          - name: "enhanced-content-processor"
            trafficAllocation: 20
            variations:
              - name: "control"
                weight: 70
                service: "ainflue-content-processor-stable"
              - name: "treatment"
                weight: 30
                service: "ainflue-content-processor-canary"
            metrics:
              - "processing_speed"
              - "quality_score"
              - "user_engagement"
      
      # Feature Flag Integration
      featureFlags:
        enabled: true
        provider: "launchdarkly"
        config:
          sdkKey: "launchdarkly-sdk-key"
          environment: "production"
        flags:
          - name: "canary-routing-enabled"
            defaultValue: false
            targeting:
              rules:
                - variation: true
                  clauses:
                    - attribute: "user_type"
                      op: "in"
                      values: ["beta", "internal"]
          - name: "new-api-version"
            defaultValue: false
            targeting:
              rollout:
                variations:
                  - variation: false
                    weight: 95000
                  - variation: true
                    weight: 5000
      
      # Chaos Engineering
      chaosEngineering:
        enabled: true
        framework: "chaos-mesh"  # chaos-mesh, litmus, gremlin
        experiments:
          - name: "canary-network-latency"
            target: "canary"
            type: "network-delay"
            config:
              latency: "100ms"
              jitter: "10ms"
              correlation: "100"
            schedule: "0 */6 * * *"  # Every 6 hours
          - name: "canary-pod-failure"
            target: "canary"
            type: "pod-kill"
            config:
              mode: "one"
            schedule: "0 0 * * 1"  # Weekly on Monday
          - name: "canary-cpu-stress"
            target: "canary"
            type: "stress-cpu"
            config:
              workers: 1
              load: 50
              duration: "2m"
            schedule: "0 */12 * * *"  # Every 12 hours

