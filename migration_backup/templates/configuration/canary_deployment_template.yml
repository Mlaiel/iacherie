# CANARY DEPLOYMENT CONFIGURATION TEMPLATE
# Enterprise-grade canary deployment for service mesh environments
# Multi-mesh support: Istio, Linkerd, Consul Connect, Argo Rollouts
# ===================================================================

# 🚀 Global Canary Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-deployment-config
  namespace: ainflue-system
  labels:
    app: canary-deployment
    component: global-config
data:
  canary-config.yaml: |
    # Global Canary Deployment Configuration
    canaryDeployment:
      # Strategy Configuration
      strategy:
        type: "progressive"  # progressive, blue-green, a-b
        trafficSplit:
          initial: 5           # Initial percentage
          increment: 5         # Increment step
          maxWeight: 50        # Maximum canary weight
          interval: "5m"       # Time between increments
        rollback:
          automatic: true
          threshold:
            errorRate: 0.05    # 5% error rate
            latencyP99: 1000   # 1 second P99 latency
            successRate: 0.95  # 95% success rate
        promotion:
          automatic: false     # Manual promotion
          criteria:
            errorRate: 0.01    # < 1% error rate
            latencyP99: 500    # < 500ms P99 latency
            successRate: 0.99  # > 99% success rate
            duration: "30m"    # Minimum stable duration
      
      # Analysis Configuration
      analysis:
        enabled: true
        interval: "1m"
        successCondition: |
          result[0] >= 0.99 and result[1] <= 0.01 and result[2] <= 500
        failureLimit: 3
        inconclusiveLimit: 2
        metrics:
          - name: "success-rate"
            provider: "prometheus"
            query: |
              sum(rate(http_requests_total{status=~"2.."}[2m])) /
              sum(rate(http_requests_total[2m]))
            successCondition: "result[0] >= 0.99"
            interval: "1m"
            count: 5
          - name: "error-rate"
            provider: "prometheus"
            query: |
              sum(rate(http_requests_total{status=~"5.."}[2m])) /
              sum(rate(http_requests_total[2m]))
            successCondition: "result[0] <= 0.01"
            interval: "1m"
            count: 5
          - name: "latency-p99"
            provider: "prometheus"
            query: |
              histogram_quantile(0.99,
                sum(rate(http_request_duration_seconds_bucket[2m])) by (le)
              )
            successCondition: "result[0] <= 0.5"
            interval: "1m"
            count: 5
      
      # Notification Configuration
      notifications:
        enabled: true
        triggers:
          - "canary-started"
          - "canary-promoted"
          - "canary-failed"
          - "canary-completed"
        channels:
          slack:
            enabled: true
            webhook: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX"
            channel: "#deployments"
          email:
            enabled: true
            smtp:
              host: "smtp.ainflue.com"
              port: 587
              username: "deploy-bot@ainflue.com"
              password: "smtp-password"
            recipients:
              - "platform-team@ainflue.com"
              - "oncall@ainflue.com"
          webhook:
            enabled: true
            endpoints:
              - "https://api.datadog.com/api/v1/events"
              - "https://api.pagerduty.com/incidents"
      
      # Feature Flag Integration
      featureFlags:
        enabled: true
        provider: "launchdarkly"  # launchdarkly, flagsmith, unleash
        config:
          sdkKey: "sdk-key-here"
          environment: "production"
        flags:
          - name: "canary-routing"
            defaultValue: false
            variations:
              - value: false
                name: "stable"
              - value: true
                name: "canary"
---
# 🎯 Argo Rollouts Configuration
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ainflue-api-rollout
  namespace: ainflue-production
  labels:
    app: ainflue-api
    component: rollout
spec:
  replicas: 10
  strategy:
    canary:
      # Traffic Routing
      trafficRouting:
        istio:
          virtualService:
            name: ainflue-api-vs
            routes:
            - primary
          destinationRule:
            name: ainflue-api-dr
            canarySubsetName: canary
            stableSubsetName: stable
      # Canary Steps
      steps:
      - setWeight: 5
      - pause:
          duration: 2m
      - analysis:
          templates:
          - templateName: success-rate
          - templateName: error-rate
          - templateName: latency-p99
          args:
          - name: service-name
            value: ainflue-api
          - name: namespace
            value: ainflue-production
      - setWeight: 10
      - pause:
          duration: 5m
      - analysis:
          templates:
          - templateName: success-rate
          - templateName: error-rate
          - templateName: latency-p99
          args:
          - name: service-name
            value: ainflue-api
      - setWeight: 25
      - pause:
          duration: 10m
      - analysis:
          templates:
          - templateName: success-rate
          - templateName: error-rate
          - templateName: latency-p99
          args:
          - name: service-name
            value: ainflue-api
      - setWeight: 50
      - pause:
          duration: 15m
      - analysis:
          templates:
          - templateName: success-rate
          - templateName: error-rate
          - templateName: latency-p99
          args:
          - name: service-name
            value: ainflue-api
      # Auto Promotion
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
      abortScaleDownDelaySeconds: 30
      # Analysis at Promotion
      analysis:
        templates:
        - templateName: final-analysis
        args:
        - name: service-name
          value: ainflue-api
        - name: duration
          value: 30m
  selector:
    matchLabels:
      app: ainflue-api
  template:
    metadata:
      labels:
        app: ainflue-api
        version: stable
    spec:
      containers:
      - name: ainflue-api
        image: ainflue/api:v1.0.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: VERSION
          value: "stable"
        - name: CANARY_ENABLED
          value: "false"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
# 📊 Rollout Analysis Templates
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  - name: namespace
    value: ainflue-production
  metrics:
  - name: success-rate
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(irate(
            istio_requests_total{reporter="destination",destination_service_name="{{args.service-name}}",destination_service_namespace="{{args.namespace}}",response_code!~"5.*"}[2m]
          )) /
          sum(irate(
            istio_requests_total{reporter="destination",destination_service_name="{{args.service-name}}",destination_service_namespace="{{args.namespace}}"}[2m]
          ))
    successCondition: result[0] >= 0.99
    interval: 1m
    count: 5
    failureLimit: 3
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  - name: namespace
    value: ainflue-production
  metrics:
  - name: error-rate
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(irate(
            istio_requests_total{reporter="destination",destination_service_name="{{args.service-name}}",destination_service_namespace="{{args.namespace}}",response_code=~"5.*"}[2m]
          )) /
          sum(irate(
            istio_requests_total{reporter="destination",destination_service_name="{{args.service-name}}",destination_service_namespace="{{args.namespace}}"}[2m]
          ))
    successCondition: result[0] <= 0.01
    interval: 1m
    count: 5
    failureLimit: 3
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: latency-p99
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  - name: namespace
    value: ainflue-production
  metrics:
  - name: latency-p99
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          histogram_quantile(0.99,
            sum(irate(
              istio_request_duration_milliseconds_bucket{reporter="destination",destination_service_name="{{args.service-name}}",destination_service_namespace="{{args.namespace}}"}[2m]
            )) by (le)
          )
    successCondition: result[0] <= 500
    interval: 1m
    count: 5
    failureLimit: 3
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: final-analysis
  namespace: ainflue-production
spec:
  args:
  - name: service-name
  - name: duration
    value: 30m
  metrics:
  - name: success-rate
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(irate(
            istio_requests_total{reporter="destination",destination_service_name="{{args.service-name}}",response_code!~"5.*"}[{{args.duration}}]
          )) /
          sum(irate(
            istio_requests_total{reporter="destination",destination_service_name="{{args.service-name}}"}[{{args.duration}}]
          ))
    successCondition: result[0] >= 0.995
    interval: 5m
    count: 6
  - name: error-rate
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          sum(irate(
            istio_requests_total{reporter="destination",destination_service_name="{{args.service-name}}",response_code=~"5.*"}[{{args.duration}}]
          )) /
          sum(irate(
            istio_requests_total{reporter="destination",destination_service_name="{{args.service-name}}"}[{{args.duration}}]
          ))
    successCondition: result[0] <= 0.005
    interval: 5m
    count: 6
  - name: latency-p99
    provider:
      prometheus:
        address: http://prometheus.monitoring.svc.cluster.local:9090
        query: |
          histogram_quantile(0.99,
            sum(irate(
              istio_request_duration_milliseconds_bucket{reporter="destination",destination_service_name="{{args.service-name}}"}[{{args.duration}}]
            )) by (le)
          )
    successCondition: result[0] <= 300
    interval: 5m
    count: 6

