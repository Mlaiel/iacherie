# 📢 Notification Templates
apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-notification-templates
  namespace: ainflue-system
data:
  slack-templates.yaml: |
    # Slack Notification Templates
    templates:
      canary-started:
        text: |
          🚀 Canary deployment started for service `{{ .ObjectMeta.Name }}`
          
          📊 **Deployment Details:**
          • Service: `{{ .ObjectMeta.Name }}`
          • Namespace: `{{ .ObjectMeta.Namespace }}`
          • New Image: `{{ .Spec.Template.Spec.Containers[0].Image }}`
          • Initial Weight: `{{ .Spec.Strategy.Canary.Steps[0].SetWeight }}%`
          
          🔍 **Monitoring:**
          • Dashboard: [View Metrics](https://grafana.ainflue.com/d/canary-dashboard)
          • Logs: [View Logs](https://kibana.ainflue.com)
          
          ⏰ Next step in {{ .Spec.Strategy.Canary.Steps[0].Pause.Duration }}
        color: "good"
        
      canary-promoted:
        text: |
          ✅ Canary deployment promoted for service `{{ .ObjectMeta.Name }}`
          
          🎉 **Promotion Successful:**
          • Service: `{{ .ObjectMeta.Name }}`
          • Final Weight: 100%
          • Duration: {{ .Status.Canary.StablePingPong.PingPong.Delay }}
          
          📈 **Performance Metrics:**
          • Success Rate: {{ .Status.Canary.StablePingPong.PingPong.SuccessRate }}%
          • Error Rate: {{ .Status.Canary.StablePingPong.PingPong.ErrorRate }}%
          • Avg Latency: {{ .Status.Canary.StablePingPong.PingPong.AvgLatency }}ms
        color: "good"
        
      canary-failed:
        text: |
          ❌ Canary deployment failed for service `{{ .ObjectMeta.Name }}`
          
          🚨 **Failure Details:**
          • Service: `{{ .ObjectMeta.Name }}`
          • Reason: {{ .Status.Message }}
          • Failed at Weight: {{ .Status.Canary.StablePingPong.PingPong.CurrentWeight }}%
          
          🔄 **Rollback Status:**
          • Auto-rollback: {{ if .Spec.Strategy.Canary.Analysis.Templates }}Enabled{{ else }}Disabled{{ end }}
          • Stable Version: `{{ .Status.StableRevision }}`
          
          🔍 **Investigation:**
          • Dashboard: [View Metrics](https://grafana.ainflue.com/d/canary-dashboard)
          • Alerts: [View Alerts](https://alertmanager.ainflue.com)
        color: "danger"
  
  email-templates.yaml: |
    # Email Notification Templates
    templates:
      canary-started:
        subject: "🚀 Canary Deployment Started - {{ .ObjectMeta.Name }}"
        body: |
          <h2>Canary Deployment Started</h2>
          <p>A new canary deployment has been initiated for the service <strong>{{ .ObjectMeta.Name }}</strong>.</p>
          
          <h3>Deployment Details:</h3>
          <ul>
            <li><strong>Service:</strong> {{ .ObjectMeta.Name }}</li>
            <li><strong>Namespace:</strong> {{ .ObjectMeta.Namespace }}</li>
            <li><strong>New Image:</strong> {{ .Spec.Template.Spec.Containers[0].Image }}</li>
            <li><strong>Initial Weight:</strong> {{ .Spec.Strategy.Canary.Steps[0].SetWeight }}%</li>
            <li><strong>Next Step:</strong> {{ .Spec.Strategy.Canary.Steps[0].Pause.Duration }}</li>
          </ul>
          
          <h3>Monitoring Links:</h3>
          <ul>
            <li><a href="https://grafana.ainflue.com/d/canary-dashboard">Grafana Dashboard</a></li>
            <li><a href="https://kibana.ainflue.com">Application Logs</a></li>
            <li><a href="https://argocd.ainflue.com">Argo CD Console</a></li>
          </ul>
          
          <p>This is an automated notification from the IA Chéries Platform.</p>

