# 🎨 Content Processor Canary Rollout
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ainflue-content-processor-rollout
  namespace: ainflue-production
  labels:
    app: ainflue-content-processor
    component: rollout
spec:
  replicas: 6
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: ainflue-content-processor-vs
            routes:
            - primary
          destinationRule:
            name: ainflue-content-processor-dr
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
      - setWeight: 10
      - pause:
          duration: 3m
      - analysis:
          templates:
          - templateName: content-processing-success
          - templateName: content-processing-latency
          args:
          - name: service-name
            value: ainflue-content-processor
      - setWeight: 25
      - pause:
          duration: 10m
      - analysis:
          templates:
          - templateName: content-processing-success
          - templateName: content-processing-latency
          - templateName: ai-processing-accuracy
          args:
          - name: service-name
            value: ainflue-content-processor
      - setWeight: 50
      - pause:
          duration: 20m
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
  selector:
    matchLabels:
      app: ainflue-content-processor
  template:
    metadata:
      labels:
        app: ainflue-content-processor
        version: stable
    spec:
      containers:
      - name: content-processor
        image: ainflue/content-processor:v1.0.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: AI_MODEL_VERSION
          value: "stable"
        - name: PROCESSING_MODE
          value: "production"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
---
# 💰 Payment Service Canary Rollout
