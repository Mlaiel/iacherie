# ===================================================================
# 📊 LINKERD OBSERVABILITY & MONITORING
# ===================================================================

# 📈 Custom Metrics Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: linkerd-custom-metrics
  namespace: linkerd
data:
  custom_metrics.yaml: |
    customMetrics:
      - name: ainflue_creator_requests_total
        help: "Total requests to creator services"
        type: counter
        labels:
          - creator_id
          - service_type
          - response_code
      - name: ainflue_content_processing_duration_seconds
        help: "Content processing duration"
        type: histogram
        buckets: [0.1, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0, 120.0, 300.0]
        labels:
          - content_type
          - processing_stage
      - name: ainflue_revenue_generated_total
        help: "Total revenue generated by creators"
        type: counter
        labels:
          - creator_id
          - revenue_source
          - currency
---
# 🔧 Linkerd Health Check Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: linkerd-healthcheck
  namespace: linkerd
data:
  healthcheck.yaml: |
    healthcheck:
      proxy:
        enabled: true
        path: "/ready"
        port: 4191
        interval: 30s
        timeout: 5s
        successThreshold: 1
        failureThreshold: 3
      control-plane:
        enabled: true
        components:
          - controller
          - identity
          - proxy-injector
        interval: 60s
        timeout: 10s
      data-plane:
        enabled: true
        namespaces:
          - ainflue-production
          - ainflue-staging
        interval: 30s
        timeout: 5s

# ===================================================================
# 🔒 LINKERD SECURITY CONFIGURATIONS
# ===================================================================

# 🛡️ mTLS Policy Configuration
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: ainflue-mesh-tls
  namespace: ainflue-production
spec:
  identities:
  - "ainflue-api.ainflue-production.serviceaccount.identity.linkerd.cluster.local"
  - "ainflue-frontend.ainflue-production.serviceaccount.identity.linkerd.cluster.local"
  - "ainflue-content-processor.ainflue-production.serviceaccount.identity.linkerd.cluster.local"
  - "ainflue-monetization.ainflue-production.serviceaccount.identity.linkerd.cluster.local"
---
# 🔐 Network Authentication Policy
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: ainflue-network-auth
  namespace: ainflue-production
spec:
  networks:
  - cidr: "10.0.0.0/8"
    except:
    - "10.255.0.0/16"
  - cidr: "172.16.0.0/12"
  - cidr: "192.168.0.0/16"

# ===================================================================
# 🚀 LINKERD PERFORMANCE OPTIMIZATIONS
# ===================================================================

# ⚡ Proxy Performance Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: linkerd-proxy-performance
  namespace: linkerd
data:
  performance.yaml: |
    proxy:
      performance:
        connectionPooling:
          enabled: true
          maxConnections: 1024
          maxPendingRequests: 1024
          maxRequests: 1024
          maxRetries: 3
        circuitBreaker:
          enabled: true
          maxConnections: 1024
          maxPendingRequests: 1024
          maxRequests: 1024
          maxRetries: 3
          consecutiveGatewayErrors: 5
          interval: 30s
          baseEjectionTime: 30s
          maxEjectionPercent: 50
        outlierDetection:
          enabled: true
          consecutiveGatewayErrors: 5
          consecutive5xxErrors: 5
          interval: 30s
          baseEjectionTime: 30s
          maxEjectionPercent: 50
          minHealthPercent: 50
        retryPolicy:
          retryOn: "gateway-error,connect-failure,refused-stream"
          numRetries: 3
          perTryTimeout: 15s
          retryHostPredicate:
          - name: "previous_hosts"
          hostSelectionRetryMaxAttempts: 5
        loadBalancing:
          policy: "round_robin"
          healthyPanicThreshold: 50.0
        timeouts:
          requestTimeout: 15s
          connectTimeout: 5s
          streamIdleTimeout: 300s
          requestHeadersTimeout: 5s

# ===================================================================
# 📝 LINKERD ENTERPRISE FEATURES
# ===================================================================

# 🏢 Enterprise Policy Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: linkerd-enterprise-config
  namespace: linkerd
data:
  enterprise.yaml: |
    enterprise:
      multiCluster:
        enabled: true
        crossClusterTrafficPolicy: "allow"
        failoverPolicy: "automatic"
        loadBalancing: "locality"
      rbac:
        enabled: true
        strictMode: true
        auditLogging: true
      compliance:
        pci:
          enabled: true
          encryptionAtRest: true
          encryptionInTransit: true
        hipaa:
          enabled: true
          auditLogging: true
          dataClassification: true
        gdpr:
          enabled: true
          dataRetention: "30d"
          anonymization: true
      disaster_recovery:
        enabled: true
        backupSchedule: "0 2 * * *"
        retentionPeriod: "30d"
        crossRegionReplication: true

