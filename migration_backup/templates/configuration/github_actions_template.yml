name: 🎵 IA Chéries Creator Economy Platform - CI/CD Pipeline

# Trigger configuration for comprehensive automation
on:
  # Main branch push (production deployments)
  push:
    branches:
      - main
      - production
      - release/*
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  
  # Pull request validation
  pull_request:
    branches:
      - main
      - develop
      - staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  
  # Manual trigger for deployment control
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      
      deploy_frontend:
        description: 'Deploy frontend services'
        required: false
        default: true
        type: boolean
      
      deploy_backend:
        description: 'Deploy backend services'
        required: false
        default: true
        type: boolean
      
      deploy_ai_services:
        description: 'Deploy AI/ML services'
        required: false
        default: true
        type: boolean
      
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: false
        type: boolean
  
  # Scheduled security scans and maintenance
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

# Environment variables for the entire workflow
env:
  # Project metadata
  PROJECT_NAME: ainflue
  PLATFORM_VERSION: ${{ github.sha }}
  BUILD_NUMBER: ${{ github.run_number }}
  
  # Docker configuration
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  
  # Node.js and Python versions
  NODE_VERSION: '20.10.0'
  PYTHON_VERSION: '3.11.6'
  
  # Kubernetes configuration
  KUBECTL_VERSION: '1.28.0'
  HELM_VERSION: '3.13.0'
  
  # Security and compliance
  SECURITY_SCAN_ENABLED: true
  DEPENDENCY_CHECK_ENABLED: true
  PERFORMANCE_TEST_ENABLED: true
  
  # Creator Economy specific
  AI_MODEL_CACHE: /tmp/ai-models
  CONTENT_PROCESSING_CACHE: /tmp/content-cache

# Global permissions for all jobs
permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

# =====================================================================================
# JOBS PIPELINE
# =====================================================================================

jobs:

  # =====================================================================================
  # VALIDATION AND SETUP
  # =====================================================================================
  
  setup-and-validate:
    name: 🔍 Setup & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    outputs:
      should-deploy: ${{ steps.changes.outputs.should-deploy }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
      ai-services-changed: ${{ steps.changes.outputs.ai-services }}
      infrastructure-changed: ${{ steps.changes.outputs.infrastructure }}
      security-scan-required: ${{ steps.security-check.outputs.scan-required }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🔍 Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'web/**'
              - 'ui/**'
              - 'package.json'
              - 'yarn.lock'
            backend:
              - 'backend/**'
              - 'api/**'
              - 'services/**'
              - 'requirements*.txt'
              - 'Pipfile*'
            ai-services:
              - 'ai/**'
              - 'ml/**'
              - 'models/**'
              - 'requirements-ml.txt'
            infrastructure:
              - 'terraform/**'
              - 'k8s/**'
              - 'docker/**'
              - 'Dockerfile*'
              - 'docker-compose*.yml'
            security:
              - 'security/**'
              - 'auth/**'
              - '.github/workflows/**'
              - 'requirements-security.txt'
            should-deploy:
              - 'frontend/**'
              - 'backend/**'
              - 'api/**'
              - 'services/**'
              - 'ai/**'
              - 'ml/**'
      
      - name: 🛡️ Security scan requirement check
        id: security-check
        run: |
          if [[ "${{ steps.changes.outputs.security }}" == "true" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "scan-required=true" >> $GITHUB_OUTPUT
          else
            echo "scan-required=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 📊 Workflow summary
        run: |
          echo "## 🎵 IA Chéries CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** ${{ env.BUILD_NUMBER }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ env.PLATFORM_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Changed:** ${{ steps.changes.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Changed:** ${{ steps.changes.outputs.backend }}" >> $GITHUB_STEP_SUMMARY
          echo "**AI Services Changed:** ${{ steps.changes.outputs.ai-services }}" >> $GITHUB_STEP_SUMMARY
          echo "**Infrastructure Changed:** ${{ steps.changes.outputs.infrastructure }}" >> $GITHUB_STEP_SUMMARY

  # =====================================================================================
  # SECURITY AND COMPLIANCE SCANS
  # =====================================================================================
  
  security-scan:
    name: 🛡️ Security & Compliance Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup-and-validate
    if: needs.setup-and-validate.outputs.security-scan-required == 'true'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔐 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: 📤 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: 🔍 Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,python
          config-file: ./.github/codeql/codeql-config.yml
      
      - name: 🏗️ Autobuild for CodeQL
        uses: github/codeql-action/autobuild@v3
      
      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript,python"
      
      - name: 🔐 Dependency vulnerability check
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      
      - name: 📄 Generate security report
        run: |
          echo "## 🛡️ Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy scan completed" >> $GITHUB_STEP_SUMMARY
          echo "- CodeQL analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency check completed" >> $GITHUB_STEP_SUMMARY

  # =====================================================================================
  # FRONTEND BUILD AND TEST
  # =====================================================================================
  
  frontend-pipeline:
    name: 🎨 Frontend Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup-and-validate
    if: needs.setup-and-validate.outputs.frontend-changed == 'true' || github.event.inputs.deploy_frontend == 'true'
    
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
        os: [ubuntu-latest]
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run postinstall || true
      
      - name: 🔍 Lint code
        working-directory: ./frontend
        run: |
          npm run lint
          npm run lint:css
          npm run format:check
      
      - name: 🧪 Run unit tests
        working-directory: ./frontend
        env:
          CI: true
          NODE_ENV: test
        run: |
          npm run test:unit -- --coverage --watchAll=false
          npm run test:integration -- --watchAll=false
      
      - name: 📊 Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
      
      - name: 🏗️ Build application
        working-directory: ./frontend
        env:
          NODE_ENV: production
          REACT_APP_API_URL: ${{ vars.API_URL }}
          REACT_APP_VERSION: ${{ env.PLATFORM_VERSION }}
          REACT_APP_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          npm run build
          npm run analyze
      
      - name: 🔍 Bundle analysis
        working-directory: ./frontend
        run: |
          npm run bundle-analyzer || true
          echo "## 📦 Frontend Build Results" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully" >> $GITHUB_STEP_SUMMARY
      
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ matrix.node-version }}
          path: frontend/build/
          retention-days: 7

  # =====================================================================================
  # BACKEND BUILD AND TEST
  # =====================================================================================
  
  backend-pipeline:
    name: 🔧 Backend Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: setup-and-validate
    if: needs.setup-and-validate.outputs.backend-changed == 'true' || github.event.inputs.deploy_backend == 'true'
    
    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ainflue_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7.2.1
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ml.txt
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-ml.txt
      
      - name: 🔍 Lint code
        run: |
          flake8 backend/ api/ services/
          black --check backend/ api/ services/
          isort --check-only backend/ api/ services/
          mypy backend/ api/ services/
      
      - name: 🧪 Run unit tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ainflue_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          JWT_SECRET: test-jwt-secret
          ENCRYPTION_KEY: test-encryption-key-32-chars
        run: |
          pytest backend/tests/ -v --cov=backend --cov-report=xml --cov-report=term
          pytest api/tests/ -v --cov=api --cov-append --cov-report=xml
          pytest services/tests/ -v --cov=services --cov-append --cov-report=xml
      
      - name: 📊 Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
      
      - name: 🧪 Integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ainflue_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest tests/integration/ -v --timeout=300
      
      - name: 🔧 Database migration test
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ainflue_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  # =====================================================================================
  # AI/ML SERVICES PIPELINE
  # =====================================================================================
  
  ai-services-pipeline:
    name: 🤖 AI/ML Services Pipeline
    runs-on: ubuntu-latest-gpu
    timeout-minutes: 60
    needs: setup-and-validate
    if: needs.setup-and-validate.outputs.ai-services-changed == 'true' || github.event.inputs.deploy_ai_services == 'true'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 🔄 Cache AI models
        uses: actions/cache@v3
        with:
          path: ${{ env.AI_MODEL_CACHE }}
          key: ai-models-${{ hashFiles('ai/models/*.json') }}
          restore-keys: |
            ai-models-
      
      - name: 📦 Install AI/ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
      
      - name: 🧪 AI model validation tests
        env:
          CUDA_VISIBLE_DEVICES: 0
          AI_MODEL_CACHE: ${{ env.AI_MODEL_CACHE }}
        run: |
          pytest ai/tests/ -v --timeout=600
          pytest ml/tests/ -v --timeout=600
      
      - name: 🎯 Model performance benchmarks
        env:
          CUDA_VISIBLE_DEVICES: 0
        run: |
          python ai/benchmarks/run_benchmarks.py
          python ml/benchmarks/performance_test.py
      
      - name: 📊 Upload AI test results
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-results
          path: |
            ai/test-results/
            ml/benchmark-results/
          retention-days: 7

  # =====================================================================================
  # DOCKER BUILD AND PUSH
  # =====================================================================================
  
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [frontend-pipeline, backend-pipeline, ai-services-pipeline]
    if: always() && (needs.frontend-pipeline.result == 'success' || needs.backend-pipeline.result == 'success' || needs.ai-services-pipeline.result == 'success')
    
    strategy:
      matrix:
        service:
          - name: frontend
            dockerfile: ./frontend/Dockerfile
            context: ./frontend
          - name: api-gateway
            dockerfile: ./api/Dockerfile
            context: ./api
          - name: content-service
            dockerfile: ./services/content/Dockerfile
            context: ./services/content
          - name: ai-service
            dockerfile: ./ai/Dockerfile
            context: ./ai
          - name: protection-service
            dockerfile: ./services/protection/Dockerfile
            context: ./services/protection
          - name: monetization-service
            dockerfile: ./services/monetization/Dockerfile
            context: ./services/monetization
          - name: analytics-service
            dockerfile: ./services/analytics/Dockerfile
            context: ./services/analytics
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.3
            network=host
      
      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📥 Download build artifacts
        if: matrix.service.name == 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-20.x
          path: frontend/build/
      
      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.PLATFORM_VERSION }}
          labels: |
            org.opencontainers.image.title=IA Chéries ${{ matrix.service.name }}
            org.opencontainers.image.description=Creator Economy Platform - ${{ matrix.service.name }}
            org.opencontainers.image.vendor=Fahed Mlaiel
            ainflue.service.name=${{ matrix.service.name }}
            ainflue.build.number=${{ env.BUILD_NUMBER }}
            ainflue.platform.version=${{ env.PLATFORM_VERSION }}
      
      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_VERSION=${{ env.PLATFORM_VERSION }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            NODE_ENV=production
            PYTHON_ENV=production

  # =====================================================================================
  # INFRASTRUCTURE DEPLOYMENT
  # =====================================================================================
  
  infrastructure-deploy:
    name: 🏗️ Infrastructure Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup-and-validate, docker-build]
    if: needs.setup-and-validate.outputs.infrastructure-changed == 'true' && github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://app.ainflue.com
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: 🏗️ Terraform Init
        working-directory: ./terraform
        run: terraform init
      
      - name: 📋 Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan -var="image_tag=${{ env.PLATFORM_VERSION }}" -out=tfplan
      
      - name: 🚀 Terraform Apply
        working-directory: ./terraform
        if: github.ref == 'refs/heads/main'
        run: terraform apply tfplan
      
      - name: ⚙️ Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}
      
      - name: 🔧 Configure kubectl
        run: |
          aws eks update-kubeconfig --region us-east-1 --name ainflue-production
      
      - name: 🚀 Deploy to Kubernetes
        working-directory: ./k8s
        run: |
          kubectl apply -f namespace.yaml
          kubectl apply -f configmaps/
          kubectl apply -f secrets/
          kubectl apply -f deployments/
          kubectl apply -f services/
          kubectl apply -f ingress/

  # =====================================================================================
  # APPLICATION DEPLOYMENT
  # =====================================================================================
  
  application-deploy:
    name: 🚀 Application Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build, infrastructure-deploy]
    if: always() && needs.docker-build.result == 'success' && github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://app.ainflue.com
    
    strategy:
      matrix:
        service: [frontend, api-gateway, content-service, ai-service, protection-service, monetization-service, analytics-service]
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: ⚙️ Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}
      
      - name: 🔧 Configure kubectl
        run: |
          aws eks update-kubeconfig --region us-east-1 --name ainflue-production
      
      - name: 🚀 Deploy ${{ matrix.service }}
        run: |
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:${{ env.PLATFORM_VERSION }} \
            -n ainflue-production
          
          kubectl rollout status deployment/${{ matrix.service }} -n ainflue-production --timeout=300s
      
      - name: 🔍 Verify deployment
        run: |
          kubectl get pods -n ainflue-production -l app=${{ matrix.service }}
          kubectl logs -n ainflue-production -l app=${{ matrix.service }} --tail=50

  # =====================================================================================
  # POST-DEPLOYMENT TESTS
  # =====================================================================================
  
  post-deployment-tests:
    name: 🧪 Post-Deployment Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: application-deploy
    if: always() && needs.application-deploy.result == 'success'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔍 Health check tests
        run: |
          curl -f https://api.ainflue.com/health || exit 1
          curl -f https://app.ainflue.com/health || exit 1
      
      - name: 🧪 API integration tests
        env:
          API_BASE_URL: https://api.ainflue.com
          TEST_USER_TOKEN: ${{ secrets.TEST_USER_TOKEN }}
        run: |
          pytest tests/e2e/ -v --timeout=300 --api-url=$API_BASE_URL
      
      - name: 📊 Performance tests
        env:
          API_BASE_URL: https://api.ainflue.com
        run: |
          artillery run tests/performance/load-test.yml
      
      - name: 🔐 Security validation
        run: |
          nmap -sV api.ainflue.com
          testssl.sh --fast api.ainflue.com

  # =====================================================================================
  # NOTIFICATION AND CLEANUP
  # =====================================================================================
  
  notification:
    name: 📢 Notification & Cleanup
    runs-on: ubuntu-latest
    if: always()
    needs: [security-scan, frontend-pipeline, backend-pipeline, ai-services-pipeline, docker-build, application-deploy, post-deployment-tests]
    
    steps:
      - name: 📊 Deployment status
        run: |
          echo "## 🎵 IA Chéries Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ env.PLATFORM_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ env.BUILD_NUMBER }}" >> $GITHUB_STEP_SUMMARY
          echo "**Security Scan:** ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** ${{ needs.frontend-pipeline.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** ${{ needs.backend-pipeline.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**AI Services:** ${{ needs.ai-services-pipeline.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Build:** ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment:** ${{ needs.application-deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Post-Tests:** ${{ needs.post-deployment-tests.result }}" >> $GITHUB_STEP_SUMMARY
      
      - name: 💬 Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          username: 'IA Chéries CI/CD'
          icon_emoji: ':musical_note:'
          title: 'IA Chéries Creator Platform Deployment'
          text: |
            Version: ${{ env.PLATFORM_VERSION }}
            Build: ${{ env.BUILD_NUMBER }}
            Status: ${{ job.status }}
            Environment: Production
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: 📧 Email notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '🚨 IA Chéries Deployment Failed - Build ${{ env.BUILD_NUMBER }}'
          to: fahed.mlaiel@ainflue.com
          from: 'IA Chéries CI/CD <noreply@ainflue.com>'
          body: |
            Deployment failed for version ${{ env.PLATFORM_VERSION }}
            Build number: ${{ env.BUILD_NUMBER }}
            
            Please check the GitHub Actions logs for details.
            
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}

