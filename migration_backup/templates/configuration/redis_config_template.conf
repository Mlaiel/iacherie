# Redis Configuration Template for Ainflue Platform
# In-memory data structure store for caching, sessions, and real-time features

# Basic Configuration
################################## INCLUDES ###################################
# include /path/to/local.conf
# include /path/to/other.conf

################################## MODULES #####################################
# loadmodule /path/to/my_module.so
# loadmodule /path/to/other_module.so

################################## NETWORK #####################################
# Accept connections on the specified port (default 6379)
port 6379

# Accept connections from any IP address
bind 0.0.0.0

# Set the max number of connected clients
maxclients 10000

# Close the connection after a client is idle for N seconds
timeout 300

# TCP keepalive
tcp-keepalive 300

# TCP backlog
tcp-backlog 511

################################# TLS/SSL ######################################
# tls-port 6380
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt

################################# GENERAL #####################################
# Run as a daemon
daemonize yes

# Process ID file
pidfile /var/run/redis/redis-server.pid

# Log level (debug, verbose, notice, warning)
loglevel notice

# Log file
logfile /var/log/redis/redis-server.log

# Number of databases (0-15)
databases 16

# Always show a ASCII art logo
always-show-logo yes

# Set the server verbosity to 'debug'
# It can be one of: debug, verbose, notice, warning
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"

################################ SNAPSHOTTING  ################################
# Save the DB on disk:
# save <seconds> <changes>
# Will save the DB if both the given number of seconds and the given
# number of write operations against the DB occurred.

save 900 1      # Save if at least 1 key changed in 900 seconds
save 300 10     # Save if at least 10 keys changed in 300 seconds  
save 60 10000   # Save if at least 10000 keys changed in 60 seconds

# Compress string objects using LZF when dump .rdb databases
rdbcompression yes

# Checksum the RDB file
rdbchecksum yes

# The filename where to dump the DB
dbfilename dump.rdb

# The working directory
dir /var/lib/redis

################################# REPLICATION #################################
# Master-Replica replication for high availability
# replicaof <masterip> <masterport>

# If the master is password protected
# masterauth <master-password>

# Serve stale data when the link with the master is down
replica-serve-stale-data yes

# Read-only replica
replica-read-only yes

# Disable TCP_NODELAY on the replica socket
repl-disable-tcp-nodelay no

# Set the replica priority
replica-priority 100

################################## SECURITY ###################################
# Require clients to authenticate
requirepass ${REDIS_PASSWORD}

# Rename dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command SHUTDOWN REDIS_SHUTDOWN_${REDIS_SHUTDOWN_KEY}
rename-command CONFIG REDIS_CONFIG_${REDIS_CONFIG_KEY}
rename-command DEBUG ""

################################### CLIENTS ####################################
# Set the max number of connected clients at the same time
maxclients 10000

############################## MEMORY MANAGEMENT #############################
# Set a memory usage limit
maxmemory ${REDIS_MAX_MEMORY:2gb}

# Memory eviction policy
maxmemory-policy allkeys-lru

# Memory usage samples for LRU/LFU algorithms
maxmemory-samples 5

# Limit memory usage for replica output buffers
replica-output-buffer-limit normal 256mb 64mb 60
replica-output-buffer-limit pubsub 32mb 8mb 60

# Limit memory usage for client output buffers
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

############################# LAZY FREEING ####################################
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

############################ KERNEL OOM CONTROL ##############################
oom-score-adj no

#################### KERNEL TRANSPARENT HUGEPAGE CONTROL ######################
disable-thp yes

############################## APPEND ONLY FILE ###############################
# Enable AOF persistence
appendonly yes

# AOF file name
appendfilename "appendonly.aof"

# AOF sync policy
appendfsync everysec

# Don't fsync during rewrites
no-appendfsync-on-rewrite no

# Automatic AOF rewrite
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load truncated AOF file
aof-load-truncated yes

# Use AOF-RDB format
aof-use-rdb-preamble yes

################################ LUA SCRIPTING  ###############################
# Max execution time for Lua scripts in milliseconds
lua-time-limit 5000

################################ REDIS CLUSTER  ###############################
# Enable cluster mode
# cluster-enabled yes

# Cluster configuration file
# cluster-config-file nodes-6379.conf

# Cluster node timeout
# cluster-node-timeout 15000

# Minimum number of replica nodes
# cluster-require-full-coverage yes

################################## SLOW LOG ###################################
# Log queries slower than specified time (microseconds)
slowlog-log-slower-than 10000

# Maximum length of slow log
slowlog-max-len 128

################################ LATENCY MONITOR ##############################
# Enable latency monitoring
latency-monitor-threshold 100

############################# EVENT NOTIFICATION ##############################
# Keyspace notifications
notify-keyspace-events "Ex"

############################### ADVANCED CONFIG ###############################
# Hash table settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List settings
list-max-ziplist-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512

# Sorted set settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog settings
hll-sparse-max-bytes 3000

# Streams settings
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client query buffer limits
client-query-buffer-limit 1gb

# Protocol buffer limits
proto-max-bulk-len 512mb

# Frequency of running the background task
hz 10

# Enable dynamic HZ
dynamic-hz yes

# AOF rewrite incremental fsync
aof-rewrite-incremental-fsync yes

# RDB save incremental fsync
rdb-save-incremental-fsync yes

# JEMalloc background thread
jemalloc-bg-thread yes

# EOF marker for CONFIG REWRITE
# Generated by CONFIG REWRITE

---
# Redis Sentinel Configuration for High Availability

# Sentinel Configuration
port 26379

# Sentinel announce IP
# sentinel announce-ip 1.2.3.4

# Monitor master
sentinel monitor ainflue-master ${REDIS_MASTER_IP} 6379 2

# Authentication
sentinel auth-pass ainflue-master ${REDIS_PASSWORD}

# Down after period
sentinel down-after-milliseconds ainflue-master 30000

# Parallel syncs
sentinel parallel-syncs ainflue-master 1

# Failover timeout
sentinel failover-timeout ainflue-master 180000

# Deny scripts reconfig
sentinel deny-scripts-reconfig yes

# Notification script
# sentinel notification-script ainflue-master /var/redis/notify.sh

# Client reconfig script
# sentinel client-reconfig-script ainflue-master /var/redis/reconfig.sh

# Log file
logfile /var/log/redis/sentinel.log

# Working directory
dir /var/lib/redis

---
# Redis Cluster Configuration

# Basic cluster settings
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-announce-ip ${REDIS_NODE_IP}
cluster-announce-port 6379
cluster-announce-bus-port 16379

# Cluster failure detection
cluster-require-full-coverage no

# Migration settings
cluster-migration-barrier 1
cluster-allow-reads-when-down no

---
# Redis ACL Configuration (Redis 6+)

# Default user configuration
user default on >password ~* &* -@dangerous +@all

# Application user for Ainflue
user ainflue-app on >${REDIS_APP_PASSWORD} ~ainflue:* +@read +@write +@stream +@connection +@transaction -@dangerous

# Read-only user for analytics
user ainflue-readonly on >${REDIS_READONLY_PASSWORD} ~ainflue:* +@read +@connection -@write -@dangerous

# Admin user for management
user ainflue-admin on >${REDIS_ADMIN_PASSWORD} ~* &* +@all

# Monitoring user
user ainflue-monitor on >${REDIS_MONITOR_PASSWORD} ~* +@read +info +ping +client +config +latency -@write -@dangerous

---
# Redis Usage Patterns for Ainflue Platform

# Cache Configuration
################################ CACHING ######################################

# User session storage
# Key pattern: session:{sessionId}
# Expiry: 24 hours (86400 seconds)
# Value: JSON with user data

# API response caching
# Key pattern: api:cache:{endpoint}:{params_hash}
# Expiry: 5-60 minutes depending on data volatility
# Value: JSON response

# Creator profile caching
# Key pattern: creator:profile:{creatorId}
# Expiry: 1 hour (3600 seconds)
# Value: Creator profile JSON

# Campaign data caching
# Key pattern: campaign:{campaignId}
# Expiry: 30 minutes (1800 seconds)
# Value: Campaign details JSON

################################ RATE LIMITING ################################

# Rate limiting for API endpoints
# Key pattern: rate_limit:{userId}:{endpoint}
# Expiry: Based on rate limit window
# Value: Request count

# Example rate limit implementation:
# INCR rate_limit:user123:api_create_campaign
# EXPIRE rate_limit:user123:api_create_campaign 3600
# IF count > limit THEN reject request

################################ REAL-TIME FEATURES ###########################

# WebSocket connection tracking
# Key pattern: websocket:connections:{userId}
# Value: Set of connection IDs

# Real-time notifications
# Key pattern: notifications:{userId}
# Value: List of notification objects

# Live campaign metrics
# Key pattern: campaign:live:{campaignId}
# Value: Hash of real-time metrics

################################ QUEUES & JOBS #################################

# Background job queues
# Key pattern: queue:{queue_name}
# Value: List of job objects

# Job status tracking
# Key pattern: job:{jobId}:status
# Value: Job status and progress

################################ LEADERBOARDS ##################################

# Creator performance leaderboard
# Key pattern: leaderboard:creators:engagement
# Value: Sorted set with scores

# Campaign performance tracking
# Key pattern: leaderboard:campaigns:roi
# Value: Sorted set with ROI scores

################################ GEOSPATIAL ####################################

# Creator location tracking
# Key pattern: geo:creators
# Value: Geospatial index of creator locations

# Event location mapping
# Key pattern: geo:events
# Value: Geospatial index of events

