# Redis Monitoring and Maintenance

# Health check script
#!/bin/bash
redis-cli --no-auth-warning -a $REDIS_PASSWORD ping

# Memory usage monitoring
redis-cli --no-auth-warning -a $REDIS_PASSWORD info memory

# Slow query monitoring
redis-cli --no-auth-warning -a $REDIS_PASSWORD slowlog get 10

# Key space analysis
redis-cli --no-auth-warning -a $REDIS_PASSWORD --bigkeys

# Latency monitoring
redis-cli --no-auth-warning -a $REDIS_PASSWORD --latency-history

# Performance monitoring script
#!/bin/bash
echo "=== Redis Performance Report ==="
echo "Date: $(date)"
echo ""
echo "=== Memory Usage ==="
redis-cli --no-auth-warning -a $REDIS_PASSWORD info memory | grep used_memory_human
echo ""
echo "=== Connected Clients ==="
redis-cli --no-auth-warning -a $REDIS_PASSWORD info clients | grep connected_clients
echo ""
echo "=== Operations per Second ==="
redis-cli --no-auth-warning -a $REDIS_PASSWORD info stats | grep instantaneous_ops_per_sec
echo ""
echo "=== Key Space ==="
redis-cli --no-auth-warning -a $REDIS_PASSWORD info keyspace
echo ""
echo "=== Slow Queries ==="
redis-cli --no-auth-warning -a $REDIS_PASSWORD slowlog get 5

---
# Redis Backup and Restore

# Backup script
#!/bin/bash
BACKUP_DIR="/backups/redis/$(date +%Y%m%d_%H%M%S)"
mkdir -p $BACKUP_DIR

# Create RDB snapshot
redis-cli --no-auth-warning -a $REDIS_PASSWORD BGSAVE

# Wait for backup to complete
while [ $(redis-cli --no-auth-warning -a $REDIS_PASSWORD LASTSAVE) -eq $(redis-cli --no-auth-warning -a $REDIS_PASSWORD LASTSAVE) ]; do
  sleep 1
done

# Copy RDB file
cp /var/lib/redis/dump.rdb $BACKUP_DIR/

# Copy AOF file if enabled
if [ -f /var/lib/redis/appendonly.aof ]; then
  cp /var/lib/redis/appendonly.aof $BACKUP_DIR/
fi

# Upload to S3
aws s3 cp $BACKUP_DIR s3://ainflue-db-backups/redis/ --recursive

echo "Backup completed: $BACKUP_DIR"

# Restore script
#!/bin/bash
BACKUP_PATH=$1
if [ -z "$BACKUP_PATH" ]; then
  echo "Usage: $0 <backup_path>"
  exit 1
fi

# Stop Redis
systemctl stop redis

# Restore files
cp $BACKUP_PATH/dump.rdb /var/lib/redis/
if [ -f $BACKUP_PATH/appendonly.aof ]; then
  cp $BACKUP_PATH/appendonly.aof /var/lib/redis/
fi

# Set ownership
chown redis:redis /var/lib/redis/*

# Start Redis
systemctl start redis

echo "Restore completed from: $BACKUP_PATH"