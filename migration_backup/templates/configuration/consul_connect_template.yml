# 🔧 Consul Server Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-server-config
  namespace: consul
  labels:
    app: consul
    component: server
data:
  server.hcl: |
    datacenter = "ainflue-dc1"
    data_dir = "/consul/data"
    log_level = "INFO"
    node_name = "consul-server"
    bind_addr = "0.0.0.0"
    client_addr = "0.0.0.0"
    
    # Server Configuration
    server = true
    bootstrap_expect = 3
    retry_join = ["consul-server-0.consul-server.consul.svc.cluster.local",
                 "consul-server-1.consul-server.consul.svc.cluster.local",
                 "consul-server-2.consul-server.consul.svc.cluster.local"]
    
    # UI Configuration
    ui_config {
      enabled = true
    }
    
    # Connect Configuration
    connect {
      enabled = true
    }
    
    # Ports Configuration
    ports {
      grpc = 8502
      grpc_tls = 8503
    }
    
    # ACL Configuration
    acl = {
      enabled = true
      default_policy = "deny"
      enable_token_persistence = true
      tokens = {
        initial_management = "ainflue-consul-bootstrap-token"
      }
    }
    
    # TLS Configuration
    tls {
      defaults {
        ca_file = "/consul/tls/ca/tls.crt"
        cert_file = "/consul/tls/server/tls.crt"
        key_file = "/consul/tls/server/tls.key"
        verify_incoming = true
        verify_outgoing = true
        verify_server_hostname = true
      }
    }
    
    # Encryption
    encrypt = "ainflue-consul-encryption-key-base64"
    encrypt_verify_incoming = true
    encrypt_verify_outgoing = true
    
    # Performance
    performance {
      raft_multiplier = 1
    }
    
    # Logging
    log_rotate_duration = "24h"
    log_rotate_max_files = 30
    
    # Metrics
    telemetry {
      prometheus_retention_time = "60s"
      disable_hostname = true
      metrics_prefix = "consul.ainflue"
    }
---
# 🚀 Consul Server StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul-server
  namespace: consul
  labels:
    app: consul
    component: server
spec:
  serviceName: consul-server
  replicas: 3
  selector:
    matchLabels:
      app: consul
      component: server
  template:
    metadata:
      labels:
        app: consul
        component: server
      annotations:
        consul.hashicorp.com/connect-inject: "false"
    spec:
      serviceAccountName: consul-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: consul
        image: "hashicorp/consul:1.17.0"
        imagePullPolicy: IfNotPresent
        command:
        - "/bin/sh"
        - "-ec"
        - |
          CONSUL_FULLNAME="consul"
          
          exec /usr/local/bin/docker-entrypoint.sh consul agent \
            -config-dir=/consul/config \
            -advertise="${ADVERTISE_IP}" \
            -bind="0.0.0.0" \
            -bootstrap-expect=3 \
            -client="0.0.0.0" \
            -config-dir="/consul/config" \
            -datacenter=ainflue-dc1 \
            -data-dir="/consul/data" \
            -domain=cluster.local \
            -hcl="connect { enabled = true }" \
            -log-level=INFO \
            -retry-join="${CONSUL_FULLNAME}-server-0.${CONSUL_FULLNAME}-server.${NAMESPACE}.svc.cluster.local" \
            -retry-join="${CONSUL_FULLNAME}-server-1.${CONSUL_FULLNAME}-server.${NAMESPACE}.svc.cluster.local" \
            -retry-join="${CONSUL_FULLNAME}-server-2.${CONSUL_FULLNAME}-server.${NAMESPACE}.svc.cluster.local" \
            -serf-lan-port=8301 \
            -server
        env:
        - name: ADVERTISE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CONSUL_DISABLE_PERM_MGMT
          value: "true"
        ports:
        - containerPort: 8500
          name: http
        - containerPort: 8501
          name: https
        - containerPort: 8502
          name: grpc
        - containerPort: 8503
          name: grpc-tls
        - containerPort: 8301
          name: serflan-tcp
          protocol: TCP
        - containerPort: 8301
          name: serflan-udp
          protocol: UDP
        - containerPort: 8302
          name: serfwan-tcp
          protocol: TCP
        - containerPort: 8302
          name: serfwan-udp
          protocol: UDP
        - containerPort: 8300
          name: server
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - |
              curl http://127.0.0.1:8500/v1/status/leader \
              2>/dev/null | grep -E '".+"'
          failureThreshold: 2
          initialDelaySeconds: 5
          periodSeconds: 3
          successThreshold: 1
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - |
              curl http://127.0.0.1:8500/v1/status/leader \
              2>/dev/null | grep -E '".+"'
          failureThreshold: 2
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 1
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: data
          mountPath: /consul/data
        - name: config
          mountPath: /consul/config
        - name: tls-ca
          mountPath: /consul/tls/ca
          readOnly: true
        - name: tls-server
          mountPath: /consul/tls/server
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: consul-server-config
      - name: tls-ca
        secret:
          secretName: consul-ca-cert
      - name: tls-server
        secret:
          secretName: consul-server-cert
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
# 🌐 Consul Server Service
apiVersion: v1
kind: Service
metadata:
  name: consul-server
  namespace: consul
  labels:
    app: consul
    component: server
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: http
    port: 8500
    targetPort: 8500
  - name: https
    port: 8501
    targetPort: 8501
  - name: grpc
    port: 8502
    targetPort: 8502
  - name: grpc-tls
    port: 8503
    targetPort: 8503
  - name: serflan-tcp
    protocol: TCP
    port: 8301
    targetPort: 8301
  - name: serflan-udp
    protocol: UDP
    port: 8301
    targetPort: 8301
  - name: serfwan-tcp
    protocol: TCP
    port: 8302
    targetPort: 8302
  - name: serfwan-udp
    protocol: UDP
    port: 8302
    targetPort: 8302
  - name: server
    port: 8300
    targetPort: 8300
  selector:
    app: consul
    component: server
