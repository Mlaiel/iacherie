# 🚀 Consul Connect Injector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consul-connect-injector
  namespace: consul
  labels:
    app: consul
    component: connect-injector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consul
      component: connect-injector
  template:
    metadata:
      labels:
        app: consul
        component: connect-injector
      annotations:
        consul.hashicorp.com/connect-inject: "false"
    spec:
      serviceAccountName: consul-connect-injector
      containers:
      - name: sidecar-injector
        image: "hashicorp/consul-k8s-control-plane:1.3.0"
        imagePullPolicy: IfNotPresent
        command:
        - "/bin/sh"
        - "-ec"
        - |
          CONSUL_FULLNAME="consul"
          
          consul-k8s-control-plane inject-connect \
            -default-inject=false \
            -consul-image="hashicorp/consul:1.17.0" \
            -consul-k8s-image="hashicorp/consul-k8s-control-plane:1.3.0" \
            -log-level=INFO \
            -log-json=false \
            -consul-node-name=k8s-cluster \
            -listen=:8080 \
            -default-protocol="http" \
            -allow-k8s-namespace="*" \
            -enable-namespaces=true \
            -consul-destination-namespace="default" \
            -enable-k8s-namespace-mirroring=true \
            -k8s-namespace-mirroring-prefix="" \
            -consul-cross-namespace-acl-policy="" \
            -default-enable-merging-metrics=true \
            -default-merged-metrics-port=20100 \
            -default-prometheus-scrape-port=20200 \
            -default-prometheus-scrape-path="/metrics" \
            -init-container-memory-request=25Mi \
            -init-container-memory-limit=150Mi \
            -init-container-cpu-request=50m \
            -init-container-cpu-limit=50m \
            -sidecar-proxy-memory-request=100Mi \
            -sidecar-proxy-memory-limit=100Mi \
            -sidecar-proxy-cpu-request=100m \
            -sidecar-proxy-cpu-limit=100m \
            -set-iptables-for-init=true \
            -default-envoy-proxy-concurrency=2 \
            -lifecycle-sidecar-memory-request=25Mi \
            -lifecycle-sidecar-memory-limit=50Mi \
            -lifecycle-sidecar-cpu-request=20m \
            -lifecycle-sidecar-cpu-limit=20m
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        livenessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTP
          failureThreshold: 2
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTP
          failureThreshold: 2
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        ports:
        - containerPort: 8080
          name: webhook-port
        resources:
          requests:
            cpu: 50m
            memory: 50Mi
          limits:
            cpu: 500m
            memory: 150Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 5995
        volumeMounts:
        - name: webhook-certs
          mountPath: /etc/webhook/certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          secretName: consul-connect-injector-certs
---
# 🔒 Consul Connect Injector ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: consul-connect-injector
  namespace: consul
  labels:
    app: consul
    component: connect-injector
---
