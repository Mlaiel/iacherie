# MongoDB Configuration Template for Ainflue Platform
# NoSQL database configuration for content metadata and user interactions

# Basic Configuration
storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      # Cache size should be 50% of available RAM
      cacheSizeGB: ${MONGODB_CACHE_SIZE_GB:4}
      directoryForIndexes: false
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# Network settings
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 1000
  compression:
    compressors: "snappy,zstd"

# Process management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# Security settings
security:
  authorization: enabled
  keyFile: /etc/mongodb/mongodb-keyfile
  clusterAuthMode: keyFile
  javascriptEnabled: false

# Replication settings for high availability
replication:
  replSetName: ainflue-replica-set
  oplogSizeMB: 2048

# Sharding configuration (for large-scale deployments)
sharding:
  clusterRole: shardsvr

# Logging
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen
  verbosity: 1
  component:
    accessControl:
      verbosity: 1
    command:
      verbosity: 1
    query:
      verbosity: 1
    write:
      verbosity: 1

# Profiling for performance monitoring
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100
  slowOpSampleRate: 0.5

# Monitoring and metrics
setParameter:
  enableLocalhostAuthBypass: false
  authenticationMechanisms: SCRAM-SHA-1,SCRAM-SHA-256
  diagnosticDataCollectionEnabled: true
  
  # Performance tuning
  wiredTigerConcurrentReadTransactions: 128
  wiredTigerConcurrentWriteTransactions: 128
  
  # Connection pooling
  connPoolMaxShardedConnsPerHost: 200
  connPoolMaxConnsPerHost: 200
  
  # Query execution settings
  internalQueryExecMaxBlockingSortBytes: 134217728
  internalQueryPlannerMaxIndexedSolutions: 64

---
# MongoDB Users and Roles Configuration

# Admin user creation script
db.createUser({
  user: "${MONGODB_ADMIN_USER}",
  pwd: "${MONGODB_ADMIN_PASSWORD}",
  roles: [
    { role: "userAdminAnyDatabase", db: "admin" },
    { role: "readWriteAnyDatabase", db: "admin" },
    { role: "dbAdminAnyDatabase", db: "admin" },
    { role: "clusterAdmin", db: "admin" }
  ]
});

# Application database user
use ainflue;

db.createUser({
  user: "${MONGODB_APP_USER}",
  pwd: "${MONGODB_APP_PASSWORD}",
  roles: [
    { role: "readWrite", db: "ainflue" },
    { role: "dbAdmin", db: "ainflue" }
  ]
});

# Read-only user for analytics
db.createUser({
  user: "${MONGODB_READONLY_USER}",
  pwd: "${MONGODB_READONLY_PASSWORD}",
  roles: [
    { role: "read", db: "ainflue" }
  ]
});

# Backup user
db.createUser({
  user: "${MONGODB_BACKUP_USER}",
  pwd: "${MONGODB_BACKUP_PASSWORD}",
  roles: [
    { role: "backup", db: "admin" },
    { role: "restore", db: "admin" }
  ]
});

---
# Collection Schemas and Indexes for Ainflue Platform

# Creator profiles collection
db.creators.createIndex({ "userId": 1 }, { unique: true });
db.creators.createIndex({ "username": 1 }, { unique: true });
db.creators.createIndex({ "email": 1 }, { unique: true });
db.creators.createIndex({ "socialMedia.platform": 1, "socialMedia.handle": 1 });
db.creators.createIndex({ "categories": 1 });
db.creators.createIndex({ "location.country": 1, "location.city": 1 });
db.creators.createIndex({ "metrics.followers": -1 });
db.creators.createIndex({ "metrics.engagementRate": -1 });
db.creators.createIndex({ "isVerified": 1, "isActive": 1 });
db.creators.createIndex({ "createdAt": 1 });
db.creators.createIndex({ 
  "username": "text", 
  "bio": "text", 
  "categories": "text" 
}, {
  name: "creator_search_index",
  weights: {
    "username": 10,
    "categories": 5,
    "bio": 1
  }
});

# Campaigns collection
db.campaigns.createIndex({ "brandId": 1 });
db.campaigns.createIndex({ "status": 1 });
db.campaigns.createIndex({ "startDate": 1, "endDate": 1 });
db.campaigns.createIndex({ "budget.min": 1, "budget.max": 1 });
db.campaigns.createIndex({ "categories": 1 });
db.campaigns.createIndex({ "targetAudience.demographics.ageRange": 1 });
db.campaigns.createIndex({ "targetAudience.interests": 1 });
db.campaigns.createIndex({ "createdAt": -1 });
db.campaigns.createIndex({ 
  "title": "text", 
  "description": "text", 
  "categories": "text" 
}, {
  name: "campaign_search_index"
});

# Content collection
db.content.createIndex({ "creatorId": 1 });
db.content.createIndex({ "campaignId": 1 });
db.content.createIndex({ "platform": 1 });
db.content.createIndex({ "status": 1 });
db.content.createIndex({ "publishedAt": -1 });
db.content.createIndex({ "metrics.views": -1 });
db.content.createIndex({ "metrics.engagement": -1 });
db.content.createIndex({ "hashtags": 1 });
db.content.createIndex({ "contentType": 1 });
db.content.createIndex({ "createdAt": -1 });

# Engagements collection (for real-time analytics)
db.engagements.createIndex({ "contentId": 1 });
db.engagements.createIndex({ "creatorId": 1 });
db.engagements.createIndex({ "userId": 1 });
db.engagements.createIndex({ "type": 1 });
db.engagements.createIndex({ "timestamp": -1 });
db.engagements.createIndex({ "platform": 1 });
// Compound index for analytics queries
db.engagements.createIndex({ 
  "creatorId": 1, 
  "timestamp": -1, 
  "type": 1 
});

# Messages collection (for creator-brand communication)
db.messages.createIndex({ "conversationId": 1 });
db.messages.createIndex({ "senderId": 1 });
db.messages.createIndex({ "receiverId": 1 });
db.messages.createIndex({ "timestamp": -1 });
db.messages.createIndex({ "isRead": 1 });

# Analytics events collection (for business intelligence)
db.analytics_events.createIndex({ "eventType": 1 });
db.analytics_events.createIndex({ "userId": 1 });
db.analytics_events.createIndex({ "sessionId": 1 });
db.analytics_events.createIndex({ "timestamp": -1 });
db.analytics_events.createIndex({ "properties.campaignId": 1 });
db.analytics_events.createIndex({ "properties.creatorId": 1 });
// TTL index for data retention (90 days)
db.analytics_events.createIndex({ "timestamp": 1 }, { expireAfterSeconds: 7776000 });

# Notifications collection
db.notifications.createIndex({ "userId": 1 });
db.notifications.createIndex({ "type": 1 });
db.notifications.createIndex({ "isRead": 1 });
db.notifications.createIndex({ "createdAt": -1 });
// TTL index for notification cleanup (30 days)
db.notifications.createIndex({ "createdAt": 1 }, { expireAfterSeconds: 2592000 });

# Sessions collection (for user session management)
db.sessions.createIndex({ "sessionId": 1 }, { unique: true });
db.sessions.createIndex({ "userId": 1 });
// TTL index for session expiry
db.sessions.createIndex({ "expiresAt": 1 }, { expireAfterSeconds: 0 });

---
# MongoDB Aggregation Pipeline Examples for Ainflue

# Top performing creators by engagement rate
db.creators.aggregate([
  {
    $match: {
      "isActive": true,
      "metrics.followers": { $gte: 1000 }
    }
  },
  {
    $sort: { "metrics.engagementRate": -1 }
  },
  {
    $limit: 50
  },
  {
    $project: {
      username: 1,
      categories: 1,
      "metrics.followers": 1,
      "metrics.engagementRate": 1,
      "socialMedia": 1
    }
  }
]);

# Campaign performance analytics
db.content.aggregate([
  {
    $match: {
      "campaignId": ObjectId("CAMPAIGN_ID"),
      "status": "published"
    }
  },
  {
    $group: {
      _id: "$platform",
      totalViews: { $sum: "$metrics.views" },
      totalEngagement: { $sum: "$metrics.engagement" },
      avgEngagementRate: { $avg: "$metrics.engagementRate" },
      contentCount: { $sum: 1 }
    }
  },
  {
    $sort: { totalViews: -1 }
  }
]);

# Creator discovery by category and location
db.creators.aggregate([
  {
    $match: {
      "categories": { $in: ["lifestyle", "fashion"] },
      "location.country": "US",
      "isActive": true,
      "metrics.followers": { $gte: 10000 }
    }
  },
  {
    $addFields: {
      "score": {
        $add: [
          { $multiply: ["$metrics.engagementRate", 0.4] },
          { $multiply: [{ $log: "$metrics.followers" }, 0.3] },
          { $multiply: ["$metrics.averageViews", 0.0001] },
          { $cond: [{ $eq: ["$isVerified", true] }, 20, 0] }
        ]
      }
    }
  },
  {
    $sort: { "score": -1 }
  },
  {
    $limit: 20
  }
]);

---
# MongoDB Connection String Examples

# Standard connection (single instance)
mongodb://${MONGODB_APP_USER}:${MONGODB_APP_PASSWORD}@mongodb.ainflue.com:27017/ainflue?authSource=ainflue

# Replica set connection
mongodb://${MONGODB_APP_USER}:${MONGODB_APP_PASSWORD}@mongodb-0.ainflue.com:27017,mongodb-1.ainflue.com:27017,mongodb-2.ainflue.com:27017/ainflue?replicaSet=ainflue-replica-set&authSource=ainflue

# Connection with SSL and additional options
mongodb://${MONGODB_APP_USER}:${MONGODB_APP_PASSWORD}@mongodb.ainflue.com:27017/ainflue?authSource=ainflue&ssl=true&retryWrites=true&w=majority&readPreference=secondaryPreferred&maxPoolSize=20&minPoolSize=5

# Connection for analytics (read-only with read preference)
mongodb://${MONGODB_READONLY_USER}:${MONGODB_READONLY_PASSWORD}@mongodb.ainflue.com:27017/ainflue?authSource=ainflue&readPreference=secondary&readConcern=majority

---
# MongoDB Backup and Restore Scripts

#!/bin/bash
# Backup script
BACKUP_DIR="/backups/mongodb/$(date +%Y%m%d_%H%M%S)"
mkdir -p $BACKUP_DIR

mongodump \
  --host mongodb.ainflue.com:27017 \
  --username $MONGODB_BACKUP_USER \
  --password $MONGODB_BACKUP_PASSWORD \
  --authenticationDatabase admin \
  --db ainflue \
  --out $BACKUP_DIR \
  --gzip

# Upload to S3
aws s3 cp $BACKUP_DIR s3://ainflue-db-backups/mongodb/ --recursive

#!/bin/bash
# Restore script
BACKUP_PATH=$1
if [ -z "$BACKUP_PATH" ]; then
  echo "Usage: $0 <backup_path>"
  exit 1
fi

mongorestore \
  --host mongodb.ainflue.com:27017 \
  --username $MONGODB_ADMIN_USER \
  --password $MONGODB_ADMIN_PASSWORD \
  --authenticationDatabase admin \
  --db ainflue \
  --gzip \
  $BACKUP_PATH

