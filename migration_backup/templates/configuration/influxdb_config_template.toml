# InfluxDB Performance Tuning

# Monitor query performance
SHOW QUERIES

# Check database statistics
SHOW STATS

# Monitor series cardinality
SHOW CARDINALITY

# Check retention policies
SHOW RETENTION POLICIES ON ainflue

# Monitor continuous queries
SHOW CONTINUOUS QUERIES

# Check measurement statistics
SHOW MEASUREMENTS ON ainflue

# Monitor tag values
SHOW TAG VALUES ON ainflue FROM "creator_performance" WITH KEY = "platform"

# Performance optimization queries
# Drop series with high cardinality
DROP SERIES FROM measurement_name WHERE tag_key = 'problematic_value'

# Optimize retention policies
ALTER RETENTION POLICY "default" ON "ainflue" DURATION 15d

---
# Kapacitor Configuration for Alerting

# Kapacitor configuration file
[http]
  bind-address = ":9092"
  auth-enabled = false
  log-enabled = true
  write-tracing = false
  pprof-enabled = false
  https-enabled = false
  https-certificate = "/etc/ssl/kapacitor.pem"
  shutdown-timeout = "10s"

[logging]
  file = "/var/log/kapacitor/kapacitor.log"
  level = "INFO"

[replay]
  dir = "/var/lib/kapacitor/replay"

[storage]
  boltdb = "/var/lib/kapacitor/kapacitor.db"

[task]
  dir = "/var/lib/kapacitor/tasks"
  snapshot-interval = "1m0s"

[[influxdb]]
  enabled = true
  name = "default"
  default = false
  urls = ["http://localhost:8086"]
  username = "ainflue_monitor"
  password = "${INFLUXDB_MONITOR_PASSWORD}"
  timeout = 0
  insecure-skip-verify = false
  startup-timeout = "5m0s"
  disable-subscriptions = false
  subscription-protocol = "http"

[smtp]
  enabled = true
  host = "${SMTP_HOST}"
  port = 587
  username = "${SMTP_USERNAME}"
  password = "${SMTP_PASSWORD}"
  from = "${SMTP_FROM}"
  to = ["${ALERT_EMAIL}"]

[slack]
  enabled = true
  url = "${SLACK_WEBHOOK_URL}"
  channel = "#alerts"

# Alert for high API response times
stream
  |from()
    .measurement('api_metrics')
    .where(lambda: "response_time" > 5000)
  |alert()
    .id('high-api-response-time')
    .message('High API response time detected: {{ index .Fields "response_time" }}ms on {{ index .Tags "endpoint" }}')
    .warn(lambda: "response_time" > 2000)
    .crit(lambda: "response_time" > 5000)
    .slack()
    .email()

# Alert for low engagement rates
stream
  |from()
    .measurement('creator_performance')
    .where(lambda: "engagement_rate" < 0.01)
  |alert()
    .id('low-engagement-rate')
    .message('Low engagement rate detected for creator {{ index .Tags "creator_id" }}: {{ index .Fields "engagement_rate" }}')
    .warn(lambda: "engagement_rate" < 0.02)
    .crit(lambda: "engagement_rate" < 0.01)
    .email()

# Alert for campaign budget overrun
stream
  |from()
    .measurement('campaign_analytics')
    .where(lambda: "cost_per_engagement" > 5.0)
  |alert()
    .id('campaign-budget-overrun')
    .message('Campaign {{ index .Tags "campaign_id" }} cost per engagement exceeds budget: ${{ index .Fields "cost_per_engagement" }}')
    .crit(lambda: "cost_per_engagement" > 5.0)
    .slack()
    .email()