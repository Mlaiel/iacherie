version: '3.8'

# =====================================================================================
# IA CHÉRIES CREATOR ECONOMY - SIDECAR PATTERNS IMPLEMENTATION
# =====================================================================================

# Networks for sidecar communication
networks:
  # Main application network
  app_network:
    driver: overlay
    driver_opts:
      encrypted: "true"
    ipam:
      driver: default
      config:
        - subnet: 172.40.0.0/16
    labels:
      - "ainflue.network.type=application"

  # Monitoring network for sidecars
  sidecar_monitoring:
    driver: overlay
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.41.0.0/16
    labels:
      - "ainflue.network.type=sidecar_monitoring"

  # Service mesh network
  mesh_network:
    driver: overlay
    driver_opts:
      encrypted: "true"
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.42.0.0/16
    labels:
      - "ainflue.network.type=service_mesh"

# Shared volumes for sidecar patterns
volumes:
  # Shared logs volume
  shared_logs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=500M,uid=1000,gid=1000"
    labels:
      - "ainflue.volume.type=shared_logs"

  # Shared configuration
  shared_config:
    driver: local
    labels:
      - "ainflue.volume.type=shared_config"

  # SSL certificates
  ssl_certs:
    driver: local
    labels:
      - "ainflue.volume.type=ssl_certificates"

  # Metrics data
  metrics_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=200M,uid=1000,gid=1000"
    labels:
      - "ainflue.volume.type=metrics"

# Secrets for sidecar authentication
secrets:
  # Service mesh certificates
  envoy_cert:
    external: true
    external_name: ainflue_envoy_cert_v1

  envoy_key:
    external: true
    external_name: ainflue_envoy_key_v1

  # Monitoring credentials
  prometheus_creds:
    external: true
    external_name: ainflue_prometheus_creds_v1

  # Logging credentials
  logging_creds:
    external: true
    external_name: ainflue_logging_creds_v1

# =====================================================================================
# CREATOR CONTENT SERVICE WITH SIDECARS
# =====================================================================================

services:

  # =====================================================================================
  # MAIN APPLICATION CONTAINER
  # =====================================================================================
  
  creator_content_app:
    image: ainflue/creator-content:${VERSION:-latest}
    hostname: creator-content-app
    restart: unless-stopped
    
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
    
    networks:
      - app_network
    
    volumes:
      - shared_logs:/app/logs:rw
      - shared_config:/app/config:ro
    
    environment:
      - SERVICE_NAME=creator-content
      - SERVICE_VERSION=${VERSION:-1.0.0}
      - SERVICE_PORT=3000
      - LOG_LEVEL=info
      - METRICS_PORT=9090
      - HEALTH_PORT=8080
      # Sidecar integration
      - PROXY_ENABLED=true
      - PROXY_PORT=15001
      - METRICS_ENABLED=true
      - TRACING_ENABLED=true
      - LOGGING_SIDECAR=true
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Don't expose ports directly - go through sidecar proxy
    expose:
      - "3000"
      - "9090"
      - "8080"
    
    labels:
      - "ainflue.service.type=application"
      - "ainflue.service.name=creator-content"
      - "ainflue.sidecar.enabled=true"
      - "ainflue.monitoring.enabled=true"

  # =====================================================================================
  # ENVOY PROXY SIDECAR (Service Mesh)
  # =====================================================================================
  
  envoy_proxy:
    image: envoyproxy/envoy:v1.28.0
    hostname: envoy-proxy
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    networks:
      - app_network
      - mesh_network
    
    ports:
      - "15001:15001"  # Admin interface
      - "15000:15000"  # Proxy port
    
    volumes:
      - shared_config:/etc/envoy:ro
      - ssl_certs:/etc/ssl/envoy:ro
    
    secrets:
      - envoy_cert
      - envoy_key
    
    environment:
      - ENVOY_UID=1000
      - ENVOY_GID=1000
    
    command: >
      /usr/local/bin/envoy
      -c /etc/envoy/envoy.yaml
      --service-cluster creator-content
      --service-node creator-content-proxy
      --log-level info
      --admin-address-path /etc/envoy/admin_address.txt
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:15001/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    depends_on:
      - creator_content_app
    
    labels:
      - "ainflue.sidecar.type=proxy"
      - "ainflue.sidecar.service=envoy"
      - "ainflue.service.mesh=true"
      - "ainflue.security.tls=enabled"

  # =====================================================================================
  # PROMETHEUS METRICS SIDECAR
  # =====================================================================================
  
  metrics_collector:
    image: prom/node-exporter:v1.6.1
    hostname: metrics-collector
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    
    networks:
      - sidecar_monitoring
      - app_network
    
    volumes:
      - metrics_data:/metrics:rw
      - shared_logs:/host/logs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    
    secrets:
      - prometheus_creds
    
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ROOT=/rootfs
    
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/metrics'
      - '--web.listen-address=:9100'
    
    ports:
      - "9100:9100"
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "ainflue.sidecar.type=metrics"
      - "ainflue.sidecar.service=node-exporter"
      - "ainflue.monitoring.target=true"

  # =====================================================================================
  # FLUENTD LOGGING SIDECAR
  # =====================================================================================
  
  log_collector:
    image: fluent/fluentd:v1.16.2-debian-1.0
    hostname: log-collector
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    
    networks:
      - sidecar_monitoring
      - app_network
    
    volumes:
      - shared_logs:/fluentd/log:ro
      - shared_config:/fluentd/etc:ro
    
    secrets:
      - logging_creds
    
    environment:
      - FLUENTD_CONF=fluent.conf
      - FLUENTD_OPT=-v
      - FLUENTD_LOG_LEVEL=info
    
    ports:
      - "24224:24224"  # Forward input
      - "24230:24230"  # HTTP input
    
    healthcheck:
      test: ["CMD", "pgrep", "fluentd"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "ainflue.sidecar.type=logging"
      - "ainflue.sidecar.service=fluentd"
      - "ainflue.logging.aggregator=true"

  # =====================================================================================
  # JAEGER TRACING SIDECAR
  # =====================================================================================
  
  tracing_agent:
    image: jaegertracing/jaeger-agent:1.50.0
    hostname: tracing-agent
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    
    networks:
      - sidecar_monitoring
      - app_network
    
    environment:
      - REPORTER_GRPC_HOST_PORT=jaeger-collector:14250
      - REPORTER_TYPE=grpc
      - AGENT_TAGS=service=creator-content,version=${VERSION:-1.0.0}
    
    ports:
      - "6831:6831/udp"  # Jaeger thrift compact
      - "6832:6832/udp"  # Jaeger thrift binary
      - "5778:5778"      # Config server
      - "14271:14271"    # Admin
    
    command:
      - "--reporter.grpc.host-port=jaeger-collector:14250"
      - "--reporter.type=grpc"
      - "--log-level=info"
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:14271/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "ainflue.sidecar.type=tracing"
      - "ainflue.sidecar.service=jaeger-agent"
      - "ainflue.tracing.enabled=true"

  # =====================================================================================
  # SECURITY SCANNING SIDECAR
  # =====================================================================================
  
  security_scanner:
    image: aquasec/trivy:0.46.1
    hostname: security-scanner
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    networks:
      - sidecar_monitoring
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - shared_logs:/tmp/scan-results:rw
    
    environment:
      - TRIVY_CACHE_DIR=/tmp/.cache/trivy
      - TRIVY_TEMP_DIR=/tmp
      - TRIVY_LOG_LEVEL=INFO
      - SCAN_INTERVAL=3600  # Scan every hour
    
    command: >
      sh -c "
      while true; do
        trivy image --format json --output /tmp/scan-results/security-scan.json ainflue/creator-content:${VERSION:-latest}
        sleep $${SCAN_INTERVAL}
      done
      "
    
    labels:
      - "ainflue.sidecar.type=security"
      - "ainflue.sidecar.service=trivy"
      - "ainflue.security.scanning=enabled"

  # =====================================================================================
  # BACKUP SIDECAR
  # =====================================================================================
  
  backup_agent:
    image: restic/restic:0.16.2
    hostname: backup-agent
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    
    networks:
      - sidecar_monitoring
    
    volumes:
      - shared_logs:/data/logs:ro
      - shared_config:/data/config:ro
    
    environment:
      - RESTIC_REPOSITORY=${BACKUP_REPOSITORY}
      - RESTIC_PASSWORD_FILE=/run/secrets/backup_password
      - BACKUP_SCHEDULE=0 2 * * *  # Daily at 2 AM
      - RETENTION_KEEP_DAILY=30
      - RETENTION_KEEP_WEEKLY=4
      - RETENTION_KEEP_MONTHLY=12
    
    secrets:
      - backup_password
    
    command: >
      sh -c "
      restic snapshots || restic init
      while true; do
        echo 'Starting backup...'
        restic backup /data --tag automated
        restic forget --keep-daily $${RETENTION_KEEP_DAILY} --keep-weekly $${RETENTION_KEEP_WEEKLY} --keep-monthly $${RETENTION_KEEP_MONTHLY} --prune
        echo 'Backup completed, sleeping until next schedule'
        sleep 86400  # 24 hours
      done
      "
    
    labels:
      - "ainflue.sidecar.type=backup"
      - "ainflue.sidecar.service=restic"
      - "ainflue.backup.enabled=true"

  # =====================================================================================
  # CONFIGURATION RELOADER SIDECAR
  # =====================================================================================
  
  config_reloader:
    image: jimmidyson/configmap-reload:v0.8.0
    hostname: config-reloader
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M
    
    networks:
      - app_network
    
    volumes:
      - shared_config:/config:ro
    
    environment:
      - WEBHOOK_URL=http://creator_content_app:8080/reload
      - WEBHOOK_METHOD=POST
      - WEBHOOK_STATUS_CODE=200
    
    command:
      - '--volume-dir=/config'
      - '--webhook-url=http://creator_content_app:8080/reload'
      - '--webhook-method=POST'
    
    labels:
      - "ainflue.sidecar.type=config_reloader"
      - "ainflue.sidecar.service=configmap-reload"
      - "ainflue.config.hot_reload=true"

  # =====================================================================================
  # CIRCUIT BREAKER SIDECAR
  # =====================================================================================
  
  circuit_breaker:
    image: nginx:1.25.3-alpine
    hostname: circuit-breaker
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    
    networks:
      - app_network
    
    ports:
      - "8081:80"
    
    volumes:
      - shared_config:/etc/nginx/conf.d:ro
    
    environment:
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.template
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
      - UPSTREAM_HOST=creator_content_app
      - UPSTREAM_PORT=3000
      - CIRCUIT_BREAKER_THRESHOLD=10
      - CIRCUIT_BREAKER_WINDOW=60s
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "ainflue.sidecar.type=circuit_breaker"
      - "ainflue.sidecar.service=nginx"
      - "ainflue.resilience.pattern=circuit_breaker"

  # =====================================================================================
  # RATE LIMITER SIDECAR
  # =====================================================================================
  
  rate_limiter:
    image: envoyproxy/envoy:v1.28.0
    hostname: rate-limiter
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    
    networks:
      - app_network
    
    ports:
      - "8082:8080"
    
    volumes:
      - shared_config:/etc/envoy/rate_limit:ro
    
    environment:
      - ENVOY_UID=1000
      - ENVOY_GID=1000
    
    command: >
      /usr/local/bin/envoy
      -c /etc/envoy/rate_limit/envoy.yaml
      --service-cluster rate-limiter
      --service-node rate-limiter-sidecar
      --log-level info
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9901/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "ainflue.sidecar.type=rate_limiter"
      - "ainflue.sidecar.service=envoy"
      - "ainflue.security.rate_limiting=enabled"

# =====================================================================================
# ADDITIONAL SECRETS
# =====================================================================================

secrets:
  backup_password:
    external: true
    external_name: ainflue_backup_password_v1

# =====================================================================================
# SIDECAR PATTERN CONFIGURATIONS
# =====================================================================================

# Ambassador Pattern Configuration
x-ambassador-pattern: &ambassador-pattern
  networks:
    - app_network
    - mesh_network
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 256M
      reservations:
        cpus: '0.1'
        memory: 64M
  healthcheck:
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

# Adapter Pattern Configuration
x-adapter-pattern: &adapter-pattern
  networks:
    - app_network
  deploy:
    resources:
      limits:
        cpus: '0.3'
        memory: 128M
      reservations:
        cpus: '0.05'
        memory: 32M

# Observer Pattern Configuration
x-observer-pattern: &observer-pattern
  networks:
    - sidecar_monitoring
    - app_network
  deploy:
    resources:
      limits:
        cpus: '0.2'
        memory: 128M
      reservations:
        cpus: '0.05'
        memory: 32M

# Decorator Pattern Configuration
x-decorator-pattern: &decorator-pattern
  networks:
    - app_network
  deploy:
    resources:
      limits:
        cpus: '0.4'
        memory: 256M
      reservations:
        cpus: '0.1'
        memory: 64M

# =====================================================================================
# COMMON SIDECAR LABELS
# =====================================================================================

x-sidecar-labels: &sidecar-labels
  - "ainflue.pattern=sidecar"
  - "ainflue.version=${VERSION:-1.0.0}"
  - "ainflue.environment=${ENVIRONMENT:-production}"
  - "ainflue.monitoring.enabled=true"
  - "ainflue.security.scan=required"

x-proxy-labels: &proxy-labels
  - "ainflue.sidecar.category=proxy"
  - "ainflue.network.ingress=true"
  - "ainflue.security.tls=required"

x-monitoring-labels: &monitoring-labels
  - "ainflue.sidecar.category=monitoring"
  - "ainflue.metrics.scrape=true"
  - "ainflue.logging.aggregate=true"

x-security-labels: &security-labels
  - "ainflue.sidecar.category=security"
  - "ainflue.security.scan=continuous"
  - "ainflue.compliance.monitor=true"

x-reliability-labels: &reliability-labels
  - "ainflue.sidecar.category=reliability"
  - "ainflue.resilience.enabled=true"
  - "ainflue.backup.automated=true"

# =====================================================================================
# HEALTHCHECK CONFIGURATIONS
# =====================================================================================

x-http-healthcheck: &http-healthcheck
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

x-tcp-healthcheck: &tcp-healthcheck
  healthcheck:
    test: ["CMD", "nc", "-z", "localhost", "8080"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

x-process-healthcheck: &process-healthcheck
  healthcheck:
    test: ["CMD", "pgrep", "-f", "process_name"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

# =====================================================================================
# RESOURCE TEMPLATES
# =====================================================================================

x-nano-resources: &nano-resources
  deploy:
    resources:
      limits:
        cpus: '0.1'
        memory: 64M
      reservations:
        cpus: '0.01'
        memory: 16M

x-micro-resources: &micro-resources
  deploy:
    resources:
      limits:
        cpus: '0.2'
        memory: 128M
      reservations:
        cpus: '0.05'
        memory: 32M

x-small-resources: &small-resources
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 256M
      reservations:
        cpus: '0.1'
        memory: 64M

# =====================================================================================
# END OF SIDECAR TEMPLATE
# =====================================================================================