env:
  DOCKER_REGISTRY: ghcr.io
  ENVIRONMENT: production
  KUBERNETES_VERSION: '1.28'
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    needs:
    - security-scan
    - test-backend
    - test-frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Creator Economy Images
      run: "\n                            # Build multi-service Docker images\n  \
        \                          docker build -t $DOCKER_REGISTRY/ainflue/creator-api:${{\
        \ github.sha }} -f docker/creator_services/api.dockerfile .\n            \
        \                docker build -t $DOCKER_REGISTRY/ainflue/ai-processor:${{\
        \ github.sha }} -f docker/ai_services/processor.dockerfile .\n           \
        \                 docker build -t $DOCKER_REGISTRY/ainflue/monetization:${{\
        \ github.sha }} -f docker/monetization/service.dockerfile .\n            \
        \                "
    - name: Deploy to Kubernetes
      run: "\n                            # Deploy creator economy services\n    \
        \                        kubectl apply -f kubernetes/production/\n       \
        \                     kubectl set image deployment/creator-api creator-api=$DOCKER_REGISTRY/ainflue/creator-api:${{\
        \ github.sha }}\n                            kubectl set image deployment/ai-processor\
        \ ai-processor=$DOCKER_REGISTRY/ainflue/ai-processor:${{ github.sha }}\n \
        \                           kubectl set image deployment/monetization monetization=$DOCKER_REGISTRY/ainflue/monetization:${{\
        \ github.sha }}\n                            "
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      name: Security Scan - SAST
      uses: github/super-linter@v4
    - name: Creator Economy Security Check
      run: "\n                            # Custom security checks for creator platform\n\
        \                            echo \"Scanning for creator data protection compliance...\"\
        \n                            echo \"Checking AI model security configurations...\"\
        \n                            echo \"Validating monetization security policies...\"\
        \n                            "
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        env:
          POSTGRES_PASSWORD: postgres
        image: postgres:15
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        options: --health-cmd 'redis-cli ping' --health-interval 10s --health-timeout
          5s --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install Dependencies
      run: "\n                            pip install -r requirements.txt\n      \
        \                      pip install -r requirements-dev.txt\n             \
        \               pip install pytest coverage\n                            "
    - name: Run Creator Economy Tests
      run: "\n                            # Test creator onboarding system\n     \
        \                       pytest services/creator/ -v\n                    \
        \        \n                            # Test AI processing pipeline\n   \
        \                         pytest ml/ -v\n                            \n  \
        \                          # Test monetization system\n                  \
        \          pytest services/monetization/ -v\n                            \n\
        \                            # Test collaboration features\n             \
        \               pytest services/collaboration/ -v\n                      \
        \      \n                            # Test content protection\n         \
        \                   pytest protection/ -v\n                            "
  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Install Dependencies
      run: npm ci
    - name: Run Creator UI Tests
      run: "\n                            npm test -- --coverage\n               \
        \             npm run test:e2e\n                            "
name: IA Chéries Creator Economy CI/CD
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
    - develop
  workflow_dispatch: {}
