# 🔒 Enterprise Compliance Rules Configuration
# Author: Fahed Mlaiel (mlaiel@live.de) - Multi-Expert Implementation
# Version: 2.0.0 Enterprise Ultra-Strict
# Created: 2025-01-09

# GDPR Compliance Rules
gdpr:
  enabled: true
  data_processing_lawful_basis: "consent"
  consent_management:
    explicit_consent: true
    withdrawal_mechanism: true
    consent_granularity: "purpose"
  data_subject_rights:
    access: true
    rectification: true
    erasure: true
    portability: true
    restriction: true
    objection: true
  privacy_by_design: true
  data_protection_impact_assessment: true
  breach_notification_hours: 72
  cross_border_transfer_protection: true

# SOX Compliance Rules
sox:
  enabled: true
  financial_reporting_controls: true
  audit_trail_requirements:
    integrity: true
    completeness: true
    retention_years: 7
  segregation_of_duties: true
  access_control_matrix: true
  change_management_controls: true
  it_general_controls: true

# PCI DSS Compliance Rules
pci_dss:
  enabled: true
  level: 1
  requirements:
    firewall_configuration: true
    default_passwords_changed: true
    cardholder_data_protection: true
    encrypted_transmission: true
    antivirus_software: true
    secure_systems: true
    access_control: true
    unique_ids: true
    physical_access_restriction: true
    network_monitoring: true
    regular_testing: true
    information_security_policy: true
  quarterly_vulnerability_scans: true
  annual_penetration_testing: true

# HIPAA Compliance Rules
hipaa:
  enabled: true
  administrative_safeguards:
    security_officer: true
    workforce_training: true
    access_management: true
    contingency_plan: true
  physical_safeguards:
    facility_access: true
    workstation_use: true
    device_media_controls: true
  technical_safeguards:
    access_control: true
    audit_controls: true
    integrity: true
    transmission_security: true
  breach_notification_days: 60

# ISO 27001 Compliance Rules
iso_27001:
  enabled: true
  information_security_policy: true
  risk_assessment: true
  risk_treatment: true
  security_objectives: true
  competence_awareness: true
  operational_planning: true
  performance_evaluation: true
  internal_audit: true
  management_review: true
  nonconformity_corrective_action: true
  continual_improvement: true

# SOC 2 Type II Compliance Rules
soc2_type2:
  enabled: true
  trust_service_criteria:
    security: true
    availability: true
    processing_integrity: true
    confidentiality: true
    privacy: true
  control_environment: true
  communication_information: true
  risk_assessment: true
  monitoring_activities: true
  control_activities: true

# NIST Cybersecurity Framework Rules
nist_csf:
  enabled: true
  core_functions:
    identify: true
    protect: true
    detect: true
    respond: true
    recover: true
  implementation_tiers:
    current_tier: "adaptive"
    target_tier: "adaptive"
  framework_profile: "enterprise"

# Data Classification Rules
data_classification:
  levels:
    - name: "public"
      protection_level: "basic"
      encryption_required: false
    - name: "internal"
      protection_level: "standard"
      encryption_required: true
    - name: "confidential"
      protection_level: "high"
      encryption_required: true
    - name: "restricted"
      protection_level: "maximum"
      encryption_required: true
  automatic_classification: true
  data_loss_prevention: true

# Audit and Logging Rules
audit_logging:
  retention_years: 7
  tamper_protection: true
  real_time_monitoring: true
  log_integrity_verification: true
  centralized_logging: true
  structured_logging: true
  correlation_analysis: true
  automated_alerts: true

# Risk Management Rules
risk_management:
  risk_appetite: "low"
  risk_tolerance: "minimal"
  risk_assessment_frequency_months: 6
  quantitative_analysis: true
  qualitative_analysis: true
  risk_treatment_strategies:
    - "avoid"
    - "mitigate"
    - "transfer"
    - "accept"
  continuous_monitoring: true

# Vendor Management Rules
vendor_management:
  due_diligence_required: true
  security_assessment: true
  contract_security_clauses: true
  ongoing_monitoring: true
  right_to_audit: true
  data_processing_agreements: true
  breach_notification_requirements: true

# Training and Awareness Rules
training_awareness:
  security_training_required: true
  frequency_months: 6
  role_based_training: true
  phishing_simulations: true
  compliance_training: true
  certification_requirements: true
  training_effectiveness_measurement: true