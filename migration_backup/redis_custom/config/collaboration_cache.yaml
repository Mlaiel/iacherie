# Real-time Collaboration Caching for Creator Economy Platform

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-collaboration-cache
  namespace: ainflue-redis
  labels:
    app: ainflue-redis
    component: collaboration-cache
    environment: enterprise
    owner: fahed-mlaiel
    version: "4.0.0"
  annotations:
    author: "Fahed Mlaiel <mlaiel@live.de>"
    license: "Proprietary - All Rights Reserved"

data:
  collaboration_cache_config: |
    # Collaboration Cache Strategy
    collaboration_strategy: "real_time_sync"
    
    # Active Collaboration Sessions
    active_sessions:
      cache_key_pattern: "collab:session:{session_id}"
      ttl: 7200  # 2 hours
      real_time_sync: true
      conflict_resolution: "operational_transforms"
      
    # Collaboration Projects
    collaboration_projects:
      project_metadata: "collab:project:{project_id}:meta"
      project_members: "collab:project:{project_id}:members"
      project_files: "collab:project:{project_id}:files"
      ttl: 3600  # 1 hour
      
    # Real-time Features
    real_time_features:
      live_cursors: "collab:cursors:{document_id}"
      chat_messages: "collab:chat:{room_id}"
      voice_channels: "collab:voice:{channel_id}"
      screen_sharing: "collab:screen:{session_id}"
      
    # Collaboration Analytics
    collaboration_analytics:
      session_duration: "collab:stats:duration:{session_id}"
      participant_activity: "collab:stats:activity:{user_id}"
      project_progress: "collab:stats:progress:{project_id}"
      ttl: 1800  # 30 minutes
---