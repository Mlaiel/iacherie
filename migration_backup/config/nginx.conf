# Main context
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Performance optimizations
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # Cache settings
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=1g 
                     inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=2g 
                     inactive=120m use_temp_path=off;
    
    # Upstream definitions for load balancing
    upstream api_backend {
        least_conn;
        
        # API server instances
        server 127.0.0.1:8001 max_fails=3 fail_timeout=30s weight=100;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=30s weight=100;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=30s weight=100;
        server 127.0.0.1:8004 max_fails=3 fail_timeout=30s weight=100;
        
        # Backup server
        server 127.0.0.1:8005 max_fails=3 fail_timeout=30s weight=50 backup;
        
        keepalive 32;
    }
    
    upstream orchestrator_backend {
        ip_hash;  # Session persistence for AI operations
        
        # Orchestrator instances
        server 127.0.0.1:8101 max_fails=2 fail_timeout=20s weight=100;
        server 127.0.0.1:8102 max_fails=2 fail_timeout=20s weight=100;
        server 127.0.0.1:8201 max_fails=2 fail_timeout=20s weight=100;
        server 127.0.0.1:8202 max_fails=2 fail_timeout=20s weight=100;
        server 127.0.0.1:8301 max_fails=2 fail_timeout=20s weight=100;
        server 127.0.0.1:8302 max_fails=2 fail_timeout=20s weight=100;
        
        keepalive 16;
    }
    
    upstream validation_backend {
        round_robin;
        
        # Validation service instances
        server 127.0.0.1:8601 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8602 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8603 max_fails=3 fail_timeout=30s;
        
        keepalive 16;
    }
    
    upstream monetization_backend {
        least_conn;
        
        # Financial services (high availability)
        server 127.0.0.1:8701 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:8702 max_fails=1 fail_timeout=10s;
        server 127.0.0.1:8703 max_fails=1 fail_timeout=10s;
        
        keepalive 8;
    }
    
    # Security headers map
    map $sent_http_content_type $security_headers {
        ~*text/html "X-Frame-Options: DENY; X-Content-Type-Options: nosniff; X-XSS-Protection: 1; mode=block";
        default "";
    }
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:RSA+AESGCM:RSA+SHA256:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Main server block
    server {
        listen 80;
        listen [::]:80;
        server_name api.ainflue.com *.ainflue.com;
        
        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.ainflue.com;
        
        # SSL certificates
        ssl_certificate /etc/ssl/certs/ainflue.crt;
        ssl_certificate_key /etc/ssl/private/ainflue.key;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
        
        # Logging
        access_log /var/log/nginx/ainflue.access.log main;
        error_log /var/log/nginx/ainflue.error.log;
        
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        limit_conn addr 10;
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }
        
        # Nginx status
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
        
        # API endpoints
        location /api/ {
            # Rate limiting for API
            limit_req zone=api burst=30 nodelay;
            
            # Proxy settings
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Caching for GET requests
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 302 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_bypass $http_cache_control;
            add_header X-Cache-Status $upstream_cache_status;
            
            # Error handling
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_fallback;
        }
        
        # Orchestrator endpoints (AI-heavy operations)
        location ~ ^/api/v1/(collaboration|gamification|seo|distribution|security)/ {
            # More aggressive rate limiting for AI operations
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://orchestrator_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for AI processing
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # No caching for AI operations (dynamic results)
            proxy_cache off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        
        # Validation endpoints
        location /api/v1/validation/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://validation_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Medium caching for validation results
            proxy_cache api_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_key "$scheme$request_method$host$request_uri$request_body";
        }
        
        # Monetization endpoints (high security)
        location /api/v1/monetization/ {
            # Strict rate limiting for financial operations
            limit_req zone=auth burst=5 nodelay;
            
            proxy_pass http://monetization_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Financial-Request "true";
            
            # No caching for financial data
            proxy_cache off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            
            # Enhanced security
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        
        # File upload endpoints
        location /api/v1/upload/ {
            limit_req zone=upload burst=3 nodelay;
            client_max_body_size 500M;
            
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for file uploads
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # No caching for uploads
            proxy_cache off;
        }
        
        # Documentation
        location /docs {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache documentation
            proxy_cache static_cache;
            proxy_cache_valid 200 1h;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
        
        # Static files
        location /static/ {
            alias /var/www/ainflue/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # Gzip for static files
            gzip_static on;
            
            # Security for static files
            location ~* \.(php|jsp|cgi)$ {
                deny all;
            }
        }
        
        # Metrics endpoint (protected)
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
            
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }
        
        # API fallback
        location @api_fallback {
            return 503 '{"error": "Service temporarily unavailable", "retry_after": 30}';
            add_header Content-Type application/json;
            add_header Retry-After 30;
        }
        
        # Security: Block access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Security: Block access to backup files
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # Monitoring and metrics server
    server {
        listen 8080;
        server_name monitoring.ainflue.com;
        
        location /metrics {
            proxy_pass http://127.0.0.1:9090;
            proxy_set_header Host $host;
            
            # Basic auth for metrics
            auth_basic "Metrics";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
        
        location /grafana/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Load balancer health check server
    server {
        listen 8090;
        server_name health.ainflue.com;
        
        location /health {
            access_log off;
            return 200 'nginx healthy\n';
            add_header Content-Type text/plain;
        }
        
        location /status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }
    }
}

# Stream block for TCP load balancing (database, Redis)
stream {
    # Database load balancing
    upstream database_cluster {
        least_conn;
        server 127.0.0.1:5432 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5433 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:5434 max_fails=3 fail_timeout=30s backup;
    }
    
    # Redis cluster load balancing
    upstream redis_cluster {
        hash $remote_addr consistent;
        server 127.0.0.1:6379 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:6380 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:6381 max_fails=3 fail_timeout=30s;
    }
    
    # Database proxy
    server {
        listen 5432;
        proxy_pass database_cluster;
        proxy_timeout 3s;
        proxy_responses 1;
        proxy_connect_timeout 1s;
    }
    
    # Redis proxy
    server {
        listen 6379;
        proxy_pass redis_cluster;
        proxy_timeout 3s;
        proxy_responses 1;
        proxy_connect_timeout 1s;
    }
}