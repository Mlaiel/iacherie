# Enterprise Utils Test Configuration
# pytest.ini for comprehensive enterprise testing

[tool:pytest]
minversion = 6.0
addopts = 
    -v
    --strict-markers
    --strict-config
    --cov=utils
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=95
    --tb=short
    --asyncio-mode=auto

testpaths = 
    utils/tests

markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    benchmark: marks tests as performance benchmarks
    security: marks tests as security-focused
    integration: marks tests as integration tests
    load_test: marks tests as load/stress tests
    slow: marks tests as slow running

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output
junit_family = xunit2
junit_suite_name = utils_enterprise_tests

# Coverage configuration
[coverage:run]
source = utils
omit = 
    utils/tests/*
    */venv/*
    */virtualenv/*
    */__pycache__/*
    */migrations/*
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
title = Enterprise Utils Coverage Report

[coverage:xml]
output = coverage.xml