# MICROSERVICES DISCOVERY AND HEALTH MONITORING
upstream_conf_server 127.0.0.1:8500;

# CONTENT MANAGEMENT MICROSERVICE CLUSTER
upstream content_management_service {
    # ML-based load balancing with health prediction
    least_conn;
    server content-mgmt-1.internal:3001 max_fails=2 fail_timeout=30s weight=5 slow_start=30s;
    server content-mgmt-2.internal:3001 max_fails=2 fail_timeout=30s weight=5 slow_start=30s;
    server content-mgmt-3.internal:3001 max_fails=2 fail_timeout=30s weight=3 slow_start=30s;
    server content-mgmt-4.internal:3001 max_fails=2 fail_timeout=30s weight=3 backup;
    
    # Advanced connection management
    keepalive 128;
    keepalive_requests 1000;
    keepalive_timeout 60s;
    
    # Service mesh integration
    zone content_upstream 64k;
}

# USER AUTHENTICATION MICROSERVICE CLUSTER
upstream auth_service {
    # Session affinity for auth consistency
    ip_hash;
    server auth-1.internal:3002 max_fails=1 fail_timeout=10s weight=4;
    server auth-2.internal:3002 max_fails=1 fail_timeout=10s weight=4;
    server auth-3.internal:3002 max_fails=1 fail_timeout=10s weight=2 backup;
    
    keepalive 64;
    keepalive_requests 500;
    keepalive_timeout 30s;
    
    zone auth_upstream 32k;
}

# MEDIA PROCESSING MICROSERVICE CLUSTER
upstream media_processing_service {
    # Resource-based routing for media workloads
    least_conn;
    server media-proc-1.internal:3003 max_fails=3 fail_timeout=60s weight=6;
    server media-proc-2.internal:3003 max_fails=3 fail_timeout=60s weight=6;
    server media-proc-3.internal:3003 max_fails=3 fail_timeout=60s weight=4;
    server media-proc-gpu-1.internal:3003 max_fails=2 fail_timeout=90s weight=8;
    
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 120s;
    
    zone media_upstream 128k;
}

# ANALYTICS MICROSERVICE CLUSTER  
upstream analytics_service {
    # Time-series data optimization
    least_conn;
    server analytics-1.internal:3004 max_fails=2 fail_timeout=20s weight=4;
    server analytics-2.internal:3004 max_fails=2 fail_timeout=20s weight=4;
    server analytics-3.internal:3004 max_fails=2 fail_timeout=20s weight=4;
    
    keepalive 96;
    keepalive_requests 2000;
    keepalive_timeout 45s;
    
    zone analytics_upstream 64k;
}

# NOTIFICATION MICROSERVICE CLUSTER
upstream notification_service {
    # Event-driven messaging optimization
    least_conn;
    server notification-1.internal:3005 max_fails=2 fail_timeout=15s weight=3;
    server notification-2.internal:3005 max_fails=2 fail_timeout=15s weight=3;
    server notification-3.internal:3005 max_fails=2 fail_timeout=15s weight=3;
    
    keepalive 48;
    keepalive_requests 800;
    keepalive_timeout 30s;
    
    zone notification_upstream 32k;
}

# COLLABORATION MICROSERVICE CLUSTER
upstream collaboration_service {
    # Real-time collaboration optimization
    ip_hash;
    server collab-1.internal:3006 max_fails=2 fail_timeout=30s weight=4;
    server collab-2.internal:3006 max_fails=2 fail_timeout=30s weight=4;
    server collab-ws-1.internal:3006 max_fails=1 fail_timeout=60s weight=5;
    
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 90s;
    
    zone collaboration_upstream 64k;
}

# PAYMENT MICROSERVICE CLUSTER
upstream payment_service {
    # High-security payment processing
    least_conn;
    server payment-1.internal:3007 max_fails=1 fail_timeout=5s weight=5;
    server payment-2.internal:3007 max_fails=1 fail_timeout=5s weight=5;
    server payment-secure-1.internal:3007 max_fails=1 fail_timeout=5s weight=3;
    
    keepalive 16;
    keepalive_requests 200;
    keepalive_timeout 20s;
    
    zone payment_upstream 32k;
}

# SEARCH MICROSERVICE CLUSTER
upstream search_service {
    # Elasticsearch/search optimization
    least_conn;
    server search-1.internal:3008 max_fails=3 fail_timeout=30s weight=4;
    server search-2.internal:3008 max_fails=3 fail_timeout=30s weight=4;
    server search-3.internal:3008 max_fails=3 fail_timeout=30s weight=2;
    
    keepalive 80;
    keepalive_requests 1500;
    keepalive_timeout 60s;
    
    zone search_upstream 96k;
}

# RECOMMENDATION MICROSERVICE CLUSTER
upstream recommendation_service {
    # ML-based recommendation optimization
    least_conn;
    server recommend-1.internal:3009 max_fails=2 fail_timeout=45s weight=4;
    server recommend-2.internal:3009 max_fails=2 fail_timeout=45s weight=4;
    server recommend-ml-1.internal:3009 max_fails=3 fail_timeout=60s weight=6;
    
    keepalive 40;
    keepalive_requests 600;
    keepalive_timeout 75s;
    
    zone recommendation_upstream 64k;
}

# ADVANCED LOAD BALANCING ALGORITHMS
split_clients $request_id $backend_pool {
    10% content_management_service;
    20% media_processing_service;
    30% analytics_service;
    40% recommendation_service;
}

# SERVICE MESH INTEGRATION HEADERS
map $http_x_mesh_id $service_mesh_routing {
    default "direct";
    ~^istio "istio-routing";
    ~^linkerd "linkerd-routing";
    ~^consul "consul-routing";
}

# MICROSERVICE RATE LIMITING
limit_req_zone $binary_remote_addr zone=microservice_limit:100m rate=100r/s;
limit_req_zone $http_x_user_id zone=user_service_limit:50m rate=50r/s;
limit_req_zone $http_x_api_key zone=api_service_limit:50m rate=200r/s;

# CIRCUIT BREAKER CONFIGURATION
map $upstream_response_time $circuit_breaker_status {
    ~^[0-4] "healthy";
    ~^[5-9] "degraded";
    ~^[1-9][0-9] "failing";
    default "circuit_open";
}

# CONTENT MANAGEMENT SERVICE ROUTING
location /api/content/ {
    # Rate limiting with burst
    limit_req zone=microservice_limit burst=20 nodelay;
    limit_req zone=user_service_limit burst=10 nodelay;
    
    # Service mesh headers
    proxy_set_header X-Service-Name "content-management";
    proxy_set_header X-Service-Version "2.1.0";
    proxy_set_header X-Trace-ID $request_id;
    proxy_set_header X-Span-ID $msec;
    
    # Load balancing with health checks
    proxy_pass http://content_management_service;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;
    
    # Connection optimization
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Timeouts optimization
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Response buffering
    proxy_buffering on;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    
    # Health monitoring
    add_header X-Upstream-Server $upstream_addr;
    add_header X-Response-Time $upstream_response_time;
    add_header X-Service-Health $circuit_breaker_status;
}

# AUTHENTICATION SERVICE ROUTING
location /api/auth/ {
    # Strict rate limiting for auth
    limit_req zone=user_service_limit burst=5 nodelay;
    
    # Session affinity enforcement
    proxy_pass http://auth_service;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;
    
    # Auth-specific headers
    proxy_set_header X-Service-Name "authentication";
    proxy_set_header X-Service-Version "1.8.0";
    proxy_set_header X-Auth-Request-ID $request_id;
    proxy_set_header X-Client-IP $remote_addr;
    
    # Security headers
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    
    # Fast auth timeouts
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    
    # No caching for auth
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    
    add_header X-Auth-Server $upstream_addr;
    add_header X-Auth-Time $upstream_response_time;
}

# MEDIA PROCESSING SERVICE ROUTING
location /api/media/ {
    # Media-specific rate limiting
    limit_req zone=microservice_limit burst=10 nodelay;
    
    # Large file handling
    client_max_body_size 2g;
    proxy_request_buffering off;
    
    # GPU-optimized routing
    proxy_pass http://media_processing_service;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 30s;
    
    # Media processing headers
    proxy_set_header X-Service-Name "media-processing";
    proxy_set_header X-Service-Version "3.2.0";
    proxy_set_header X-Media-Type $arg_type;
    proxy_set_header X-Processing-Priority $arg_priority;
    
    # Extended timeouts for media processing
    proxy_connect_timeout 30s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    
    # Large response handling
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    
    add_header X-Media-Server $upstream_addr;
    add_header X-Processing-Time $upstream_response_time;
}

# ANALYTICS SERVICE ROUTING
location /api/analytics/ {
    # Analytics rate limiting
    limit_req zone=microservice_limit burst=50 nodelay;
    
    # Time-series optimization
    proxy_pass http://analytics_service;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 15s;
    
    # Analytics headers
    proxy_set_header X-Service-Name "analytics";
    proxy_set_header X-Service-Version "2.5.0";
    proxy_set_header X-Analytics-Session $arg_session;
    proxy_set_header X-Time-Range $arg_range;
    
    # Analytics-optimized timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Caching for analytics data
    proxy_cache analytics_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri$args";
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    
    add_header X-Analytics-Server $upstream_addr;
    add_header X-Cache-Status $upstream_cache_status;
}

# WEBSOCKET COLLABORATION SERVICE
location /ws/collaboration/ {
    # WebSocket-specific configuration
    proxy_pass http://collaboration_service;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket headers
    proxy_set_header X-Service-Name "collaboration-ws";
    proxy_set_header X-WS-Session-ID $arg_session;
    proxy_set_header X-Collaboration-Room $arg_room;
    
    # Long-lived connection timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    
    # WebSocket-specific optimizations
    proxy_buffering off;
    proxy_cache off;
    
    add_header X-WS-Server $upstream_addr;
}

# PAYMENT SERVICE ROUTING - High Security
location /api/payment/ {
    # Strict payment rate limiting
    limit_req zone=api_service_limit burst=5 nodelay;
    
    # High-security payment routing
    proxy_pass http://payment_service;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 1;
    proxy_next_upstream_timeout 3s;
    
    # Payment security headers
    proxy_set_header X-Service-Name "payment";
    proxy_set_header X-Service-Version "1.5.0";
    proxy_set_header X-Payment-ID $request_id;
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Payment-Method $arg_method;
    
    # Fast payment timeouts
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    
    # No caching for payments
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    
    # Enhanced security
    add_header X-Payment-Server $upstream_addr;
    add_header X-Transaction-Time $upstream_response_time;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# MICROSERVICES HEALTH MONITORING
location /health/microservices {
    access_log off;
    
    # Aggregate health check
    content_by_lua_block {
        local http = require "resty.http"
        local httpc = http.new()
        
        local services = {
            "content-management",
            "authentication", 
            "media-processing",
            "analytics",
            "notification",
            "collaboration",
            "payment",
            "search",
            "recommendation"
        }
        
        local health_status = {}
        
        for _, service in ipairs(services) do
            local res, err = httpc:request_uri("http://" .. service .. ".internal/health", {
                method = "GET",
                timeout = 3000
            })
            
            if res and res.status == 200 then
                health_status[service] = "healthy"
            else
                health_status[service] = "unhealthy"
            end
        end
        
        ngx.header.content_type = "application/json"
        ngx.say(require("cjson").encode(health_status))
    }
    
    add_header X-Health-Check "microservices-aggregate";
}

# SERVICE MESH METRICS
location /metrics/microservices {
    access_log off;
    
    # Prometheus metrics for service mesh
    content_by_lua_block {
        local metrics = {
            nginx_microservice_requests_total = 0,
            nginx_microservice_response_time_seconds = 0,
            nginx_microservice_upstream_errors_total = 0,
            nginx_microservice_active_connections = 0
        }
        
        -- Generate metrics output
        ngx.header.content_type = "text/plain"
        for metric, value in pairs(metrics) do
            ngx.say(metric .. " " .. value)
        end
    }
    
    # Restrict to monitoring systems
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}

# MICROSERVICES ERROR HANDLING
error_page 502 503 504 /microservice_error.html;
location = /microservice_error.html {
    root /var/www/html/errors;
    internal;
    add_header Content-Type text/html;
    add_header X-Error-Type "microservice-unavailable";
}

# MICROSERVICES LOGGING
log_format microservices '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '$request_time $upstream_response_time '
                         '"$upstream_addr" "$http_x_service_name" '
                         '"$request_id" "$circuit_breaker_status"';

# MICROSERVICES DASHBOARD
location /dashboard/microservices {
    root /var/www/html/dashboards;
    index microservices-dashboard.html;
    
    # Admin access only
    auth_basic "Microservices Dashboard";
    auth_basic_user_file /etc/nginx/htpasswd;
    
    add_header X-Dashboard-Type "microservices-monitoring";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}