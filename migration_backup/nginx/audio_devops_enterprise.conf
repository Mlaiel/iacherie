# AUDIO STREAMING UPSTREAM SERVERS
upstream audio_streaming_primary {
    least_conn;
    server audio-stream-1.media.internal:8080 max_fails=2 fail_timeout=30s weight=6;
    server audio-stream-2.media.internal:8080 max_fails=2 fail_timeout=30s weight=6;
    server audio-stream-3.media.internal:8080 max_fails=2 fail_timeout=30s weight=4;
    keepalive 128;
    keepalive_requests 1000;
    keepalive_timeout 120s;
}

upstream audio_processing_cluster {
    least_conn;
    server audio-proc-1.media.internal:8081 max_fails=3 fail_timeout=60s weight=5;
    server audio-proc-2.media.internal:8081 max_fails=3 fail_timeout=60s weight=5;
    server audio-proc-gpu-1.media.internal:8081 max_fails=2 fail_timeout=90s weight=7;
    keepalive 64;
    keepalive_requests 500;
    keepalive_timeout 180s;
}

upstream audio_transcoding_cluster {
    least_conn;
    server transcode-1.media.internal:8082 max_fails=3 fail_timeout=45s weight=4;
    server transcode-2.media.internal:8082 max_fails=3 fail_timeout=45s weight=4;
    server transcode-3.media.internal:8082 max_fails=3 fail_timeout=45s weight=4;
    keepalive 32;
    keepalive_requests 200;
    keepalive_timeout 300s;
}

upstream live_streaming_cluster {
    ip_hash;
    server live-stream-1.media.internal:8083 max_fails=1 fail_timeout=10s weight=5;
    server live-stream-2.media.internal:8083 max_fails=1 fail_timeout=10s weight=5;
    server live-stream-3.media.internal:8083 max_fails=1 fail_timeout=10s weight=3;
    keepalive 96;
    keepalive_requests 2000;
    keepalive_timeout 3600s;
}

# AUDIO CACHE OPTIMIZATION
proxy_cache_path /var/cache/nginx/audio_files 
    levels=1:2 
    keys_zone=audio_cache:2g 
    max_size=100g 
    inactive=168h 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/audio_chunks 
    levels=1:2 
    keys_zone=chunk_cache:512m 
    max_size=50g 
    inactive=72h 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/transcoded_audio 
    levels=1:2 
    keys_zone=transcode_cache:1g 
    max_size=80g 
    inactive=120h 
    use_temp_path=off;

# AUDIO STREAMING RATE LIMITING
limit_req_zone $binary_remote_addr zone=audio_streaming:100m rate=30r/s;
limit_req_zone $binary_remote_addr zone=audio_upload:50m rate=5r/s;
limit_req_zone $binary_remote_addr zone=live_streaming:50m rate=10r/s;

# AUDIO FORMAT DETECTION
map $http_accept $preferred_audio_format {
    default "mp3";
    ~*webm "webm";
    ~*ogg "ogg";
    ~*flac "flac";
    ~*wav "wav";
    ~*aac "aac";
}

# AUDIO QUALITY DETECTION
map $http_x_audio_quality $audio_bitrate {
    default "320k";
    "low" "128k";
    "medium" "192k";
    "high" "320k";
    "lossless" "flac";
}

# DEVICE-SPECIFIC AUDIO OPTIMIZATION
map $http_user_agent $audio_optimization {
    default "standard";
    ~*iPhone "ios_optimized";
    ~*Android "android_optimized";
    ~*Chrome "chrome_optimized";
    ~*Firefox "firefox_optimized";
    ~*Safari "safari_optimized";
}

# AUDIO STREAMING MIDDLEWARE
init_by_lua_block {
    local audio_processor = require "audio_processor"
    local streaming_optimizer = require "streaming_optimizer"
    local devops_monitor = require "devops_monitor"
    
    -- Initialize audio processing engines
    audio_processor.init({
        supported_formats = {"mp3", "wav", "flac", "aac", "ogg", "webm"},
        max_bitrate = "320k",
        max_file_size = "500MB",
        processing_timeout = 600
    })
    
    -- Initialize streaming optimization
    streaming_optimizer.init({
        chunk_size = "64KB",
        buffer_size = "1MB",
        adaptive_bitrate = true,
        low_latency_mode = true
    })
    
    -- Initialize DevOps monitoring
    devops_monitor.init({
        metrics_interval = 30,
        alert_thresholds = {
            cpu_usage = 80,
            memory_usage = 85,
            disk_usage = 90,
            response_time = 5000
        }
    })
}

# AUDIO FILE STREAMING
location /audio/stream/ {
    # Audio streaming rate limiting
    limit_req zone=audio_streaming burst=20 nodelay;
    
    # Audio optimization middleware
    access_by_lua_block {
        local audio_optimizer = require "audio_optimizer"
        local streaming_analytics = require "streaming_analytics"
        
        -- Parse audio request
        local file_id = ngx.var.arg_id
        local format = ngx.var.arg_format or ngx.var.preferred_audio_format
        local quality = ngx.var.arg_quality or "high"
        local start_time = ngx.var.arg_t or "0"
        
        if not file_id then
            ngx.status = 400
            ngx.say('{"error":"Audio file ID required"}')
            ngx.exit(400)
        end
        
        -- Optimize audio delivery parameters
        local optimization = audio_optimizer.optimize_delivery({
            file_id = file_id,
            format = format,
            quality = quality,
            user_agent = ngx.var.http_user_agent,
            connection_speed = ngx.var.http_x_connection_speed,
            device_type = ngx.var.audio_optimization
        })
        
        -- Set optimized parameters
        ngx.var.audio_format = optimization.format
        ngx.var.audio_bitrate = optimization.bitrate
        ngx.var.chunk_size = optimization.chunk_size
        ngx.var.cache_duration = optimization.cache_duration
        
        -- Track streaming analytics
        streaming_analytics.track_stream_start({
            file_id = file_id,
            user_id = ngx.var.http_x_user_id,
            format = format,
            quality = quality,
            timestamp = ngx.time()
        })
    }
    
    # Route to audio streaming cluster
    proxy_pass http://audio_streaming_primary;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Audio-Format $audio_format;
    proxy_set_header X-Audio-Bitrate $audio_bitrate;
    proxy_set_header X-Chunk-Size $chunk_size;
    proxy_set_header Range $http_range;
    
    # Audio streaming optimizations
    proxy_buffering off;
    proxy_cache audio_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri$audio_format$audio_bitrate";
    proxy_cache_valid 200 206 $cache_duration;
    proxy_cache_valid 404 5m;
    
    # Streaming timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Support for range requests (seeking)
    proxy_set_header Range $http_range;
    proxy_cache_bypass $http_range;
    
    # Audio streaming headers
    add_header Accept-Ranges bytes;
    add_header X-Audio-Server $upstream_addr;
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Audio-Format $audio_format;
    add_header X-Audio-Bitrate $audio_bitrate;
    
    # CORS for audio streaming
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    add_header Access-Control-Allow-Headers "Range, Content-Range";
}

# AUDIO UPLOAD AND PROCESSING
location /audio/upload/ {
    # Upload rate limiting
    limit_req zone=audio_upload burst=3 nodelay;
    
    # Large file upload support
    client_max_body_size 500m;
    client_body_buffer_size 1m;
    client_body_timeout 300s;
    proxy_request_buffering off;
    
    # Upload processing middleware
    access_by_lua_block {
        local upload_processor = require "upload_processor"
        local file_validator = require "file_validator"
        
        -- Validate upload request
        local content_type = ngx.var.http_content_type or ""
        local content_length = tonumber(ngx.var.http_content_length) or 0
        local file_name = ngx.var.arg_filename or ""
        
        -- Validate audio file
        local validation = file_validator.validate_audio_upload({
            content_type = content_type,
            content_length = content_length,
            filename = file_name,
            max_size = 500 * 1024 * 1024, -- 500MB
            allowed_formats = {"audio/mpeg", "audio/wav", "audio/flac", "audio/aac", "audio/ogg"}
        })
        
        if not validation.valid then
            ngx.status = 400
            ngx.say('{"error":"' .. validation.error .. '"}')
            ngx.exit(400)
        end
        
        -- Generate upload ID
        local upload_id = upload_processor.generate_upload_id()
        ngx.var.upload_id = upload_id
        
        -- Set processing headers
        ngx.req.set_header("X-Upload-ID", upload_id)
        ngx.req.set_header("X-Processing-Priority", "high")
        ngx.req.set_header("X-Auto-Transcode", "true")
    }
    
    # Route to audio processing cluster
    proxy_pass http://audio_processing_cluster;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Upload-ID $upload_id;
    proxy_set_header X-User-ID $http_x_user_id;
    proxy_set_header X-File-Name $arg_filename;
    
    # Upload timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    
    # No caching for uploads
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    
    add_header X-Upload-ID $upload_id;
    add_header X-Processing-Server $upstream_addr;
}

# AUDIO TRANSCODING
location /audio/transcode/ {
    # Transcoding rate limiting
    limit_req zone=audio_upload burst=5 nodelay;
    
    # Transcoding middleware
    access_by_lua_block {
        local transcoding_manager = require "transcoding_manager"
        
        -- Parse transcoding request
        local source_format = ngx.var.arg_source or "mp3"
        local target_format = ngx.var.arg_target or "mp3"
        local bitrate = ngx.var.arg_bitrate or "192k"
        local file_id = ngx.var.arg_file_id
        
        if not file_id then
            ngx.status = 400
            ngx.say('{"error":"File ID required"}')
            ngx.exit(400)
        end
        
        -- Check transcoding cache
        local cache_key = transcoding_manager.generate_cache_key({
            file_id = file_id,
            source_format = source_format,
            target_format = target_format,
            bitrate = bitrate
        })
        
        local cached_result = transcoding_manager.get_cached_transcode(cache_key)
        if cached_result then
            ngx.header.content_type = "application/json"
            ngx.header["X-Cache-Hit"] = "true"
            ngx.say(cached_result)
            ngx.exit(200)
        end
        
        -- Set transcoding parameters
        ngx.var.transcode_cache_key = cache_key
        ngx.var.source_format = source_format
        ngx.var.target_format = target_format
        ngx.var.target_bitrate = bitrate
    }
    
    # Route to transcoding cluster
    proxy_pass http://audio_transcoding_cluster;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Source-Format $source_format;
    proxy_set_header X-Target-Format $target_format;
    proxy_set_header X-Target-Bitrate $target_bitrate;
    proxy_set_header X-Cache-Key $transcode_cache_key;
    
    # Transcoding timeouts (can be long)
    proxy_connect_timeout 30s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    
    # Cache transcoded results
    proxy_cache transcode_cache;
    proxy_cache_key $transcode_cache_key;
    proxy_cache_valid 200 168h; # 1 week
    proxy_cache_valid 404 10m;
    
    add_header X-Transcode-Server $upstream_addr;
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Source-Format $source_format;
    add_header X-Target-Format $target_format;
}

# LIVE AUDIO STREAMING
location /audio/live/ {
    # Live streaming rate limiting
    limit_req zone=live_streaming burst=10 nodelay;
    
    # WebSocket upgrade for live streaming
    proxy_pass http://live_streaming_cluster;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # Live streaming headers
    proxy_set_header X-Stream-Type "live";
    proxy_set_header X-Audio-Quality $arg_quality;
    proxy_set_header X-Stream-ID $arg_stream_id;
    
    # Long-lived connection timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    
    # No caching for live streams
    proxy_buffering off;
    proxy_cache off;
    
    add_header X-Stream-Server $upstream_addr;
    add_header X-Stream-Type "live";
}

# AUDIO ANALYTICS AND MONITORING
location /audio/analytics/ {
    access_by_lua_block {
        local audio_analytics = require "audio_analytics"
        
        -- Collect audio streaming metrics
        if ngx.var.request_method == "POST" then
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            local analytics_data = require("cjson").decode(body)
            
            audio_analytics.record_event(analytics_data)
            
            ngx.header.content_type = "application/json"
            ngx.say('{"status":"recorded","timestamp":"' .. ngx.time() .. '"}')
            ngx.exit(200)
        else
            -- Get analytics data
            local metrics = audio_analytics.get_metrics(ngx.req.get_uri_args())
            
            ngx.header.content_type = "application/json"
            ngx.say(require("cjson").encode(metrics))
            ngx.exit(200)
        end
    }
}

# DEVOPS AUTOMATION ENDPOINTS
location /devops/deploy/ {
    # DevOps automation middleware
    access_by_lua_block {
        local deployment_manager = require "deployment_manager"
        local service_monitor = require "service_monitor"
        
        if ngx.var.request_method == "POST" then
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            local deploy_config = require("cjson").decode(body)
            
            -- Validate deployment request
            local validation = deployment_manager.validate_deployment(deploy_config)
            if not validation.valid then
                ngx.status = 400
                ngx.say('{"error":"' .. validation.error .. '"}')
                ngx.exit(400)
            end
            
            -- Trigger deployment
            local deployment_id = deployment_manager.start_deployment(deploy_config)
            
            ngx.header.content_type = "application/json"
            ngx.say('{"deployment_id":"' .. deployment_id .. '","status":"started"}')
            ngx.exit(200)
        else
            -- Get deployment status
            local deployments = deployment_manager.get_active_deployments()
            
            ngx.header.content_type = "application/json"
            ngx.say(require("cjson").encode(deployments))
            ngx.exit(200)
        end
    }
    
    # DevOps team access only
    auth_basic "DevOps Deployment";
    auth_basic_user_file /etc/nginx/devops_htpasswd;
}

# HEALTH MONITORING FOR AUDIO SERVICES
location /health/audio {
    access_log off;
    
    content_by_lua_block {
        local audio_health = require "audio_health"
        
        -- Check all audio services
        local health_status = {
            streaming = audio_health.check_streaming_cluster(),
            processing = audio_health.check_processing_cluster(),
            transcoding = audio_health.check_transcoding_cluster(),
            live_streaming = audio_health.check_live_cluster()
        }
        
        local overall_health = true
        for service, status in pairs(health_status) do
            if not status.healthy then
                overall_health = false
                break
            end
        end
        
        health_status.overall_healthy = overall_health
        health_status.timestamp = ngx.time()
        
        ngx.header.content_type = "application/json"
        ngx.say(require("cjson").encode(health_status))
        
        if not overall_health then
            ngx.status = 503
        end
    }
    
    add_header X-Health-Check "audio-services";
}

# AUDIO PERFORMANCE METRICS
location /metrics/audio {
    access_log off;
    
    content_by_lua_block {
        local audio_metrics = require "audio_metrics"
        
        -- Get audio performance metrics
        local metrics = audio_metrics.get_prometheus_metrics()
        
        ngx.header.content_type = "text/plain"
        ngx.say(metrics)
    }
    
    # Monitoring systems only
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}

# DEVOPS METRICS
location /metrics/devops {
    access_log off;
    
    content_by_lua_block {
        local devops_metrics = require "devops_metrics"
        
        -- Get DevOps automation metrics
        local metrics = {
            "# TYPE nginx_devops_deployments_total counter",
            "nginx_devops_deployments_total " .. devops_metrics.get_deployment_count(),
            "",
            "# TYPE nginx_devops_uptime_seconds gauge",
            "nginx_devops_uptime_seconds " .. (ngx.time() - devops_metrics.get_start_time()),
            "",
            "# TYPE nginx_devops_cpu_usage_percent gauge",
            "nginx_devops_cpu_usage_percent " .. devops_metrics.get_cpu_usage(),
            "",
            "# TYPE nginx_devops_memory_usage_percent gauge", 
            "nginx_devops_memory_usage_percent " .. devops_metrics.get_memory_usage()
        }
        
        ngx.header.content_type = "text/plain"
        ngx.say(table.concat(metrics, "\n"))
    }
    
    # Monitoring systems only
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}

# AUDIO DASHBOARD
location /dashboard/audio {
    root /var/www/html/dashboards;
    index audio-dashboard.html;
    
    # Audio team access
    auth_basic "Audio Dashboard";
    auth_basic_user_file /etc/nginx/audio_htpasswd;
    
    add_header X-Dashboard-Type "audio-monitoring";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# DEVOPS DASHBOARD
location /dashboard/devops {
    root /var/www/html/dashboards;
    index devops-dashboard.html;
    
    # DevOps team access
    auth_basic "DevOps Dashboard";
    auth_basic_user_file /etc/nginx/devops_htpasswd;
    
    add_header X-Dashboard-Type "devops-monitoring";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# AUDIO LOGGING
log_format audio_streaming '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          '$request_time $upstream_response_time '
                          '"$audio_format" "$audio_bitrate" "$chunk_size" '
                          '"$upstream_addr" "$upstream_cache_status"';

# ERROR HANDLING
error_page 502 503 504 /audio_service_error.html;
location = /audio_service_error.html {
    root /var/www/html/errors;
    internal;
    add_header Content-Type text/html;
    add_header X-Error-Type "audio-service-unavailable";
}