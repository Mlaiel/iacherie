# =============================================================================
# AUDIO FORMAT DETECTION AND OPTIMIZATION
# =============================================================================

# Audio Format Recognition
map $http_content_type $audio_format {
    default "unknown";
    "audio/mpeg" "mp3";
    "audio/mp3" "mp3";
    "audio/wav" "wav";
    "audio/wave" "wav";
    "audio/x-wav" "wav";
    "audio/flac" "flac";
    "audio/x-flac" "flac";
    "audio/aac" "aac";
    "audio/mp4" "m4a";
    "audio/ogg" "ogg";
    "audio/opus" "opus";
    "audio/webm" "webm";
    "audio/x-ms-wma" "wma";
}

# Audio Quality Detection
map $http_x_audio_bitrate $audio_quality {
    default "standard";
    "~*32|64|96" "low";
    "~*128|160|192" "standard";
    "~*256|320" "high";
    "~*[5-9][0-9][0-9]|1[0-9][0-9][0-9]" "lossless";
}

# Audio Content Category
map $http_x_audio_category $audio_content_type {
    default "general";
    "music" "music";
    "podcast" "podcast";
    "audiobook" "audiobook";
    "sound_effect" "sfx";
    "voice_over" "voice";
    "interview" "interview";
    "live_recording" "live";
}

# =============================================================================
# INTELLIGENT AUDIO CACHING STRATEGIES
# =============================================================================

# Audio-Specific Cache Zones
proxy_cache_path /var/cache/nginx/audio_lossless 
    levels=1:2 
    keys_zone=audio_lossless:100m 
    max_size=50g 
    inactive=7d 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/audio_compressed 
    levels=1:2 
    keys_zone=audio_compressed:200m 
    max_size=100g 
    inactive=30d 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/audio_streaming 
    levels=1:2 
    keys_zone=audio_streaming:50m 
    max_size=20g 
    inactive=3d 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/audio_preview 
    levels=1:2 
    keys_zone=audio_preview:30m 
    max_size=5g 
    inactive=1d 
    use_temp_path=off;

# Cache Key Optimization for Audio
map "$audio_format|$audio_quality|$http_x_creator_id" $audio_cache_key {
    default "default_audio";
    "mp3|standard|.*" "mp3_std_$http_x_creator_id";
    "flac|lossless|.*" "flac_hq_$http_x_creator_id";
    "aac|high|.*" "aac_hq_$http_x_creator_id";
}

# Audio Cache Selection
map "$audio_format|$audio_quality|$request_uri" $audio_cache_zone {
    default "audio_compressed";
    "flac|lossless|.*" "audio_lossless";
    "wav|lossless|.*" "audio_lossless";
    "~*.*|.*|.*preview.*" "audio_preview";
    "~*.*|.*|.*stream.*" "audio_streaming";
}

# =============================================================================
# AUDIO STREAMING OPTIMIZATION
# =============================================================================

# Progressive Download Configuration
map $audio_format $progressive_download {
    default "enabled";
    "flac" "chunked";
    "wav" "chunked";
    "mp3" "enabled";
    "aac" "enabled";
}

# Adaptive Bitrate Selection
map "$http_user_agent|$http_connection|$http_x_bandwidth" $adaptive_bitrate {
    default "256";
    "~*Mobile.*|.*|low" "128";
    "~*iPhone.*|.*|medium" "192";
    "~*Chrome.*|keep-alive|high" "320";
    "~*Firefox.*|keep-alive|high" "320";
}

# Audio Chunk Size Optimization
map "$audio_format|$audio_quality|$http_range" $audio_chunk_size {
    default "1024k";
    "mp3|standard|.*" "512k";
    "flac|lossless|.*" "2048k";
    "wav|lossless|.*" "2048k";
    "~*.*|.*|bytes=.*" "256k";  # For range requests
}

# =============================================================================
# REAL-TIME AUDIO PROCESSING PIPELINE
# =============================================================================

# Audio Upload Size Limits
map $audio_format $max_upload_size {
    default "100m";
    "mp3" "50m";
    "aac" "50m";
    "flac" "500m";
    "wav" "1000m";
    "ogg" "200m";
}

# Audio Processing Priority
map "$audio_content_type|$audio_quality|$http_x_priority" $processing_priority {
    default "normal";
    "music|lossless|high" "high";
    "podcast|standard|.*" "normal";
    "live|.*|urgent" "critical";
    "preview|.*|.*" "low";
}

# AI Audio Processing Routes
map "$audio_content_type|$http_x_ai_enhance" $ai_processing_required {
    default "none";
    "music|true" "audio_enhancement";
    "podcast|true" "noise_reduction";
    "voice|true" "voice_clarity";
    "live|true" "real_time_filter";
}

# =============================================================================
# AUDIO CONTENT DELIVERY NETWORK (CDN) OPTIMIZATION
# =============================================================================

# Geographic Audio Distribution
map $geoip_country_code $audio_cdn_node {
    default "global";
    "US" "us_east";
    "CA" "us_east";
    "GB" "eu_west";
    "DE" "eu_central";
    "FR" "eu_west";
    "JP" "asia_pacific";
    "AU" "asia_pacific";
    "BR" "south_america";
}

# Audio CDN Cache Headers
map "$audio_format|$audio_quality" $audio_cache_control {
    default "public, max-age=86400";
    "mp3|standard" "public, max-age=259200";  # 3 days
    "flac|lossless" "public, max-age=604800"; # 7 days
    "~*.*|low" "public, max-age=43200";       # 12 hours
}

# Audio Compression Optimization
map $audio_format $audio_compression {
    default "off";
    "wav" "gzip";  # Text metadata in WAV can be compressed
    "flac" "off";  # Already compressed
    "mp3" "off";   # Already compressed
    "aac" "off";   # Already compressed
}

# =============================================================================
# DIGITAL RIGHTS MANAGEMENT (DRM) AND PROTECTION
# =============================================================================

# Audio Content Protection Level
map "$audio_content_type|$http_x_drm_enabled|$audio_quality" $content_protection_level {
    default "basic";
    "music|true|lossless" "enterprise";
    "music|true|high" "advanced";
    "podcast|false|.*" "basic";
    "audiobook|true|.*" "advanced";
}

# Watermarking Requirements
map "$content_protection_level|$http_x_creator_tier" $watermark_required {
    default "none";
    "enterprise|premium" "digital_watermark";
    "advanced|pro" "audio_signature";
    "basic|standard" "metadata_only";
}

# Anti-Piracy Measures
map "$http_referer|$http_user_agent|$content_protection_level" $anti_piracy_check {
    default "allow";
    "~*torrent.*|.*bot.*|enterprise" "challenge";
    "~*download.*|.*scraper.*|advanced" "block";
    ".*|.*|basic" "allow";
}

# =============================================================================
# AUDIO ANALYTICS AND TELEMETRY
# =============================================================================

# Audio Engagement Tracking
map "$request_uri|$http_range|$bytes_sent" $audio_engagement_type {
    default "unknown";
    "~*.*|bytes=0-.*|.*" "play_start";
    "~*.*|bytes=[1-9].*|.*" "seek_event";
    "~*.*|.*|.*" "full_download";
}

# Audio Quality Metrics
map "$upstream_response_time|$bytes_sent|$request_time" $audio_delivery_quality {
    default "good";
    "~*[0-2]\.[0-9]+|.*|[0-5]\.[0-9]+" "excellent";
    "~*[3-5]\.[0-9]+|.*|[6-9]\.[0-9]+" "good";
    "~*[6-9]\.[0-9]+|.*|[1-9][0-9]\.[0-9]+" "poor";
}

# Audio Business Intelligence
map "$audio_content_type|$audio_quality|$geoip_country_code" $audio_revenue_segment {
    default "standard";
    "music|lossless|US" "premium_us";
    "music|lossless|DE" "premium_eu";
    "podcast|standard|.*" "advertising";
    "audiobook|high|.*" "subscription";
}

# =============================================================================
# SPECIALIZED AUDIO LOG FORMATS
# =============================================================================

# Audio Streaming Analytics Log
log_format audio_streaming_analytics 
    '{"timestamp":"$time_iso8601",'
    '"audio_metadata":{'
        '"format":"$audio_format",'
        '"quality":"$audio_quality",'
        '"bitrate":"$http_x_audio_bitrate",'
        '"duration":"$http_x_audio_duration",'
        '"content_type":"$audio_content_type",'
        '"creator_id":"$http_x_creator_id"'
    '},'
    '"delivery_metrics":{'
        '"bytes_sent":"$bytes_sent",'
        '"request_time":"$request_time",'
        '"cache_status":"$upstream_cache_status",'
        '"cdn_node":"$audio_cdn_node",'
        '"delivery_quality":"$audio_delivery_quality"'
    '},'
    '"engagement":{'
        '"engagement_type":"$audio_engagement_type",'
        '"seek_position":"$http_range",'
        '"user_agent":"$http_user_agent",'
        '"referrer":"$http_referer"'
    '},'
    '"protection":{'
        '"protection_level":"$content_protection_level",'
        '"watermark":"$watermark_required",'
        '"drm_enabled":"$http_x_drm_enabled",'
        '"anti_piracy":"$anti_piracy_check"'
    '}}';

# Audio Performance Log
log_format audio_performance
    '{"timestamp":"$time_iso8601",'
    '"performance":{'
        '"upload_time":"$request_time",'
        '"processing_time":"$http_x_processing_time",'
        '"encoding_time":"$http_x_encoding_time",'
        '"cdn_propagation":"$http_x_cdn_propagation"'
    '},'
    '"quality_metrics":{'
        '"original_bitrate":"$http_x_original_bitrate",'
        '"final_bitrate":"$adaptive_bitrate",'
        '"compression_ratio":"$http_x_compression_ratio",'
        '"quality_score":"$http_x_quality_score"'
    '},'
    '"business_intelligence":{'
        '"revenue_segment":"$audio_revenue_segment",'
        '"creator_tier":"$http_x_creator_tier",'
        '"monetization_model":"$http_x_monetization_model",'
        '"estimated_revenue":"$http_x_estimated_revenue"'
    '}}';

# =============================================================================
# AUDIO-SPECIFIC LOCATION BLOCKS
# =============================================================================

# Music Upload and Processing
location /api/audio/music {
    client_max_body_size $max_upload_size;
    client_body_timeout 300s;
    client_header_timeout 60s;
    
    # Audio-specific rate limiting
    limit_req zone=upload_protection burst=3 nodelay;
    limit_req zone=api_protection burst=10 nodelay;
    
    # Audio processing headers
    proxy_set_header X-Audio-Format $audio_format;
    proxy_set_header X-Audio-Quality $audio_quality;
    proxy_set_header X-Processing-Priority $processing_priority;
    
    # Route to appropriate upstream based on processing needs
    if ($ai_processing_required = "audio_enhancement") {
        proxy_pass http://ai_audio_enhancement_service;
        break;
    }
    
    proxy_pass http://audio_processing_service;
    
    access_log /var/log/nginx/audio_uploads.log audio_performance;
}

# Audio Streaming Endpoint
location /stream/audio {
    # Enable range requests for audio streaming
    add_header Accept-Ranges bytes;
    
    # Audio streaming optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Cache configuration
    proxy_cache $audio_cache_zone;
    proxy_cache_key $audio_cache_key;
    proxy_cache_valid 200 206 $audio_cache_control;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    
    # Streaming headers
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Audio-Format $audio_format;
    add_header X-Content-Protection $content_protection_level;
    
    # Anti-piracy checks
    if ($anti_piracy_check = "block") {
        return 403 "Access denied: Content protection violation";
    }
    
    if ($anti_piracy_check = "challenge") {
        return 429 "Rate limited: Please verify your request";
    }
    
    proxy_pass http://audio_cdn_service;
    
    access_log /var/log/nginx/audio_streaming.log audio_streaming_analytics;
}

# Real-time Audio Processing
location /api/audio/realtime {
    # WebSocket upgrade for real-time audio
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    
    # Real-time processing timeout
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    
    # Route to real-time audio processing service
    proxy_pass http://realtime_audio_service;
    
    access_log /var/log/nginx/realtime_audio.log audio_performance;
}

# Audio Analytics Dashboard
location /dashboard/audio {
    access_log off;
    allow 10.0.0.0/8;
    deny all;
    
    content_by_lua_block {
        local audio_stats = {
            active_streams = ngx.var.active_audio_streams,
            total_uploads_today = ngx.var.audio_uploads_today,
            streaming_bandwidth = ngx.var.audio_streaming_bandwidth,
            cache_hit_ratio = ngx.var.audio_cache_hit_ratio,
            quality_distribution = {
                lossless = ngx.var.lossless_percentage,
                high = ngx.var.high_quality_percentage,
                standard = ngx.var.standard_quality_percentage
            },
            content_types = {
                music = ngx.var.music_percentage,
                podcast = ngx.var.podcast_percentage,
                audiobook = ngx.var.audiobook_percentage
            },
            regional_performance = {
                us_east = ngx.var.us_east_latency,
                eu_west = ngx.var.eu_west_latency,
                asia_pacific = ngx.var.asia_pacific_latency
            }
        }
        ngx.say(require("cjson").encode(audio_stats))
    }
}

# =============================================================================
# AUDIO CODEC OPTIMIZATION AND TRANSCODING
# =============================================================================

# Automatic Format Conversion
location /api/audio/convert {
    client_max_body_size 1000m;
    client_body_timeout 600s;
    
    # Transcoding service routing
    proxy_pass http://audio_transcoding_service;
    proxy_set_header X-Source-Format $audio_format;
    proxy_set_header X-Target-Format $http_x_target_format;
    proxy_set_header X-Target-Quality $http_x_target_quality;
    
    access_log /var/log/nginx/audio_transcoding.log audio_performance;
}

# Audio Preview Generation
location /api/audio/preview {
    # Quick preview generation
    proxy_pass http://audio_preview_service;
    proxy_set_header X-Preview-Duration $http_x_preview_duration;
    proxy_set_header X-Preview-Start $http_x_preview_start;
    
    # Cache previews aggressively
    proxy_cache audio_preview;
    proxy_cache_valid 200 24h;
    
    access_log /var/log/nginx/audio_previews.log audio_streaming_analytics;
}

# =============================================================================
# END OF AUDIO CONTENT DELIVERY OPTIMIZATION
# =============================================================================