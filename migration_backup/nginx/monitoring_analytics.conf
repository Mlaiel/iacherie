# =============================================================================
# AI PROCESSING PERFORMANCE METRICS
# =============================================================================

# AI Service Performance Tracking
log_by_lua_block {
    local uri = ngx.var.uri
    local upstream_time = tonumber(ngx.var.upstream_response_time) or 0
    local status = tonumber(ngx.var.status)
    
    if string.match(uri, "/api/ai/") then
        local ai_service_type = "general"
        
        if string.match(uri, "/analyze") then
            ai_service_type = "content_analysis"
        elseif string.match(uri, "/generate") then
            ai_service_type = "content_generation"
        elseif string.match(uri, "/optimize") then
            ai_service_type = "seo_optimization"
        elseif string.match(uri, "/protect") then
            ai_service_type = "content_protection"
        end
        
        -- Track AI processing performance
        business_kpis:observe(upstream_time, {"ai_processing_time", ai_service_type, "seconds"})
        
        if status == 200 then
            business_kpis:inc(1, {"ai_success", ai_service_type, "request"})
        else
            business_kpis:inc(1, {"ai_error", ai_service_type, "request"})
        end
    end
}

# =============================================================================
# CONTENT DELIVERY METRICS
# =============================================================================

# CDN and Content Performance
log_by_lua_block {
    local uri = ngx.var.uri
    local cache_status = ngx.var.upstream_cache_status or "MISS"
    local bytes_sent = tonumber(ngx.var.bytes_sent) or 0
    local content_type = ngx.var.sent_http_content_type or "unknown"
    
    -- Track cache performance by content type
    if string.match(content_type, "image/") then
        cache_hit_ratio:set(cache_status == "HIT" and 1 or 0, {"image_cache"})
        business_kpis:inc(bytes_sent, {"cdn_bytes", "image", "delivered"})
    elseif string.match(content_type, "video/") then
        cache_hit_ratio:set(cache_status == "HIT" and 1 or 0, {"video_cache"})
        business_kpis:inc(bytes_sent, {"cdn_bytes", "video", "delivered"})
    elseif string.match(content_type, "audio/") then
        cache_hit_ratio:set(cache_status == "HIT" and 1 or 0, {"audio_cache"})
        business_kpis:inc(bytes_sent, {"cdn_bytes", "audio", "delivered"})
    end
}

# =============================================================================
# SLA MONITORING AND COMPLIANCE
# =============================================================================

# SLA Compliance Tracking
header_filter_by_lua_block {
    local request_time = tonumber(ngx.var.request_time) or 0
    local status = tonumber(ngx.var.status)
    local uri = ngx.var.uri
    
    -- SLA thresholds
    local sla_thresholds = {
        api = 1.0,          -- 1 second for API calls
        upload = 10.0,      -- 10 seconds for uploads
        ai_processing = 30.0 -- 30 seconds for AI processing
    }
    
    local endpoint_type = "general"
    local threshold = 2.0
    
    if string.match(uri, "/api/") then
        endpoint_type = "api"
        threshold = sla_thresholds.api
    elseif string.match(uri, "/upload/") then
        endpoint_type = "upload"
        threshold = sla_thresholds.upload
    elseif string.match(uri, "/ai/") then
        endpoint_type = "ai_processing"
        threshold = sla_thresholds.ai_processing
    end
    
    -- Track SLA compliance
    if request_time <= threshold and status < 500 then
        business_kpis:inc(1, {"sla_compliant", endpoint_type, "request"})
    else
        business_kpis:inc(1, {"sla_violation", endpoint_type, "request"})
        ngx.log(ngx.WARN, "SLA violation: " .. endpoint_type .. " took " .. request_time .. "s (threshold: " .. threshold .. "s)")
    end
}

