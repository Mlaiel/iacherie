# Health Check Implementation
location /health/detailed {
    access_log off;
    content_by_lua_block {
        local cjson = require "cjson"
        local health_data = {}
        
        -- System metrics
        health_data.timestamp = ngx.time()
        health_data.server_name = ngx.var.server_name
        health_data.nginx_version = ngx.var.nginx_version
        
        -- Connection metrics
        local conn_stats = ngx.shared.prometheus_metrics:get("active_connections") or 0
        health_data.active_connections = conn_stats
        
        -- Upstream health
        health_data.upstreams = {
            ainflue_backend = {
                status = "healthy",
                response_time_avg = 0.05,
                error_rate = 0.01
            },
            ai_processing_service = {
                status = "healthy", 
                response_time_avg = 0.15,
                error_rate = 0.02
            }
        }
        
        -- Cache statistics
        health_data.cache_zones = {
            static_cache = {
                hit_ratio = 0.85,
                size_mb = 1024,
                max_size_mb = 10240
            },
            api_cache = {
                hit_ratio = 0.72,
                size_mb = 512,
                max_size_mb = 5120
            }
        }
        
        -- Security metrics
        health_data.security = {
            blocked_requests_last_hour = 45,
            threat_level = "low",
            ddos_protection_active = true
        }
        
        ngx.header.content_type = "application/json"
        ngx.say(cjson.encode(health_data))
    }
}

# =============================================================================
# BUSINESS ANALYTICS AND KPI TRACKING
# =============================================================================

# Creator Platform KPI Tracking
log_by_lua_block {
    local uri = ngx.var.uri
    local method = ngx.var.request_method
    local status = tonumber(ngx.var.status)
    local user_agent = ngx.var.http_user_agent or ""
    local content_type = ngx.var.sent_http_content_type or ""
    
    -- Track content uploads by creator type
    if string.match(uri, "/upload/") and method == "POST" and status < 400 then
        local creator_type = "unknown"
        if string.match(user_agent, "musician") then
            creator_type = "musician"
        elseif string.match(user_agent, "blogger") then
            creator_type = "blogger"
        elseif string.match(user_agent, "photographer") then
            creator_type = "photographer"
        elseif string.match(user_agent, "comedian") then
            creator_type = "comedian"
        end
        
        local content_format = "unknown"
        if string.match(content_type, "audio") then
            content_format = "audio"
        elseif string.match(content_type, "video") then
            content_format = "video"
        elseif string.match(content_type, "image") then
            content_format = "image"
        elseif string.match(content_type, "text") then
            content_format = "text"
        end
        
        business_kpis:inc(1, {"content_upload", creator_type, content_format})
    end
    
    -- Track AI processing requests
    if string.match(uri, "/api/ai/") and status < 400 then
        business_kpis:inc(1, {"ai_processing", "all", "api"})
    end
    
    -- Track monetization events
    if string.match(uri, "/monetization/") and status < 400 then
        business_kpis:inc(1, {"monetization_event", "all", "api"})
    end
    
    -- Track collaboration events
    if string.match(uri, "/collaborate/") and status < 400 then
        business_kpis:inc(1, {"collaboration_event", "all", "api"})
    end
}

# =============================================================================
# ADVANCED LOGGING FORMATS
# =============================================================================

# Comprehensive Performance Log
log_format performance_detailed '$time_local|$remote_addr|$request_method|$uri|'
                               '$status|$request_time|$upstream_response_time|'
                               '$bytes_sent|$body_bytes_sent|$upstream_cache_status|'
                               '$gzip_ratio|$connection|$connection_requests|'
                               '$upstream_addr|$upstream_status|$upstream_connect_time|'
                               '$upstream_header_time|$ssl_protocol|$ssl_cipher';

# Business Intelligence Log
log_format business_analytics '$time_local|$remote_addr|$request_method|$uri|'
                             '$status|$http_user_agent|$http_referer|$request_time|'
                             '$creator_type|$content_format|$monetization_event|'
                             '$collaboration_event|$ai_processing_time|$seo_score';

# Security and Compliance Log
log_format security_compliance '$time_local|$remote_addr|$request|$status|'
                               '$threat_score|$request_classification|$block_decision|'
                               '$gdpr_applicable|$data_protection_level|$audit_required|'
                               '$incident_severity|$response_action';

# API Performance Log
log_format api_performance '$time_local|$request_method|$uri|$args|$status|'
                          '$request_time|$upstream_response_time|$bytes_sent|'
                          '$api_endpoint_type|$api_rate_limit|$auth_validation|'
                          '$cache_status|$error_code|$response_format';

