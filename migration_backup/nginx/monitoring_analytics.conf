# =============================================================================

# Metrics Collection Zones
lua_shared_dict prometheus_metrics 10m;
lua_shared_dict health_checks 5m;
lua_shared_dict performance_data 20m;
lua_shared_dict business_metrics 15m;

# Initialize Prometheus metrics
init_by_lua_block {
    prometheus = require "resty.prometheus".init("prometheus_metrics")
    
    -- Define custom metrics
    request_duration_histogram = prometheus:histogram(
        "nginx_http_request_duration_seconds",
        "HTTP request latency",
        {"method", "route", "status_class", "upstream"}
    )
    
    request_counter = prometheus:counter(
        "nginx_http_requests_total",
        "Total HTTP requests",
        {"method", "route", "status", "upstream"}
    )
    
    upstream_response_time = prometheus:histogram(
        "nginx_upstream_response_time_seconds",
        "Upstream response time",
        {"upstream", "server"}
    )
    
    security_events_counter = prometheus:counter(
        "nginx_security_events_total",
        "Security events detected",
        {"event_type", "severity", "action"}
    )
    
    cache_hit_ratio = prometheus:gauge(
        "nginx_cache_hit_ratio",
        "Cache hit ratio",
        {"cache_zone"}
    )
    
    active_connections = prometheus:gauge(
        "nginx_active_connections",
        "Active connections",
        {"state"}
    )
    
    business_kpis = prometheus:gauge(
        "ainflue_business_kpi",
        "Business KPI metrics",
        {"metric_type", "creator_type", "content_format"}
    )
}

# =============================================================================
# PERFORMANCE MONITORING CONFIGURATION
# =============================================================================

# Request Performance Tracking
log_by_lua_block {
    local request_time = tonumber(ngx.var.request_time)
    local upstream_time = tonumber(ngx.var.upstream_response_time) or 0
    local status = tonumber(ngx.var.status)
    local method = ngx.var.request_method
    local uri = ngx.var.uri
    local upstream = ngx.var.upstream_addr or "direct"
    
    -- Route classification
    local route = "other"
    if string.match(uri, "^/api/") then
        route = "api"
    elseif string.match(uri, "^/upload/") then
        route = "upload"
    elseif string.match(uri, "^/ai/") then
        route = "ai_processing"
    elseif string.match(uri, "^/analytics/") then
        route = "analytics"
    end
    
    -- Status class classification
    local status_class = "unknown"
    if status >= 200 and status < 300 then
        status_class = "2xx"
    elseif status >= 300 and status < 400 then
        status_class = "3xx"
    elseif status >= 400 and status < 500 then
        status_class = "4xx"
    elseif status >= 500 then
        status_class = "5xx"
    end
    
    -- Record metrics
    request_duration_histogram:observe(request_time, {method, route, status_class, upstream})
    request_counter:inc(1, {method, route, status, upstream})
    
    if upstream_time > 0 then
        upstream_response_time:observe(upstream_time, {upstream, ngx.var.upstream_addr})
    end
}

# =============================================================================
# HEALTH CHECK AND STATUS MONITORING
