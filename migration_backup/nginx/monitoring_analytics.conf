# =============================================================================
# ALERTING AND NOTIFICATION SYSTEM
# =============================================================================

# Critical Threshold Monitoring
access_by_lua_block {
    local request_time = tonumber(ngx.var.request_time) or 0
    local upstream_time = tonumber(ngx.var.upstream_response_time) or 0
    local status = tonumber(ngx.var.status)
    
    -- Performance threshold alerts
    if request_time > 5.0 then
        ngx.log(ngx.ERR, "ALERT: High response time detected: " .. request_time .. "s for " .. ngx.var.uri)
    end
    
    if upstream_time > 3.0 then
        ngx.log(ngx.ERR, "ALERT: High upstream response time: " .. upstream_time .. "s")
    end
    
    -- Error rate monitoring
    if status >= 500 then
        ngx.log(ngx.ERR, "ALERT: Server error detected: " .. status .. " for " .. ngx.var.request)
    end
    
    -- Security event alerts
    local threat_score = tonumber(ngx.var.total_threat_score) or 0
    if threat_score > 50 then
        ngx.log(ngx.ERR, "SECURITY ALERT: High threat score: " .. threat_score .. " from " .. ngx.var.remote_addr)
    end
}

# =============================================================================
# CAPACITY PLANNING AND FORECASTING
# =============================================================================

# Resource Utilization Tracking
log_by_lua_block {
    local shared_dict = ngx.shared.performance_data
    local current_time = ngx.time()
    local minute_key = "minute_" .. math.floor(current_time / 60)
    
    -- Track requests per minute
    shared_dict:incr(minute_key .. "_requests", 1, 0, 3600)
    
    -- Track bytes transferred per minute
    local bytes_sent = tonumber(ngx.var.bytes_sent) or 0
    shared_dict:incr(minute_key .. "_bytes", bytes_sent, 0, 3600)
    
    -- Track response times
    local request_time = tonumber(ngx.var.request_time) or 0
    shared_dict:incr(minute_key .. "_response_time_sum", request_time, 0, 3600)
    
    -- Track upstream response times
    local upstream_time = tonumber(ngx.var.upstream_response_time) or 0
    if upstream_time > 0 then
        shared_dict:incr(minute_key .. "_upstream_time_sum", upstream_time, 0, 3600)
    end
}

