# =============================================================================
# SECURITY RATE LIMITING AND DDOS PROTECTION
# =============================================================================

# Advanced Rate Limiting Zones - Multi-Tier Defense
limit_req_zone $binary_remote_addr zone=ddos_protection:50m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_protection:30m rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload_protection:20m rate=3r/s;
limit_req_zone $binary_remote_addr zone=login_protection:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=search_protection:15m rate=20r/s;
limit_req_zone $binary_remote_addr zone=comment_protection:10m rate=5r/s;

# Connection Limiting - Per IP and Server
limit_conn_zone $binary_remote_addr zone=perip_conn:20m;
limit_conn_zone $server_name zone=perserver_conn:20m;
limit_conn_zone $request_uri zone=peruri_conn:10m;

# Request Size Protection
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 4k;

# =============================================================================
# IP INTELLIGENCE AND GEOLOCATION SECURITY
# =============================================================================

# GeoIP Country Blocking Configuration
geo $blocked_country {
    default 0;
    # Block high-risk countries (configurable)
    CN 1;  # China
    RU 1;  # Russia
    KP 1;  # North Korea
    IR 1;  # Iran
}

# IP Reputation and Threat Intelligence
geo $threat_level {
    default 0;
    include /etc/nginx/security/threat_ips.conf;
    include /etc/nginx/security/blocked_ranges.conf;
}

# VPN/Proxy Detection
geo $proxy_detection {
    default 0;
    include /etc/nginx/security/proxy_ranges.conf;
}

# Known Attack Sources
geo $attack_source {
    default 0;
    include /etc/nginx/security/attack_sources.conf;
}

# =============================================================================
# BOT DETECTION AND USER AGENT ANALYSIS
# =============================================================================

# Advanced Bot Detection
map $http_user_agent $bot_type {
    default 0;
    
    # Good Bots (Allow)
    "~*Googlebot" 1;
    "~*Bingbot" 1;
    "~*facebookexternalhit" 1;
    "~*Twitterbot" 1;
    "~*LinkedInBot" 1;
    "~*WhatsApp" 1;
    
    # Bad Bots (Block)
    "~*MJ12bot" 2;
    "~*SemrushBot" 2;
    "~*AhrefsBot" 2;
    "~*DotBot" 2;
    "~*BLEXBot" 2;
    "~*YandexBot" 2;
    "~*BaiduSpider" 2;
    
    # Malicious Bots (Severe Block)
    "~*(curl|wget|python|perl|ruby|java)" 3;
    "~*(scanner|scraper|crawler|spider)" 3;
    "~*(hack|exploit|injection|attack)" 3;
    "~*sqlmap" 3;
    "~*nikto" 3;
    "~*masscan" 3;
    "~*nmap" 3;
}

# Suspicious User Agent Patterns
map $http_user_agent $suspicious_ua {
    default 0;
    "" 1;  # Empty user agent
    "-" 1;  # Dash user agent
    "~*^-$" 1;
    "~*^[a-zA-Z0-9]{1,4}$" 1;  # Very short user agents
    "~*(libwww|lwp|urllib|python|perl|curl|wget|java)" 1;
}

# =============================================================================
# REQUEST VALIDATION AND HEADER ANALYSIS
# =============================================================================

# HTTP Method Validation
map $request_method $allowed_method {
    default 0;
    GET 1;
    POST 1;
    PUT 1;
    DELETE 1;
    HEAD 1;
    OPTIONS 1;
    PATCH 1;
}

# Request URI Validation - SQL Injection Detection
map $request_uri $sql_injection {
    default 0;
    "~*(union.*select|select.*from|insert.*into|delete.*from|update.*set)" 1;
    "~*(drop.*table|create.*table|alter.*table)" 1;
    "~*(exec|execute|sp_|xp_)" 1;
    "~*(concat|char|ascii|substring)" 1;
    "~*(\||\||;|'|\")" 1;
}

# XSS Detection in Request
map $request_uri $xss_attack {
    default 0;
    "~*(<script|</script|javascript:|vbscript:|onload=|onerror=)" 1;
    "~*(alert\(|confirm\(|prompt\(|eval\()" 1;
    "~*(document\.|window\.|location\.)" 1;
    "~*(<iframe|<object|<embed|<applet)" 1;
}

# Directory Traversal Detection
map $request_uri $directory_traversal {
    default 0;
    "~*(\.\.\/|\.\.\\)" 1;
    "~*(\/etc\/passwd|\/etc\/shadow)" 1;
    "~*(\/proc\/|\/sys\/)" 1;
    "~*(\/var\/log\/)" 1;
}

# File Upload Security
map $request_uri $suspicious_upload {
    default 0;
    "~*\.(php|asp|aspx|jsp|cgi|pl|py|sh|bat|exe)$" 1;
    "~*\.(htaccess|htpasswd|ini|conf)$" 1;
}

# =============================================================================
# ADVANCED THREAT DETECTION ALGORITHMS
# =============================================================================

# Request Frequency Analysis (ML-based pattern detection)
map $binary_remote_addr $request_frequency {
    default 0;
    # This would be populated by ML algorithms analyzing patterns
}

# Behavioral Pattern Analysis
map "$remote_addr|$http_user_agent|$request_uri" $behavior_score {
    default 0;
    # Populated by behavioral analysis algorithms
}

# Attack Pattern Recognition
map $request $attack_pattern {
    default 0;
    "~*(UNION|SELECT|INSERT|DELETE|DROP|CREATE|ALTER)" 1;
    "~*(<script|javascript:|vbscript:|onload|onerror)" 2;
    "~*(\.\.\/|\.\.\\|\/etc\/|\/proc\/)" 3;
    "~*(eval\(|exec\(|system\(|shell_exec)" 4;
}

# =============================================================================
# SECURITY HEADER ENFORCEMENT AND VALIDATION
# =============================================================================

# Referrer Validation
map $http_referer $invalid_referer {
    default 0;
    "~*(viagra|cialis|pharmacy|casino|porn)" 1;
    "~*(hack|exploit|shell|backdoor)" 1;
    "~*[^\x00-\x7F]" 1;  # Non-ASCII characters
}

# Content-Type Validation for POST requests
map $content_type $invalid_content_type {
    default 0;
    "" 1;  # Empty content type for POST
    "~*text/html" 1;  # HTML in POST body (potential XSS)
}

# Host Header Validation
map $host $invalid_host {
    default 1;
    "ainflue.com" 0;
    "www.ainflue.com" 0;
    "api.ainflue.com" 0;
    "cdn.ainflue.com" 0;
    "admin.ainflue.com" 0;
}

# =============================================================================
# REAL-TIME THREAT MONITORING AND CORRELATION
# =============================================================================

# Threat Score Calculation
map "$blocked_country|$threat_level|$bot_type|$sql_injection|$xss_attack" $total_threat_score {
    default 0;
    "~*1" 10;  # Any major threat indicator
    "~*2" 20;  # Multiple threat indicators
    "~*3" 50;  # Severe threat
}

# Request Classification
map $total_threat_score $request_classification {
    default "clean";
    "~*[1-5]" "suspicious";
    "~*[6-15]" "threat";
    "~*1[6-9]|[2-9][0-9]" "severe_threat";
}

# =============================================================================
# ACCESS CONTROL AND AUTHENTICATION INTEGRATION
# =============================================================================

# API Authentication Validation
map $http_authorization $auth_validation {
    default 0;
    "~*Bearer\s+[A-Za-z0-9\-\._~\+\/]+=*$" 1;
    "~*Basic\s+[A-Za-z0-9\+\/]+=*$" 1;
}

# Session Validation
map $cookie_sessionid $session_validation {
    default 0;
    "~*^[a-fA-F0-9]{32,64}$" 1;
}

# =============================================================================
# AUTOMATED RESPONSE AND MITIGATION
# =============================================================================

# Block Decision Matrix
map "$request_classification|$attack_pattern|$bot_type" $block_request {
    default 0;
    "~*severe_threat" 1;
    "~*threat.*[3-4]" 1;
    "~*suspicious.*3" 1;
}

# Response Type Selection
map $block_request $response_type {
    default "allow";
    "1" "block_403";
    "2" "rate_limit";
    "3" "challenge";
}

# =============================================================================
# SECURITY EVENT LOGGING FORMAT
# =============================================================================

# Security Event Log Format
log_format security_events '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'threat_score="$total_threat_score" '
                          'classification="$request_classification" '
                          'bot_type="$bot_type" '
                          'blocked_country="$blocked_country" '
                          'sql_injection="$sql_injection" '
                          'xss_attack="$xss_attack" '
                          'block_decision="$block_request" '
                          'response_type="$response_type" '
                          'session_id="$cookie_sessionid"';

# Attack Analysis Log Format
log_format attack_analysis '$time_local|$remote_addr|$request|'
                          '$total_threat_score|$request_classification|'
                          '$bot_type|$attack_pattern|$response_type';

# Performance Impact Log Format
log_format security_performance '$request_time|$upstream_response_time|'
                                '$total_threat_score|$request_classification|'
                                '$bytes_sent|$status';

# =============================================================================
# MALWARE AND CONTENT SECURITY VALIDATION
# =============================================================================

# File Extension Security
map $request_uri $dangerous_extension {
    default 0;
    "~*\.(exe|bat|cmd|com|pif|scr|vbs|js|jar)$" 1;
    "~*\.(php|asp|aspx|jsp|cgi|pl|py)$" 2;
    "~*\.(sql|db|mdb|sqlite)$" 3;
}

# Content Security Validation
map $request_body $malicious_content {
    default 0;
    "~*(base64_decode|eval|exec|system)" 1;
    "~*(shell_exec|passthru|proc_open)" 2;
    "~*(file_get_contents|fopen|fwrite)" 3;
}

# =============================================================================
# API SECURITY AND RATE LIMITING
# =============================================================================

# API Endpoint Classification
map $request_uri $api_endpoint_type {
    default "public";
    "~*/api/auth/" "authentication";
    "~*/api/admin/" "administrative";
    "~*/api/upload/" "upload";
    "~*/api/payment/" "financial";
    "~*/api/user/" "user_data";
}

# API Rate Limiting by Endpoint Type
map $api_endpoint_type $api_rate_limit {
    default "api_general";
    "authentication" "login_protection";
    "administrative" "api_strict";
    "upload" "upload_protection";
    "financial" "login_protection";
}

# =============================================================================
# INTRUSION DETECTION PATTERNS
# =============================================================================

# Common Attack Signatures
map $request $intrusion_signature {
    default 0;
    "~*(sleep\(|benchmark\(|waitfor)" 1;  # SQL timing attacks
    "~*(0x[0-9a-f]+|char\()" 2;          # SQL hex encoding
    "~*(@@version|@@datadir)" 3;          # SQL information gathering
    "~*(cmd\.exe|powershell)" 4;          # Command injection
    "~*(\/bin\/|\/usr\/bin\/)" 5;         # Unix command injection
}

# Web Shell Detection
map $request_uri $webshell_pattern {
    default 0;
    "~*(c99|r57|webshell|shell|backdoor)" 1;
    "~*(cmd|command|exec|system)" 2;
    "~*(eval|base64|gzinflate)" 3;
}

# =============================================================================
# CHALLENGE AND CAPTCHA INTEGRATION
# =============================================================================

# Challenge Decision Logic
map "$bot_type|$total_threat_score|$request_frequency" $challenge_required {
    default 0;
    "~*2.*[1-9]" 1;  # Bad bots with any threat score
    "~*.*1[0-9]|.*[2-9][0-9]" 1;  # High threat scores
    "~*.*high" 1;  # High request frequency
}

# Challenge Type Selection
map $challenge_required $challenge_type {
    default "none";
    "1" "javascript";
    "2" "captcha";
    "3" "proof_of_work";
}

# =============================================================================
# PERFORMANCE OPTIMIZATION FOR SECURITY
# =============================================================================

# Security Processing Optimization
map $request_classification $security_processing {
    default "standard";
    "clean" "minimal";
    "suspicious" "enhanced";
    "threat" "comprehensive";
    "severe_threat" "maximum";
}

# Cache Control for Security Rules
map $security_processing $security_cache_control {
    default "no-cache";
    "minimal" "public, max-age=300";
    "standard" "no-cache";
    "enhanced" "no-cache, no-store";
    "comprehensive" "no-cache, no-store, must-revalidate";
}

# =============================================================================
# INCIDENT RESPONSE AND ESCALATION
# =============================================================================

# Incident Severity Classification
map "$total_threat_score|$attack_pattern|$intrusion_signature" $incident_severity {
    default "low";
    "~*[1-2][0-9]|.*[3-4]|.*[3-5]" "medium";
    "~*[3-9][0-9]|.*[4-5]|.*[4-5]" "high";
    "~*[5-9][0-9]|.*5|.*5" "critical";
}

# Automated Response Actions
map $incident_severity $response_action {
    default "log";
    "medium" "log_and_monitor";
    "high" "block_and_alert";
    "critical" "block_and_escalate";
}

# =============================================================================
# COMPLIANCE AND AUDIT TRAIL
# =============================================================================

# GDPR Compliance Markers
map $geoip_country_code $gdpr_applicable {
    default 0;
    "DE" 1; "FR" 1; "IT" 1; "ES" 1; "NL" 1; "BE" 1; "AT" 1;
    "SE" 1; "DK" 1; "FI" 1; "NO" 1; "CH" 1; "GB" 1; "IE" 1;
}

# Data Protection Level
map "$gdpr_applicable|$api_endpoint_type" $data_protection_level {
    default "standard";
    "1|user_data" "enhanced";
    "1|financial" "maximum";
    "1|administrative" "maximum";
}

# Audit Trail Classification
map "$request_method|$api_endpoint_type|$status" $audit_required {
    default 0;
    "~*POST|PUT|DELETE.*user_data" 1;
    "~*.*financial.*" 1;
    "~*.*administrative.*" 1;
    "~*.*[45][0-9][0-9]" 1;  # All error responses
}

# =============================================================================
# MACHINE LEARNING INTEGRATION HOOKS
# =============================================================================

# ML Model Input Features
map "$remote_addr|$http_user_agent|$request_uri|$request_time" $ml_features {
    default "standard_request";
    # This would be expanded with actual ML feature extraction
}

# ML-based Anomaly Score
map $ml_features $anomaly_score {
    default 0;
    # Populated by ML anomaly detection models
}

# Adaptive Security Level
map "$anomaly_score|$total_threat_score|$request_frequency" $adaptive_security_level {
    default "normal";
    "~*high|[2-9][0-9]|high" "elevated";
    "~*critical|[5-9][0-9]|critical" "maximum";
}

# =============================================================================
# END OF SECURITY MODULES
# =============================================================================