---
# =============================================================================
# AINFLUE PLATFORM - MASTER DEPLOYMENT PLAYBOOK
# =============================================================================
# This playbook orchestrates the complete deployment of the Ainflue platform
# infrastructure across multiple cloud providers with enterprise security.

- name: Deploy Ainflue Platform Infrastructure
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    project_name: ainflue
    environment: "{{ env | default('dev') }}"
    deployment_timestamp: "{{ ansible_date_time.epoch }}"
    
  pre_tasks:
    - name: Validate deployment environment
      assert:
        that:
          - environment in ['dev', 'staging', 'prod']
        fail_msg: "Environment must be one of: dev, staging, prod"
        
    - name: Set deployment facts
      set_fact:
        deployment_id: "{{ project_name }}-{{ environment }}-{{ deployment_timestamp }}"
        backup_timestamp: "{{ ansible_date_time.iso8601 }}"
        
    - name: Display deployment information
      debug:
        msg:
          - "Starting Ainflue Platform Deployment"
          - "Environment: {{ environment }}"
          - "Deployment ID: {{ deployment_id }}"
          - "Timestamp: {{ backup_timestamp }}"

  roles:
    # Phase 1: Infrastructure Foundation
    - role: common_setup
      tags: ['common', 'foundation']
      
    - role: security_hardening
      tags: ['security', 'foundation']
      
    # Phase 2: Cloud Infrastructure
    - role: aws_infrastructure
      tags: ['aws', 'cloud']
      when: cloud_providers is defined and 'aws' in cloud_providers
      
    - role: azure_infrastructure
      tags: ['azure', 'cloud']
      when: cloud_providers is defined and 'azure' in cloud_providers
      
    - role: gcp_infrastructure
      tags: ['gcp', 'cloud']
      when: cloud_providers is defined and 'gcp' in cloud_providers
      
    # Phase 3: Container Orchestration
    - role: kubernetes_cluster
      tags: ['kubernetes', 'orchestration']
      
    - role: container_registry
      tags: ['registry', 'containers']
      
    # Phase 4: Data Layer
    - role: database_setup
      tags: ['database', 'data']
      
    - role: cache_setup
      tags: ['cache', 'data']
      
    - role: storage_setup
      tags: ['storage', 'data']
      
    # Phase 5: Application Services
    - role: application_deployment
      tags: ['application', 'services']
      
    - role: ai_engine_deployment
      tags: ['ai', 'services']
      
    - role: mobile_api_deployment
      tags: ['mobile', 'services']
      
    # Phase 6: Monitoring & Observability
    - role: monitoring_setup
      tags: ['monitoring', 'observability']
      
    - role: logging_setup
      tags: ['logging', 'observability']
      
    - role: alerting_setup
      tags: ['alerting', 'observability']
      
    # Phase 7: Security & Compliance
    - role: security_policies
      tags: ['security', 'compliance']
      
    - role: backup_configuration
      tags: ['backup', 'compliance']
      
    - role: compliance_monitoring
      tags: ['compliance', 'audit']
      
    # Phase 8: Network & CDN
    - role: load_balancer_setup
      tags: ['networking', 'load-balancer']
      
    - role: cdn_configuration
      tags: ['cdn', 'networking']
      
    - role: dns_management
      tags: ['dns', 'networking']

  post_tasks:
    - name: Verify deployment health
      include_tasks: tasks/health_check.yml
      tags: ['health-check', 'verification']
      
    - name: Generate deployment report
      template:
        src: deployment_report.j2
        dest: "/tmp/ainflue-deployment-{{ deployment_id }}.json"
      tags: ['reporting']
      
    - name: Send deployment notification
      include_tasks: tasks/notification.yml
      vars:
        notification_type: "deployment_complete"
        deployment_status: "{{ deployment_result | default('success') }}"
      tags: ['notification']
      
    - name: Display deployment summary
      debug:
        msg:
          - "Ainflue Platform Deployment Complete"
          - "Environment: {{ environment }}"
          - "Deployment ID: {{ deployment_id }}"
          - "Status: {{ deployment_result | default('SUCCESS') }}"
          - "Duration: {{ ansible_play_batch | length }} minutes"

# =============================================================================
# INFRASTRUCTURE PROVISIONING PLAYBOOK
# =============================================================================
          
- name: Provision Infrastructure with Terraform
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    terraform_dir: "{{ playbook_dir }}/../terraform"
    terraform_vars:
      environment: "{{ environment }}"
      project_name: "{{ project_name }}"
      region: "{{ aws_region | default('us-west-2') }}"
      
  tasks:
    - name: Initialize Terraform
      terraform:
        project_path: "{{ terraform_dir }}"
        state: planned
        variables: "{{ terraform_vars }}"
        plan_file: "{{ terraform_dir }}/terraform-{{ environment }}.plan"
      register: terraform_plan
      
    - name: Apply Terraform configuration
      terraform:
        project_path: "{{ terraform_dir }}"
        state: present
        plan_file: "{{ terraform_dir }}/terraform-{{ environment }}.plan"
      register: terraform_apply
      when: terraform_plan is succeeded
      
    - name: Save Terraform outputs
      set_fact:
        terraform_outputs: "{{ terraform_apply.outputs }}"
      when: terraform_apply is defined

# =============================================================================
# KUBERNETES DEPLOYMENT PLAYBOOK
# =============================================================================

- name: Deploy Kubernetes Applications
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    k8s_namespace: "ainflue-platform"
    k8s_manifests_dir: "{{ playbook_dir }}/../kubernetes/manifests"
    
  tasks:
    - name: Create namespace
      kubernetes.core.k8s:
        name: "{{ k8s_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        
    - name: Apply ConfigMaps
      kubernetes.core.k8s:
        src: "{{ k8s_manifests_dir }}/configmaps.yaml"
        state: present
        namespace: "{{ k8s_namespace }}"
        
    - name: Apply Secrets
      kubernetes.core.k8s:
        src: "{{ k8s_manifests_dir }}/secrets.yaml"
        state: present
        namespace: "{{ k8s_namespace }}"
        
    - name: Apply PersistentVolumes
      kubernetes.core.k8s:
        src: "{{ k8s_manifests_dir }}/persistent_volumes.yaml"
        state: present
        
    - name: Deploy Applications
      kubernetes.core.k8s:
        src: "{{ k8s_manifests_dir }}/api_deployment.yaml"
        state: present
        namespace: "{{ k8s_namespace }}"
        wait: true
        wait_timeout: 600
        
    - name: Apply Services
      kubernetes.core.k8s:
        src: "{{ k8s_manifests_dir }}/services.yaml"
        state: present
        namespace: "{{ k8s_namespace }}"
        
    - name: Configure Ingress
      kubernetes.core.k8s:
        src: "{{ k8s_manifests_dir }}/ingress.yaml"
        state: present
        namespace: "{{ k8s_namespace }}"

# =============================================================================
# MONITORING STACK DEPLOYMENT
# =============================================================================

- name: Deploy Monitoring Stack
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    monitoring_namespace: "monitoring"
    
  tasks:
    - name: Create monitoring namespace
      kubernetes.core.k8s:
        name: "{{ monitoring_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        
    - name: Install Prometheus Operator
      kubernetes.core.helm:
        name: prometheus-operator
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: "{{ monitoring_namespace }}"
        create_namespace: true
        values:
          prometheus:
            prometheusSpec:
              retention: 30d
              storageSpec:
                volumeClaimTemplate:
                  spec:
                    storageClassName: gp3
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 50Gi
          grafana:
            enabled: true
            adminPassword: "{{ grafana_admin_password }}"
            persistence:
              enabled: true
              size: 10Gi
              
    - name: Install Jaeger for distributed tracing
      kubernetes.core.helm:
        name: jaeger
        chart_ref: jaegertracing/jaeger
        release_namespace: "{{ monitoring_namespace }}"
        values:
          storage:
            type: elasticsearch
          elasticsearch:
            enabled: true
            
    - name: Configure service monitors
      kubernetes.core.k8s:
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: ainflue-services
            namespace: "{{ monitoring_namespace }}"
          spec:
            selector:
              matchLabels:
                part-of: ainflue-platform
            endpoints:
            - port: metrics
              interval: 30s

# =============================================================================
# SECURITY CONFIGURATION PLAYBOOK
# =============================================================================

- name: Configure Security Policies
  hosts: localhost
  connection: local
  gather_facts: no
  
  tasks:
    - name: Apply Pod Security Standards
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k8s_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/warn: restricted
              
    - name: Configure Network Policies
      kubernetes.core.k8s:
        src: "{{ playbook_dir }}/security/network-policies.yaml"
        state: present
        namespace: "{{ k8s_namespace }}"
        
    - name: Configure RBAC
      kubernetes.core.k8s:
        src: "{{ playbook_dir }}/security/rbac.yaml"
        state: present
        
    - name: Install cert-manager for TLS
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        release_namespace: cert-manager
        create_namespace: true
        values:
          installCRDs: true