---
- name: "Ainflue Enterprise Application Deployment"
  hosts: application_servers
  become: yes
  gather_facts: yes
  vars:
    # Application versions
    application_versions:
      api_gateway: "v2.1.0"
      ai_engine: "v1.8.0"
      content_processor: "v1.5.0"
      user_service: "v1.3.0"
      payment_service: "v1.2.0"
      notification_service: "v1.1.0"
      analytics_service: "v1.4.0"
      mobile_api: "v2.0.0"
      
    # Deployment configuration
    deployment_config:
      replicas:
        api_gateway: 5
        ai_engine: 3
        content_processor: 4
        user_service: 3
        payment_service: 2
        notification_service: 2
        analytics_service: 2
        mobile_api: 3
      resources:
        api_gateway:
          requests: { cpu: "500m", memory: "1Gi" }
          limits: { cpu: "2", memory: "4Gi" }
        ai_engine:
          requests: { cpu: "2", memory: "4Gi" }
          limits: { cpu: "8", memory: "16Gi" }
        content_processor:
          requests: { cpu: "1", memory: "2Gi" }
          limits: { cpu: "4", memory: "8Gi" }
        
    # Environment configuration
    environment: "{{ ansible_environment | default('production') }}"
    namespace: "ainflue-{{ environment }}"
    
    # Security configuration
    security_config:
      pod_security_policy: true
      network_policies: true
      service_mesh: true
      tls_everywhere: true
      oauth2_enabled: true
      
    # Monitoring configuration
    monitoring_config:
      metrics_enabled: true
      tracing_enabled: true
      logging_enabled: true
      health_checks: true
      prometheus_scraping: true

  pre_tasks:
    - name: "Validate application deployment requirements"
      assert:
        that:
          - ansible_memtotal_mb >= 16384
          - ansible_processor_vcpus >= 4
        fail_msg: "Insufficient resources for application deployment"
        success_msg: "Application deployment requirements validated"

    - name: "Check Kubernetes cluster readiness"
      shell: kubectl cluster-info
      register: cluster_status
      failed_when: cluster_status.rc != 0

    - name: "Verify database connectivity"
      shell: |
        kubectl get pods -n postgresql -l app=postgres --field-selector=status.phase=Running | wc -l
      register: db_status
      failed_when: db_status.stdout | int == 0

  tasks:
    # ==========================================
    # PHASE 1: NAMESPACE AND RBAC SETUP
    # ==========================================
    
    - name: "Create application namespace"
      kubernetes.core.k8s:
        name: "{{ namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        definition:
          metadata:
            labels:
              name: "{{ namespace }}"
              environment: "{{ environment }}"
              managed-by: "ainflue-infrastructure"
              istio-injection: enabled
      tags: ["namespace", "setup"]

    - name: "Create application service accounts"
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: "{{ item }}-sa"
            namespace: "{{ namespace }}"
            labels:
              app: "{{ item }}"
          automountServiceAccountToken: true
      loop:
        - api-gateway
        - ai-engine
        - content-processor
        - user-service
        - payment-service
        - notification-service
        - analytics-service
        - mobile-api
      tags: ["rbac", "setup"]

    # ==========================================
    # PHASE 2: CONFIGURATION MANAGEMENT
    # ==========================================
    
    - name: "Create application configurations"
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ item.name }}-config"
            namespace: "{{ namespace }}"
          data:
            app.yaml: |
              server:
                port: {{ item.port }}
                host: 0.0.0.0
              database:
                postgresql:
                  host: "ainflue-postgresql-cluster.postgresql.svc.cluster.local"
                  port: 5432
                  database: "{{ item.database }}"
                mongodb:
                  host: "ainflue-mongodb-cluster.mongodb.svc.cluster.local"
                  port: 27017
                  database: "{{ item.mongo_db }}"
                redis:
                  host: "ainflue-redis-cluster.redis.svc.cluster.local"
                  port: 6379
                elasticsearch:
                  host: "ainflue-elasticsearch-cluster-es-http.elasticsearch.svc.cluster.local"
                  port: 9200
              security:
                jwt_secret_key: "${JWT_SECRET_KEY}"
                oauth2_client_id: "${OAUTH2_CLIENT_ID}"
                oauth2_client_secret: "${OAUTH2_CLIENT_SECRET}"
              ai:
                openai_api_key: "${OPENAI_API_KEY}"
                huggingface_token: "${HUGGINGFACE_TOKEN}"
              monitoring:
                prometheus_enabled: true
                jaeger_endpoint: "jaeger-collector.monitoring.svc.cluster.local:14268"
                log_level: "{{ 'DEBUG' if environment == 'development' else 'INFO' }}"
              features:
                ai_processing: {{ item.ai_features | default(false) }}
                payment_processing: {{ item.payment_features | default(false) }}
                content_moderation: {{ item.moderation_features | default(true) }}
      loop:
        - name: api-gateway
          port: 8080
          database: ainflue_main
          mongo_db: ainflue_sessions
          ai_features: false
          payment_features: false
        - name: ai-engine
          port: 8081
          database: ainflue_ai_models
          mongo_db: ainflue_ai_data
          ai_features: true
          payment_features: false
        - name: content-processor
          port: 8082
          database: ainflue_content
          mongo_db: ainflue_media
          ai_features: true
          payment_features: false
        - name: user-service
          port: 8083
          database: ainflue_users
          mongo_db: ainflue_profiles
          ai_features: false
          payment_features: false
        - name: payment-service
          port: 8084
          database: ainflue_payments
          mongo_db: ainflue_transactions
          ai_features: false
          payment_features: true
        - name: notification-service
          port: 8085
          database: ainflue_notifications
          mongo_db: ainflue_messages
          ai_features: false
          payment_features: false
        - name: analytics-service
          port: 8086
          database: ainflue_analytics
          mongo_db: ainflue_events
          ai_features: true
          payment_features: false
        - name: mobile-api
          port: 8087
          database: ainflue_mobile
          mongo_db: ainflue_mobile_sessions
          ai_features: false
          payment_features: false
      tags: ["config", "setup"]

    - name: "Create application secrets"
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item }}-secrets"
            namespace: "{{ namespace }}"
          type: Opaque
          data:
            JWT_SECRET_KEY: "{{ jwt_secret_key | b64encode }}"
            OAUTH2_CLIENT_ID: "{{ oauth2_client_id | b64encode }}"
            OAUTH2_CLIENT_SECRET: "{{ oauth2_client_secret | b64encode }}"
            OPENAI_API_KEY: "{{ openai_api_key | b64encode }}"
            HUGGINGFACE_TOKEN: "{{ huggingface_token | b64encode }}"
            DATABASE_PASSWORD: "{{ database_password | b64encode }}"
            STRIPE_SECRET_KEY: "{{ stripe_secret_key | b64encode }}"
            SENDGRID_API_KEY: "{{ sendgrid_api_key | b64encode }}"
      loop:
        - api-gateway
        - ai-engine
        - content-processor
        - user-service
        - payment-service
        - notification-service
        - analytics-service
        - mobile-api
      tags: ["secrets", "setup"]

    # ==========================================
    # PHASE 3: APPLICATION DEPLOYMENTS
    # ==========================================
    
    - name: "Deploy API Gateway"
      kubernetes.core.k8s:
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: api-gateway
            namespace: "{{ namespace }}"
            labels:
              app: api-gateway
              version: "{{ application_versions.api_gateway }}"
          spec:
            replicas: "{{ deployment_config.replicas.api_gateway }}"
            selector:
              matchLabels:
                app: api-gateway
            template:
              metadata:
                labels:
                  app: api-gateway
                  version: "{{ application_versions.api_gateway }}"
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "8080"
                  prometheus.io/path: "/metrics"
              spec:
                serviceAccountName: api-gateway-sa
                containers:
                - name: api-gateway
                  image: "ainflue/api-gateway:{{ application_versions.api_gateway }}"
                  ports:
                  - containerPort: 8080
                    name: http
                  - containerPort: 9090
                    name: metrics
                  env:
                  - name: ENVIRONMENT
                    value: "{{ environment }}"
                  - name: NAMESPACE
                    value: "{{ namespace }}"
                  envFrom:
                  - configMapRef:
                      name: api-gateway-config
                  - secretRef:
                      name: api-gateway-secrets
                  resources:
                    requests:
                      cpu: "{{ deployment_config.resources.api_gateway.requests.cpu }}"
                      memory: "{{ deployment_config.resources.api_gateway.requests.memory }}"
                    limits:
                      cpu: "{{ deployment_config.resources.api_gateway.limits.cpu }}"
                      memory: "{{ deployment_config.resources.api_gateway.limits.memory }}"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8080
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /ready
                      port: 8080
                    initialDelaySeconds: 5
                    periodSeconds: 5
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 1000
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
      tags: ["deployment", "api-gateway"]

    - name: "Deploy AI Engine"
      kubernetes.core.k8s:
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ai-engine
            namespace: "{{ namespace }}"
            labels:
              app: ai-engine
              version: "{{ application_versions.ai_engine }}"
          spec:
            replicas: "{{ deployment_config.replicas.ai_engine }}"
            selector:
              matchLabels:
                app: ai-engine
            template:
              metadata:
                labels:
                  app: ai-engine
                  version: "{{ application_versions.ai_engine }}"
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "8081"
                  prometheus.io/path: "/metrics"
              spec:
                serviceAccountName: ai-engine-sa
                nodeSelector:
                  accelerator: nvidia-tesla-v100
                containers:
                - name: ai-engine
                  image: "ainflue/ai-engine:{{ application_versions.ai_engine }}"
                  ports:
                  - containerPort: 8081
                    name: http
                  - containerPort: 9091
                    name: metrics
                  env:
                  - name: ENVIRONMENT
                    value: "{{ environment }}"
                  - name: CUDA_VISIBLE_DEVICES
                    value: "all"
                  envFrom:
                  - configMapRef:
                      name: ai-engine-config
                  - secretRef:
                      name: ai-engine-secrets
                  resources:
                    requests:
                      cpu: "{{ deployment_config.resources.ai_engine.requests.cpu }}"
                      memory: "{{ deployment_config.resources.ai_engine.requests.memory }}"
                      nvidia.com/gpu: 1
                    limits:
                      cpu: "{{ deployment_config.resources.ai_engine.limits.cpu }}"
                      memory: "{{ deployment_config.resources.ai_engine.limits.memory }}"
                      nvidia.com/gpu: 2
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8081
                    initialDelaySeconds: 60
                    periodSeconds: 30
                  readinessProbe:
                    httpGet:
                      path: /ready
                      port: 8081
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 1000
                    allowPrivilegeEscalation: false
                  volumeMounts:
                  - name: model-cache
                    mountPath: /app/models
                  - name: temp-storage
                    mountPath: /tmp
                volumes:
                - name: model-cache
                  persistentVolumeClaim:
                    claimName: ai-models-pvc
                - name: temp-storage
                  emptyDir:
                    sizeLimit: 10Gi
      tags: ["deployment", "ai-engine"]

    - name: "Deploy microservices"
      kubernetes.core.k8s:
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ namespace }}"
            labels:
              app: "{{ item.name }}"
              version: "{{ item.version }}"
          spec:
            replicas: "{{ item.replicas }}"
            selector:
              matchLabels:
                app: "{{ item.name }}"
            template:
              metadata:
                labels:
                  app: "{{ item.name }}"
                  version: "{{ item.version }}"
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "{{ item.port }}"
                  prometheus.io/path: "/metrics"
              spec:
                serviceAccountName: "{{ item.name }}-sa"
                containers:
                - name: "{{ item.name }}"
                  image: "ainflue/{{ item.name }}:{{ item.version }}"
                  ports:
                  - containerPort: "{{ item.port }}"
                    name: http
                  env:
                  - name: ENVIRONMENT
                    value: "{{ environment }}"
                  - name: SERVICE_NAME
                    value: "{{ item.name }}"
                  envFrom:
                  - configMapRef:
                      name: "{{ item.name }}-config"
                  - secretRef:
                      name: "{{ item.name }}-secrets"
                  resources:
                    requests:
                      cpu: "{{ item.resources.requests.cpu }}"
                      memory: "{{ item.resources.requests.memory }}"
                    limits:
                      cpu: "{{ item.resources.limits.cpu }}"
                      memory: "{{ item.resources.limits.memory }}"
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: "{{ item.port }}"
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    httpGet:
                      path: /ready
                      port: "{{ item.port }}"
                    initialDelaySeconds: 5
                    periodSeconds: 5
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 1000
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
      loop:
        - name: content-processor
          version: "{{ application_versions.content_processor }}"
          port: 8082
          replicas: "{{ deployment_config.replicas.content_processor }}"
          resources: "{{ deployment_config.resources.content_processor }}"
        - name: user-service
          version: "{{ application_versions.user_service }}"
          port: 8083
          replicas: "{{ deployment_config.replicas.user_service }}"
          resources: "{{ deployment_config.resources.user_service | default({'requests': {'cpu': '500m', 'memory': '1Gi'}, 'limits': {'cpu': '2', 'memory': '4Gi'}}) }}"
        - name: payment-service
          version: "{{ application_versions.payment_service }}"
          port: 8084
          replicas: "{{ deployment_config.replicas.payment_service }}"
          resources: "{{ deployment_config.resources.payment_service | default({'requests': {'cpu': '500m', 'memory': '1Gi'}, 'limits': {'cpu': '2', 'memory': '4Gi'}}) }}"
        - name: notification-service
          version: "{{ application_versions.notification_service }}"
          port: 8085
          replicas: "{{ deployment_config.replicas.notification_service }}"
          resources: "{{ deployment_config.resources.notification_service | default({'requests': {'cpu': '250m', 'memory': '512Mi'}, 'limits': {'cpu': '1', 'memory': '2Gi'}}) }}"
        - name: analytics-service
          version: "{{ application_versions.analytics_service }}"
          port: 8086
          replicas: "{{ deployment_config.replicas.analytics_service }}"
          resources: "{{ deployment_config.resources.analytics_service | default({'requests': {'cpu': '500m', 'memory': '1Gi'}, 'limits': {'cpu': '2', 'memory': '4Gi'}}) }}"
        - name: mobile-api
          version: "{{ application_versions.mobile_api }}"
          port: 8087
          replicas: "{{ deployment_config.replicas.mobile_api }}"
          resources: "{{ deployment_config.resources.mobile_api | default({'requests': {'cpu': '500m', 'memory': '1Gi'}, 'limits': {'cpu': '2', 'memory': '4Gi'}}) }}"
      tags: ["deployment", "microservices"]

    # ==========================================
    # PHASE 4: SERVICE MESH AND NETWORKING
    # ==========================================
    
    - name: "Create Kubernetes services"
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ namespace }}"
            labels:
              app: "{{ item.name }}"
              monitoring: enabled
          spec:
            selector:
              app: "{{ item.name }}"
            ports:
            - name: http
              port: "{{ item.port }}"
              targetPort: "{{ item.port }}"
              protocol: TCP
            - name: metrics
              port: "{{ item.metrics_port }}"
              targetPort: "{{ item.metrics_port }}"
              protocol: TCP
            type: ClusterIP
      loop:
        - { name: "api-gateway", port: 8080, metrics_port: 9090 }
        - { name: "ai-engine", port: 8081, metrics_port: 9091 }
        - { name: "content-processor", port: 8082, metrics_port: 9092 }
        - { name: "user-service", port: 8083, metrics_port: 9093 }
        - { name: "payment-service", port: 8084, metrics_port: 9094 }
        - { name: "notification-service", port: 8085, metrics_port: 9095 }
        - { name: "analytics-service", port: 8086, metrics_port: 9096 }
        - { name: "mobile-api", port: 8087, metrics_port: 9097 }
      tags: ["services", "networking"]

    - name: "Configure Istio Virtual Services"
      kubernetes.core.k8s:
        definition:
          apiVersion: networking.istio.io/v1beta1
          kind: VirtualService
          metadata:
            name: "{{ item.name }}-vs"
            namespace: "{{ namespace }}"
          spec:
            hosts:
            - "{{ item.host }}"
            gateways:
            - ainflue-gateway
            http:
            - match:
              - uri:
                  prefix: "{{ item.prefix }}"
              route:
              - destination:
                  host: "{{ item.name }}.{{ namespace }}.svc.cluster.local"
                  port:
                    number: "{{ item.port }}"
              fault:
                delay:
                  percentage:
                    value: 0.1
                  fixedDelay: 5s
              retries:
                attempts: 3
                perTryTimeout: 10s
                retryOn: 5xx,gateway-error,connect-failure,refused-stream
      loop:
        - { name: "api-gateway", host: "api.ainflue.com", prefix: "/api/", port: 8080 }
        - { name: "ai-engine", host: "ai.ainflue.com", prefix: "/ai/", port: 8081 }
        - { name: "mobile-api", host: "mobile.ainflue.com", prefix: "/mobile/", port: 8087 }
      tags: ["istio", "virtual-services"]

    # ==========================================
    # PHASE 5: AUTOSCALING AND PERFORMANCE
    # ==========================================
    
    - name: "Configure Horizontal Pod Autoscalers"
      kubernetes.core.k8s:
        definition:
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: "{{ item.name }}-hpa"
            namespace: "{{ namespace }}"
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: "{{ item.name }}"
            minReplicas: "{{ item.min_replicas }}"
            maxReplicas: "{{ item.max_replicas }}"
            metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: "{{ item.cpu_threshold }}"
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: "{{ item.memory_threshold }}"
            behavior:
              scaleDown:
                stabilizationWindowSeconds: 300
                policies:
                - type: Percent
                  value: 50
                  periodSeconds: 60
              scaleUp:
                stabilizationWindowSeconds: 60
                policies:
                - type: Percent
                  value: 100
                  periodSeconds: 30
      loop:
        - name: api-gateway
          min_replicas: 3
          max_replicas: 20
          cpu_threshold: 70
          memory_threshold: 80
        - name: ai-engine
          min_replicas: 2
          max_replicas: 10
          cpu_threshold: 80
          memory_threshold: 85
        - name: content-processor
          min_replicas: 2
          max_replicas: 15
          cpu_threshold: 75
          memory_threshold: 80
      tags: ["autoscaling", "hpa"]

    # ==========================================
    # PHASE 6: MONITORING AND OBSERVABILITY
    # ==========================================
    
    - name: "Configure ServiceMonitors for Prometheus"
      kubernetes.core.k8s:
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: "{{ item }}-monitor"
            namespace: "{{ namespace }}"
            labels:
              prometheus: cluster
          spec:
            selector:
              matchLabels:
                app: "{{ item }}"
            endpoints:
            - port: metrics
              interval: 15s
              path: /metrics
      loop:
        - api-gateway
        - ai-engine
        - content-processor
        - user-service
        - payment-service
        - notification-service
        - analytics-service
        - mobile-api
      tags: ["monitoring", "servicemonitors"]

    # ==========================================
    # PHASE 7: SECURITY POLICIES
    # ==========================================
    
    - name: "Apply Pod Security Policies"
      kubernetes.core.k8s:
        definition:
          apiVersion: policy/v1beta1
          kind: PodSecurityPolicy
          metadata:
            name: "{{ namespace }}-psp"
          spec:
            privileged: false
            allowPrivilegeEscalation: false
            requiredDropCapabilities:
            - ALL
            volumes:
            - 'configMap'
            - 'secret'
            - 'emptyDir'
            - 'persistentVolumeClaim'
            runAsUser:
              rule: 'MustRunAsNonRoot'
            seLinux:
              rule: 'RunAsAny'
            fsGroup:
              rule: 'RunAsAny'
      tags: ["security", "psp"]

  post_tasks:
    - name: "Verify application deployments"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ namespace }}"
        name: "{{ item }}"
      register: deployment_status
      failed_when: deployment_status.resources[0].status.readyReplicas != deployment_status.resources[0].spec.replicas
      loop:
        - api-gateway
        - ai-engine
        - content-processor
        - user-service
        - payment-service
        - notification-service
        - analytics-service
        - mobile-api
      tags: ["verification"]

    - name: "Run application health checks"
      uri:
        url: "http://{{ item.name }}.{{ namespace }}.svc.cluster.local:{{ item.port }}/health"
        method: GET
        status_code: 200
      loop:
        - { name: "api-gateway", port: 8080 }
        - { name: "ai-engine", port: 8081 }
        - { name: "content-processor", port: 8082 }
        - { name: "user-service", port: 8083 }
      register: health_checks
      tags: ["verification", "health-checks"]

    - name: "Display application endpoints"
      debug:
        msg:
          - "API Gateway: https://api.ainflue.com"
          - "AI Engine: https://ai.ainflue.com"
          - "Mobile API: https://mobile.ainflue.com"
          - "Internal Services accessible via service mesh"
      tags: ["endpoints"]

  handlers:
    - name: restart applications
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ namespace }}"
        name: "{{ item }}"
      loop:
        - api-gateway
        - ai-engine
        - content-processor
      listen: "restart apps"

# Application deployment validation
- name: "Application Deployment Validation"
  hosts: application_servers
  tasks:
    - name: "Generate application deployment report"
      template:
        src: application_report.j2
        dest: "/tmp/ainflue_application_deployment_report.json"
      vars:
        deployment_timestamp: "{{ ansible_date_time.iso8601 }}"
        deployment_status: "{{ deployment_status.results }}"
        health_status: "{{ health_checks.results }}"
        environment: "{{ environment }}"
        namespace: "{{ namespace }}"
      tags: ["reporting"]

    - name: "Send deployment notification"
      uri:
        url: "{{ slack_webhook_url }}"
        method: POST
        body_format: json
        body:
          text: "🚀 Ainflue {{ environment }} application deployment completed successfully"
          attachments:
          - color: "good"
            fields:
            - title: "Environment"
              value: "{{ environment }}"
              short: true
            - title: "Namespace"
              value: "{{ namespace }}"
              short: true
            - title: "Applications"
              value: "8 services deployed"
              short: true
            - title: "Status"
