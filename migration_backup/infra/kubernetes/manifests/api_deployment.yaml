apiVersion: apps/v1
kind: Deployment
metadata:
  name: ainflue-worker
  namespace: ainflue-platform
  labels:
    app: ainflue-worker
    version: v1
    component: background-worker
    part-of: ainflue-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ainflue-worker
      version: v1
  template:
    metadata:
      labels:
        app: ainflue-worker
        version: v1
        component: background-worker
        part-of: ainflue-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ainflue-worker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
      - name: ainflue-worker
        image: ainflue/worker:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
          name: metrics
          protocol: TCP
        env:
        - name: ENV
          value: "production"
        - name: METRICS_PORT
          value: "8090"
        - name: WORKER_CONCURRENCY
          value: "4"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ainflue-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: ainflue-secrets
              key: redis-url
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: ainflue-config
              key: aws-region
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: ainflue-config
              key: s3-bucket
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: temp-storage
          mountPath: /tmp
      volumes:
      - name: temp-storage
        emptyDir:
          sizeLimit: 5Gi
      nodeSelector:
        kubernetes.io/arch: amd64
        node.kubernetes.io/instance-type: t3.large
      tolerations:
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300