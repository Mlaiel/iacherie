---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-database
  namespace: ainflue-platform
  labels:
    app: postgresql
    component: database
    part-of: ainflue-platform
spec:
  type: ExternalName
  externalName: ainflue-prod-db.cluster-xyz.us-west-2.rds.amazonaws.com
  ports:
  - name: postgresql
    port: 5432
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-redis
  namespace: ainflue-platform
  labels:
    app: redis
    component: cache
    part-of: ainflue-platform
spec:
  type: ExternalName
  externalName: ainflue-prod-redis.xyz.cache.amazonaws.com
  ports:
  - name: redis
    port: 6379
    protocol: TCP
---
# Headless service for StatefulSet workloads
apiVersion: v1
kind: Service
metadata:
  name: ainflue-headless
  namespace: ainflue-platform
  labels:
    app: ainflue-platform
    component: headless
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: ainflue-api
---
# Service for monitoring stack
apiVersion: v1
kind: Service
metadata:
  name: prometheus-server
  namespace: monitoring
  labels:
    app: prometheus
    component: server
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: prometheus
    component: server
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    component: dashboard
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: grafana
---
# Service Monitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ainflue-api-monitor
  namespace: ainflue-platform
  labels:
    app: ainflue-api
    release: prometheus
spec:
  selector:
    matchLabels:
      app: ainflue-api
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
