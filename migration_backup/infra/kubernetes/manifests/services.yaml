---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-api-service
  namespace: ainflue-platform
  labels:
    app: ainflue-api
    component: backend-api
    part-of: ainflue-platform
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /health
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "5"
    service.beta.kubernetes.io/aws-load-balancer-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-unhealthy-threshold: "2"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8080
    protocol: TCP
  selector:
    app: ainflue-api
    version: v1
---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-api-internal
  namespace: ainflue-platform
  labels:
    app: ainflue-api
    component: backend-api
    part-of: ainflue-platform
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8090
    targetPort: 8090
    protocol: TCP
  selector:
    app: ainflue-api
    version: v1
---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-ai-engine-service
  namespace: ainflue-platform
  labels:
    app: ainflue-ai-engine
    component: ai-processing
    part-of: ainflue-platform
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8090
    targetPort: 8090
    protocol: TCP
  selector:
    app: ainflue-ai-engine
    version: v1
---
apiVersion: v1
