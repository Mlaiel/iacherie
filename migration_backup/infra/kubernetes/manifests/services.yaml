---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-mobile-api-internal
  namespace: ainflue-platform
  labels:
    app: ainflue-mobile-api
    component: mobile-backend
    part-of: ainflue-platform
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
