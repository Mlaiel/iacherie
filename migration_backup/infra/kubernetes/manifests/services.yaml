---
apiVersion: v1
kind: Service
metadata:
  name: ainflue-worker-metrics
  namespace: ainflue-platform
  labels:
    app: ainflue-worker
    component: background-worker
    part-of: ainflue-platform
spec:
  type: ClusterIP
  ports:
  - name: metrics
