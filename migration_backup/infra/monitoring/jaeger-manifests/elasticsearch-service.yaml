apiVersion: v1
kind: Service
metadata:
  labels:
    app: elasticsearch
    component: jaeger
  name: elasticsearch
  namespace: jaeger-system
spec:
  ports:
  - name: port-9200
    port: 9200
    protocol: TCP
    targetPort: 9200
  - name: port-9300
    port: 9300
    protocol: TCP
    targetPort: 9300
  selector:
    app: elasticsearch
  type: ClusterIP
