apiVersion: v1
kind: Service
metadata:
  labels:
    app: jaeger-collector
    component: jaeger
  name: jaeger-collector
  namespace: jaeger-system
spec:
  ports:
  - name: port-14268
    port: 14268
    protocol: TCP
    targetPort: 14268
  - name: port-14250
    port: 14250
    protocol: TCP
    targetPort: 14250
  - name: port-9411
    port: 9411
    protocol: TCP
    targetPort: 9411
  selector:
    app: jaeger-collector
  type: ClusterIP
