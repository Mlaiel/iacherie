{{- if .Values.ingress.enabled }}
{{- $fullName := include "ainflue.fullname" . }}
{{- $svcPort := .Values.service.port }}
{{- if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.11-0" .Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1beta1
{{- else }}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}-ingress
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    {{- if not (hasKey . "kubernetes.io/ingress.class") }}
    kubernetes.io/ingress.class: {{ $.Values.ingress.className | default "nginx" }}
    {{- end }}
    {{- if not (hasKey . "cert-manager.io/cluster-issuer") and $.Values.ingress.tls }}
    cert-manager.io/cluster-issuer: {{ $.Values.ingress.certManager.clusterIssuer | default "letsencrypt-prod" }}
    {{- end }}
    {{- if not (hasKey . "nginx.ingress.kubernetes.io/ssl-redirect") }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
    {{- if not (hasKey . "nginx.ingress.kubernetes.io/force-ssl-redirect") }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- end }}
    {{- if not (hasKey . "nginx.ingress.kubernetes.io/proxy-body-size") }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $.Values.ingress.maxBodySize | default "500m" }}
    {{- end }}
    {{- if $.Values.ingress.rateLimiting.enabled }}
    nginx.ingress.kubernetes.io/rate-limit-rps: {{ $.Values.ingress.rateLimiting.rps | quote }}
    nginx.ingress.kubernetes.io/rate-limit-connections: {{ $.Values.ingress.rateLimiting.connections | quote }}
    {{- end }}
    {{- if $.Values.ingress.security.enabled }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "{{ $.Values.ingress.security.csp | default "default-src 'self'" }}" always;
      {{- if $.Values.ingress.security.hsts.enabled }}
      add_header Strict-Transport-Security "max-age={{ $.Values.ingress.security.hsts.maxAge | default 31536000 }}; includeSubDomains; preload" always;
      {{- end }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: {{ .pathType | default "Prefix" }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}-{{ .service | default "api" }}
                port:
                  number: {{ .port | default $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}-{{ .service | default "api" }}
              servicePort: {{ .port | default $svcPort }}
              {{- end }}
          {{- end }}
    {{- end }}

---
{{- if .Values.ingress.api.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api-ingress
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: api-ingress
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | default "nginx" }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.api.maxBodySize | default "500m" }}
    nginx.ingress.kubernetes.io/proxy-connect-timeout: {{ .Values.ingress.api.connectTimeout | default "60" | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.api.sendTimeout | default "60" | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.api.readTimeout | default "60" | quote }}
    {{- if .Values.ingress.api.cors.enabled }}
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: {{ .Values.ingress.api.cors.allowOrigin | quote }}
    nginx.ingress.kubernetes.io/cors-allow-methods: {{ .Values.ingress.api.cors.allowMethods | default "GET, POST, PUT, DELETE, OPTIONS" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-headers: {{ .Values.ingress.api.cors.allowHeaders | default "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" | quote }}
    {{- end }}
    {{- if .Values.ingress.api.rateLimiting.enabled }}
    nginx.ingress.kubernetes.io/rate-limit-rps: {{ .Values.ingress.api.rateLimiting.rps | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.api.host | quote }}
      secretName: {{ .Values.ingress.api.tlsSecretName | default (printf "%s-api-tls" $fullName) }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.api.host | quote }}
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: {{ $fullName }}-api
            port:
              number: {{ .Values.ingress.api.port | default 8000 }}
{{- end }}

---
{{- if .Values.ingress.ai.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-ai-ingress
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: ai-ingress
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | default "nginx" }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.ai.maxBodySize | default "1g" }}
    nginx.ingress.kubernetes.io/proxy-connect-timeout: {{ .Values.ingress.ai.connectTimeout | default "300" | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.ai.sendTimeout | default "300" | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.ai.readTimeout | default "300" | quote }}
    {{- if .Values.ingress.ai.rateLimiting.enabled }}
    nginx.ingress.kubernetes.io/rate-limit-rps: {{ .Values.ingress.ai.rateLimiting.rps | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.ai.host | quote }}
      secretName: {{ .Values.ingress.ai.tlsSecretName | default (printf "%s-ai-tls" $fullName) }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.ai.host | quote }}
    http:
      paths:
      - path: /ai(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: {{ $fullName }}-ai
            port:
              number: {{ .Values.ingress.ai.port | default 8001 }}
{{- end }}

---
{{- if .Values.ingress.upload.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-upload-ingress
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: upload-ingress
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | default "nginx" }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.upload.maxBodySize | default "5g" }}
    nginx.ingress.kubernetes.io/proxy-connect-timeout: {{ .Values.ingress.upload.connectTimeout | default "600" | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.upload.sendTimeout | default "600" | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.upload.readTimeout | default "600" | quote }}
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- if .Values.ingress.upload.rateLimiting.enabled }}
    nginx.ingress.kubernetes.io/rate-limit-rps: {{ .Values.ingress.upload.rateLimiting.rps | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.upload.host | quote }}
      secretName: {{ .Values.ingress.upload.tlsSecretName | default (printf "%s-upload-tls" $fullName) }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.upload.host | quote }}
    http:
      paths:
      - path: /upload(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: {{ $fullName }}-upload
            port:
              number: {{ .Values.ingress.upload.port | default 8002 }}
{{- end }}

---
{{- if .Values.ingress.monitoring.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-monitoring-ingress
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: monitoring-ingress
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | default "nginx" }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.ingress.monitoring.authSecret | default (printf "%s-monitoring-auth" $fullName) }}
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required - Ainflue Monitoring'
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.monitoring.host | quote }}
      secretName: {{ .Values.ingress.monitoring.tlsSecretName | default (printf "%s-monitoring-tls" $fullName) }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.monitoring.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $fullName }}-grafana
            port:
              number: {{ .Values.ingress.monitoring.port | default 3000 }}
{{- end }}
{{- end }}