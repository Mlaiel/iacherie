apiVersion: v2
name: ainflue-api
description: A Helm chart for Ainflue API Service - Enterprise Creator Economy Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://ainflue.com
sources:
  - https://github.com/Mlaiel/Ainflue
maintainers:
  - name: Fahed Mlaiel
    email: mlaiel@live.de
keywords:
  - api
  - backend
  - creator-economy
  - ainflue
  - enterprise
annotations:
  category: Backend
  licenses: Proprietary
dependencies:
  - name: postgresql
    version: 12.1.9
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.3.7
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: prometheus
    version: 15.18.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled