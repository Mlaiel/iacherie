{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: secrets
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: {{ .Values.secrets.type | default "Opaque" }}
{{- if .Values.secrets.stringData }}
stringData:
  {{- range $key, $value := .Values.secrets.stringData }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if .Values.secrets.data }}
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- end }}

---
{{- if .Values.database.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-database-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: database-secrets
type: Opaque
stringData:
  # Database Connection
  DATABASE_URL: {{ .Values.database.secret.url | quote }}
  DATABASE_PASSWORD: {{ .Values.database.secret.password | quote }}
  DATABASE_USER: {{ .Values.database.secret.username | quote }}
  
  {{- if .Values.database.secret.additionalSecrets }}
  {{- range $key, $value := .Values.database.secret.additionalSecrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}

---
{{- if .Values.redis.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-redis-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: redis-secrets
type: Opaque
stringData:
  # Redis Connection
  REDIS_URL: {{ .Values.redis.secret.url | quote }}
  REDIS_PASSWORD: {{ .Values.redis.secret.password | quote }}
  
  # Celery Configuration
  CELERY_BROKER_URL: {{ .Values.redis.secret.celeryBrokerUrl | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.redis.secret.celeryResultBackend | quote }}
{{- end }}

---
{{- if .Values.jwt.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-jwt-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: jwt-secrets
type: Opaque
stringData:
  # JWT Configuration
  JWT_SECRET: {{ .Values.jwt.secret.key | quote }}
  JWT_REFRESH_SECRET: {{ .Values.jwt.secret.refreshKey | quote }}
  JWT_ALGORITHM: {{ .Values.jwt.secret.algorithm | default "HS256" | quote }}
  JWT_EXPIRATION: {{ .Values.jwt.secret.expiration | default "3600" | quote }}
{{- end }}

---
{{- if .Values.encryption.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-encryption-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: encryption-secrets
type: Opaque
stringData:
  # Encryption Keys
  ENCRYPTION_KEY: {{ .Values.encryption.secret.key | quote }}
  APP_SECRET_KEY: {{ .Values.encryption.secret.appKey | quote }}
  
  {{- if .Values.encryption.secret.additionalKeys }}
  {{- range $key, $value := .Values.encryption.secret.additionalKeys }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}

---
{{- if .Values.oauth.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-oauth-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: oauth-secrets
type: Opaque
stringData:
  # Google OAuth
  {{- if .Values.oauth.secret.google.enabled }}
  GOOGLE_CLIENT_ID: {{ .Values.oauth.secret.google.clientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.oauth.secret.google.clientSecret | quote }}
  {{- end }}
  
  # Facebook OAuth
  {{- if .Values.oauth.secret.facebook.enabled }}
  FACEBOOK_APP_ID: {{ .Values.oauth.secret.facebook.appId | quote }}
  FACEBOOK_APP_SECRET: {{ .Values.oauth.secret.facebook.appSecret | quote }}
  {{- end }}
  
  # GitHub OAuth
  {{- if .Values.oauth.secret.github.enabled }}
  GITHUB_CLIENT_ID: {{ .Values.oauth.secret.github.clientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.oauth.secret.github.clientSecret | quote }}
  {{- end }}
{{- end }}

---
{{- if .Values.cloudCredentials.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-cloud-credentials
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: cloud-credentials
type: Opaque
stringData:
  # AWS Credentials
  {{- if .Values.cloudCredentials.secret.aws.enabled }}
  AWS_ACCESS_KEY_ID: {{ .Values.cloudCredentials.secret.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.cloudCredentials.secret.aws.secretAccessKey | quote }}
  AWS_REGION: {{ .Values.cloudCredentials.secret.aws.region | quote }}
  {{- end }}
  
  # Google Cloud Credentials
  {{- if .Values.cloudCredentials.secret.gcp.enabled }}
  GCP_SERVICE_ACCOUNT_KEY: {{ .Values.cloudCredentials.secret.gcp.serviceAccountKey | quote }}
  GCP_PROJECT_ID: {{ .Values.cloudCredentials.secret.gcp.projectId | quote }}
  {{- end }}
  
  # Azure Credentials
  {{- if .Values.cloudCredentials.secret.azure.enabled }}
  AZURE_TENANT_ID: {{ .Values.cloudCredentials.secret.azure.tenantId | quote }}
  AZURE_CLIENT_ID: {{ .Values.cloudCredentials.secret.azure.clientId | quote }}
  AZURE_CLIENT_SECRET: {{ .Values.cloudCredentials.secret.azure.clientSecret | quote }}
  AZURE_SUBSCRIPTION_ID: {{ .Values.cloudCredentials.secret.azure.subscriptionId | quote }}
  {{- end }}
{{- end }}

---
{{- if .Values.ssl.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-ssl-certs
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: ssl-certificates
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.ssl.secret.certificate | b64enc }}
  tls.key: {{ .Values.ssl.secret.privateKey | b64enc }}
  {{- if .Values.ssl.secret.caCertificate }}
  ca.crt: {{ .Values.ssl.secret.caCertificate | b64enc }}
  {{- end }}
{{- end }}

---
{{- if .Values.registry.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-registry-secret
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: registry-credentials
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.registry.secret.dockerconfigjson | b64enc }}
{{- end }}

---
{{- if .Values.ai.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-ai-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: ai-secrets
type: Opaque
stringData:
  # AI/ML API Keys
  {{- if .Values.ai.secret.openai.enabled }}
  OPENAI_API_KEY: {{ .Values.ai.secret.openai.apiKey | quote }}
  {{- end }}
  
  {{- if .Values.ai.secret.anthropic.enabled }}
  ANTHROPIC_API_KEY: {{ .Values.ai.secret.anthropic.apiKey | quote }}
  {{- end }}
  
  {{- if .Values.ai.secret.huggingface.enabled }}
  HUGGING_FACE_TOKEN: {{ .Values.ai.secret.huggingface.token | quote }}
  {{- end }}
  
  {{- if .Values.ai.secret.custom }}
  {{- range $key, $value := .Values.ai.secret.custom }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}

---
{{- if .Values.monitoring.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ainflue.fullname" . }}-monitoring-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "ainflue.labels" . | nindent 4 }}
    component: monitoring-secrets
type: Opaque
stringData:
  # Grafana Admin Credentials
  GRAFANA_ADMIN_PASSWORD: {{ .Values.monitoring.secret.grafana.adminPassword | quote }}
  
  # Prometheus External Labels
  PROMETHEUS_EXTERNAL_LABELS: {{ .Values.monitoring.secret.prometheus.externalLabels | quote }}
  
  # AlertManager Configuration
  ALERTMANAGER_CONFIG: {{ .Values.monitoring.secret.alertmanager.config | quote }}
{{- end }}
{{- end }}