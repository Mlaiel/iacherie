# Ainflue Helm Chart Default Values
# =================================
# 
# Default configuration values for Ainflue platform deployment
# This file contains configuration for all components and services
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  
nameOverride: ""
fullnameOverride: ""

# Environment configuration
environment: production
domain: ainflue.com

# Image configuration
image:
  api:
    repository: ainflue/api
    tag: "latest"
    pullPolicy: IfNotPresent
  aiEngine:
    repository: ainflue/ai-engine
    tag: "latest"
    pullPolicy: IfNotPresent
  mobileApi:
    repository: ainflue/mobile-api
    tag: "latest"
    pullPolicy: IfNotPresent
  worker:
    repository: ainflue/worker
    tag: "latest"
    pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  port: 80
  annotations: {}

# API service configuration
api:
  enabled: true
  replicaCount: 3
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  nodeSelector: {}
  tolerations: []
  affinity: {}
  
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5

# AI Engine service configuration
aiEngine:
  enabled: true
  replicaCount: 2
  
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
      nvidia.com/gpu: 1
    limits:
      memory: "4Gi"
      cpu: "2000m"
      nvidia.com/gpu: 1
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 85
  
  nodeSelector:
    accelerator: "nvidia-tesla-k80"
  tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  
  modelCache:
    size: 20Gi
    storageClass: "fast-ssd"

# Mobile API service configuration
mobileApi:
  enabled: true
  replicaCount: 2
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "125m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

# Background workers configuration
workers:
  enabled: true
  replicaCount: 3
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 75
  
  queues:
    - default
    - high_priority
    - ai_processing
    - content_generation
    - notifications

# Scheduler configuration
scheduler:
  enabled: true
  replicaCount: 1
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# PostgreSQL database configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "changeme"
    username: "ainflue_admin"
    password: "changeme"
    database: "ainflue"
  
  primary:
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""
    
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  
  metrics:
    enabled: true

# Redis cache configuration
redis:
  enabled: true
  auth:
    enabled: false
  
  master:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    
    resources:
      requests:
        memory: "256Mi"
        cpu: "125m"
      limits:
        memory: "512Mi"
        cpu: "250m"
  
  metrics:
    enabled: true

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  
  hosts:
    - host: api.ainflue.com
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: ai.ainflue.com
      paths:
        - path: /
          pathType: Prefix
          service: ai-engine
    - host: mobile.ainflue.com
      paths:
        - path: /
          pathType: Prefix
          service: mobile-api
  
  tls:
    - secretName: ainflue-tls
      hosts:
        - api.ainflue.com
        - ai.ainflue.com
        - mobile.ainflue.com

# Persistent storage configuration
persistence:
  media:
    enabled: true
    size: 100Gi
    storageClass: "efs-sc"
    accessMode: ReadWriteMany

# Configuration and secrets
config:
  # Database settings
  database:
    host: ""  # Will be set automatically if postgresql.enabled is true
    port: 5432
    name: "ainflue"
    username: "ainflue_admin"
  
  # Redis settings
  redis:
    host: ""  # Will be set automatically if redis.enabled is true
    port: 6379
  
  # Application settings
  app:
    environment: "production"
    logLevel: "INFO"
    apiVersion: "v1"
    maxWorkers: 4
    workerTimeout: 30
    corsOrigins: "*"
    uploadMaxSize: "100MB"
    sessionTimeout: 3600
    rateLimitRequests: 1000
    rateLimitWindow: 3600

# Secrets configuration (base64 encoded)
secrets:
  database:
    password: ""  # Will be generated if empty
  
  app:
    secretKey: ""  # Will be generated if empty
    jwtSecret: ""  # Will be generated if empty
  
  integrations:
    openaiApiKey: ""
    elevenlabsApiKey: ""
    stripeSecretKey: ""
    stripePublishableKey: ""
    shopifyApiKey: ""
    midjourneyApiToken: ""

# ServiceAccount configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context
podSecurityContext:
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Network policies
networkPolicy:
  enabled: true
  ingress:
    enabled: true
  egress:
    enabled: true

# Monitoring and observability
monitoring:
  enabled: true
  
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics
  
  prometheusRule:
    enabled: true
    rules:
      - alert: AinfluePodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
      
      - alert: AinflueHighMemoryUsage
        expr: (container_memory_usage_bytes{namespace="{{ .Release.Namespace }}"} / container_spec_memory_limit_bytes{namespace="{{ .Release.Namespace }}"}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
      
      - alert: AinflueHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace }}"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"

# Cert-manager configuration
certManager:
  enabled: true
  installCRDs: true

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 30  # days
  
  postgresql:
    enabled: true
  
  media:
    enabled: true

# Testing configuration
tests:
  enabled: true
  image:
    repository: busybox
    tag: latest
  
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"