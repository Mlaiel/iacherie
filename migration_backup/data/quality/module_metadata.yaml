supported_formats:
  audio:
    - "mp3"
    - "wav"
    - "flac"
    - "aac"
    - "m4a"
    - "ogg"
    
  video:
    - "mp4"
    - "avi"
    - "mov"
    - "webm"
    - "mkv"
    
  image:
    - "jpg"
    - "jpeg"
    - "png"
    - "gif"
    - "webp"
    - "bmp"
    - "tiff"
    
  text:
    - "txt"
    - "md"
    - "json"
    - "xml"
    - "yaml"
    - "csv"

protection_levels:
  basic:
    description: "Standard protection with essential security checks"
    features: ["format_validation", "size_validation", "basic_malware_scan"]
    
  enhanced:
    description: "Enhanced protection with ML-based threat detection"
    features: ["advanced_malware_scan", "steganography_detection", "metadata_analysis"]
    
  maximum:
    description: "Maximum security with comprehensive analysis"
    features: ["deep_malware_scan", "behavioral_analysis", "sandbox_analysis"]

performance_targets:
  validation_speed: "<2s for typical content"
  throughput: "1000+ validations per minute"
  accuracy: ">95% validation accuracy"
  uptime: ">99.9% system availability"
  response_time: "<2s API response time"
  memory_efficiency: "Optimized for large-scale processing"

