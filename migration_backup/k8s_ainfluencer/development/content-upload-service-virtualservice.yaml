apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app: content-upload-service
    service-type: content-service
  name: content-upload-service-vs
  namespace: ainflue-development
spec:
  hosts:
  - content-upload-service.ainflue-development.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: /
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
    route:
    - destination:
        host: content-upload-service.ainflue-development.svc.cluster.local
        port:
          number: 8001
    timeout: 30s
