# Ainflue Gamification Module - Kubernetes Namespace
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready namespace for gamification microservice

apiVersion: v1
kind: Namespace
metadata:
  name: ainflue-gamification
  labels:
    name: ainflue-gamification
    environment: production
    app.kubernetes.io/name: gamification
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: gamification-service
    app.kubernetes.io/part-of: ainflue-platform
    app.kubernetes.io/managed-by: kubectl
    managed-by: fahed-mlaiel
    business-domain: engagement-monetization
  annotations:
    description: "Ainflue Gamification Engine - Points, Achievements, Leaderboards for Content Creators"
    contact: "mlaiel@live.de"
    created-by: "Fahed Mlaiel"
    business-purpose: "Creator engagement through gamified experiences and reward systems"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gamification-quota
  namespace: ainflue-gamification
  labels:
    app.kubernetes.io/name: gamification
    app.kubernetes.io/component: resource-management
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "5"
    pods: "20"
    services: "10"
    secrets: "15"
    configmaps: "10"
    count/deployments.apps: "5"
    count/replicasets.apps: "10"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: gamification-limits
  namespace: ainflue-gamification
  labels:
    app.kubernetes.io/name: gamification
    app.kubernetes.io/component: resource-limits
spec:
  limits:
  - type: Container
    default:
      cpu: 200m
      memory: 256Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: 1
      memory: 2Gi
    min:
      cpu: 50m
      memory: 64Mi
  - type: PersistentVolumeClaim
    max:
      storage: 50Gi
    min:
      storage: 1Gi