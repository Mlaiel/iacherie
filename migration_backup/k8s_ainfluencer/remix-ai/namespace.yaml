# Ainflue Remix AI Module - Kubernetes Namespace
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready namespace for AI remix microservice with GPU support

apiVersion: v1
kind: Namespace
metadata:
  name: ainflue-remix-ai
  labels:
    name: ainflue-remix-ai
    environment: production
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: ai-remix-service
    app.kubernetes.io/part-of: ainflue-platform
    app.kubernetes.io/managed-by: kubectl
    managed-by: fahed-mlaiel
    business-domain: ai-content-generation
    gpu-enabled: "true"
  annotations:
    description: "Ainflue AI Remix Engine - Advanced AI-powered content remixing and generation"
    contact: "mlaiel@live.de"
    created-by: "Fahed Mlaiel"
    business-purpose: "AI-driven content remixing for multi-format creator collaborations"
    gpu-requirements: "NVIDIA V100/A100 minimum"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: remix-ai-quota
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: resource-management
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 32Gi
    limits.cpu: "16"
    limits.memory: 64Gi
    requests.nvidia.com/gpu: "4"
    limits.nvidia.com/gpu: "8"
    persistentvolumeclaims: "10"
    pods: "15"
    services: "8"
    secrets: "20"
    configmaps: "15"
    count/deployments.apps: "3"
    count/replicasets.apps: "6"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: remix-ai-limits
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: resource-limits
spec:
  limits:
  - type: Container
    default:
      cpu: 1000m
      memory: 4Gi
      nvidia.com/gpu: 1
    defaultRequest:
      cpu: 500m
      memory: 2Gi
      nvidia.com/gpu: 1
    max:
      cpu: 4
      memory: 16Gi
      nvidia.com/gpu: 2
    min:
      cpu: 100m
      memory: 512Mi
  - type: PersistentVolumeClaim
    max:
      storage: 500Gi
    min:
      storage: 10Gi