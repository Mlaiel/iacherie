# Ainflue Remix AI Module - Ingress Configuration
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready ingress for AI remix API endpoints

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remix-ai-ingress
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: ainflue-platform
    app.kubernetes.io/managed-by: kubectl
    created-by: fahed-mlaiel
  annotations:
    description: "Ingress for AI remix API - intelligent content generation and remixing"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.ainflue.com,https://studio.ainflue.com,https://dashboard.ainflue.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-ID,X-Session-ID,X-Collaboration-ID"
    nginx.ingress.kubernetes.io/rate-limit: "50"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/rate-limit-rps: "5"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "100M"
    nginx.ingress.kubernetes.io/proxy-body-size: "500M"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout invalid_header http_500 http_502 http_503"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-ID,X-User-Role,X-Collaboration-Access"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob:";
      more_set_headers "X-Service-Name: remix-ai";
      more_set_headers "X-Service-Version: 1.0";
      more_set_headers "X-AI-Processing: enabled";
      more_set_headers "X-GPU-Accelerated: true";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/server-snippet: |
      location /remix-ai/metrics {
        deny all;
        return 403;
      }
      location /remix-ai/internal {
        deny all;
        return 403;
      }
      client_max_body_size 500M;
      client_body_timeout 600s;
      client_header_timeout 60s;
spec:
  tls:
  - hosts:
    - api.ainflue.com
    - remix-ai.ainflue.com
    - studio.ainflue.com
    secretName: remix-ai-tls-secret
  rules:
  - host: api.ainflue.com
    http:
      paths:
      - path: /v1/remix-ai/generate
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8005
      - path: /v1/remix-ai/style-transfer
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8005
      - path: /v1/remix-ai/collaboration
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8005
      - path: /v1/remix-ai/enhance
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8005
      - path: /v1/remix-ai/models
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8005
      - path: /v1/remix-ai/queue
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8005
      - path: /v1/remix-ai/status
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8005
      - path: /v1/remix-ai/health
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8081
  - host: remix-ai.ainflue.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8005
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8081
      - path: /models
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8085
  - host: studio.ainflue.com
    http:
      paths:
      - path: /api/remix
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8005
      - path: /api/collaboration
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8005

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remix-ai-websocket-ingress
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: websocket-ingress
  annotations:
    description: "WebSocket ingress for real-time AI collaboration"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "remix-ai-service"
    nginx.ingress.kubernetes.io/connection-proxy-header: "upgrade"
    nginx.ingress.kubernetes.io/upgrade: "websocket"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - ws.remix-ai.ainflue.com
    secretName: remix-ai-ws-tls-secret
  rules:
  - host: ws.remix-ai.ainflue.com
    http:
      paths:
      - path: /ws/collaboration
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8088
      - path: /ws/processing
        pathType: Prefix
        backend:
          service:
            name: remix-ai-service
            port:
              number: 8088

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remix-ai-network-policy
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: remix-ai
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: ainflue
    - namespaceSelector:
        matchLabels:
          name: ainflue-monitoring
    - namespaceSelector:
        matchLabels:
          name: ainflue-gamification
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: ainflue-platform
    ports:
    - protocol: TCP
      port: 8005
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8085
    - protocol: TCP
      port: 8088
    - protocol: TCP
      port: 9090
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8004
    - protocol: TCP
      port: 8007

---
apiVersion: v1
kind: Service
metadata:
  name: remix-ai-load-balancer
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: load-balancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
  - 0.0.0.0/0
  ports:
  - name: https
    port: 443
    targetPort: 8005
    protocol: TCP
  - name: websocket
    port: 8088
    targetPort: 8088
    protocol: TCP
  selector:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/instance: production