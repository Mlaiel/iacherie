# Ainflue Remix AI Module - Deployment Manifest
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready deployment for AI remix engine with GPU acceleration

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ainflue-remix-ai
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: ai-remix-engine
    app.kubernetes.io/part-of: ainflue-platform
    app.kubernetes.io/managed-by: kubectl
    created-by: fahed-mlaiel
  annotations:
    description: "AI remix engine for intelligent content generation and collaboration"
    deployment.kubernetes.io/revision: "1"
    gpu.requirement: "NVIDIA V100/A100"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remix-ai
      app.kubernetes.io/instance: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remix-ai
        app.kubernetes.io/instance: production
        app.kubernetes.io/version: "1.0"
        app.kubernetes.io/component: ai-remix-engine
        app.kubernetes.io/part-of: ainflue-platform
        gpu-accelerated: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        sidecar.istio.io/inject: "true"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: remix-ai-service-account
      imagePullSecrets:
        - name: docker-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      priorityClassName: high-priority
      containers:
      - name: remix-ai-engine
        image: ghcr.io/mlaiel/ainflue/remix-ai:1.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8005
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        - name: model-server
          containerPort: 8085
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "remix-ai"
        - name: SERVICE_PORT
          value: "8005"
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1"
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        - name: AI_ENGINE_MODE
          value: "production"
        - name: GPU_MEMORY_FRACTION
          value: "0.8"
        - name: MODEL_PARALLEL_ENABLED
          value: "true"
        - name: BATCH_PROCESSING_ENABLED
          value: "true"
        - name: REAL_TIME_PROCESSING_ENABLED
          value: "true"
        - name: COLLABORATIVE_MODE_ENABLED
          value: "true"
        - name: QUALITY_ENHANCEMENT_ENABLED
          value: "true"
        - name: STYLE_TRANSFER_ENABLED
          value: "true"
        - name: GENERATION_CACHE_ENABLED
          value: "true"
        - name: MODEL_WARMUP_ENABLED
          value: "true"
        envFrom:
        - configMapRef:
            name: remix-ai-config
        - secretRef:
            name: remix-ai-secrets
        resources:
          requests:
            cpu: 1000m
            memory: 8Gi
            nvidia.com/gpu: 1
          limits:
            cpu: 4000m
            memory: 32Gi
            nvidia.com/gpu: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health/startup
            port: health
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 60
          successThreshold: 1
        volumeMounts:
        - name: ai-models
          mountPath: /app/models
        - name: training-data
          mountPath: /app/training_data
        - name: generated-content
          mountPath: /app/generated
        - name: model-cache
          mountPath: /app/cache
        - name: temp-storage
          mountPath: /tmp
        - name: gpu-libs
          mountPath: /usr/local/cuda
          readOnly: true
        - name: logs
          mountPath: /app/logs
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - SYS_ADMIN
      volumes:
      - name: ai-models
        persistentVolumeClaim:
          claimName: ai-models-pvc
      - name: training-data
        persistentVolumeClaim:
          claimName: training-data-pvc
      - name: generated-content
        persistentVolumeClaim:
          claimName: generated-content-pvc
      - name: model-cache
        emptyDir:
          sizeLimit: 20Gi
      - name: temp-storage
        emptyDir:
          sizeLimit: 10Gi
      - name: gpu-libs
        hostPath:
          path: /usr/local/cuda
          type: Directory
      - name: logs
        emptyDir:
          sizeLimit: 5Gi
      nodeSelector:
        accelerator: nvidia-tesla-v100
        node-type: gpu-optimized
        workload-type: ai-processing
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - remix-ai
            topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                - p3.2xlarge
                - p3.8xlarge
                - p4d.24xlarge
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: dedicated
        operator: Equal
        value: ai-processing
        effect: NoSchedule

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-models-pvc
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  storageClassName: gp3

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-data-pvc
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: training-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: gp3

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: generated-content-pvc
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: output-storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: efs-sc

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remix-ai-service-account
  namespace: ainflue-remix-ai
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: security
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/RemixAIServiceRole
automountServiceAccountToken: true

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
  labels:
    app.kubernetes.io/name: remix-ai
    app.kubernetes.io/component: scheduling
value: 1000
globalDefault: false
description: "High priority class for AI processing workloads"