# Ainflue Mobile API Module - Service Manifest
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready service for mobile API endpoints

apiVersion: v1
kind: Service
metadata:
  name: mobile-api-service
  namespace: ainflue-mobile-api
  labels:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/component: mobile-api-service
    app.kubernetes.io/part-of: ainflue-platform
    app.kubernetes.io/managed-by: kubectl
    created-by: fahed-mlaiel
  annotations:
    description: "Service for mobile API - optimized endpoints for mobile applications"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8006
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  - name: health
    port: 8081
    targetPort: health
    protocol: TCP
  - name: grpc
    port: 9000
    targetPort: grpc
    protocol: TCP
  selector:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/instance: production
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 1800
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack

---
apiVersion: v1
kind: Service
metadata:
  name: mobile-api-headless-service
  namespace: ainflue-mobile-api
  labels:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/component: headless-service
  annotations:
    description: "Headless service for direct pod communication"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8006
    targetPort: http
    protocol: TCP
  - name: grpc
    port: 9000
    targetPort: grpc
    protocol: TCP
  selector:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/instance: production
  publishNotReadyAddresses: true

---
apiVersion: v1
kind: Service
metadata:
  name: mobile-api-cdn-service
  namespace: ainflue-mobile-api
  labels:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/component: cdn-service
  annotations:
    description: "CDN-optimized service for mobile asset delivery"
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
  - name: https
    port: 443
    targetPort: 8006
    protocol: TCP
  - name: http
    port: 80
    targetPort: 8006
    protocol: TCP
  selector:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/instance: production
  loadBalancerSourceRanges:
  - 0.0.0.0/0

---
apiVersion: v1
kind: Endpoints
metadata:
  name: mobile-api-monitoring
  namespace: ainflue-mobile-api
  labels:
    app.kubernetes.io/name: mobile-api
    app.kubernetes.io/component: monitoring-endpoints
subsets:
- addresses:
  - ip: 10.0.0.1
    targetRef:
      kind: Pod
      name: mobile-api-pod
      namespace: ainflue-mobile-api
  ports:
  - name: metrics
    port: 9090
    protocol: TCP