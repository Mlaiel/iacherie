# IA Influencer Agent - Logging Infrastructure Docker Compose
# Complete logging stack for development and production
# Author: Fahed Mlaiel <mlaiel@live.de>

version: '3.8'

services:
  # Elasticsearch for log storage and search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: ia-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elasticsearch/config:/usr/share/elasticsearch/config
    networks:
      - ia-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: ia-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ia-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Redis for caching and real-time streaming
  redis:
    image: redis:7-alpine
    container_name: ia-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/config:/usr/local/etc/redis
    networks:
      - ia-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Fluentd for log collection and forwarding
  fluentd:
    build:
      context: .
      dockerfile: Dockerfile.fluentd
    container_name: ia-fluentd
    ports:
      - "24224:24224"
      - "24224:24224/udp"
      - "9880:9880"
    volumes:
      - ./fluentd/conf:/fluentd/etc
      - ./logs:/var/log/ia-influencer
      - /var/log:/var/log/host:ro
    environment:
      - FLUENTD_CONF=fluent.conf
      - ENVIRONMENT=production
      - SERVICE_VERSION=1.0.0
      - AWS_REGION=eu-central-1
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ia-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:24220/api/plugins || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # IA Logging Service (Main Application)
  ia-logging-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ia-logging-service
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./logs:/var/log/ia-influencer
      - ./config:/app/config
      - ./data:/app/data
    environment:
      # Core Configuration
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - SERVICE_NAME=ia-logging-service
      - SERVICE_VERSION=1.0.0
      
      # Elasticsearch Configuration
      - ELASTICSEARCH_HOSTS=elasticsearch:9200
      - ELASTICSEARCH_INDEX_STRATEGY=daily
      - ELASTICSEARCH_TIMEOUT=30
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379
      - MONITORING_REDIS_URL=redis://redis:6379
      
      # Fluentd Configuration
      - FLUENTD_HOST=fluentd
      - FLUENTD_PORT=24224
      
      # Monitoring Configuration
      - ALERT_CHECK_INTERVAL=300
      - ANOMALY_DETECTION_ENABLED=true
      
      # AWS Configuration (if using S3)
      - AWS_REGION=eu-central-1
      - LOG_ARCHIVE_S3_BUCKET=ia-influencer-logs-archive
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      fluentd:
        condition: service_healthy
    networks:
      - ia-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8080/health\").raise_for_status()'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:10.0.0
    container_name: ia-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - ia-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ia-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
    networks:
      - ia-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/api/v1/status/config || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Alertmanager for alert handling
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: ia-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - ia-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Nginx for load balancing and SSL termination
  nginx:
    image: nginx:1.25-alpine
    container_name: ia-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - ia-logging-service
      - grafana
      - kibana
    networks:
      - ia-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  ia-logging:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
