# Enterprise Secrets Management with HashiCorp Vault Integration
# Author: Fahed Mlaiel <mlaiel@live.de>
# Production-ready secrets management with automatic rotation and compliance

---
apiVersion: v1
kind: Namespace
metadata:
  name: ainflue-vault
  labels:
    name: ainflue-vault
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: ainflue

---
# Vault Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: ainflue-vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: config
data:
  vault.hcl: |
    ui = true
    
    listener "tcp" {
      tls_disable = 0
      address = "[::]:8200"
      cluster_address = "[::]:8201"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file = "/vault/tls/tls.key"
    }
    
    storage "postgresql" {
      connection_url = "postgres://vault:VAULT_DB_PASSWORD@postgres.ainflue-vault.svc.cluster.local:5432/vault?sslmode=require"
      table = "vault_kv_store"
      max_parallel = "128"
      max_idle_connections = "10"
      max_connection_lifetime = "1h"
    }
    
    cluster_addr = "https://POD_IP:8201"
    api_addr = "https://vault.ainflue-vault.svc.cluster.local:8200"
    
    log_level = "INFO"
    log_format = "json"
    
    # Enable Prometheus metrics
    telemetry {
      prometheus_retention_time = "30s"
      disable_hostname = true
    }
    
    # Seal configuration (auto-unseal with cloud KMS)
    seal "awskms" {
      region = "us-east-1"
      kms_key_id = "VAULT_KMS_KEY_ID"
    }

  vault-init.sh: |
    #!/bin/bash
    set -e
    
    echo "Waiting for Vault to be ready..."
    until curl -f -s https://vault.ainflue-vault.svc.cluster.local:8200/v1/sys/health; do
      sleep 5
    done
    
    echo "Checking if Vault is initialized..."
    if ! vault status | grep -q "Initialized.*true"; then
      echo "Initializing Vault..."
      vault operator init -key-shares=5 -key-threshold=3 -format=json > /vault/data/init-output.json
      
      # Store unseal keys in Kubernetes secrets
      UNSEAL_KEY_1=$(jq -r '.unseal_keys_b64[0]' /vault/data/init-output.json)
      UNSEAL_KEY_2=$(jq -r '.unseal_keys_b64[1]' /vault/data/init-output.json)
      UNSEAL_KEY_3=$(jq -r '.unseal_keys_b64[2]' /vault/data/init-output.json)
      ROOT_TOKEN=$(jq -r '.root_token' /vault/data/init-output.json)
      
      kubectl create secret generic vault-unseal-keys \
        --from-literal=key1="$UNSEAL_KEY_1" \
        --from-literal=key2="$UNSEAL_KEY_2" \
        --from-literal=key3="$UNSEAL_KEY_3" \
        --from-literal=root-token="$ROOT_TOKEN" \
        -n ainflue-vault
    fi

  vault-policies.hcl: |
    # Admin policy for vault administrators
    path "auth/*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }
    
    path "sys/*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }
    
    path "secret/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    
    # Application policy for Ainflue services
    path "secret/data/ainflue/*" {
      capabilities = ["read"]
    }
    
    path "database/creds/ainflue-app" {
      capabilities = ["read"]
    }
    
    path "aws/creds/ainflue-s3" {
      capabilities = ["read"]
    }
    
    # Kubernetes auth policy
    path "auth/kubernetes/role/ainflue-app" {
      capabilities = ["read", "update"]
    }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: ainflue-vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
spec:
  serviceName: vault-internal
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/v1/sys/metrics"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: vault
            topologyKey: kubernetes.io/hostname
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 1000
      volumes:
      - name: config
        configMap:
          name: vault-config
      - name: tls
        secret:
          secretName: vault-tls
      containers:
      - name: vault
        image: hashicorp/vault:1.15.2
        imagePullPolicy: Always
        args:
        - "vault"
        - "server"
        - "-config=/vault/config/vault.hcl"
        ports:
        - containerPort: 8200
          name: http
        - containerPort: 8201
          name: internal
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VAULT_K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VAULT_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VAULT_ADDR
          value: "https://127.0.0.1:8200"
        - name: VAULT_API_ADDR
          value: "https://$(POD_IP):8200"
        - name: SKIP_CHOWN
          value: "true"
        - name: SKIP_SETCAP
          value: "true"
        - name: VAULT_CLUSTER_ADDR
          value: "https://$(POD_IP):8201"
        - name: VAULT_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vault-db-credentials
              key: password
        - name: VAULT_KMS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: vault-kms-credentials
              key: kms_key_id
        volumeMounts:
        - name: data
          mountPath: /vault/data
        - name: config
          mountPath: /vault/config
        - name: tls
          mountPath: /vault/tls
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: "/v1/sys/health?standbyok=true"
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        readinessProbe:
          httpGet:
            path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5 && kill -SIGTERM $(pidof vault)
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: ainflue-vault
  labels:
    app.kubernetes.io/name: vault
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  publishNotReadyAddresses: true
  ports:
  - name: http
    port: 8200
    targetPort: 8200
  - name: internal
    port: 8201
    targetPort: 8201
  selector:
    app.kubernetes.io/name: vault

---
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: ainflue-vault
  labels:
    app.kubernetes.io/name: vault
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: http
    port: 8200
    targetPort: 8200
  - name: internal
    port: 8201
    targetPort: 8201
  selector:
    app.kubernetes.io/name: vault

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: ainflue-vault
  labels:
    app.kubernetes.io/name: vault

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-auth
  labels:
    app.kubernetes.io/name: vault
rules:
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth
  labels:
    app.kubernetes.io/name: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-auth
subjects:
- kind: ServiceAccount
  name: vault
  namespace: ainflue-vault

---
# Vault Secret Injector
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-injector
  namespace: ainflue-vault
  labels:
    app.kubernetes.io/name: vault-injector
    app.kubernetes.io/component: webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-injector
    spec:
      serviceAccountName: vault-injector
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: vault-injector
        image: hashicorp/vault-k8s:1.4.0
        imagePullPolicy: Always
        args:
        - "agent-inject"
        - "-listen=:8080"
        - "-tls-cert-file=/etc/webhook/certs/tls.crt"
        - "-tls-private-key-file=/etc/webhook/certs/tls.key"
        - "-log-level=info"
        - "-log-format=json"
        env:
        - name: AGENT_INJECT_VAULT_ADDR
          value: "https://vault.ainflue-vault.svc.cluster.local:8200"
        - name: AGENT_INJECT_VAULT_AUTH_PATH
          value: "auth/kubernetes"
        - name: AGENT_INJECT_VAULT_IMAGE
          value: "hashicorp/vault:1.15.2"
        - name: AGENT_INJECT_TLS_AUTO
          value: "vault.ainflue-vault.svc"
        - name: AGENT_INJECT_TLS_AUTO_HOSTS
          value: "vault-injector,vault-injector.ainflue-vault,vault-injector.ainflue-vault.svc"
        ports:
        - containerPort: 8080
          name: webhook
        volumeMounts:
        - name: webhook-certs
          mountPath: /etc/webhook/certs
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: webhook-certs
        secret:
          secretName: vault-injector-certs

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-injector
  namespace: ainflue-vault
  labels:
    app.kubernetes.io/name: vault-injector

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-injector
  labels:
    app.kubernetes.io/name: vault-injector
rules:
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: ["get", "list", "watch", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-injector
  labels:
    app.kubernetes.io/name: vault-injector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-injector
subjects:
- kind: ServiceAccount
  name: vault-injector
  namespace: ainflue-vault

---
# Secrets Rotation CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-secrets-rotation
  namespace: ainflue-vault
  labels:
    app.kubernetes.io/name: vault-secrets-rotation
spec:
  schedule: "0 2 * * 0" # Weekly on Sunday at 2 AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-secrets-rotation
        spec:
          restartPolicy: OnFailure
          serviceAccountName: vault-secrets-rotator
          containers:
          - name: secrets-rotator
            image: ghcr.io/mlaiel/ainflue/vault-rotator:latest
            imagePullPolicy: Always
            env:
            - name: VAULT_ADDR
              value: "https://vault.ainflue-vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-token
                  key: token
            command:
            - /bin/bash
            - -c
            - |
              echo "Starting secrets rotation..."
              
              # Rotate database credentials
              vault write -force auth/kubernetes/rotate-root
              
              # Rotate AWS credentials
              vault write -force aws/config/rotate-root
              
              # Update application secrets
              vault kv put secret/ainflue/database \
                password=$(openssl rand -base64 32) \
                rotation_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              
              # Update Redis password
              vault kv put secret/ainflue/redis \
                password=$(openssl rand -base64 32) \
                rotation_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              
              # Update JWT secrets
              vault kv put secret/ainflue/jwt \
                secret=$(openssl rand -base64 64) \
                rotation_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              
              echo "Secrets rotation completed"
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "200m"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-rotator
  namespace: ainflue-vault
  labels:
    app.kubernetes.io/name: vault-secrets-rotator

---
# Network Policy for Vault
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-network-policy
  namespace: ainflue-vault
  labels:
    app.kubernetes.io/name: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ainflue-production
    - namespaceSelector:
        matchLabels:
          name: ainflue-staging
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: vault-injector
    ports:
    - protocol: TCP
      port: 8200
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: vault
    ports:
    - protocol: TCP
      port: 8201
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: ainflue-vault
    ports:
    - protocol: TCP
      port: 5432 # PostgreSQL
  - to: []
    ports:
    - protocol: TCP
      port: 443 # HTTPS for KMS
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53