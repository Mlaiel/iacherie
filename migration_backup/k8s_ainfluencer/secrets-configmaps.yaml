apiVersion: v1
kind: ConfigMap
metadata:
  name: ainflue-config
  namespace: ainflue-production
  labels:
    app: ainflue-platform
    component: config
data:
  # API Configuration
  api.conf: |
    [api]
    host = 0.0.0.0
    port = 8000
    workers = 4
    timeout = 300
    keepalive_timeout = 5
    
    [security]
    rate_limit_enabled = true
    rate_limit_requests = 1000
    rate_limit_window = 3600
    cors_enabled = true
    https_only = true
    
    [features]
    enable_docs = false
    enable_monitoring = true
    enable_websockets = true
    enable_caching = true
    
    [performance]
    max_request_size = 52428800
    connection_pool_size = 20
    request_timeout = 300
    
  # Logging Configuration
  logging.conf: |
    [loggers]
    keys = root, ainflue
    
    [handlers]
    keys = consoleHandler, fileHandler
    
    [formatters]
    keys = standardFormatter
    
    [logger_root]
    level = INFO
    handlers = consoleHandler
    
    [logger_ainflue]
    level = INFO
    handlers = consoleHandler, fileHandler
    qualname = ainflue
    propagate = 0
    
    [handler_consoleHandler]
    class = StreamHandler
    level = INFO
    formatter = standardFormatter
    args = (sys.stdout,)
    
    [handler_fileHandler]
    class = handlers.RotatingFileHandler
    level = INFO
    formatter = standardFormatter
    args = ('/app/logs/ainflue.log', 'a', 10485760, 5)
    
    [formatter_standardFormatter]
    format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
    datefmt = %Y-%m-%d %H:%M:%S
    
  # Monitoring Configuration
  monitoring.conf: |
    # Prometheus metrics configuration
    metrics_enabled: true
    metrics_port: 9090
    metrics_path: /metrics
    
    # Health check configuration
    health_check_enabled: true
    health_check_interval: 30
    
    # Performance monitoring
    performance_monitoring: true
    slow_request_threshold: 5.0
    
  # WebSocket Configuration
  websocket.conf: |
    [websocket]
    port = 8765
    max_connections = 10000
    heartbeat_interval = 30
    
    [authentication]
    auth_required = true
    token_validation = true
    session_timeout = 3600
    
    [features]
    real_time_metrics = true
    notifications = true
    collaboration = true
    
  # Cache Configuration
  cache.conf: |
    [redis]
    connection_pool_size = 10
    socket_timeout = 5
    socket_connect_timeout = 5
    
    [caching]
    default_timeout = 3600
    metrics_timeout = 300
    user_session_timeout = 1800
    
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ainflue-api-service-account
  namespace: ainflue-production
  labels:
    app: ainflue-platform
    component: service-account
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ainflue-analytics-service-account
  namespace: ainflue-production
  labels:
    app: ainflue-platform
    component: service-account
---
# RBAC for service accounts
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ainflue-role
  namespace: ainflue-production
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ainflue-role-binding
  namespace: ainflue-production
subjects:
- kind: ServiceAccount
  name: ainflue-api-service-account
  namespace: ainflue-production
- kind: ServiceAccount
  name: ainflue-analytics-service-account
  namespace: ainflue-production
roleRef:
  kind: Role
  name: ainflue-role
  apiGroup: rbac.authorization.k8s.io
---
# Persistent Volume Claims
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ainflue-logs-pvc
  namespace: ainflue-production
  labels:
    app: ainflue-platform
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ainflue-uploads-pvc
  namespace: ainflue-production
  labels:
    app: ainflue-platform
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ainflue-redis-pvc
  namespace: ainflue-production
  labels:
    app: ainflue-platform
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 10Gi
---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ainflue-api-pdb
  namespace: ainflue-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ainflue-api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ainflue-analytics-pdb
  namespace: ainflue-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ainflue-analytics