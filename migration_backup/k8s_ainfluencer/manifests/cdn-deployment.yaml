apiVersion: v1
kind: ConfigMap
metadata:
  name: cdn-nginx-config
  namespace: ia-influencer
  labels:
    app: cdn-nginx
    tier: frontend
data:
  nginx.conf: |
    # CDN Configuration for IA-Influencer Platform
    # High-Performance Content Delivery with Caching
    # Creator: Fahed Mlaiel <mlaiel@live.de>
    
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log notice;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 2048;
        use epoll;
        multi_accept on;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';
        
        access_log /var/log/nginx/access.log main;
        
        # Performance optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 100M;
        
        # Compression settings
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;
        
        # Brotli compression (if available)
        # brotli on;
        # brotli_comp_level 6;
        # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        
        # Cache configuration
        proxy_cache_path /var/cache/nginx/main
                         levels=1:2
                         keys_zone=main_cache:10m
                         max_size=1g
                         inactive=60m
                         use_temp_path=off;
        
        proxy_cache_path /var/cache/nginx/api
                         levels=1:2
                         keys_zone=api_cache:10m
                         max_size=500m
                         inactive=10m
                         use_temp_path=off;
        
        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=assets:10m rate=50r/s;
        
        # Upstream backend servers
        upstream ia_influencer_backend {
            least_conn;
            server ia-influencer-api-service:8000 max_fails=3 fail_timeout=30s;
            server ia-influencer-api-service:8001 max_fails=3 fail_timeout=30s backup;
            keepalive 32;
        }
        
        # Main server block
        server {
            listen 80;
            server_name cdn.ainflue.com *.ainflue.com;
            
            # Security headers
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            
            # Static assets with long cache
            location /static/ {
                alias /usr/share/nginx/html/static/;
                
                # Cache for 1 year
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Vary "Accept-Encoding";
                
                # Pre-compressed files
                location ~* \.(js|css)$ {
                    gzip_static on;
                    try_files $uri.gz $uri =404;
                }
                
                # CORS for fonts
                location ~* \.(woff|woff2|ttf|otf|eot)$ {
                    add_header Access-Control-Allow-Origin "*";
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }
                
                # Rate limiting for assets
                limit_req zone=assets burst=20 nodelay;
            }
            
            # Images with optimization
            location /images/ {
                alias /usr/share/nginx/html/images/;
                
                # Cache for 30 days
                expires 30d;
                add_header Cache-Control "public";
                add_header Vary "Accept";
                
                # WebP fallback
                location ~* \.(jpg|jpeg|png)$ {
                    try_files $uri$webp_suffix $uri =404;
                }
                
                # Image optimization headers
                add_header X-Image-Optimized "nginx";
            }
            
            # API caching with conditions
            location /api/v1/public/ {
                proxy_pass http://ia_influencer_backend;
                proxy_cache api_cache;
                proxy_cache_valid 200 302 5m;
                proxy_cache_valid 404 1m;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                proxy_cache_bypass $http_cache_control;
                
                # Add cache status header
                add_header X-Cache-Status $upstream_cache_status;
                add_header Vary "Accept-Encoding, Authorization";
                
                # Rate limiting for API
                limit_req zone=api burst=10 nodelay;
                
                # Proxy settings
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Content fingerprinting API - medium cache
            location /api/v1/fingerprint/ {
                proxy_pass http://ia_influencer_backend;
                proxy_cache api_cache;
                proxy_cache_valid 200 1h;
                proxy_cache_valid 404 5m;
                proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";
                
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=3600";
                
                # Proxy settings
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Analytics API - very short cache
            location /api/v1/analytics/ {
                proxy_pass http://ia_influencer_backend;
                proxy_cache api_cache;
                proxy_cache_valid 200 1m;
                proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";
                
                add_header X-Cache-Status $upstream_cache_status;
                add_header Cache-Control "public, max-age=60";
                
                # Proxy settings
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # Default API proxy (no cache)
            location /api/ {
                proxy_pass http://ia_influencer_backend;
                proxy_cache off;
                
                # Rate limiting
                limit_req zone=api burst=20 nodelay;
                
                # Proxy settings
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";
                proxy_http_version 1.1;
            }
            
            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # Cache purge endpoint (restricted)
            location /purge/ {
                allow 10.0.0.0/8;
                allow 172.16.0.0/12;
                allow 192.168.0.0/16;
                deny all;
                
                proxy_cache_purge main_cache "$scheme$request_method$host$1";
            }
            
            # Default location
            location / {
                proxy_pass http://ia_influencer_backend;
                proxy_cache main_cache;
                proxy_cache_valid 200 302 10m;
                proxy_cache_valid 404 1m;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                
                add_header X-Cache-Status $upstream_cache_status;
                
                # Proxy settings
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        
        # SSL server block (if SSL is enabled)
        server {
            listen 443 ssl http2;
            server_name cdn.ainflue.com *.ainflue.com;
            
            # SSL configuration
            ssl_certificate /etc/ssl/certs/ainflue.crt;
            ssl_certificate_key /etc/ssl/private/ainflue.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
            ssl_prefer_server_ciphers off;
            
            # Include all location blocks from the HTTP server
            include /etc/nginx/conf.d/locations.conf;
        }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: cdn-nginx-service
  namespace: ia-influencer
  labels:
    app: cdn-nginx
    tier: frontend
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
  selector:
    app: cdn-nginx

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-nginx
  namespace: ia-influencer
  labels:
    app: cdn-nginx
    tier: frontend
    component: cdn
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cdn-nginx
  template:
    metadata:
      labels:
        app: cdn-nginx
        tier: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cdn-nginx
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: cache-volume
              mountPath: /var/cache/nginx
            - name: static-assets
              mountPath: /usr/share/nginx/html/static
              readOnly: true
            - name: nginx-logs
              mountPath: /var/log/nginx
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15 && nginx -s quit
      volumes:
        - name: nginx-config
          configMap:
            name: cdn-nginx-config
        - name: cache-volume
          emptyDir:
            sizeLimit: 2Gi
        - name: static-assets
          persistentVolumeClaim:
            claimName: static-assets-pvc
        - name: nginx-logs
          emptyDir: {}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-assets-pvc
  namespace: ia-influencer
  labels:
    app: cdn-nginx
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 10Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cdn-nginx-hpa
  namespace: ia-influencer
  labels:
    app: cdn-nginx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cdn-nginx
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cdn-nginx-pdb
  namespace: ia-influencer
  labels:
    app: cdn-nginx
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cdn-nginx

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-exporter-service
  namespace: ia-influencer
  labels:
    app: nginx-exporter
    tier: monitoring
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9113
      targetPort: 9113
      protocol: TCP
  selector:
    app: nginx-exporter

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: ia-influencer
  labels:
    app: nginx-exporter
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
        tier: monitoring
    spec:
      containers:
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:latest
          ports:
            - name: metrics
              containerPort: 9113
              protocol: TCP
          args:
            - -nginx.scrape-uri=http://cdn-nginx-service/nginx_status
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"