# Testing Environment Configuration for Creator Economy Platform

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-testing-config
  namespace: ainflue-redis-test
  labels:
    app: ainflue-redis
    component: testing-config
    environment: testing
    owner: fahed-mlaiel
    version: "4.0.0"
  annotations:
    author: "Fahed Mlaiel <mlaiel@live.de>"
    license: "Proprietary - All Rights Reserved"

data:
  testing_config: |
    # Testing Environment Settings
    environment: "testing"
    debug_mode: true
    verbose_logging: true
    
    # Memory Configuration (Optimized for testing)
    maxmemory: 2gb
    maxmemory-policy: noeviction
    
    # Persistence (Disabled for testing)
    save: ""
    appendonly: false
    
    # Security (Minimal for testing)
    protected-mode: false
    requirepass: "test_password_2025"
    
    # Testing-specific features
    testing_features:
      automated_testing: true
      unit_test_support: true
      integration_test_support: true
      performance_benchmarking: true
      data_isolation: true
      
    # Creator Testing Features
    creator_testing_features:
      mock_data_generation: true
      test_scenarios: true
      performance_profiling: true
      load_simulation: true
---