# =============================================================================
# REDIS CLUSTER CONFIGURATION FOR AINFLUE PLATFORM
# =============================================================================
# Production-ready Redis cluster configuration with high availability,
# performance optimization, and security features.
#
# Author: Fahed Mlaiel (mlaiel@live.de)
# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.
# =============================================================================

# Network configuration
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General configuration
daemonize no
supervised no
pidfile /data/redis.pid
loglevel notice
logfile /data/redis.log
databases 16

# Cluster configuration
cluster-enabled yes
cluster-config-file /data/nodes.conf
cluster-node-timeout 15000
cluster-announce-ip ${REDIS_ANNOUNCE_IP}
cluster-announce-port 6379
cluster-announce-bus-port 16379
cluster-require-full-coverage yes

# Security
# Authentication (set via environment variable)
# requirepass ${REDIS_PASSWORD}
# masterauth ${REDIS_PASSWORD}

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command DEBUG ""
rename-command CONFIG CONFIG_${REDIS_CONFIG_SECRET}
rename-command SHUTDOWN SHUTDOWN_${REDIS_CONFIG_SECRET}

# Protected mode (disabled for cluster)
protected-mode no

# Memory management
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence - Optimized for IA Influencer Platform
# RDB persistence for backup
save 900 1     # Save if at least 1 key changed in 900 seconds
save 300 10    # Save if at least 10 keys changed in 300 seconds  
save 60 10000  # Save if at least 10000 keys changed in 60 seconds

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF persistence for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client management
maxclients 10000

# Advanced memory optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Threaded I/O (Redis 6.0+)
io-threads 4
io-threads-do-reads yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Replication and high availability
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
replica-priority 100

# Security enhancements
# TLS/SSL configuration (if enabled)
# tls-port 6380
# tls-cert-file /data/certs/redis.crt
# tls-key-file /data/certs/redis.key
# tls-ca-cert-file /data/certs/ca.crt
# tls-protocols "TLSv1.2 TLSv1.3"

# Notification configuration for IA Influencer Platform
notify-keyspace-events "Ex"  # Expired events for session management

# Latency monitoring
latency-monitor-threshold 100

# Module loading (if using Redis modules)
# loadmodule /usr/lib/redis/modules/redisearch.so
# loadmodule /usr/lib/redis/modules/redisgraph.so
# loadmodule /usr/lib/redis/modules/redistimeseries.so

# Platform-specific configurations for IA Influencer
# Session timeout (handled by application)
# Default TTL for cached data: 1 hour
# User session TTL: 8 hours
# Content cache TTL: 24 hours
# Analytics cache TTL: 1 hour

# Memory usage optimization for IA Influencer workloads
# Optimize for mixed workload: sessions, cache, real-time data
activerehashing yes
aof-rewrite-incremental-fsync yes

# Jemalloc configuration
# jemalloc-bg-thread yes

# Debugging and monitoring
always-show-logo yes

# =============================================================================
# CLUSTER SPECIFIC SETTINGS
# =============================================================================

# Cluster failover configuration
cluster-replica-validity-factor 10
cluster-migration-barrier 1
cluster-allow-reads-when-down no

# Cluster performance tuning
cluster-slave-no-failover no
cluster-announce-hostname ""

# =============================================================================
# AINFLUE PLATFORM OPTIMIZATION
# =============================================================================

# Optimized for:
# - User sessions and authentication tokens
# - Content metadata caching
# - Real-time analytics data
# - Collaboration state management
# - AI processing job queues
# - Rate limiting counters
# - Notification queues

# Key patterns used by IA Influencer Platform:
# - session:${user_id}:${session_id}
# - user:${user_id}:cache
# - content:${content_id}:metadata
# - analytics:${metric}:${period}:${timestamp}
# - collaboration:${project_id}:state
# - queue:ai:${job_type}
# - ratelimit:${user_id}:${endpoint}
# - notifications:${user_id}

# =============================================================================
# MONITORING AND ALERTING
# =============================================================================

# Enable Redis monitoring
# info commandstats
# info memory
# info replication
# info cluster

# Key metrics to monitor:
# - Memory usage percentage
# - Hit/miss ratios
# - Connected clients
# - Commands per second
# - Replication lag
# - Cluster health

# =============================================================================
# BACKUP AND RECOVERY
# =============================================================================

# Automated backup strategy:
# 1. RDB snapshots every 15 minutes during business hours
# 2. AOF for point-in-time recovery
# 3. Daily full backups to S3/Azure Blob
# 4. Cross-region replication for disaster recovery

# =============================================================================
# PERFORMANCE TUNING NOTES
# =============================================================================

# CPU optimization:
# - Use io-threads for better multi-core utilization
# - Set appropriate number of threads based on CPU cores

# Memory optimization:
# - Monitor fragmentation ratio
# - Use appropriate data structures
# - Set memory limits and eviction policies

# Network optimization:
# - Use TCP keep-alive
# - Optimize buffer sizes
# - Monitor connection pooling

# =============================================================================
# END OF CONFIGURATION
