# Storage Classes for different performance tiers
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ainflue-ssd-fast
  labels:
    app: ainflue-platform
    component: storage
    tier: fast
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ainflue-ssd-standard
  labels:
    app: ainflue-platform
    component: storage
    tier: standard
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  iops: "1000"
  throughput: "50"
  encrypted: "true"
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ainflue-content-storage
  labels:
    app: ainflue-platform
    component: storage
    tier: content
provisioner: kubernetes.io/aws-ebs
parameters:
  type: st1
  encrypted: "true"
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer

---
# Database Persistent Volume Claims
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: ainflue-platform
  labels:
    app: postgres
    component: database
    tier: primary
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ainflue-ssd-fast
  resources:
    requests:
      storage: 100Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: ainflue-platform
  labels:
    app: postgres
    component: backup
    tier: secondary
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ainflue-ssd-standard
  resources:
    requests:
      storage: 200Gi

