apiVersion: v1
kind: ConfigMap
metadata:
  name: iacherie-config
  namespace: iacherie-platform
  labels:
    app: iacherie-platform
    component: configuration
    version: v1.0.0
data:
  environment: "production"
  log-level: "INFO"
  debug: "false"
  
  # Database Configuration
  database-host: "iacherie-postgres.iacherie-db.svc.cluster.local"
  database-port: "5432"
  database-name: "ainflue_production"
  database-pool-size: "20"
  database-max-overflow: "30"
  
  # Redis Configuration
  redis-host: "iacherie-redis.iacherie-cache.svc.cluster.local"
  redis-port: "6379"
  redis-db: "0"
  
  # Application Configuration
  app-name: "IA Chérie Platform"
  app-version: "v1.0.0"
  api-version: "v1"
  max-upload-size: "500MB"
  allowed-file-types: "jpg,jpeg,png,gif,mp4,mov,avi,mp3,wav,flac,pdf,doc,docx"
  
  # Security Configuration
  cors-origins: "https://iacherie.com,https://app.iacherie.com,https://admin.iacherie.com"
  session-timeout: "3600"
  max-login-attempts: "5"
  password-min-length: "8"
  
  # AI/ML Configuration
  ai-processing-timeout: "300"
  ml-model-cache-size: "1000"
  gpu-enabled: "true"
  ai-batch-size: "32"
  
  # Content Processing
  image-processing-quality: "90"
  video-processing-preset: "fast"
  audio-processing-bitrate: "320"
  thumbnail-size: "300x300"
  
  # Storage Configuration
  content-storage-bucket: "iacherie-content-production"
  backup-storage-bucket: "iacherie-backup-production"
  cdn-endpoint: "https://cdn.iacherie.com"
  
  # Monitoring Configuration
  metrics-enabled: "true"
  tracing-enabled: "true"
  logging-format: "json"
  prometheus-metrics-path: "/metrics"
  
  # Feature Flags
  feature-ai-enhancement: "true"
  feature-collaborative-editing: "true"
  feature-advanced-analytics: "true"
  feature-blockchain-integration: "false"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iacherie-worker-config
  namespace: iacherie-platform
  labels:
    app: iacherie-worker
    component: worker-configuration
    version: v1.0.0
data:
  # Worker Configuration
  worker-concurrency: "4"
  worker-max-tasks-per-child: "1000"
  worker-prefetch-multiplier: "1"
  worker-timeout: "300"
  
  # Celery Configuration
  celery-broker-pool-limit: "10"
  celery-result-expires: "3600"
  celery-task-routes: |
    {
      "iacherie.tasks.ai_processing": {"queue": "ai_processing"},
      "iacherie.tasks.content_upload": {"queue": "content_upload"},
      "iacherie.tasks.image_processing": {"queue": "image_processing"},
      "iacherie.tasks.video_processing": {"queue": "video_processing"},
      "iacherie.tasks.audio_processing": {"queue": "audio_processing"},
      "iacherie.tasks.analytics": {"queue": "analytics"},
      "iacherie.tasks.notifications": {"queue": "notifications"},
      "iacherie.tasks.backup": {"queue": "backup"}
    }
  
  # Queue Configuration
  queue-ai-processing-priority: "9"
  queue-content-upload-priority: "7"
  queue-media-processing-priority: "6"
  queue-analytics-priority: "4"
  queue-notifications-priority: "3"
  queue-backup-priority: "1"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iacherie-nginx-config
  namespace: iacherie-platform
  labels:
    app: iacherie-nginx
    component: proxy-configuration
    version: v1.0.0
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        
        access_log /var/log/nginx/access.log main;
        
        # Performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 500M;
        
        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        
        # Gzip Compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
        
        # Rate Limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;
        
        # Upstream Configuration
        upstream ainflue_api {
            least_conn;
            server iacherie-api-service:8000 max_fails=3 fail_timeout=30s;
        }
        
        upstream ainflue_ai_engine {
            least_conn;
            server iacherie-ai-service:8001 max_fails=3 fail_timeout=30s;
        }
        
        # Main Server Block
        server {
            listen 80;
            server_name _;
            return 301 https://$host$request_uri;
        }
        
        server {
            listen 443 ssl http2;
            server_name api.iacherie.com;
            
            # SSL Configuration
            ssl_certificate /etc/ssl/certs/iacherie.crt;
            ssl_certificate_key /etc/ssl/private/iacherie.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
            ssl_prefer_server_ciphers off;
            
            # API Routes
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                proxy_pass http://ainflue_api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }
            
            # AI Processing Routes
            location /ai/ {
                limit_req zone=api burst=10 nodelay;
                proxy_pass http://ainflue_ai_engine;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 300s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
            }
            
            # Upload Routes
            location /upload/ {
                limit_req zone=upload burst=5 nodelay;
                proxy_pass http://ainflue_api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                client_max_body_size 500M;
                proxy_connect_timeout 300s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
            }
            
            # Health Check
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iacherie-monitoring-config
  namespace: iacherie-platform
  labels:
    app: iacherie-monitoring
    component: monitoring-configuration
    version: v1.0.0
data:
  # Prometheus Configuration
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
    - job_name: 'iacherie-api'
      static_configs:
      - targets: ['iacherie-api-service:8000']
      metrics_path: '/metrics'
      scrape_interval: 30s
    
    - job_name: 'iacherie-worker'
      static_configs:
      - targets: ['iacherie-worker-service:9090']
      metrics_path: '/metrics'
      scrape_interval: 30s
    
    - job_name: 'nginx'
      static_configs:
      - targets: ['iacherie-nginx-service:9113']
      metrics_path: '/metrics'
      scrape_interval: 30s
  
  # Grafana Dashboard Configuration
  grafana-dashboard.json: |
    {
      "dashboard": {
        "title": "IA Chérie Platform Monitoring",
        "panels": [
          {
            "title": "API Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "95th percentile"
              }
            ]
          }
        ]
      }
    }