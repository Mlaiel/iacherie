apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iacherie-nginx-ingress
  namespace: iacherie
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; child-src 'none'; worker-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';";
spec:
  tls:
  - hosts:
    - api.iacherie.com
    - mobile.iacherie.com
    - ai.iacherie.com
    - app.iacherie.com
    secretName: iacherie-tls-secret
  rules:
  - host: api.iacherie.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iacherie-api-service
            port:
              number: 80
  - host: mobile.iacherie.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iacherie-mobile-api-service
            port:
              number: 80
  - host: ai.iacherie.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iacherie-ai-engine-service
            port:
              number: 80
  - host: app.iacherie.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: iacherie-api-service
            port:
              number: 80
      - path: /ai
        pathType: Prefix
        backend:
          service:
            name: iacherie-ai-engine-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iacherie-frontend-service
            port:
              number: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress-controller-metrics
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
spec:
  ports:
  - name: metrics
    port: 10254
    targetPort: 10254
    protocol: TCP
  selector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iacherie-network-policy
  namespace: iacherie
spec:
  podSelector:
    matchLabels:
      app: iacherie
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: iacherie
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: UDP
      port: 53

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: mlaiel@live.de
    privateKeySecretRef:
      name: letsencrypt-prod-private-key
    solvers:
    - http01:
        ingress:
          class: nginx

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: mlaiel@live.de
    privateKeySecretRef:
      name: letsencrypt-staging-private-key
    solvers:
    - http01:
        ingress:
          class: nginx