apiVersion: v1
kind: Secret
metadata:
  name: ainflue-secrets
  namespace: ainflue-platform
  labels:
    app: ainflue-platform
    component: secrets
    version: v1.0.0
type: Opaque
stringData:
  # Database Secrets
  database-url: "postgresql://ainflue_user:REPLACE_WITH_SECURE_PASSWORD@ainflue-postgres.ainflue-db.svc.cluster.local:5432/ainflue_production"
  database-password: "REPLACE_WITH_SECURE_DATABASE_PASSWORD"
  
  # Redis Secrets
  redis-url: "redis://:REPLACE_WITH_REDIS_PASSWORD@ainflue-redis.ainflue-cache.svc.cluster.local:6379/0"
  redis-password: "REPLACE_WITH_SECURE_REDIS_PASSWORD"
  
  # Celery Secrets
  celery-broker-url: "redis://:REPLACE_WITH_REDIS_PASSWORD@ainflue-redis.ainflue-cache.svc.cluster.local:6379/1"
  celery-result-backend: "redis://:REPLACE_WITH_REDIS_PASSWORD@ainflue-redis.ainflue-cache.svc.cluster.local:6379/2"
  
  # JWT Secrets
  jwt-secret: "REPLACE_WITH_SECURE_JWT_SECRET_KEY"
  jwt-refresh-secret: "REPLACE_WITH_SECURE_JWT_REFRESH_SECRET"
  
  # Encryption Secrets
  encryption-key: "REPLACE_WITH_32_BYTE_ENCRYPTION_KEY"
  app-secret-key: "REPLACE_WITH_SECURE_APP_SECRET_KEY"
  
  # OAuth Secrets
  google-client-id: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  google-client-secret: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
  facebook-app-id: "REPLACE_WITH_FACEBOOK_APP_ID"
  facebook-app-secret: "REPLACE_WITH_FACEBOOK_APP_SECRET"
  github-client-id: "REPLACE_WITH_GITHUB_CLIENT_ID"
  github-client-secret: "REPLACE_WITH_GITHUB_CLIENT_SECRET"
  
  # Email Service Secrets
  smtp-password: "REPLACE_WITH_SMTP_PASSWORD"
  sendgrid-api-key: "REPLACE_WITH_SENDGRID_API_KEY"
  
  # Payment Secrets
  stripe-secret-key: "REPLACE_WITH_STRIPE_SECRET_KEY"
  stripe-webhook-secret: "REPLACE_WITH_STRIPE_WEBHOOK_SECRET"
  paypal-client-secret: "REPLACE_WITH_PAYPAL_CLIENT_SECRET"
  
  # AI/ML API Secrets
  openai-api-key: "REPLACE_WITH_OPENAI_API_KEY"
  anthropic-api-key: "REPLACE_WITH_ANTHROPIC_API_KEY"
  hugging-face-token: "REPLACE_WITH_HUGGING_FACE_TOKEN"
  
  # Analytics Secrets
  google-analytics-key: "REPLACE_WITH_GOOGLE_ANALYTICS_KEY"
  mixpanel-token: "REPLACE_WITH_MIXPANEL_TOKEN"

---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  namespace: ainflue-platform
  labels:
    app: ainflue-platform
    component: cloud-credentials
    version: v1.0.0
type: Opaque
stringData:
  # AWS Credentials
  aws-access-key-id: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  aws-secret-access-key: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
  aws-region: "us-east-1"
  
  # Google Cloud Credentials
  gcp-service-account-key: |
    {
      "type": "service_account",
      "project_id": "REPLACE_WITH_GCP_PROJECT_ID",
      "private_key_id": "REPLACE_WITH_PRIVATE_KEY_ID",
      "private_key": "REPLACE_WITH_PRIVATE_KEY",
      "client_email": "REPLACE_WITH_SERVICE_ACCOUNT_EMAIL",
      "client_id": "REPLACE_WITH_CLIENT_ID",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token"
    }
  
  # Azure Credentials
  azure-tenant-id: "REPLACE_WITH_AZURE_TENANT_ID"
  azure-client-id: "REPLACE_WITH_AZURE_CLIENT_ID"
  azure-client-secret: "REPLACE_WITH_AZURE_CLIENT_SECRET"
  azure-subscription-id: "REPLACE_WITH_AZURE_SUBSCRIPTION_ID"

---
apiVersion: v1
kind: Secret
metadata:
  name: ainflue-ssl-certs
  namespace: ainflue-platform
  labels:
    app: ainflue-platform
    component: ssl-certificates
    version: v1.0.0
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    # REPLACE_WITH_SSL_CERTIFICATE
    # This should be your actual SSL certificate
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    # REPLACE_WITH_SSL_PRIVATE_KEY
    # This should be your actual SSL private key
    -----END PRIVATE KEY-----

---
apiVersion: v1
kind: Secret
metadata:
  name: ainflue-registry-secret
  namespace: ainflue-platform
  labels:
    app: ainflue-platform
    component: registry-credentials
    version: v1.0.0
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.ainflue.com": {
          "username": "REPLACE_WITH_REGISTRY_USERNAME",
          "password": "REPLACE_WITH_REGISTRY_PASSWORD",
          "email": "registry@ainflue.com",
          "auth": "REPLACE_WITH_BASE64_ENCODED_USERNAME_PASSWORD"
        },
        "ghcr.io": {
          "username": "REPLACE_WITH_GITHUB_USERNAME",
          "password": "REPLACE_WITH_GITHUB_TOKEN",
          "email": "github@ainflue.com",
          "auth": "REPLACE_WITH_BASE64_ENCODED_GITHUB_CREDENTIALS"
        }
      }
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: ainflue-monitoring-secrets
  namespace: ainflue-platform
  labels:
    app: ainflue-monitoring
    component: monitoring-secrets
    version: v1.0.0
type: Opaque
stringData:
  # Grafana Admin Credentials
  grafana-admin-password: "REPLACE_WITH_SECURE_GRAFANA_PASSWORD"
  
  # Prometheus External Labels
  prometheus-external-labels: |
    cluster: ainflue-production
    environment: production
    region: us-east-1
  
  # AlertManager Configuration
  alertmanager-config: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@ainflue.com'
    
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
    
    receivers:
    - name: 'web.hook'
      webhook_configs:
      - url: 'http://ainflue-alerting-service:9093/webhook'
        send_resolved: true

---
apiVersion: v1
kind: Secret
metadata:
  name: ainflue-backup-credentials
  namespace: ainflue-platform
  labels:
    app: ainflue-backup
    component: backup-credentials
    version: v1.0.0
type: Opaque
stringData:
  # Backup Storage Credentials
  backup-s3-access-key: "REPLACE_WITH_BACKUP_S3_ACCESS_KEY"
  backup-s3-secret-key: "REPLACE_WITH_BACKUP_S3_SECRET_KEY"
  backup-s3-bucket: "ainflue-backup-production"
  backup-s3-region: "us-east-1"
  
  # Encryption Keys for Backup
  backup-encryption-key: "REPLACE_WITH_32_BYTE_BACKUP_ENCRYPTION_KEY"
  backup-signing-key: "REPLACE_WITH_BACKUP_SIGNING_KEY"
  
  # Database Backup Credentials
  postgres-backup-user: "backup_user"
  postgres-backup-password: "REPLACE_WITH_POSTGRES_BACKUP_PASSWORD"