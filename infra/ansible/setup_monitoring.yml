---
- name: "Ainflue Enterprise Monitoring Stack Deployment"
  hosts: monitoring_servers
  become: yes
  gather_facts: yes
  vars:
    monitoring_namespace: "monitoring"
    prometheus_version: "v2.40.7"
    grafana_version: "9.3.2"
    jaeger_version: "1.42.0"
    elasticsearch_version: "8.6.0"
    fluentd_version: "v1.16"
    alertmanager_version: "v0.25.0"
    
    # Enterprise monitoring configuration
    monitoring_config:
      retention_period: "30d"
      scrape_interval: "15s"
      evaluation_interval: "15s"
      high_availability: true
      cluster_mode: true
      
    # Security configuration
    security_config:
      tls_enabled: true
      authentication: "oauth2"
      authorization: "rbac"
      encryption_at_rest: true
      
    # Performance tuning
    performance_config:
      prometheus_storage: "100Gi"
      grafana_storage: "50Gi"
      elasticsearch_storage: "200Gi"
      memory_limits:
        prometheus: "8Gi"
        grafana: "4Gi"
        elasticsearch: "16Gi"
        jaeger: "4Gi"

  pre_tasks:
    - name: "Validate monitoring requirements"
      assert:
        that:
          - ansible_memtotal_mb >= 16384
          - ansible_processor_vcpus >= 4
        fail_msg: "Insufficient resources for monitoring stack"
        success_msg: "Resource requirements validated"

    - name: "Check Kubernetes cluster connectivity"
      shell: kubectl cluster-info
      register: cluster_status
      failed_when: cluster_status.rc != 0

  tasks:
    # ==========================================
    # PHASE 1: INFRASTRUCTURE PREPARATION
    # ==========================================
    
    - name: "Create monitoring namespace"
      kubernetes.core.k8s:
        name: "{{ monitoring_namespace }}"
        api_version: v1
        kind: Namespace
        state: present
        definition:
          metadata:
            labels:
              name: "{{ monitoring_namespace }}"
              purpose: "enterprise-monitoring"
              managed-by: "ainflue-infrastructure"
      tags: ["namespace", "preparation"]

    - name: "Create monitoring storage class"
      kubernetes.core.k8s:
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: monitoring-ssd
            namespace: "{{ monitoring_namespace }}"
          provisioner: kubernetes.io/aws-ebs
          parameters:
            type: gp3
            fsType: ext4
            encrypted: "true"
          allowVolumeExpansion: true
          reclaimPolicy: Retain
      tags: ["storage", "preparation"]

    # ==========================================
    # PHASE 2: PROMETHEUS DEPLOYMENT
    # ==========================================
    
    - name: "Deploy Prometheus operator"
      kubernetes.core.k8s:
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: prometheus-operator
            namespace: "{{ monitoring_namespace }}"
            labels:
              app: prometheus-operator
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: prometheus-operator
            template:
              metadata:
                labels:
                  app: prometheus-operator
              spec:
                serviceAccountName: prometheus-operator
                containers:
                - name: prometheus-operator
                  image: "quay.io/prometheus-operator/prometheus-operator:{{ prometheus_version }}"
                  args:
                    - --kubelet-service=kube-system/kubelet
                    - --logtostderr=true
                    - --config-reloader-image=quay.io/prometheus-operator/prometheus-config-reloader:{{ prometheus_version }}
                    - --prometheus-config-reloader=quay.io/prometheus-operator/prometheus-config-reloader:{{ prometheus_version }}
                  resources:
                    limits:
                      cpu: 500m
                      memory: 512Mi
                    requests:
                      cpu: 100m
                      memory: 128Mi
      tags: ["prometheus", "operator"]

    - name: "Configure Prometheus cluster"
      kubernetes.core.k8s:
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: Prometheus
          metadata:
            name: prometheus-cluster
            namespace: "{{ monitoring_namespace }}"
          spec:
            replicas: 3
            retention: "{{ monitoring_config.retention_period }}"
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: monitoring-ssd
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: "{{ performance_config.prometheus_storage }}"
            serviceAccountName: prometheus
            serviceMonitorSelector:
              matchLabels:
                prometheus: cluster
            ruleSelector:
              matchLabels:
                prometheus: cluster
            resources:
              limits:
                memory: "{{ performance_config.memory_limits.prometheus }}"
                cpu: "4"
              requests:
                memory: "4Gi"
                cpu: "2"
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              fsGroup: 65534
      tags: ["prometheus", "cluster"]

    # ==========================================
    # PHASE 3: GRAFANA DEPLOYMENT
    # ==========================================
    
    - name: "Deploy Grafana with enterprise features"
      kubernetes.core.k8s:
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: grafana
            namespace: "{{ monitoring_namespace }}"
            labels:
              app: grafana
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: grafana
            template:
              metadata:
                labels:
                  app: grafana
              spec:
                serviceAccountName: grafana
                containers:
                - name: grafana
                  image: "grafana/grafana:{{ grafana_version }}"
                  env:
                  - name: GF_SECURITY_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: grafana-secret
                        key: admin-password
                  - name: GF_DATABASE_TYPE
                    value: postgres
                  - name: GF_DATABASE_HOST
                    value: "{{ grafana_db_host | default('postgresql.monitoring.svc.cluster.local:5432') }}"
                  - name: GF_DATABASE_NAME
                    value: grafana
                  - name: GF_DATABASE_USER
                    valueFrom:
                      secretKeyRef:
                        name: grafana-secret
                        key: db-user
                  - name: GF_DATABASE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: grafana-secret
                        key: db-password
                  - name: GF_AUTH_OAUTH_AUTO_LOGIN
                    value: "true"
                  - name: GF_SECURITY_COOKIE_SECURE
                    value: "true"
                  - name: GF_SECURITY_STRICT_TRANSPORT_SECURITY
                    value: "true"
                  ports:
                  - containerPort: 3000
                    name: http
                  volumeMounts:
                  - name: grafana-storage
                    mountPath: /var/lib/grafana
                  - name: grafana-config
                    mountPath: /etc/grafana
                  resources:
                    limits:
                      memory: "{{ performance_config.memory_limits.grafana }}"
                      cpu: "2"
                    requests:
                      memory: "2Gi"
                      cpu: "500m"
                volumes:
                - name: grafana-storage
                  persistentVolumeClaim:
                    claimName: grafana-pvc
                - name: grafana-config
                  configMap:
                    name: grafana-config
      tags: ["grafana", "deployment"]

    # ==========================================
    # PHASE 4: JAEGER TRACING DEPLOYMENT
    # ==========================================
    
    - name: "Deploy Jaeger distributed tracing"
      kubernetes.core.k8s:
        definition:
          apiVersion: jaegertracing.io/v1
          kind: Jaeger
          metadata:
            name: jaeger-cluster
            namespace: "{{ monitoring_namespace }}"
          spec:
            strategy: production
            storage:
              type: elasticsearch
              elasticsearch:
                nodeCount: 3
                storage:
                  storageClassName: monitoring-ssd
                  size: "{{ performance_config.elasticsearch_storage }}"
                resources:
                  limits:
                    memory: "{{ performance_config.memory_limits.elasticsearch }}"
                    cpu: "4"
                  requests:
                    memory: "8Gi"
                    cpu: "2"
            collector:
              replicas: 3
              resources:
                limits:
                  memory: "2Gi"
                  cpu: "1"
                requests:
                  memory: "1Gi"
                  cpu: "500m"
            query:
              replicas: 2
              resources:
                limits:
                  memory: "{{ performance_config.memory_limits.jaeger }}"
                  cpu: "2"
                requests:
                  memory: "2Gi"
                  cpu: "1"
      tags: ["jaeger", "tracing"]

    # ==========================================
    # PHASE 5: ALERTMANAGER DEPLOYMENT
    # ==========================================
    
    - name: "Deploy AlertManager cluster"
      kubernetes.core.k8s:
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: Alertmanager
          metadata:
            name: alertmanager-cluster
            namespace: "{{ monitoring_namespace }}"
          spec:
            replicas: 3
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: monitoring-ssd
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi
            configSecret: alertmanager-config
            resources:
              limits:
                memory: 2Gi
                cpu: 1
              requests:
                memory: 1Gi
                cpu: 500m
      tags: ["alertmanager", "alerts"]

    # ==========================================
    # PHASE 6: LOGGING INFRASTRUCTURE
    # ==========================================
    
    - name: "Deploy Fluentd for log aggregation"
      kubernetes.core.k8s:
        definition:
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: fluentd
            namespace: "{{ monitoring_namespace }}"
            labels:
              app: fluentd
          spec:
            selector:
              matchLabels:
                app: fluentd
            template:
              metadata:
                labels:
                  app: fluentd
              spec:
                serviceAccountName: fluentd
                tolerations:
                - key: node-role.kubernetes.io/master
                  effect: NoSchedule
                containers:
                - name: fluentd
                  image: "fluent/fluentd-kubernetes-daemonset:{{ fluentd_version }}-debian-elasticsearch7-1.0"
                  env:
                  - name: FLUENT_ELASTICSEARCH_HOST
                    value: "elasticsearch.monitoring.svc.cluster.local"
                  - name: FLUENT_ELASTICSEARCH_PORT
                    value: "9200"
                  - name: FLUENT_ELASTICSEARCH_SCHEME
                    value: "https"
                  - name: FLUENT_UID
                    value: "0"
                  resources:
                    limits:
                      memory: 1Gi
                      cpu: 500m
                    requests:
                      memory: 512Mi
                      cpu: 100m
                  volumeMounts:
                  - name: varlog
                    mountPath: /var/log
                  - name: varlibdockercontainers
                    mountPath: /var/lib/docker/containers
                    readOnly: true
                volumes:
                - name: varlog
                  hostPath:
                    path: /var/log
                - name: varlibdockercontainers
                  hostPath:
                    path: /var/lib/docker/containers
      tags: ["logging", "fluentd"]

    # ==========================================
    # PHASE 7: MONITORING CONFIGURATION
    # ==========================================
    
    - name: "Configure ServiceMonitors for Ainflue services"
      kubernetes.core.k8s:
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: ServiceMonitor
          metadata:
            name: "ainflue-{{ item.name }}-monitor"
            namespace: "{{ monitoring_namespace }}"
            labels:
              prometheus: cluster
          spec:
            selector:
              matchLabels:
                app: "{{ item.name }}"
                monitoring: enabled
            endpoints:
            - port: metrics
              interval: 15s
              path: /metrics
      loop:
        - { name: "api-gateway", port: "8080" }
        - { name: "ai-engine", port: "8081" }
        - { name: "content-processor", port: "8082" }
        - { name: "user-service", port: "8083" }
        - { name: "payment-service", port: "8084" }
      tags: ["monitoring", "servicemonitors"]

    - name: "Configure Grafana dashboards"
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "ainflue-{{ item }}-dashboard"
            namespace: "{{ monitoring_namespace }}"
            labels:
              grafana_dashboard: "true"
          data:
            dashboard.json: "{{ lookup('file', 'dashboards/' + item + '.json') }}"
      loop:
        - "ainflue-overview"
        - "ai-processing-metrics"
        - "content-pipeline-metrics"
        - "user-engagement-metrics"
        - "infrastructure-health"
      tags: ["grafana", "dashboards"]

    # ==========================================
    # PHASE 8: ALERTING RULES
    # ==========================================
    
    - name: "Configure Prometheus alerting rules"
      kubernetes.core.k8s:
        definition:
          apiVersion: monitoring.coreos.com/v1
          kind: PrometheusRule
          metadata:
            name: ainflue-alerting-rules
            namespace: "{{ monitoring_namespace }}"
            labels:
              prometheus: cluster
          spec:
            groups:
            - name: ainflue.critical
              interval: 15s
              rules:
              - alert: AinflueCriticalServiceDown
                expr: up{job=~"ainflue-.*"} == 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "Ainflue critical service is down"
                  description: "Service {{ $labels.job }} has been down for more than 1 minute"
              
              - alert: AinflueDatabaseConnectionFailure
                expr: ainflue_database_connection_errors_total > 10
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "High database connection errors"
                  description: "Database connection errors exceed threshold"
              
              - alert: AinfluePodCrashLooping
                expr: rate(kube_pod_container_status_restarts_total[5m]) > 0.1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Pod is crash looping"
                  description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash looping"
              
              - alert: AinflueDiskSpaceRunningOut
                expr: (node_filesystem_free_bytes / node_filesystem_size_bytes) * 100 < 10
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Disk space running out"
                  description: "Disk space is below 10% on {{ $labels.instance }}"
      tags: ["alerting", "rules"]

    # ==========================================
    # PHASE 9: SECURITY HARDENING
    # ==========================================
    
    - name: "Create monitoring RBAC"
      kubernetes.core.k8s:
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: monitoring-reader
          rules:
          - apiGroups: [""]
            resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods", "ingresses"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["extensions"]
            resources: ["ingresses"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["apps"]
            resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["monitoring.coreos.com"]
            resources: ["servicemonitors", "prometheusrules"]
            verbs: ["get", "list", "watch"]
      tags: ["security", "rbac"]

    - name: "Configure network policies for monitoring"
      kubernetes.core.k8s:
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: monitoring-network-policy
            namespace: "{{ monitoring_namespace }}"
          spec:
            podSelector: {}
            policyTypes:
            - Ingress
            - Egress
            ingress:
            - from:
              - namespaceSelector:
                  matchLabels:
                    name: "{{ monitoring_namespace }}"
              - namespaceSelector:
                  matchLabels:
                    monitoring-access: "allowed"
            egress:
            - to: []
              ports:
              - protocol: TCP
                port: 53
              - protocol: UDP
                port: 53
            - to:
              - namespaceSelector: {}
      tags: ["security", "network-policy"]

  post_tasks:
    - name: "Verify monitoring stack deployment"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ monitoring_namespace }}"
        name: "{{ item }}"
      register: deployment_status
      failed_when: deployment_status.resources[0].status.readyReplicas != deployment_status.resources[0].spec.replicas
      loop:
        - prometheus-operator
        - grafana
      tags: ["verification"]

    - name: "Display monitoring endpoints"
      debug:
        msg:
          - "Prometheus UI: https://prometheus.{{ ansible_default_ipv4.address }}.nip.io"
          - "Grafana UI: https://grafana.{{ ansible_default_ipv4.address }}.nip.io"
          - "Jaeger UI: https://jaeger.{{ ansible_default_ipv4.address }}.nip.io"
          - "AlertManager UI: https://alertmanager.{{ ansible_default_ipv4.address }}.nip.io"
      tags: ["endpoints"]

  handlers:
    - name: restart monitoring services
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ monitoring_namespace }}"
        name: "{{ item }}"
      loop:
        - prometheus-operator
        - grafana
      listen: "restart monitoring"

# Enterprise monitoring validation tasks
- name: "Monitoring Stack Validation"
  hosts: monitoring_servers
  tasks:
    - name: "Run monitoring health checks"
      uri:
        url: "{{ item.url }}"
        method: GET
        validate_certs: no
        status_code: 200
      loop:
        - { name: "Prometheus", url: "http://prometheus.monitoring.svc.cluster.local:9090/-/healthy" }
        - { name: "Grafana", url: "http://grafana.monitoring.svc.cluster.local:3000/api/health" }
        - { name: "AlertManager", url: "http://alertmanager.monitoring.svc.cluster.local:9093/-/healthy" }
      register: health_checks
      tags: ["validation", "health-check"]

    - name: "Validate metrics collection"
      uri:
        url: "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query"
        method: GET
        body_format: form-urlencoded
        body:
          query: "up"
      register: metrics_query
      failed_when: metrics_query.json.data.result | length == 0
      tags: ["validation", "metrics"]

    - name: "Generate monitoring deployment report"
      template:
        src: monitoring_report.j2
        dest: "/tmp/ainflue_monitoring_deployment_report.json"
      vars:
        deployment_timestamp: "{{ ansible_date_time.iso8601 }}"
        health_status: "{{ health_checks.results }}"
        metrics_status: "{{ metrics_query.json.data.result | length }}"
      tags: ["reporting"]