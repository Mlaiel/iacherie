# IA Chérie Kubernetes Deployment Configuration
# ==========================================
#
# Complete Kubernetes deployment manifests for IA Chérie platform
# Includes all core services, configurations, and monitoring
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.

apiVersion: v1
kind: Namespace
metadata:
  name: iacherie
  labels:
    name: iacherie
    environment: production
    project: iacherie

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: iacherie-config
  namespace: iacherie
data:
  DATABASE_HOST: "iacherie-postgresql.iacherie.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "iacherie"
  REDIS_HOST: "iacherie-redis.iacherie.svc.cluster.local"
  REDIS_PORT: "6379"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_VERSION: "v1"
  MAX_WORKERS: "4"
  WORKER_TIMEOUT: "30"
  CORS_ORIGINS: "*"
  UPLOAD_MAX_SIZE: "100MB"
  SESSION_TIMEOUT: "3600"
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW: "3600"

---
# Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: iacherie-secrets
  namespace: iacherie
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  DATABASE_PASSWORD: cGxlYXNlLWNoYW5nZS1tZQ==
  SECRET_KEY: cGxlYXNlLWNoYW5nZS10aGlzLXNlY3JldC1rZXk=
  JWT_SECRET: cGxlYXNlLWNoYW5nZS1qd3Qtc2VjcmV0
  OPENAI_API_KEY: ""
  ELEVENLABS_API_KEY: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  SHOPIFY_API_KEY: ""
  MIDJOURNEY_API_TOKEN: ""

---
# Persistent Volume Claim for media storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iacherie-media-pvc
  namespace: iacherie
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: efs-sc

---
# Deployment for main API service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-api
  namespace: iacherie
  labels:
    app: iacherie-api
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iacherie-api
  template:
    metadata:
      labels:
        app: iacherie-api
        component: backend
    spec:
      containers:
      - name: api
        image: iacherie/api:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_USERNAME
          value: "ainflue_admin"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iacherie-secrets
              key: DATABASE_PASSWORD
        envFrom:
        - configMapRef:
            name: iacherie-config
        - secretRef:
            name: iacherie-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: media-storage
          mountPath: /app/media
      volumes:
      - name: media-storage
        persistentVolumeClaim:
          claimName: iacherie-media-pvc

---
# Service for API
apiVersion: v1
kind: Service
metadata:
  name: iacherie-api-service
  namespace: iacherie
  labels:
    app: iacherie-api
spec:
  selector:
    app: iacherie-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
  type: ClusterIP

---
# Deployment for AI Engine
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-ai-engine
  namespace: iacherie
  labels:
    app: iacherie-ai-engine
    component: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iacherie-ai-engine
  template:
    metadata:
      labels:
        app: iacherie-ai-engine
        component: ai
    spec:
      containers:
      - name: ai-engine
        image: iacherie/ai-engine:latest
        ports:
        - containerPort: 8001
          name: http
        envFrom:
        - configMapRef:
            name: iacherie-config
        - secretRef:
            name: iacherie-secrets
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: model-cache
          mountPath: /app/models
      volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 20Gi

---
# Service for AI Engine
apiVersion: v1
kind: Service
metadata:
  name: iacherie-ai-service
  namespace: iacherie
  labels:
    app: iacherie-ai-engine
spec:
  selector:
    app: iacherie-ai-engine
  ports:
  - name: http
    port: 80
    targetPort: 8001
  type: ClusterIP

---
# Deployment for Mobile API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-mobile-api
  namespace: iacherie
  labels:
    app: iacherie-mobile-api
    component: mobile
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iacherie-mobile-api
  template:
    metadata:
      labels:
        app: iacherie-mobile-api
        component: mobile
    spec:
      containers:
      - name: mobile-api
        image: iacherie/mobile-api:latest
        ports:
        - containerPort: 8002
          name: http
        envFrom:
        - configMapRef:
            name: iacherie-config
        - secretRef:
            name: iacherie-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Service for Mobile API
apiVersion: v1
kind: Service
metadata:
  name: iacherie-mobile-service
  namespace: iacherie
  labels:
    app: iacherie-mobile-api
spec:
  selector:
    app: iacherie-mobile-api
  ports:
  - name: http
    port: 80
    targetPort: 8002
  type: ClusterIP

---
# Deployment for Background Workers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-workers
  namespace: iacherie
  labels:
    app: iacherie-workers
    component: workers
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iacherie-workers
  template:
    metadata:
      labels:
        app: iacherie-workers
        component: workers
    spec:
      containers:
      - name: worker
        image: iacherie/worker:latest
        command: ["celery", "worker", "-A", "iacherie.celery", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: iacherie-config
        - secretRef:
            name: iacherie-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: media-storage
          mountPath: /app/media
      volumes:
      - name: media-storage
        persistentVolumeClaim:
          claimName: iacherie-media-pvc

---
# Deployment for Celery Beat (Scheduler)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-scheduler
  namespace: iacherie
  labels:
    app: iacherie-scheduler
    component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iacherie-scheduler
  template:
    metadata:
      labels:
        app: iacherie-scheduler
        component: scheduler
    spec:
      containers:
      - name: scheduler
        image: iacherie/worker:latest
        command: ["celery", "beat", "-A", "iacherie.celery", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: iacherie-config
        - secretRef:
            name: iacherie-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
# Deployment for PostgreSQL Database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-postgresql
  namespace: iacherie
  labels:
    app: iacherie-postgresql
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iacherie-postgresql
  template:
    metadata:
      labels:
        app: iacherie-postgresql
        component: database
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "iacherie"
        - name: POSTGRES_USER
          value: "ainflue_admin"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iacherie-secrets
              key: DATABASE_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - ainflue_admin
            - -d
            - iacherie
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - ainflue_admin
            - -d
            - iacherie
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgresql-data
        persistentVolumeClaim:
          claimName: iacherie-postgresql-pvc

---
# PVC for PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iacherie-postgresql-pvc
  namespace: iacherie
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3-sc

---
# Service for PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: iacherie-postgresql
  namespace: iacherie
  labels:
    app: iacherie-postgresql
spec:
  selector:
    app: iacherie-postgresql
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
  type: ClusterIP

---
# Deployment for Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iacherie-redis
  namespace: iacherie
  labels:
    app: iacherie-redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iacherie-redis
  template:
    metadata:
      labels:
        app: iacherie-redis
        component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--appendonly", "yes"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: iacherie-redis-pvc

---
# PVC for Redis
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iacherie-redis-pvc
  namespace: iacherie
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp3-sc

---
# Service for Redis
apiVersion: v1
kind: Service
metadata:
  name: iacherie-redis
  namespace: iacherie
  labels:
    app: iacherie-redis
spec:
  selector:
    app: iacherie-redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  type: ClusterIP

---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iacherie-ingress
  namespace: iacherie
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.iacherie.com
    - ai.iacherie.com
    - mobile.iacherie.com
    secretName: iacherie-tls
  rules:
  - host: api.iacherie.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iacherie-api-service
            port:
              number: 80
  - host: ai.iacherie.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iacherie-ai-service
            port:
              number: 80
  - host: mobile.iacherie.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: iacherie-mobile-service
            port:
              number: 80

---
# HorizontalPodAutoscaler for API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iacherie-api-hpa
  namespace: iacherie
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iacherie-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# HorizontalPodAutoscaler for AI Engine
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iacherie-ai-hpa
  namespace: iacherie
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iacherie-ai-engine
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85

---
# HorizontalPodAutoscaler for Workers
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iacherie-workers-hpa
  namespace: iacherie
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iacherie-workers
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# NetworkPolicy for database security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iacherie-database-netpol
  namespace: iacherie
spec:
  podSelector:
    matchLabels:
      component: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: backend
    - podSelector:
        matchLabels:
          component: workers
    ports:
    - protocol: TCP
      port: 5432

---
# NetworkPolicy for cache security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iacherie-cache-netpol
  namespace: iacherie
spec:
  podSelector:
    matchLabels:
      component: cache
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: backend
    - podSelector:
        matchLabels:
          component: workers
    - podSelector:
        matchLabels:
          component: mobile
    ports:
    - protocol: TCP
      port: 6379

---
# ServiceMonitor for Prometheus monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: iacherie-monitoring
  namespace: iacherie
  labels:
    app: iacherie
spec:
  selector:
    matchLabels:
      app: iacherie-api
  endpoints:
  - port: http
    path: /metrics
    interval: 30s

---
# PrometheusRule for alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: iacherie-alerts
  namespace: iacherie
  labels:
    app: iacherie
spec:
  groups:
  - name: iacherie.rules
    rules:
    - alert: AinfluePodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total{namespace="iacherie"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} is crash looping"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently"
    
    - alert: AinflueHighMemoryUsage
      expr: (container_memory_usage_bytes{namespace="iacherie"} / container_spec_memory_limit_bytes{namespace="iacherie"}) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage detected"
        description: "Container {{ $labels.container }} is using {{ $value | humanizePercentage }} of available memory"
    
    - alert: AinflueHighCPUUsage
      expr: rate(container_cpu_usage_seconds_total{namespace="iacherie"}[5m]) > 0.8
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage detected"
        description: "Container {{ $labels.container }} is using high CPU"