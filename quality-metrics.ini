# Quality Metrics Configuration for Ainflue Platform
# This file contains configuration for various quality metrics tools

# Code Coverage Configuration
[coverage:run]
source = .
omit = 
    */test_*
    */tests/*
    */conftest*
    */__pycache__/*
    */venv/*
    */env/*
    */migrations/*
    setup.py
    main.py
    simple_main.py

[coverage:report]
# Coverage thresholds - strict requirements
fail_under = 90
skip_empty = true
show_missing = true
precision = 2

# Exclude lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov
title = Ainflue Platform Code Coverage Report

[coverage:xml]
output = coverage.xml

# Complexity Analysis Configuration
[radon]
cc_min = C  # Minimum complexity grade to show
cc_max = F  # Maximum allowed complexity grade
nc_max = 7  # Maximum nested complexity
average = yes
show_complexity = yes
show_closures = yes

# Documentation Coverage Configuration  
[doc8]
max-line-length = 120
ignore-path = docs/_build,venv,env,dist,build
file-encoding = utf-8

# Performance Benchmarking Configuration
[pytest-benchmark]
benchmark-only = false
benchmark-sort = mean
benchmark-group-by = group
benchmark-compare-fail = mean:5%
benchmark-json = benchmark-results.json
benchmark-histogram = benchmark-histogram.svg

# License Compliance Configuration
[licensecheck]
# Allowed licenses (permissive and compatible)
allowed_licenses = 
    MIT
    Apache Software License
    Apache License
    BSD License
    New BSD License
    Simplified BSD
    3-Clause BSD
    2-Clause BSD
    ISC License
    Python Software Foundation License
    Mozilla Public License 2.0

# Denied licenses (copyleft and restrictive)
denied_licenses =
    GNU General Public License
    GNU Lesser General Public License
    Affero GNU General Public License
    Eclipse Public License
    Common Development and Distribution License

# Technical Debt Configuration
[technical_debt]
# Code quality thresholds
maintainability_threshold = B
reliability_threshold = A
security_threshold = A
technical_debt_ratio_threshold = 5.0

# API Breaking Changes Configuration
[api_diff]
baseline_version = 1.0.0
include_paths = api/,core/,services/
exclude_paths = tests/,test_*,*test*
report_format = json
severity_levels = breaking,dangerous,notice

# Security Scorecard Configuration
[security_scorecard]
# Security metrics tracking
min_security_score = 8.0
track_improvements = true
report_format = json
include_dependencies = true

# Quality Gate Configuration
[quality_gates]
# Mandatory quality gates
code_coverage_threshold = 90
complexity_threshold = 10
duplication_threshold = 3
maintainability_rating = B
reliability_rating = A
security_rating = A
technical_debt_ratio = 5.0
vulnerabilities_threshold = 0
bugs_threshold = 0
code_smells_threshold = 50