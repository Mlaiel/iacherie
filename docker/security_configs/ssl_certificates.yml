# SSL/TLS Certificate Configuration
version: '3.8'

certificates:
  api_iacherie_com:
    domains:
      - api.iacherie.com
      - www.api.iacherie.com
    provider: letsencrypt
    renewal: automatic
    
  admin_iacherie_com:
    domains:
      - admin.iacherie.com
    provider: internal_ca
    
ssl_policy:
  min_tls_version: "1.2"
  ciphers: ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
  protocols: TLSv1.2 TLSv1.3
  
certificate_store:
  backend: vault
  path: /certificates
  rotation_days: 30
