# Firewall Rules Configuration
default_policy: DROP
rules:
  - port: 80
    protocol: tcp
    source: any
    action: ACCEPT
  - port: 443
    protocol: tcp
    source: any
    action: ACCEPT
  - port: 22
    protocol: tcp
    source: admin_networks
    action: ACCEPT
rate_limiting:
  connections_per_minute: 100
  burst_size: 200
