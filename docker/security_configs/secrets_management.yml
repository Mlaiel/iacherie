# Secrets Management Configuration
version: '3.8'

vault:
  address: https://vault.ainflue.com:8200
  auth_method: kubernetes
  role: ainflue-platform
  
secret_engines:
  database:
    path: database/
    type: dynamic
    rotation: 24h
    
  api_keys:
    path: api-keys/
    type: kv-v2
    
encryption:
  algorithm: AES256-GCM
  key_derivation: PBKDF2
  
rotation_policy:
  database_passwords: 24h
  api_keys: 30d
  certificates: 30d
