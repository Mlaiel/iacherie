version: '3.8'
services:
  ai_service:
    build:
      context: .
      dockerfile: ai_service.dockerfile
    container_name: ainflue_ai_service
    restart: unless-stopped
    networks:
    - ainflue_main_network
    depends_on: []
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=ai_service
    - SERVICE_CATEGORY=core
    - LOG_LEVEL=INFO
    volumes:
    - ainflue_shared_data:/app/data
    - ainflue_logs:/app/logs
    - ainflue_config:/app/config
  analytics_service:
    build:
      context: .
