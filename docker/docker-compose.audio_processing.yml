version: '3.8'
services:
  audio_processing:
    build:
      context: .
      dockerfile: audio_processing.dockerfile
    container_name: ainflue_audio_processing
    restart: unless-stopped
    networks:
    - ainflue_audio_processing_network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
    - no-new-privileges:true
    read_only: true
    user: 10001:10001
    deploy:
      resources:
        limits: &id001
          memory: 512m
          cpus: '0.5'
          swap: 1g
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=audio_processing
    - SERVICE_CATEGORY=audio_processing
    volumes:
    - ainflue_audio_processing_data:/app/data
    - /tmp:/tmp:rw
    tmpfs:
    - /run:rw,size=100m
    - /var/cache:rw,size=100m
  source_separation:
