version: '3.8'
services:
  ai_insights_engine:
    build:
      context: .
      dockerfile: ai_insights_engine.dockerfile
    container_name: ainflue_ai_insights_engine
    restart: unless-stopped
    networks:
    - ainflue_analytics_network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
    - no-new-privileges:true
    read_only: true
    user: 10001:10001
    deploy:
      resources:
        limits: &id001
          memory: 512m
          cpus: '0.5'
          swap: 1g
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=ai_insights_engine
    - SERVICE_CATEGORY=analytics
    volumes:
    - ainflue_analytics_data:/app/data
    - /tmp:/tmp:rw
    tmpfs:
    - /run:rw,size=100m
    - /var/cache:rw,size=100m
  performance_analyzer:
