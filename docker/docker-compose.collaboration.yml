version: '3.8'
services:
  collaboration_engine:
    build:
      context: .
      dockerfile: collaboration_engine.dockerfile
    container_name: ainflue_collaboration_engine
    restart: unless-stopped
    networks:
    - ainflue_collaboration_network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
    - no-new-privileges:true
    read_only: true
    user: 10001:10001
    deploy:
      resources:
        limits: &id001
          memory: 512m
          cpus: '0.5'
          swap: 1g
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=collaboration_engine
    - SERVICE_CATEGORY=collaboration
    volumes:
    - ainflue_collaboration_data:/app/data
    - /tmp:/tmp:rw
    tmpfs:
    - /run:rw,size=100m
    - /var/cache:rw,size=100m
  ai_matching_service:
    build:
      context: .
      dockerfile: ai_matching_service.dockerfile
    container_name: ainflue_ai_matching_service
