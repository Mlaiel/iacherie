    read_only: true
    user: 10001:10001
    deploy:
      resources:
        limits: *id001
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=ai_matching_service
    - SERVICE_CATEGORY=collaboration
    volumes:
