version: '3.8'
services:
  seo_optimizer:
    build:
      context: .
      dockerfile: seo_optimizer.dockerfile
    container_name: ainflue_seo_optimizer
    restart: unless-stopped
    networks:
    - ainflue_seo_network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
    - no-new-privileges:true
    read_only: true
    user: 10001:10001
    deploy:
      resources:
        limits: &id001
          memory: 512m
          cpus: '0.5'
          swap: 1g
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=seo_optimizer
    - SERVICE_CATEGORY=seo
    volumes:
    - ainflue_seo_data:/app/data
    - /tmp:/tmp:rw
    tmpfs:
    - /run:rw,size=100m
    - /var/cache:rw,size=100m
  keyword_analyzer:
    build:
      context: .
      dockerfile: keyword_analyzer.dockerfile
