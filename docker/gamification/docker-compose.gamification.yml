# =============================================
# Docker Compose - Gamification Services
# Ainflue Platform - Enterprise Gamification
# =============================================
# 
# Complete gamification stack with 12 microservices
# Handles challenges, rewards, leaderboards, achievements,
# social features, tournaments, badges, and engagement optimization
#
# Author: Fahed Mlaiel (mlaiel@live.de)
# Version: 3.0.0
# Security: Production-ready with resource limits and health checks
# =============================================

networks:
  gamification_network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/16
  ainflue_network:
    external: true

volumes:
  gamification_data:
    driver: local
  redis_gamification_data:
    driver: local
  postgres_gamification_data:
    driver: local

services:
  # ========================================
  # Core Infrastructure Services
  # ========================================
  
  redis_gamification:
    image: redis:7-alpine
    container_name: redis_gamification
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_PASSWORD:-gamification_redis_pass}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_gamification_data:/data
    networks:
      - gamification_network
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
  
  postgres_gamification:
    image: postgres:15-alpine
    container_name: postgres_gamification
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GAMIFICATION_DB_NAME:-ainflue_gamification}
      POSTGRES_USER: ${GAMIFICATION_DB_USER:-gamification_user}
      POSTGRES_PASSWORD: ${GAMIFICATION_DB_PASSWORD:-gamification_secure_pass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_gamification_data:/var/lib/postgresql/data
      - ./sql/init_gamification.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - gamification_network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAMIFICATION_DB_USER:-gamification_user} -d ${GAMIFICATION_DB_NAME:-ainflue_gamification}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ========================================
  # Gamification Microservices
  # ========================================

  challenge_engine:
    build:
      context: ../../
      dockerfile: docker/gamification/challenge_engine.dockerfile
    container_name: gamification_challenge_engine
    restart: unless-stopped
    environment:
      - CHALLENGE_ENGINE_PORT=8080
      - CHALLENGE_ENGINE_HOST=0.0.0.0
      - REDIS_URL=redis://redis_gamification:6379
      - DATABASE_URL=postgresql://${GAMIFICATION_DB_USER:-gamification_user}:${GAMIFICATION_DB_PASSWORD:-gamification_secure_pass}@postgres_gamification:5432/${GAMIFICATION_DB_NAME:-ainflue_gamification}
      - JWT_SECRET=${JWT_SECRET:-challenge_jwt_secret}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis_gamification:
        condition: service_healthy
      postgres_gamification:
        condition: service_healthy
    networks:
      - gamification_network
      - ainflue_network
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 120s

  reward_system:
    build:
      context: ../../
      dockerfile: docker/gamification/reward_system.dockerfile
    container_name: gamification_reward_system
    restart: unless-stopped
    environment:
      - REWARD_SYSTEM_PORT=8081
      - REWARD_SYSTEM_HOST=0.0.0.0
      - REDIS_URL=redis://redis_gamification:6379
      - DATABASE_URL=postgresql://${GAMIFICATION_DB_USER:-gamification_user}:${GAMIFICATION_DB_PASSWORD:-gamification_secure_pass}@postgres_gamification:5432/${GAMIFICATION_DB_NAME:-ainflue_gamification}
      - JWT_SECRET=${JWT_SECRET:-reward_jwt_secret}
    depends_on:
      - redis_gamification
      - postgres_gamification
    networks:
      - gamification_network
      - ainflue_network
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

