  # ========================================
  # Load Balancer & API Gateway
  # ========================================
  
  gamification_gateway:
    image: nginx:alpine
    container_name: gamification_gateway
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./nginx/gamification.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - challenge_engine
      - reward_system
      - leaderboard_manager
      - achievement_tracker
      - social_features
      - tournament_organizer
      - badge_system
      - engagement_optimizer
      - community_builder
      - point_calculator
      - level_progression
    networks:
      - gamification_network
      - ainflue_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'