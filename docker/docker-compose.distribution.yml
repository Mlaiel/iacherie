version: '3.8'
services:
  distribution_hub:
    build:
      context: .
      dockerfile: distribution_hub.dockerfile
    container_name: ainflue_distribution_hub
    restart: unless-stopped
    networks:
    - ainflue_distribution_network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
    - no-new-privileges:true
    read_only: true
    user: 10001:10001
    deploy:
      resources:
        limits: &id001
          memory: 512m
          cpus: '0.5'
          swap: 1g
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=distribution_hub
    - SERVICE_CATEGORY=distribution
    volumes:
    - ainflue_distribution_data:/app/data
    - /tmp:/tmp:rw
    tmpfs:
    - /run:rw,size=100m
    - /var/cache:rw,size=100m
  platform_connector:
    build:
      context: .
      dockerfile: platform_connector.dockerfile
    container_name: ainflue_platform_connector
    restart: unless-stopped
