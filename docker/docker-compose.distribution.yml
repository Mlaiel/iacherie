    - no-new-privileges:true
    read_only: true
    user: 10001:10001
    deploy:
      resources:
        limits: *id001
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=platform_connector
    - SERVICE_CATEGORY=distribution
    volumes:
    - ainflue_distribution_data:/app/data
    - /tmp:/tmp:rw
    tmpfs:
    - /run:rw,size=100m
    - /var/cache:rw,size=100m
