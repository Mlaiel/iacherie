version: '3.8'
services:
  protection_service:
    build:
      context: .
      dockerfile: protection_service.dockerfile
    container_name: ainflue_protection_service
    restart: unless-stopped
    networks:
    - ainflue_protection_network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
    - no-new-privileges:true
    read_only: true
    user: 10001:10001
    deploy:
      resources:
        limits: &id001
          memory: 512m
          cpus: '0.5'
          swap: 1g
    environment:
    - PYTHONPATH=/app
    - SERVICE_NAME=protection_service
    - SERVICE_CATEGORY=protection
    - ENCRYPTION_ENABLED=true
    - AUDIT_LOGGING=true
    volumes:
    - ainflue_protection_data:/app/data
    - /tmp:/tmp:rw
    tmpfs:
    - /run:rw,size=100m
    - /var/cache:rw,size=100m
  fingerprinting_engine:
