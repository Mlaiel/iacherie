# Encryption Standards and Algorithms
encryption_standards:
  compliance_level: "enterprise_grade"
  quantum_resistance: "hybrid_classical_post_quantum"
  security_level: "top_secret"
  fips_140_2_level: 3

# Symmetric Encryption Configuration
symmetric_encryption:
  # Primary algorithms
  primary:
    algorithm: "AES-256-GCM"
    key_size: 256
    block_size: 128
    mode: "GCM"
    authentication: "built_in"
    
  # Backup algorithms
  backup:
    algorithm: "ChaCha20-Poly1305"
    key_size: 256
    nonce_size: 96
    authentication: "Poly1305"
    
  # Quantum-resistant preparation
  quantum_resistant:
    algorithm: "AES-256-GCM"  # Still secure against quantum attacks
    post_quantum_backup: "CRYSTALS-Kyber"
    transition_period: "2025-2030"
    
  # Algorithm parameters
  parameters:
    iv_size: 96              # 12 bytes for GCM
    tag_size: 128            # 16 bytes authentication tag
    aad_support: true        # Additional Authenticated Data
    streaming_support: true
    
# Asymmetric Encryption Configuration  
asymmetric_encryption:
  # RSA Configuration
  rsa:
    key_size: 4096
    public_exponent: 65537
    padding: "OAEP"
    hash_algorithm: "SHA-256"
    mgf: "MGF1"
    
  # Elliptic Curve Configuration
  elliptic_curve:
    curve: "P-384"
    algorithm: "ECDSA"
    hash_algorithm: "SHA-384"
    point_compression: false
    
  # Post-Quantum Cryptography
  post_quantum:
    # Key Encapsulation Mechanism
    kem:
      algorithm: "CRYSTALS-Kyber"
      security_level: 768     # Kyber768
      ciphertext_size: 1088
      public_key_size: 1184
      
    # Digital Signatures
    signature:
      algorithm: "CRYSTALS-Dilithium"
      security_level: 3       # Dilithium3
      signature_size: 3293
      public_key_size: 1952
      
# Hash Functions Configuration
hash_functions:
  # Primary hash function
  primary:
    algorithm: "SHA-256"
    output_size: 256
    block_size: 512
    
  # Cryptographic hash family
  family:
    sha2:
      sha224: true
      sha256: true
      sha384: true
      sha512: true
    sha3:
      sha3_224: true
      sha3_256: true
      sha3_384: true
      sha3_512: true
    blake2:
      blake2b: true
      blake2s: true
      
  # Message Authentication Codes
  mac:
    hmac:
      algorithm: "HMAC-SHA-256"
      key_size: 256
      
    poly1305:
      algorithm: "Poly1305"
      key_size: 256
      
# Key Derivation Functions
key_derivation:
  # Password-based key derivation
  pbkdf2:
    algorithm: "PBKDF2-HMAC-SHA-256"
    iterations: 100000
    salt_size: 128
    derived_key_length: 256
    
  # scrypt parameters
  scrypt:
    n: 32768                 # CPU/memory cost
    r: 8                     # Block size
    p: 1                     # Parallelization
    salt_size: 128
    derived_key_length: 256
    
  # Argon2 parameters
  argon2:
    variant: "Argon2id"
    memory_cost: 65536       # 64 MB
    time_cost: 3
    parallelism: 4
    salt_size: 128
    hash_length: 256
    
  # HKDF (HMAC-based KDF)
  hkdf:
    algorithm: "HKDF-SHA-256"
    salt_size: 256
    info_context: "IA Chérie-KDF-v1"
    
# Key Management Configuration
key_management:
  # Key generation
  generation:
    entropy_source: "hardware_rng"
    seed_length: 256
    key_validation: true
    
  # Key storage
  storage:
    # Hardware Security Module
    hsm:
      enabled: true
      provider: "AWS CloudHSM"
      cluster_id: "${HSM_CLUSTER_ID}"
      partition_label: "iacherie-keys"
      
    # Software-based secure storage
    software:
      encryption: "AES-256-GCM"
      access_control: "strict"
      audit_logging: true
      
  # Key rotation
  rotation:
    policy: "automatic"
    master_key_rotation_days: 30
    data_key_rotation_days: 90
    archive_old_keys: true
    key_history_retention_years: 7
    
  # Key escrow
  escrow:
    enabled: true
    split_knowledge: true
    dual_control: true
    threshold_scheme: "3_of_5"
    
  # Key backup and recovery
  backup:
    encrypted_backup: true
    geographic_distribution: true
    recovery_procedures: "documented"
    recovery_testing: "quarterly"

# Digital Signatures Configuration
digital_signatures:
  # RSA signatures
  rsa_signatures:
    algorithm: "RSA-PSS"
    key_size: 4096
    hash_algorithm: "SHA-256"
    salt_length: 32
    
  # ECDSA signatures
  ecdsa_signatures:
    curve: "P-384"
    hash_algorithm: "SHA-384"
    deterministic: true       # RFC 6979
    
  # EdDSA signatures
  eddsa_signatures:
    algorithm: "Ed25519"
    public_key_size: 32
    signature_size: 64
    
  # Post-quantum signatures
  post_quantum_signatures:
    algorithm: "CRYSTALS-Dilithium"
    security_level: 3
    deterministic: false

# Transport Security Configuration
transport_security:
  # TLS configuration
  tls:
    version: "1.3"
    cipher_suites:
      - "TLS_AES_256_GCM_SHA384"
      - "TLS_CHACHA20_POLY1305_SHA256"
      - "TLS_AES_128_GCM_SHA256"
    perfect_forward_secrecy: true
    
  # Certificate configuration
  certificates:
    algorithm: "RSA-4096"
    hash_algorithm: "SHA-256"
    validity_period_days: 365
    subject_alternative_names: true
    
    # Certificate transparency
    certificate_transparency: true
    sct_policy: "require"
    
# Database Encryption Configuration
database_encryption:
  # Encryption at rest
  at_rest:
    enabled: true
    algorithm: "AES-256-GCM"
    key_management: "customer_managed"
    transparent_data_encryption: true
    
  # Field-level encryption
  field_level:
    enabled: true
    sensitive_fields:
      - "password_hash"
      - "personal_data"
      - "payment_information"
      - "authentication_tokens"
    deterministic_encryption: false
    
  # Database connections
  connections:
    ssl_mode: "require"
    ssl_cert_verification: true
    client_certificates: true

# File System Encryption Configuration
filesystem_encryption:
  # Full disk encryption
  full_disk:
    enabled: true
    algorithm: "AES-256-XTS"
    key_derivation: "PBKDF2"
    
  # File-level encryption
  file_level:
    enabled: true
    algorithm: "AES-256-GCM"
    metadata_encryption: true
    filename_encryption: true
    
  # Application-level encryption
  application_level:
    enabled: true
    automatic_encryption: true
    encryption_context: true

# Message Encryption Configuration
message_encryption:
  # End-to-end encryption
  e2e:
    enabled: true
    protocol: "Signal Protocol"
    double_ratchet: true
    
  # Group messaging encryption
  group_messaging:
    algorithm: "TreeKEM"
    forward_secrecy: true
    post_compromise_security: true
    
# Secure Communication Protocols
secure_protocols:
  # Signal Protocol
  signal_protocol:
    x3dh_key_agreement: true
    double_ratchet: true
    header_encryption: true
    
  # Noise Protocol Framework
  noise_protocol:
    pattern: "Noise_XX_25519_ChaChaPoly_SHA256"
    handshake_hash: "SHA-256"
    
# Cryptographic Random Number Generation
random_generation:
  # Hardware random number generator
  hardware_rng:
    enabled: true
    source: "/dev/hwrng"
    testing: "continuous"
    
  # Cryptographically secure PRNG
  csprng:
    algorithm: "ChaCha20"
    seed_size: 256
    reseed_interval: 1000000
    
  # Entropy pool management
  entropy_pool:
    min_entropy: 256
    collection_sources:
      - "hardware_events"
      - "system_events"
      - "network_timing"

# Performance Optimization
performance:
  # Hardware acceleration
  hardware_acceleration:
    aes_ni: true             # AES New Instructions
    sha_extensions: true     # SHA Extensions
    avx2: true              # Advanced Vector Extensions
    
  # Software optimization
  software_optimization:
    constant_time_algorithms: true
    vectorization: true
    parallel_processing: true
    
  # Caching
  caching:
    key_schedule_cache: true
    precomputed_tables: true
    session_resumption: true

# Compliance and Standards
compliance:
  # FIPS 140-2 compliance
  fips_140_2:
    level: 3
    certified_modules: true
    key_management_compliance: true
    
  # Common Criteria
  common_criteria:
    evaluation_assurance_level: "EAL4+"
    protection_profile: "Application Software"
    
  # Industry standards
  standards:
    nist: true
    iso_27001: true
    common_criteria: true
    fips_140_2: true

# Monitoring and Auditing
monitoring:
  # Cryptographic monitoring
  crypto_monitoring:
    algorithm_usage_tracking: true
    key_usage_monitoring: true
    performance_monitoring: true
    
  # Security event monitoring
  security_events:
    key_generation_events: true
    encryption_failures: true
    decryption_failures: true
    key_rotation_events: true
    
  # Compliance monitoring
  compliance_monitoring:
    fips_compliance_checks: true
    algorithm_deprecation_alerts: true
    certificate_expiration_monitoring: true

# Migration and Transition
migration:
  # Algorithm migration
  algorithm_migration:
    migration_plan: "phased_rollout"
    backward_compatibility: 24  # months
    deprecation_timeline: "documented"
    
  # Post-quantum transition
  post_quantum_transition:
    hybrid_mode: true
    transition_period: "2025-2030"
    testing_phase: "2024-2025"
    
# Emergency Procedures
emergency_procedures:
  # Key compromise
  key_compromise:
    immediate_revocation: true
    emergency_rotation: true
    incident_response: "documented"
    
  # Algorithm compromise
  algorithm_compromise:
    emergency_migration: true
    fallback_algorithms: true
    communication_plan: "documented"