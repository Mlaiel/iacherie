"""
Enterprise Utils Configuration
==============================

Ultra-strict enterprise configuration for Ainflue platform utilities.
This configuration ensures compliance with enterprise security standards
and performance requirements.

Author: Fahed Mlaiel <mlaiel@live.de>
Copyright (c) 2025 Fahed Mlaiel. All rights reserved.
"""

# Enterprise Performance Thresholds (Ultra-Strict)
performance:
  # Core utilities performance targets
  data_processor_threshold_ms: 10
  file_manager_threshold_ms: 100
  datetime_handler_threshold_ms: 1
  text_processor_threshold_ms: 10
  media_handler_threshold_ms: 50
  workflow_engine_threshold_ms: 10
  
  # Security utilities performance targets
  encryption_threshold_ms: 5
  authentication_threshold_ms: 5
  validation_threshold_ms: 2
  
  # Performance utilities targets
  cache_threshold_ms: 1
  metrics_threshold_ms: 1
  monitoring_threshold_ms: 5
  circuit_breaker_threshold_ms: 1
  rate_limiter_threshold_ms: 1

# Enterprise Security Configuration
security:
  # Encryption settings (Quantum-resistant)
  encryption:
    symmetric_algorithm: "AES-256-GCM"
    asymmetric_algorithm: "RSA-4096"
    key_rotation_days: 90
    kdf_iterations: 100000
    
  # Authentication settings
  authentication:
    jwt_algorithm: "HS256"
    access_token_expire_minutes: 15
    refresh_token_expire_days: 30
    max_login_attempts: 5
    lockout_duration_minutes: 15
    password_min_length: 12
    require_mfa: true
    
  # Validation settings
  validation:
    max_input_size: 10485760  # 10MB
    scan_for_xss: true
    scan_for_sql_injection: true
    scan_for_nosql_injection: true
    check_file_headers: true
    
# Enterprise Cache Configuration
cache:
  # Multi-level caching
  l1_max_size: 1000
  l1_ttl_seconds: 300
  l2_ttl_seconds: 3600
  redis_url: "redis://localhost:6379"
  enable_compression: true
  
# Enterprise Database Configuration
database:
  # Connection pool settings
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600
  
# Enterprise Monitoring Configuration
monitoring:
  # System thresholds
  cpu_threshold: 80.0
  memory_threshold: 80.0
  disk_threshold: 90.0
  
  # Metrics collection
  enable_prometheus: true
  metrics_retention_days: 30
  
  # Alerting
  enable_alerts: true
  alert_channels:
    - email
    - slack
    
# Enterprise File Management
file_management:
  max_file_size_mb: 100
  allowed_extensions:
    - .txt
    - .pdf
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .mp4
    - .mp3
    - .wav
  blocked_extensions:
    - .exe
    - .bat
    - .sh
    - .php
    - .js
  scan_for_malware: true
  
# Enterprise Workflow Configuration
workflows:
  max_execution_time_seconds: 3600
  max_concurrent_workflows: 100
  enable_persistence: true
  retry_policy: "exponential_backoff"
  
# Enterprise Text Processing
text_processing:
  max_text_length: 1000000
  supported_languages:
    - en
    - fr
    - de
    - ar
  enable_sentiment_analysis: true
  enable_entity_extraction: true
  
# Enterprise Media Processing
media_processing:
  max_file_size_mb: 100
  temp_directory: "/tmp/ainflue_media"
  enable_optimization: true
  quality_settings:
    image_quality: 85
    video_crf: 23
    audio_bitrate: "192k"
    
# Enterprise Rate Limiting
rate_limiting:
  default_rpm: 60  # requests per minute
  burst_rpm: 120
  algorithm: "token_bucket"
  enable_per_user_limits: true
  
# Enterprise Circuit Breaker
circuit_breaker:
  failure_threshold: 5
  timeout_seconds: 60
  half_open_max_calls: 3
  
# Enterprise Logging
logging:
  level: "INFO"
  structured_logging: true
  log_encryption: true
  audit_logging: true
  retention_days: 365
  
# Enterprise Compliance
compliance:
  gdpr_enabled: true
  sox_enabled: true
  iso27001_enabled: true
  owasp_enabled: true
  nist_enabled: true
  
# Enterprise Quality Assurance
quality_assurance:
  code_coverage_minimum: 95
  type_hints_required: true
  async_await_required: true
  performance_testing: true
  security_testing: true
  load_testing: true