# Staging Environment Settings
environment:
  name: "staging"
  debug: false
  testing: true
  hot_reload: false
  profiling_enabled: true    # Enable profiling for performance testing
  
# Performance Settings (Production-like with monitoring)
performance:
  # Production-like performance targets
  cache_operations_p95: 2     # Slightly relaxed vs production
  database_operations_p95: 75 # 75ms database operations  
  file_operations_p95: 150    # 150ms file operations
  
  # Memory settings for staging
  memory:
    max_heap_size_mb: 768     # Between dev and prod
    gc_strategy: "g1gc"       # Production GC strategy
    gc_threshold: 0.75
    
  # CPU settings for staging
  cpu:
    max_worker_threads: 12    # Moderate thread count
    enable_cpu_affinity: true
    cpu_cores: [0, 1, 2, 3, 4, 5]
    
# Security Settings (Production-level security)
security:
  # Production-level encryption
  encryption:
    symmetric_algorithm: "AES-256-GCM"
    asymmetric_algorithm: "RSA-4096"
    key_rotation_days: 60     # Moderate rotation
    kdf_iterations: 100000
    
  # Strict authentication for staging
  authentication:
    jwt_algorithm: "RS256"
    access_token_expire_minutes: 30  # Moderate token life
    refresh_token_expire_days: 14
    max_login_attempts: 5
    require_mfa: false        # Optional MFA for testing
    password_min_length: 10
    
  # Full validation for staging
  validation:
    max_input_size: 10485760  # 10MB limit
    scan_for_xss: true
    scan_for_sql_injection: true
    scan_for_nosql_injection: true
    check_file_headers: true
    enable_rate_limiting: true
    
# Database Settings (Staging)
database:
  # Staging database connection
  url: "${AINFLUE_STAGING_DATABASE_URL}"
  pool_size: 15             # Moderate pool size
  max_overflow: 20
  pool_timeout: 20
  echo_sql: true            # Enable SQL logging for testing
  
  # Staging-specific settings
  auto_create_tables: false
  drop_tables_on_startup: false
  seed_test_data: true      # Enable test data
  enable_connection_pooling: true
  
  # Testing features
  enable_query_logging: true
  slow_query_threshold_ms: 100
  
# Cache Settings (Staging)
cache:
  # Moderate cache for staging
  l1_max_size: 1500
  l1_ttl_seconds: 300
  l2_ttl_seconds: 1800      # Shorter TTL for testing
  
  # Staging Redis connection
  redis_url: "${AINFLUE_STAGING_REDIS_URL}"
  enable_compression: true
  enable_clustering: false  # Single instance for staging
  
# Logging Configuration (Verbose for testing)
logging:
  level: "INFO"             # Moderate verbosity
  format: "json"
  enable_console: true      # Console enabled for debugging
  enable_file: true
  file_path: "/var/log/ainflue/staging.log"
  structured_logging: true
  include_trace: false
  log_sql_queries: true     # Enable for performance testing
  
# File Management (Moderate restrictions)
file_management:
  max_file_size_mb: 75      # Between dev and prod
  temp_directory: "/tmp/ainflue_staging"
  scan_for_malware: true
  enable_optimization: true
  
  # Extended file types for testing
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".webp"
    - ".mp4"
    - ".mp3"
    - ".wav"
    - ".pdf"
    - ".txt"  # Additional for testing
    - ".json" # Additional for testing
    
# Rate Limiting (Moderate for testing)
rate_limiting:
  default_rpm: 100          # Higher than prod for testing
  burst_rpm: 200
  enable_per_user_limits: true
  enable_ip_blocking: false # Disabled for testing
  
# Monitoring (Comprehensive for staging)
monitoring:
  enable_prometheus: true
  metrics_retention_days: 30
  cpu_threshold: 75.0
  memory_threshold: 80.0
  disk_threshold: 90.0
  
  # Staging-specific monitoring
  enable_performance_testing: true
  enable_load_testing: true
  enable_query_monitoring: true
  
# Creator Economy (Staging/Testing)
creator_economy:
  # Content processing for staging
  content_processing:
    enable_async_processing: true
    max_processing_time_seconds: 300
    enable_preview_generation: true
    enable_processing_metrics: true
    
  # Staging collaboration features
  collaboration:
    max_collaborators: 8
    enable_real_time_features: true
    websocket_url: "${AINFLUE_STAGING_WS_URL}"
    
  # Staging monetization (test mode)
  monetization:
    test_mode: true           # Test mode for staging
    commission_rate: 0.10     # Reduced rate for testing
    minimum_payout: 5.0
    fraud_detection_enabled: true
    
# Feature Flags (Staging)
features:
  new_ui_enabled: true
  beta_features_enabled: true  # Enable beta for testing
  experimental_ai_enabled: true
  debug_panel_enabled: true
  hot_reload_enabled: false
  
  # Testing features
  load_testing_enabled: true
  performance_monitoring_enabled: true
  
# External Services (Staging/Test)
external_services:
  # AI Services (Staging)
  openai:
    api_key: "${OPENAI_API_KEY_STAGING}"
    model: "gpt-3.5-turbo"    # Cheaper model for staging
    mock_responses: false
    rate_limit_enabled: true
    
  # Payment Services (Test mode)
  stripe:
    publishable_key: "${STRIPE_STAGING_PUBLISHABLE_KEY}"
    secret_key: "${STRIPE_STAGING_SECRET_KEY}"
    webhook_secret: "${STRIPE_STAGING_WEBHOOK_SECRET}"
    
  # Email Services (Staging)
  sendgrid:
    api_key: "${SENDGRID_STAGING_API_KEY}"
    mock_emails: false
    save_emails_to_file: true  # Save for testing
    
# API Configuration (Staging)
api:
  # CORS settings for staging
  cors_origins:
    - "https://staging.ainflue.com"
    - "https://staging-app.ainflue.com"
    - "http://localhost:3000"  # Local development access
  
  # API limits for staging
  request_timeout: 60        # Longer timeout for testing
  max_request_size: 52428800 # 50MB for testing larger files
  
# Security Headers (Production-like)
security_headers:
  content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
  x_frame_options: "SAMEORIGIN"
  x_content_type_options: "nosniff"
  strict_transport_security: "max-age=31536000"
  
# Testing Configuration
testing:
  # Load testing
  load_testing:
    enabled: true
    max_concurrent_users: 100
    test_duration_minutes: 30
    
  # Performance testing
  performance_testing:
    enabled: true
    latency_targets:
      p95: 100
      p99: 200
      
  # Integration testing
  integration_testing:
    enabled: true
    external_services_mocked: false
    
# Backup Configuration (Limited for staging)
backup:
  enabled: true
  schedule: "0 4 * * *"      # Daily at 4 AM
  retention_days: 7          # Shorter retention
  encryption_enabled: true
  
# Data Management (Staging)
data_management:
  # Data refresh from production
  refresh_schedule: "0 6 * * 0"  # Weekly on Sunday
  anonymize_data: true
  data_subset_percentage: 50     # Use 50% of prod data
  
# Compliance (Staging)
compliance:
  gdpr_enabled: true
  sox_enabled: false         # Relaxed for staging
  iso27001_enabled: true
  
# Resource Limits (Staging)
resources:
  cpu_limit: "1500m"         # 1.5 CPU cores
  memory_limit: "1.5Gi"      # 1.5GB memory
  disk_limit: "8Gi"          # 8GB disk
  
# Health Checks (Staging)
health_checks:
  enabled: true
  endpoint: "/health"
  interval_seconds: 60       # Less frequent than prod
  timeout_seconds: 10
  failure_threshold: 5
  
# Deployment Configuration
deployment:
  strategy: "blue_green"
  auto_rollback_enabled: true
  health_check_grace_period: 120
  
# Quality Assurance
quality_assurance:
  automated_testing: true
  code_coverage_required: true
  performance_regression_detection: true
  security_scanning: true