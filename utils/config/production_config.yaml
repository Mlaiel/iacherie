# Production Environment Settings
environment:
  name: "production"
  debug: false
  testing: false
  hot_reload: false
  profiling_enabled: false
  
# Performance Settings (Maximum Performance)
performance:
  # Ultra-strict performance targets for production
  cache_operations_p95: 1     # Sub-millisecond cache
  database_operations_p95: 50 # 50ms database operations
  file_operations_p95: 100    # 100ms file operations
  
  # Memory settings optimized for production
  memory:
    max_heap_size_mb: 1024    # Higher memory for production load
    gc_strategy: "g1gc"       # Advanced GC for production
    gc_threshold: 0.7         # More aggressive GC
    
  # CPU settings for production
  cpu:
    max_worker_threads: 16    # More threads for production load
    enable_cpu_affinity: true # CPU affinity for performance
    cpu_cores: [0, 1, 2, 3, 4, 5, 6, 7]  # Utilize multiple cores
    
# Security Settings (Maximum Security)
security:
  # Maximum encryption for production
  encryption:
    symmetric_algorithm: "AES-256-GCM"
    asymmetric_algorithm: "RSA-4096"
    key_rotation_days: 30     # Frequent key rotation
    kdf_iterations: 100000    # Maximum iterations
    
  # Strict authentication for production
  authentication:
    jwt_algorithm: "RS256"    # Asymmetric JWT for production
    access_token_expire_minutes: 15  # Short token life
    refresh_token_expire_days: 7
    max_login_attempts: 3     # Strict login attempts
    require_mfa: true         # Mandatory MFA
    password_min_length: 12   # Strong password requirement
    
  # Maximum validation for production
  validation:
    max_input_size: 5242880   # 5MB strict limit
    scan_for_xss: true        # Full security scanning
    scan_for_sql_injection: true
    scan_for_nosql_injection: true
    check_file_headers: true
    enable_rate_limiting: true
    
# Database Settings (Production)
database:
  # Production database connection (from environment)
  url: "${IACHERIE_PROD_DATABASE_URL}"
  pool_size: 20             # Large pool for production
  max_overflow: 30
  pool_timeout: 10          # Strict timeout
  echo_sql: false           # No SQL logging in production
  
  # Production-specific settings
  auto_create_tables: false
  drop_tables_on_startup: false
  seed_test_data: false
  enable_connection_pooling: true
  connection_validation: true
  
  # Backup and replication
  backup_enabled: true
  backup_interval_hours: 6
  replication_enabled: true
  
# Cache Settings (Production)
cache:
  # Large cache for production
  l1_max_size: 2000
  l1_ttl_seconds: 300       # Standard TTL
  l2_ttl_seconds: 3600
  
  # Production Redis connection
  redis_url: "${IACHERIE_PROD_REDIS_URL}"
  enable_compression: true  # Compression for efficiency
  enable_clustering: true   # Redis clustering
  
  # Cache warming for production
  enable_cache_warming: true
  warm_cache_on_startup: true
  
# Logging Configuration (Production)
logging:
  level: "WARNING"          # Less verbose for production
  format: "json"            # Structured JSON logs
  enable_console: false     # Console logging disabled
  enable_file: true
  file_path: "/var/log/iacherie/production.log"
  structured_logging: true
  include_trace: false      # No trace in production
  log_sql_queries: false
  
  # Log rotation for production
  max_file_size_mb: 100
  backup_count: 10
  
# File Management (Strict for Production)
file_management:
  max_file_size_mb: 50      # Strict file size limit
  temp_directory: "/tmp/iacherie_prod"
  scan_for_malware: true    # Mandatory malware scanning
  enable_optimization: true
  
  # Restricted file types for production
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".webp"
    - ".mp4"
    - ".mp3"
    - ".wav"
    - ".pdf"
    
  # Virus scanning
  virus_scanning:
    enabled: true
    engine: "clamav"
    quarantine_path: "/var/quarantine/iacherie"
    
# Rate Limiting (Strict for Production)
rate_limiting:
  default_rpm: 30           # Conservative rate limiting
  burst_rpm: 60
  enable_per_user_limits: true
  enable_ip_blocking: true
  
  # Advanced rate limiting
  sliding_window_enabled: true
  distributed_rate_limiting: true
  
# Monitoring (Production)
monitoring:
  enable_prometheus: true
  metrics_retention_days: 90  # Longer retention for production
  cpu_threshold: 70.0       # Conservative thresholds
  memory_threshold: 75.0
  disk_threshold: 85.0
  
  # Production monitoring
  enable_apm: true
  apm_service: "datadog"
  enable_error_tracking: true
  
  # Alerting
  alerting:
    enabled: true
    channels:
      - email
      - slack
      - pagerduty
    escalation_enabled: true
    
# Creator Economy (Production)
creator_economy:
  # Content processing for production
  content_processing:
    enable_async_processing: true
    max_processing_time_seconds: 300
    enable_preview_generation: true
    quality_optimization: true
    
  # Production collaboration features
  collaboration:
    max_collaborators: 10
    enable_real_time_features: true
    websocket_url: "${IACHERIE_PROD_WS_URL}"
    
  # Production monetization
  monetization:
    test_mode: false
    commission_rate: 0.15     # Standard commission
    minimum_payout: 10.0
    fraud_detection_enabled: true
    
# Feature Flags (Production)
features:
  new_ui_enabled: true
  beta_features_enabled: false  # No beta in production
  experimental_ai_enabled: false
  debug_panel_enabled: false
  hot_reload_enabled: false
  
# External Services (Production)
external_services:
  # AI Services (Production)
  openai:
    api_key: "${OPENAI_API_KEY_PROD}"
    model: "gpt-4"
    mock_responses: false
    rate_limit_enabled: true
    
  # Payment Services (Production)
  stripe:
    publishable_key: "${STRIPE_PROD_PUBLISHABLE_KEY}"
    secret_key: "${STRIPE_PROD_SECRET_KEY}"
    webhook_secret: "${STRIPE_PROD_WEBHOOK_SECRET}"
    
  # Email Services (Production)
  sendgrid:
    api_key: "${SENDGRID_PROD_API_KEY}"
    mock_emails: false
    save_emails_to_file: false
    
# API Configuration (Production)
api:
  # CORS settings for production
  cors_origins:
    - "https://iacherie.com"
    - "https://www.iacherie.com"
    - "https://app.iacherie.com"
  
  # Strict API limits for production
  request_timeout: 30       # Strict timeout
  max_request_size: 10485760  # 10MB max request
  
# Security Headers (Maximum for Production)
security_headers:
  content_security_policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
  x_frame_options: "DENY"
  x_content_type_options: "nosniff"
  strict_transport_security: "max-age=31536000; includeSubDomains"
  referrer_policy: "strict-origin-when-cross-origin"
  
# SSL/TLS Configuration (Production)
ssl:
  enabled: true
  cert_path: "/etc/ssl/certs/iacherie.crt"
  key_path: "/etc/ssl/private/iacherie.key"
  protocols:
    - "TLSv1.2"
    - "TLSv1.3"
  ciphers: "ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS"
  
# Backup Configuration (Production)
backup:
  enabled: true
  schedule: "0 2 * * *"     # Daily at 2 AM
  retention_days: 30
  encryption_enabled: true
  
  # Backup destinations
  destinations:
    - type: "s3"
      bucket: "${IACHERIE_BACKUP_BUCKET}"
      region: "${AWS_REGION}"
    - type: "azure"
      container: "${AZURE_BACKUP_CONTAINER}"
      
# Compliance (Production)
compliance:
  gdpr_enabled: true
  sox_enabled: true
  iso27001_enabled: true
  pci_dss_enabled: true
  
  # Audit logging
  audit_logging:
    enabled: true
    retain_days: 2555        # 7 years retention
    encryption_enabled: true
    
# Resource Limits (Production)
resources:
  cpu_limit: "2000m"        # 2 CPU cores
  memory_limit: "2Gi"       # 2GB memory
  disk_limit: "10Gi"        # 10GB disk
  
# Health Checks (Production)
health_checks:
  enabled: true
  endpoint: "/health"
  interval_seconds: 30
  timeout_seconds: 5
  failure_threshold: 3