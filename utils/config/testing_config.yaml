# Testing Environment Settings
environment:
  name: "testing"
  debug: false
  testing: true
  hot_reload: false
  profiling_enabled: false
  
# Performance Settings (Fast execution for tests)
performance:
  # Relaxed performance for faster test execution
  cache_operations_p95: 10    # Relaxed for test speed
  database_operations_p95: 200
  file_operations_p95: 500
  
  # Memory settings optimized for testing
  memory:
    max_heap_size_mb: 128     # Minimal memory for tests
    gc_strategy: "serial"     # Simple GC for predictable tests
    gc_threshold: 0.9
    
  # CPU settings for testing
  cpu:
    max_worker_threads: 2     # Minimal threads for deterministic tests
    enable_cpu_affinity: false
    
# Security Settings (Minimal for testing)
security:
  # Simplified encryption for testing
  encryption:
    symmetric_algorithm: "AES-256-GCM"
    key_rotation_days: 9999   # No rotation during tests
    kdf_iterations: 1000      # Minimal iterations for speed
    
  # Simplified authentication for testing
  authentication:
    jwt_algorithm: "HS256"
    access_token_expire_minutes: 60
    refresh_token_expire_days: 1
    max_login_attempts: 999   # No lockout during tests
    require_mfa: false
    password_min_length: 4    # Minimal for testing
    
  # Minimal validation for testing
  validation:
    max_input_size: 1048576   # 1MB for testing
    scan_for_xss: false       # Disabled for speed
    scan_for_sql_injection: false
    scan_for_nosql_injection: false
    check_file_headers: false
    
# Database Settings (Testing)
database:
  # In-memory database for testing
  url: "${AINFLUE_TEST_DATABASE_URL:-sqlite:///:memory:}"
  pool_size: 1              # Single connection for tests
  max_overflow: 0
  pool_timeout: 1
  echo_sql: false           # Minimal logging during tests
  
  # Testing-specific settings
  auto_create_tables: true  # Always create tables for tests
  drop_tables_on_startup: true  # Clean slate for each test run
  seed_test_data: false     # No default test data
  
# Cache Settings (Testing)
cache:
  # Minimal cache for testing
  l1_max_size: 100
  l1_ttl_seconds: 10        # Short TTL for testing
  l2_ttl_seconds: 30
  
  # In-memory cache for testing
  redis_url: "redis://localhost:6379/15"  # Use test DB
  enable_compression: false
  
# Logging Configuration (Minimal for testing)
logging:
  level: "ERROR"            # Minimal logging during tests
  format: "simple"
  enable_console: false     # No console output during tests
  enable_file: false        # No file logging during tests
  structured_logging: false
  include_trace: false
  log_sql_queries: false
  
# File Management (Testing)
file_management:
  max_file_size_mb: 1       # Small files for testing
  temp_directory: "/tmp/ainflue_test"
  scan_for_malware: false   # Disabled for speed
  enable_optimization: false
  
  # Limited file types for testing
  allowed_extensions:
    - ".txt"
    - ".json"
    - ".jpg"
    - ".png"
    
# Rate Limiting (Disabled for testing)
rate_limiting:
  default_rpm: 999999       # Unlimited for testing
  burst_rpm: 999999
  enable_per_user_limits: false
  enable_ip_blocking: false
  
# Monitoring (Minimal for testing)
monitoring:
  enable_prometheus: false  # Disabled during tests
  metrics_retention_days: 1
  cpu_threshold: 100.0      # No alerts during tests
  memory_threshold: 100.0
  disk_threshold: 100.0
  
# Creator Economy (Testing)
creator_economy:
  # Content processing for testing
  content_processing:
    enable_async_processing: false  # Synchronous for tests
    max_processing_time_seconds: 10
    enable_preview_generation: false
    
  # Testing collaboration features
  collaboration:
    max_collaborators: 2
    enable_real_time_features: false
    
  # Testing monetization (mock)
  monetization:
    test_mode: true
    commission_rate: 0.0      # No commission during tests
    minimum_payout: 0.01
    
# Feature Flags (Testing)
features:
  new_ui_enabled: false
  beta_features_enabled: false
  experimental_ai_enabled: false
  debug_panel_enabled: false
  hot_reload_enabled: false
  
# External Services (Mocked for testing)
external_services:
  # AI Services (Mocked)
  openai:
    api_key: "test_key"
    model: "gpt-3.5-turbo"
    mock_responses: true      # Always mock in tests
    
  # Payment Services (Mocked)
  stripe:
    publishable_key: "pk_test_mock"
    secret_key: "sk_test_mock"
    webhook_secret: "whsec_test_mock"
    
  # Email Services (Mocked)
  sendgrid:
    api_key: "test_key"
    mock_emails: true
    save_emails_to_file: false
    
# API Configuration (Testing)
api:
  # Open CORS for testing
  cors_origins:
    - "*"
  
  # Relaxed API limits for testing
  request_timeout: 10        # Quick timeout for tests
  max_request_size: 1048576  # 1MB for testing
  
# Testing Framework Configuration
testing_framework:
  # Test execution settings
  parallel_execution: true
  max_workers: 4
  test_timeout_seconds: 30
  
  # Test data management
  use_fixtures: true
  reset_database_between_tests: true
  cleanup_temp_files: true
  
  # Mock services
  mock_external_apis: true
  mock_file_system: false
  mock_database: false
  
# Test Categories Configuration
test_categories:
  # Unit tests
  unit_tests:
    enabled: true
    timeout_seconds: 5
    coverage_threshold: 90
    
  # Integration tests
  integration_tests:
    enabled: true
    timeout_seconds: 30
    database_required: true
    
  # End-to-end tests
  e2e_tests:
    enabled: false           # Disabled in testing env
    timeout_seconds: 120
    
  # Performance tests
  performance_tests:
    enabled: false           # Disabled in testing env
    timeout_seconds: 300
    
# Mock Data Configuration
mock_data:
  # User data
  users:
    count: 10
    with_profiles: true
    
  # Content data
  content:
    count: 50
    with_media: false        # No media files in tests
    
  # Transaction data
  transactions:
    count: 20
    amount_range: [1.0, 100.0]
    
# Test Database Configuration
test_database:
  # SQLite settings for fast tests
  database_path: ":memory:"
  enable_foreign_keys: true
  journal_mode: "WAL"
  
  # Connection settings
  connection_timeout: 1
  busy_timeout: 1000
  
# Cleanup Configuration
cleanup:
  # Automatic cleanup after tests
  cleanup_on_exit: true
  cleanup_temp_directories: true
  cleanup_log_files: true
  cleanup_cache_files: true
  
# Test Reporting
test_reporting:
  # Coverage reporting
  generate_coverage_report: true
  coverage_formats: ["html", "xml"]
  coverage_threshold: 85
  
  # Test results
  junit_xml_output: true
  html_report_output: true
  
# Continuous Integration Settings
ci_settings:
  # CI-specific optimizations
  optimize_for_ci: true
  skip_slow_tests: true
  fail_fast: true
  
  # Reporting for CI
  export_test_results: true
  export_coverage_data: true
  
# Resource Limits (Testing)
resources:
  cpu_limit: "500m"          # 0.5 CPU core
  memory_limit: "512Mi"      # 512MB memory
  disk_limit: "1Gi"          # 1GB disk
  
# Security Headers (Minimal for testing)
security_headers:
  content_security_policy: "default-src *"
  x_frame_options: "ALLOWALL"
  strict_transport_security: false
  
# Error Handling (Testing)
error_handling:
  # Fail fast for testing
  fail_on_first_error: true
  raise_on_warnings: false
  strict_mode: true
  
# Test Isolation
test_isolation:
  # Process isolation
  isolate_processes: false
  isolate_database: true
  isolate_cache: true
  isolate_file_system: true