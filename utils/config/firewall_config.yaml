# ===========================================
# FIREWALL CONFIGURATION - AINFLUE UTILS
# ===========================================
# Author: Fahed Mlaiel (mlaiel@live.de)
# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.
# Module: Enterprise Network Security Configuration
# Purpose: Comprehensive firewall rules and network protection

firewall:
  # =======================
  # GLOBAL FIREWALL SETTINGS
  # =======================
  global:
    enabled: true
    default_policy: "DENY"
    logging_enabled: true
    log_level: "INFO"
    log_dropped_packets: true
    log_accepted_packets: false
    rate_limiting: true
    connection_tracking: true
    
    # Performance Settings
    performance:
      max_connections: 1000000
      connection_timeout: 300
      tcp_timeout: 7200
      udp_timeout: 30
      icmp_timeout: 30

  # =======================
  # INBOUND RULES
  # =======================
  inbound:
    # Web Traffic (HTTP/HTTPS)
    web_traffic:
      - rule_name: "HTTPS_PUBLIC"
        action: "ALLOW"
        protocol: "TCP"
        port: 443
        source: "0.0.0.0/0"
        destination: "web_servers"
        priority: 100
        rate_limit: "1000/min"
        
      - rule_name: "HTTP_REDIRECT"
        action: "ALLOW"
        protocol: "TCP"
        port: 80
        source: "0.0.0.0/0"
        destination: "web_servers"
        priority: 101
        rate_limit: "1000/min"
    
    # API Traffic
    api_traffic:
      - rule_name: "API_GATEWAY"
        action: "ALLOW"
        protocol: "TCP"
        port: 8000
        source: "0.0.0.0/0"
        destination: "api_servers"
        priority: 200
        rate_limit: "2000/min"
        
      - rule_name: "API_ADMIN"
        action: "ALLOW"
        protocol: "TCP"
        port: 8443
        source: "admin_networks"
        destination: "api_servers"
        priority: 201
        rate_limit: "100/min"
    
    # SSH Access (Admin Only)
    ssh_access:
      - rule_name: "SSH_ADMIN"
        action: "ALLOW"
        protocol: "TCP"
        port: 22
        source: "admin_networks"
        destination: "all_servers"
        priority: 300
        rate_limit: "10/min"
    
    # Database Access (Internal Only)
    database_access:
      - rule_name: "POSTGRESQL"
        action: "ALLOW"
        protocol: "TCP"
        port: 5432
        source: "app_servers"
        destination: "database_servers"
        priority: 400
        
      - rule_name: "REDIS"
        action: "ALLOW"
        protocol: "TCP"
        port: 6379
        source: "app_servers"
        destination: "cache_servers"
        priority: 401
        
      - rule_name: "MONGODB"
        action: "ALLOW"
        protocol: "TCP"
        port: 27017
        source: "app_servers"
        destination: "document_stores"
        priority: 402
    
    # Monitoring and Metrics
    monitoring:
      - rule_name: "PROMETHEUS"
        action: "ALLOW"
        protocol: "TCP"
        port: 9090
        source: "monitoring_networks"
        destination: "monitoring_servers"
        priority: 500
        
      - rule_name: "GRAFANA"
        action: "ALLOW"
        protocol: "TCP"
        port: 3000
        source: "admin_networks"
        destination: "monitoring_servers"
        priority: 501
        
      - rule_name: "ELASTICSEARCH"
        action: "ALLOW"
        protocol: "TCP"
        port: 9200
        source: "log_collectors"
        destination: "search_servers"
        priority: 502

  # =======================
  # OUTBOUND RULES
  # =======================
  outbound:
    # External API Calls
    external_apis:
      - rule_name: "HTTPS_EXTERNAL"
        action: "ALLOW"
        protocol: "TCP"
        port: 443
        source: "app_servers"
        destination: "0.0.0.0/0"
        priority: 600
        
      - rule_name: "HTTP_EXTERNAL"
        action: "ALLOW"
        protocol: "TCP"
        port: 80
        source: "app_servers"
        destination: "0.0.0.0/0"
        priority: 601
    
    # DNS Resolution
    dns:
      - rule_name: "DNS_UDP"
        action: "ALLOW"
        protocol: "UDP"
        port: 53
        source: "all_servers"
        destination: "dns_servers"
        priority: 700
        
      - rule_name: "DNS_TCP"
        action: "ALLOW"
        protocol: "TCP"
        port: 53
        source: "all_servers"
        destination: "dns_servers"
        priority: 701
    
    # NTP Time Synchronization
    ntp:
      - rule_name: "NTP_SYNC"
        action: "ALLOW"
        protocol: "UDP"
        port: 123
        source: "all_servers"
        destination: "ntp_servers"
        priority: 800
    
    # Email Services
    email:
      - rule_name: "SMTP_TLS"
        action: "ALLOW"
        protocol: "TCP"
        port: 587
        source: "mail_servers"
        destination: "external_smtp"
        priority: 900
        
      - rule_name: "SMTP_SSL"
        action: "ALLOW"
        protocol: "TCP"
        port: 465
        source: "mail_servers"
        destination: "external_smtp"
        priority: 901

  # =======================
  # NETWORK ZONES
  # =======================
  zones:
    dmz:
      description: "Demilitarized Zone"
      networks:
        - "10.0.1.0/24"
      allowed_services:
        - "web_traffic"
        - "api_traffic"
      security_level: "high"
      
    internal:
      description: "Internal Application Network"
      networks:
        - "10.0.10.0/24"
        - "10.0.11.0/24"
      allowed_services:
        - "database_access"
        - "internal_api"
      security_level: "medium"
      
    management:
      description: "Management Network"
      networks:
        - "10.0.100.0/24"
      allowed_services:
        - "ssh_access"
        - "monitoring"
        - "admin_access"
      security_level: "critical"
      
    database:
      description: "Database Network"
      networks:
        - "10.0.20.0/24"
      allowed_services:
        - "database_only"
      security_level: "critical"

  # =======================
  # INTRUSION DETECTION AND PREVENTION
  # =======================
  ids_ips:
    enabled: true
    
    # Intrusion Detection System
    ids:
      signature_based: true
      anomaly_based: true
      behavior_analysis: true
      machine_learning: true
      
      # Detection Rules
      rules:
        - name: "SQL_INJECTION"
          enabled: true
          severity: "HIGH"
          action: "ALERT"
          
        - name: "XSS_ATTACK"
          enabled: true
          severity: "HIGH"
          action: "ALERT"
          
        - name: "BRUTE_FORCE"
          enabled: true
          severity: "MEDIUM"
          action: "BLOCK"
          threshold: "10_attempts_per_minute"
          
        - name: "DDoS_DETECTION"
          enabled: true
          severity: "HIGH"
          action: "RATE_LIMIT"
          threshold: "1000_requests_per_second"
    
    # Intrusion Prevention System
    ips:
      auto_blocking: true
      temporary_blocks: true
      permanent_blocks: true
      whitelist_override: true
      
      # Response Actions
      response_actions:
        - action: "BLOCK_IP"
          duration: "1_hour"
          trigger: "HIGH_SEVERITY"
          
        - action: "RATE_LIMIT"
          duration: "10_minutes"
          trigger: "MEDIUM_SEVERITY"
          
        - action: "QUARANTINE"
          duration: "24_hours"
          trigger: "CRITICAL_SEVERITY"

  # =======================
  # DDoS PROTECTION
  # =======================
  ddos_protection:
    enabled: true
    
    # Rate Limiting
    rate_limiting:
      requests_per_second: 100
      burst_capacity: 1000
      sliding_window: 60
      
    # Traffic Shaping
    traffic_shaping:
      bandwidth_limiting: true
      priority_queuing: true
      traffic_classification: true
      
    # Mitigation Strategies
    mitigation:
      challenge_response: true
      captcha_verification: true
      behavioral_analysis: true
      geo_blocking: true
      
    # Cloud Protection
    cloud_protection:
      cloudflare_enabled: true
      aws_shield_enabled: true
      custom_scrubbing: true

  # =======================
  # WEB APPLICATION FIREWALL
  # =======================
  waf:
    enabled: true
    
    # OWASP Top 10 Protection
    owasp_protection:
      injection_attacks: true
      broken_authentication: true
      sensitive_data_exposure: true
      xml_external_entities: true
      broken_access_control: true
      security_misconfiguration: true
      cross_site_scripting: true
      insecure_deserialization: true
      vulnerable_components: true
      insufficient_logging: true
    
    # Custom Rules
    custom_rules:
      - name: "CREATOR_CONTENT_PROTECTION"
        pattern: ".*creator.*content.*extract.*"
        action: "BLOCK"
        severity: "HIGH"
        
      - name: "AI_MODEL_ACCESS"
        pattern: ".*model.*download.*"
        action: "RATE_LIMIT"
        severity: "MEDIUM"
        
      - name: "PAYMENT_FRAUD"
        pattern: ".*payment.*bypass.*"
        action: "BLOCK"
        severity: "CRITICAL"
    
    # Response Actions
    response_modes:
      detection_only: false
      prevention_mode: true
      learning_mode: false

  # =======================
  # GEO-BLOCKING
  # =======================
  geo_blocking:
    enabled: true
    
    # Blocked Countries (High-risk regions)
    blocked_countries:
      - "XX"  # Placeholder - configure based on risk assessment
      # Add specific country codes based on security requirements
    
    # Allowed Countries
    allowed_countries:
      - "US"  # United States
      - "CA"  # Canada
      - "GB"  # United Kingdom
      - "DE"  # Germany
      - "FR"  # France
      - "AU"  # Australia
      - "JP"  # Japan
      - "SG"  # Singapore
    
    # VPN/Proxy Detection
    vpn_proxy_blocking:
      enabled: true
      tor_blocking: true
      datacenter_blocking: false
      residential_proxy_blocking: false

  # =======================
  # SSL/TLS CONFIGURATION
  # =======================
  ssl_tls:
    # Certificate Management
    certificates:
      auto_renewal: true
      certificate_transparency: true
      ocsp_stapling: true
      
    # Protocol Configuration
    protocols:
      tls_1_3: true
      tls_1_2: true
      tls_1_1: false
      tls_1_0: false
      ssl_v3: false
      ssl_v2: false
    
    # Cipher Suites
    cipher_suites:
      - "TLS_AES_256_GCM_SHA384"
      - "TLS_CHACHA20_POLY1305_SHA256"
      - "TLS_AES_128_GCM_SHA256"
      - "ECDHE-RSA-AES256-GCM-SHA384"
      - "ECDHE-RSA-AES128-GCM-SHA256"
    
    # Security Headers
    security_headers:
      hsts: true
      hsts_max_age: 31536000
      hsts_include_subdomains: true
      hsts_preload: true

  # =======================
  # LOGGING AND MONITORING
  # =======================
  logging:
    # Log Configuration
    log_config:
      format: "json"
      level: "INFO"
      rotation: "daily"
      retention_days: 90
      compression: true
    
    # Log Types
    log_types:
      connection_logs: true
      blocked_attempts: true
      allowed_connections: false
      rule_matches: true
      performance_metrics: true
    
    # Integration
    integration:
      siem_forwarding: true
      syslog_forwarding: true
      cloud_logging: true
      real_time_alerts: true

  # =======================
  # PERFORMANCE OPTIMIZATION
  # =======================
  performance:
    # Connection Optimization
    connection_optimization:
      tcp_window_scaling: true
      tcp_fastopen: true
      keep_alive: true
      connection_pooling: true
    
    # Hardware Acceleration
    hardware_acceleration:
      ssl_offloading: true
      packet_processing: true
      crypto_acceleration: true
    
    # Load Balancing
    load_balancing:
      session_persistence: true
      health_checks: true
      failover: true
      auto_scaling: true

# =======================
# EMERGENCY PROCEDURES
# =======================
emergency:
  incident_response:
    automatic_blocking: true
    emergency_contacts: true
    escalation_procedures: true
    forensic_preservation: true
  
  backup_procedures:
    configuration_backup: true
    rule_backup: true
    log_backup: true
    emergency_restore: true

