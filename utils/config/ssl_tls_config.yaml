# ===========================================
# SSL/TLS CONFIGURATION - IACHERIE UTILS
# ===========================================
# Author: Fahed Mlaiel (mlaiel@live.de)
# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.
# Module: Enterprise SSL/TLS Security Configuration
# Purpose: Comprehensive SSL/TLS configuration for maximum security

ssl_tls:
  # =======================
  # GLOBAL SSL/TLS SETTINGS
  # =======================
  global:
    enabled: true
    enforce_https: true
    redirect_http_to_https: true
    strict_transport_security: true
    certificate_transparency: true
    
    # Security Policy
    security_policy: "strict"
    minimum_tls_version: "1.2"
    preferred_tls_version: "1.3"
    disable_insecure_protocols: true
    
    # Performance Settings
    performance:
      session_cache_enabled: true
      session_cache_size: "10MB"
      session_timeout: 300
      ocsp_stapling: true
      certificate_compression: true

  # =======================
  # CERTIFICATE MANAGEMENT
  # =======================
  certificates:
    # Certificate Authorities
    certificate_authorities:
      primary_ca: "Let's Encrypt"
      backup_ca: "DigiCert"
      enterprise_ca: "Internal CA"
      
    # Certificate Types
    certificate_types:
      wildcard_certificates: true
      san_certificates: true
      extended_validation: true
      domain_validation: true
      
    # Domains and Subdomains
    domains:
      primary_domain: "iacherie.com"
      api_domain: "api.iacherie.com"
      admin_domain: "admin.iacherie.com"
      cdn_domain: "cdn.iacherie.com"
      static_domain: "static.iacherie.com"
      
    # Certificate Specifications
    specifications:
      key_algorithm: "RSA"
      key_size: 4096
      signature_algorithm: "SHA256withRSA"
      validity_period_days: 90
      
    # Automatic Renewal
    auto_renewal:
      enabled: true
      renewal_threshold_days: 30
      notification_enabled: true
      backup_certificates: true
      rollback_capability: true
      
    # Certificate Monitoring
    monitoring:
      expiration_alerts: true
      validation_monitoring: true
      revocation_checking: true
      transparency_log_monitoring: true

  # =======================
  # TLS PROTOCOL CONFIGURATION
  # =======================
  protocols:
    # Supported Protocols
    supported_protocols:
      tls_1_3:
        enabled: true
        priority: 1
        cipher_suites:
          - "TLS_AES_256_GCM_SHA384"
          - "TLS_CHACHA20_POLY1305_SHA256"
          - "TLS_AES_128_GCM_SHA256"
          - "TLS_AES_128_CCM_SHA256"
          - "TLS_AES_128_CCM_8_SHA256"
          
      tls_1_2:
        enabled: true
        priority: 2
        cipher_suites:
          - "ECDHE-RSA-AES256-GCM-SHA384"
          - "ECDHE-RSA-AES128-GCM-SHA256"
          - "ECDHE-RSA-AES256-SHA384"
          - "ECDHE-RSA-AES128-SHA256"
          - "ECDHE-RSA-AES256-SHA"
          - "ECDHE-RSA-AES128-SHA"
          
    # Disabled Protocols (Security)
    disabled_protocols:
      tls_1_1:
        enabled: false
        reason: "Security vulnerability"
        
      tls_1_0:
        enabled: false
        reason: "Security vulnerability"
        
      ssl_v3:
        enabled: false
        reason: "POODLE vulnerability"
        
      ssl_v2:
        enabled: false
        reason: "Multiple vulnerabilities"

  # =======================
  # CIPHER SUITE CONFIGURATION
  # =======================
  cipher_suites:
    # TLS 1.3 Cipher Suites (AEAD)
    tls_1_3_suites:
      recommended:
        - name: "TLS_AES_256_GCM_SHA384"
          security_level: "high"
          performance: "good"
          enabled: true
          
        - name: "TLS_CHACHA20_POLY1305_SHA256"
          security_level: "high"
          performance: "excellent"
          enabled: true
          
        - name: "TLS_AES_128_GCM_SHA256"
          security_level: "medium"
          performance: "excellent"
          enabled: true
          
    # TLS 1.2 Cipher Suites
    tls_1_2_suites:
      high_security:
        - name: "ECDHE-RSA-AES256-GCM-SHA384"
          key_exchange: "ECDHE"
          authentication: "RSA"
          encryption: "AES256-GCM"
          mac: "SHA384"
          enabled: true
          
        - name: "ECDHE-ECDSA-AES256-GCM-SHA384"
          key_exchange: "ECDHE"
          authentication: "ECDSA"
          encryption: "AES256-GCM"
          mac: "SHA384"
          enabled: true
          
      medium_security:
        - name: "ECDHE-RSA-AES128-GCM-SHA256"
          key_exchange: "ECDHE"
          authentication: "RSA"
          encryption: "AES128-GCM"
          mac: "SHA256"
          enabled: true
          
    # Cipher Suite Ordering
    ordering:
      prefer_server_order: true
      security_first: true
      performance_consideration: true

  # =======================
  # KEY EXCHANGE CONFIGURATION
  # =======================
  key_exchange:
    # Elliptic Curve Configuration
    elliptic_curves:
      supported_curves:
        - "X25519"
        - "prime256v1"
        - "secp384r1"
        - "secp521r1"
        
      preferred_curve: "X25519"
      curve_ordering: "server_preference"
      
    # Diffie-Hellman Parameters
    diffie_hellman:
      enabled: true
      min_key_size: 2048
      preferred_key_size: 4096
      custom_parameters: true
      
    # RSA Key Exchange
    rsa_key_exchange:
      enabled: false  # Deprecated for forward secrecy
      reason: "No forward secrecy"

  # =======================
  # SECURITY HEADERS
  # =======================
  security_headers:
    # HTTP Strict Transport Security
    hsts:
      enabled: true
      max_age: 31536000  # 1 year
      include_subdomains: true
      preload: true
      
    # Content Security Policy
    csp:
      enabled: true
      default_src: "'self'"
      script_src: "'self' 'unsafe-inline'"
      style_src: "'self' 'unsafe-inline'"
      img_src: "'self' data: https:"
      connect_src: "'self'"
      font_src: "'self'"
      object_src: "'none'"
      media_src: "'self'"
      frame_src: "'none'"
      
    # X-Frame-Options
    x_frame_options:
      enabled: true
      value: "DENY"
      
    # X-Content-Type-Options
    x_content_type_options:
      enabled: true
      value: "nosniff"
      
    # Referrer Policy
    referrer_policy:
      enabled: true
      value: "strict-origin-when-cross-origin"
      
    # Permissions Policy
    permissions_policy:
      enabled: true
      camera: "none"
      microphone: "none"
      geolocation: "none"
      payment: "self"

  # =======================
  # CERTIFICATE PINNING
  # =======================
  certificate_pinning:
    # HTTP Public Key Pinning
    hpkp:
      enabled: false  # Deprecated
      reason: "Risk of self-DoS"
      
    # Certificate Transparency
    certificate_transparency:
      enabled: true
      monitor_logs: true
      alert_on_unauthorized: true
      
    # DNS-based Authentication
    dane:
      enabled: true
      tlsa_records: true
      validation_mode: "strict"

  # =======================
  # PERFORMANCE OPTIMIZATION
  # =======================
  performance:
    # Session Management
    session_management:
      session_resumption: true
      session_tickets: true
      ticket_rotation: true
      ticket_encryption: true
      
    # Connection Optimization
    connection_optimization:
      early_data: true  # TLS 1.3 0-RTT
      false_start: true
      tcp_fast_open: true
      
    # Compression
    compression:
      certificate_compression: true
      application_compression: false  # CRIME/BREACH protection
      
    # Hardware Acceleration
    hardware_acceleration:
      ssl_offloading: true
      crypto_acceleration: true
      dedicated_ssl_hardware: true

  # =======================
  # VULNERABILITY PROTECTION
  # =======================
  vulnerability_protection:
    # Known Vulnerability Mitigations
    mitigations:
      heartbleed_protection: true
      poodle_protection: true
      beast_protection: true
      crime_protection: true
      breach_protection: true
      lucky13_protection: true
      freak_protection: true
      logjam_protection: true
      
    # Cipher Suite Blacklist
    blacklisted_ciphers:
      - "RC4"
      - "DES"
      - "3DES"
      - "MD5"
      - "NULL"
      - "aNULL"
      - "eNULL"
      - "EXPORT"
      
    # Protocol Downgrade Protection
    downgrade_protection:
      tls_fallback_scsv: true
      version_intolerance_workaround: false

  # =======================
  # CERTIFICATE VALIDATION
  # =======================
  validation:
    # Client Certificate Validation
    client_certificates:
      enabled: false
      required_for_admin: true
      ca_verification: true
      crl_checking: true
      ocsp_verification: true
      
    # Certificate Chain Validation
    chain_validation:
      verify_chain: true
      check_expiration: true
      validate_hostname: true
      check_revocation: true
      
    # Extended Validation
    extended_validation:
      ev_certificate_preferred: true
      organization_validation: true
      legal_entity_verification: true

  # =======================
  # MONITORING AND ALERTING
  # =======================
  monitoring:
    # Certificate Monitoring
    certificate_monitoring:
      expiration_alerts: true
      validation_failures: true
      revocation_alerts: true
      transparency_log_monitoring: true
      
    # Connection Monitoring
    connection_monitoring:
      handshake_failures: true
      cipher_suite_usage: true
      protocol_version_usage: true
      performance_metrics: true
      
    # Security Monitoring
    security_monitoring:
      weak_cipher_attempts: true
      downgrade_attempts: true
      certificate_errors: true
      suspicious_activity: true
      
    # Alerting Configuration
    alerting:
      email_notifications: true
      slack_integration: true
      webhook_notifications: true
      severity_levels: true

  # =======================
  # COMPLIANCE REQUIREMENTS
  # =======================
  compliance:
    # Industry Standards
    standards:
      pci_dss: true
      hipaa: false
      sox: true
      gdpr: true
      
    # Security Frameworks
    frameworks:
      nist_cybersecurity: true
      iso_27001: true
      cis_controls: true
      
    # Audit Requirements
    audit:
      configuration_auditing: true
      access_logging: true
      change_tracking: true
      compliance_reporting: true

  # =======================
  # DISASTER RECOVERY
  # =======================
  disaster_recovery:
    # Backup Procedures
    backup:
      certificate_backup: true
      private_key_backup: true
      configuration_backup: true
      automated_backup: true
      
    # Recovery Procedures
    recovery:
      emergency_certificates: true
      rapid_deployment: true
      failover_procedures: true
      business_continuity: true
      
    # Testing
    testing:
      disaster_recovery_testing: true
      certificate_restoration_testing: true
      performance_impact_testing: true

# =======================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# =======================
environments:
  production:
    security_level: "maximum"
    performance_optimization: true
    monitoring_level: "comprehensive"
    
  staging:
    security_level: "high"
    performance_optimization: true
    monitoring_level: "standard"
    
  development:
    security_level: "medium"
    performance_optimization: false
    monitoring_level: "basic"

