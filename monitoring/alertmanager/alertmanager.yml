# AlertManager Configuration for Ainflue Platform
# Author: Fahed Mlaiel <mlaiel@live.de>
# Production-ready alerting with multi-channel notifications

global:
  # SMTP configuration for email notifications
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@ainflue.com'
  smtp_auth_username: 'alerts@ainflue.com'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true
  
  # Slack configuration
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  
  # Global settings
  resolve_timeout: 5m
  http_config:
    follow_redirects: true
  
# Route configuration for alert routing
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    # Critical alerts - immediate notification via all channels
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 15m
      routes:
        - match:
            service: 'api'
          receiver: 'api-critical'
        - match:
            service: 'database'
          receiver: 'database-critical'
        - match:
            service: 'ai-engine'
          receiver: 'ai-critical'
    
    # Warning alerts - delayed notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 2h
    
    # Info alerts - aggregated notification
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 12h
    
    # Business alerts - special handling
    - match:
        category: business
      receiver: 'business-alerts'
      group_wait: 1m
      repeat_interval: 30m
    
    # Security alerts - immediate security team notification
    - match:
        category: security
      receiver: 'security-alerts'
      group_wait: 0s
      repeat_interval: 10m
    
    # Performance alerts - technical team
    - match:
        category: performance
      receiver: 'performance-alerts'
      group_wait: 2m
      repeat_interval: 1h

# Receivers configuration
receivers:
  # Default webhook receiver
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true
        http_config:
          follow_redirects: true

  # Critical alerts - all channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'devops@ainflue.com'
        subject: '🔴 CRITICAL ALERT: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          {{ end }}
        headers:
          Subject: '🔴 CRITICAL: {{ .GroupLabels.alertname }}'
    
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#critical-alerts'
        username: 'AlertManager'
        icon_emoji: ':rotating_light:'
        title: '🔴 Critical Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        send_resolved: true
    
    webhook_configs:
      - url: '${SMS_WEBHOOK_URL}'
        send_resolved: true
        http_config:
          follow_redirects: true
        http_headers:
          'Content-Type': 'application/json'
          'Authorization': 'Bearer ${SMS_API_TOKEN}'

  # API Critical alerts
  - name: 'api-critical'
    email_configs:
      - to: 'api-team@ainflue.com,devops@ainflue.com'
        subject: '🔴 API CRITICAL: {{ .GroupLabels.alertname }}'
        body: |
          Critical API Alert Detected!
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          API Endpoint: {{ .Labels.endpoint }}
          Response Time: {{ .Labels.response_time }}
          Error Rate: {{ .Labels.error_rate }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          
          Dashboard: http://grafana.ainflue.com/d/api-overview
          Runbook: https://docs.ainflue.com/runbooks/api-critical
          {{ end }}
    
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#api-alerts'
        username: 'API AlertManager'
        icon_emoji: ':warning:'
        title: '🔴 API Critical Alert'
        text: |
          {{ range .Alerts }}
          *API Critical Issue Detected!*
          
          *Alert:* {{ .Annotations.summary }}
          *Endpoint:* {{ .Labels.endpoint }}
          *Response Time:* {{ .Labels.response_time }}
          *Error Rate:* {{ .Labels.error_rate }}
          *Instance:* {{ .Labels.instance }}
          
          <http://grafana.ainflue.com/d/api-overview|View Dashboard>
          <https://docs.ainflue.com/runbooks/api-critical|Runbook>
          {{ end }}

  # Database Critical alerts
  - name: 'database-critical'
    email_configs:
      - to: 'dba@ainflue.com,devops@ainflue.com'
        subject: '🔴 DATABASE CRITICAL: {{ .GroupLabels.alertname }}'
        body: |
          Critical Database Alert!
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Database: {{ .Labels.database }}
          Query Time: {{ .Labels.query_time }}
          Connections: {{ .Labels.connections }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          
          Dashboard: http://grafana.ainflue.com/d/database-overview
          Runbook: https://docs.ainflue.com/runbooks/database-critical
          {{ end }}

  # AI Engine Critical alerts
  - name: 'ai-critical'
    email_configs:
      - to: 'ai-team@ainflue.com,devops@ainflue.com'
        subject: '🔴 AI ENGINE CRITICAL: {{ .GroupLabels.alertname }}'
        body: |
          Critical AI Engine Alert!
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Model: {{ .Labels.model_name }}
          Inference Time: {{ .Labels.inference_time }}
          Accuracy: {{ .Labels.accuracy }}
          GPU Usage: {{ .Labels.gpu_usage }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          
          Dashboard: http://grafana.ainflue.com/d/ai-models
          Runbook: https://docs.ainflue.com/runbooks/ai-critical
          {{ end }}

  # Warning alerts
  - name: 'warning-alerts'
    email_configs:
      - to: 'devops@ainflue.com'
        subject: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          {{ end }}
    
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#monitoring'
        username: 'AlertManager'
        icon_emoji: ':warning:'
        title: '⚠️ Warning Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}

  # Info alerts
  - name: 'info-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#monitoring'
        username: 'AlertManager'
        icon_emoji: ':information_source:'
        title: 'ℹ️ Info Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.service }}
          {{ end }}

  # Business alerts
  - name: 'business-alerts'
    email_configs:
      - to: 'business@ainflue.com,management@ainflue.com'
        subject: '📊 BUSINESS ALERT: {{ .GroupLabels.alertname }}'
        body: |
          Business Metric Alert
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Metric: {{ .Labels.metric_name }}
          Value: {{ .Labels.metric_value }}
          Threshold: {{ .Labels.threshold }}
          Impact: {{ .Labels.business_impact }}
          Time: {{ .StartsAt }}
          
          Dashboard: http://grafana.ainflue.com/d/business-metrics
          {{ end }}
    
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#business-alerts'
        username: 'Business AlertManager'
        icon_emoji: ':chart_with_upwards_trend:'
        title: '📊 Business Alert'
        text: |
          {{ range .Alerts }}
          *Business Metric Alert*
          
          *Alert:* {{ .Annotations.summary }}
          *Metric:* {{ .Labels.metric_name }}
          *Value:* {{ .Labels.metric_value }}
          *Threshold:* {{ .Labels.threshold }}
          *Impact:* {{ .Labels.business_impact }}
          
          <http://grafana.ainflue.com/d/business-metrics|View Dashboard>
          {{ end }}

  # Security alerts
  - name: 'security-alerts'
    email_configs:
      - to: 'security@ainflue.com,devops@ainflue.com'
        subject: '🚨 SECURITY ALERT: {{ .GroupLabels.alertname }}'
        body: |
          SECURITY INCIDENT DETECTED!
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Threat Level: {{ .Labels.threat_level }}
          Source IP: {{ .Labels.source_ip }}
          User: {{ .Labels.user_id }}
          Action: {{ .Labels.action }}
          Time: {{ .StartsAt }}
          
          Security Dashboard: http://grafana.ainflue.com/d/security-monitoring
          Incident Response: https://docs.ainflue.com/security/incident-response
          {{ end }}
    
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#security-alerts'
        username: 'Security AlertManager'
        icon_emoji: ':rotating_light:'
        title: '🚨 Security Alert'
        text: |
          {{ range .Alerts }}
          *SECURITY INCIDENT DETECTED!*
          
          *Alert:* {{ .Annotations.summary }}
          *Threat Level:* {{ .Labels.threat_level }}
          *Source IP:* {{ .Labels.source_ip }}
          *User:* {{ .Labels.user_id }}
          *Action:* {{ .Labels.action }}
          
          <http://grafana.ainflue.com/d/security-monitoring|Security Dashboard>
          <https://docs.ainflue.com/security/incident-response|Incident Response>
          {{ end }}

  # Performance alerts
  - name: 'performance-alerts'
    email_configs:
      - to: 'performance@ainflue.com'
        subject: '⚡ PERFORMANCE: {{ .GroupLabels.alertname }}'
        body: |
          Performance Alert
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Response Time: {{ .Labels.response_time }}
          Throughput: {{ .Labels.throughput }}
          CPU Usage: {{ .Labels.cpu_usage }}
          Memory Usage: {{ .Labels.memory_usage }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          
          Performance Dashboard: http://grafana.ainflue.com/d/performance-overview
          {{ end }}
    
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#performance'
        username: 'Performance AlertManager'
        icon_emoji: ':zap:'
        title: '⚡ Performance Alert'
        text: |
          {{ range .Alerts }}
          *Performance Issue Detected*
          
          *Alert:* {{ .Annotations.summary }}
          *Response Time:* {{ .Labels.response_time }}
          *CPU Usage:* {{ .Labels.cpu_usage }}
          *Memory Usage:* {{ .Labels.memory_usage }}
          *Instance:* {{ .Labels.instance }}
          
          <http://grafana.ainflue.com/d/performance-overview|Performance Dashboard>
          {{ end }}

# Inhibit rules to prevent alert spam
inhibit_rules:
  # Inhibit critical alerts when emergency is firing
  - source_match:
      severity: 'emergency'
    target_match:
      severity: 'critical'
    equal: ['alertname', 'instance']
  
  # Inhibit warning alerts when critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
  
  # Inhibit info alerts when warning is firing
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'instance']
  
  # Inhibit instance alerts when service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*Instance.*'
    equal: ['service']

# Mute/silence configuration templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'