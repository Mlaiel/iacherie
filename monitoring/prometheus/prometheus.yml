# Prometheus Configuration for Ainflue Platform - Docker Compose
# Author: Fahed Mlaiel (mlaiel@live.de)
# Production-ready Prometheus setup for master/slave PostgreSQL monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ainflue-production'
    replica: 'prometheus-01'

rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # PostgreSQL Master monitoring
  - job_name: 'postgres-master'
    static_configs:
      - targets: ['postgres-exporter-master:9187']
    scrape_interval: 10s
    metrics_path: /metrics

  # PostgreSQL Slave monitoring  
  - job_name: 'postgres-slave'
    static_configs:
      - targets: ['postgres-exporter-slave:9188']
    scrape_interval: 10s
    metrics_path: /metrics

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 10s

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s

  # Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 10s

  # Ainflue API Service
  - job_name: 'ainflue-api'
    static_configs:
      - targets: ['ainflue-app:8000']
    scrape_interval: 15s
    metrics_path: /metrics

  # Ainflue Crawler Service
  - job_name: 'ainflue-crawler'
    static_configs:
      - targets: ['crawler-service:8001']
    scrape_interval: 30s
    metrics_path: /metrics

  # Ainflue Analytics Service
  - job_name: 'ainflue-analytics'
    static_configs:
      - targets: ['analytics-service:8002']
    scrape_interval: 30s
    metrics_path: /metrics

  # Ainflue AI Engine Service
  - job_name: 'ainflue-ai-engine'
    static_configs:
      - targets: ['ai-service:8003']
    scrape_interval: 30s
    metrics_path: /metrics

  # Ainflue Monetization Service
  - job_name: 'ainflue-monetization'
    static_configs:
      - targets: ['monetization-service:8004']
    scrape_interval: 30s
    metrics_path: /metrics