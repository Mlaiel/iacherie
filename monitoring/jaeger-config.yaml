# Jaeger Configuration for Distributed Tracing
# Complete setup for distributed tracing in Ainflue Platform
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

# Jaeger All-in-One Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
    component: tracing
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        component: tracing
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.51.0
        ports:
        - containerPort: 16686
          name: ui
          protocol: TCP
        - containerPort: 14268
          name: http-collector
          protocol: TCP
        - containerPort: 14250
          name: grpc-collector
          protocol: TCP
        - containerPort: 6831
          name: udp-compact
          protocol: UDP
        - containerPort: 6832
          name: udp-binary
          protocol: UDP
        - containerPort: 5778
          name: http-config
          protocol: TCP
        - containerPort: 14269
          name: admin-http
          protocol: TCP
        env:
        # Storage Configuration
        - name: SPAN_STORAGE_TYPE
          value: "elasticsearch"
        - name: ES_SERVER_URLS
          value: "http://elasticsearch:9200"
        - name: ES_INDEX_PREFIX
          value: "jaeger"
        - name: ES_NUM_SHARDS
          value: "1"
        - name: ES_NUM_REPLICAS
          value: "0"
        
        # Collector Configuration
        - name: COLLECTOR_ZIPKIN_HOST_PORT
          value: ":9411"
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        
        # Query Configuration
        - name: QUERY_BASE_PATH
          value: "/jaeger"
        - name: QUERY_MAX_CLOCK_SKEW_ADJUSTMENT
          value: "5s"
        
        # Sampling Configuration
        - name: SAMPLING_STRATEGIES_FILE
          value: "/etc/jaeger/sampling_strategies.json"
        
        # Agent Configuration
        - name: AGENT_TAGS
          value: "cluster=ainflue-production,environment=production"
        
        # Performance Configuration
        - name: COLLECTOR_QUEUE_SIZE
          value: "2000"
        - name: COLLECTOR_NUM_WORKERS
          value: "50"
        - name: COLLECTOR_GRPC_MAX_RECEIVE_MSG_SIZE
          value: "4194304"  # 4MB
        
        # Logging
        - name: LOG_LEVEL
          value: "info"
        
        resources:
          requests:
            memory: 512Mi
            cpu: 200m
          limits:
            memory: 1Gi
            cpu: 500m
        
        livenessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 10
          periodSeconds: 5
        
        volumeMounts:
        - name: jaeger-config
          mountPath: /etc/jaeger
          readOnly: true
      
      volumes:
      - name: jaeger-config
        configMap:
          name: jaeger-config

---
# Jaeger Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
    component: tracing
spec:
  type: ClusterIP
  ports:
  - name: ui
    port: 16686
    targetPort: ui
  - name: http-collector
    port: 14268
    targetPort: http-collector
  - name: grpc-collector
    port: 14250
    targetPort: grpc-collector
  - name: udp-compact
    port: 6831
    targetPort: udp-compact
    protocol: UDP
  - name: udp-binary
    port: 6832
    targetPort: udp-binary
    protocol: UDP
  - name: http-config
    port: 5778
    targetPort: http-config
  - name: admin-http
    port: 14269
    targetPort: admin-http
  selector:
    app: jaeger

---
# Jaeger Agent DaemonSet (for efficient trace collection)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: jaeger-agent
  namespace: monitoring
  labels:
    app: jaeger-agent
    component: tracing
spec:
  selector:
    matchLabels:
      app: jaeger-agent
  template:
    metadata:
      labels:
        app: jaeger-agent
        component: tracing
    spec:
      containers:
      - name: jaeger-agent
        image: jaegertracing/jaeger-agent:1.51.0
        ports:
        - containerPort: 6831
          name: udp-compact
          protocol: UDP
        - containerPort: 6832
          name: udp-binary
          protocol: UDP
        - containerPort: 5778
          name: http-config
          protocol: TCP
        - containerPort: 14271
          name: admin-http
          protocol: TCP
        env:
        - name: REPORTER_GRPC_HOST_PORT
          value: "jaeger:14250"
        - name: REPORTER_TYPE
          value: "grpc"
        - name: AGENT_TAGS
          value: "cluster=ainflue-production,environment=production"
        - name: LOG_LEVEL
          value: "info"
        args:
        - --reporter.grpc.host-port=jaeger:14250
        - --reporter.type=grpc
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m
      hostNetwork: false
      dnsPolicy: ClusterFirst

---
# Jaeger Agent Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  namespace: monitoring
  labels:
    app: jaeger-agent
    component: tracing
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: udp-compact
    port: 6831
    targetPort: udp-compact
    protocol: UDP
  - name: udp-binary
    port: 6832
    targetPort: udp-binary
    protocol: UDP
  - name: http-config
    port: 5778
    targetPort: http-config
  - name: admin-http
    port: 14271
    targetPort: admin-http
  selector:
    app: jaeger-agent

---
# Jaeger Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: monitoring
  labels:
    app: jaeger
    component: tracing
data:
  sampling_strategies.json: |
    {
      "service_strategies": [
        {
          "service": "ainflue-api-gateway",
          "type": "probabilistic",
          "param": 0.5,
          "max_traces_per_second": 100,
          "operation_strategies": [
            {
              "operation": "GET /health",
              "type": "probabilistic",
              "param": 0.1
            },
            {
              "operation": "GET /metrics",
              "type": "probabilistic",
              "param": 0.1
            }
          ]
        },
        {
          "service": "ainflue-ai-engine",
          "type": "probabilistic",
          "param": 1.0,
          "max_traces_per_second": 50
        },
        {
          "service": "ainflue-database",
          "type": "probabilistic",
          "param": 0.2,
          "max_traces_per_second": 20
        },
        {
          "service": "ainflue-redis",
          "type": "probabilistic",
          "param": 0.1,
          "max_traces_per_second": 10
        }
      ],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.1,
        "max_traces_per_second": 10
      },
      "per_operation_strategies": [
        {
          "operation": ".*health.*",
          "type": "probabilistic",
          "param": 0.05
        },
        {
          "operation": ".*metrics.*",
          "type": "probabilistic",
          "param": 0.05
        },
        {
          "operation": ".*error.*",
          "type": "probabilistic",
          "param": 1.0
        }
      ]
    }

---
# Jaeger Ingress for UI access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-ui
  namespace: monitoring
  labels:
    app: jaeger
    component: tracing
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "jaeger-auth"
    nginx.ingress.kubernetes.io/auth-realm: "Jaeger Tracing UI"
spec:
  rules:
  - host: monitoring.ainflue.com
    http:
      paths:
      - path: /jaeger(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: jaeger
            port:
              number: 16686
  tls:
  - hosts:
    - monitoring.ainflue.com
    secretName: monitoring-tls-cert