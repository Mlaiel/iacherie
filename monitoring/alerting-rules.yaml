# Ainflue Platform Alerting Rules
# Comprehensive alerting configuration for production monitoring
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright (c) 2025 Fahed Mlaiel. All rights reserved.

groups:
  # Infrastructure Alerts
  - name: infrastructure.rules
    interval: 30s
    rules:
    # High CPU Usage
    - alert: HighCPUUsage
      expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
      for: 5m
      labels:
        severity: warning
        service: infrastructure
        component: node
      annotations:
        summary: "High CPU usage detected on {{ $labels.instance }}"
        description: "CPU usage is above 85% for more than 5 minutes on instance {{ $labels.instance }}. Current value: {{ $value }}%"
        runbook_url: "https://docs.ainflue.com/runbooks/high-cpu-usage"

    # High Memory Usage
    - alert: HighMemoryUsage
      expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
      for: 5m
      labels:
        severity: critical
        service: infrastructure
        component: node
      annotations:
        summary: "High memory usage detected on {{ $labels.instance }}"
        description: "Memory usage is above 90% for more than 5 minutes on instance {{ $labels.instance }}. Current value: {{ $value }}%"
        runbook_url: "https://docs.ainflue.com/runbooks/high-memory-usage"

    # Disk Space Critical
    - alert: DiskSpaceCritical
      expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
      for: 2m
      labels:
        severity: critical
        service: infrastructure
        component: storage
      annotations:
        summary: "Critical disk space usage on {{ $labels.instance }}"
        description: "Disk space usage is above 90% on {{ $labels.device }} at {{ $labels.instance }}. Current value: {{ $value }}%"
        runbook_url: "https://docs.ainflue.com/runbooks/disk-space-critical"

    # Node Down
    - alert: NodeDown
      expr: up{job="kubernetes-nodes"} == 0
      for: 1m
      labels:
        severity: critical
        service: infrastructure
        component: node
      annotations:
        summary: "Node {{ $labels.instance }} is down"
        description: "Node {{ $labels.instance }} has been down for more than 1 minute"
        runbook_url: "https://docs.ainflue.com/runbooks/node-down"

  # Application Alerts
  - name: application.rules
    interval: 15s
    rules:
    # API Gateway High Error Rate
    - alert: APIGatewayHighErrorRate
      expr: rate(http_requests_total{job="ainflue-api-gateway",status=~"5.."}[5m]) / rate(http_requests_total{job="ainflue-api-gateway"}[5m]) > 0.05
      for: 2m
      labels:
        severity: critical
        service: api-gateway
        component: application
      annotations:
        summary: "High error rate on API Gateway"
        description: "API Gateway error rate is above 5% for more than 2 minutes. Current rate: {{ $value | humanizePercentage }}"
        runbook_url: "https://docs.ainflue.com/runbooks/api-gateway-errors"

    # API Gateway High Response Time
    - alert: APIGatewayHighResponseTime
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="ainflue-api-gateway"}[5m])) > 2
      for: 3m
      labels:
        severity: warning
        service: api-gateway
        component: application
      annotations:
        summary: "High response time on API Gateway"
        description: "API Gateway 95th percentile response time is above 2 seconds for more than 3 minutes. Current value: {{ $value }}s"
        runbook_url: "https://docs.ainflue.com/runbooks/api-gateway-latency"

    # AI Engine Processing Queue Backup
    - alert: AIEngineQueueBackup
      expr: ai_processing_queue_length{job="ainflue-ai-engine"} > 50
      for: 5m
      labels:
        severity: warning
        service: ai-engine
        component: application
      annotations:
        summary: "AI Engine processing queue backup"
        description: "AI Engine processing queue length is above 50 for more than 5 minutes. Current value: {{ $value }}"
        runbook_url: "https://docs.ainflue.com/runbooks/ai-engine-queue-backup"

    # AI Engine High Processing Time
    - alert: AIEngineHighProcessingTime
      expr: ai_processing_duration_seconds{quantile="0.95",job="ainflue-ai-engine"} > 60
      for: 10m
      labels:
        severity: warning
        service: ai-engine
        component: application
      annotations:
        summary: "AI Engine high processing time"
        description: "AI Engine 95th percentile processing time is above 60 seconds for more than 10 minutes. Current value: {{ $value }}s"
        runbook_url: "https://docs.ainflue.com/runbooks/ai-engine-processing-time"

    # Service Down
    - alert: ServiceDown
      expr: up{job=~"ainflue-.*"} == 0
      for: 1m
      labels:
        severity: critical
        service: "{{ $labels.job }}"
        component: application
      annotations:
        summary: "Service {{ $labels.job }} is down"
        description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute"
        runbook_url: "https://docs.ainflue.com/runbooks/service-down"

  # Database Alerts
  - name: database.rules
    interval: 30s
    rules:
    # PostgreSQL High Connection Usage
    - alert: PostgreSQLHighConnections
      expr: pg_stat_database_numbackends{job="ainflue-database"} / pg_settings_max_connections{job="ainflue-database"} * 100 > 80
      for: 5m
      labels:
        severity: warning
        service: database
        component: postgresql
      annotations:
        summary: "PostgreSQL high connection usage"
        description: "PostgreSQL connection usage is above 80% for more than 5 minutes. Current value: {{ $value }}%"
        runbook_url: "https://docs.ainflue.com/runbooks/postgresql-high-connections"

    # PostgreSQL Slow Queries
    - alert: PostgreSQLSlowQueries
      expr: rate(pg_stat_database_blk_read_time{job="ainflue-database"}[5m]) > 1000
      for: 5m
      labels:
        severity: warning
        service: database
        component: postgresql
      annotations:
        summary: "PostgreSQL slow queries detected"
        description: "PostgreSQL is experiencing slow queries for more than 5 minutes. Current read time: {{ $value }}ms"
        runbook_url: "https://docs.ainflue.com/runbooks/postgresql-slow-queries"

    # Redis Memory Usage High
    - alert: RedisHighMemoryUsage
      expr: redis_memory_used_bytes{job="ainflue-redis"} / redis_memory_max_bytes{job="ainflue-redis"} * 100 > 90
      for: 5m
      labels:
        severity: critical
        service: cache
        component: redis
      annotations:
        summary: "Redis high memory usage"
        description: "Redis memory usage is above 90% for more than 5 minutes. Current value: {{ $value }}%"
        runbook_url: "https://docs.ainflue.com/runbooks/redis-high-memory"

    # Redis Connection Issues
    - alert: RedisConnectionIssues
      expr: redis_connected_clients{job="ainflue-redis"} > 100
      for: 5m
      labels:
        severity: warning
        service: cache
        component: redis
      annotations:
        summary: "Redis connection issues"
        description: "Redis has more than 100 connected clients for more than 5 minutes. Current value: {{ $value }}"
        runbook_url: "https://docs.ainflue.com/runbooks/redis-connection-issues"

  # Business Metrics Alerts
  - name: business.rules
    interval: 60s
    rules:
    # Low Content Upload Rate
    - alert: LowContentUploadRate
      expr: rate(content_uploads_total[10m]) < 1
      for: 15m
      labels:
        severity: warning
        service: business
        component: content-uploads
      annotations:
        summary: "Low content upload rate detected"
        description: "Content upload rate is below 1 per minute for more than 15 minutes. Current rate: {{ $value }}/min"
        runbook_url: "https://docs.ainflue.com/runbooks/low-content-upload-rate"

    # High Copyright Violation Detection Rate
    - alert: HighCopyrightViolationRate
      expr: rate(copyright_violations_detected_total[10m]) > 10
      for: 10m
      labels:
        severity: info
        service: business
        component: copyright-protection
      annotations:
        summary: "High copyright violation detection rate"
        description: "Copyright violation detection rate is above 10 per minute for more than 10 minutes. Current rate: {{ $value }}/min"
        runbook_url: "https://docs.ainflue.com/runbooks/high-copyright-violation-rate"

    # Revenue Generation Drop
    - alert: RevenueGenerationDrop
      expr: rate(revenue_generated_total[1h]) < rate(revenue_generated_total[1h] offset 24h) * 0.5
      for: 30m
      labels:
        severity: warning
        service: business
        component: monetization
      annotations:
        summary: "Revenue generation drop detected"
        description: "Revenue generation has dropped by more than 50% compared to the same time yesterday"
        runbook_url: "https://docs.ainflue.com/runbooks/revenue-generation-drop"

  # Kubernetes Alerts
  - name: kubernetes.rules
    interval: 30s
    rules:
    # Pod Crash Looping
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 0
      for: 5m
      labels:
        severity: critical
        service: kubernetes
        component: pod
      annotations:
        summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently"
        runbook_url: "https://docs.ainflue.com/runbooks/pod-crash-looping"

    # Pod Not Ready
    - alert: PodNotReady
      expr: kube_pod_status_ready{condition="false"} == 1
      for: 5m
      labels:
        severity: warning
        service: kubernetes
        component: pod
      annotations:
        summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for more than 5 minutes"
        runbook_url: "https://docs.ainflue.com/runbooks/pod-not-ready"

    # Deployment Replica Mismatch
    - alert: DeploymentReplicaMismatch
      expr: kube_deployment_spec_replicas != kube_deployment_status_available_replicas
      for: 5m
      labels:
        severity: warning
        service: kubernetes
        component: deployment
      annotations:
        summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replica mismatch"
        description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has a mismatch between desired and available replicas"
        runbook_url: "https://docs.ainflue.com/runbooks/deployment-replica-mismatch"