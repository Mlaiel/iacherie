version: '3.8'

services:
  # Support Agent Service
  support-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ia-support-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      - SUPPORT_DB_HOST=postgres
      - SUPPORT_DB_PORT=5432
      - SUPPORT_DB_NAME=ia_influencer_support
      - SUPPORT_DB_USER=support_user
      - SUPPORT_DB_PASSWORD=${SUPPORT_DB_PASSWORD:-secure_password_123}
      
      # Redis Configuration
      - SUPPORT_REDIS_URL=redis://redis:6379/2
      
      # AI Models Configuration
      - SUPPORT_CONVERSATION_MODEL=microsoft/DialoGPT-medium
      - SUPPORT_INTENT_MODEL=facebook/bart-large-mnli
      - SUPPORT_SENTIMENT_MODEL=cardiffnlp/twitter-roberta-base-sentiment-latest
      
      # Security
      - SUPPORT_ENCRYPTION_KEY=${SUPPORT_ENCRYPTION_KEY:-your-secret-encryption-key-here}
      - SUPPORT_JWT_SECRET=${SUPPORT_JWT_SECRET:-your-jwt-secret-here}
      
      # Performance
      - SUPPORT_MAX_CONCURRENT_CONVERSATIONS=1000
      - SUPPORT_RESPONSE_TIMEOUT=30
      - SUPPORT_ENVIRONMENT=production
    depends_on:
      - postgres
      - redis
    volumes:
      - support_logs:/app/logs
      - support_cache:/app/cache
      - support_models:/app/models
    networks:
      - support-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ia-support-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ia_influencer_support
      - POSTGRES_USER=support_user
      - POSTGRES_PASSWORD=${SUPPORT_DB_PASSWORD:-secure_password_123}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - support-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d ia_influencer_support"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ia-support-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - support-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: ia-support-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - support-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: ia-support-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - support-network
    depends_on:
      - prometheus

  # NGINX Load Balancer (for production scaling)
  nginx:
    image: nginx:alpine
    container_name: ia-support-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - support-agent
    networks:
      - support-network

# Named Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  support_logs:
    driver: local
  support_cache:
    driver: local
  support_models:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Networks
networks:
  support-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Development Override
---
# docker-compose.override.yml (for development)
version: '3.8'

services:
  support-agent:
    build:
      target: development
    environment:
      - SUPPORT_ENVIRONMENT=development
      - SUPPORT_MAX_CONCURRENT_CONVERSATIONS=100
    volumes:
      - .:/app
    command: ["python", "-m", "uvicorn", "support_agent.server:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  postgres:
    environment:
      - POSTGRES_DB=ia_influencer_support_dev
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"
