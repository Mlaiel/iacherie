# HAProxy Configuration for Ainflue Platform
# Enterprise-grade load balancing with health checks and SSL termination
#
# Author: Fahed Mlaiel (mlaiel@live.de)
# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.

global
    # Logging configuration
    log stdout local0 info
    
    # Security settings
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    
    # SSL/TLS configuration
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:RSA+AESGCM:RSA+SHA256:!aNULL:!MD5:!DSS
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    
    # Performance tuning
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    tune.maxrewrite 1024

defaults
    mode http
    log global
    
    # Timeouts
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout http-request 10s
    timeout http-keep-alive 2s
    timeout check 3s
    
    # Health check settings
    option httpchk GET /health
    option log-health-checks
    option dontlognull
    option http-server-close
    option redispatch
    
    # Error handling
    retries 3
    
    # Performance options
    option httplog
    option forwardfor
    option http-use-htx
    
    # Error pages
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Statistics interface
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    stats show-legends
    
    # Basic authentication for stats
    stats auth admin:ainflue_stats_2025
    
    # Custom stats page title
    stats realm Ainflue\ API\ Load\ Balancer

# SSL Termination Frontend
frontend ssl_frontend
    bind *:443 ssl crt /etc/ssl/certs/ainflue.pem alpn h2,http/1.1
    bind *:80
    
    # Redirect HTTP to HTTPS
    redirect scheme https code 301 if !{ ssl_fc }
    
    # Security headers
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    
    # Rate limiting
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request reject if { sc_http_req_rate(0) gt 20 }
    
    # Route to different backends based on path
    use_backend api_backend if { path_beg /api/ }
    use_backend docs_backend if { path_beg /docs }
    use_backend health_backend if { path /health }
    use_backend monitoring_backend if { path_beg /metrics }
    
    # Default backend
    default_backend api_backend

# API Backend Servers
backend api_backend
    balance roundrobin
    
    # Health check configuration
    option httpchk GET /health HTTP/1.1\r\nHost:\ api.ainflue.com
    http-check expect status 200
    
    # Enable cookie-based session persistence
    cookie SERVERID insert indirect nocache
    
    # Compression
    compression algo gzip
    compression type text/html text/css text/javascript application/javascript application/json
    
    # Backend servers (API instances)
    server api1 127.0.0.1:8001 check cookie api1 maxconn 1000 weight 100
    server api2 127.0.0.1:8002 check cookie api2 maxconn 1000 weight 100
    server api3 127.0.0.1:8003 check cookie api3 maxconn 1000 weight 100
    server api4 127.0.0.1:8004 check cookie api4 maxconn 1000 weight 100
    
    # Backup server
    server api_backup 127.0.0.1:8005 check cookie backup maxconn 500 weight 50 backup
    
    # Custom error responses
    http-request add-header X-Forwarded-Proto https if { ssl_fc }
    http-request add-header X-Real-IP %[src]
    
    # Response headers
    http-response add-header X-Backend-Server %[srv_name]
    http-response add-header X-Response-Time %[TR]

# Documentation Backend
backend docs_backend
    balance roundrobin
    
    # Static file servers for documentation
    server docs1 127.0.0.1:8080 check maxconn 500
    server docs2 127.0.0.1:8081 check maxconn 500
    
    # Cache static content
    http-response set-header Cache-Control "public, max-age=3600"

# Health Check Backend
backend health_backend
    balance roundrobin
    
    # Dedicated health check servers
    server health1 127.0.0.1:8001 check
    server health2 127.0.0.1:8002 check
    server health3 127.0.0.1:8003 check
    server health4 127.0.0.1:8004 check

# Monitoring Backend (Prometheus metrics)
backend monitoring_backend
    balance roundrobin
    
    # Monitoring endpoints
    server monitor1 127.0.0.1:9090 check
    server monitor2 127.0.0.1:9091 check
    
    # Authentication for monitoring
    http-request auth unless { http_auth(monitoring_users) }

# Orchestrator Services Backend
backend orchestrator_backend
    balance leastconn
    
    # AI-heavy services need least connection balancing
    option httpchk GET /health HTTP/1.1\r\nHost:\ orchestrator.ainflue.com
    
    # Orchestrator instances
    server collab1 127.0.0.1:8101 check maxconn 200 weight 100
    server collab2 127.0.0.1:8102 check maxconn 200 weight 100
    server gamif1 127.0.0.1:8201 check maxconn 200 weight 100
    server gamif2 127.0.0.1:8202 check maxconn 200 weight 100
    server seo1 127.0.0.1:8301 check maxconn 200 weight 100
    server seo2 127.0.0.1:8302 check maxconn 200 weight 100
    server dist1 127.0.0.1:8401 check maxconn 200 weight 100
    server dist2 127.0.0.1:8402 check maxconn 200 weight 100
    server sec1 127.0.0.1:8501 check maxconn 200 weight 100
    server sec2 127.0.0.1:8502 check maxconn 200 weight 100

# Validation Backend
backend validation_backend
    balance source
    
    # Source-based balancing for consistent validation results
    option httpchk GET /health HTTP/1.1\r\nHost:\ validation.ainflue.com
    
    server valid1 127.0.0.1:8601 check maxconn 300 weight 100
    server valid2 127.0.0.1:8602 check maxconn 300 weight 100
    server valid3 127.0.0.1:8603 check maxconn 300 weight 100

# Monetization Backend
backend monetization_backend
    balance roundrobin
    
    # Financial services need high availability
    option httpchk GET /health HTTP/1.1\r\nHost:\ monetization.ainflue.com
    http-check expect status 200
    
    # Enhanced security for financial operations
    http-request add-header X-Financial-Service "true"
    
    server money1 127.0.0.1:8701 check maxconn 500 weight 100
    server money2 127.0.0.1:8702 check maxconn 500 weight 100
    server money3 127.0.0.1:8703 check maxconn 500 weight 100

# Database Connection Pool Backend
backend database_backend
    balance leastconn
    
    # Database connections should use least connection
    option tcp-check
    
    server db1 127.0.0.1:5432 check port 5432 maxconn 100
    server db2 127.0.0.1:5433 check port 5433 maxconn 100
    server db_readonly 127.0.0.1:5434 check port 5434 maxconn 50 backup

# Redis Cache Backend
backend cache_backend
    balance consistent
    
    # Consistent hashing for cache distribution
    option tcp-check
    
    server redis1 127.0.0.1:6379 check port 6379 maxconn 1000
    server redis2 127.0.0.1:6380 check port 6380 maxconn 1000
    server redis3 127.0.0.1:6381 check port 6381 maxconn 1000

# User authentication for monitoring
userlist monitoring_users
    user prometheus password $6$rounds=10000$salt$hash_here
    user grafana password $6$rounds=10000$salt$hash_here

# ACL definitions for advanced routing
# Route orchestrator requests
acl is_collaboration path_beg /api/v1/collaboration
acl is_gamification path_beg /api/v1/gamification  
acl is_seo path_beg /api/v1/seo
acl is_distribution path_beg /api/v1/distribution
acl is_security path_beg /api/v1/security
acl is_validation path_beg /api/v1/validation
acl is_monetization path_beg /api/v1/monetization

# Performance ACLs
acl high_cpu_usage nbproc gt 80
acl high_memory_usage nbproc gt 85

# Security ACLs  
acl is_bot hdr_sub(user-agent) -i bot crawler spider
acl is_known_bad_ip src -f /etc/haproxy/blocked_ips.txt

# Frontend routing with ACLs
frontend advanced_routing
    bind *:8443 ssl crt /etc/ssl/certs/ainflue.pem
    
    # Block known bad IPs
    http-request deny if is_known_bad_ip
    
    # Rate limit bots more aggressively  
    http-request reject if is_bot { sc_http_req_rate(0) gt 5 }
    
    # Route to specialized backends
    use_backend orchestrator_backend if is_collaboration or is_gamification or is_seo or is_distribution or is_security
    use_backend validation_backend if is_validation
    use_backend monetization_backend if is_monetization
    
    # Default to main API
    default_backend api_backend

# Logging configuration
log-tag haproxy-ainflue

# Global limits
maxconn 4096
maxpipes 1024
spread-checks 5