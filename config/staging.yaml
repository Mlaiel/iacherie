# Staging Environment Configuration
# ================================

app:
  debug: false
  log_level: INFO
  reload: false
  workers: 2
  
database:
  host: staging-db.ainflue.com
  name: ainflue_staging
  pool_size: 10
  max_overflow: 15
  echo: false

redis:
  host: staging-redis.ainflue.com
  ssl: true
  max_connections: 50
  
security:
  cors_origins:
    - "https://staging.ainflue.com"
    - "https://staging-admin.ainflue.com"
  rate_limit_requests: 200
  rate_limit_window: 60

ai:
  max_batch_size: 16
  inference_timeout: 30
  gpu_enabled: true

storage:
  type: aws_s3
  aws_bucket: ainflue-staging-storage
  
monitoring:
  metrics_enabled: true
  metrics_port: 9090
  health_check_interval: 30
  log_structured: true
  
features:
  enable_swagger: true  # Enabled for staging testing
  enable_debug_toolbar: false
  enable_profiling: true
  mock_external_apis: false