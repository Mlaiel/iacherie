# Development Environment Configuration
# ===================================

app:
  debug: true
  log_level: DEBUG
  reload: true
  workers: 1
  
database:
  host: localhost
  port: 5432
  name: ainflue_dev
  pool_size: 5
  max_overflow: 10
  echo: true  # SQL logging in development

redis:
  host: localhost
  port: 6379
  db: 0
  
security:
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:8080"
  rate_limit_requests: 1000  # More lenient in dev
  rate_limit_window: 60

ai:
  model_path: "./models"
  max_batch_size: 8  # Smaller for dev machines
  inference_timeout: 60
  gpu_enabled: false

storage:
  type: local
  local_path: "./storage/dev"

monitoring:
  metrics_enabled: true
  metrics_port: 9090
  health_check_interval: 10  # More frequent in dev
  log_structured: false  # Human-readable logs

features:
  enable_swagger: true
  enable_debug_toolbar: true
  enable_profiling: true
  mock_external_apis: true