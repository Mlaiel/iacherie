[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=ai
    --cov=business
    --cov=api
    --cov=core
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    -v
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    performance: Tests de performance
    security: Tests de sécurité
    slow: Tests lents (>1s)
    fast: Tests rapides (<1s)
    ai: Tests des modules IA
    business: Tests logique métier
    api: Tests API
    database: Tests base de données
    asyncio: Tests asynchrones
    industrial: Tests industriels ultra-avancés
    chaos: Tests de chaos engineering
    compliance: Tests de conformité GDPR/CCPA
    load_10k: Tests de charge 10K+ utilisateurs
    sub_100ms: Tests de performance sub-100ms
    zero_mocks: Tests 100% réels sans mocks
    stress: Tests de stress système
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
