# DDoS Protection Zones - Multi-layered defense
limit_req_zone $binary_remote_addr zone=ddos_global:100m rate=1000r/s;
limit_req_zone $binary_remote_addr zone=ddos_api:50m rate=100r/s;
limit_req_zone $binary_remote_addr zone=ddos_login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ddos_upload:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ddos_search:30m rate=50r/s;

# Connection limiting zones
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn_zone $server_name zone=conn_per_server:10m;

# Bot detection and management
map $http_user_agent $is_bot {
    default 0;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*slurp 1;
    ~*duckduckbot 1;
    ~*baiduspider 1;
    ~*yandexbot 1;
    ~*facebookexternalhit 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*whatsapp 1;
    ~*telegrambot 1;
}

# Malicious bot detection
map $http_user_agent $is_malicious {
    default 0;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*zgrab 1;
    ~*shodan 1;
    ~*censys 1;
    ~*python-requests 1;
    ~*curl 1;
    ~*wget 1;
    "" 1;
}

# Suspicious request patterns
map $request_uri $is_suspicious {
    default 0;
    ~*\.\./\.\. 1;
    ~*union.*select 1;
    ~*script.*alert 1;
    ~*etc/passwd 1;
    ~*proc/self/environ 1;
    ~*wp-admin 1;
    ~*wp-login 1;
    ~*phpmyadmin 1;
    ~*\.php$ 1;
}

# SQL injection detection patterns
map $args $sql_injection {
    default 0;
    ~*union.*select 1;
    ~*insert.*into 1;
    ~*delete.*from 1;
    ~*drop.*table 1;
    ~*create.*table 1;
    ~*alter.*table 1;
    ~*exec.*xp_ 1;
    ~*sp_executesql 1;
}

# XSS detection patterns
map $args $xss_detected {
    default 0;
    ~*<script 1;
    ~*javascript: 1;
    ~*onclick= 1;
    ~*onload= 1;
    ~*onerror= 1;
    ~*eval\( 1;
    ~*alert\( 1;
    ~*document\.cookie 1;
}

# Security logging format
log_format security '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'bot=$is_bot malicious=$is_malicious '
                    'suspicious=$is_suspicious '
                    'sql_injection=$sql_injection '
                    'xss=$xss_detected '
                    'rate_limited=$limit_req_status '
                    'conn_limited=$limit_conn_status';