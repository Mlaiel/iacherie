# Advanced cache zones with different strategies
proxy_cache_path /var/cache/nginx/static 
    levels=2:2:2 
    keys_zone=static_cache:200m 
    max_size=20g 
    inactive=30d 
    use_temp_path=off 
    loader_threshold=400 
    loader_sleep=100ms
    manager_threshold=200
    manager_sleep=50ms;

proxy_cache_path /var/cache/nginx/api 
    levels=1:2 
    keys_zone=api_cache:100m 
    max_size=10g 
    inactive=1h 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/media 
    levels=2:2:2 
    keys_zone=media_cache:500m 
    max_size=100g 
    inactive=7d 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/microcache 
    levels=1:1 
    keys_zone=microcache:50m 
    max_size=2g 
    inactive=1m 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/fastcgi 
    levels=1:2 
    keys_zone=fastcgi_cache:100m 
    max_size=5g 
    inactive=60m 
    use_temp_path=off;

# Cache key maps for different content types
map $request_uri $cache_key_suffix {
    default "";
    ~*\.(css|js)$ "?v=$http_if_modified_since";
    ~*\.(png|jpg|jpeg|gif|webp)$ "?format=$http_accept";
}

# Cache control headers based on content type
map $sent_http_content_type $cache_control_header {
    default "no-cache, no-store, must-revalidate";
    ~*text/css "public, max-age=31536000, immutable";
    ~*text/javascript "public, max-age=31536000, immutable";
    ~*application/javascript "public, max-age=31536000, immutable";
    ~*image/ "public, max-age=2592000";
    ~*font/ "public, max-age=31536000, immutable";
    ~*video/ "public, max-age=86400";
    ~*audio/ "public, max-age=86400";
    ~*application/json "public, max-age=60";
    ~*text/html "public, max-age=0, must-revalidate";
}

# Cache bypass conditions
map $request_method$cookie_sessionid$arg_nocache $bypass_cache {
    default 0;
    ~.*POST.* 1;
    ~.*PUT.* 1;
    ~.*DELETE.* 1;
    ~.*PATCH.* 1;
    ~.*sessionid.* 1;
    ~.*nocache.* 1;
}

# Vary header optimization
map $http_accept_encoding $vary_header {
    default "Accept-Encoding";
    ~*gzip "Accept-Encoding, Accept";
    ~*br "Accept-Encoding, Accept";
}

# Compression configuration
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    text/csv
    text/vcard
    text/calendar
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    application/rdf+xml
    application/rss+xml
    application/xhtml+xml
    application/x-font-ttf
    application/vnd.ms-fontobject
    application/x-font-opentype
    application/font-woff
    application/font-woff2
    font/opentype
    image/svg+xml
    image/x-icon
    application/octet-stream
    application/vnd.api+json
    application/ld+json;

# Brotli compression (if available)
brotli on;
brotli_comp_level 6;
brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    application/rdf+xml
    image/svg+xml
    application/x-font-ttf
    application/vnd.ms-fontobject
    font/opentype;

# Image optimization and WebP support
map $http_accept $webp_suffix {
    default "";
    ~*webp ".webp";
}

# Progressive JPEG support
map $http_user_agent $progressive_jpeg {
    default 0;
    ~*Chrome 1;
    ~*Firefox 1;
    ~*Safari 1;
    ~*Edge 1;
}

# Content type optimization
map $uri $optimized_content_type {
    ~*\.css$ "text/css; charset=utf-8";
    ~*\.js$ "application/javascript; charset=utf-8";
    ~*\.json$ "application/json; charset=utf-8";
    ~*\.xml$ "application/xml; charset=utf-8";
    ~*\.svg$ "image/svg+xml; charset=utf-8";
    default "";
}

# Performance monitoring variables
map $upstream_response_time $performance_class {
    default "normal";
    ~^0\.[0-4] "fast";
    ~^0\.[5-9] "normal";
    ~^[1-2]\. "slow";
    ~^[3-9]\. "very_slow";
}

# Cache warming and preloading
map $request_uri $preload_resources {
    default "";
    ~*^/$ "</css/main.css>; rel=preload; as=style, </js/app.js>; rel=preload; as=script";
    ~*/user/ "</css/user.css>; rel=preload; as=style";
    ~*/creator/ "</css/creator.css>; rel=preload; as=style, </js/creator.js>; rel=preload; as=script";
}

# HTTP/2 Push optimization
map $sent_http_content_type $http2_push_resources {
    default "";
    ~*text/html "</css/critical.css>; rel=preload; as=style; nopush, </js/critical.js>; rel=preload; as=script; nopush";
}

# ETag generation for dynamic content
map $request_uri$args $etag_seed {
    default "$request_uri$args$request_time";
}

# Last-Modified optimization
map $sent_http_content_type $last_modified_header {
    default "";
    ~*text/css "$date_gmt";
    ~*text/javascript "$date_gmt";
    ~*image/ "$date_gmt";
}

# Performance logging
log_format performance '$remote_addr - [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      'rt=$request_time '
                      'urt=$upstream_response_time '
                      'cache=$upstream_cache_status '
                      'ratio=$gzip_ratio '
                      'perf_class=$performance_class '
                      'hit_ratio=$cache_hit_ratio';

# Cache statistics
map $upstream_cache_status $cache_hit {
    default 0;
    HIT 1;
}

map $upstream_cache_status $cache_miss {
    default 0;
    MISS 1;
}

# Open file cache for static content
open_file_cache max=50000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_min_uses 2;
open_file_cache_errors on;