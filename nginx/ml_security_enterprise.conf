# ML-BASED THREAT DETECTION CONFIGURATION
lua_package_path "/etc/nginx/lua/?.lua;;";
lua_shared_dict threat_detection 100m;
lua_shared_dict behavioral_analytics 50m;
lua_shared_dict ip_reputation 20m;
lua_shared_dict user_behavior 30m;

# REAL-TIME SECURITY ANALYTICS
init_by_lua_block {
    -- Initialize ML models for threat detection
    local threat_detector = require "ml_threat_detector"
    local behavior_analyzer = require "behavioral_analyzer"
    
    -- Load pre-trained models
    threat_detector.load_model("/etc/nginx/ml_models/threat_detection.model")
    behavior_analyzer.load_model("/etc/nginx/ml_models/user_behavior.model")
    
    -- Initialize security metrics
    ngx.shared.threat_detection:set("total_requests", 0)
    ngx.shared.threat_detection:set("threats_detected", 0)
    ngx.shared.threat_detection:set("false_positives", 0)
    ngx.shared.threat_detection:set("blocked_ips", 0)
}

# ADAPTIVE RATE LIMITING WITH ML
map $remote_addr $adaptive_rate_limit {
    default "normal_limit";
    ~^192\.168\. "internal_limit";
    ~^10\. "internal_limit";
}

# Behavioral-based rate limiting
limit_req_zone $binary_remote_addr zone=adaptive_limit:100m rate=50r/s;
limit_req_zone $binary_remote_addr zone=suspicious_limit:50m rate=5r/s;
limit_req_zone $binary_remote_addr zone=threat_limit:20m rate=1r/s;

# ML THREAT SCORING
map $request_uri $threat_score_base {
    default 0;
    ~*/admin/* 3;
    ~*/api/auth/* 2;
    ~*/upload/* 2;
    ~*/payment/* 4;
    ~*\.(php|asp|jsp)$ 5;
    ~*sql 8;
    ~*union 8;
    ~*select 6;
    ~*script 7;
}

# USER AGENT ANALYSIS
map $http_user_agent $ua_threat_score {
    default 0;
    "" 5;
    ~*bot 3;
    ~*crawler 2;
    ~*scanner 8;
    ~*curl 4;
    ~*wget 4;
    ~*python 3;
    ~*sqlmap 10;
    ~*nikto 10;
}

# GEO-LOCATION THREAT SCORING
geo $geo_threat_score {
    default 0;
    include /etc/nginx/conf.d/threat_countries.conf;
}

# BEHAVIORAL ANALYTICS MIDDLEWARE
access_by_lua_block {
    local threat_detector = require "ml_threat_detector"
    local behavior_analyzer = require "behavioral_analyzer"
    local ip_reputation = require "ip_reputation"
    
    -- Get client information
    local client_ip = ngx.var.remote_addr
    local user_agent = ngx.var.http_user_agent or ""
    local request_uri = ngx.var.request_uri
    local method = ngx.var.request_method
    local timestamp = ngx.time()
    
    -- Calculate threat scores
    local base_score = tonumber(ngx.var.threat_score_base) or 0
    local ua_score = tonumber(ngx.var.ua_threat_score) or 0
    local geo_score = tonumber(ngx.var.geo_threat_score) or 0
    
    -- Behavioral analysis
    local behavior_score = behavior_analyzer.analyze_request({
        ip = client_ip,
        user_agent = user_agent,
        uri = request_uri,
        method = method,
        timestamp = timestamp
    })
    
    -- IP reputation check
    local reputation_score = ip_reputation.check_ip(client_ip)
    
    -- Calculate final threat score
    local total_threat_score = base_score + ua_score + geo_score + behavior_score + reputation_score
    
    -- Apply ML model prediction
    local ml_prediction = threat_detector.predict({
        ip = client_ip,
        user_agent = user_agent,
        uri = request_uri,
        method = method,
        threat_score = total_threat_score,
        timestamp = timestamp
    })
    
    -- Set variables for downstream processing
    ngx.var.total_threat_score = total_threat_score
    ngx.var.ml_prediction = ml_prediction.score
    ngx.var.ml_confidence = ml_prediction.confidence
    
    -- Update metrics
    local current_requests = ngx.shared.threat_detection:incr("total_requests", 1, 0)
    
    -- Threat response logic
    if total_threat_score >= 15 or ml_prediction.score >= 0.8 then
        -- High threat - block immediately
        ngx.shared.threat_detection:incr("threats_detected", 1, 0)
        ngx.shared.threat_detection:incr("blocked_ips", 1, 0)
        
        -- Log security incident
        ngx.log(ngx.ERR, "High threat detected: IP=" .. client_ip .. 
                " Score=" .. total_threat_score .. 
                " ML_Score=" .. ml_prediction.score ..
                " Confidence=" .. ml_prediction.confidence)
        
        -- Return security error
        ngx.status = 403
        ngx.header.content_type = "application/json"
        ngx.say('{"error":"Security threat detected","code":"SEC_001","request_id":"' .. ngx.var.request_id .. '"}')
        ngx.exit(403)
        
    elseif total_threat_score >= 8 or ml_prediction.score >= 0.6 then
        -- Medium threat - apply rate limiting
        ngx.var.rate_limit_zone = "suspicious_limit"
        
    elseif total_threat_score >= 5 or ml_prediction.score >= 0.4 then
        -- Low threat - enhanced monitoring
        ngx.var.rate_limit_zone = "adaptive_limit"
    else
        -- Normal traffic
        ngx.var.rate_limit_zone = "adaptive_limit"
    end
    
    -- Store behavioral data for learning
    behavior_analyzer.store_interaction({
        ip = client_ip,
        user_agent = user_agent,
        uri = request_uri,
        method = method,
        threat_score = total_threat_score,
        ml_score = ml_prediction.score,
        timestamp = timestamp,
        blocked = (total_threat_score >= 15)
    })
}

# ADAPTIVE SECURITY HEADERS
header_filter_by_lua_block {
    local threat_score = tonumber(ngx.var.total_threat_score) or 0
    local ml_score = tonumber(ngx.var.ml_prediction) or 0
    
    -- Adaptive security headers based on threat level
    if threat_score >= 5 or ml_score >= 0.4 then
        ngx.header["X-Frame-Options"] = "DENY"
        ngx.header["X-Content-Type-Options"] = "nosniff"
        ngx.header["Referrer-Policy"] = "no-referrer"
        ngx.header["Permissions-Policy"] = "geolocation=(), microphone=(), camera=()"
    end
    
    -- Add security analytics headers
    ngx.header["X-Threat-Score"] = threat_score
    ngx.header["X-ML-Score"] = ml_score
    ngx.header["X-Security-Level"] = threat_score >= 8 and "high" or 
                                    threat_score >= 5 and "medium" or "low"
}

# ADVANCED DDoS PROTECTION
location / {
    # Apply adaptive rate limiting
    set $rate_zone $rate_limit_zone;
    limit_req zone=$rate_zone burst=20 nodelay;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 10;
    
    # Request size limiting
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    
    # Timeout optimization
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    
    # Continue with normal processing
    try_files $uri $uri/ @backend;
}

# ML-BASED CONTENT ANALYSIS
location /api/upload/ {
    # Enhanced security for uploads
    limit_req zone=suspicious_limit burst=5 nodelay;
    
    # Content analysis middleware
    access_by_lua_block {
        local content_analyzer = require "content_analyzer"
        local malware_detector = require "malware_detector"
        
        -- Analyze upload patterns
        local client_ip = ngx.var.remote_addr
        local content_type = ngx.var.http_content_type or ""
        local content_length = tonumber(ngx.var.http_content_length) or 0
        
        -- Check for suspicious upload patterns
        local upload_score = content_analyzer.analyze_upload({
            ip = client_ip,
            content_type = content_type,
            content_length = content_length,
            timestamp = ngx.time()
        })
        
        if upload_score >= 0.7 then
            ngx.log(ngx.WARN, "Suspicious upload detected: IP=" .. client_ip .. 
                    " Score=" .. upload_score)
            ngx.status = 400
            ngx.say('{"error":"Upload rejected for security reasons"}')
            ngx.exit(400)
        end
    }
    
    # Large file handling with security
    client_max_body_size 100m;
    proxy_request_buffering off;
    
    # Enhanced headers for upload security
    proxy_set_header X-Content-Security-Check "enabled";
    proxy_set_header X-Malware-Scan "required";
    
    proxy_pass http://content_management_service;
}

# ZERO-TRUST NETWORK ACCESS
location /api/admin/ {
    # Zero-trust verification
    access_by_lua_block {
        local zero_trust = require "zero_trust_verifier"
        local jwt_verifier = require "jwt_verifier"
        
        -- Multi-factor verification
        local auth_header = ngx.var.http_authorization or ""
        local client_cert = ngx.var.ssl_client_cert or ""
        local client_ip = ngx.var.remote_addr
        
        -- Verify JWT token
        local jwt_valid = jwt_verifier.verify(auth_header)
        if not jwt_valid then
            ngx.status = 401
            ngx.say('{"error":"Invalid authentication token"}')
            ngx.exit(401)
        end
        
        -- Zero-trust device verification
        local device_trusted = zero_trust.verify_device({
            client_cert = client_cert,
            ip = client_ip,
            user_agent = ngx.var.http_user_agent
        })
        
        if not device_trusted then
            ngx.status = 403
            ngx.say('{"error":"Device not trusted"}')
            ngx.exit(403)
        end
    }
    
    # Admin-specific rate limiting
    limit_req zone=threat_limit burst=2 nodelay;
    
    # Enhanced logging for admin access
    access_log /var/log/nginx/admin_access.log microservices;
    
    proxy_pass http://auth_service;
}

# REAL-TIME THREAT INTELLIGENCE
location /security/threat-intel {
    access_log off;
    
    content_by_lua_block {
        local threat_intel = require "threat_intelligence"
        
        -- Get real-time threat data
        local threats = threat_intel.get_current_threats()
        local metrics = {
            total_requests = ngx.shared.threat_detection:get("total_requests") or 0,
            threats_detected = ngx.shared.threat_detection:get("threats_detected") or 0,
            false_positives = ngx.shared.threat_detection:get("false_positives") or 0,
            blocked_ips = ngx.shared.threat_detection:get("blocked_ips") or 0,
            active_threats = threats
        }
        
        ngx.header.content_type = "application/json"
        ngx.say(require("cjson").encode(metrics))
    }
    
    # Restrict to security team
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny all;
}

# AUTOMATED INCIDENT RESPONSE
location /security/incidents {
    access_log off;
    
    content_by_lua_block {
        local incident_responder = require "incident_responder"
        
        if ngx.var.request_method == "POST" then
            -- Create new security incident
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            local incident_data = require("cjson").decode(body)
            
            local incident_id = incident_responder.create_incident(incident_data)
            
            ngx.header.content_type = "application/json"
            ngx.say('{"incident_id":"' .. incident_id .. '","status":"created"}')
        else
            -- Get active incidents
            local incidents = incident_responder.get_active_incidents()
            
            ngx.header.content_type = "application/json"
            ngx.say(require("cjson").encode(incidents))
        end
    }
    
    # Security team access only
    auth_basic "Security Incidents";
    auth_basic_user_file /etc/nginx/security_htpasswd;
}

# COMPLIANCE MONITORING
location /security/compliance {
    access_log off;
    
    content_by_lua_block {
        local compliance_monitor = require "compliance_monitor"
        
        -- Check GDPR compliance
        local gdpr_status = compliance_monitor.check_gdpr_compliance()
        
        -- Check DMCA compliance
        local dmca_status = compliance_monitor.check_dmca_compliance()
        
        -- Check security standards compliance
        local security_compliance = compliance_monitor.check_security_standards()
        
        local compliance_report = {
            gdpr = gdpr_status,
            dmca = dmca_status,
            security = security_compliance,
            last_audit = compliance_monitor.get_last_audit_date(),
            next_audit = compliance_monitor.get_next_audit_date()
        }
        
        ngx.header.content_type = "application/json"
        ngx.say(require("cjson").encode(compliance_report))
    }
    
    # Compliance team access
    allow 10.0.0.0/8;
    deny all;
}

# SECURITY METRICS ENDPOINT
location /metrics/security {
    access_log off;
    
    content_by_lua_block {
        -- Generate Prometheus security metrics
        local metrics = {
            "# TYPE nginx_security_threats_total counter",
            "nginx_security_threats_total " .. (ngx.shared.threat_detection:get("threats_detected") or 0),
            "",
            "# TYPE nginx_security_requests_total counter", 
            "nginx_security_requests_total " .. (ngx.shared.threat_detection:get("total_requests") or 0),
            "",
            "# TYPE nginx_security_blocked_ips_total counter",
            "nginx_security_blocked_ips_total " .. (ngx.shared.threat_detection:get("blocked_ips") or 0),
            "",
            "# TYPE nginx_security_false_positives_total counter",
            "nginx_security_false_positives_total " .. (ngx.shared.threat_detection:get("false_positives") or 0)
        }
        
        ngx.header.content_type = "text/plain"
        ngx.say(table.concat(metrics, "\n"))
    }
    
    # Monitoring systems only
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}

# SECURITY DASHBOARD
location /dashboard/security {
    root /var/www/html/dashboards;
    index security-dashboard.html;
    
    # Security team access
    auth_basic "Security Dashboard";
    auth_basic_user_file /etc/nginx/security_htpasswd;
    
    add_header X-Dashboard-Type "security-monitoring";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options "SAMEORIGIN";
}

# SECURITY LOGGING
log_format security '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   '$request_time $upstream_response_time '
                   '"$total_threat_score" "$ml_prediction" "$ml_confidence" '
                   '"$request_id" "$rate_limit_zone"';

# SECURITY ERROR PAGES
error_page 403 /security_blocked.html;
location = /security_blocked.html {
    root /var/www/html/errors;
    internal;
    add_header Content-Type text/html;
    add_header X-Error-Type "security-blocked";
}

# MODEL UPDATE ENDPOINT
location /security/models/update {
    access_log off;
    
    content_by_lua_block {
        local model_updater = require "model_updater"
        
        if ngx.var.request_method == "POST" then
            -- Update ML models
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            local update_data = require("cjson").decode(body)
            
            local success = model_updater.update_models(update_data)
            
            ngx.header.content_type = "application/json"
            ngx.say('{"success":' .. tostring(success) .. ',"timestamp":"' .. ngx.time() .. '"}')
        else
            -- Get model status
            local model_status = model_updater.get_model_status()
            
            ngx.header.content_type = "application/json"
            ngx.say(require("cjson").encode(model_status))
        end
    }
    
    # ML team access only
    allow 10.0.1.0/24;
    deny all;
}