# DATABASE CONNECTION POOL OPTIMIZATION
upstream postgresql_primary {
    least_conn;
    server postgres-primary-1.db.internal:5432 max_fails=2 fail_timeout=30s weight=6;
    server postgres-primary-2.db.internal:5432 max_fails=2 fail_timeout=30s weight=4 backup;
    keepalive 128;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream postgresql_read_replicas {
    least_conn;
    server postgres-read-1.db.internal:5432 max_fails=3 fail_timeout=20s weight=5;
    server postgres-read-2.db.internal:5432 max_fails=3 fail_timeout=20s weight=5;
    server postgres-read-3.db.internal:5432 max_fails=3 fail_timeout=20s weight=3;
    keepalive 64;
    keepalive_requests 2000;
    keepalive_timeout 90s;
}

upstream mongodb_cluster {
    least_conn;
    server mongo-primary.db.internal:27017 max_fails=2 fail_timeout=30s weight=6;
    server mongo-secondary-1.db.internal:27017 max_fails=3 fail_timeout=20s weight=4;
    server mongo-secondary-2.db.internal:27017 max_fails=3 fail_timeout=20s weight=4;
    keepalive 96;
    keepalive_requests 1500;
    keepalive_timeout 75s;
}

upstream redis_cluster {
    ip_hash;
    server redis-master.cache.internal:6379 max_fails=1 fail_timeout=10s weight=5;
    server redis-slave-1.cache.internal:6379 max_fails=2 fail_timeout=15s weight=3;
    server redis-slave-2.cache.internal:6379 max_fails=2 fail_timeout=15s weight=3;
    keepalive 200;
    keepalive_requests 5000;
    keepalive_timeout 120s;
}

upstream elasticsearch_cluster {
    least_conn;
    server elasticsearch-1.search.internal:9200 max_fails=3 fail_timeout=30s weight=4;
    server elasticsearch-2.search.internal:9200 max_fails=3 fail_timeout=30s weight=4;
    server elasticsearch-3.search.internal:9200 max_fails=3 fail_timeout=30s weight=4;
    keepalive 48;
    keepalive_requests 800;
    keepalive_timeout 60s;
}

# DATABASE CACHE OPTIMIZATION
proxy_cache_path /var/cache/nginx/db_queries 
    levels=1:2 
    keys_zone=db_cache:1g 
    max_size=20g 
    inactive=6h 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/analytics_data 
    levels=1:2 
    keys_zone=analytics_cache:512m 
    max_size=15g 
    inactive=4h 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/search_results 
    levels=1:2 
    keys_zone=search_cache:256m 
    max_size=5g 
    inactive=2h 
    use_temp_path=off;

# DATABASE CONNECTION RATE LIMITING
limit_req_zone $binary_remote_addr zone=db_read_limit:100m rate=100r/s;
limit_req_zone $binary_remote_addr zone=db_write_limit:50m rate=20r/s;
limit_req_zone $binary_remote_addr zone=analytics_limit:50m rate=50r/s;

# CONNECTION POOLING LUA INITIALIZATION
init_by_lua_block {
    local db_pool = require "resty.db_pool"
    local performance_monitor = require "performance_monitor"
    
    -- Initialize database connection pools
    db_pool.init({
        postgresql = {
            max_connections = 200,
            idle_timeout = 60,
            pool_size = 50
        },
        mongodb = {
            max_connections = 150,
            idle_timeout = 90,
            pool_size = 40
        },
        redis = {
            max_connections = 500,
            idle_timeout = 120,
            pool_size = 100
        }
    })
    
    -- Initialize performance monitoring
    performance_monitor.init()
}

# DATABASE READ OPERATIONS
location /api/data/read/ {
    # Read-optimized rate limiting
    limit_req zone=db_read_limit burst=50 nodelay;
    
    # Query optimization middleware
    access_by_lua_block {
        local query_optimizer = require "query_optimizer"
        local cache_manager = require "cache_manager"
        
        -- Analyze query parameters
        local query_params = ngx.req.get_uri_args()
        local query_type = query_params.type or "default"
        local cache_key = query_optimizer.generate_cache_key(query_params)
        
        -- Check cache first
        local cached_result = cache_manager.get(cache_key)
        if cached_result then
            ngx.header.content_type = "application/json"
            ngx.header["X-Cache-Hit"] = "true"
            ngx.header["X-Cache-Key"] = cache_key
            ngx.say(cached_result)
            ngx.exit(200)
        end
        
        -- Set cache control headers
        ngx.var.cache_key = cache_key
        ngx.var.cache_ttl = query_optimizer.get_cache_ttl(query_type)
    }
    
    # Route to read replicas
    proxy_pass http://postgresql_read_replicas;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Query-Type $arg_type;
    proxy_set_header X-User-ID $http_x_user_id;
    
    # Database-optimized timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Query result caching
    proxy_cache db_cache;
    proxy_cache_key $cache_key;
    proxy_cache_valid 200 $cache_ttl;
    proxy_cache_valid 404 5m;
    proxy_cache_bypass $arg_nocache;
    
    # Response optimization
    proxy_buffering on;
    proxy_buffer_size 64k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
    
    # Cache result for future requests
    header_filter_by_lua_block {
        local cache_manager = require "cache_manager"
        
        if ngx.status == 200 and ngx.var.cache_key then
            local cache_ttl = tonumber(ngx.var.cache_ttl) or 300
            cache_manager.set_with_ttl(ngx.var.cache_key, "", cache_ttl)
        end
    }
    
    add_header X-DB-Server $upstream_addr;
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Query-Time $upstream_response_time;
}

# DATABASE WRITE OPERATIONS
location /api/data/write/ {
    # Write-specific rate limiting
    limit_req zone=db_write_limit burst=10 nodelay;
    
    # Transaction optimization
    access_by_lua_block {
        local transaction_manager = require "transaction_manager"
        local performance_monitor = require "performance_monitor"
        
        -- Start performance tracking
        local start_time = ngx.now()
        ngx.var.transaction_start = start_time
        
        -- Validate write operation
        ngx.req.read_body()
        local body = ngx.req.get_body_data()
        if not body then
            ngx.status = 400
            ngx.say('{"error":"No data provided"}')
            ngx.exit(400)
        end
        
        -- Parse and validate data
        local success, data = pcall(require("cjson").decode, body)
        if not success then
            ngx.status = 400
            ngx.say('{"error":"Invalid JSON data"}')
            ngx.exit(400)
        end
        
        -- Transaction preparation
        local transaction_id = transaction_manager.prepare_transaction(data)
        ngx.var.transaction_id = transaction_id
        
        -- Set transaction headers
        ngx.req.set_header("X-Transaction-ID", transaction_id)
        ngx.req.set_header("X-Write-Type", data.type or "default")
    }
    
    # Route to primary database
    proxy_pass http://postgresql_primary;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Transaction-ID $transaction_id;
    proxy_set_header X-User-ID $http_x_user_id;
    
    # Write-optimized timeouts
    proxy_connect_timeout 3s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # No caching for writes
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    
    # Transaction completion handling
    header_filter_by_lua_block {
        local transaction_manager = require "transaction_manager"
        local performance_monitor = require "performance_monitor"
        
        if ngx.var.transaction_id then
            local start_time = tonumber(ngx.var.transaction_start) or ngx.now()
            local duration = ngx.now() - start_time
            
            if ngx.status == 200 then
                transaction_manager.commit_transaction(ngx.var.transaction_id)
                performance_monitor.record_write_success(duration)
            else
                transaction_manager.rollback_transaction(ngx.var.transaction_id)
                performance_monitor.record_write_failure(duration)
            end
        end
    }
    
    add_header X-DB-Server $upstream_addr;
    add_header X-Transaction-ID $transaction_id;
    add_header X-Write-Time $upstream_response_time;
}

# ANALYTICS DATA PROCESSING
location /api/analytics/ {
    # Analytics-specific rate limiting
    limit_req zone=analytics_limit burst=30 nodelay;
    
    # Analytics optimization
    access_by_lua_block {
        local analytics_optimizer = require "analytics_optimizer"
        local query_params = ngx.req.get_uri_args()
        
        -- Optimize analytics queries
        local optimized_query = analytics_optimizer.optimize_query(query_params)
        ngx.var.optimized_query = optimized_query.query
        ngx.var.query_complexity = optimized_query.complexity
        
        -- Route based on query complexity
        if optimized_query.complexity == "high" then
            ngx.var.analytics_backend = "analytics_heavy"
        else
            ngx.var.analytics_backend = "analytics_standard"
        end
    }
    
    # Route to appropriate analytics backend
    proxy_pass http://postgresql_read_replicas;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Analytics-Query $optimized_query;
    proxy_set_header X-Query-Complexity $query_complexity;
    
    # Analytics-specific timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # Analytics caching
    proxy_cache analytics_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri$args";
    proxy_cache_valid 200 10m;
    proxy_cache_valid 404 2m;
    
    add_header X-Analytics-Server $upstream_addr;
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Query-Complexity $query_complexity;
}

# SEARCH OPERATIONS
location /api/search/ {
    # Search rate limiting
    limit_req zone=db_read_limit burst=40 nodelay;
    
    # Search optimization
    access_by_lua_block {
        local search_optimizer = require "search_optimizer"
        local query_params = ngx.req.get_uri_args()
        
        -- Optimize search query
        local search_query = query_params.q or ""
        local optimized_search = search_optimizer.optimize(search_query, query_params)
        
        ngx.var.search_query = optimized_search.query
        ngx.var.search_filters = optimized_search.filters
        ngx.var.search_boost = optimized_search.boost
    }
    
    # Route to Elasticsearch
    proxy_pass http://elasticsearch_cluster;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Search-Query $search_query;
    proxy_set_header X-Search-Filters $search_filters;
    proxy_set_header X-Search-Boost $search_boost;
    
    # Search timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Search result caching
    proxy_cache search_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri$args";
    proxy_cache_valid 200 15m;
    proxy_cache_valid 404 5m;
    
    add_header X-Search-Server $upstream_addr;
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Search-Time $upstream_response_time;
}

# CACHE OPERATIONS (Redis)
location /api/cache/ {
    # Cache-specific operations
    access_by_lua_block {
        local redis_client = require "resty.redis_client"
        local method = ngx.var.request_method
        
        if method == "GET" then
            -- Cache read operation
            local key = ngx.var.arg_key
            if not key then
                ngx.status = 400
                ngx.say('{"error":"Cache key required"}')
                ngx.exit(400)
            end
            
            local value = redis_client.get(key)
            if value then
                ngx.header.content_type = "application/json"
                ngx.say('{"key":"' .. key .. '","value":' .. value .. ',"hit":true}')
            else
                ngx.status = 404
                ngx.say('{"key":"' .. key .. '","hit":false}')
            end
            ngx.exit(ngx.status)
            
        elseif method == "POST" or method == "PUT" then
            -- Cache write operation - proxy to Redis
            ngx.var.redis_operation = "write"
        elseif method == "DELETE" then
            -- Cache delete operation
            ngx.var.redis_operation = "delete"
        end
    }
    
    # Route to Redis cluster
    proxy_pass http://redis_cluster;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Redis-Operation $redis_operation;
    
    # Fast cache timeouts
    proxy_connect_timeout 1s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    
    add_header X-Cache-Server $upstream_addr;
    add_header X-Cache-Operation $redis_operation;
}

# DATABASE HEALTH MONITORING
location /health/databases {
    access_log off;
    
    content_by_lua_block {
        local db_health = require "database_health"
        
        -- Check all database services
        local health_status = {
            postgresql_primary = db_health.check_postgresql_primary(),
            postgresql_replicas = db_health.check_postgresql_replicas(),
            mongodb = db_health.check_mongodb(),
            redis = db_health.check_redis(),
            elasticsearch = db_health.check_elasticsearch()
        }
        
        local overall_health = true
        for service, status in pairs(health_status) do
            if not status.healthy then
                overall_health = false
                break
            end
        end
        
        health_status.overall_healthy = overall_health
        health_status.timestamp = ngx.time()
        
        ngx.header.content_type = "application/json"
        ngx.say(require("cjson").encode(health_status))
        
        if not overall_health then
            ngx.status = 503
        end
    }
    
    add_header X-Health-Check "databases";
}

# DATABASE PERFORMANCE METRICS
location /metrics/databases {
    access_log off;
    
    content_by_lua_block {
        local performance_monitor = require "performance_monitor"
        
        -- Get database performance metrics
        local metrics = performance_monitor.get_database_metrics()
        
        -- Format as Prometheus metrics
        local prometheus_metrics = {
            "# TYPE nginx_db_connections_active gauge",
            "nginx_db_connections_active{service=\"postgresql\"} " .. metrics.postgresql.active_connections,
            "nginx_db_connections_active{service=\"mongodb\"} " .. metrics.mongodb.active_connections,
            "nginx_db_connections_active{service=\"redis\"} " .. metrics.redis.active_connections,
            "",
            "# TYPE nginx_db_query_duration_seconds histogram",
            "nginx_db_query_duration_seconds{service=\"postgresql\"} " .. metrics.postgresql.avg_query_time,
            "nginx_db_query_duration_seconds{service=\"mongodb\"} " .. metrics.mongodb.avg_query_time,
            "",
            "# TYPE nginx_db_operations_total counter",
            "nginx_db_operations_total{service=\"postgresql\",operation=\"read\"} " .. metrics.postgresql.read_operations,
            "nginx_db_operations_total{service=\"postgresql\",operation=\"write\"} " .. metrics.postgresql.write_operations,
            "nginx_db_operations_total{service=\"mongodb\",operation=\"read\"} " .. metrics.mongodb.read_operations,
            "nginx_db_operations_total{service=\"mongodb\",operation=\"write\"} " .. metrics.mongodb.write_operations
        }
        
        ngx.header.content_type = "text/plain"
        ngx.say(table.concat(prometheus_metrics, "\n"))
    }
    
    # Monitoring systems only
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}

# DATABASE DASHBOARD
location /dashboard/databases {
    root /var/www/html/dashboards;
    index database-dashboard.html;
    
    # DBA team access
    auth_basic "Database Dashboard";
    auth_basic_user_file /etc/nginx/dba_htpasswd;
    
    add_header X-Dashboard-Type "database-monitoring";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# QUERY PERFORMANCE ANALYZER
location /tools/query-analyzer {
    content_by_lua_block {
        local query_analyzer = require "query_analyzer"
        
        if ngx.var.request_method == "POST" then
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            local query_data = require("cjson").decode(body)
            
            local analysis = query_analyzer.analyze_query(query_data.query)
            
            ngx.header.content_type = "application/json"
            ngx.say(require("cjson").encode(analysis))
        else
            ngx.status = 405
            ngx.say('{"error":"Method not allowed"}')
        end
    }
    
    # DBA team access only
    auth_basic "Query Analyzer";
    auth_basic_user_file /etc/nginx/dba_htpasswd;
}

# DATABASE LOGGING
log_format database '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   '$request_time $upstream_response_time '
                   '"$upstream_addr" "$query_complexity" '
                   '"$transaction_id" "$cache_key"';

# DATABASE CONNECTION ERROR HANDLING
error_page 502 503 504 /database_error.html;
location = /database_error.html {
    root /var/www/html/errors;
    internal;
    add_header Content-Type text/html;
    add_header X-Error-Type "database-unavailable";
}