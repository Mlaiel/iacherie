# Global configuration - High-Performance Web Server Foundation
user nginx;
worker_processes auto;
worker_rlimit_nofile 262144;
worker_cpu_affinity auto;
worker_priority -5;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load dynamic modules for enterprise features
load_module modules/ngx_http_geoip2_module.so;
load_module modules/ngx_http_image_filter_module.so;
load_module modules/ngx_http_perl_module.so;
load_module modules/ngx_stream_module.so;

# Events configuration for maximum concurrency
events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
    accept_mutex off;
    worker_aio_requests 32;
}

# Stream module for TCP/UDP load balancing
stream {
    upstream postgres_cluster {
        least_conn;
        server postgres-master:5432 max_fails=3 fail_timeout=30s;
        server postgres-replica1:5432 max_fails=3 fail_timeout=30s backup;
        server postgres-replica2:5432 max_fails=3 fail_timeout=30s backup;
    }
    
    upstream redis_cluster {
        hash $remote_addr consistent;
        server redis-node1:6379 max_fails=3 fail_timeout=30s;
        server redis-node2:6379 max_fails=3 fail_timeout=30s;
        server redis-node3:6379 max_fails=3 fail_timeout=30s;
    }
    
    server {
        listen 5432;
        proxy_pass postgres_cluster;
        proxy_timeout 1s;
        proxy_responses 1;
        proxy_connect_timeout 1s;
    }
    
    server {
        listen 6379;
        proxy_pass redis_cluster;
        proxy_timeout 1s;
        proxy_responses 1;
    }
}

# HTTP configuration with enterprise optimizations
http {
    # MIME types and character encoding
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    source_charset utf-8;
    
    # Performance optimizations - Level 1
    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    
    # Advanced buffer configurations
    client_body_buffer_size 256k;
    client_max_body_size 1024m;
    client_header_buffer_size 4k;
    large_client_header_buffers 8 16k;
    output_buffers 2 32k;
    postpone_output 1460;
    proxy_buffering on;
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    
    # Connection and request limits
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn_zone $server_name zone=perserver:10m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=search:10m rate=20r/s;
    
    # Security and privacy
    server_tokens off;
    more_clear_headers Server;
    more_clear_headers X-Powered-By;
    
    # GeoIP2 configuration for geographic load balancing
    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
        $geoip2_data_country_code country iso_code;
        $geoip2_data_country_name country names en;
    }
    
    geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
        $geoip2_data_city_name city names en;
        $geoip2_data_latitude location latitude;
        $geoip2_data_longitude location longitude;
    }
    
    # Advanced logging format with performance metrics
    log_format comprehensive '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            '"$http_x_forwarded_for" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time" '
                            'cs=$upstream_cache_status '
                            'geo_country="$geoip2_data_country_code" '
                            'geo_city="$geoip2_data_city_name" '
                            'ssl_protocol="$ssl_protocol" ssl_cipher="$ssl_cipher" '
                            'conn_serial=$connection connection_requests=$connection_requests';
    
    access_log /var/log/nginx/access.log comprehensive buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;
    
    # Compression optimization with multiple algorithms
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/csv
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon
        application/octet-stream;
    
    # Brotli compression (if module available)
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
    
    # Cache zones for different content types
    proxy_cache_path /var/cache/nginx/static 
        levels=2:2 
        keys_zone=static_cache:100m 
        max_size=10g 
        inactive=60m 
        use_temp_path=off 
        loader_threshold=300 
        loader_sleep=200ms;
    
    proxy_cache_path /var/cache/nginx/api 
        levels=1:2 
        keys_zone=api_cache:50m 
        max_size=5g 
        inactive=30m 
        use_temp_path=off;
    
    proxy_cache_path /var/cache/nginx/media 
        levels=2:2:2 
        keys_zone=media_cache:200m 
        max_size=50g 
        inactive=7d 
        use_temp_path=off;
    
    proxy_cache_path /var/cache/nginx/microcache 
        levels=1:1 
        keys_zone=microcache:10m 
        max_size=1g 
        inactive=60s 
        use_temp_path=off;
    
    # Shared memory zones for rate limiting and session storage
    limit_req_zone $binary_remote_addr zone=ddos_protection:50m rate=100r/s;
    
    # Map for real IP detection
    map $http_x_forwarded_for $real_ip {
        ~^(\d+\.\d+\.\d+\.\d+) $1;
        default $remote_addr;
    }
    
    # Map for cache bypass conditions
    map $request_method $bypass_cache {
        POST 1;
        PUT 1;
        DELETE 1;
        default 0;
    }
    
    # Map for static content identification
    map $uri $cache_control {
        ~*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ "public, max-age=31536000, immutable";
        ~*\.(pdf|doc|docx|zip)$ "public, max-age=86400";
        default "no-cache, no-store, must-revalidate";
    }
    
    # Upstream configurations for all platform services
    upstream ainflue_main_app {
        least_conn;
        server ainflue-app-1:8000 max_fails=3 fail_timeout=30s weight=3;
        server ainflue-app-2:8000 max_fails=3 fail_timeout=30s weight=3;
        server ainflue-app-3:8000 max_fails=3 fail_timeout=30s weight=3;
        server ainflue-app-4:8000 max_fails=3 fail_timeout=30s weight=2 backup;
        keepalive 64;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }
    
    upstream fingerprinting_service {
        ip_hash;
        server ainflue-fingerprint-1:8001 max_fails=3 fail_timeout=30s;
        server ainflue-fingerprint-2:8001 max_fails=3 fail_timeout=30s;
        server ainflue-fingerprint-3:8001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream protection_service {
        least_conn;
        server ainflue-protection-1:8002 max_fails=3 fail_timeout=30s;
        server ainflue-protection-2:8002 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    upstream monetization_service {
        round_robin;
        server ainflue-monetization-1:8003 max_fails=3 fail_timeout=30s;
        server ainflue-monetization-2:8003 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    upstream ai_engine_service {
        least_conn;
        server ainflue-ai-1:8004 max_fails=3 fail_timeout=30s weight=2;
        server ainflue-ai-2:8004 max_fails=3 fail_timeout=30s weight=2;
        server ainflue-ai-gpu-1:8004 max_fails=3 fail_timeout=30s weight=5;
        keepalive 8;
    }
    
    upstream crawler_service {
        ip_hash;
        server ainflue-crawler-1:8005 max_fails=3 fail_timeout=30s;
        server ainflue-crawler-2:8005 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    upstream analytics_service {
        least_conn;
        server ainflue-analytics-1:8006 max_fails=3 fail_timeout=30s;
        server ainflue-analytics-2:8006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream licensing_service {
        round_robin;
        server ainflue-licensing-1:8007 max_fails=3 fail_timeout=30s;
        server ainflue-licensing-2:8007 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    
    upstream collaboration_service {
        least_conn;
        server ainflue-collab-1:8008 max_fails=3 fail_timeout=30s;
        server ainflue-collab-2:8008 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    upstream notification_service {
        round_robin;
        server ainflue-notify-1:8009 max_fails=3 fail_timeout=30s;
        server ainflue-notify-2:8009 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    
    # HTTP to HTTPS redirect server
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Security headers even for redirects
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        
        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }
        
        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # Main HTTPS server - Production configuration
    server {
        listen 443 ssl http2 default_server reuseport;
        listen [::]:443 ssl http2 default_server reuseport;
        server_name ainflue.com www.ainflue.com api.ainflue.com;
        
        # SSL/TLS configuration - Enterprise grade
        ssl_certificate /etc/ssl/certs/ainflue.crt;
        ssl_certificate_key /etc/ssl/private/ainflue.key;
        ssl_trusted_certificate /etc/ssl/certs/ca-bundle.crt;
        
        # SSL session optimization
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:100m;
        ssl_session_tickets off;
        
        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;
        
        # Security headers - Comprehensive set
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.ainflue.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' wss: https:; frame-src 'none'; object-src 'none'; base-uri 'self';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        
        # Rate limiting and DDoS protection
        limit_req zone=ddos_protection burst=200 nodelay;
        limit_conn addr 20;
        limit_conn perserver 1000;
        
        # Main application routes
        location / {
            proxy_pass http://ainflue_main_app;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            
            # Connection settings
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade $bypass_cache;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Buffering
            proxy_buffering on;
            proxy_request_buffering on;
            
            # Microcaching for authenticated users
            proxy_cache microcache;
            proxy_cache_valid 200 30s;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";
            proxy_cache_bypass $cookie_sessionid $bypass_cache;
            proxy_no_cache $cookie_sessionid $bypass_cache;
            add_header X-Cache-Status $upstream_cache_status always;
        }
        
        # API endpoints with intelligent caching
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://ainflue_main_app;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API-specific headers
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header Authorization $http_authorization;
            
            # Connection settings
            proxy_http_version 1.1;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Caching for GET requests only
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_valid 500 502 503 504 30s;
            proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";
            proxy_cache_bypass $bypass_cache $http_authorization;
            proxy_no_cache $bypass_cache $http_authorization;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key "$scheme$request_method$host$request_uri$is_args$args" always;
        }
        
        # Fingerprinting service
        location /api/v1/fingerprint/ {
            limit_req zone=upload burst=30 nodelay;
            
            proxy_pass http://fingerprinting_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Large file upload support
            client_max_body_size 2048m;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # No caching for fingerprinting
            proxy_cache off;
            add_header X-Service "fingerprinting" always;
        }
        
        # Protection service
        location /api/v1/protect/ {
            limit_req zone=api burst=100 nodelay;
            
            proxy_pass http://protection_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Cache protection status checks
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            add_header X-Service "protection" always;
        }
        
        # Monetization service
        location /api/v1/monetization/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://monetization_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Sensitive financial data - no caching
            proxy_cache off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Service "monetization" always;
        }
        
        # AI engine service
        location /api/v1/ai/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://ai_engine_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # AI processing timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Cache AI responses briefly
            proxy_cache api_cache;
            proxy_cache_valid 200 2m;
            add_header X-Service "ai-engine" always;
        }
        
        # Analytics service
        location /api/v1/analytics/ {
            limit_req zone=api burst=100 nodelay;
            
            proxy_pass http://analytics_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Analytics caching
            proxy_cache api_cache;
            proxy_cache_valid 200 1m;
            add_header X-Service "analytics" always;
        }
        
        # WebSocket support for real-time features
        location /ws/ {
            proxy_pass http://ainflue_main_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            
            # No caching for WebSocket
            proxy_cache off;
        }
        
        # Static content with aggressive caching
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|pdf|zip|mp4|mp3|wav)$ {
            expires 1y;
            add_header Cache-Control $cache_control;
            add_header X-Content-Type-Options nosniff always;
            
            # Try local files first, then proxy
            try_files $uri @static_proxy;
            
            # Static file optimizations
            open_file_cache max=10000 inactive=30s;
            open_file_cache_valid 60s;
            open_file_cache_min_uses 2;
            open_file_cache_errors on;
        }
        
        # Static proxy fallback
        location @static_proxy {
            proxy_pass http://ainflue_main_app;
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1h;
            add_header X-Cache-Status $upstream_cache_status always;
        }
        
        # Media content with CDN-style caching
        location /media/ {
            proxy_pass http://ainflue_main_app;
            proxy_cache media_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1h;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }
        
        # Health checks and monitoring
        location /health {
            access_log off;
            proxy_pass http://ainflue_main_app/health;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }
        
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Block access to sensitive files and directories
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ /(\.env|docker-compose|Dockerfile|\.git) {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Admin panel with IP restrictions
        location /admin/ {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            
            limit_req zone=login burst=10 nodelay;
            
            proxy_pass http://ainflue_main_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # No caching for admin
            proxy_cache off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }
        
        # Login endpoints with rate limiting
        location /auth/login {
            limit_req zone=login burst=5 nodelay;
            
            proxy_pass http://ainflue_main_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # No caching for auth
            proxy_cache off;
        }
        
        # Error pages
        error_page 404 /custom_404.html;
        error_page 500 502 503 504 /custom_50x.html;
        
        location = /custom_404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        location = /custom_50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
    
    # Monitoring and metrics server
    server {
        listen 8080;
        server_name localhost;
        
        # Nginx status for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
        
        # Prometheus metrics endpoint
        location /metrics {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            
            proxy_pass http://127.0.0.1:9113/metrics;
        }
        
        # Health check endpoint for load balancers
        location /lb-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
    
    # Geographic load balancing server
    server {
        listen 443 ssl http2;
        server_name eu.ainflue.com;
        
        # Same SSL config as main server
        ssl_certificate /etc/ssl/certs/ainflue.crt;
        ssl_certificate_key /etc/ssl/private/ainflue.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:100m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        
        # Route EU traffic to EU-specific upstreams
        location / {
            proxy_pass http://ainflue_main_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Geographic-Region "EU";
        }
    }
    
    # API-only server for mobile clients
    server {
        listen 443 ssl http2;
        server_name mobile-api.ainflue.com;
        
        # Same SSL config
        ssl_certificate /etc/ssl/certs/ainflue.crt;
        ssl_certificate_key /etc/ssl/private/ainflue.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:100m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        
        # Mobile-optimized routing
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            
            proxy_pass http://ainflue_main_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $real_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Type "mobile";
            
            # Mobile-optimized caching
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            add_header X-Mobile-Optimized "true" always;
        }
    }
}