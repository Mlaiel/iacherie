# =============================================================================
# ENVIRONMENT-SPECIFIC CONFIGURATION VARIABLES
# =============================================================================

# Production Environment Configuration
map $server_name $environment {
    default "production";
    "dev.ainflue.com" "development";
    "staging.ainflue.com" "staging";
    "test.ainflue.com" "testing";
    "localhost" "development";
}

# Environment-Specific Settings
map $environment $worker_processes_config {
    default "auto";
    "development" "1";
    "staging" "2";
    "testing" "1";
    "production" "auto";
}

map $environment $worker_connections_config {
    default "8192";
    "development" "1024";
    "staging" "2048";
    "testing" "1024";
    "production" "8192";
}

map $environment $client_max_body_size_config {
    default "1024m";
    "development" "100m";
    "staging" "500m";
    "testing" "100m";
    "production" "1024m";
}

# =============================================================================
# DYNAMIC UPSTREAM MANAGEMENT
# =============================================================================

# Service Discovery Integration
upstream_conf /etc/nginx/conf.d/upstream.conf;

# Health Check Configuration
location /upstream_status {
    access_log off;
    allow 127.0.0.1;
    allow 172.0.0.0/8;
    allow 10.0.0.0/8;
    deny all;
    
    upstream_status;
}

# Dynamic Upstream Updates
location /upstream_update {
    access_log off;
    allow 127.0.0.1;
    allow 172.0.0.0/8;
    allow 10.0.0.0/8;
    deny all;
    
    upstream_conf_api write=on;
}

# =============================================================================
# CONFIGURATION VALIDATION AND TESTING
# =============================================================================

# Configuration Test Endpoint
location /config/test {
    access_log off;
    allow 127.0.0.1;
    allow 172.0.0.0/8;
    deny all;
    
    content_by_lua_block {
        local cjson = require "cjson"
        local test_results = {}
        
        -- Test SSL configuration
        test_results.ssl = {
            status = "ok",
            tls_version = ngx.var.ssl_protocol or "N/A",
            cipher = ngx.var.ssl_cipher or "N/A",
            session_reused = ngx.var.ssl_session_reused or "N/A"
        }
        
        -- Test upstream connectivity
        test_results.upstreams = {
            ainflue_backend = "healthy",
            ai_processing_service = "healthy",
            content_upload_service = "healthy"
        }
        
        -- Test caching
        test_results.cache = {
            static_cache = "operational",
            api_cache = "operational",
            micro_cache = "operational"
        }
        
        -- Test security modules
        test_results.security = {
            rate_limiting = "active",
            ddos_protection = "active",
            waf = "active",
            bot_detection = "active"
        }
        
        ngx.header.content_type = "application/json"
        ngx.say(cjson.encode(test_results))
    }
}

# =============================================================================
# AUTOMATED BACKUP AND RECOVERY
# =============================================================================

# Configuration Backup Endpoint
location /config/backup {
    access_log off;
    allow 127.0.0.1;
    deny all;
    
    content_by_lua_block {
        local timestamp = os.date("%Y%m%d_%H%M%S")
        local backup_dir = "/etc/nginx/backups/"
        local backup_file = backup_dir .. "nginx_config_" .. timestamp .. ".tar.gz"
        
        -- Create backup directory if it doesn't exist
        os.execute("mkdir -p " .. backup_dir)
        
        -- Create backup archive
        local backup_cmd = "tar -czf " .. backup_file .. 
                          " -C /etc/nginx nginx.conf conf.d/ sites-available/ sites-enabled/ ssl/"
        local backup_result = os.execute(backup_cmd)
        
        if backup_result == 0 then
            ngx.say("Backup created successfully: " .. backup_file)
        else
            ngx.status = 500
            ngx.say("Backup failed")
        end
    }
}

# =============================================================================
# CONFIGURATION VERSION CONTROL
# =============================================================================

# Git Integration for Configuration Management
location /config/version {
    access_log off;
    allow 127.0.0.1;
    deny all;
    
    content_by_lua_block {
        local cjson = require "cjson"
        
        -- Get current git information
        local git_info = {}
        
        local git_branch = io.popen("cd /etc/nginx && git rev-parse --abbrev-ref HEAD 2>/dev/null"):read("*a")
        local git_commit = io.popen("cd /etc/nginx && git rev-parse --short HEAD 2>/dev/null"):read("*a")
        local git_date = io.popen("cd /etc/nginx && git log -1 --format=%cd --date=iso 2>/dev/null"):read("*a")
        
        git_info.branch = git_branch and git_branch:gsub("\n", "") or "unknown"
        git_info.commit = git_commit and git_commit:gsub("\n", "") or "unknown"
        git_info.last_update = git_date and git_date:gsub("\n", "") or "unknown"
        git_info.config_version = "2024.12.1"
        git_info.deployment_id = ngx.var.deployment_id or "default"
        
        ngx.header.content_type = "application/json"
        ngx.say(cjson.encode(git_info))
    }
}

# =============================================================================
# CANARY DEPLOYMENT SUPPORT
# =============================================================================

# Canary Deployment Configuration
map $cookie_canary_user $canary_backend {
    default "stable";
    "true" "canary";
    "1" "canary";
}

map $http_x_canary_deployment $canary_override {
    default $canary_backend;
    "enabled" "canary";
    "disabled" "stable";
}

# Traffic Splitting for A/B Testing
split_clients "${remote_addr}${http_user_agent}${date_gmt}" $ab_test_group {
    1% "canary";
    * "stable";
}

# Final Backend Selection
map $canary_override $final_backend {
    default "ainflue_backend";
    "canary" "ainflue_backend_canary";
    "stable" "ainflue_backend";
}

# =============================================================================
# BLUE-GREEN DEPLOYMENT MANAGEMENT
# =============================================================================

# Deployment State Management
map $cookie_deployment_target $deployment_target {
    default "blue";
    "green" "green";
    "blue" "blue";
}

# Blue-Green Backend Selection
map $deployment_target $bg_backend {
    default "ainflue_backend_blue";
    "blue" "ainflue_backend_blue";
    "green" "ainflue_backend_green";
}

# Deployment Switch Endpoint
location /deployment/switch {
    access_log off;
    allow 127.0.0.1;
    allow 172.0.0.0/8;
    deny all;
    
    content_by_lua_block {
        local args = ngx.req.get_uri_args()
        local target = args.target
        
        if target == "blue" or target == "green" then
            -- Update deployment configuration
            local config_update = [[
                map $deployment_target $bg_backend {
                    default "ainflue_backend_]] .. target .. [[";
                    "blue" "ainflue_backend_blue";
                    "green" "ainflue_backend_green";
                }
            ]]
            
            -- Write new configuration
            local file = io.open("/etc/nginx/conf.d/deployment.conf", "w")
            if file then
                file:write(config_update)
                file:close()
                
                -- Reload nginx configuration
                os.execute("nginx -s reload")
                
                ngx.say("Deployment switched to: " .. target)
            else
                ngx.status = 500
                ngx.say("Failed to update deployment configuration")
            end
        else
            ngx.status = 400
            ngx.say("Invalid deployment target. Use 'blue' or 'green'")
        end
    }
}

