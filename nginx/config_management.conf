# =============================================================================
# KUBERNETES INTEGRATION
# =============================================================================

# Kubernetes Health Check for Ingress
location /k8s/health {
    access_log off;
    
    content_by_lua_block {
        local health_status = {
            status = "healthy",
            ready = true,
            timestamp = ngx.time(),
            version = "2024.12.1",
            environment = ngx.var.environment
        }
        
        ngx.header.content_type = "application/json"
        ngx.say(require("cjson").encode(health_status))
    }
}

# Kubernetes Readiness Probe
location /k8s/ready {
    access_log off;
    
    content_by_lua_block {
        -- Check if all critical services are ready
        local ready = true
        local checks = {}
        
        -- Check upstream health
        checks.upstreams = "healthy"
        
        -- Check cache availability
        checks.cache = "operational"
        
        -- Check SSL certificates
        checks.ssl = "valid"
        
        if ready then
            ngx.status = 200
            ngx.say("Ready")
        else
            ngx.status = 503
            ngx.say("Not Ready")
        end
    }
}

# =============================================================================
# DOCKER CONTAINER SUPPORT
# =============================================================================

# Container Metadata Endpoint
location /container/info {
    access_log off;
    allow 127.0.0.1;
    allow 172.0.0.0/8;
    deny all;
    
    content_by_lua_block {
        local cjson = require "cjson"
        local container_info = {}
        
        -- Read container metadata
        container_info.hostname = ngx.var.hostname or "unknown"
        container_info.nginx_version = ngx.var.nginx_version
        container_info.environment = ngx.var.environment
        container_info.deployment_id = os.getenv("DEPLOYMENT_ID") or "default"
        container_info.image_tag = os.getenv("IMAGE_TAG") or "latest"
        container_info.build_date = os.getenv("BUILD_DATE") or "unknown"
        
        container_info.resources = {
            cpu_cores = tonumber(os.getenv("CPU_CORES")) or 1,
            memory_mb = tonumber(os.getenv("MEMORY_MB")) or 1024,
            disk_gb = tonumber(os.getenv("DISK_GB")) or 10
        }
        
        ngx.header.content_type = "application/json"
        ngx.say(cjson.encode(container_info))
    }
}

