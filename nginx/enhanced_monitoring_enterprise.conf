# Custom Prometheus Metrics for Business Logic
lua_shared_dict prometheus_metrics 10m;
lua_package_path "/etc/nginx/lua/?.lua;;";

init_by_lua_block {
    prometheus = require("prometheus").init("prometheus_metrics")
    
    -- Business metrics
    creator_registrations = prometheus:counter(
        "ainflue_creator_registrations_total", 
        "Total creator registrations", {"creator_type", "region"}
    )
    
    content_uploads = prometheus:counter(
        "ainflue_content_uploads_total",
        "Total content uploads", {"content_type", "creator_type", "size_category"}
    )
    
    ai_processing_requests = prometheus:counter(
        "ainflue_ai_processing_total",
        "Total AI processing requests", {"ai_model", "processing_type", "success"}
    )
    
    security_incidents = prometheus:counter(
        "ainflue_security_incidents_total",
        "Security incidents detected", {"incident_type", "severity", "action_taken"}
    )
    
    monetization_events = prometheus:counter(
        "ainflue_monetization_events_total",
        "Monetization events", {"event_type", "creator_type", "revenue_tier"}
    )
    
    -- Performance metrics
    request_duration = prometheus:histogram(
        "ainflue_request_duration_seconds",
        "Request duration", {"endpoint", "method", "status"}, 
        {0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10}
    )
    
    security_processing_time = prometheus:histogram(
        "ainflue_security_processing_seconds",
        "Security processing time", {"security_level", "threat_score"}, 
        {0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5}
    )
}

# =============================================================================
# REAL-TIME ANALYTICS AND DASHBOARDS
# =============================================================================

# Real-time Metrics Collection
access_by_lua_block {
    -- Collect business metrics
    local creator_type = ngx.var.http_x_creator_type or "unknown"
    local region = ngx.var.geoip_country_code or "unknown"
    local content_type = ngx.var.http_content_type or "unknown"
    local ai_model = ngx.var.http_x_ai_model or "none"
    local security_event = ngx.var.security_event_type or "routine"
    local threat_score = tonumber(ngx.var.ml_risk_score) or 0
    
    -- Increment relevant counters
    if ngx.var.request_uri:match("/api/creator/register") then
        creator_registrations:inc(1, {creator_type, region})
    end
    
    if ngx.var.request_uri:match("/api/upload") then
        local size_category = "small"
        local content_length = tonumber(ngx.var.http_content_length) or 0
        if content_length > 100*1024*1024 then
            size_category = "large"
        elseif content_length > 10*1024*1024 then
            size_category = "medium"
        end
        content_uploads:inc(1, {content_type, creator_type, size_category})
    end
    
    if ngx.var.request_uri:match("/api/ai/") then
        local success = (ngx.var.status < 400) and "true" or "false"
        ai_processing_requests:inc(1, {ai_model, "inference", success})
    end
    
    if security_event ~= "routine_access" then
        local severity = ngx.var.incident_severity or "low"
        local action = ngx.var.response_orchestration or "monitor"
        security_incidents:inc(1, {security_event, severity, action})
    end
}

# Performance tracking
log_by_lua_block {
    local request_time = tonumber(ngx.var.request_time) or 0
    local security_time = tonumber(ngx.var.security_processing_time) or 0
    local endpoint = ngx.var.request_uri:match("^/api/([^/]+)") or "static"
    local method = ngx.var.request_method
    local status = ngx.var.status
    local security_level = ngx.var.security_processing_mode or "fast"
    local threat_score = ngx.var.ml_risk_score or "0"
    
    request_duration:observe(request_time, {endpoint, method, status})
    security_processing_time:observe(security_time, {security_level, threat_score})
}

