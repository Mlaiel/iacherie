# =============================================================================
# REAL-TIME MONITORING ENDPOINTS
# =============================================================================

# Prometheus Metrics Endpoint
location /metrics {
    access_log off;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    
    content_by_lua_block {
        prometheus:collect()
    }
}

# Health Check Endpoint with Detailed Status
location /health/detailed {
    access_log off;
    return 200 '{"status":"healthy","timestamp":"$time_iso8601","version":"1.0.0","services":{"nginx":"up","upstreams":"$upstream_status","cache":"$cache_status","security":"active"}}';
    add_header Content-Type application/json;
}

# Real-time Performance Dashboard
location /dashboard/performance {
    access_log off;
    allow 10.0.0.0/8;
    deny all;
    
    content_by_lua_block {
        local performance_data = {
            current_connections = ngx.var.connections_active,
            requests_per_second = ngx.var.request_rate,
            average_response_time = ngx.var.avg_response_time,
            cache_hit_ratio = ngx.var.cache_hit_ratio,
            security_threat_level = ngx.var.ml_risk_score,
            upstreams_healthy = ngx.var.healthy_upstreams_count
        }
        ngx.say(require("cjson").encode(performance_data))
    }
}

# Security Operations Center (SOC) Dashboard
location /dashboard/security {
    access_log off;
    allow 10.0.0.0/8;
    deny all;
    
    content_by_lua_block {
        local security_data = {
            active_threats = ngx.var.active_threats_count,
            blocked_ips = ngx.var.blocked_ips_count,
            security_incidents_hour = ngx.var.security_incidents_hour,
            compliance_score = ngx.var.avg_compliance_score,
            zero_trust_violations = ngx.var.zero_trust_violations,
            apt_detections = ngx.var.apt_detections_count
        }
        ngx.say(require("cjson").encode(security_data))
    }
}

# Business Intelligence Dashboard
location /dashboard/business {
    access_log off;
    allow 10.0.0.0/8;
    deny all;
    
    content_by_lua_block {
        local business_data = {
            active_creators = ngx.var.active_creators_count,
            content_uploads_hour = ngx.var.content_uploads_hour,
            ai_processing_requests = ngx.var.ai_requests_hour,
            revenue_per_hour = ngx.var.revenue_hour,
            collaboration_sessions = ngx.var.collaboration_sessions_active,
            seo_optimizations = ngx.var.seo_optimizations_count
        }
        ngx.say(require("cjson").encode(business_data))
    }
}

# =============================================================================
# ADVANCED ALERTING CONFIGURATION
# =============================================================================

# Critical Alert Thresholds
map $ml_risk_score $critical_alert {
    default 0;
    "~*[8-9][0-9]" 1;  # Risk score 80+
}

map $upstream_response_time $performance_alert {
    default 0;
    "~*[5-9]\.[0-9]+" 1;  # Response time > 5 seconds
}

map $security_incidents_minute $security_alert {
    default 0;
    "~*[1-9][0-9]+" 1;  # More than 10 incidents per minute
}

# Alert Webhook Integration
location /internal/alert {
    internal;
    access_log off;
    
    content_by_lua_block {
        local alert_data = {
            type = ngx.var.arg_type,
            severity = ngx.var.arg_severity,
            message = ngx.var.arg_message,
            timestamp = ngx.var.time_iso8601,
            server = ngx.var.server_name,
            source_ip = ngx.var.remote_addr,
            details = {
                threat_score = ngx.var.ml_risk_score,
                security_event = ngx.var.security_event_type,
                response_time = ngx.var.upstream_response_time,
                request_uri = ngx.var.request_uri
            }
        }
        
        -- Send to multiple alert channels
        local httpc = require("resty.http").new()
        
        -- Slack webhook
        httpc:request_uri("$slack_webhook_url", {
            method = "POST",
            body = require("cjson").encode({
                text = "ALERT: " .. alert_data.message,
                attachments = {{
                    color = "danger",
                    fields = {
                        {title = "Severity", value = alert_data.severity, short = true},
                        {title = "Server", value = alert_data.server, short = true},
                        {title = "Threat Score", value = alert_data.details.threat_score, short = true}
                    }
                }}
            }),
            headers = {["Content-Type"] = "application/json"}
        })
        
        -- PagerDuty integration
        httpc:request_uri("$pagerduty_webhook_url", {
            method = "POST",
            body = require("cjson").encode({
                routing_key = "$pagerduty_routing_key",
                event_action = "trigger",
                payload = {
                    summary = alert_data.message,
                    severity = alert_data.severity,
                    source = alert_data.server,
                    custom_details = alert_data.details
                }
            }),
            headers = {["Content-Type"] = "application/json"}
        })
    }
}

# =============================================================================
# INTELLIGENT LOG ROUTING AND ANALYSIS
# =============================================================================

# Log routing based on criticality
map "$critical_alert|$performance_alert|$security_alert" $log_priority {
    default "standard";
    "1|0|0" "critical";
    "0|1|0" "performance";
    "0|0|1" "security";
    "1|1|1" "emergency";
}

# Conditional logging to different destinations
access_log /var/log/nginx/executive.log executive_summary if=$executive_log_enabled;
access_log /var/log/nginx/technical.log technical_ops if=$technical_log_enabled;
access_log /var/log/nginx/security.log security_intelligence if=$security_log_enabled;
access_log /var/log/nginx/business.log business_intelligence if=$business_log_enabled;

# Real-time log streaming to SIEM
access_log syslog:server=siem.ainflue.internal:514,facility=local0,tag=nginx_security security_intelligence if=$security_alert;
access_log syslog:server=monitoring.ainflue.internal:514,facility=local1,tag=nginx_performance technical_ops if=$performance_alert;

# =============================================================================
# PREDICTIVE ANALYTICS AND CAPACITY PLANNING
# =============================================================================

# Traffic Pattern Analysis
map "$time_local|$request_rate|$active_connections" $traffic_pattern {
    default "normal";
    # Peak hours detection
    "~*1[0-9]:[0-9]+|high|high" "peak";
    # Off-peak hours
    "~*0[0-5]:[0-9]+|low|low" "off_peak";
    # Unusual patterns
    "~*.*|extreme|extreme" "anomalous";
}

# Capacity Utilization Tracking
map "$cpu_usage|$memory_usage|$disk_usage" $capacity_utilization {
    default "optimal";
    "~*[6-7][0-9]|[6-7][0-9]|[6-7][0-9]" "high";
    "~*[8-9][0-9]|[8-9][0-9]|[8-9][0-9]" "critical";
}

# Auto-scaling Triggers
map "$capacity_utilization|$traffic_pattern|$response_time" $scaling_decision {
    default "maintain";
    "high|peak|high" "scale_up";
    "optimal|off_peak|low" "scale_down";
    "critical|.*|.*" "emergency_scale";
}

