# AI PROCESSING UPSTREAM SERVERS - Enhanced Configuration
upstream ai_processing_openai {
    least_conn;
    server ai-openai-1.internal:8080 max_fails=3 fail_timeout=30s weight=5;
    server ai-openai-2.internal:8080 max_fails=3 fail_timeout=30s weight=5;
    server ai-openai-3.internal:8080 max_fails=3 fail_timeout=30s weight=3;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream ai_processing_anthropic {
    least_conn;
    server ai-anthropic-1.internal:8081 max_fails=2 fail_timeout=20s weight=4;
    server ai-anthropic-2.internal:8081 max_fails=2 fail_timeout=20s weight=4;
    keepalive 32;
    keepalive_requests 500;
    keepalive_timeout 45s;
}

upstream ai_processing_midjourney {
    ip_hash;
    server ai-midjourney-1.internal:8082 max_fails=3 fail_timeout=60s weight=3;
    server ai-midjourney-2.internal:8082 max_fails=3 fail_timeout=60s weight=3;
    keepalive 16;
    keepalive_requests 100;
    keepalive_timeout 120s;
}

upstream ai_processing_dalle {
    least_conn;
    server ai-dalle-1.internal:8083 max_fails=2 fail_timeout=45s weight=3;
    server ai-dalle-2.internal:8083 max_fails=2 fail_timeout=45s weight=3;
    keepalive 24;
    keepalive_requests 200;
    keepalive_timeout 90s;
}

upstream ai_processing_stability {
    least_conn;
    server ai-stability-1.internal:8084 max_fails=3 fail_timeout=30s weight=4;
    server ai-stability-2.internal:8084 max_fails=3 fail_timeout=30s weight=4;
    keepalive 20;
    keepalive_requests 150;
    keepalive_timeout 75s;
}

# AI CACHE ZONES - Intelligent Caching
proxy_cache_path /var/cache/nginx/ai_text 
    levels=1:2 
    keys_zone=ai_text_cache:512m 
    max_size=10g 
    inactive=24h 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/ai_image 
    levels=1:2 
    keys_zone=ai_image_cache:1g 
    max_size=50g 
    inactive=48h 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/ai_audio 
    levels=1:2 
    keys_zone=ai_audio_cache:256m 
    max_size=20g 
    inactive=72h 
    use_temp_path=off;

# AI REQUEST RATE LIMITING - Adaptive Throttling
limit_req_zone $binary_remote_addr zone=ai_text_limit:100m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ai_image_limit:100m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_audio_limit:50m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ai_video_limit:50m rate=2r/m;

# AI USER TIER MAPPING
map $http_x_user_tier $ai_rate_limit {
    default "ai_text_limit";
    "premium" "ai_premium_limit";
    "enterprise" "ai_enterprise_limit";
    "developer" "ai_developer_limit";
}

# AI PROCESSING LOCATION BLOCKS
location /api/ai/text/ {
    # Rate limiting based on user tier
    limit_req zone=$ai_rate_limit burst=10 nodelay;
    
    # AI text processing optimization
    proxy_pass http://ai_processing_openai;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-User-Tier $http_x_user_tier;
    
    # Extended timeouts for AI processing
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Intelligent caching
    proxy_cache ai_text_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri$args$http_x_user_tier";
    proxy_cache_valid 200 302 1h;
    proxy_cache_valid 404 1m;
    proxy_cache_bypass $http_cache_control;
    proxy_no_cache $http_pragma $http_authorization;
    
    # Cache headers for clients
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Request-ID $request_id;
    add_header X-AI-Provider "OpenAI";
    
    # Buffer optimization for AI responses
    proxy_buffering on;
    proxy_buffer_size 64k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
}

location /api/ai/image/ {
    # Image generation rate limiting
    limit_req zone=ai_image_limit burst=5 nodelay;
    
    # Route based on requested model
    set $ai_backend "ai_processing_dalle";
    if ($arg_model ~* "midjourney") {
        set $ai_backend "ai_processing_midjourney";
    }
    if ($arg_model ~* "stability") {
        set $ai_backend "ai_processing_stability";
    }
    
    proxy_pass http://$ai_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-AI-Model $arg_model;
    
    # Extended timeouts for image generation
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    
    # Large file handling
    client_max_body_size 100m;
    proxy_request_buffering off;
    
    # Image caching
    proxy_cache ai_image_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri$args";
    proxy_cache_valid 200 24h;
    proxy_cache_valid 404 5m;
    
    # Response headers
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Request-ID $request_id;
    add_header X-AI-Provider $ai_backend;
}

location /api/ai/audio/ {
    # Audio processing rate limiting
    limit_req zone=ai_audio_limit burst=3 nodelay;
    
    proxy_pass http://ai_processing_openai;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    
    # Audio processing timeouts
    proxy_connect_timeout 45s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    
    # Large audio file handling
    client_max_body_size 500m;
    proxy_request_buffering off;
    
    # Audio caching
    proxy_cache ai_audio_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri$args";
    proxy_cache_valid 200 48h;
    proxy_cache_valid 404 10m;
    
    # Audio-specific headers
    add_header X-Cache-Status $upstream_cache_status;
    add_header X-Request-ID $request_id;
    add_header X-AI-Provider "OpenAI-Audio";
}

# AI HEALTH MONITORING ENDPOINTS
location /health/ai {
    access_log off;
    return 200 "AI services healthy\n";
    add_header Content-Type text/plain;
    add_header X-Health-Check "ai-services";
}

location /health/ai/detailed {
    access_log off;
    
    # Health check with upstream status
    proxy_pass http://ai_processing_openai/health;
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    
    add_header X-Health-Check "ai-detailed";
    add_header X-Check-Time $msec;
}

# AI METRICS FOR PROMETHEUS
location /metrics/ai {
    access_log off;
    stub_status;
    
    # Restrict access to monitoring systems
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    
    add_header Content-Type text/plain;
    add_header X-Metrics-Type "ai-processing";
}

# AI REQUEST LOGGING - Enhanced Analytics
log_format ai_processing '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        '$request_time $upstream_response_time '
                        '"$http_x_user_tier" "$arg_model" "$request_id" '
                        '"$upstream_cache_status" "$ai_backend"';

# AI SECURITY HEADERS
add_header X-AI-Version "2025.1" always;
add_header X-AI-Security "enhanced" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# AI ERROR HANDLING
error_page 502 503 504 /ai_error.html;
location = /ai_error.html {
    root /var/www/html/errors;
    internal;
    add_header Content-Type text/html;
    add_header X-Error-Type "ai-service-unavailable";
}

# AI PERFORMANCE MONITORING
location /dashboard/ai {
    root /var/www/html/dashboards;
    index ai-dashboard.html;
    
    # Restrict access to admin users
    auth_basic "AI Dashboard";
    auth_basic_user_file /etc/nginx/htpasswd;
    
    add_header X-Dashboard-Type "ai-monitoring";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}