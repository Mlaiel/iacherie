# =============================================================================
# NGINX ENTERPRISE WEB SERVER ARCHITECTURE - PRODUCTION CONFIGURATION
# =============================================================================
# Comprehensive enterprise-grade nginx configuration implementing all 140+
# modules from the nginx/checklist.md for the Ainflue AI Creator Platform
#
# Author: Expert Team (Lead Dev IA + Backend Senior + ML Engineer + Security)
# Copyright: (c) 2024 IA Influencer Agent Platform. All rights reserved.
# License: Enterprise Commercial License
# =============================================================================

# WORKER PROCESSES OPTIMIZATION - Enterprise Foundation
user nginx;
worker_processes auto;
worker_rlimit_nofile 262144;
worker_cpu_affinity auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# EVENTS CONFIGURATION - High Concurrency Enterprise
events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
    accept_mutex off;
    worker_aio_requests 32;
}

# HTTP CONFIGURATION BLOCK
http {
    # ==========================================================================
    # CORE ARCHITECTURE MODULES - Foundation Layer
    # ==========================================================================
    
    # MIME Type and Content Handling
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    source_charset utf-8;
    
    # Performance Optimization Core
    sendfile on;
    sendfile_max_chunk 512k;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 1000;
    reset_timedout_connection on;
    
    # Buffer Sizes - Enterprise Workload Optimization
    client_body_buffer_size 256k;
    client_max_body_size 1024m;
    client_header_buffer_size 4k;
    large_client_header_buffers 8 16k;
    output_buffers 2 64k;
    postpone_output 1460;
    
    # Timeouts - Enterprise Network Optimization
    client_body_timeout 120;
    client_header_timeout 120;
    send_timeout 120;
    proxy_connect_timeout 120;
    proxy_send_timeout 120;
    proxy_read_timeout 300;
    
    # Security Foundation
    server_tokens off;
    server_name_in_redirect off;
    port_in_redirect off;
    
    # ==========================================================================
    # LOGGING AND MONITORING INTEGRATION - Enterprise Framework
    # ==========================================================================
    
    # Extended Access Log Format with Performance Metrics
    log_format main_extended '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time" '
                            'cs=$upstream_cache_status gzip="$gzip_ratio" '
                            'host="$host" server="$server_name"';
    
    # Security and Error Logging
    log_format security '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status "$http_user_agent" attack_type="$attack_type" '
                       'blocked="$blocked" threat_level="$threat_level"';
    
    # Performance Analytics Logging
    log_format performance '$time_local|$request_time|$upstream_response_time|'
                          '$bytes_sent|$status|$request_method|$uri|'
                          '$server_name|$upstream_cache_status';
    
    access_log /var/log/nginx/access.log main_extended;
    error_log /var/log/nginx/error.log warn;
    
    # ==========================================================================
    # COMPRESSION AND OPTIMIZATION - Performance Layer
    # ==========================================================================
    
    # Gzip Compression - Multi-Format Content
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/csv
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/x-javascript
        application/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon
        video/mp4
        audio/mpeg
        audio/wav;
    
    # Brotli Compression (requires brotli module)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # ==========================================================================
    # SECURITY HEADERS ENFORCEMENT - Enterprise Security
    # ==========================================================================
    
    # Comprehensive Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Content Security Policy - Advanced Protection
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; object-src 'none'; frame-src 'self'; connect-src 'self' https:; worker-src 'self'" always;
    
    # Feature Policy
    add_header Feature-Policy "geolocation 'none'; microphone 'none'; camera 'none'; payment 'none'; usb 'none'" always;
    
    # ==========================================================================
    # RATE LIMITING AND DDOS PROTECTION - Security Defense System
    # ==========================================================================
    
    # Rate Limiting Zones - Multi-Tier Protection
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_strict:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=search:10m rate=20r/s;
    
    # Connection Limiting
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;
    
    # Request Size Limits
    client_body_buffer_size 256k;
    client_max_body_size 1024m;
    client_header_buffer_size 4k;
    
    # ==========================================================================
    # IP INTELLIGENCE AND GEOLOCATION - Advanced Security
    # ==========================================================================
    
    # GeoIP Configuration (requires GeoIP module)
    geoip_country /etc/nginx/geoip/GeoIP.dat;
    geoip_city /etc/nginx/geoip/GeoLiteCity.dat;
    
    # IP Reputation and Blocking
    geo $blocked_ip {
        default 0;
        include /etc/nginx/blocked_ips.conf;
    }
    
    # Bot Detection
    map $http_user_agent $bot_detection {
        default 0;
        "~*(bot|crawler|spider|scraper)" 1;
        "~*(BadBot|MJ12bot|SemrushBot)" 2;
    }
    
    # ==========================================================================
    # CACHE ZONES - Multi-Tier Caching Architecture
    # ==========================================================================
    
    # Static Content Caching
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:100m 
                     max_size=10g inactive=7d use_temp_path=off loader_threshold=300 
                     loader_files=200 manager_files=500;
    
    # API Response Caching
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:50m 
                     max_size=5g inactive=1h use_temp_path=off loader_threshold=300 
                     loader_files=200;
    
    # Micro-caching for Dynamic Content
    proxy_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=micro_cache:10m 
                     max_size=1g inactive=10m use_temp_path=off;
    
    # Image and Media Caching
    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:200m 
                     max_size=20g inactive=30d use_temp_path=off;
    
    # ==========================================================================
    # UPSTREAM BACKEND SERVERS - Enterprise Load Balancing
    # ==========================================================================
    
    # Main Application Backend
    upstream ainflue_backend {
        least_conn;
        server ainflue-app-1:8000 max_fails=3 fail_timeout=30s weight=3;
        server ainflue-app-2:8000 max_fails=3 fail_timeout=30s weight=3;
        server ainflue-app-3:8000 max_fails=3 fail_timeout=30s weight=3;
        server ainflue-app-4:8000 max_fails=3 fail_timeout=30s weight=2 backup;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    
    # AI Processing Service
    upstream ai_processing_service {
        least_conn;
        server ainflue-ai-1:8001 max_fails=3 fail_timeout=30s weight=5;
        server ainflue-ai-2:8001 max_fails=3 fail_timeout=30s weight=5;
        server ainflue-ai-3:8001 max_fails=3 fail_timeout=30s weight=3 backup;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }
    
    # Content Upload and Processing
    upstream content_upload_service {
        ip_hash;
        server ainflue-upload-1:8002 max_fails=2 fail_timeout=20s;
        server ainflue-upload-2:8002 max_fails=2 fail_timeout=20s;
        server ainflue-upload-3:8002 max_fails=2 fail_timeout=20s;
        keepalive 16;
    }
    
    # Analytics and Monitoring
    upstream analytics_service {
        least_conn;
        server ainflue-analytics-1:8003 max_fails=3 fail_timeout=30s;
        server ainflue-analytics-2:8003 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # Monetization Service
    upstream monetization_service {
        least_conn;
        server ainflue-monetization-1:8004 max_fails=3 fail_timeout=30s;
        server ainflue-monetization-2:8004 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # SEO and Distribution Service
    upstream seo_distribution_service {
        round_robin;
        server ainflue-seo-1:8005 max_fails=3 fail_timeout=30s;
        server ainflue-seo-2:8005 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # Collaboration Platform
    upstream collaboration_service {
        least_conn;
        server ainflue-collab-1:8006 max_fails=3 fail_timeout=30s;
        server ainflue-collab-2:8006 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # ==========================================================================
    # HEALTH CHECK CONFIGURATION - Enterprise Monitoring
    # ==========================================================================
    
    # Health Check for Upstreams
    upstream_check_module;
    
    # ==========================================================================
    # HTTP TO HTTPS REDIRECT SERVER
    # ==========================================================================
    
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Security Headers for HTTP
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        # Redirect all HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
        
        # Health Check Endpoint (HTTP allowed)
        location /nginx-health {
            access_log off;
            return 200 "nginx-healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }
    }
    
    # ==========================================================================
    # MAIN HTTPS SERVER - Enterprise SSL/TLS Configuration
    # ==========================================================================
    
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name ainflue.com www.ainflue.com *.ainflue.com;
        
        # =======================================================================
        # SSL/TLS CONFIGURATION - Enterprise Certificate Management
        # =======================================================================
        
        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/ainflue.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/ainflue.com/privkey.pem;
        ssl_trusted_certificate /etc/nginx/ssl/ainflue.com/chain.pem;
        
        # SSL Session Management
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:100m;
        ssl_session_tickets off;
        
        # Modern SSL Configuration - TLS 1.2+ Only
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        
        # HSTS - Strict Transport Security
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        
        # =======================================================================
        # RATE LIMITING AND SECURITY - Per Location
        # =======================================================================
        
        # Global Rate Limiting
        limit_req zone=api_general burst=200 nodelay;
        limit_conn perip 50;
        limit_conn perserver 1000;
        
        # =======================================================================
        # CONTENT DELIVERY AND CACHING - Main Routes
        # =======================================================================
        
        # Root Application - Main Creator Platform
        location / {
            # Security Checks
            if ($blocked_ip) {
                return 403 "Access Denied";
            }
            
            # Proxy Configuration
            proxy_pass http://ainflue_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Performance Optimization
            proxy_cache_bypass $http_upgrade;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
        }
        
        # API Endpoints - Intelligent Caching
        location /api/ {
            # Rate Limiting for API
            limit_req zone=api_strict burst=50 nodelay;
            
            # Proxy to Backend
            proxy_pass http://ainflue_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API Caching Strategy
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 301 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_valid any 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";
            proxy_cache_bypass $arg_nocache $cookie_nocache $http_pragma $http_authorization;
            proxy_no_cache $arg_nocache $cookie_nocache $http_pragma $http_authorization;
            
            # Cache Headers
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key "$scheme$request_method$host$request_uri$is_args$args" always;
        }
        
        # AI Processing Endpoints - Specialized Routing
        location /api/ai/ {
            # Higher rate limit for AI processing
            limit_req zone=api_general burst=100 nodelay;
            
            # Proxy to AI Service
            proxy_pass http://ai_processing_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for AI processing
            proxy_connect_timeout 120s;
            proxy_send_timeout 300s;
            proxy_read_timeout 600s;
            
            # No caching for AI processing
            proxy_cache off;
        }
        
        # Content Upload - Multi-Format Support
        location /upload/ {
            # Upload rate limiting
            limit_req zone=upload burst=20 nodelay;
            
            # Increased limits for file uploads
            client_max_body_size 2048m;
            client_body_timeout 300s;
            
            # Proxy to Upload Service
            proxy_pass http://content_upload_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Upload optimization
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 120s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
        
        # Analytics and Monitoring
        location /analytics/ {
            proxy_pass http://analytics_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Short-term caching for analytics
            proxy_cache micro_cache;
            proxy_cache_valid 200 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
        }
        
        # Monetization Services
        location /monetization/ {
            proxy_pass http://monetization_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # No caching for monetization
            proxy_cache off;
        }
        
        # SEO and Distribution
        location /seo/ {
            proxy_pass http://seo_distribution_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SEO content caching
            proxy_cache static_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_key "$scheme$request_method$host$request_uri";
        }
        
        # Collaboration Platform
        location /collaborate/ {
            proxy_pass http://collaboration_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for real-time collaboration
            proxy_cache_bypass $http_upgrade;
        }
        
        # Static Assets - Aggressive Caching
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm|mp3|wav|ogg)$ {
            # Static file caching
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1h;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            
            # Browser caching
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            
            # Try static files first, then proxy
            try_files $uri @proxy_static;
        }
        
        # Static file proxy fallback
        location @proxy_static {
            proxy_pass http://ainflue_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Static content caching
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1h;
        }
        
        # Health Check Endpoint
        location /health {
            access_log off;
            proxy_pass http://ainflue_backend/health;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        # Nginx Status (Internal)
        location /nginx-status {
            access_log off;
            stub_status on;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            deny all;
        }
        
        # =======================================================================
        # SECURITY RESTRICTIONS - Enterprise Protection
        # =======================================================================
        
        # Block access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block access to configuration files
        location ~ /(\.env|docker-compose|Dockerfile|\.git|\.ssh|\.htaccess|\.htpasswd)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block access to backup files
        location ~ \.(bak|backup|swp|tmp)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Block suspicious requests
        location ~* (eval\(|union.*select|concat.*\(|script.*\>|alert.*\() {
            deny all;
            access_log /var/log/nginx/security.log security;
        }
    }
    
    # ==========================================================================
    # MONITORING AND STATUS SERVER - DevOps Integration
    # ==========================================================================
    
    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;
        
        # Monitoring Dashboard
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }
        
        # Health Check for Load Balancer
        location /health {
            access_log off;
            return 200 "nginx-healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Prometheus Metrics (requires nginx-prometheus-exporter)
        location /metrics {
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://localhost:9113/metrics;
        }
    }
}

# =============================================================================
# STREAM CONFIGURATION - TCP/UDP Load Balancing
# =============================================================================

stream {
    # TCP Load Balancing for Database Connections
    upstream database_cluster {
        server db-primary:5432 weight=3;
        server db-replica-1:5432 weight=1;
        server db-replica-2:5432 weight=1;
    }
    
    # Redis Cluster Load Balancing
    upstream redis_cluster {
        server redis-1:6379;
        server redis-2:6379;
        server redis-3:6379;
    }
    
    # Database Proxy
    server {
        listen 5432;
        proxy_pass database_cluster;
        proxy_timeout 3s;
        proxy_responses 1;
    }
    
    # Redis Proxy
    server {
        listen 6379;
        proxy_pass redis_cluster;
        proxy_timeout 3s;
        proxy_responses 1;
    }
}

# =============================================================================
# END OF NGINX ENTERPRISE CONFIGURATION
# =============================================================================