# Development Environment Setup
development_environment:
  local_setup:
    required_tools:
      - name: "Docker"
        version: ">=24.0.0"
        purpose: "Containerization"
        
      - name: "Node.js"
        version: ">=18.0.0"
        purpose: "JavaScript runtime"
        
      - name: "Python"
        version: ">=3.11.0"
        purpose: "Backend development"
        
      - name: "PostgreSQL"
        version: ">=15.0"
        purpose: "Primary database"
        
      - name: "Redis"
        version: ">=7.0"
        purpose: "Caching and sessions"
        
      - name: "Git"
        version: ">=2.40.0"
        purpose: "Version control"
        
    ide_configuration:
      vscode:
        extensions:
          - "ms-python.python"
          - "bradlc.vscode-tailwindcss"
          - "ms-vscode.vscode-typescript-next"
          - "ms-vscode-remote.remote-containers"
          - "ms-azuretools.vscode-docker"
          - "esbenp.prettier-vscode"
          
        settings:
          typescript_format_enable: true
          python_linting_enabled: true
          auto_save: "afterDelay"
          
      jetbrains:
        products: ["PyCharm Professional", "WebStorm"]
        plugins:
          - "Docker"
          - "Database Tools"
          - "GitToolBox"

# Code Quality Standards
code_quality:
  linting:
    python:
      tool: "flake8"
      config_file: ".flake8"
      rules:
        max_line_length: 88
        max_complexity: 10
        ignore: ["E203", "W503"]
        
    javascript_typescript:
      tool: "eslint"
      config_file: ".eslintrc.js"
      extends:
        - "@typescript-eslint/recommended"
        - "prettier"
        
    additional_tools:
      - "black"  # Python code formatter
      - "prettier"  # JS/TS formatter
      - "isort"  # Python import sorter
      
  type_checking:
    python:
      tool: "mypy"
      strict_mode: true
      
    typescript:
      strict: true
      no_implicit_any: true
      
  security_scanning:
    python:
      tool: "bandit"
      severity_level: "medium"
      
    javascript:
      tool: "npm audit"
      fix_automatically: false
      
    secrets_detection:
      tool: "git-secrets"
      patterns: ["api_key", "password", "secret"]

# Testing Framework
testing:
  unit_testing:
    python:
      framework: "pytest"
      coverage_tool: "pytest-cov"
      min_coverage: 80
      
      configuration:
        markers: ["unit", "integration", "slow"]
        test_discovery: "test_*.py"
        output_format: "html"
        
    javascript_typescript:
      framework: "jest"
      coverage_threshold: 80
      
      configuration:
        test_environment: "jsdom"
        setup_files: ["<rootDir>/src/setupTests.ts"]
        module_name_mapper:
          "\\.(css|less|scss)$": "identity-obj-proxy"
          
  integration_testing:
    database_testing:
      tool: "testcontainers"
      containers: ["postgres", "redis", "elasticsearch"]
      
    api_testing:
      tool: "pytest"
      framework: "httpx"
      
    e2e_testing:
      tool: "playwright"
      browsers: ["chromium", "firefox", "webkit"]
      
  performance_testing:
    load_testing:
      tool: "locust"
      scenarios: ["normal_load", "peak_load", "stress_test"]
      
    profiling:
      python: "py-spy"
      javascript: "clinic.js"

# Development Workflow
development_workflow:
  git_workflow:
    branching_strategy: "git_flow"
    
    branch_naming:
      feature: "feature/{ticket-number}-{description}"
      bugfix: "bugfix/{ticket-number}-{description}"
      hotfix: "hotfix/{ticket-number}-{description}"
      
    commit_conventions:
      format: "{type}({scope}): {description}"
      types: ["feat", "fix", "docs", "style", "refactor", "test", "chore"]
      
    pre_commit_hooks:
      - "lint"
      - "type_check"
      - "test"
      - "security_scan"
      
  code_review:
    required_reviewers: 2
    automated_checks: true
    
    review_checklist:
      - "Code follows style guidelines"
      - "Tests are included and passing"
      - "Documentation is updated"
      - "Security considerations addressed"
      - "Performance impact assessed"
      
  continuous_integration:
    platform: "GitHub Actions"
    
    pipeline_stages:
      - name: "lint"
        commands: ["npm run lint", "flake8 ."]
        
      - name: "test"
        commands: ["npm test", "pytest"]
        parallel: true
        
      - name: "build"
        commands: ["npm run build", "docker build ."]
        depends_on: ["lint", "test"]
        
      - name: "security_scan"
        commands: ["npm audit", "bandit -r ."]
        
    notifications:
      slack_webhook: "${DEV_SLACK_WEBHOOK}"
      email_notifications: true

# Development Tools
development_tools:
  debugging:
    python:
      debugger: "pdb++"
      profiler: "py-spy"
      
    javascript:
      debugger: "node --inspect"
      profiler: "chrome_devtools"
      
  monitoring:
    local_observability:
      logs: "docker-compose logs"
      metrics: "prometheus + grafana"
      tracing: "jaeger"
      
  api_development:
    documentation: "swagger/openapi"
    testing: "postman + newman"
    mocking: "json-server"
    
  database_tools:
    migration: "alembic"
    seeding: "factory_boy"
    gui: "pgadmin4"

# Hot Reload and Development Server
hot_reload:
  backend:
    python:
      tool: "uvicorn"
      options: "--reload --reload-dir src"
      
  frontend:
    tool: "vite"
    options: "--host --port 3000"
    
  configuration_changes:
    auto_restart: true
    config_watch_paths: ["./config/", "./env/"]

# Mock Services
mock_services:
  external_apis:
    youtube_api:
      enabled: true
      mock_responses: true
      response_delay: 100  # ms
      
    spotify_api:
      enabled: true
      mock_responses: true
      
    openai_api:
      enabled: true
      mock_responses: true
      cost_simulation: true
      
  third_party_services:
    payment_gateways: true
    email_services: true
    sms_services: true
    
  configuration:
    mock_percentage: 100  # 100% mocked in dev
    realistic_delays: true
    error_simulation: true

# Environment Variables
environment_variables:
  development:
    DATABASE_URL: "postgresql://iacherie_dev:dev_password@localhost:5432/iacherie_creator_dev"
    REDIS_URL: "redis://localhost:6379/0"
    JWT_SECRET: "dev-jwt-secret-not-for-production"
    LOG_LEVEL: "DEBUG"
    
  required_variables:
    - "DATABASE_URL"
    - "REDIS_URL"
    - "JWT_SECRET"
    
  optional_variables:
    - "OPENAI_API_KEY"
    - "ANTHROPIC_API_KEY"
    - "STRIPE_SECRET_KEY"
    
  validation:
    check_required: true
    warn_missing_optional: true

# Development Databases
development_databases:
  postgresql:
    host: "localhost"
    port: 5432
    database: "iacherie_creator_dev"
    username: "iacherie_dev"
    password: "dev_password_123"
    
    development_features:
      query_logging: true
      slow_query_log: true
      explain_analyze: true
      
  redis:
    host: "localhost"
    port: 6379
    db: 0
    
    development_features:
      monitor_commands: true
      slowlog_enabled: true
      
  test_databases:
    postgresql_test:
      database: "iacherie_creator_test"
      username: "iacherie_test"
      
    isolation:
      database_per_test: false
      transaction_rollback: true

# Development Scripts
development_scripts:
  setup:
    initial_setup: "./scripts/dev_setup.sh"
    database_setup: "./scripts/setup_db.sh"
    install_dependencies: "./scripts/install_deps.sh"
    
  daily_workflow:
    start_dev_env: "./scripts/start_dev.sh"
    stop_dev_env: "./scripts/stop_dev.sh"
    reset_database: "./scripts/reset_db.sh"
    
  utilities:
    generate_test_data: "python scripts/generate_test_data.py"
    backup_dev_db: "./scripts/backup_dev_db.sh"
    update_schemas: "python scripts/update_schemas.py"

# Performance Profiling
performance_profiling:
  python:
    profiler: "py-spy"
    output_format: "flamegraph"
    sampling_frequency: 100  # Hz
    
  database:
    query_profiling: true
    slow_query_threshold: 1000  # ms
    explain_analyze: true
    
  memory_profiling:
    tool: "memory_profiler"
    track_allocations: true

# Security in Development
development_security:
  secrets_management:
    tool: "python-dotenv"
    env_file: ".env.development"
    
  https_in_development:
    enabled: false
    self_signed_certs: true
    
  authentication:
    bypass_2fa: true
    test_users: true
    admin_access: true

# Documentation Generation
documentation:
  api_docs:
    tool: "swagger"
    auto_generation: true
    interactive_docs: true
    
  code_docs:
    python: "sphinx"
    javascript: "jsdoc"
    
  database_docs:
    schema_docs: "schemaspy"
    erd_generation: true

# Development Analytics
development_analytics:
  development_metrics:
    build_times: true
    test_execution_times: true
    hot_reload_performance: true
    
  code_metrics:
    complexity_analysis: true
    code_coverage: true
    dependency_analysis: true
    
  productivity_metrics:
    commits_per_day: true
    lines_of_code: true
    bug_fix_time: true

# Troubleshooting
troubleshooting:
  common_issues:
    database_connection:
      symptoms: "Connection refused"
      solutions: ["Check PostgreSQL is running", "Verify connection string"]
      
    port_conflicts:
      symptoms: "Port already in use"
      solutions: ["Check running processes", "Use different port"]
      
  logging:
    debug_mode: true
    verbose_logging: true
    log_file: "./logs/development.log"
    
  health_checks:
    database_health: true
    redis_health: true
    external_service_health: true

# Development Team Tools
team_tools:
  communication:
    slack_integration: true
    github_notifications: true
    
  project_management:
    jira_integration: true
    github_projects: true
    
  knowledge_sharing:
    confluence: true
    internal_wiki: true
    
# Containerization
containerization:
  docker:
    development_dockerfile: "Dockerfile.dev"
    docker_compose: "docker-compose.dev.yml"
    
    services:
      - "app"
      - "database"
      - "redis"
      - "elasticsearch"
      
    volumes:
      source_code: "./src:/app/src"
      node_modules: "/app/node_modules"
      
    networking:
      internal_network: "iacherie_dev"
      port_mapping: true