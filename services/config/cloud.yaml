# AWS Configuration
aws:
  credentials:
    access_key_id: "${AWS_ACCESS_KEY_ID}"
    secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
    region: "${AWS_REGION:-eu-west-1}"
    
  s3:
    content_bucket:
      name: "iacherie-creator-content"
      region: "eu-west-1"
      versioning: true
      encryption:
        type: "AES256"
        kms_key_id: "${AWS_KMS_KEY_ID}"
      lifecycle_policies:
        - id: "transition_to_ia"
          status: "Enabled"
          transitions:
            - days: 30
              storage_class: "STANDARD_IA"
            - days: 90
              storage_class: "GLACIER"
            - days: 365
              storage_class: "DEEP_ARCHIVE"
              
    backup_bucket:
      name: "iacherie-backups"
      region: "eu-west-1"
      cross_region_replication:
        destination_bucket: "iacherie-backups-us"
        destination_region: "us-east-1"
        
    public_assets_bucket:
      name: "iacherie-public-assets"
      region: "eu-west-1"
      public_read: true
      cors_configuration:
        allowed_origins: ["https://creator.iacherie.com"]
        allowed_methods: ["GET", "HEAD"]
        allowed_headers: ["*"]
        
  cloudfront:
    content_distribution:
      domain_name: "cdn.iacherie.com"
      price_class: "PriceClass_All"
      origins:
        - domain_name: "iacherie-creator-content.s3.eu-west-1.amazonaws.com"
          origin_path: "/public"
      cache_behaviors:
        default:
          target_origin_id: "S3-iacherie-creator-content"
          viewer_protocol_policy: "redirect-to-https"
          allowed_methods: ["GET", "HEAD", "OPTIONS"]
          cached_methods: ["GET", "HEAD"]
          cache_policy_id: "creator_optimized"
          ttl:
            min: 0
            default: 86400
            max: 31536000
            
  rds:
    primary_instance:
      identifier: "iacherie-creator-primary"
      engine: "postgres"
      engine_version: "15.4"
      instance_class: "db.r6g.2xlarge"
      allocated_storage: 500
      storage_encrypted: true
      multi_az: true
      backup_retention_period: 30
      
    read_replicas:
      - identifier: "iacherie-creator-read-1"
        source_db: "iacherie-creator-primary"
        instance_class: "db.r6g.xlarge"
        auto_minor_version_upgrade: true
        
  elasticache:
    redis_cluster:
      cluster_id: "iacherie-redis"
      engine: "redis"
      engine_version: "7.0"
      node_type: "cache.r7g.large"
      num_cache_nodes: 3
      parameter_group: "default.redis7"
      port: 6379
      security_groups: ["${REDIS_SECURITY_GROUP}"]
      
  lambda:
    functions:
      content_processor:
        function_name: "iacherie-content-processor"
        runtime: "python3.11"
        handler: "handler.process_content"
        memory_size: 1024
        timeout: 300
        environment_variables:
          ENVIRONMENT: "${ENVIRONMENT}"
          
      thumbnail_generator:
        function_name: "iacherie-thumbnail-generator"
        runtime: "python3.11"
        handler: "handler.generate_thumbnail"
        memory_size: 2048
        timeout: 600
        
  sqs:
    queues:
      content_processing:
        name: "iacherie-content-processing"
        visibility_timeout: 300
        message_retention_period: 1209600
        dead_letter_queue:
          name: "iacherie-content-processing-dlq"
          max_receive_count: 3
          
      notification_queue:
        name: "iacherie-notifications"
        visibility_timeout: 60
        message_retention_period: 345600
        
  sns:
    topics:
      creator_notifications:
        name: "iacherie-creator-notifications"
        display_name: "Creator Notifications"
        
  ec2:
    auto_scaling:
      launch_template:
        name: "iacherie-creator-lt"
        image_id: "ami-0c02fb55956c7d316"
        instance_type: "t3.large"
        key_name: "${EC2_KEY_PAIR}"
        security_groups: ["${APP_SECURITY_GROUP}"]
        
      auto_scaling_group:
        name: "iacherie-creator-asg"
        min_size: 2
        max_size: 20
        desired_capacity: 4
        health_check_type: "ELB"
        health_check_grace_period: 300

# Google Cloud Platform Configuration
gcp:
  credentials:
    project_id: "${GCP_PROJECT_ID}"
    service_account_key: "${GCP_SERVICE_ACCOUNT_KEY}"
    
  cloud_storage:
    content_bucket:
      name: "iacherie-gcp-content"
      location: "EU"
      storage_class: "STANDARD"
      lifecycle_rules:
        - action: "SetStorageClass"
          condition:
            age: 30
          storage_class: "NEARLINE"
        - action: "SetStorageClass"
          condition:
            age: 90
          storage_class: "COLDLINE"
          
    ai_models_bucket:
      name: "iacherie-ai-models"
      location: "US"
      storage_class: "STANDARD"
      versioning: true
      
  cloud_sql:
    instance:
      name: "iacherie-postgres"
      database_version: "POSTGRES_15"
      tier: "db-custom-4-16384"
      region: "europe-west1"
      backup_configuration:
        enabled: true
        start_time: "02:00"
        location: "eu"
        point_in_time_recovery_enabled: true
        
  compute_engine:
    instance_template:
      name: "iacherie-template"
      machine_type: "e2-standard-4"
      boot_disk:
        source_image: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts"
        disk_size_gb: 100
        auto_delete: true
        
    instance_group:
      name: "iacherie-ig"
      base_instance_name: "iacherie-vm"
      target_size: 3
      
  cloud_run:
    services:
      api_service:
        name: "iacherie-api"
        image: "gcr.io/${GCP_PROJECT_ID}/iacherie-api:latest"
        port: 8080
        cpu: "2"
        memory: "4Gi"
        max_instances: 100
        concurrency: 1000
        
  cloud_functions:
    functions:
      image_processor:
        name: "process-images"
        runtime: "python311"
        entry_point: "process_image"
        memory: "2GB"
        timeout: "540s"
        
  ai_platform:
    vertex_ai:
      location: "us-central1"
      models:
        content_classifier:
          display_name: "Content Classifier"
          model_id: "content_classifier_v1"
          
  cloud_cdn:
    backend_bucket:
      name: "iacherie-cdn-backend"
      bucket_name: "iacherie-gcp-content"
      enable_cdn: true
      
  monitoring:
    workspace:
      project_id: "${GCP_PROJECT_ID}"
      
  logging:
    log_sink:
      name: "iacherie-logs"
      destination: "bigquery.googleapis.com/projects/${GCP_PROJECT_ID}/datasets/logs"

# Microsoft Azure Configuration
azure:
  credentials:
    subscription_id: "${AZURE_SUBSCRIPTION_ID}"
    tenant_id: "${AZURE_TENANT_ID}"
    client_id: "${AZURE_CLIENT_ID}"
    client_secret: "${AZURE_CLIENT_SECRET}"
    
  storage_account:
    name: "iacheriestorage"
    resource_group: "iacherie-rg"
    location: "West Europe"
    account_tier: "Standard"
    replication_type: "GRS"
    
    containers:
      content:
        name: "creator-content"
        public_access: "blob"
        
      backups:
        name: "system-backups"
        public_access: "none"
        
  sql_database:
    server:
      name: "iacherie-sql-server"
      resource_group: "iacherie-rg"
      location: "West Europe"
      version: "12.0"
      administrator_login: "${AZURE_SQL_ADMIN}"
      administrator_password: "${AZURE_SQL_PASSWORD}"
      
    database:
      name: "iacherie-creator-db"
      edition: "Standard"
      service_objective: "S2"
      max_size_bytes: 268435456000
      
  app_service:
    plan:
      name: "iacherie-app-plan"
      resource_group: "iacherie-rg"
      location: "West Europe"
      sku: "P2v2"
      
    web_app:
      name: "iacherie-creator-app"
      runtime_stack: "PYTHON|3.11"
      always_on: true
      
  redis_cache:
    name: "iacherie-redis"
    resource_group: "iacherie-rg"
    location: "West Europe"
    capacity: 1
    family: "P"
    sku_name: "Premium"
    
  cognitive_services:
    text_analytics:
      name: "iacherie-text-analytics"
      kind: "TextAnalytics"
      sku: "S"
      
    computer_vision:
      name: "iacherie-computer-vision"
      kind: "ComputerVision"
      sku: "S1"
      
  cdn:
    profile:
      name: "iacherie-cdn"
      sku: "Standard_Microsoft"
      
    endpoint:
      name: "iacherie-content"
      origin_host_header: "iacheriestorage.blob.core.windows.net"

# Multi-Cloud Configuration
multi_cloud:
  primary_provider: "aws"
  backup_provider: "gcp"
  
  data_replication:
    enabled: true
    sync_frequency: "hourly"
    conflict_resolution: "primary_wins"
    
  load_balancing:
    strategy: "cost_optimized"
    health_check_interval: 30
    failover_threshold: 3
    
  disaster_recovery:
    rpo_minutes: 15  # Recovery Point Objective
    rto_minutes: 30  # Recovery Time Objective
    automated_failover: true
    
# Cloud Security
security:
  encryption:
    at_rest: true
    in_transit: true
    key_management: "cloud_kms"
    
  network:
    vpc_enabled: true
    private_subnets: true
    network_acls: true
    security_groups: true
    
  iam:
    least_privilege: true
    role_based_access: true
    service_accounts: true
    
  compliance:
    gdpr: true
    sox: true
    iso27001: true
    
# Cost Optimization
cost_optimization:
  resource_tagging:
    mandatory_tags:
      - "Environment"
      - "Project"
      - "Owner"
      - "CostCenter"
      
  auto_scaling:
    enabled: true
    metrics_based: true
    schedule_based: true
    
  reserved_instances:
    utilization_target: 80
    commitment_type: "1year"
    
  spot_instances:
    enabled: true
    max_percentage: 30
    
# Monitoring & Alerting
monitoring:
  cloud_watch:
    custom_metrics: true
    log_retention_days: 90
    
  stack_driver:
    enabled: true
    uptime_checks: true
    
  azure_monitor:
    enabled: true
    action_groups: true
    
  alerts:
    cost_threshold: 10000  # USD per month
    resource_utilization: 85
    error_rate: 5
    
# Backup & Disaster Recovery
backup:
  cross_region: true
  cross_cloud: true
  encryption: true
  
  schedules:
    databases: "daily"
    file_storage: "hourly"
    configurations: "daily"
    
  retention:
    daily: 30
    weekly: 12
    monthly: 12
    yearly: 7