# Enterprise Services Configuration
# Author: Fahed Mlaiel (mlaiel@live.de)
# Version: 1.0.0 Enterprise

# Service Discovery & Registry
service_registry:
  redis_url: "redis://localhost:6379"
  registry_ttl: 300
  health_check_interval: 30
  cleanup_interval: 60
  max_retries: 3

# Health Monitoring
health_monitor:
  redis_url: "redis://localhost:6379"
  check_interval: 30
  cleanup_interval: 300
  metrics_retention_hours: 24
  alert_thresholds:
    cpu_usage_warning: 80.0
    cpu_usage_critical: 95.0
    memory_usage_warning: 85.0
    memory_usage_critical: 95.0
    disk_usage_warning: 80.0
    disk_usage_critical: 90.0
    response_time_warning: 1000.0
    response_time_critical: 5000.0

# Event Bus
event_bus:
  redis_url: "redis://localhost:6379"
  event_store_ttl: 86400
  dead_letter_ttl: 604800
  max_batch_size: 100
  processing_timeout: 30
  event_sourcing_enabled: true
  snapshot_interval: 1000

# Configuration Manager
config_manager:
  config_dir: "./config"
  redis_url: "redis://localhost:6379"
  environment: "production"
  enable_hot_reload: true
  reload_interval: 30
  enable_caching: true
  cache_ttl: 300

# Lifecycle Manager
lifecycle_manager:
  redis_url: "redis://localhost:6379"
  health_check_interval: 30
  state_sync_interval: 10
  max_concurrent_operations: 10

# Metrics Collector
metrics_collector:
  redis_url: "redis://localhost:6379"
  collection_interval: 10
  retention_days: 30
  max_metrics_per_service: 1000
  enable_prometheus: true
  prometheus_port: 8090

# AI Orchestrator
ai_orchestrator:
  redis_url: "redis://localhost:6379"
  default_timeout: 30
  max_concurrent_tasks: 100
  task_queue_size: 1000
  routing_strategy: "cost_performance"
  anomaly_detection_enabled: true
  cost_optimization_enabled: true

# Media Pipeline
media_pipeline:
  redis_url: "redis://localhost:6379"
  storage_path: "/tmp/media_pipeline"
  max_concurrent_jobs: 10
  max_file_size: 5368709120  # 5GB
  cleanup_interval: 3600
  enable_quality_enhancement: true
  enable_real_time_streaming: true

# Processing Services
processing_services:
  content_processor:
    max_file_size: 104857600  # 100MB
    supported_formats: ["txt", "md", "html", "pdf", "doc", "docx"]
    enable_ai_analysis: true
    
  validation_service:
    strict_mode: true
    max_validation_time: 30
    enable_deep_validation: true
    
  transformation_engine:
    max_transformation_time: 60
    enable_batch_processing: true
    parallel_workers: 4

# Security Settings
security:
  enable_service_auth: true
  jwt_secret: "${JWT_SECRET}"
  token_expiry: 3600
  rate_limiting:
    requests_per_minute: 100
    burst_limit: 20
  encryption:
    algorithm: "AES-256-GCM"
    key_rotation_days: 30

# Performance Tuning
performance:
  connection_pool_size: 20
  connection_timeout: 30
  request_timeout: 60
  retry_attempts: 3
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 60
    half_open_calls: 5

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  enable_correlation_ids: true
  enable_distributed_tracing: true
  max_log_size: "100MB"
  retention_days: 30

# Monitoring & Observability
monitoring:
  enable_metrics: true
  metrics_port: 8091
  health_check_port: 8092
  enable_tracing: true
  jaeger_endpoint: "http://localhost:14268/api/traces"
  prometheus_endpoint: "http://localhost:9090"