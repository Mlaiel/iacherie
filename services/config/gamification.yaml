# Points System Configuration
points_system:
  earning_actions:
    content_creation:
      upload_video: 25
      upload_audio: 20
      upload_image: 15
      upload_text: 10
      live_stream: 50
      
    engagement:
      video_view: 1
      like_received: 2
      comment_received: 3
      share_received: 5
      subscription_gained: 10
      
    collaboration:
      collaboration_invite_sent: 5
      collaboration_accepted: 25
      collaboration_completed: 100
      featured_collaboration: 200
      
    quality_metrics:
      viral_content: 500  # >100k views in 24h
      trending_content: 250  # Top 10 trending
      featured_content: 150  # Platform featured
      high_engagement: 75   # >10% engagement rate
      
    platform_activities:
      daily_login: 5
      weekly_streak: 35
      monthly_streak: 200
      profile_completion: 50
      bio_optimization: 25
      
    community_building:
      mentor_new_creator: 100
      helpful_comment: 10
      tutorial_creation: 150
      community_event_participation: 75
      
    business_achievements:
      first_monetization: 200
      revenue_milestone_100: 300
      revenue_milestone_1000: 500
      revenue_milestone_10000: 1000
      
  multipliers:
    creator_tier:
      bronze: 1.0
      silver: 1.2
      gold: 1.5
      platinum: 2.0
      diamond: 2.5
      
    content_category:
      educational: 1.3
      music: 1.2
      gaming: 1.1
      lifestyle: 1.0
      entertainment: 1.0
      
    time_bonuses:
      weekend_bonus: 1.1
      holiday_bonus: 1.5
      peak_hours: 1.2  # 6-9 PM local time
      
  decay_system:
    enabled: true
    inactivity_threshold_days: 30
    decay_rate_per_day: 0.1  # 0.1% per day
    minimum_retention: 0.5   # Retain at least 50%

