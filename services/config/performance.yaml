# Performance Optimization Configuration
# Author: Fahed Mlaiel (mlaiel@live.de)
# Version: 1.0.0 Enterprise

# Global Performance Settings
global:
  target_response_time_ms: 100
  max_response_time_ms: 5000
  target_throughput_rps: 10000
  max_memory_usage_percent: 85
  max_cpu_usage_percent: 80

# Service-Specific Performance Tuning
services:
  service_registry:
    cache_size: 10000
    cache_ttl: 300
    connection_pool: 20
    discovery_timeout_ms: 50
    load_balancing:
      strategy: "least_response_time"
      health_check_interval: 10
      
  health_monitor:
    check_parallelism: 50
    check_timeout_ms: 5000
    circuit_breaker:
      failure_threshold: 5
      recovery_timeout: 30
      half_open_calls: 3
      
  event_bus:
    batch_size: 100
    batch_timeout_ms: 50
    producer_buffer: 10000
    consumer_threads: 10
    compression: true
    
  ai_orchestrator:
    request_batching: true
    batch_size: 10
    batch_timeout_ms: 100
    model_caching: true
    cache_size: 1000
    connection_pooling:
      openai: 20
      anthropic: 15
      google: 15
      
  media_pipeline:
    transcoding_parallelism: 4
    thumbnail_generation: true
    progressive_upload: true
    chunk_size: 1048576  # 1MB
    streaming_buffer: 8388608  # 8MB

# Caching Strategy
caching:
  levels:
    l1:  # In-memory cache
      size: 100MB
      ttl: 60
      eviction: "lru"
    l2:  # Redis cache
      size: 1GB
      ttl: 300
      compression: true
    l3:  # Persistent cache
      size: 10GB
      ttl: 3600
      
  cache_patterns:
    configuration: "l1+l2"
    metrics: "l1"
    media_metadata: "l1+l2+l3"
    ai_responses: "l2+l3"
    user_sessions: "l1+l2"

# Connection Management
connections:
  database:
    pool_size: 50
    max_overflow: 20
    pool_timeout: 30
    pool_recycle: 3600
    
  redis:
    pool_size: 20
    socket_timeout: 5
    socket_connect_timeout: 5
    retry_on_timeout: true
    
  http_clients:
    pool_connections: 20
    pool_maxsize: 50
    max_retries: 3
    backoff_factor: 0.3

# Resource Optimization
resources:
  memory:
    garbage_collection:
      strategy: "generational"
      frequency: "auto"
      threshold: 80
    object_pooling:
      enabled: true
      pool_sizes:
        small_objects: 1000
        medium_objects: 500
        large_objects: 100
        
  cpu:
    thread_pool:
      core_threads: 10
      max_threads: 50
      keep_alive: 60
    async_workers:
      count: "auto"  # CPU cores * 2
      queue_size: 1000
      
  io:
    buffer_sizes:
      read_buffer: 65536   # 64KB
      write_buffer: 65536  # 64KB
      network_buffer: 131072  # 128KB
    aio:
      enabled: true
      max_connections: 1000

# Compression & Serialization
compression:
  enable_compression: true
  algorithms:
    text: "gzip"
    binary: "lz4"
    streaming: "snappy"
  compression_level: 6
  min_compression_size: 1024

serialization:
  default_format: "msgpack"
  formats:
    config: "yaml"
    metrics: "json"
    events: "avro"
    cache: "pickle"

# Load Balancing
load_balancing:
  strategies:
    default: "weighted_round_robin"
    cpu_intensive: "least_connections"
    io_intensive: "round_robin"
    
  health_checks:
    interval: 10
    timeout: 5
    failure_threshold: 3
    success_threshold: 2
    
  circuit_breaker:
    failure_rate_threshold: 50
    slow_call_rate_threshold: 50
    slow_call_duration_threshold: 2000
    minimum_number_of_calls: 10

# Auto-scaling Configuration
auto_scaling:
  enabled: true
  metrics:
    cpu_threshold: 70
    memory_threshold: 80
    response_time_threshold: 500
    error_rate_threshold: 5
    
  scaling_rules:
    scale_up:
      cooldown: 300
      step_size: 2
      max_instances: 20
    scale_down:
      cooldown: 600
      step_size: 1
      min_instances: 2

# Optimization Profiles
profiles:
  development:
    enable_debug: true
    cache_ttl: 60
    connection_pool: 5
    
  testing:
    enable_metrics: false
    cache_ttl: 30
    timeout_multiplier: 2
    
  staging:
    enable_metrics: true
    cache_ttl: 300
    connection_pool: 10
    
  production:
    enable_metrics: true
    enable_tracing: true
    cache_ttl: 600
    connection_pool: 20
    optimization_level: "aggressive"

# Performance Monitoring
monitoring:
  metrics:
    collection_interval: 10
    retention_period: 86400  # 24 hours
    
  alerts:
    response_time_p95: 1000
    error_rate: 1.0
    cpu_usage: 80
    memory_usage: 85
    
  profiling:
    enabled: true
    sampling_rate: 0.01
    profile_duration: 60