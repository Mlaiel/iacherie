# Enterprise Grafana Dashboards Configuration - Ainflue Platform
# Author: Fahed Mlaiel (DevOps & Monitoring Expert)
# Version: 1.0.0 Enterprise
# Role: DevOps Engineer + Site Reliability Engineer

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    
  - name: AlertManager
    type: alertmanager
    url: http://alertmanager:9093
    access: proxy

dashboards:
  - title: "Ainflue Enterprise Services Overview"
    uid: "ainflue-enterprise-overview"
    editable: true
    refresh: "30s"
    time:
      from: "now-6h"
      to: "now"
    panels:
      - title: "Service Health Status"
        type: "stat"
        targets:
          - expr: "up{job='ainflue-services'}"
            legendFormat: "{{instance}}"
        thresholds:
          - color: "red"
            value: 0
          - color: "green"
            value: 1
            
      - title: "API Response Time (P95)"
        type: "graph"
        targets:
          - expr: "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job='ainflue-services'}[5m])) by (le))"
            legendFormat: "P95 Response Time"
        yAxes:
          left:
            unit: "s"
            max: 1.0  # 1 second max for enterprise SLA
            
      - title: "Request Rate"
        type: "graph"
        targets:
          - expr: "sum(rate(http_requests_total{job='ainflue-services'}[5m])) by (method, endpoint)"
            legendFormat: "{{method}} {{endpoint}}"
            
      - title: "Error Rate"
        type: "graph"
        targets:
          - expr: "sum(rate(http_requests_total{job='ainflue-services',status=~'4..|5..'}[5m])) / sum(rate(http_requests_total{job='ainflue-services'}[5m]))"
            legendFormat: "Error Rate"
        yAxes:
          left:
            unit: "percentunit"
            max: 0.05  # 5% max error rate
            
  - title: "Ainflue Performance Metrics"
    uid: "ainflue-performance"
    editable: true
    refresh: "15s"
    panels:
      - title: "CPU Usage by Service"
        type: "graph"
        targets:
          - expr: "avg by (service) (cpu_usage{job='ainflue-services'})"
            legendFormat: "{{service}}"
        yAxes:
          left:
            unit: "percent"
            max: 100
            
      - title: "Memory Usage by Service"
        type: "graph"
        targets:
          - expr: "avg by (service) (memory_usage_bytes{job='ainflue-services'} / 1024 / 1024 / 1024)"
            legendFormat: "{{service}}"
        yAxes:
          left:
            unit: "bytes"
            
      - title: "Active Connections"
        type: "stat"
        targets:
          - expr: "sum(active_connections{job='ainflue-services'})"
            legendFormat: "Total Connections"
            
      - title: "Circuit Breaker Status"
        type: "table"
        targets:
          - expr: "circuit_breaker_state{job='ainflue-services'}"
            format: "table"
            
  - title: "Ainflue Security Metrics"
    uid: "ainflue-security"
    editable: true
    refresh: "30s"
    panels:
      - title: "mTLS Certificate Status"
        type: "stat"
        targets:
          - expr: "mtls_certificate_expiry_days{job='ainflue-services'}"
            legendFormat: "Days until expiry"
        thresholds:
          - color: "red"
            value: 7
          - color: "yellow"
            value: 30
          - color: "green"
            value: 90
            
      - title: "Authentication Success Rate"
        type: "graph"
        targets:
          - expr: "sum(rate(auth_requests_total{job='ainflue-services',status='success'}[5m])) / sum(rate(auth_requests_total{job='ainflue-services'}[5m]))"
            legendFormat: "Success Rate"
        yAxes:
          left:
            unit: "percentunit"
            min: 0.95  # 95% minimum success rate
            
      - title: "Failed Login Attempts"
        type: "graph"
        targets:
          - expr: "sum(rate(auth_requests_total{job='ainflue-services',status='failed'}[5m])) by (source_ip)"
            legendFormat: "{{source_ip}}"
            
  - title: "Ainflue Auto-Scaling Metrics"
    uid: "ainflue-scaling"
    editable: true
    refresh: "30s"
    panels:
      - title: "Pod Scaling Events"
        type: "graph"
        targets:
          - expr: "kube_horizontalpodautoscaler_status_current_replicas{namespace='ainflue'}"
            legendFormat: "{{horizontalpodautoscaler}} Current"
          - expr: "kube_horizontalpodautoscaler_status_desired_replicas{namespace='ainflue'}"
            legendFormat: "{{horizontalpodautoscaler}} Desired"
            
      - title: "Resource Utilization vs Targets"
        type: "graph"
        targets:
          - expr: "kube_horizontalpodautoscaler_status_current_metrics_value{namespace='ainflue'}"
            legendFormat: "Current {{metric_name}}"
          - expr: "kube_horizontalpodautoscaler_spec_target_metric_value{namespace='ainflue'}"
            legendFormat: "Target {{metric_name}}"
            
      - title: "Scaling Predictions (ML)"
        type: "graph"
        targets:
          - expr: "ainflue_predicted_load{job='ainflue-ml-scaler'}"
            legendFormat: "Predicted Load"
          - expr: "ainflue_current_load{job='ainflue-services'}"
            legendFormat: "Current Load"

alerting:
  rules:
    - alert: "ServiceDown"
      expr: "up{job='ainflue-services'} == 0"
      for: "1m"
      labels:
        severity: "critical"
      annotations:
        summary: "Service {{$labels.instance}} is down"
        description: "Service {{$labels.instance}} has been down for more than 1 minute"
        
    - alert: "HighResponseTime"
      expr: "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job='ainflue-services'}[5m])) by (le)) > 0.1"
      for: "2m"
      labels:
        severity: "warning"
      annotations:
        summary: "High response time detected"
        description: "P95 response time is {{$value}}s, exceeding 100ms threshold"
        
    - alert: "HighErrorRate"
      expr: "sum(rate(http_requests_total{job='ainflue-services',status=~'4..|5..'}[5m])) / sum(rate(http_requests_total{job='ainflue-services'}[5m])) > 0.05"
      for: "5m"
      labels:
        severity: "critical"
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{$value | humanizePercentage}}, exceeding 5% threshold"
        
    - alert: "CircuitBreakerOpen"
      expr: "circuit_breaker_state{job='ainflue-services'} == 2"
      for: "1m"
      labels:
        severity: "warning"
      annotations:
        summary: "Circuit breaker {{$labels.service}} is open"
        description: "Circuit breaker for {{$labels.service}} has been open for more than 1 minute"
        
    - alert: "mTLSCertificateExpiring"
      expr: "mtls_certificate_expiry_days{job='ainflue-services'} < 30"
      for: "1h"
      labels:
        severity: "warning"
      annotations:
        summary: "mTLS certificate expiring soon"
        description: "Certificate for {{$labels.service}} expires in {{$value}} days"
        
    - alert: "UnexpectedScaling"
      expr: "increase(kube_horizontalpodautoscaler_status_current_replicas{namespace='ainflue'}[5m]) > 5"
      for: "2m"
      labels:
        severity: "warning"
      annotations:
        summary: "Rapid scaling detected"
        description: "Service {{$labels.horizontalpodautoscaler}} scaled by {{$value}} replicas in 5 minutes"

notification_channels:
  - name: "pagerduty"
    type: "pagerduty"
    settings:
      integrationKey: "${PAGERDUTY_INTEGRATION_KEY}"
      severity: "critical"
      
  - name: "slack"
    type: "slack"
    settings:
      url: "${SLACK_WEBHOOK_URL}"
      channel: "#ainflue-alerts"
      username: "Grafana"
      title: "Ainflue Platform Alert"

# PagerDuty integration for critical alerts
pagerduty:
  routing_key: "${PAGERDUTY_INTEGRATION_KEY}"
  severity_mapping:
    critical: "critical"
    warning: "warning"
    info: "info"
  escalation_policy: "ainflue-enterprise-escalation"