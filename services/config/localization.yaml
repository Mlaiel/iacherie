# Localization Configuration Enterprise
# Author: Fahed Mlaiel (mlaiel@live.de)
# Version: 1.0.0 Enterprise Creator Economy Platform
# ⚠️ AVERTISSEMENT LÉGAL: Configuration propriétaire - Utilisation commerciale interdite sans autorisation

# Global Localization Settings
global:
  default_locale: "en"
  fallback_locale: "en"
  auto_detect_locale: true
  
  supported_locales:
    - code: "en"
      name: "English"
      native_name: "English"
      direction: "ltr"
      enabled: true
      
    - code: "fr"
      name: "French"
      native_name: "Français"
      direction: "ltr"
      enabled: true
      
    - code: "de"
      name: "German"
      native_name: "Deutsch"
      direction: "ltr"
      enabled: true
      
    - code: "ar"
      name: "Arabic"
      native_name: "العربية"
      direction: "rtl"
      enabled: true
      
    - code: "es"
      name: "Spanish"
      native_name: "Español"
      direction: "ltr"
      enabled: true
      
    - code: "pt"
      name: "Portuguese"
      native_name: "Português"
      direction: "ltr"
      enabled: true
      
    - code: "it"
      name: "Italian"
      native_name: "Italiano"
      direction: "ltr"
      enabled: true
      
    - code: "ja"
      name: "Japanese"
      native_name: "日本語"
      direction: "ltr"
      enabled: true
      
    - code: "ko"
      name: "Korean"
      native_name: "한국어"
      direction: "ltr"
      enabled: true
      
    - code: "zh-CN"
      name: "Chinese (Simplified)"
      native_name: "简体中文"
      direction: "ltr"
      enabled: true
      
    - code: "zh-TW"
      name: "Chinese (Traditional)"
      native_name: "繁體中文"
      direction: "ltr"
      enabled: true
      
    - code: "ru"
      name: "Russian"
      native_name: "Русский"
      direction: "ltr"
      enabled: true

# Translation Services
translation_services:
  primary_provider: "google_translate"
  
  google_translate:
    api_key: "${GOOGLE_TRANSLATE_API_KEY}"
    project_id: "${GOOGLE_CLOUD_PROJECT_ID}"
    
    features:
      text_translation: true
      document_translation: true
      glossary_support: true
      batch_translation: true
      
    quality_settings:
      model: "nmt"  # Neural Machine Translation
      glossary_enabled: true
      
  azure_translator:
    api_key: "${AZURE_TRANSLATOR_KEY}"
    region: "${AZURE_TRANSLATOR_REGION}"
    
    features:
      text_translation: true
      document_translation: true
      custom_models: true
      
  deepl:
    api_key: "${DEEPL_API_KEY}"
    
    features:
      high_quality_translation: true
      formality_control: true
      
    supported_languages:
      - "en"
      - "de" 
      - "fr"
      - "es"
      - "pt"
      - "it"
      - "ja"
      - "zh"
      - "ru"

# Content Localization
content_localization:
  automatic_translation:
    enabled: true
    confidence_threshold: 0.8
    human_review_required: true
    
  content_types:
    user_generated:
      titles: true
      descriptions: true
      comments: true
      captions: true
      
    platform_content:
      ui_text: true
      help_documentation: true
      email_templates: true
      push_notifications: true
      
    marketing_content:
      landing_pages: true
      advertisements: true
      social_media: true
      press_releases: true
      
  translation_workflows:
    instant_translation:
      trigger: "content_published"
      auto_translate: true
      publish_immediately: false
      
    professional_translation:
      trigger: "viral_content"
      human_translator: true
      quality_assurance: true
      
    community_translation:
      enabled: true
      volunteer_translators: true
      review_process: true

# Cultural Adaptation
cultural_adaptation:
  date_formats:
    en: "MM/dd/yyyy"
    fr: "dd/MM/yyyy"
    de: "dd.MM.yyyy"
    ar: "yyyy/MM/dd"
    es: "dd/MM/yyyy"
    pt: "dd/MM/yyyy"
    it: "dd/MM/yyyy"
    ja: "yyyy/MM/dd"
    ko: "yyyy/MM/dd"
    zh-CN: "yyyy/MM/dd"
    zh-TW: "yyyy/MM/dd"
    ru: "dd.MM.yyyy"
    
  time_formats:
    en: "h:mm a"
    fr: "HH:mm"
    de: "HH:mm"
    ar: "h:mm a"
    es: "HH:mm"
    pt: "HH:mm"
    it: "HH:mm"
    ja: "HH:mm"
    ko: "HH:mm"
    zh-CN: "HH:mm"
    zh-TW: "HH:mm"
    ru: "HH:mm"
    
  number_formats:
    en:
      decimal_separator: "."
      thousands_separator: ","
      
    fr:
      decimal_separator: ","
      thousands_separator: " "
      
    de:
      decimal_separator: ","
      thousands_separator: "."
      
    ar:
      decimal_separator: "٫"
      thousands_separator: "٬"
      
  currency_formats:
    USD: "$#,##0.00"
    EUR: "#,##0.00 €"
    GBP: "£#,##0.00"
    JPY: "¥#,##0"
    KRW: "₩#,##0"
    CNY: "¥#,##0.00"
    RUB: "#,##0.00 ₽"
    
  cultural_preferences:
    color_meanings:
      red:
        positive: ["zh-CN", "zh-TW"]  # Lucky in Chinese culture
        negative: ["en", "fr", "de"]  # Associated with danger
        
    imagery_preferences:
      family_oriented: ["ar", "es", "pt"]
      individual_focused: ["en", "de", "ja"]
      
    communication_styles:
      direct: ["en", "de", "ru"]
      indirect: ["ja", "ko", "zh-CN", "zh-TW"]
      formal: ["ar", "de", "ja"]
      casual: ["en", "es", "pt"]

# Regional Settings
regional_settings:
  timezones:
    auto_detection: true
    user_preference: true
    
    major_timezones:
      - "America/New_York"
      - "America/Los_Angeles"
      - "Europe/London"
      - "Europe/Paris"
      - "Europe/Berlin"
      - "Asia/Tokyo"
      - "Asia/Seoul"
      - "Asia/Shanghai"
      - "Asia/Dubai"
      - "Australia/Sydney"
      
  regional_content:
    trending_topics: true
    local_creators: true
    regional_partnerships: true
    local_events: true
    
  compliance:
    gdpr: ["en", "fr", "de", "es", "pt", "it"]
    ccpa: ["en"]
    pipeda: ["en", "fr"]
    lgpd: ["pt"]

# User Interface Localization
ui_localization:
  text_direction:
    ltr_languages: ["en", "fr", "de", "es", "pt", "it", "ja", "ko", "zh-CN", "zh-TW", "ru"]
    rtl_languages: ["ar"]
    
  layout_adaptation:
    rtl_support: true
    text_expansion_handling: true
    icon_localization: true
    
  font_support:
    latin_script:
      primary: "Inter"
      fallback: "Arial, sans-serif"
      
    arabic_script:
      primary: "Noto Sans Arabic"
      fallback: "Arial, sans-serif"
      
    cjk_script:
      primary: "Noto Sans CJK"
      fallback: "Arial, sans-serif"
      
    cyrillic_script:
      primary: "Noto Sans"
      fallback: "Arial, sans-serif"
      
  responsive_text:
    auto_sizing: true
    overflow_handling: true
    line_height_adjustment: true

# SEO Localization
seo_localization:
  hreflang_tags: true
  localized_urls: true
  
  url_structures:
    subdirectories: true  # /en/, /fr/, /de/
    subdomains: false     # en.domain.com
    domains: false        # domain.en
    
  meta_tags:
    title_localization: true
    description_localization: true
    keywords_localization: true
    
  structured_data:
    localized_schema: true
    language_specification: true

# Content Management
content_management:
  translation_memory:
    enabled: true
    reuse_translations: true
    consistency_checking: true
    
  glossaries:
    technical_terms: true
    brand_terminology: true
    platform_specific: true
    
    categories:
      - "ui_elements"
      - "creator_terms"
      - "monetization"
      - "analytics"
      - "collaboration"
      
  version_control:
    translation_versioning: true
    approval_workflows: true
    rollback_capability: true
    
# Quality Assurance
quality_assurance:
  automated_checks:
    grammar_checking: true
    terminology_consistency: true
    placeholder_validation: true
    length_validation: true
    
  human_review:
    native_speaker_review: true
    cultural_review: true
    technical_review: true
    
  quality_metrics:
    translation_accuracy: true
    cultural_appropriateness: true
    user_satisfaction: true
    
# Performance Optimization
performance:
  caching:
    translation_cache: true
    cache_ttl: 86400  # 24 hours
    cache_invalidation: true
    
  lazy_loading:
    on_demand_translation: true
    progressive_loading: true
    
  cdn_integration:
    localized_content: true
    regional_distribution: true

# Analytics and Reporting
analytics:
  language_usage:
    user_language_preferences: true
    content_language_distribution: true
    translation_usage_stats: true
    
  localization_metrics:
    translation_coverage: true
    quality_scores: true
    user_engagement_by_language: true
    
  performance_metrics:
    translation_speed: true
    cache_hit_rates: true
    loading_times_by_locale: true

# API Localization
api_localization:
  accept_language_header: true
  locale_parameter: true
  
  response_localization:
    error_messages: true
    validation_messages: true
    success_messages: true
    
  date_time_apis:
    timezone_aware: true
    locale_formatted: true

# Mobile Localization
mobile_localization:
  app_store_optimization:
    localized_descriptions: true
    localized_screenshots: true
    localized_keywords: true
    
  push_notifications:
    localized_messages: true
    timezone_aware_scheduling: true
    
  offline_support:
    cached_translations: true
    fallback_content: true

# Legal and Compliance
legal_compliance:
  terms_of_service:
    localized_versions: true
    legal_review_required: true
    
  privacy_policies:
    gdpr_specific: true
    regional_variations: true
    
  age_restrictions:
    country_specific: true
    parental_consent: true

# Community Features
community_localization:
  moderation:
    language_specific_moderators: true
    cultural_context_moderation: true
    
  user_generated_content:
    auto_translation_offers: true
    community_translation: true
    
  support:
    multilingual_support_team: true
    localized_help_content: true
    timezone_appropriate_support: true

# Testing and Validation
testing:
  linguistic_testing:
    pseudo_localization: true
    character_encoding_tests: true
    text_expansion_tests: true
    
  cultural_testing:
    cultural_appropriateness: true
    local_user_testing: true
    
  automated_testing:
    translation_completeness: true
    ui_layout_validation: true
    functionality_testing: true