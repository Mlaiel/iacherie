apiVersion: v1
kind: ConfigMap
metadata:
  name: ia2good-config
  namespace: ia2good
data:
  # URLs des services
  IACHERIE_API_URL: "http://iacherie-api-service.default.svc.cluster.local:8000"
  REDIS_URL: "redis://redis-service.default.svc.cluster.local:6379"
  
  # Configurations IA2GOOD
  ENABLE_AI_FEATURES: "true"
  AI_PRIORITY: "high"
  SOURCE_IDENTIFIER: "ia2good"
  
  # Langues supportées
  SUPPORTED_LANGUAGES: "fr,en,ar,es,pt,de,it,ru,zh,ja,ko,hi,bn,pa,te,mr,ta,ur,fa,tr,vi,th"
  DEFAULT_LANGUAGE: "fr"
  
  # Modules activés
  GUARDIAN_ENABLED: "true"
  EDUVERIFY_ENABLED: "true"
  MEDCARE_ENABLED: "true"
  
  # Limites et quotas (IA2GOOD = illimité car humanitaire)
  RATE_LIMIT_ENABLED: "false"
  DAILY_QUOTA: "unlimited"
  
  # Monitoring
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"
  
  # Log level
  LOG_LEVEL: "INFO"
  
---
apiVersion: v1
kind: Secret
metadata:
  name: ia2good-secrets
  namespace: ia2good
type: Opaque
stringData:
  # Database (même PostgreSQL que IACherie mais base séparée)
  DATABASE_URL: "postgresql://ia2good_user:CHANGE_ME_IN_PRODUCTION@postgres-service.default.svc.cluster.local:5432/ia2good"
  
  # API Key pour accéder à IACherie
  IACHERIE_API_KEY: "ia2good-humanitarian-priority-key-CHANGE_ME"
  
  # JWT Secret (partagé avec IACherie pour SSO)
  JWT_SECRET_KEY: "SHARED_JWT_SECRET_CHANGE_ME_IN_PRODUCTION"
  
  # S3/MinIO
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin123"
  S3_ENDPOINT_URL: "http://minio-service.default.svc.cluster.local:9000"
  S3_BUCKET: "ia2good-files"
  
  # Redis
  REDIS_PASSWORD: ""
  
  # External APIs (pour EduVerify fact-checking)
  WIKIPEDIA_API_KEY: ""
  DUCKDUCKGO_API_KEY: ""
