apiVersion: apps/v1
kind: Deployment
metadata:
  name: medcare-api
  namespace: ia2good
  labels:
    app: medcare-api
    module: medcare
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medcare-api
  template:
    metadata:
      labels:
        app: medcare-api
        module: medcare
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
      - name: medcare-api
        image: medcare-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
          name: http
        - containerPort: 9090
          name: metrics
        
        envFrom:
        - configMapRef:
            name: ia2good-config
        - secretRef:
            name: ia2good-secrets
        
        env:
        - name: MODULE_NAME
          value: "medcare"
        - name: PORT
          value: "8003"
        
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: medcare-api-service
  namespace: ia2good
spec:
  selector:
    app: medcare-api
  ports:
  - name: http
    port: 8003
    targetPort: 8003
  - name: metrics
    port: 9090
    targetPort: 9090
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medcare-api-hpa
  namespace: ia2good
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medcare-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
