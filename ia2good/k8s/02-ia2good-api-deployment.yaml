apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia2good-api
  namespace: ia2good
  labels:
    app: ia2good-api
    module: guardian
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ia2good-api
  template:
    metadata:
      labels:
        app: ia2good-api
        module: guardian
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: ia2good-api
        image: ia2good-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        
        env:
        # From ConfigMap
        - name: IACHERIE_API_URL
          valueFrom:
            configMapKeyRef:
              name: ia2good-config
              key: IACHERIE_API_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: ia2good-config
              key: REDIS_URL
        - name: ENABLE_AI_FEATURES
          valueFrom:
            configMapKeyRef:
              name: ia2good-config
              key: ENABLE_AI_FEATURES
        - name: AI_PRIORITY
          valueFrom:
            configMapKeyRef:
              name: ia2good-config
              key: AI_PRIORITY
        - name: SOURCE_IDENTIFIER
          valueFrom:
            configMapKeyRef:
              name: ia2good-config
              key: SOURCE_IDENTIFIER
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ia2good-config
              key: LOG_LEVEL
        
        # From Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ia2good-secrets
              key: DATABASE_URL
        - name: IACHERIE_API_KEY
          valueFrom:
            secretKeyRef:
              name: ia2good-secrets
              key: IACHERIE_API_KEY
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ia2good-secrets
              key: JWT_SECRET_KEY
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: ia2good-secrets
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ia2good-secrets
              key: S3_SECRET_KEY
        - name: S3_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: ia2good-secrets
              key: S3_ENDPOINT_URL
        
        # Module specific
        - name: MODULE_NAME
          value: "guardian"
        - name: PORT
          value: "8001"
        
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        volumeMounts:
        - name: shared-services
          mountPath: /app/shared_services
          readOnly: true
      
      volumes:
      - name: shared-services
        configMap:
          name: ia2good-shared-services-code

---
apiVersion: v1
kind: Service
metadata:
  name: ia2good-api-service
  namespace: ia2good
  labels:
    app: ia2good-api
spec:
  selector:
    app: ia2good-api
  ports:
  - name: http
    port: 8001
    targetPort: 8001
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ia2good-api-hpa
  namespace: ia2good
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ia2good-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
