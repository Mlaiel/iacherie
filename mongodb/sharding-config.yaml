# MongoDB Sharding Configuration for IA Influencer Agent Platform
# Production-ready sharded cluster deployment for horizontal scaling
#
# Author: Fahed Mlaiel <mlaiel@live.de>
# Copyright: (c) 2025 Fahed Mlaiel. All rights reserved.

apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-sharding-config
  namespace: ia-influencer
  labels:
    app: mongodb
    component: sharding
data:
  # Config server configuration
  mongod-config.conf: |
    # MongoDB Config Server Configuration
    net:
      port: 27019
      bindIp: 0.0.0.0
      maxIncomingConnections: 200
    
    storage:
      dbPath: /data/configdb
      journal:
        enabled: true
      engine: wiredTiger
      wiredTiger:
        engineConfig:
          cacheSizeGB: 1
          journalCompressor: snappy
        collectionConfig:
          blockCompressor: snappy
    
    replication:
      replSetName: "ia-influencer-config-rs"
    
    sharding:
      clusterRole: configsvr
    
    security:
      authorization: enabled
      keyFile: /data/keyfile
      clusterAuthMode: keyFile
    
    systemLog:
      destination: file
      logAppend: true
      path: /data/logs/mongod-config.log
    
    processManagement:
      fork: false
      pidFilePath: /data/mongod-config.pid

  # Shard server configuration template
  mongod-shard.conf: |
    # MongoDB Shard Server Configuration
    net:
      port: 27018
      bindIp: 0.0.0.0
      maxIncomingConnections: 1000
    
    storage:
      dbPath: /data/db
      journal:
        enabled: true
      engine: wiredTiger
      wiredTiger:
        engineConfig:
          cacheSizeGB: 3
          journalCompressor: snappy
        collectionConfig:
          blockCompressor: snappy
    
    replication:
      replSetName: "ia-influencer-shard-rs"
    
    sharding:
      clusterRole: shardsvr
    
    security:
      authorization: enabled
      keyFile: /data/keyfile
      clusterAuthMode: keyFile
    
    systemLog:
      destination: file
      logAppend: true
      path: /data/logs/mongod-shard.log
    
    processManagement:
      fork: false
      pidFilePath: /data/mongod-shard.pid

  # Mongos router configuration
  mongos.conf: |
    # MongoDB Router (mongos) Configuration
    net:
      port: 27017
      bindIp: 0.0.0.0
      maxIncomingConnections: 2000
    
    sharding:
      configDB: "ia-influencer-config-rs/mongodb-config-0.mongodb-config.ia-influencer.svc.cluster.local:27019,mongodb-config-1.mongodb-config.ia-influencer.svc.cluster.local:27019,mongodb-config-2.mongodb-config.ia-influencer.svc.cluster.local:27019"
    
    security:
      keyFile: /data/keyfile
      clusterAuthMode: keyFile
    
    systemLog:
      destination: file
      logAppend: true
      path: /data/logs/mongos.log
    
    processManagement:
      fork: false
      pidFilePath: /data/mongos.pid

  # Sharding initialization script
  sharding-init.js: |
    // MongoDB Sharding Initialization for IA Influencer Platform
    
    // Connect to mongos
    db = connect("mongodb://localhost:27017/admin");
    
    // Authenticate
    db.auth("admin", "admin_password_here");
    
    // Add shards to the cluster
    var shards = [
      {
        name: "shard01",
        host: "ia-influencer-shard01-rs/mongodb-shard01-0.mongodb-shard01.ia-influencer.svc.cluster.local:27018,mongodb-shard01-1.mongodb-shard01.ia-influencer.svc.cluster.local:27018,mongodb-shard01-2.mongodb-shard01.ia-influencer.svc.cluster.local:27018"
      },
      {
        name: "shard02", 
        host: "ia-influencer-shard02-rs/mongodb-shard02-0.mongodb-shard02.ia-influencer.svc.cluster.local:27018,mongodb-shard02-1.mongodb-shard02.ia-influencer.svc.cluster.local:27018,mongodb-shard02-2.mongodb-shard02.ia-influencer.svc.cluster.local:27018"
      },
      {
        name: "shard03",
        host: "ia-influencer-shard03-rs/mongodb-shard03-0.mongodb-shard03.ia-influencer.svc.cluster.local:27018,mongodb-shard03-1.mongodb-shard03.ia-influencer.svc.cluster.local:27018,mongodb-shard03-2.mongodb-shard03.ia-influencer.svc.cluster.local:27018"
      }
    ];
    
    shards.forEach(function(shard) {
      try {
        var result = sh.addShard(shard.host);
        print("Added shard " + shard.name + ": " + JSON.stringify(result));
      } catch (e) {
        print("Error adding shard " + shard.name + ": " + e.message);
      }
    });
    
    // Enable sharding for databases
    var databases = [
      {
        name: "ia_influencer",
        collections: [
          {
            name: "users",
            shardKey: { "user_id": 1 },
            unique: false
          },
          {
            name: "media_content", 
            shardKey: { "user_id": 1, "created_at": 1 },
            unique: false
          },
          {
            name: "collaboration_projects",
            shardKey: { "created_by": 1, "created_at": 1 },
            unique: false
          },
          {
            name: "user_analytics",
            shardKey: { "user_id": 1, "date": 1 },
            unique: false
          },
          {
            name: "content_analytics",
            shardKey: { "content_id": 1, "date": 1 },
            unique: false
          },
          {
            name: "messages",
            shardKey: { "conversation_id": 1, "timestamp": 1 },
            unique: false
          },
          {
            name: "notifications",
            shardKey: { "user_id": 1, "created_at": 1 },
            unique: false
          },
          {
            name: "activity_logs",
            shardKey: { "user_id": 1, "timestamp": 1 },
            unique: false
          }
        ]
      },
      {
        name: "ia_influencer_analytics",
        collections: [
          {
            name: "events",
            shardKey: { "user_id": 1, "timestamp": 1 },
            unique: false
          },
          {
            name: "metrics",
            shardKey: { "metric_type": 1, "date": 1 },
            unique: false
          },
          {
            name: "reports",
            shardKey: { "user_id": 1, "report_date": 1 },
            unique: false
          }
        ]
      }
    ];
    
    databases.forEach(function(database) {
      try {
        // Enable sharding on database
        sh.enableSharding(database.name);
        print("Enabled sharding for database: " + database.name);
        
        // Shard collections
        database.collections.forEach(function(collection) {
          try {
            var ns = database.name + "." + collection.name;
            var shardResult = sh.shardCollection(ns, collection.shardKey, collection.unique);
            print("Sharded collection " + ns + " with key " + JSON.stringify(collection.shardKey));
          } catch (e) {
            print("Error sharding collection " + collection.name + ": " + e.message);
          }
        });
        
      } catch (e) {
        print("Error enabling sharding for database " + database.name + ": " + e.message);
      }
    });
    
    // Configure chunk size (default is 64MB, optimizing for IA Influencer workload)
    use config;
    db.settings.save({ _id: "chunksize", value: 32 }); // 32MB chunks for better distribution
    
    // Enable balancer
    sh.setBalancerState(true);
    
    // Configure balancer window (optional - to control when balancing occurs)
    sh.addBalancerWindow(new Date(new Date().getTime() + 2*60*60*1000), new Date(new Date().getTime() + 6*60*60*1000)); // 2-6 AM UTC
    
    print("Sharding configuration completed successfully");
    
    // Display cluster status
    sh.status();

  # Zone configuration for geographic distribution
  zone-config.js: |
    // Geographic Zone Configuration for Global Distribution
    
    // Define zones based on geographic regions
    var zones = [
      {
        name: "us-east",
        shards: ["shard01"],
        ranges: [
          { min: { user_id: MinKey }, max: { user_id: "user_33333333" } }
        ]
      },
      {
        name: "us-west", 
        shards: ["shard02"],
        ranges: [
          { min: { user_id: "user_33333333" }, max: { user_id: "user_66666666" } }
        ]
      },
      {
        name: "europe",
        shards: ["shard03"],
        ranges: [
          { min: { user_id: "user_66666666" }, max: { user_id: MaxKey } }
        ]
      }
    ];
    
    // Add shard tags
    zones.forEach(function(zone) {
      zone.shards.forEach(function(shard) {
        sh.addShardTag(shard, zone.name);
        print("Added tag " + zone.name + " to shard " + shard);
      });
    });
    
    // Add tag ranges for user-based collections
    var collections = [
      "ia_influencer.users",
      "ia_influencer.media_content", 
      "ia_influencer.user_analytics"
    ];
    
    collections.forEach(function(collection) {
      zones.forEach(function(zone) {
        zone.ranges.forEach(function(range) {
          sh.addTagRange(collection, range.min, range.max, zone.name);
          print("Added tag range for " + collection + " in zone " + zone.name);
        });
      });
    });
    
    print("Zone configuration completed");

---
# Config Server StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-config
  namespace: ia-influencer
  labels:
    app: mongodb
    component: config-server
spec:
  serviceName: mongodb-config
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
      component: config-server
  template:
    metadata:
      labels:
        app: mongodb
        component: config-server
    spec:
      containers:
      - name: mongodb-config
        image: mongo:7.0
        command:
        - mongod
        - --config=/etc/mongod.conf
        - --configsvr
        - --replSet=ia-influencer-config-rs
        ports:
        - containerPort: 27019
          name: mongodb-config
        volumeMounts:
        - name: mongodb-config
          mountPath: /etc/mongod.conf
          subPath: mongod-config.conf
        - name: mongodb-data
          mountPath: /data/configdb
        - name: mongodb-logs
          mountPath: /data/logs
        - name: mongodb-keyfile
          mountPath: /data/keyfile
          subPath: keyfile
          readOnly: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
      volumes:
      - name: mongodb-config
        configMap:
          name: mongodb-sharding-config
      - name: mongodb-keyfile
        secret:
          secretName: mongodb-keyfile
          defaultMode: 0400
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 20Gi
  - metadata:
      name: mongodb-logs
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 5Gi

---
# Mongos Router Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-router
  namespace: ia-influencer
  labels:
    app: mongodb
    component: router
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
      component: router
  template:
    metadata:
      labels:
        app: mongodb
        component: router
    spec:
      containers:
      - name: mongodb-router
        image: mongo:7.0
        command:
        - mongos
        - --config=/etc/mongos.conf
        ports:
        - containerPort: 27017
          name: mongodb
        volumeMounts:
        - name: mongodb-config
          mountPath: /etc/mongos.conf
          subPath: mongos.conf
        - name: mongodb-logs
          mountPath: /data/logs
        - name: mongodb-keyfile
          mountPath: /data/keyfile
          subPath: keyfile
          readOnly: true
        resources:
          requests:
            memory: "1Gi" 
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - mongo
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - mongo
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: mongodb-config
        configMap:
          name: mongodb-sharding-config
      - name: mongodb-logs
        emptyDir: {}
      - name: mongodb-keyfile
        secret:
          secretName: mongodb-keyfile
          defaultMode: 0400

---
# Services
apiVersion: v1
kind: Service
metadata:
  name: mongodb-config
  namespace: ia-influencer
  labels:
    app: mongodb
    component: config-server
spec:
  clusterIP: None
  selector:
    app: mongodb
    component: config-server
  ports:
  - port: 27019
    targetPort: 27019
    name: mongodb-config

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-router
  namespace: ia-influencer
  labels:
    app: mongodb
    component: router
spec:
  selector:
    app: mongodb
    component: router
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-router-external
  namespace: ia-influencer
  labels:
    app: mongodb
    component: router
spec:
  selector:
    app: mongodb
    component: router
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  type: LoadBalancer