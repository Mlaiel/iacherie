# Industrial-grade testing configuration for audio processing module

[tool:pytest]
# Basic Configuration
minversion = 7.0
testpaths = tests_backend/ai/audio_processing
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Advanced Test Markers for Audio Processing
markers =
    # Core Test Categories
    unit: Unit tests - Fast, isolated tests for individual components
    integration: Integration tests - Test component interactions
    performance: Performance benchmarks and timing tests
    security: Security validation and penetration tests
    regression: Regression tests for previously fixed bugs
    
    # Audio-Specific Markers
    audio_io: Audio input/output operations
    audio_processing: Core audio processing algorithms
    audio_effects: Audio effects and DSP operations
    audio_formats: Audio format conversion and validation
    audio_quality: Audio quality assessment and metrics
    
    # ML and AI Markers
    ml: Machine learning model tests
    ml_training: Model training and validation tests
    ml_inference: Model inference and prediction tests
    embeddings: Audio embedding generation and similarity
    fingerprinting: Audio fingerprinting and identification
    
    # Performance Markers
    benchmark: Performance benchmark tests
    memory: Memory usage and leak tests
    realtime: Real-time processing tests
    parallel: Parallel processing tests
    gpu: GPU acceleration tests
    
    # Integration Markers
    database: Database integration tests
    api: API endpoint tests
    external: External service integration tests
    spotify: Spotify API integration tests
    youtube: YouTube API integration tests
    
    # Special Markers
    slow: Tests that take more than 5 seconds
    very_slow: Tests that take more than 30 seconds
    network: Tests requiring network connectivity
    filesystem: Tests requiring file system operations
    
    # Copyright and Legal
    copyright: Copyright protection tests
    licensing: Software licensing validation tests

# Output and Reporting Configuration
addopts = 
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=5
    --show-capture=no
    --color=yes
    --durations=10
    --cov=ai.audio_processing
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=95
    --cov-branch

console_output_style = progress
verbosity = 1
disable_warnings = false

# Test Discovery and Collection
norecursedirs = 
    .git
    .tox
    .pytest_cache
    __pycache__
    dist
    build
    *.egg
    node_modules
    venv
    env
    .env
    backups

# Coverage Configuration
python_paths = ../../../backend
cov_config = .coveragerc
cov_show_missing = true
cov_skip_covered = false
cov_report_term_missing = true
cov_context = test

# Test Timeouts and Performance
timeout = 300
timeout_method = thread

# Parallel Testing Configuration
workers = auto
dist = loadfile

# Logging Configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File Logging
log_file = /tmp/audio_tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warning Filters
filterwarnings =
    error
    ignore::UserWarning:librosa.*
    ignore::FutureWarning:torch.*
    ignore::DeprecationWarning:sklearn.*
    ignore::RuntimeWarning:numpy.*
    ignore::PendingDeprecationWarning
    ignore::UserWarning:soundfile.*
    ignore::UserWarning:matplotlib.*
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::pytest.PytestCollectionWarning

# Test Data Configuration
tmp_path_retention_count = 3
tmp_path_retention_policy = failed

# JUnit XML Configuration
junit_family = xunit2
junit_logging = system-out
junit_log_passing_tests = true

# HTML Report Configuration
html_title = "Audio Processing Test Suite Report"

# Cache Configuration
cache_dir = /tmp/audio_tests/.pytest_cache

# Environment Variables
env = 
    AUDIO_TEST_ENV = test
    PYTHONDONTWRITEBYTECODE = 1
