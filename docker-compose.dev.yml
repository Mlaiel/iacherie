version: '3.8'

services:
  # PostgreSQL Database Cluster
  postgres-primary:
    image: postgres:15-alpine
    container_name: ainflue-postgres-primary
    environment:
      POSTGRES_DB: ainflue
      POSTGRES_USER: ainflue_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_2025}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./database/optimization.sql:/docker-entrypoint-initdb.d/001-optimization.sql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainflue_user -d ainflue"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ainflue-network

  postgres-replica:
    image: postgres:15-alpine
    container_name: ainflue-postgres-replica
    environment:
      POSTGRES_DB: ainflue
      POSTGRES_USER: ainflue_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_2025}
      PGUSER: postgres
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    depends_on:
      - postgres-primary
    networks:
      - ainflue-network

  # Redis Cluster for Distributed Caching
  redis-node-1:
    image: redis:7-alpine
    container_name: ainflue-redis-1
    ports:
      - "6379:6379"
      - "16379:16379"
    volumes:
      - redis_1_data:/data
      - ./config/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - ainflue-network

  redis-node-2:
    image: redis:7-alpine
    container_name: ainflue-redis-2
    ports:
      - "6380:6379"
      - "16380:16379"
    volumes:
      - redis_2_data:/data
      - ./config/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - ainflue-network

  redis-node-3:
    image: redis:7-alpine
    container_name: ainflue-redis-3
    ports:
      - "6381:6379"
      - "16381:16379"
    volumes:
      - redis_3_data:/data
      - ./config/redis-cluster.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - ainflue-network

  # HAProxy Load Balancer
  haproxy:
    image: haproxy:2.8-alpine
    container_name: ainflue-haproxy
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"  # Stats interface
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - api-1
      - api-2
    networks:
      - ainflue-network

  # Nginx Reverse Proxy (Alternative to HAProxy)
  nginx:
    image: nginx:1.25-alpine
    container_name: ainflue-nginx
    ports:
      - "8080:80"
      - "8443:443"
      - "8090:8090"  # Health check
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api-1
      - api-2
    networks:
      - ainflue-network

  # API Instances for Load Balancing
  api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ainflue-api-1
    environment:
      - DATABASE_URL=postgresql://ainflue_user:${POSTGRES_PASSWORD:-secure_password_2025}@postgres-primary:5432/ainflue
      - REDIS_CLUSTER_NODES=redis-node-1:6379,redis-node-2:6379,redis-node-3:6379
      - API_PORT=8001
      - INSTANCE_ID=api-1
    ports:
      - "8001:8001"
    depends_on:
      - postgres-primary
      - redis-node-1
    volumes:
      - ./logs:/app/logs
    networks:
      - ainflue-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ainflue-api-2
    environment:
      - DATABASE_URL=postgresql://ainflue_user:${POSTGRES_PASSWORD:-secure_password_2025}@postgres-primary:5432/ainflue
      - REDIS_CLUSTER_NODES=redis-node-1:6379,redis-node-2:6379,redis-node-3:6379
      - API_PORT=8002
      - INSTANCE_ID=api-2
    ports:
      - "8002:8002"
    depends_on:
      - postgres-primary
      - redis-node-1
    volumes:
      - ./logs:/app/logs
    networks:
      - ainflue-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: ainflue-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - ainflue-network

  grafana:
    image: grafana/grafana:latest
    container_name: ainflue-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - ainflue-network

  # Elasticsearch for Logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ainflue-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ainflue-network

  # Kibana for Log Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ainflue-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - ainflue-network

  # MinIO for Object Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: ainflue-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-ainflue_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-secure_minio_2025}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ainflue-network

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ainflue-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - ainflue-network

  # Testing Infrastructure
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: ainflue-test-runner
    environment:
      - DATABASE_URL=postgresql://ainflue_user:${POSTGRES_PASSWORD:-secure_password_2025}@postgres-primary:5432/ainflue_test
      - REDIS_CLUSTER_NODES=redis-node-1:6379,redis-node-2:6379,redis-node-3:6379
      - TESTING=true
    volumes:
      - ./tests:/app/tests
      - ./test_reports:/app/test_reports
    depends_on:
      - postgres-primary
      - redis-node-1
    command: ["python", "-m", "pytest", "tests/", "-v", "--html=test_reports/report.html"]
    networks:
      - ainflue-network

volumes:
  postgres_primary_data:
  postgres_replica_data:
  redis_1_data:
  redis_2_data:
  redis_3_data:
  nginx_cache:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  minio_data:

networks:
  ainflue-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16