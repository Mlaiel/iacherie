  - get
- apiGroups:
  - ''
  resourceNames:
  - monetization-config
  - payment-gateway-config
  resources:
  - configmaps
  verbs:
  - get
  - watch
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/part-of: iacherie-creator-economy
    creator-economy/role-type: content-access
  name: iacherie-content-viewer
rules:
- apiGroups:
  - ''
  resourceNames:
  - creator-api-*
  - content-processor-*
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resourceNames:
  - creator-api
  - content-api
  resources:
  - services
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resourceNames:
  - content-types-config
  resources:
  - configmaps
  verbs:
  - get

