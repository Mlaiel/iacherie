# Creator Economy RBAC Manifests
# Type: cluster_roles
# Author: Fahed Mlaiel <mlaiel@live.de>
# Generated for IA Chérie Creator Economy Platform

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/part-of: iacherie-creator-economy
    rbac.authorization.k8s.io/aggregate-to-admin: 'true'
  name: iacherie-creator-admin
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - configmaps
  - secrets
  verbs:
  - '*'
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - '*'
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - '*'
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - '*'
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  - prometheusrules
  verbs:
  - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/part-of: iacherie-creator-economy
    creator-economy/role-type: ai-processing
  name: iacherie-ai-processor
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resourceNames:
  - ai-models-config
  - processing-config
  resources:
  - configmaps
  verbs:
  - get
  - watch
- apiGroups:
  - ''
  resourceNames:
  - ai-api-keys
  - model-registry-auth
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
  - delete
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/part-of: iacherie-creator-economy
    creator-economy/role-type: monetization
  name: iacherie-monetization
