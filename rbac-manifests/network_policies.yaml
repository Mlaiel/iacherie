# Creator Economy RBAC Manifests
# Type: network_policies
# Author: Fahed Mlaiel <mlaiel@live.de>
# Generated for IA Chérie Creator Economy Platform

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: iacherie-creator-economy
  name: iacherie-deny-all
  namespace: iacherie
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: iacherie-creator-economy
  name: creator-api-network-policy
  namespace: iacherie
spec:
  egress:
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: postgresql
  - ports:
    - port: 6379
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: redis
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - port: 8000
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: creator-api
  policyTypes:
  - Ingress
  - Egress

